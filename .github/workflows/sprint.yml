# The sprint tier (Q625; its trigger re-ruled by Ed 2026-09-26, Q1546 (a)):
# the checks against a frozen golden that a day's work legitimately moves,
# the two audits, and the walks that have not caught a product bug at the
# push in four weeks. None of it gates anything — the deploy is a step of
# ci.yml's `ci` job — and a red run here is a finding about what was merged,
# not a broken workflow.
#
# **When it runs.** Until 2026-09-26 it fired on the `batch/<letter>-<date>`
# tags `pq ship` pushed, and those stopped when Ed stopped using plan-queue
# (2026-09-06): its last tag run was 2026-09-01, so for three weeks nothing
# ran it at all. The tag trigger is gone. Ed: *run it after we complete
# substantial changes / new features … doesn't make sense to run it if
# nothing is changing* — so it runs on **every push to main**, and the
# `gate` job below ends the run in seconds, green, unless the pushed range
# carries a **merge commit**, which is how a builder's feature or fix lands.
# And by hand from the Actions tab (`workflow_dispatch`), which always runs.
#
# **Part of it, by name** (Q1562 (6), Ed 2026-09-26): a dispatch takes
# `groups`, a comma- or space-separated list, so the fix for one red group
# re-runs that group and not the whole twenty minutes:
#
#   gh workflow run sprint.yml --ref <branch> -f groups=sprint-doors
#
# The names, stable, and what each runs:
#   seat-member, seat-clerk, sprint-doors, sprint-motions, sprint-pages
#                     one `walks (<name>)` leg each — ci-walks.sh's groups
#   founding-golden   the golden founding walk
#   card-audit-1600   card-audit at the desk's width
#   card-audit-390    card-audit at the phone's — and 1600 with it, its
#                     `--baseline`
#   a11y              a11y-audit
#                     these four are steps of the one `golden` job, which
#                     runs if any is named: one runner's setup, not four
# Empty — a push, or a dispatch with nothing typed — is every one of them,
# as before. What is not named is skipped, never failed; a name not in the
# list reds the `select` job before anything runs.
#
# **At most once per branch at a time** (issue #184; dev-ops CONVENTIONS.md,
# *The deploy never queues behind PR checks*): the tier's eight runners
# competed with the deploy for the account's machines. The `golden` job and
# each `walks` leg take a concurrency group keyed on the branch (and the
# leg), so a second run's part waits for the first's. On a branch other than
# main — a dispatch — the newer run cancels the older; on main nothing in
# flight is cancelled, and a run waiting behind it is displaced only by a
# newer one, whose tree holds everything the displaced one would have run.
# The groups sit on those jobs rather than on the workflow, and a run whose
# `gate` says *nothing merged* takes a group of its own: otherwise the
# coordinator's ledger commit, pushed straight after a merge, would displace
# the merge's waiting run and then decide there was nothing to run, and that
# merge would never be walked.
name: Sprint
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      groups:
        description: 'Only these (comma or space separated; empty = all): seat-member seat-clerk sprint-doors sprint-motions sprint-pages founding-golden card-audit-1600 card-audit-390 a11y'
        required: false
        default: ''

jobs:
  # **Did this push carry a merge?** `github.event.before..github.sha` is
  # what the push added; `git rev-list --merges` counts the merge commits in
  # it. Where there is no range to read — a dispatch, `before` all zeros (a
  # new branch), `before` a commit this clone has not got or not an ancestor
  # of the new head (a force push) — the tier runs, since it cannot tell,
  # and erring towards running costs minutes where erring the other way
  # costs the tier. A full history, blobs left on the server: the question
  # is about commits alone.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.merge.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: merge
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          decide() { echo "run=$1" >> "$GITHUB_OUTPUT"; echo "sprint tier: $2"; echo "**Sprint tier:** $2" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          if [ "$EVENT" != push ]; then decide true "started by hand ($EVENT) — running"; fi
          case "$BEFORE" in
            '' | 0000000000000000000000000000000000000000) decide true "no earlier head to compare against (a new branch) — running" ;;
          esac
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            decide true "the earlier head ${BEFORE:0:10} is not in this clone (a force push?) — running"
          fi
          if ! git merge-base --is-ancestor "$BEFORE" "$SHA"; then
            decide true "the earlier head ${BEFORE:0:10} is not an ancestor of ${SHA:0:10} (a force push) — running"
          fi
          merges=$(git rev-list --merges --count "$BEFORE..$SHA")
          if [ "$merges" -gt 0 ]; then
            decide true "$merges merge commit(s) in ${BEFORE:0:10}..${SHA:0:10} — running"
          fi
          decide false "no merge commit in ${BEFORE:0:10}..${SHA:0:10} — nothing merged, so nothing to run"

  # **Which parts** (Q1562 (6)): the `groups` input read into the walks'
  # matrix and the golden job's steps, both as JSON arrays the jobs below
  # read with `fromJSON`. Nothing to read — a push has no inputs — is
  # everything, so a push and an empty dispatch are the tier as it was. A
  # separate job from `gate` so that one's question stays the one it asks.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      walks: ${{ steps.pick.outputs.walks }}
      steps: ${{ steps.pick.outputs.steps }}
      golden: ${{ steps.pick.outputs.golden }}
    steps:
      - id: pick
        env:
          # not GROUPS: bash keeps the runner's group ids under that name
          ASKED: ${{ inputs.groups }}
        run: |
          WALKS="seat-member seat-clerk sprint-doors sprint-motions sprint-pages"
          STEPS="founding-golden card-audit-1600 card-audit-390 a11y"
          asked=$(echo "${ASKED:-}" | tr ',' ' ' | xargs)
          [ -z "$asked" ] && asked="$WALKS $STEPS"
          w=(); st=()
          for n in $asked; do
            case " $WALKS " in *" $n "*) w+=("$n"); continue ;; esac
            case " $STEPS " in *" $n "*) st+=("$n"); continue ;; esac
            echo "::error::unknown name '$n' — one of: $WALKS $STEPS"; exit 1
          done
          # the phone's audit is read against the desk's: naming it runs both
          case " ${st[*]} " in *" card-audit-390 "*) st+=(card-audit-1600) ;; esac
          json() { jq -nc '$ARGS.positional | unique' --args "$@"; }
          { echo "walks=$(json "${w[@]}")"; echo "steps=$(json "${st[@]}")"; echo "golden=$([ ${#st[@]} -gt 0 ] && echo true || echo false)"; } | tee -a "$GITHUB_OUTPUT"
          echo "**Sprint parts:** walks $(json "${w[@]}") · golden steps $(json "${st[@]}")" >> "$GITHUB_STEP_SUMMARY"

  golden:
    needs: [gate, select]
    if: needs.gate.outputs.run == 'true' && needs.select.outputs.golden == 'true'
    concurrency:
      group: ${{ needs.gate.outputs.run == 'true' && format('sprint-golden-{0}', github.ref) || format('sprint-idle-{0}-golden', github.run_id) }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: playwright version, for the browser cache key
        id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.v }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # the golden founding walk (spec pass 2, Q586 c; re-asked as Q625): the
      # order the founder meets, the rail at each step and the first words of
      # every clause, against design/tools/founding-walk.golden.json.
      #
      # Here rather than in ci.yml's probe job because Ed answered Q625 on
      # 2026-08-26 with *run it at the end of each sprint*: a founding change
      # is legitimate and reddens this walk until the golden is re-frozen, so
      # at every push it was red for days at a time and 52 differences stale
      # when finally run by hand. **Expect red after a founding change**, and
      # re-freeze with `npm run qa:freeze` — which takes this golden and the
      # other two references a change moves in one command.
      #
      # A red here gates nothing: the deploy already happened on the push of
      # main this run was started by.
      - run: npm run founding-golden
        if: contains(fromJSON(needs.select.outputs.steps), 'founding-golden')

      # **The two audits** (plan-ci-speed.md Stage 4): every decision card
      # opened and measured, and the surface read by the rules a keyboard and
      # a screen reader go by. Thirteen gotchas cite `card-audit` and no
      # workflow ran it. `a11y-audit` is a review — it exits 0 whatever it
      # finds, and a finding is read off the payload — so it is a sprint's
      # reading rather than a push's gate. **`card-audit` is strict here
      # since redesign stage 10** (BUILD.md: *card-audit strict on every kind
      # in the sprint tier and the fast pass*): the redesign's checks held on
      # every card its seven walks open, and a card not on the one shell red,
      # P1–P12 still the report they have always been. It runs at both widths,
      # the phone's against the desk's as `--baseline`, so a finding that
      # moves with the window is dropped as a layout fact. The payloads are
      # the job's artifact.
      - run: npm run card-audit -- --strict --kinds=GRAMMAR_KINDS --out="$RUNNER_TEMP/card-audit.json"
        if: always() && contains(fromJSON(needs.select.outputs.steps), 'card-audit-1600')
      - run: npm run card-audit -- --strict --kinds=GRAMMAR_KINDS --width=390 --height=844 --baseline="$RUNNER_TEMP/card-audit.json" --out="$RUNNER_TEMP/card-audit-narrow.json"
        if: always() && contains(fromJSON(needs.select.outputs.steps), 'card-audit-390')
      - run: npm run a11y-audit -- --out="$RUNNER_TEMP/a11y-audit.json"
        if: always() && contains(fromJSON(needs.select.outputs.steps), 'a11y')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint-audits
          path: ${{ runner.temp }}/*-audit*.json
          if-no-files-found: warn

  # **The walks that left the push** (Q1546 (b), Ed 2026-09-26): the fifteen
  # guards with no real catch at the push in four weeks, in groups that
  # `scripts/ci-walks.sh` holds beside the push's own — the same script, so
  # the same servers, the same one-verdict-per-walk and the same red at the
  # end. Groups sized from run 36235116145's verdict lines to stay near ten
  # minutes each. Every walk a single bug brings runs here from its first
  # day (Q1547).
  #
  # **The seat matrix, one hat per group** (Q1546 (d)), here since
  # `spec-check` holds the tables' half of its *no rule* verdict at the push.
  # Its exit 3 stays red here (Q1354): what only a run can see — a key a
  # step cannot learn, an audience that comes out empty (Q1356) — still
  # reddens its group until somebody reads it.
  walks:
    name: walks (${{ matrix.group }})
    needs: [gate, select]
    if: needs.gate.outputs.run == 'true' && needs.select.outputs.walks != '[]'
    concurrency:
      group: ${{ needs.gate.outputs.run == 'true' && format('sprint-walks-{0}-{1}', github.ref, matrix.group) || format('sprint-idle-{0}-walks-{1}', github.run_id, matrix.group) }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # every group, or only those `select` read out of `groups`
        group: ${{ fromJSON(needs.select.outputs.walks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: playwright version, for the browser cache key
        id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.v }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: the ${{ matrix.group }} walks
        run: bash scripts/ci-walks.sh "${{ matrix.group }}"
      # the server's side beside the walk's, as ci.yml's `walks` job keeps it
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walks-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/walk-server-*.log
            ${{ runner.temp }}/seat-matrix-*.json
          if-no-files-found: warn
