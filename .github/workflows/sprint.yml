# The sprint tier (Q625; its trigger re-ruled by Ed 2026-09-26, Q1546 (a)):
# the checks against a frozen golden that a day's work legitimately moves,
# the two audits, and the walks that have not caught a product bug at the
# push in four weeks. None of it gates anything — the deploy is a step of
# ci.yml's `ci` job — and a red run here is a finding about what was merged,
# not a broken workflow.
#
# **When it runs.** Until 2026-09-26 it fired on the `batch/<letter>-<date>`
# tags `pq ship` pushed, and those stopped when Ed stopped using plan-queue
# (2026-09-06): its last tag run was 2026-09-01, so for three weeks nothing
# ran it at all. The tag trigger is gone. Ed: *run it after we complete
# substantial changes / new features … doesn't make sense to run it if
# nothing is changing* — so it runs on **every push to main**, and the
# `gate` job below ends the run in seconds, green, unless the pushed range
# carries a **merge commit**, which is how a builder's feature or fix lands.
# And by hand from the Actions tab (`workflow_dispatch`), which always runs.
name: Sprint
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # **Did this push carry a merge?** `github.event.before..github.sha` is
  # what the push added; `git rev-list --merges` counts the merge commits in
  # it. Where there is no range to read — a dispatch, `before` all zeros (a
  # new branch), `before` a commit this clone has not got or not an ancestor
  # of the new head (a force push) — the tier runs, since it cannot tell,
  # and erring towards running costs minutes where erring the other way
  # costs the tier. A full history, blobs left on the server: the question
  # is about commits alone.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.merge.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: merge
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          decide() { echo "run=$1" >> "$GITHUB_OUTPUT"; echo "sprint tier: $2"; echo "**Sprint tier:** $2" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          if [ "$EVENT" != push ]; then decide true "started by hand ($EVENT) — running"; fi
          case "$BEFORE" in
            '' | 0000000000000000000000000000000000000000) decide true "no earlier head to compare against (a new branch) — running" ;;
          esac
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            decide true "the earlier head ${BEFORE:0:10} is not in this clone (a force push?) — running"
          fi
          if ! git merge-base --is-ancestor "$BEFORE" "$SHA"; then
            decide true "the earlier head ${BEFORE:0:10} is not an ancestor of ${SHA:0:10} (a force push) — running"
          fi
          merges=$(git rev-list --merges --count "$BEFORE..$SHA")
          if [ "$merges" -gt 0 ]; then
            decide true "$merges merge commit(s) in ${BEFORE:0:10}..${SHA:0:10} — running"
          fi
          decide false "no merge commit in ${BEFORE:0:10}..${SHA:0:10} — nothing merged, so nothing to run"

  golden:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: playwright version, for the browser cache key
        id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.v }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # the golden founding walk (spec pass 2, Q586 c; re-asked as Q625): the
      # order the founder meets, the rail at each step and the first words of
      # every clause, against design/tools/founding-walk.golden.json.
      #
      # Here rather than in ci.yml's probe job because Ed answered Q625 on
      # 2026-08-26 with *run it at the end of each sprint*: a founding change
      # is legitimate and reddens this walk until the golden is re-frozen, so
      # at every push it was red for days at a time and 52 differences stale
      # when finally run by hand. **Expect red after a founding change**, and
      # re-freeze with `npm run qa:freeze` — which takes this golden and the
      # other two references a change moves in one command.
      #
      # A red here gates nothing: the deploy already happened on the push of
      # main this run was started by.
      - run: npm run founding-golden

      # **The two audits** (plan-ci-speed.md Stage 4): every decision card
      # opened and measured, and the surface read by the rules a keyboard and
      # a screen reader go by. Thirteen gotchas cite `card-audit` and no
      # workflow ran it. Both are reviews — they exit 0 whatever they find,
      # and a finding is read off the payload, not off a red X — so they are
      # a sprint's reading rather than a push's gate. `card-audit` runs at
      # both widths, the phone's against the desk's as `--baseline`, so a
      # finding that moves with the window is dropped as a layout fact. The
      # payloads are the job's artifact.
      - run: npm run card-audit -- --out="$RUNNER_TEMP/card-audit.json"
        if: always()
      - run: npm run card-audit -- --width=390 --height=844 --baseline="$RUNNER_TEMP/card-audit.json" --out="$RUNNER_TEMP/card-audit-narrow.json"
        if: always()
      - run: npm run a11y-audit -- --out="$RUNNER_TEMP/a11y-audit.json"
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint-audits
          path: ${{ runner.temp }}/*-audit*.json
          if-no-files-found: warn

  # **The walks that left the push** (Q1546 (b), Ed 2026-09-26): the fifteen
  # guards with no real catch at the push in four weeks, in groups that
  # `scripts/ci-walks.sh` holds beside the push's own — the same script, so
  # the same servers, the same one-verdict-per-walk and the same red at the
  # end. Groups sized from run 36235116145's verdict lines to stay near ten
  # minutes each. Every walk a single bug brings runs here from its first
  # day (Q1547).
  #
  # **The seat matrix, one hat per group** (Q1546 (d)), here since
  # `spec-check` holds the tables' half of its *no rule* verdict at the push.
  # Its exit 3 stays red here (Q1354): what only a run can see — a key a
  # step cannot learn, an audience that comes out empty (Q1356) — still
  # reddens its group until somebody reads it.
  walks:
    name: walks (${{ matrix.group }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [seat-member, seat-clerk, sprint-doors, sprint-motions, sprint-pages]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: playwright version, for the browser cache key
        id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.v }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: the ${{ matrix.group }} walks
        run: bash scripts/ci-walks.sh "${{ matrix.group }}"
      # the server's side beside the walk's, as ci.yml's `walks` job keeps it
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walks-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/walk-server-*.log
            ${{ runner.temp }}/seat-matrix-*.json
          if-no-files-found: warn
