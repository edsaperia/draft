# The one gate (PRODUCTION.md stage 1): everything that lands on main has
# linted, typechecked, tested, built, booted — and, in the `walks` job at the
# foot of this file, been walked end to end against a server that job starts.
# `walks` and `probe` are the two jobs that can be red without holding the
# deploy, which is a step of `ci` and runs in parallel with both.
#
# The test suite includes the constitution browser bundle's byte-freshness
# check, so a stale
# design/constitution.js fails here too. Auto-deploy stays off at the
# platform, because the deploy hangs off the end of this workflow instead
# (decision 476): the hook and the base URL are both configured, so a push
# to main deploys docs.vote and then verifies the live host. Pushing is
# deploying — there is no second gate behind this one.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # Stage 6: the Postgres backend is tested against the same major the
    # local container pins (17), or the migration is tested only on one
    # machine. The server's whole HTTP walk runs a second time over it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: draft
          POSTGRES_PASSWORD: draft
          POSTGRES_DB: draft
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U draft"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DRAFT_TEST_DATABASE_URL: postgres://draft:draft@127.0.0.1:5433/draft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run spec-check
      # the session-clock's ladder at its boundaries (Q471), and the rule
      # that no distance on it ever says seconds. It has a runner of its own
      # because design/ has no test runner, and until entry 77 nothing ran
      # it: no npm script named it and no workflow called it, so 26 cases
      # sat in the tree being nobody's job. Node-only and instant.
      - run: npm run clock-check
      - name: the server walk again, over Postgres (stage 6)
        run: DRAFT_TEST_STORE=pg npm test -w @draft/server
      - run: npm run build
      - name: boot smoke — refuse half-configured, serve configured, no dev routes
        run: |
          # the prod artifact refuses to boot without its secrets (defect 9)
          ( node dist/server.mjs || true ) 2>&1 | grep -q 'refuses to boot'
          # configured, it serves — with headers, and without the dev outbox
          DRAFT_DATA_DIR="$RUNNER_TEMP/data" PORT=8199 \
            DRAFT_SECRET=ci-smoke DRAFT_BASE_URL=https://smoke.invalid \
            RESEND_API_KEY=ci-smoke DRAFT_TRUST_PROXY=0 node dist/server.mjs > smoke.log 2>&1 &
          SMOKE_PID=$!
          sleep 2
          curl -fsS -o /dev/null http://localhost:8199/
          curl -fsS -o /dev/null http://localhost:8199/setup.js
          curl -fsS http://localhost:8199/healthz | grep -q '"store":"file"'
          curl -fsS -D - -o /dev/null http://localhost:8199/ | grep -qi 'x-content-type-options: nosniff'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8199/api/dev/outbox)" = 404
          # stage 7: SIGTERM ends the process cleanly, not mid-append
          kill -TERM "$SMOKE_PID"
          wait "$SMOKE_PID" || true
          grep -q "closed cleanly" smoke.log

      # Deploy on green (stage 4, decision 432): auto-deploy is off at the
      # platform, so this workflow is the single gate — nothing reaches the
      # service that has not linted, typechecked, tested, built and booted.
      # Inert until the secret exists: no hook, no deploy, no failure. The
      # URL variable turns on the post-deploy verification, which is the
      # same script stage 10 runs against docs.vote.
      - name: deploy to Render, then verify the live environment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          BASE: ${{ vars.DRAFT_BASE_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "no RENDER_DEPLOY_HOOK secret — skipping deploy"; exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "deploy triggered; waiting for $GITHUB_SHA to be the build that answers"
          if [ -z "$BASE" ]; then
            echo "no DRAFT_BASE_URL variable — deployed, not verified"; exit 0
          fi
          # Wait for the *new* build, not merely for a live service: the
          # old instance keeps answering 200 for the minutes a deploy takes
          # to build, so "it is up" would verify the build we just replaced.
          # The service states its commit in x-build (see config.buildSha).
          for i in $(seq 1 100); do
            sleep 15
            live=$(curl -s -D - -o /dev/null "$BASE/" | tr -d '\r' \
              | awk 'tolower($1)=="x-build:"{print $2}')
            echo "  attempt $i: ${live:-none}"
            if [ "$live" = "$GITHUB_SHA" ]; then deployed=1; break; fi
          done
          if [ -z "$deployed" ]; then
            echo "the deployed build never became $GITHUB_SHA — refusing to"
            echo "report a verification of bytes we did not deploy"
            exit 1
          fi
          node scripts/verify-deploy.mjs "$BASE"

  # The design probes, headless (Q504(b), 2026-08-21). A probe nobody runs
  # rots silently — the setup reference had drifted 200 diffs from HEAD
  # before the merge noticed. This job serves design/ and walks both probes
  # against the frozen reference in a headless Chromium at one viewport.
  # --strict since 2026-08-21: no step is dead, so a step whose target goes
  # missing is a failure rather than a warning.
  #
  # NO LONGER ADVISORY (Ed, 2026-08-26, Q910 (b) — *let's see if what it
  # picks up is useful*). It was `continue-on-error: true` from 2026-08-21,
  # meant to last a week; what that week actually held was two real failures
  # thrown away — 136 diffs on 2026-08-25 (the reference stale after the
  # plan-queue batch) and the thirteen dead steps of Q910 on 2026-08-26 —
  # four days of a red job inside runs that read green.
  #
  # What promoting it buys is a red X on the commit and nothing more: the
  # deploy is a *step* of the `ci` job above, which runs in parallel with
  # this one, so nothing here can gate a deploy. Gating would mean lifting
  # the deploy into its own job with `needs: [ci, probe]`.
  #
  # **Expect red after an intentional page change.** Both probes compare
  # against a frozen reference, so a deliberate design change reddens this
  # job until `design/reference/` is re-frozen by `npm run qa:freeze` (or
  # `npm run probe -- --update` for these copies alone) — which plan-queue's
  # freeze offer runs after each batch's QA. That is the cost
  # of the signal, and it is now visible rather than swallowed. A scenario
  # change needs no re-freeze — only a page change does (Q914).
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: playwright version, for the browser cache key
        id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.v }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run probe -- --strict
      # the copy golden (entry 128): every card's strings on every walk, keyed
      # by walk and card key, against design/tools/card-copy.golden.json. A
      # STYLE.md pass is a snapshot and nothing pinned a card's words between
      # passes, so the next change silently undid the last audit; now a copy
      # change is red here until `npm run copy-freeze`, and that freeze's diff
      # is what the next pass reads. **Expect red after an intentional copy
      # change** — that is the point, not a defect. ~3 min of headless walking,
      # which is why it is in this job and not in `ci`, and `if: always()` for
      # the same reason as its neighbours (Q913).
      - run: npm run copy-check
        if: always()
      # which cards the setup-probe actually opens (Q914 (9), Q915). --strict
      # cannot do this job: a dead step needs a *miss*, and a card nobody
      # tries to open produces none — a grant blocks nothing in ORDER, so the
      # founding runs straight past an unacknowledged one. The hole is
      # structural, and it swallowed three cards in five days: 🖼️ (Q732, an
      # emoji face at 7px for four days with every check green), 🪪 (Q910,
      # which took thirteen steps down with it) and 🛡️ (Q914). Coverage is
      # 24 of 24 now, so a card added to ORDER without a probe step reddens
      # the build here rather than surfacing weeks later as a bug.
      - run: npm run probe-coverage
        if: always()

  # **Last green on `main`: never, as of 2026-08-29.** Red from its birth on
  # 2026-08-27 until the 🧭 shape card (entry 166) was answered by every walk
  # that births through the surface — `applicants-walk` was never taught it,
  # so all three of its steps died at *no creation mail* before reaching a
  # single applicant assertion, and every *CI's walks cover it* claimed in a
  # review since 08-27 was false (entry 203).
  #
  # **This line is kept by hand**, and it is the whole point of it: when a run
  # of this job is green on `main`, replace *never, as of …* with that run's
  # date. Nothing else here distinguishes a job that guards something from a
  # job that has never once passed, and a red X nobody reads is not coverage.
  #
  # The four walks that need a running product server (entry 142, Q917 (a),
  # Ed 2026-08-27): `journey`, `applicants-walk`, `slug-walk` and `ladder`
  # were run by hand and nowhere else. That gap is how Q916 happened —
  # `journey-walk` was dead for a day against entry 94's door rework while
  # CLAUDE.md named it as the guard for five gotchas, and nothing went red.
  #
  # **Per push, not per sprint**, and that is the difference from the copy and
  # founding goldens: a golden reddens on every intentional *change*, which is
  # why `founding-golden` is a sprint-end comparison (Q625) and is not here.
  # These four assert *behaviour* — the rail, the rows, the wire — so they go
  # red only when something is broken, which is the property a per-push guard
  # needs. A per-sprint schedule would re-create the hole, since somebody has
  # to remember to trigger it, and Q917's own text names relying on
  # remembering as the option it rejected.
  #
  # Why the dev path and not `dist/server.mjs`: the walks read magic links
  # back from `GET /api/dev/outbox` and the ladder drives the ⏭ bar, and both
  # live under the `DEV:` label the production build strips bodily — the `ci`
  # job's boot smoke asserts the outbox is 404 there. So this boots
  # `npm run server` (`tsx src/main.ts`). Q911's `assertServerBuild` is what
  # makes that safe: every one of these walks asks `/healthz` for the
  # catalogue the process booted with and exits 2 on a server that is not this
  # tree, so a walk here can only ever drive the server this job started.
  #
  # Like `probe`, this job runs in parallel with `ci` and cannot gate the
  # deploy — the deploy is a *step* of `ci`. A red here is a red X on the
  # commit and nothing more. Gating would mean lifting the deploy into its own
  # job with `needs: [ci, probe, walks]`, which is a separate decision and
  # wants the walks' flake rate measured first; per push, ungated, is that
  # measurement.
  walks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # the same four Chromium steps `probe` uses — the walks call
      # chromium.launch(). Two copies rather than a composite action, which
      # would be the tidy shape and is not worth a new file yet.
      - name: playwright version, for the browser cache key
        id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.v }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Five variables and one absence. DRAFT_DATA_DIR keeps the log out of
      # packages/server/data; DRAFT_BASE_URL must name 127.0.0.1 rather than
      # the default localhost, because the magic links the outbox hands back
      # are built from cfg.baseUrl and the walks attach at 127.0.0.1 — a link
      # on the other origin lands the page on a different origin from the one
      # the walk started at, which is the cookie trap applicants-walk's
      # DOCBASE comment describes. DRAFT_BUILD_SHA names the commit in
      # x-build; nothing reads it today, but a walk that refuses a server
      # whose x-build is not the tree's HEAD is coming, and a job that did not
      # set it would go red the day it lands. And **no RESEND_API_KEY**: its
      # absence is what selects the dev outbox and makes devMail true, and the
      # ladder bar's ⏭ exists only then.
      - name: boot a dev server for the walks, and reserve slug-walk's address
        run: |
          export PORT=8161
          export DRAFT_DATA_DIR="$RUNNER_TEMP/walk-data"
          export DRAFT_BASE_URL="http://127.0.0.1:$PORT"
          export DRAFT_BUILD_SHA="$GITHUB_SHA"
          npm run server > "$RUNNER_TEMP/walk-server.log" 2>&1 &
          echo "WALK_PID=$!" >> "$GITHUB_ENV"
          echo "WALK_BASE=$DRAFT_BASE_URL" >> "$GITHUB_ENV"
          # poll rather than sleep: a fixed wait is either slow or flaky
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "$DRAFT_BASE_URL/healthz"; then up=1; break; fi
            sleep 0.5
          done
          if [ -z "$up" ]; then
            echo "the server never answered /healthz — its log follows"
            cat "$RUNNER_TEMP/walk-server.log"
            exit 1
          fi
          # slug-walk asserts what happens when an address is *taken*, so one
          # has to be taken first — the curl its own header documents. -fsS,
          # so a refusal fails this step and names itself rather than
          # surfacing later as a walk that cannot find its collision.
          curl -fsS -o /dev/null -X POST "$DRAFT_BASE_URL/api/docs" \
            -H 'content-type: application/json' \
            -d '{"title":"Test Charter","slug":"test-charter","email":"a@b.com"}'

      # `if: always()` for the same reason as probe's neighbours (Q913): one
      # walk's failure must not hide the next one's. They share the one
      # server, which is fine because each founds its own document under its
      # own title, and each takes the base URL as an argument — the form all
      # four read first, ahead of any fallback port of their own.
      - run: npm run journey -- "$WALK_BASE"
        if: always()
      # 🧭 one founding per shape (entry 166): the same journey, the rung
      # chosen at the birth — provenance on every shaped clause at the save,
      # gone from a touched one and named on 🍾, gone from all after the press
      - run: npm run journey -- "$WALK_BASE" --shape=meeting
        if: always()
      - run: npm run journey -- "$WALK_BASE" --shape=conference
        if: always()
      - run: npm run journey -- "$WALK_BASE" --shape=ongoing
        if: always()
      - run: npm run applicants-walk -- "$WALK_BASE"
        if: always()
      # 🪪's other two prices: the walk's three assertions are one per price
      # (proposal above, then the 🏛️ assembly hold, then the founder's pen)
      - run: npm run applicants-walk -- "$WALK_BASE" --price=assembly
        if: always()
      - run: npm run applicants-walk -- "$WALK_BASE" --price=pen
        if: always()
      - run: npm run slug-walk -- "$WALK_BASE" test-charter
        if: always()
      - run: npm run ladder -- "$WALK_BASE"
        if: always()

      # The server's side of the story, beside the walk's: a red walk with
      # only the walk's stdout is the one-hour hunt Q911 describes.
      - name: stop the server
        if: always()
        run: |
          kill -TERM "$WALK_PID" || true
          pkill -f 'src/main.ts' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walk-server-log
          path: ${{ runner.temp }}/walk-server.log
          if-no-files-found: warn
