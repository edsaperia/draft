# The one gate (PRODUCTION.md stage 1): everything that lands on main has
# linted, typechecked, tested, built, and booted. The test suite includes the
# constitution browser bundle's byte-freshness check, so a stale
# design/constitution.js fails here too. Auto-deploy stays off at the
# platform, because the deploy hangs off the end of this workflow instead
# (decision 476): the hook and the base URL are both configured, so a push
# to main deploys docs.vote and then verifies the live host. Pushing is
# deploying — there is no second gate behind this one.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # Stage 6: the Postgres backend is tested against the same major the
    # local container pins (17), or the migration is tested only on one
    # machine. The server's whole HTTP walk runs a second time over it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: draft
          POSTGRES_PASSWORD: draft
          POSTGRES_DB: draft
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U draft"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DRAFT_TEST_DATABASE_URL: postgres://draft:draft@127.0.0.1:5433/draft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: the server walk again, over Postgres (stage 6)
        run: DRAFT_TEST_STORE=pg npm test -w @draft/server
      - run: npm run build
      - name: boot smoke — refuse half-configured, serve configured, no dev routes
        run: |
          # the prod artifact refuses to boot without its secrets (defect 9)
          ( node dist/server.mjs || true ) 2>&1 | grep -q 'refuses to boot'
          # configured, it serves — with headers, and without the dev outbox
          DRAFT_DATA_DIR="$RUNNER_TEMP/data" PORT=8199 \
            DRAFT_SECRET=ci-smoke DRAFT_BASE_URL=https://smoke.invalid \
            RESEND_API_KEY=ci-smoke DRAFT_TRUST_PROXY=0 node dist/server.mjs > smoke.log 2>&1 &
          SMOKE_PID=$!
          sleep 2
          curl -fsS -o /dev/null http://localhost:8199/
          curl -fsS -o /dev/null http://localhost:8199/setup.js
          curl -fsS http://localhost:8199/healthz | grep -q '"store":"file"'
          curl -fsS -D - -o /dev/null http://localhost:8199/ | grep -qi 'x-content-type-options: nosniff'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8199/api/dev/outbox)" = 404
          # stage 7: SIGTERM ends the process cleanly, not mid-append
          kill -TERM "$SMOKE_PID"
          wait "$SMOKE_PID" || true
          grep -q "closed cleanly" smoke.log

      # Deploy on green (stage 4, decision 432): auto-deploy is off at the
      # platform, so this workflow is the single gate — nothing reaches the
      # service that has not linted, typechecked, tested, built and booted.
      # Inert until the secret exists: no hook, no deploy, no failure. The
      # URL variable turns on the post-deploy verification, which is the
      # same script stage 10 runs against docs.vote.
      - name: deploy to Render, then verify the live environment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          BASE: ${{ vars.DRAFT_BASE_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "no RENDER_DEPLOY_HOOK secret — skipping deploy"; exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "deploy triggered; waiting for $GITHUB_SHA to be the build that answers"
          if [ -z "$BASE" ]; then
            echo "no DRAFT_BASE_URL variable — deployed, not verified"; exit 0
          fi
          # Wait for the *new* build, not merely for a live service: the
          # old instance keeps answering 200 for the minutes a deploy takes
          # to build, so "it is up" would verify the build we just replaced.
          # The service states its commit in x-build (see config.buildSha).
          for i in $(seq 1 100); do
            sleep 15
            live=$(curl -s -D - -o /dev/null "$BASE/" | tr -d '\r' \
              | awk 'tolower($1)=="x-build:"{print $2}')
            echo "  attempt $i: ${live:-none}"
            if [ "$live" = "$GITHUB_SHA" ]; then deployed=1; break; fi
          done
          if [ -z "$deployed" ]; then
            echo "the deployed build never became $GITHUB_SHA — refusing to"
            echo "report a verification of bytes we did not deploy"
            exit 1
          fi
          node scripts/verify-deploy.mjs "$BASE"
