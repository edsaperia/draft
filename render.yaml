# Render Blueprint (PRODUCTION.md stage 4, decision 432).
#
# One stateful web service on a persistent disk: the app replays every
# document into memory and keeps in-process state, so single-instance is
# by construction — the disk pins it there, which is the property we
# want. Auto-deploy is off: CI is the one gate, and a deploy hook gets
# called from the workflow once stage 4 wires it.
#
# The build runs `npm ci` (devDependencies included — esbuild does the
# building) and produces dist/server.mjs, the production artifact: it
# refuses to boot without the env vars below, so a half-configured
# service crashes at deploy time instead of serving magic links.
services:
  - type: web
    name: draft
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.mjs
    # stage 7: a real health route (build, store, document count) rather
    # than the front page — set on the service too, since a blueprint edit
    # does not re-sync a service created from an earlier one
    healthCheckPath: /healthz
    autoDeploy: false
    disk:
      name: draft-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: DRAFT_DATA_DIR
        value: /var/data
      - key: DRAFT_SECRET
        generateValue: true
      # set in the dashboard: the public origin (staging first, then
      # https://docs.vote at stage 10)
      - key: DRAFT_BASE_URL
        sync: false
      # set in the dashboard, from Resend (stage 9; sending domain
      # mail.docs.vote, decision 433)
      - key: RESEND_API_KEY
        sync: false
      # staging sends from Resend's sandbox sender (delivers only to the
      # Resend account's own address); stage 9 replaces it with
      # invitations@mail.docs.vote once the domain verifies
      - key: DRAFT_MAIL_FROM
        sync: false
      # Stage 6 — the cutover is two variables (PRODUCTION.md). DATABASE_URL
      # is where Postgres is (the managed database's *internal* connection
      # string, same region) and is safe to set at any time; DRAFT_STORE is
      # the cutover — absent or 'file' serves from the disk, 'pg' from the
      # database — and is set only after the importer has run and its hash
      # assertions have passed. Unsetting DRAFT_STORE is the rollback.
      - key: DATABASE_URL
        sync: false
      - key: DRAFT_STORE
        sync: false
