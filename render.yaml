# Render Blueprint (PRODUCTION.md stage 4, decision 432).
#
# One web service, stateless apart from Postgres since 498(b): the app
# replays every document into memory at boot and keeps in-process state,
# so it still runs as a single instance — but nothing lives on the
# instance any more, and a deploy no longer has to stop it first. Auto-deploy is off: CI is the one gate, and a deploy hook gets
# called from the workflow once stage 4 wires it.
#
# The build runs `npm ci` (devDependencies included — esbuild does the
# building) and produces dist/server.mjs, the production artifact: it
# refuses to boot without the env vars below, so a half-configured
# service crashes at deploy time instead of serving magic links.
services:
  - type: web
    name: draft
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    # V8 is told the container's size (the moon room, 2026-09-11): the
    # starter has 512 MB, the live heap under a 200-bot room was ~60 MB, and
    # V8 left the garbage uncollected until RSS passed 340 MB on a desktop —
    # on the instance that is the OOM kill, not a collection. 384 leaves the
    # rest for buffers and the runtime.
    startCommand: node --max-old-space-size=384 dist/server.mjs
    # stage 7: a real health route (build, store, document count) rather
    # than the front page — set on the service too, since a blueprint edit
    # does not re-sync a service created from an earlier one
    healthCheckPath: /healthz
    autoDeploy: false
    # No disk since decision 498(b), 2026-08-20: the store is Postgres
    # (DRAFT_STORE=pg), the service holds nothing between deploys, and
    # Render can start the new instance before stopping the old. The file
    # layout survives as the backup/export format (docs/runbooks/).
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: DRAFT_SECRET
        generateValue: true
      # set in the dashboard: the public origin (staging first, then
      # https://docs.vote at stage 10)
      - key: DRAFT_BASE_URL
        sync: false
      # set in the dashboard, from Resend (stage 9; sending domain
      # mail.docs.vote, decision 433)
      - key: RESEND_API_KEY
        sync: false
      # staging sends from Resend's sandbox sender (delivers only to the
      # Resend account's own address); stage 9 replaces it with
      # invitations@mail.docs.vote once the domain verifies
      - key: DRAFT_MAIL_FROM
        sync: false
      # Stage 6 — the cutover is two variables (docs/OPERATING.md §7). DATABASE_URL
      # is where Postgres is (the managed database's *internal* connection
      # string, same region) and is safe to set at any time; DRAFT_STORE is
      # the cutover — absent or 'file' serves from the disk, 'pg' from the
      # database — and is set only after the importer has run and its hash
      # assertions have passed.
      #
      # **Unsetting DRAFT_STORE is no longer a rollback** (issue #8; the
      # retraction is docs/OPERATING.md §7). It was one on 2026-08-20, while
      # the disk still held every document and was still being written to.
      # The cutover ran that night and the disk is gone, so unsetting it now
      # points the service at an empty directory — a service that has lost
      # every document rather than one that has rolled back, and it looks
      # from outside exactly like the real thing. What it is today is a
      # refusal to boot into an empty service by accident. The restore path
      # is Render's database backups and docs/runbooks/; the deploy's own
      # verification asserts `store` is still `pg`, so a service that came
      # up on the disk is red rather than quietly empty (issue #8, F5).
      - key: DATABASE_URL
        sync: false
      - key: DRAFT_STORE
        sync: false
      # Q1310 (Ed, 2026-09-10): bot rooms run on docs.vote. Mail to any
      # address at bots.docs.vote is caught by the host and filed in a bot
      # outbox, served at GET /api/bots/outbox to the bearer of this key
      # (room-bots --key). Unset, the route is a 404 like any unknown path.
      # Set in the dashboard; rotate by changing it. A leaked key acts as
      # the bots in bot rooms and nothing more (docs/OPERATING.md §10) —
      # true again since issue #10, when the pause and the surface reload
      # moved to DRAFT_ADMIN_KEY below.
      - key: DRAFT_BOT_KEY
        sync: false
      # Issue #10 (Ed, 2026-09-22, option 1): the key to POST
      # /api/admin/pause, /resume and /surface — whoever holds it can freeze
      # every room or replace the page every member runs. Here and in CI's
      # DRAFT_ADMIN_KEY secret, nowhere else: never on draft-dev, never in a
      # room-bots user's hands. Unset, the three routes are 404s, CI's pause
      # is refused and every push takes the full, unpaused lane
      # (docs/OPERATING.md §3).
      - key: DRAFT_ADMIN_KEY
        sync: false
      # Ed's key to the demo panel at /d/demo (design/DEMO.md Stage 2, Q1535):
      # Reset and the seat switch on the demo document alone. A passphrase is
      # fine; wrong guesses lock an address out. Unset, the panel is a 404.
      # A different value on each host, and never the admin key.
      - key: DRAFT_DEMO_KEY
        sync: false
      # The demo bots' Claude key (design/DEMO.md Stage 5, Q1535): its own
      # name, so no key set for anything else lets the demo spend. Best a key
      # from its own Anthropic Console workspace with a monthly limit. Unset,
      # the panel says so and ▶️ stays dark; the rest of the demo still works.
      - key: DRAFT_DEMO_ANTHROPIC_KEY
        sync: false

  # The dev host — dev.docs.vote (Ed, 2026-09-01): the *dev path* at a
  # public URL, so the phase ladder's ⏭ bar, the seat switcher and the 📬
  # outbox all exist there exactly as on localhost. No RESEND_API_KEY is
  # the whole switch (mailer.dev): nothing here changes the production
  # artifact, its DEV-drop, or verify-deploy. No build step — tsx runs the
  # sources, and design/ (bundle included) is committed. No Postgres:
  # documents live on the instance filesystem and EVERY DEPLOY OR RESTART
  # WIPES THEM, which for a ladder playground is the point. Two things to
  # know before pointing anybody at it: the outbox (magic links included)
  # is publicly readable, so anyone with the URL can log in as anyone —
  # the host must never hold anything real; and the free plan sleeps
  # after ~15 min idle, so the first load takes up to a minute.
  - type: web
    name: draft-dev
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /healthz
    # deploys on every push to main, red or green — a dev host needs no
    # gate, and CI's hook only knows the production service
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '24'
      # stable per service, so cookies survive deploys — the dev default
      # (secret.txt in the data dir) would die with the ephemeral disk
      - key: DRAFT_SECRET
        generateValue: true
      # set in the dashboard: https://dev.docs.vote once the CNAME lands.
      # The same-origin check keys on it, so the host only logs you in
      # when visited by this name (OPERATING.md §8 trap 3).
      - key: DRAFT_BASE_URL
        sync: false
      # the dev path defaults trust-proxy off; Render terminates TLS
      - key: DRAFT_TRUST_PROXY
        value: '1'
      # a bot key for this host (Q1310): a dev server files a bot's mail in
      # the public dev outbox AND the keyed bot outbox, so room-bots works
      # here with or without --key. Optional. **Never DRAFT_ADMIN_KEY** —
      # this host is public and auto-deploying (issue #10).
      - key: DRAFT_BOT_KEY
        sync: false
