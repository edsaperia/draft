  // without writing — and you did not have to be the first member you
  // invited. Only yours to flip until judging starts; after that you join
  // the way anybody joins.
  const rosterClause = () =>
    '<div class="roster clauselist">' + S.roster.map((p, i) =>
      '<div class="rperson">' + avHtml(p) +
      '<span><span class="nm">' + esc(p.n || 'Not named yet') + (p.founder ? ' <span class="chip founder">founder</span>' : '') +
      '</span><br><span class="em">' + esc(p.e || '—') + '</span></span>' +
      (p.founder
        ? '<button class="lanepick mepick" aria-pressed="' + iDraft() + '" data-metoggle="1">' +
          '<span class="dot"></span><span>' + (iDraft() ? 'Member — drafting too' : 'Clerk — not drafting') + '</span></button>'
        : '<span class="chip' + (p.in ? '' : ' pending') + '">' +
          (p.role === 'clerk' ? 'clerk' : 'member') + (p.in ? '' : ' · invited') + '</span>') +
      (p.founder ? '<span class="xdrop"> </span>' : '<button class="xdrop" data-drop="' + i + '">✕</button>') +
      '</div>').join('') + '</div>';

  // **The constitution, stated** (Ed, 2026-08-18): who convened it, when it
  // was constituted — the moment judging opens — and every constitutional
  // setting's current value, one line each, the glyph doing the naming.
  // ---- the grammar's other three states (Ed, 2026-08-18) ------------------
  // wait: the inbox holds the next move, a delegated question is being
  // answered, your own answer is in and the room's are not, a gate's
  // blockers are still above it. news: a delegated question resolved — the
  // number came back, and it pins until your OK, because a reveal you
  // answered blind into is a decision you are owed; a gate opening takes
  // the same rule, being exactly the shape of an unacknowledged decision.
  const waiting = (c) => (motionOn(c) ? answeredMotion(c)
    : c.isGate ? !c.open()
    : c.k === 'myemail' ? (S.emailSent && !S.emailVerified)
    : c.ansFor ? (answered(c) && ((card(c.ansFor).in || 0) < E()))
    : isRoom(c) && settled(c) && (c.in || 0) < E());
  const news = (c) => (motionOn(c) ? false
    : c.isGate ? (c.open() && !S.okd.has(c.k))
    : !c.ansFor && isRoom(c) && settled(c) && E() > 0 && (c.in || 0) >= E() &&
      !S.okd.has('res-' + c.k))
    // **a constitutional rule you had no say in is a decision you are
    // owed** (the live rail's rule, arriving here): a founder-set
    // constitutional setting is news to every other member until their OK
    || (!amFounder() && !c.ansFor && !c.isGate && !isRoom(c) && c.own !== 'you' &&
      c.kind === 'constitutional' && settled(c) && !S.okd.has('set-' + c.k));

  // **The constitution states itself in sentences** (Ed, 2026-08-18): each
  // decision has a what-phrase for its open states and a declarative
  // sentence once decided, all in the founder's own frame.
  const WHAT = {
    ending: 'when the drafting process will end',
    quorum: 'how many members must weigh in before a question can carry',
    bar: 'how sure the room must be at the close',
    pace: 'how the approval threshold climbs to the close',
    authorship: 'when a proposer is named',
    signing: 'who may sign a proposal',
    judgments: 'whether judgments are revealed with the record',
    chamber: 'who may read the document',
    lapse: 'whether an inactive membership lapses',
    machines: 'whether an AI makes proposals',
    rate: 'how often members may propose',
    policy: 'how people become members',
    slug: 'the document’s address',
    text: 'the text the document starts from',
  };
  const endFmt = () => new Date((endingVal() !== 'never' && endingVal()) || S.endsAt)
    .toLocaleString(undefined,
      { weekday: 'long', hour: '2-digit', minute: '2-digit', hour12: false }).replace(' ', ' at ');
  const DECIDED = {
    ending: () => (perpetual() ? 'The drafting process has no set end — it runs until it is frozen.'
      : 'The drafting process will end on ' + endFmt() + '.'),
    quorum: () => (S.quorumForm === 'count'
      ? Math.min(takenOf('quorum') || S.quorumN, E()) + ' of the ' + E() + ' members'
      : (takenOf('quorum') || S.quorumPct) + '% of the members') + ' must weigh in before a question can change the document.',
    bar: () => 'At the close, the room must be ' + (takenOf('bar') || S.tClose) + '% sure for a change to carry.',
    pace: () => { const v = takenValOf('pace');
      const shape2 = v ? v.shape : S.shape;
      const start2 = v && v.shape === 'ramp' ? v.startPct : S.tStart;
      return (perpetual() || shape2 !== 'ramp'
        ? 'The approval threshold holds at its close value throughout.'
        : 'The approval threshold rises from ' + start2 + '% to the close.'); },
    authorship: () => ({ anonymous: 'Proposers are never named — not during the session and not in the record.',
      sealed: 'Proposers are named only in the closing record.',
      public: 'Proposers are named from the start.' })[
      takenOf('authorship') || (S.authorship === 'roster' ? 'anonymous' : S.authorship)],
    signing: () => ({ nobody: 'Nobody may sign a proposal.', each: 'Each author chooses whether to sign.',
      everybody: 'Every proposal is signed.' })[
      takenOf('signing') || (S.signing === 'roster' ? 'nobody' : S.signing)],
    judgments: () => ({ never: 'Judgments are never revealed.',
      after: 'Judgments are revealed with the closing record.' })[
      takenOf('judgments') || (S.judgments === 'roster' ? 'never' : S.judgments)],
    chamber: () => ({ closed: 'Only members can see the document.',
      link: 'Anyone with the link can read the document.',
      public: 'The document is public — listed and readable by anyone.' })[
      takenOf('chamber') || (S.chamber === 'roster' ? 'closed' : S.chamber)],
    lapse: () => { const tv = takenOf('lapse');
      const v = tv !== null ? tv : (S.lapse === 'roster' ? null : S.lapse);
      return (v === 'never' ? 'Memberships do not lapse, however long inactive.'
      : 'A membership lapses after ' + (typeof v === 'number' ? v : S.lapseDays) + ' days of inactivity.'); },
    machines: () => { const tv = takenValOf('machines');
      const on = tv ? tv.enabled : (S.auditor === 'roster' ? false : S.auditor === true);
      const budget = tv && tv.enabled ? tv.budget : S.auditorBudget;
      return (on
      ? 'An AI — the coherence auditor — makes proposals, holding ' + budget + ' ✏️s. It never judges and counts toward nothing.'
      : 'There are no AI proposals.'); },
    rate: () => { const v = takenValOf('rate');
      return 'Members start with ' + (v ? v.grant : S.grant) + ' ✏️ each, up to a maximum of ' +
        (v ? v.cap : S.cap) + '. They get an additional ✏️ every ' + (v ? v.dripMinutes : S.dripMin) +
        ' minutes. Successful ✏️s are refunded.'; },
    policy: () => { const v = takenValOf('policy');
      return ({ invite: 'Membership is by invitation only.',
        proposed: 'Anyone may apply, but an application must be proposed by a member.',
        apply: 'Anyone may apply to join.',
        open: 'Anyone with the link joins on arrival.' })[v ? v.joinPolicy : S.joinBy] +
        regLine(v ? v.holder : regHolder()); },
    slug: () => 'The document lives at docs.vote/' + S.slug + '.',
    text: () => { const n = [...prose.children].filter((b) => b.textContent.trim()).length;
      return n ? 'The document starts from ' + n + ' blocks of text.'
        : 'The document starts empty — the room writes it.'; },
  };
  // 396c (Ed, 2026-08-19): *write the constitution in precise language* —
  // the settled paragraph states the holder's power-state in one
  // third-person sentence, the four alternatives standing where rules are
  // read rather than where they are set
  const holderLine = (k) => {
    if (!cs || !DKEY[k] || k === 'policy') return '';
    const st = csState(k);
    if (!st) return '';
    if (st.holder === 'members') return ' It is the members’ to change.';
    const p = st.powers;
    if (p.unilateral && p.assent) return ' The Founder holds it: the Founder may change it directly, and a change the members carry comes to the Founder as a 👑 question.';
    if (p.unilateral) return ' The Founder may change it directly, and the members may change it without the Founder’s OK.';
    return ' The Founder no longer changes it directly: a change the members carry comes to the Founder as a 👑 question.';
  };
  const decisionLine = (c) => {
    if (c.ansFor) return answered(c)
      ? 'The Founder has answered as a member.'
      : 'The Founder has not yet answered as a member.';
    if (c.k === 'canpropose') { const done = LIVE().some(owesAnswer) ? 0 : 1;
      return canPropose() && done
      ? 'Members may propose as soon as they arrive.'
      : 'Members may begin proposing when the starting text has been decided and they have answered the questions the Founder delegated — ' +
        done + ' of ' + E() + ' have answered everything.'; }
    if (c.k === 'canjudge') return canJudge()
      ? 'Judging on proposals is open.'
      : 'Members may begin judging proposals when the whole constitution has been decided.';
    if (c.k === 'myemail') return S.emailVerified ? 'The Founder’s address is verified.'
      : S.emailSent ? 'The Founder’s address is awaiting verification.'
      : 'The Founder’s address is not yet given.';
    if (c.kind === 'personal') return summary(c);
    if (isRoom(c)) {
      return (c.in || 0) >= E() && E() > 0
        ? (DECIDED[c.k] ? DECIDED[c.k]() : value(c)) + holderLine(c.k)
        : 'The Founder has delegated to members to decide ' + (WHAT[c.k] || 'this') + ' — ' +
          Math.min(c.in || 0, E()) + ' of ' + E() + ' have answered.';
    }
    return settled(c) ? (DECIDED[c.k] ? DECIDED[c.k]() : value(c)) + holderLine(c.k)
      : 'The Founder is deciding ' + (WHAT[c.k] || 'this') + '.';
  };

  const ctx = {
    get open() { return S.open; }, get E() { return E(); },
    clauseFor: (c) => (c.k === 'roster' ? rosterClause() : ''),
    // the title card's head is the document title itself — the clause,
    // opened — never the word “Title” (Ed, 2026-08-18)
    inDocOpenSlot: false,
    headFor: (c) => {
      if (c.k === 'title') return '<span class="headdoct' + (S.title ? '' : ' ph') + '">' +
        esc(S.title || 'Untitled document') + '</span>';
      const m = motionOn(c);
      // an ordinary motion's head is the value as it stands, wearing the
      // keep-lane; a constitutional one re-opens the question, title head.
      // The settled composer's head is reference only, as on decision cards.
      if (m) return routeOfM(m, c) === 'ordinary' ? esc(standsOf(c.k)) : null;
      if (composerOn(c)) return esc(standsOf(c.k));
      return null;
    },
    // reserved = held by the founder: the room may pass a change, and it
    // then goes to the founder as a 👑 question (accept or reject)
    reserved: (c) => !c.isGate && !c.ansFor && c.kind !== 'personal' && !membersHold(c),
    mustAct, summary, value, isRoom, waiting, news, tasksFor, decisionLine,
  };

  // ---- the rail ----------------------------------------------------------
  // Grouped by pile and in pile order, so the two columns agree and nothing
  // jumps when you confirm something (Q320). Your own pile first: on this
  // screen that is the founder's, on the ceremony it is the members'.
  function renderRail() {
    if (S.viewer === 'applicant') {
      rail.innerHTML = '<ul>' + APPCARDS().map((c) => railEntry(c, appCtx)).join('') + '</ul>';
      document.getElementById('stat-stage').textContent = 'reading only · applications open';
      document.getElementById('stat-who').textContent = arrived() + ' in the room';
      return;
    }
    const gs = groups();
    rail.innerHTML =
      // What is settled leaves the rail — it is the pile's, and the block's
      // to name — and a gate shows only as news: the moment it opens, until
      // its OK. Locked, it is a ⏳ tab in the pile and nothing else, because
      // nothing is being asked of you (Ed, 2026-08-18: *everyone should only
      // see cards they can act on*). ⏳ entries stay: they are where the
      // fill says how far the room has got.
      '<ul>' + secLive().map((s2) => ({ ...s2, cards: s2.cards
        .flatMap((c) => [c].concat(tasksFor(c)))
        .filter((c) => (c.isGate ? stateOf(c, ctx) === 'news' : stateOf(c, ctx) !== 'done')) }))
        .filter((s2) => s2.cards.length).map((s2) =>
        s2.cards.map((c) => railEntry(c, ctx)).join('')).join('') + '</ul>';

    document.getElementById('stat-stage').textContent =
      canJudge() ? 'open' : canPropose() ? 'proposals open' : 'reading only';
    document.getElementById('stat-who').textContent = arrived() + ' in the room';
    document.getElementById('mebtn').innerHTML = avHtml(me(), 'face');
  }
  // the dev dropdown of actual users (Ed, 362) — rebuilt only when it
  // changes, so an open dropdown is not snapped shut under the pointer
  function renderDev() {
    const sel = document.getElementById('devwho');
    const opts = S.roster.map((r, i) => '<option value="' + i + '"' + (S.viewer === i ? ' selected' : '') + '>' +
      esc(r.n || (r.founder ? 'Unnamed founder' : 'Invited · ' + (r.e || '?'))) +
      (r.founder ? ' 🎩' : r.in ? '' : ' (invited)') + '</option>').join('') +
      '<option value="applicant"' + (S.viewer === 'applicant' ? ' selected' : '') + '>— an applicant</option>';
    if (sel.innerHTML !== opts) sel.innerHTML = opts;
  }

  function renderTitle() {
    const d = document.getElementById('doctitle');
    for (const el of [titleEl, d]) {
      el.textContent = S.title || 'Untitled document';
      el.classList.toggle('ph', !S.title);
    }
    // the open card IS the title, so the heading does not also stand
    // above it (the decision-card gesture: the clause, opened); closed,
    // the tab beside it is the door, and the heading is just a heading
    d.style.display = S.open === 'title' ? 'none' : '';
    document.getElementById('titlechip').innerHTML =
      S.open === 'title' ? '' : pileHtml([card('title')], ctx);
    prose.classList.toggle('pasteready', visible(card('text')));
  }

  // ---- the bodies a founder fills in ------------------------------------
  // **Constitutional settings default to the room; ordinary ones default to
  // you** (Ed, 2026-08-18, agreeing the proposal rate back to the founder). One rule
  // where there had been a rule and three exceptions, and the ordinary /
  // constitutional cut is what explains it: an ordinary setting can be taken
  // back by the room at any time with a motion at the bar, so defaulting it to
  // the founder costs them nothing. A constitutional one cannot — changing it
  // needs everybody — so it has to be theirs from the start or it is not
  // really theirs at all.
  // §9.7 v0.52 (Ed, 2026-08-19): the verb is **delegate**, and it is never
  // a button — "The [setting] is delegated to the members" is a
  // constitutional sentence among the setting's own options; the founder
  // prefers it and ✒️. Post-start the same radio is a hand-over: the rule
  // stands as it is, only the holder changes. One-way — the road back is a
  // constitutional motion.
  const POSTLABEL = {
    ending: 'The ending is delegated to the members',
    barBy: 'The approval threshold is delegated to the members',
    quorumBy: 'Quorum is delegated to the members',
    authorship: 'Proposer naming is delegated to the members',
    signing: 'Signing is delegated to the members',
    judgments: 'Judgment reveal is delegated to the members',
    rateBy: 'The proposal rate is delegated to the members',
    chamber: 'Visibility is delegated to the members',
    lapse: 'Membership lapse is delegated to the members',
    auditor: 'AI proposals are delegated to the members',
    titleBy: 'The title is delegated to the members',
    slugBy: 'The link is delegated to the members',
    policyBy: 'Applications are delegated to the members',
  };
  const POSTNOTE = 'The rule stands as it is; from here changing it is the members’ — you propose like anybody, and nothing comes to you for assent. One way: taking it back would take everyone.';
  const theyDecide = (key, note) => (cs && cs.constitutedAtT !== null)
    ? opt(S, key, 'roster', POSTLABEL[key], POSTNOTE)
    : opt(S, key, 'roster', 'The members decide',
        'Asked of everyone before drafting begins, blind — you among them, if you are on the roster. ' + note);

  // 396c (Ed, 2026-08-19): *make it easy for the founder to decide* — the
  // "and afterwards" pair under a kept value picks between the two crown
  // powers' states, and the third state (assent without unilateral) is
  // offered only once the document is live, because it is unreachable
  // before then (§9.7 v0.54). Post-start the moves are one-way.
  const pw = (k, val, ttl, exp) => opt({ ['pw:' + k]: pwOf(k) }, 'pw:' + k, val, ttl, exp);
  function powerTail(k) {
    if (!cs || !DKEY[k] || k === 'policy') return '';
    if ((k === 'title' || k === 'slug') && !cs.textConfirmed) return '';
    if (wantsDelegate(k) || csDelegated(k)) return '';
    const live = cs.constitutedAtT !== null;
    const cur = pwCur(k);
    if (live && cur === 'unilateral') {
      return '<p class="setnote">You gave up the need for your OK: members may change this without you, and you may still change it directly. One way — taking it back would take everyone.</p>';
    }
    if (live && cur === 'assent') {
      return '<p class="setnote">You no longer change this directly: members carry changes, and each comes to you as a 👑 question.</p>';
    }
    return '<div class="eyebrow fieldlab" style="margin-top:var(--s4)">And afterwards</div>' +
      '<div class="choice" role="radiogroup" aria-label="And afterwards">' +
      pw(k, 'both', 'Changes the members carry need your OK',
        'You may also change it directly. A change the members pass comes to you as a 👑 question — yours to accept or reject.') +
      pw(k, 'unilateral', 'Members may change it without you',
        'You keep changing it directly; a change the members carry applies by itself.' + (live ? ' One way — taking it back would take everyone.' : '')) +
      (live ? pw(k, 'assent', 'Stop changing it directly',
        'From here the members carry changes, and each comes to you as a 👑 question. One way — the road back is theirs to give.') : '') +
      '</div>';
  }
  // the register's pair (Ed's own example, §9.7½): rides the applications
  // value rather than the setting's powers, same gesture either way
  function registerTail() {
    const live = cs && cs.constitutedAtT !== null;
    const cur = pwCur('policy');
    if (live && cur === 'unilateral') {
      return '<p class="setnote">You gave up the need for your OK on applications: members decide them without you, and you still invite directly.</p>';
    }
    if (live && cur === 'assent') {
      return '<p class="setnote">You no longer invite directly: members carry applications, and each comes to you as a 👑 question.</p>';
    }
    return '<div class="eyebrow fieldlab" style="margin-top:var(--s4)">And afterwards</div>' +
      '<div class="choice" role="radiogroup" aria-label="And afterwards">' +
      pw('policy', 'both', 'Applications the members carry need your OK',
        'And you invite and remove directly. A carried application comes to you as a 👑 question — yours to accept or reject.') +
      pw('policy', 'unilateral', 'Members decide applications without you',
        'You keep inviting directly; an application the members carry needs nobody’s OK.') +
      (live ? pw('policy', 'assent', 'Stop inviting directly',
        'From here the members carry applications, and each comes to you as a 👑 question. One way — the road back is theirs to give.') : '') +
      '</div>';
  }
  // the title and link never take a founding question (no most-protective
  // title for maxima to find), so their choice appears with proposing
  const holdChoice = (k) => (!cs || !cs.textConfirmed ? '' :
    '<div class="eyebrow fieldlab" style="margin-top:var(--s5)">Who holds it</div>' +
    '<div class="choice" role="radiogroup" aria-label="Who holds it">' +
    opt(S, k + 'By', 'founder', 'Reserved — yours',
      'Yours to change directly; a member’s proposal that carries comes to you as a 👑 question.') +
    opt(S, k + 'By', 'roster', POSTLABEL[k + 'By'], POSTNOTE) +
    '</div>');
  const BODY = {
    text: () =>
      '<div class="unlocks">Confirming this lets everyone start <b>proposing</b>. They will not be able to judge until the constitution is settled.</div>' +
      '<p class="why">Type or paste it into the page below — the same column it will be edited in once drafting begins. Lines starting with #, ## or ### become sections, and the contents appear on the left as you go.</p>' +
      '<p class="setnote"><b>Or leave it blank.</b> A membership writing something from nothing is a perfectly good way to begin, and an empty page is a real answer to this question. What this card asks is not whether there is text, but whether you have decided.</p>',
    title: () =>
      '<div class="lanebox"><div class="lp editlane titlelane' + (S.title ? '' : ' blank') + '"' +
      ' contenteditable="plaintext-only" spellcheck="false" data-titlelane="1"' +
      ' data-ph="Name this document">' + esc(S.title) + '</div></div>' +
      holdChoice('title'),
    slug: () =>
      '<div class="unlocks">Confirming this <b>saves the document</b> — until the link exists, nothing does, anywhere. Invitations wait on it, because an invitation <i>is</i> this link.</div>' +
      (S.slugTaken ? '<p class="setnote">Suggested from the title — <b>docs.vote/' + esc(S.slugTaken) + '</b> already exists, so a short suffix was added. Change it to anything free.</p>'
        : '<p class="setnote">Suggested from the title. Change it to anything free.</p>') +
      '<p class="why">What people paste to each other.</p>' +
      '<span class="fld"><label>The link</label><span class="setrow2">' +
      '<span class="setnote" style="margin:0">docs.vote/</span>' +
      '<input data-slug="1" value="' + esc(S.slug) + '" spellcheck="false" style="width:16rem">' +
      '<button class="btn" data-act="copy">Copy</button></span></span>' +
      '<p class="setnote">' + (SLUG_OK.test(S.slug)
        ? 'Lower case, digits and hyphens. <b>docs.vote/' + esc(S.slug) + '</b> is free.'
        : 'Lower case, digits and hyphens, three characters or more.') + '</p>' +
      // **Changing it sets up a redirect** (Ed, 2026-08-18). The link is
      // changeable and it is also the thing that has already been sent to
      // fourteen people — so a change that broke the old one would make this
      // the one ordinary setting with a cost for using it as intended.
      '<p class="setnote">Every link this document has ever had keeps working: changing it leaves a redirect behind, so an invitation somebody was sent weeks ago still opens the right document.</p>' +
      holdChoice('slug'),
    myemail: () => (S.emailVerified
      ? '<div class="lockline">' + TICK + '<span>Verified — <b>' + esc(S.myemail) + '</b> can get back in.</span></div>' +
        '<span class="fld"><label>Change it</label><input type="email" data-txt="myemail" value="' + esc(S.myemail) + '" style="width:20rem"></span>' +
        '<p class="setnote">Changing it starts verification again — the new address has to prove it works too.</p>'
      : S.emailSent
      ? '<p class="why">Sent to <b>' + esc(S.myemail) + '</b>. Nothing is saved yet, so a typo here still costs nothing — which is exactly why this happens now and not after.</p>' +
        '<div style="margin-top:var(--s3)"><button class="btn" data-act="openmail">Open your inbox</button> ' +
        '<button class="btn" data-act="editemail">Wrong address?</button></div>' +
        '<p class="setnote">In the mockup the inbox is a pretend one — the mail in it is the magic link, and clicking it proves the address works and carries you on to the save.</p>'
      : '<p class="why">Before anything is saved, this address has to prove it works — because there are no passwords, and it is the only way back in. A document saved under an address with a typo in it would be lost the moment this tab closes.</p>' +
        '<span class="fld"><label>Your email</label><input type="email" data-txt="myemail" value="' + esc(S.myemail) + '" placeholder="you@example.com" style="width:20rem"></span>' +
        '<div style="margin-top:var(--s3)"><button class="btn"' + (EMAIL_OK.test(S.myemail) ? '' : ' disabled') + ' data-act="sendverify">Send the link</button></div>' +
        '<p class="setnote">Yours alone — it appears nowhere in the document, and it is not your name: who you are in the room is the ✋ card, later.</p>'),
    myname: () => nameBody(me(), { optional: !iDraft() }),
    mypic: () => pictureBody(me()),
    // **Whether the founder is in it is its own question** (Ed, 2026-08-18).
    // It had been the top half of the roster card, which made a decision about
    // one person a preamble to a list of everybody — and the founder is a hat
    // worn over a role rather than a role itself (SPEC §9.0a), so the hat and
    // the roster are two things.
    roster: () =>
      '<p class="why">An invitation <b>is the link</b>, sent by email — there are no passwords — which is why nobody could be invited before the link existed. It is an invitation <b>to become a member</b>: until somebody opens the document they are listed as <i>invited</i> and count toward nothing. Until judging opens you may invite and uninvite freely — nothing has been decided yet, so nothing is being changed. After that, both directions are constitutional motions — you included: your own row above is <b>pre-checked</b>, and you may untick it and be the clerk, who administers without writing, but after judging starts you join the way anybody joins. A joiner starts with the ✏️s everyone got, plus what the drip has added since, and quorum recomputes.</p>' +
      '<div class="roster"><div class="addrow"><input type="email" placeholder="name@example.com" data-add="1">' +
      '<button class="btn" data-act="add">Invite</button></div></div>' +
      '<div class="eyebrow fieldlab" style="margin-top:var(--s5)">Several at once</div>' +
      '<textarea placeholder="Paste addresses here, one per line" data-emails="1"></textarea>' +
      '<div style="margin-top:var(--s2)"><button class="btn" data-act="invite">Send invitations</button></div>' +
      '<p class="setnote">' + arrived() + ' of ' + S.roster.length + ' have opened it so far. ' +
      'Nobody has to be here for the document to exist — the link works from the first second, and ' +
      'a joiner gets the base grant plus the drip accrued so far.</p>',
    // **The door, apart from the register** (Ed, 2026-08-18). The policy is
    // the constitutional act; each application that arrives through it is
    // its ordinary consequence.
    policy: () =>
      '<p class="why">How people become members <b>after the start</b>. The register is who is in; this is the door.</p>' +
      // **Who holds it** (Ed, 2026-08-18): delegated — the members' — by
      // default, like every constitutional setting. A founder may **reserve**
      // it instead (reserved is the word for not-delegated, Ed), and a
      // document with a reserved membership is a 👑: the founder keeps
      // unilateral invite-and-remove past the start. What keeps a crown from
      // being immortal is the lapse rule: it applies to the crown as to any
      // member, and a lapsed crown passes to the members.
      '<div class="eyebrow fieldlab" style="margin-top:var(--s5)">Who holds it</div>' +
      '<div class="choice" role="radiogroup" aria-label="Who holds the membership">' +
      opt(S, 'rosterBy', 'roster', 'The members', 'After the start, joining and leaving are the members’ to decide — invitations by everyone’s consent, applications at the bar.') +
      opt(S, 'rosterBy', 'founder', 'Reserved — I hold it', 'Reserving anything makes you a 👑 — this one keeps invite-and-remove for the document’s life. A crown lapses like a member: go inactive past the lapse rule and changes pass without your assent until you log back in.') +
      '</div>' +
      (S.rosterBy === 'founder' ? registerTail() : '') +
      // **Who may join** (Ed, 2026-08-18, with the Applicants subsection):
      // the gate the Apply card hangs off. An application becomes an
      // ordinary proposal to grant membership, judged like any other.
      '<div class="eyebrow fieldlab" style="margin-top:var(--s5)">Who may join</div>' +
      '<div class="choice" role="radiogroup" aria-label="Who may join">' +
      opt(S, 'joinBy', 'invite', 'Invitation only', 'Nobody joins unless a member brings them in.') +
      opt(S, 'joinBy', 'proposed', 'Applications must be proposed', 'A reader may apply, but the application waits until a member <b>proposes</b> it — the member stakes the ✏️ as with any proposal, which is what a second is.') +
      opt(S, 'joinBy', 'apply', 'Anyone may apply', 'An application goes straight before the members as a proposal (✏️) — free to make, because the tasks are its price and the bar is its filter.') +
      opt(S, 'joinBy', 'open', 'Open', 'Anyone with the link joins on arrival. For documents that are more petition than charter.') +
      '</div>' +
      // §9.7 v0.52: past the start the founder may hand the whole card over —
      // both holds at once, the register's crown living in this value (§9.7½)
      (cs && cs.constitutedAtT !== null && csState('policy') &&
        (csState('policy').holder === 'convenor' || cs.membershipReserved())
        ? '<div class="eyebrow fieldlab" style="margin-top:var(--s5)">Or hand it over</div>' +
          '<div class="choice" role="radiogroup" aria-label="Hand applications to the members">' +
          opt(S, 'policyBy', 'roster', POSTLABEL.policyBy,
            'Both halves at once — who holds the membership and who may join become the members’. ' + POSTNOTE) +
          '</div>'
        : ''),
    ending: () =>
      '<p class="why">The moment this document closes: the close itself, the record, and the top of the approval threshold’s ramp. <b>Never</b> is one of the answers — a perpetual document has no close of its own and a bar that cannot rise, because a ramp needs an endpoint to rise towards, and it ends by <b>freeze</b>, when too few members are still active, rather than by the calendar.</p>' +
      '<div class="choice" role="radiogroup">' +
      opt(S, 'ending', 'ends', 'At a set time', '',
        '<span class="fld"><label>Ends</label><input type="datetime-local" data-txt="endsAt" value="' + S.endsAt + '"></span>') +
      opt(S, 'ending', 'perpetual', 'Never', 'It runs until it is frozen. The ✏️s come back against real time instead of against a window.') +
      theyDecide('ending', 'That means the <b>latest</b> answer anybody gives, and <b>never</b> is the latest of all — so one member who wants it to run on keeps it running.') +
      '</div>',
    bar: () =>
      '<div class="unlocks">Part of the constitution — judging waits on this and the rest of it.</div>' +
      '<p class="why">How sure the room has to be that a change beats the current text before it is <b>permanent</b> — the bar at the close. Never a vote share, a confidence. Everything before the close can still be challenged, so this one number covers the whole way there; how the bar climbs is pacing, on the next card.</p>' +
      '<div class="choice" role="radiogroup">' +
      opt(S, 'barBy', 'founder', 'I set it', '',
        '<span class="setrow2">' + num(S, 'tClose', 'At the close', 50, 99, '%') + '</span>') +
      theyDecide('barBy', 'Each states the <b>lowest bar</b> they will accept — at the close — and the document takes the highest.') +
      '</div>',
    pace: () =>
      '<p class="why">How the bar gets to the close: held there for the whole window, or rising from a lower start so early adoptions come cheap while they are still challengeable. Pacing, not consent — every adoption is recorded against the bar as it stood, so re-shaping the ramp re-rates nothing already decided, which is why this card is open to proposals (✏️) while the close is constitutional (🏛️).</p>' +
      '<div class="choice" role="radiogroup">' +
      opt(S, 'shape', 'ramp', 'Rising', 'From a lower start when judging opens, up to the close bar.',
        '<span class="setrow2">' + num(S, 'tStart', 'When judging opens', 50, 99, '%') + '</span>', perpetual()) +
      opt(S, 'shape', 'fixed', 'Fixed', 'The close bar for the life of the document.') +
      '</div>' + (perpetual() ? '<p class="setnote">A rising bar needs an endpoint to rise towards, so a perpetual document holds its bar fixed.</p>' : ''),
    quorum: () =>
      '<div class="unlocks">Part of the constitution — judging waits on it.</div>' +
      '<p class="why">How many distinct members must weigh in before a question can be adopted. A question short of quorum simply waits — silence is never counted as a vote.</p>' +
      // **The form is the wording, the number is the decision** (§9.0a): count
      // or share is how the question tracks a changing membership, and it is
      // the founder's even when the number is the room's.
      '<div class="eyebrow fieldlab">Asked as</div>' +
      '<div class="choice" role="radiogroup" aria-label="Form">' +
      opt(S, 'quorumForm', 'share', 'A share of the membership', 'Suits a document with a window: the number tracks the membership as it changes.') +
      opt(S, 'quorumForm', 'count', 'A fixed number', 'Suits a perpetual document, where a drifting membership would otherwise silently re-rate every parked race.') +
      '</div>' +
      '<div class="eyebrow fieldlab" style="margin-top:var(--s4)">The number</div>' +
      '<div class="choice" role="radiogroup" aria-label="Number">' +
      opt(S, 'quorumBy', 'founder', 'I set it', '',
        '<span class="setrow2">' + (S.quorumForm === 'share'
          ? num(S, 'quorumPct', 'Share', 1, 100, '% — ' + quorumCount() + ' of ' + E() + ' today')
          : num(S, 'quorumN', 'Members', 1, 40, 'of ' + E())) + '</span>') +
      theyDecide('quorumBy', 'Each states the <b>lowest quorum</b> they will accept — in the form above — and the document takes the highest.') +
      '</div>',
    authorship: () =>
      '<div class="unlocks">Part of the constitution — judging waits on it, because a judgment is recorded under whatever this says.</div>' +
      '<p class="why">Rationales are visible whatever is chosen. What varies is only whether a name is attached to one.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('authorship', 'A privacy question, so it takes the <b>most private</b> answer — which is what makes anonymity structural rather than merely the default.') +
      opt(S, 'authorship', 'anonymous', 'Anonymous', 'Never revealed, not even in the record.') +
      opt(S, 'authorship', 'sealed', 'Sealed', 'Hidden while live; revealed at the close.') +
      opt(S, 'authorship', 'public', 'Public', 'Visible from the moment a proposal is made.') +
      '</div><p class="setnote">Setting it yourself has a cost worth naming: anonymity becomes a default like any other, and members can be named without having agreed to it.</p>',
    signing: () =>
      '<div class="unlocks">Part of the constitution.</div>' +
      '<p class="why">Whether an author may put their name to a proposal that is otherwise unattributed.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('signing', 'The <b>most private</b> answer wins.') +
      opt(S, 'signing', 'nobody', 'Nobody signs', 'The only setting under which an unsigned proposal says nothing about its author.') +
      opt(S, 'signing', 'each', 'Each author chooses', 'In a roster this small, an unsigned candidate among signed ones says something.') +
      opt(S, 'signing', 'everybody', 'Everybody signs', 'Uniform in the other direction.') +
      '</div>',
    judgments: () =>
      '<div class="unlocks">Part of the constitution.</div>' +
      '<p class="why">Whether what somebody preferred is ever attached to their name. Never while a question is live, whichever is chosen — blind judgment while preferences are being collected is what makes the measurement mean anything.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('judgments', 'The <b>most private</b> answer wins.') +
      opt(S, 'judgments', 'never', 'Never revealed', 'What you preferred stays yours, permanently.') +
      opt(S, 'judgments', 'after', 'Revealed once the decision is made', 'Published with the record, never before it.') +
      '</div>',
    rate: () =>
      '<p class="why">How often anybody may put something to the room. Proposing costs one ✏️; a successful ✏️ is refunded, and withdrawing returns it in full.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('rateBy', 'Each states the <b>most generous</b> rate they would accept, and the document takes it. Until it settles, everyone drafts on the standard rate.') +
      opt(S, 'rateBy', 'founder', 'I set it', '',
        '<span class="setrow2">' + num(S, 'grant', '✏️ to start with', 0, 40) +
        num(S, 'cap', 'up to a maximum of', 1, 99) +
        num(S, 'dripMin', 'an additional ✏️ every N minutes', 5, 2880) + '</span>') +
      '</div>',
    chamber: () =>
      '<p class="why">Who may read it besides the members. Whoever that is, they are <b>not members</b>: nothing is known about them, and they cannot propose, judge or be counted. Live standings are never visible to anybody, whatever is chosen here.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('chamber', 'A privacy question, so the <b>most private</b> answer wins: one member who wants the room closed closes it.') +
      opt(S, 'chamber', 'link', 'Anyone with the link') +
      opt(S, 'chamber', 'closed', 'Members only') +
      opt(S, 'chamber', 'public', 'Public', 'Listed and readable by anyone.') + '</div>',
    lapse: () =>
      '<div class="unlocks">Part of the constitution — judging waits on it.</div>' +
      '<p class="why">Whether a membership lapses after a period of inactivity. A lapsed member leaves the quorum base like an abstainer, their judgments keep counting, they are warned by email first and sent the document and record when it happens — and coming back is just logging in.</p>' +
      '<div class="choice" role="radiogroup">' +
      opt(S, 'lapse', 'days', 'They lapse', 'After a period of inactivity you choose.',
        '<span class="setrow2">' + num(S, 'lapseDays', 'Days of inactivity', 7, 365) + '</span>') +
      opt(S, 'lapse', 'never', 'Never', 'A membership holds however long its holder is away.') +
      theyDecide('lapse', 'Each states the <b>shortest period of inactivity</b> they would accept being lapsed after, and the document takes the longest — <b>never</b> being the longest of all.') +
      '</div>',
    machines: () =>
      '<p class="why">An AI that proposes and nothing else — it never judges, and counts toward no quorum. Its proposals compete on the same terms as anybody’s.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('auditor', 'The <b>most restrictive</b> answer wins, so a single member who would rather not have AI proposals keeps them out.') +
      opt(S, 'auditor', true, 'Include the coherence auditor', 'Patrols the document for drift — a definition changed in one place and not another — and proposes fixes.',
        '<span class="setrow2">' + num(S, 'auditorBudget', 'Its edit budget', 0, 40) + '</span>') +
      opt(S, 'auditor', false, 'No AI proposals') + '</div>',
  };


  // ---- the applicant's seat (ported from founding-ceremony, Ed 361) -------
  // Plain tasks: the same rail entries and the same card shell, asking for
  // the only things an application is. The email is the identity (verified
  // by magic link before anything can be submitted), member emails are
  // unique, and an empty application is a real application.
  const APPLICANT = { get judged() {
    if (!cs || !S.app.csId) return 2; // fixture until the module holds it
    const a = cs.applicantRecords().get(S.app.csId);
    const rec = a && a.motion ? cs.motionRecords().get(a.motion) : null;
    if (!rec) return 0;
    if (rec.status === 'carried') return E();
    return S.roster.filter((r) => r.mAnsOk && r.mAnsOk.has('roster')).length;
  } };
  const MEMBER_EMAILS = { has: (e2) => S.roster.some((r) => (r.e || '').toLowerCase() === e2) };
  const APPCARDS = () => {
    const a = S.app;
    const base = [{ k: 'apply', g: '🪪', t: 'Apply for Membership', own: 'you',
      kind: 'personal', done: () => a.submitted }];
    if (!a.started) return base;
    return base.concat([
      { k: 'appmail', g: '📧', t: 'Your Email', own: 'you', kind: 'personal', done: () => a.emailVerified },
      { k: 'appname', g: '✋', t: 'Your Name', own: 'you', kind: 'personal', done: () => !!a.name.trim() },
      { k: 'apppic', g: '🖼️', t: 'Your Picture', own: 'you', kind: 'personal', done: () => !!a.pic },
      { k: 'apptext', g: '📝', t: 'Your Application', own: 'you', kind: 'personal', optional: true, done: () => !!a.text.trim() },
    ]);
  };
  const appCtx = {
    get open() { return S.open; }, get E() { return E(); },
    mustAct: (c) => !c.done() && !(c.optional && S.app.submitted),
    yours: (c) => c.k === 'apply' && S.app.submitted,
    waiting: (c) => c.k === 'appmail' && S.app.emailSent && !S.app.emailVerified,
    fillOf: (c) => (c.k === 'apply' && S.app.submitted
      ? Math.round(APPLICANT.judged / E() * 100) + '%' : '100%'),
    summary: (c) => (c.k === 'apply'

  const APPBODY = {

      ' spellcheck="false" data-apptext="1" data-ph="To the members…">' + esc(S.app.text) + '</div></div>',
  };
  function applicantCardHtml() {
    const c = APPCARDS().find((x) => x.k === S.open);

  // ---- the band: two piles, and the card one of them opens into ----------
  function renderBand() {
    if (S.viewer === 'applicant') {
      const tp0 = document.getElementById('titlepara');

        ? '<div class="setrow constsec"><div class="csec"><div class="cpara open">' + applicantCardHtml() + '</div></div></div>' : '') +

      return;
    }
    const cardFor = (g) => {
      const c = card(S.open);
      // A card the room owns keeps its own body — choosing to hand it over is
      // the founder's decision and stays editable — and grows a **watching**
      // half underneath, which is the whole of what anybody may see of a blind
      // question while it runs.
      if (c.isGate) {
        return cardHtml(c, ctx, gateBody(c),

      }
      // a live motion takes the route its own value asks for (329a)
      if (m && routeOfM(m, c) === 'ordinary') {

        return cardHtml(c, ctx, motionBody(c, ctx, mLive),
          (m.by === viewerId()
            ? '<button class="btn" data-withdrawmotion="' + c.k + '" title="Withdrawing returns the ✏️ in full">🗑️ Withdraw</button>'

          ' data-confirm="1">' + TICK + '</button>',
          g.cards, { v: 'stands', s: { ...m, pick: S.mAns[c.k] } });
      }
      if (m) {
        // constitutional: the founding question, live again. Yours carries
        // the withdraw at the very left, where 🗑️ always is — it hands the
        // 🏛️ back whole, which is what makes the one-each limit livable.
        return cardHtml(c, ctx,
          motionReopen(c, ctx, { ...m, judged: motionJudged(c.k) }) + consentBody(c, m),
          (m.by === viewerId()
            ? '<button class="btn" data-withdrawmotion="' + c.k + '" title="Withdrawing hands your 🏛️ back">🗑️ Withdraw</button>'
            : '<button class="btn" data-close="1">Close</button>') +
          '<button class="btn btn-approve glyphbtn"' + (motionPicked(c) ? '' : ' disabled') +
          ' data-confirm="1">' + TICK + '</button>', g.cards);
      }
      if (composerOn(c)) {
        // **The settled card is the composer** (Ed, 2026-08-18): the rule as
        // it stands at the head, the alternatives as the setting's own
        // controls, session-view's rationale lane, 🗑️ and the route's commit.
        const d = (S.draft && S.draft.k === c.k) ? S.draft : { k: c.k, to: '', why: '' };
        const route = routeFor(c, d.to);
        const body2 = (PROPOSE[c.k] ? PROPOSE[c.k](d)
            : '<div class="lanebox"><div class="lp editlane" contenteditable="plaintext-only" spellcheck="false"' +
              ' data-motionlane="to" data-ph="The value you are proposing">' + esc(d.to) + '</div></div>') +
          whyLane(d) +
          (route === 'constitutional'
            ? '<p class="setnote"><b>Free — and one at a time.</b> Each member may have one 🏛️ out at once; withdraw it and it comes back whole. Putting it is a full ten-second hold.' +
              (crownWaits(c) ? ' Carrying sends it to the founder as a <b>👑 question</b> — theirs to accept or reject.' : '') + '</p>'
            : '<p class="setnote"><b>Costs one ✏️</b>, returned in full if withdrawn.' +
              (crownWaits(c) ? ' Carrying sends it to the founder as a <b>👑 question</b> — theirs to accept or reject.' : '') + '</p>') +
          (wasAsked(c) && settled(c) ? '<div class="body">' + watchBody(c, ctx) + '</div>' : '');
        return cardHtml(c, ctx, body2,
          '<button class="btn glyphbtn" data-dropmotion="1"' +
          (S.draft && S.draft.k === c.k ? '' : ' disabled') + ' title="Discard this motion">🗑️</button>' +
          commitFor(c), g.cards);
      }
      const body = c.ansFor ? ANSWER[c.ansFor](S.myAns, E(), c.ansFor === 'quorum' ? S.quorumForm : undefined)
        // a card that is not yours to answer reads as the rule it is —
        // the founder's settings are read-only from any other chair
        : (!amFounder() && c.own !== 'you')
        ? readBody(c, ctx) + (wasAsked(c) && settled(c) ? '<div class="body">' + watchBody(c, ctx) + '</div>' : '')
        : BODY[c.k]() + powerTail(c.k) +
          (wasAsked(c) && settled(c) ? '<div class="body">' + watchBody(c, ctx) + '</div>' : '');
      const kindLine = (c.kind === 'personal' || c.ansFor || c.k === 'title') ? '' :
        '<p class="setnote"><b>' + KIND[c.kind] + '.</b> ' + (c.knote || kindNote[c.kind]) + '</p>';
      const clearable = { myname: S.myname, mypic: S.mypic };
      const newsKey = isRoom(c) ? 'res-' + c.k : 'set-' + c.k;
      const foot = (!amFounder() && c.own !== 'you' && !c.ansFor)
        ? (stateOf(c, ctx) === 'news'
          ? '<button class="btn" data-close="1">Close</button>' +
            '<button class="btn btn-approve" data-ok="' + newsKey + '">OK</button>'
          : '<button class="btn" data-close="1">Close</button>')
        : (c.k === 'myname' || c.k === 'mypic')
        ? '<button class="btn glyphbtn" data-clearval="' + c.k + '"' + (clearable[c.k] ? '' : ' disabled') +
          ' title="' + (c.k === 'myname' ? 'Clear the name' : 'Remove the picture') + '">🗑️</button>' +
          '<button class="btn btn-approve glyphbtn"' + (ready(c) ? '' : ' disabled') +
          ' data-confirm="1">✒️</button>'
        : c.k === 'title'
        ? '<button class="btn glyphbtn" data-cleartitle="1"' + (S.title ? '' : ' disabled') +
          ' title="Clear the title">🗑️</button>' +
          '<button class="btn btn-approve glyphbtn"' + (ready(c) ? '' : ' disabled') +
          ' data-confirm="1" title="' + (ready(c) ? 'Set it — yours to change any time' : 'Give it a name first') + '">✒️</button>'
        : stateOf(c, ctx) === 'news'
        ? '<button class="btn" data-close="1">Close</button>' +
          '<button class="btn btn-approve" data-ok="' + newsKey + '">OK</button>'
        : '<button class="btn" data-close="1">Close</button>' +
        '<button class="btn btn-approve glyphbtn"' + (ready(c) ? '' : ' disabled') +
        // ✒️ is the founder's unilateral pen (Ed, 360): every confirm on
        // this surface is a unilateral set — except an answer to a shared
        // question, which is the one act here that is not yours alone
        ' data-confirm="1" title="' + (ready(c) ? 'Confirm' : 'Not answered yet') + '">' + (c.ansFor ? TICK : '✒️') + '</button>';
      return cardHtml(c, ctx, body + kindLine, foot, g.cards);
    };
    // the title card opens in the title's own paragraph, whatever else
    // the band is doing — the clause, opened, with its tab in its strip
    const tp = document.getElementById('titlepara');
    tp.classList.toggle('open', S.open === 'title');
    tp.querySelectorAll('.setupcard').forEach((el) => el.remove());
    if (S.open === 'title') tp.insertAdjacentHTML('beforeend', cardFor(groups()[0]));
    // **Before the save there is no constitution** (Ed, 2026-08-18): an
    // unsaved document is a topbar, an outline, an empty title and its
    // tasks. The band holds only the open card, in the section geometry
    // it will keep, with none of the chrome.
    if (!settled(card('slug'))) {
      band.innerHTML = (S.open && S.open !== 'title')
        ? '<div class="setrow constsec"><div class="csec"><div class="cpara open">' + cardFor(groups()[0]) + '</div></div></div>'
        : '';
    } else {
      band.innerHTML = bandHtml(groups(), ctx, cardFor);
    }
    fitBand(band);
    fitBand(tp.closest('.titlerow'));
    fitTitleCard();
  }

  // **Opening the title must not move the title** (Ed, 2026-08-18: *the
  // title jumps*), **and the tab must still meet the card** (Ed, same day:
  // *the clause-tab doesn't meet the card*). The first build satisfied the
  // first rule by shifting the whole card onto the heading's text and
  // dragging the strip back onto the closed tab — which pulled the strip
  // off the card's edge, because the strip hangs on the card's box. So the
  // two corrections go to different owners: the **vertical** one moves the
  // card (a card moving up does not break the strip's contact with its own
  // edge), and the **horizontal** one moves the head **text** only — the
  // card box, and the strip flush on it, never move sideways. With the
  // closed tab standing on the card's edge too (see #titlechip .chipcol in
  // setup.css), the tab needs pinning only in Y. All measured, from text
  // rects rather than boxes, because the title wraps and paddings differ.
  const textRect = (el) => { const r = document.createRange();
    r.selectNodeContents(el); const rs = r.getClientRects(); return rs.length ? rs[0] : null; };
  function fitTitleCard() {
    if (S.open !== 'title') return;
    const cardEl = document.querySelector('#titlepara > .setupcard');
    const hd = cardEl && cardEl.querySelector('.headdoct');
    const d = document.getElementById('doctitle');
    if (!cardEl || !hd || !d) return;
    cardEl.style.marginTop = ''; hd.style.marginLeft = '';
    d.style.display = '';
    const want = textRect(d);
    d.style.display = 'none';
    const have = textRect(hd);
    if (want && have) {
      const dy = want.top - have.top, dx = want.left - have.left;
      if (Math.abs(dy) > 0.5) cardEl.style.marginTop =
        ((parseFloat(getComputedStyle(cardEl).marginTop) || 0) + dy).toFixed(1) + 'px';
      if (Math.abs(dx) > 0.5) hd.style.marginLeft = dx.toFixed(1) + 'px';
    }
    // pin the tab vertically onto the re-materialised closed tab — one
    // unpainted beat, never shown. No horizontal pin: the strip's x is the
    // card's edge, which is where the closed tab now stands by rule.
    const col = cardEl.querySelector('.chipcol');
    const chipHost = document.getElementById('titlechip');
    if (col && chipHost) {
      col.style.transform = '';
      d.style.display = '';
      chipHost.innerHTML = pileHtml([card('title')], ctx);
      const refG = chipHost.querySelector('.achip span');
      const wantG = refG && refG.getBoundingClientRect();
      chipHost.innerHTML = '';
      d.style.display = 'none';
      const haveG = col.querySelector('.achip span');
      if (wantG && haveG) {
        const dy2 = wantG.top - haveG.getBoundingClientRect().top;
        if (Math.abs(dy2) > 0.5) col.style.transform = 'translateY(' + dy2.toFixed(1) + 'px)';
      }
    }
  }

  function refreshCommit() {
    const b = document.querySelector('[data-confirm]');
    if (b && S.open) b.disabled = !ready(card(S.open));
    // the title card's other live pieces follow the typing without a
    // re-render (which would take the caret): the head is the clause and
    // the clause is what is being typed, and the bin keys on there being
    // anything to clear
    const hd = document.querySelector('.setupcard .headrule .headdoct');
    if (hd && S.open === 'title') {
      hd.textContent = S.title || 'Untitled document';
      hd.classList.toggle('ph', !S.title);
    }
    const bin = document.querySelector('[data-cleartitle]');
    if (bin) bin.disabled = !S.title;
  }

  const renderMail = () => (S.viewer === 'applicant'
    ? renderMailModal(S.app.mailOpen, MAILS.applyVerify(S.title || 'this document', S.app.email))
    : renderMailModal(S.mailOpen, MAILS.verify(S.title, S.myemail)));

  const render = () => {
    // the roster rows ARE the people now (per-user state, Ed 362): the
    // identity cards write straight onto the viewer's row — and the rows
    // follow the module's register first
    syncFromCs();
    resolveCounts();
    renderDev();
    renderTitle(); renderRail(); renderBand(); drawWire(wires, S.open); renderMail();
    document.getElementById('mebtn').innerHTML = avHtml(
      S.viewer === 'applicant' ? { n: S.app.name || '?', pic: S.app.pic } : me(), 'face');
    if (S.open && S.open !== lastOpen) {
      const el = document.querySelector('.setupcard');
      if (el) CC.expandCard(el, () => {});
    }
    lastOpen = S.open;
  };

  // ---- wiring ------------------------------------------------------------
  // **The picture card is an uploader** (Ed, 2026-08-18). Delegated, because
  // the card is rebuilt on every render; the file is read locally and never
  // sent anywhere.
  wirePicDrop((d) => { S.mypic = d; render(); });
  document.addEventListener('change', (ev) => {
    if (ev.target.matches('[data-ansdate]')) {
      S.myAns[ev.target.dataset.ansdate] = ev.target.value || null; return render(); }
    if (ev.target.matches('[data-ansnum]')) {
      S.myAns[ev.target.dataset.ansnum] = ev.target.value === '' ? null : +ev.target.value;
      return render(); }
    // a motion's own control writes the value it proposes — on `change`, not
    // every keystroke, because a date picker rebuilt under the pointer is a
    // date picker you cannot use
    if (ev.target.matches('[data-mtext],[data-mslug],[data-mpace],[data-mdate],[data-mnum],[data-mrate]') &&
      (!S.draft || S.draft.k !== S.open)) S.draft = { k: S.open, to: '', why: '' };
    if (!S.draft) return;
    if (ev.target.matches('[data-mtext]')) { S.draft.to = ev.target.value.trim();
      S.draft.val = { text: S.draft.to }; return render(); }
    if (ev.target.matches('[data-mslug]')) {
      const v = ev.target.value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '');
      S.draft.to = v ? 'docs.vote/' + v : '';
      S.draft.val = v ? { slug: v } : null;
      return render(); }
    if (ev.target.matches('[data-mpace]')) { S.draft.to = 'Rising from ' + ev.target.value + '%';
      S.draft.val = { shape: 'ramp', startPct: +ev.target.value }; return render(); }
    if (ev.target.matches('[data-mrate]')) {
      const g2 = (k2) => document.querySelector('[data-mrate="' + k2 + '"]');
      S.draft.to = (g2('x') && g2('x').value || '4') + ' each, up to ' + (g2('y') && g2('y').value || '8') +
        ', one every ' + (g2('z') && g2('z').value || '180') + ' minutes';
      S.draft.val = { grant: +(g2('x') && g2('x').value || 4),
        cap: Math.max(+(g2('y') && g2('y').value || 8), +(g2('x') && g2('x').value || 4)),
        dripMinutes: +(g2('z') && g2('z').value || 180) };
      return render(); }
    if (ev.target.matches('[data-mdate]')) {
      S.draft.to = ev.target.value
        ? new Date(ev.target.value).toLocaleString(undefined,
          { weekday: 'long', hour: '2-digit', minute: '2-digit', hour12: false }) : '';
      S.draft.val = ev.target.value ? { endsAtMs: Date.parse(ev.target.value) } : null;
      return render();
    }
    if (ev.target.matches('[data-mnum]')) {
      S.draft.to = ev.target.value + ev.target.dataset.mnum;
      const nv = +ev.target.value;
      S.draft.val = (S.open === 'bar') ? { pct: nv }
        : (S.open === 'quorum') ? { form: S.quorumForm, n: nv }
        : (S.open === 'lapse') ? { afterMs: nv * 86400000 }
        : (S.open === 'machines') ? { enabled: true, budget: nv }
        : null;
      return render();
    }
  });
  document.addEventListener('click', (ev) => {
    const ct = ev.target.closest('[data-cleartitle]');
    if (ct) return closeThen(() => { S.title = ''; S.open = null; });
    const cv = ev.target.closest('[data-clearval]');
    if (cv) return closeThen(() => { S[cv.dataset.clearval === 'myname' ? 'myname' : 'mypic'] = ''; S.open = null; });
    const ams = ev.target.closest('[data-appmailsend]');
    if (ams) { S.app.emailSent = true; S.app.mailOpen = true;
      // the address is the identity (§9.7½) — the module holds it from here
      if (cs && !S.app.csId) {
        try { S.app.csId = cs.startApplication(now(), S.app.email.trim()); }
        catch (e) { console.warn('[cs]', e && e.message); }
      }
      return render(); }
    const ame = ev.target.closest('[data-appmailedit]');
    if (ame) { S.app.emailSent = false; return render(); }
    const amo = ev.target.closest('[data-appmailopen]');
    if (amo) { S.app.mailOpen = true; return render(); }
    const ast = ev.target.closest('[data-appstart]');
    if (ast) { S.app.started = true; return render(); }
    const asu = ev.target.closest('[data-appsubmit]');
    if (asu) { S.app.submitted = true; S.open = 'apply';
      if (cs && S.app.csId) { try { cs.submitApplication(now(), S.app.csId,
        { name: S.app.name || undefined, picture: S.app.pic || undefined,
          words: S.app.text || undefined }); } catch (e) { console.warn('[cs]', e && e.message); } }
      return render(); }
    const ap2 = ev.target.closest('[data-apppic]');
    if (ap2) { S.app.pic = ap2.dataset.apppic; return render(); }
    const mo2 = ev.target.closest('[data-motion]');
    if (mo2) { S.mAns[S.open] = mo2.dataset.motion; return render(); }
    const mval = ev.target.closest('[data-mval]');
    if (mval) {
      if (S.draft && S.draft.k === S.open && S.draft.to === mval.dataset.mval) {
        S.draft = null; return render(); }
      if (currentOf(S.open) === mval.dataset.mval) { S.draft = null; return render(); }
      if (!S.draft || S.draft.k !== S.open) S.draft = { k: S.open, to: '', why: '' };
      S.draft.to = mval.dataset.mval;
      S.draft.val = mvalTyped(S.open, mval.dataset.mval);
      return render(); }
    const mj = ev.target.closest('[data-mjoinbtn]');
    if (mj) {
      const f2 = document.querySelector('[data-mjoin]');
      const n = (f2 && f2.value || '').trim();
      if (n) { if (!S.draft || S.draft.k !== S.open) S.draft = { k: S.open, to: '', why: '' };
        S.draft.to = n + ' joins the membership'; render(); }
      return;
    }
    if (ev.target.closest('[data-dropmotion]'))
      return closeThen(() => { S.draft = null; S.open = null; });
    const wm = ev.target.closest('[data-withdrawmotion]');
    if (wm) return closeThen(() => { const k = wm.dataset.withdrawmotion;
      const rec = liveMotionRec(card(k));
      if (rec) { try { cs.withdrawMotion(now(), viewerId(), rec.id); } catch (e) {} }
      S.roster.forEach((r) => { if (r.mAns) delete r.mAns[k]; if (r.mAnsOk) r.mAnsOk.delete(k); });
      S.open = null; });
    if (ev.target.closest('[data-putmotion]')) {
      if (S.draft && S.draft.to) {
        try {
          cs.openMotion(now(), viewerId(), draftPayload(S.draft), S.draft.why || undefined);
          S.draft = null;
        } catch (e) { console.warn('[cs]', e && e.message); }
      }
      return render(); }
    const cq = ev.target.closest('[data-crownq]');
    if (cq) return closeThen(() => {
      const rec = liveMotionRec(card(S.open));
      if (rec && cs) {
        const q = [...cs.crownQuestionRecords().values()]
          .find((x) => x.motion === rec.id && x.status === 'pending');
        if (q) { try { cs.answerCrownQuestion(now(), q.id, cq.dataset.crownq);
          syncFromCs(); } catch (e) {} }
      }
      S.open = null; });
    const okb = ev.target.closest('[data-ok]');
    if (okb) return closeThen(() => { const kk = okb.dataset.ok;
      S.okd.add(kk); S.open = null;
      if (cs && kk.startsWith('set-') && viewerId()) {
        try { cs.giveOk(now(), viewerId(), midOf(kk.slice(4))); } catch (e) {}
      } });
    const t = ev.target.closest('[data-tab], [data-card]');
    if (t) { const k = t.dataset.tab || t.dataset.card;
      if (S.open === k) return closeThen(() => { S.open = null; });
      S.open = k; return render(); }
    if (ev.target.closest('[data-confirm]')) {
      return closeThen(() => {
        const was = S.open; S.seen.add(was); S.open = null;
        const cw = card(was);
        try {
          // the ✓ is the act (363a): the commit is a module command
          if (cw && cw.ansFor && filled(cw)) {
            cs.answer(now(), viewerId(), midOf(cw.ansFor),
              ANSTYPED[cw.ansFor](S.myAns[cw.ansFor]));
            return;
          }
          if (cw && motionOn(cw) && motionPicked(cw)) {
            const rec = liveMotionRec(cw);
            if (rec && rec.route === 'constitutional') {
              cs.answerMotion(now(), viewerId(), rec.id,
                S.mAns[cw.k] === 'yes' ? 'accept'
                  : S.mAns[cw.k] === 'abstain' ? 'abstain' : 'keep');
              syncFromCs();
            } else if (rec) {
              myMAnsOk().add(cw.k);
              maybeAdjudicate(rec, cw.k);
            }
            return;
          }
          // the link card is born pre-filled the moment the title settles
          if (was === 'title' && S.title && !S.slug) {
            const sg = suggestSlug(S.title); S.slug = sg.slug; S.slugTaken = sg.taken;
          }
          // **the save** (§9.7a): confirming the link is the act of creation
          if (was === 'slug' && !cs) {
            cs = window.cs = M.ConstitutionSession.open({ title: S.title, slug: S.slug,
              convenor: { id: FOUNDER, email: S.myemail, isMember: S.roster[0].role !== 'clerk' } }, now());
            if (S.myname) cs.setIdentity(now(), FOUNDER, { name: S.myname });
            return;
          }
          if (!cs) return;
          // §9.7 v0.52: the delegation sentence preferred + ✒️ is the
          // hand-over — never a button
          if ((was === 'title' || was === 'slug') && wantsDelegate(was)) {
            cs.delegate(now(), midOf(was)); return; }
          if (was === 'title') {
            if (S.title !== cs.titleOf) cs.setSetting(now(), 'title', { text: S.title });
            syncPowers('title'); return; }
          if (was === 'slug') {
            if (S.slug !== cs.slug) cs.setSetting(now(), 'link', { slug: S.slug });
            syncPowers('slug'); return; }
          if (was === 'text') { cs.confirmStartingText(now(), proseText()); return; }
          if (was === 'myname') { cs.setIdentity(now(), viewerId(), { name: S.myname || null }); return; }
          if (was === 'mypic') { cs.setIdentity(now(), viewerId(), { picture: S.mypic || null }); return; }
          if (was === 'roster') return; // the register commits row by row
          if (MANAGED_KEYS.includes(was) && amFounder()) commitSetting(was);
        } catch (e) { console.warn('[cs]', e && e.message); }
      }); }
    if (ev.target.closest('button[data-close]')) return closeThen(() => { S.open = null; });
    const mt = ev.target.closest('[data-metoggle]');
    if (mt) { const m = meRow(); if (m) { m.role = iDraft() ? 'clerk' : 'member';
      if (cs) { try { cs.setConvenorMembership(now(), m.role !== 'clerk'); } catch (e) {} } }
      return render(); }
    const mv2 = ev.target.closest('[data-act="sendverify"]');
    if (mv2) { S.emailSent = true; S.mailOpen = true; return render(); }
    const om = ev.target.closest('[data-act="openmail"]');
    if (om) { S.mailOpen = true; return render(); }
    if (ev.target.closest('[data-mailclose]') ||
        (ev.target.id === 'mailmodal')) { S.mailOpen = false; S.app.mailOpen = false; return render(); }
    const cm = ev.target.closest('[data-act="clickmail"]');
    // clicking the mail's login button IS arriving back, so it settles the
    // card itself — there is no second act of confirming you exist
    if (cm && S.viewer === 'applicant') { S.app.emailVerified = true; S.app.mailOpen = false;
      if (cs && S.app.csId) { try { cs.verifyApplication(now(), S.app.csId); } catch (e) {} }
      return render(); }
    if (cm) { S.emailVerified = true; S.mailOpen = false; S.seen.add('myemail'); S.open = 'slug'; return render(); }
    const ee = ev.target.closest('[data-act="editemail"]');
    if (ee) { S.emailSent = false; return render(); }
    const an = ev.target.closest('[data-ans]');
    if (an) { const v = an.dataset.ansval;
      S.myAns[an.dataset.ans] = (v === 'true') ? true : (v === 'false') ? false
        : (v === 'date') ? (S.myAns[an.dataset.ans] === 'never' ? null : S.myAns[an.dataset.ans])
        : v;
      return render(); }
    const o = ev.target.closest('[data-set]');
    if (o) { const v = o.dataset.val;
      S[o.dataset.set] = (v === 'true') ? true : (v === 'false') ? false : v;
      if (perpetual() && S.shape === 'ramp') S.shape = 'fixed';
      return render(); }
    const pic = ev.target.closest('[data-pic]');
    if (pic) { S.mypic = pic.dataset.pic; return render(); }
    const d = ev.target.closest('[data-drop]');
    if (d) { const row = S.roster[+d.dataset.drop];
      if (cs && row && row.mid) { try { cs.uninvite(now(), row.mid); } catch (e) { return render(); } }
      S.roster.splice(+d.dataset.drop, 1); return render(); }
    if (ev.target.closest('[data-act="add"]')) {
      const f = document.querySelector('[data-add]');
      if (f && f.value.trim()) invite(f.value.trim());
      return render(); }
    if (ev.target.closest('[data-act="invite"]')) {
      const box = document.querySelector('[data-emails]');
      if (box) { box.value.split(/[\s,;]+/).filter((x) => x.includes('@')).forEach(invite); box.value = ''; }
      return render();
    }
  });
  function invite(em) {
    if (S.roster.some((p) => p.e === em)) return;
    let mid = null;
    if (cs) { try { mid = cs.invite(now(), em); } catch (e) { return; } }
    S.roster.push({ n: em.split('@')[0].replace(/[._-]+/g, ' ').replace(/\b\w/g, (x) => x.toUpperCase()),
      e: em, role: 'member', in: false, mid });
    // the arrival theatre stays; its payload is a real command now (§9.6a)
    setTimeout(() => { const p = S.roster.find((x) => x.e === em);
      if (p) { p.in = true;
        if (cs && p.mid) { try { cs.arrive(now(), p.mid);
          cs.setIdentity(now(), p.mid, { name: p.n }); } catch (e) {} }
        render(); } },
      1200 + Math.random() * 2600);
  }
  // ---- assembly-press (Ed, 2026-08-18) -----------------------------------
  // A constitutional change goes in by a **full ten-second hold**, and the
  // progress meter is the room itself: the members convene onto a circle
  // around the button, and the motion is put at the moment the assembly is
  // complete. Release early and it disperses — nothing sent.
  const HOLD_MS = 10000;
  let assembly = null;
  function conveneAssembly(btn, k) {
    disperseAssembly();
    const d0 = S.draft;
    if (!d0 || d0.k !== k) return;
    const r = btn.getBoundingClientRect();
    const el = document.createElement('div');
    el.id = 'assembly';
    el.style.left = (r.left + r.width / 2) + 'px';
    el.style.top = (r.top + r.height / 2) + 'px';
    const RADIUS = 88;
    const room = S.roster.filter((p) => p.in && p.role !== 'clerk');
    room.forEach((p, i) => {
      const seat = document.createElement('span');
      seat.className = 'seat';
      const th = -Math.PI / 2 + (i / room.length) * 2 * Math.PI;
      seat.style.left = Math.round(Math.cos(th) * RADIUS) + 'px';
      seat.style.top = Math.round(Math.sin(th) * RADIUS) + 'px';
      seat.innerHTML = avHtml(p);
      el.appendChild(seat);
    });
    document.body.appendChild(el);
    const seats = [...el.children];
    const timers = seats.map((s2, i) =>
      setTimeout(() => s2.classList.add('in'), 80 + i * (HOLD_MS - 800) / seats.length));
    assembly = { el, timers, done: setTimeout(() => {
      el.classList.add('done');
      try { cs.openMotion(now(), viewerId(), draftPayload(d0), d0.why || undefined);
        // the module auto-answered accept for the mover (§9.6 v0.49) —
        // the provisional layer agrees, so their own radio reads pressed
        S.mAns[d0.k] = 'yes'; }
      catch (e) { console.warn('[cs]', e && e.message); }
      S.draft = null; assembly = null;
      setTimeout(() => { el.remove(); render(); }, 420);
    }, HOLD_MS) };
  }
  function disperseAssembly() {
    if (!assembly) return;
    assembly.timers.forEach(clearTimeout); clearTimeout(assembly.done);
    const el = assembly.el; assembly = null;
    el.classList.add('gone');
    setTimeout(() => el.remove(), 260);
  }
  document.addEventListener('pointerdown', (ev) => {
    const b = ev.target.closest('[data-holdmotion]');
    if (b && !b.disabled) { ev.preventDefault(); conveneAssembly(b, b.dataset.holdmotion); }
  });
  ['pointerup', 'pointercancel'].forEach((t) => document.addEventListener(t, disperseAssembly));

  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && S.open) { S.open = null; return render(); }
    if (ev.key === 'Enter' && ev.target.closest('[data-titlelane]')) ev.preventDefault();
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.closest('[data-tab]')) {
      ev.preventDefault(); ev.target.closest('[data-tab]').click();
    }
  });
  // A lane rebuilt on every keystroke would lose the caret, so typing repaints
  // the bar and the rail and leaves the card alone — only the commit control,
  // which is about what you have just typed, is set directly.
  document.addEventListener('input', (ev) => {
    const sl = ev.target.closest && ev.target.closest('[data-slide]');
    if (sl) { S.myAns[sl.dataset.slide] = +sl.value; render();
      const again = document.querySelector('[data-slide="' + sl.dataset.slide + '"]');
      if (again) again.focus(); return; }
    const t = ev.target;
    const lane = t.closest && t.closest('[data-titlelane]');
    if (lane) { S.title = lane.textContent.trim(); lane.classList.toggle('blank', !S.title);
      renderTitle(); renderRail(); refreshCommit(); return; }
    if (t.dataset.appmail !== undefined) { S.app.email = t.value.trim();
      const sb = document.querySelector('[data-appmailsend]');
      if (sb) sb.disabled = !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.app.email) ||
        MEMBER_EMAILS.has(S.app.email.toLowerCase());
      return; }
    if (t.dataset.appname !== undefined) { S.app.name = t.value; return; }
    const at = t.closest && t.closest('[data-apptext]');
    if (at) { S.app.text = at.textContent.trim(); at.classList.toggle('blank', !S.app.text); return; }
    const ml = t.closest && t.closest('[data-motionlane]');
    if (ml) { if (!S.draft || S.draft.k !== S.open) S.draft = { k: S.open, to: '', why: '' };
      S.draft[ml.dataset.motionlane] = ml.textContent.trim();
      ml.classList.toggle('blank', !ml.textContent.trim());
      // the commit slot follows the route of what is now typed (329a) —
      // swapped in place, because a re-render would throw the caret out
      const slot = document.querySelector('[data-putmotion], [data-holdmotion]');
      if (slot && S.draft) slot.outerHTML = commitFor(card(S.draft.k));
      const dr = document.querySelector('[data-dropmotion]');
      if (dr) dr.disabled = false;
      return; }
    if (t.dataset.slug) { S.slug = t.value.trim().toLowerCase(); renderRail(); refreshCommit(); return; }
    if (t.dataset.txt === 'myname') { S.myname = t.value; renderRail(); refreshCommit(); return; }
    if (t.dataset.txt === 'myemail') { S.myemail = t.value.trim();
      S.emailSent = false; S.emailVerified = false; S.seen.delete('myemail');
      const m = meRow(); if (m) m.e = S.myemail;
      // the send button tracks validity in place — a full render would
      // rebuild the card under the caret
      const sv = document.querySelector('[data-act="sendverify"]');
      if (sv) sv.disabled = !EMAIL_OK.test(S.myemail);
      renderRail(); refreshCommit(); return; }
    if (t.dataset.txt) { S[t.dataset.txt] = t.value; renderRail(); }
    if (t.dataset.num) { S[t.dataset.num] = +t.value; renderRail(); }
  });
  document.getElementById('devwho').addEventListener('change', (ev) => {
    const v = ev.target.value;
    S.viewer = v === 'applicant' ? 'applicant' : +v;
    // sitting in an invited seat is that member's first arrival (§9.6a)
    if (cs && v !== 'applicant') {
      const row = S.roster[+v];
      if (row && row.mid && !row.in) {
        try { cs.arrive(now(), row.mid);
          cs.setIdentity(now(), row.mid, { name: row.n });
          row.in = true; } catch (e) {}
      }
    }
    S.open = null; lastOpen = null;
    render();
  });
  document.getElementById('devff').addEventListener('click', () => {
    devFastForward(); S.open = null; lastOpen = null; render();
  });
  addEventListener('resize', () => { fitBand(band); drawWire(wires, S.open); });
  addEventListener('scroll', () => drawWire(wires, S.open), true);

  relabel(); render();
})();
</script>
