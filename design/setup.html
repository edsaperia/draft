<style>
/* ============================================================================
   document-creation — **the document, from its first minute.**

   Five notes built this, in order, and each one made the screen less of a form:

   1. *Something that looks like the document itself; the admin pastes the text
      into the space where it will later be edited, the ToC appears on cue, they
      click the placeholder title in the topbar, and the sidebar holds cards with
      each of the questions they need to decide.*
   2. *Can we import as much of the session-view as we can? I think ultimately
      this will literally be the session view.*
   3. *You can start inviting people immediately after creating the document …
      and as soon as you've confirmed the starting text they can start making
      proposals … and judgements unlock as soon as everyone is ready.*
   4. *Ceremony and admin cards are absolutely just queue-cards. Instead of
      modals they open cards in the document at the top, above the text, pushing
      it down like decision-cards do a clause. They have cables and tabs.*
   5. *I'd like all of these tabs to act like clause-tabs and pile like clause
      tabs. The founder's settings sit in one pile, and members' in the
      pile below. … Go through every decision each role needs to make and turn it
      into a queue-card. Break them down as much as you can.*

   The third changed the model — there is no moment when the document "opens".
   The fourth retired the modal. The fifth retired the last two inventions on the
   screen: the flat tab group, which is now two `chip-gutter` piles like
   everything else, and the compound card, which was a form in card's clothing.
   **One decision, one card**, and the test is whether somebody could answer it
   differently and on its own: a picture and a name are two questions, and so are
   a membership and whether the founder is in it. What is *not* split is a
   parameter and its own value — *rising, 55% → 78%* is one thought, and cutting
   it in half would be splitting a sentence rather than a decision. The same test
   cuts the other way twice, on 2026-08-18: *when it ends* swallowed *whether it
   ends*, because **never** is one of the answers to *when*; and the stake stopped
   being a card at all, because it is a flat 1 in the mechanism and a card for it
   was offering a decision nobody has. Then ✒️ split the other way on Ed’s Q341 rethink — the close bar is consent where the ramp is pacing, two kinds — so seventeen became eighteen — and 💤 *Do memberships lapse?* (Ed, closing Q345) made it nineteen.

   What is left in this file is its own fixture and the bodies of the cards a
   founder fills in. The piles, the strip, the cable, the rail entry, the card
   shell, the read-only and watching bodies and the identity cards are in
   `setup.js`, because the founding ceremony is this same screen seen by
   somebody else.
   ========================================================================== */

  /* **The title is not edited in the topbar** (Ed, 2026-08-18). It had been a
     contenteditable in the bar, which is the one place on this screen that is
     not a card — so the title was the single setting with no card behind it, no
     confirm, and no way back to it except clicking the words. The bar shows the
     title; the 🏷️ card is where you write it, in the same `.lanebox` the
     `editing-card` writes a clause in. */
  .navbar .brand.ph { color: var(--muted); font-weight: 400; }
  /* dev chrome, deliberately off the design system: dashed, monospace,
     top-left — a stagehand, not a member of the cast (Ed, 362) */
  .devswitch { position: fixed; top: calc(var(--nav-h) + 8px); left: 10px; z-index: 60;
    font: 11px/1.4 ui-monospace, Consolas, monospace; color: var(--muted);
    background: var(--bg); border: 1px dashed var(--border); border-radius: 6px;
    padding: 4px 8px; opacity: 0.85; }
  .devswitch select { font: inherit; color: var(--fg); border: none; background: transparent; }
  .devswitch button { font: inherit; color: var(--muted); background: transparent;
    border: 1px dashed var(--border); border-radius: 4px; cursor: pointer; padding: 1px 6px; }

  /* the paste-well: the empty state of the prose column, and nothing more */
  .prose.empty.pasteready::before {
    content: "Paste the text this document starts from, or begin typing it.\A\A Markdown headings become its sections, and the contents appear beside you as you go.";
    white-space: pre-wrap; color: var(--muted); font-size: var(--t-body); line-height: 1.6;
  }


  /* the controls the share box took with it, now on the 🔗 and 🪪 cards */
  .setupcard textarea { width: 100%; font-size: var(--t-ui); padding: var(--s2);
    resize: vertical; min-height: 60px; }
  .setupcard .btn:not(.glyphbtn) { font: inherit; font-size: var(--t-cap); padding: var(--s1) var(--s3);
    cursor: pointer; border: 1px solid var(--border); background: var(--bg);
    border-radius: var(--r-sm); }
  .setupcard .btn:hover { border-color: var(--primary); color: var(--primary-emphasis); }
  /* the page's .setupcard .btn ground ties with system.css's .btn.btn-approve
     and wins on order, leaving white-on-white — restate the approve look at
     the same scope so the mail's login button reads as one */
  .setupcard .btn.btn-approve { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .setupcard .btn.btn-approve:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
  .pf.waiting { color: var(--muted); }

  /* ---- what is unlocked, and what is waiting ----------------------------- */
  .stage-REMOVED { display: none;
    font-size: var(--t-small); }
  .stage .nm { font-weight: 600; }
  .stage .st { color: var(--muted); font-size: var(--t-cap); margin-left: auto; text-align: right; }
  .stage.live .nm, .stage.live .st { color: var(--ok); }
  .stage .mkg { flex: none; }
  .stage.wait .mkg { visibility: hidden; }
</style>

<script>
(function () {
  const { esc, TICK, avHtml, avatarOptions, bandHtml, fitBand, railEntry, cardHtml, watchBody,
    nameBody, pictureBody, drawWire, opt, num, someIn, KIND, kindNote, ANSWER, stateOf,
    MAILS, renderMailModal, gateBody, wirePicDrop, pileHtml, readBody,
    motionBody, motionReopen, routeFor, motionCommitHtml, BLINDNOTE } = window.SETUP;
  // **A setup card opens and closes like a decision card** (Ed, 2026-08-18:
  // *the whole point of building off session-view is that we would have all
  // this stuff*): cards.js own expandCard/collapseCard, which have been
  // sitting in the shared module since the lift — the card grows out of its
  // own head, and every way of leaving it rolls it back into its paragraph.
  const CC = window.CARDS.make({ onExpand: () => drawWire(wires, S.open) });
  let lastOpen = null;
  // run the close animation, then the state change it was closing for
  const closeThen = (fn) => {
    const el = document.querySelector('.setupcard');
    if (!el) { fn(); return render(); }
    CC.collapseCard(el, () => { fn(); render(); });
  };
  const prose = document.getElementById('prose');
  const titleEl = document.getElementById('title');
  const band = document.getElementById('band');
  const rail = document.getElementById('rail');
  const wires = document.getElementById('wires');

  // ---- the module keeps truth (plan 367a): @draft/constitution ----------
  // The page keeps rendering, its copy, and the provisional layer — radio
  // positions, unsent answers, a motion being typed. Everything the ROOM
  // holds — settled values, delegations, blind counts, resolutions, gates,
  // motions, the membership — lives in the ConstitutionSession, born at
  // the save (§9.7a: until the link exists, nothing does, anywhere).
  const M = window.CONSTITUTION;
  let cs = null;
  let T = 0;                       // the logical clock every command stamps
  const now = () => ++T;
  const FOUNDER = 'founder';
  // page key ↔ module setting id — the page keeps its own vocabulary
  const MID = { slug: 'link', text: 'startingText', policy: 'applications', roster: 'membership' };
  const midOf = (k) => MID[k] || k;
  const MANAGED_KEYS = ['title', 'slug', 'ending', 'bar', 'pace', 'quorum',
    'authorship', 'signing', 'judgments', 'chamber', 'rate', 'lapse',
    'machines', 'policy'];
  const csState = (k) => (cs && MANAGED_KEYS.includes(k) ? cs.settingState(midOf(k)) : null);
  const csSettled = (k) => { const st = csState(k); return !!st && st.settledBy !== null; };
  const csDelegated = (k) => { const st = csState(k); return !!st && st.holder === 'members'; };
  // §9.7 v0.54 / 396c: a reservation is two powers — unilateral change and
  // assent — and the "and afterwards" pair on a held setting picks between
  // their states. The provisional selection lives page-side under 'pw:'+k;
  // what stands derives from the module (or, for the register, its value).
  const pwCur = (k) => {
    if (k === 'policy') { const st = csState('policy');
      const h = st && st.value ? st.value.holder : null;
      return h === 'reserved-unilateral' ? 'unilateral'
        : h === 'reserved-assent' ? 'assent' : 'both'; }
    const st = csState(k);
    if (!st || st.holder !== 'convenor') return 'both';
    return st.powers.assent ? (st.powers.unilateral ? 'both' : 'assent')
      : (st.powers.unilateral ? 'unilateral' : 'both');
  };
  const pwOf = (k) => S['pw:' + k] || pwCur(k);
  // the register's powers live inside the applications value (§9.7½)
  const regHolder = () => (S.rosterBy === 'founder'
    ? ({ both: 'reserved', unilateral: 'reserved-unilateral', assent: 'reserved-assent' })[pwOf('policy')]
    : 'members');
  // 396c: the constitution states the register's state in precise language
  const regLine = (h) => ({
    reserved: ' The membership is the Founder’s: the Founder invites and removes directly, and an application the members carry comes to the Founder as a 👑 question.',
    'reserved-unilateral': ' The Founder invites and removes directly; an application the members carry needs nobody’s OK.',
    'reserved-assent': ' The Founder no longer invites directly: an application the members carry comes to the Founder as a 👑 question.',
  }[h] || '');
  const msToLocal = (ms) => {
    const d2 = new Date(ms);
    const p2 = (x) => String(x).padStart(2, '0');
    return d2.getFullYear() + '-' + p2(d2.getMonth() + 1) + '-' + p2(d2.getDate()) +
      'T' + p2(d2.getHours()) + ':' + p2(d2.getMinutes());
  };
  // the founder's provisional radio state → the typed value the module takes
  const TYPED = {
    title: () => ({ text: S.title }),
    slug: () => ({ slug: S.slug }),
    ending: () => (S.ending === 'perpetual' ? { endsAtMs: null } : { endsAtMs: Date.parse(S.endsAt) }),
    bar: () => ({ pct: +S.tClose }),
    pace: () => (S.shape === 'ramp' && S.ending !== 'perpetual'
      ? { shape: 'ramp', startPct: +S.tStart } : { shape: 'fixed' }),
    quorum: () => (S.quorumForm === 'count'
      ? { form: 'count', n: +S.quorumN } : { form: 'share', n: +S.quorumPct }),
    authorship: () => ({ rung: S.authorship }),
    signing: () => ({ rung: S.signing }),
    judgments: () => ({ rung: S.judgments }),
    chamber: () => ({ rung: S.chamber }),
    rate: () => ({ grant: +S.grant, cap: Math.max(+S.cap, +S.grant), dripMinutes: +S.dripMin }),
    lapse: () => (S.lapse === 'never' ? { afterMs: null } : { afterMs: +S.lapseDays * 86400000 }),
    machines: () => (S.auditor === true ? { enabled: true, budget: +S.auditorBudget } : { enabled: false, budget: 0 }),
    policy: () => ({ holder: regHolder(), joinPolicy: S.joinBy }),
  };
  // a member's page-vocabulary answer → typed, and back — one place each way
  const ANSTYPED = {
    quorum: (v) => ({ form: S.quorumForm, n: +v }),
    bar: (v) => ({ pct: +v }),
    ending: (v) => (v === 'never' ? { endsAtMs: null } : { endsAtMs: Date.parse(v) }),
    authorship: (v) => ({ rung: v }),
    signing: (v) => ({ rung: v }),
    judgments: (v) => ({ rung: v }),
    chamber: (v) => ({ rung: v }),
    machines: (v) => (v === true ? { enabled: true, budget: +S.auditorBudget || 4 } : { enabled: false, budget: 0 }),
    lapse: (v) => (v === 'never' ? { afterMs: null } : { afterMs: +v * 86400000 }),
    rate: (v) => ({ grant: +v, cap: Math.max(+v, +S.cap || 8), dripMinutes: +S.dripMin || 240 }),
  };
  // a typed value → the page's own vocabulary (what STANDS/DECIDED speak)
  const PAGEVAL = {
    quorum: (v) => v.n, bar: (v) => v.pct, rate: (v) => v.grant,
    ending: (v) => (v.endsAtMs === null ? 'never' : msToLocal(v.endsAtMs)),
    lapse: (v) => (v.afterMs === null ? 'never' : Math.round(v.afterMs / 86400000)),
    machines: (v) => v.enabled,
    authorship: (v) => v.rung, signing: (v) => v.rung,
    judgments: (v) => v.rung, chamber: (v) => v.rung,
    policy: (v) => v.joinPolicy,
  };
  const viewerId = () => (S.viewer === 'applicant' ? null : (viewerRow().mid || FOUNDER));
  const proseText = () => [...prose.children].map((b) => b.textContent).join('\n').trim();
  // which page field carries a setting's delegation radio ('roster' = the members')
  const DKEY = { ending: 'ending', bar: 'barBy', quorum: 'quorumBy',
    authorship: 'authorship', signing: 'signing', judgments: 'judgments',
    chamber: 'chamber', rate: 'rateBy', lapse: 'lapse', machines: 'auditor',
    // v0.52: these three only ever read 'roster' once their options render
    // (title/link after the text confirms, policy after the start)
    title: 'titleBy', slug: 'slugBy', policy: 'policyBy' };
  const wantsDelegate = (k) => { const dk = DKEY[k]; return !!dk && S[dk] === 'roster'; };
  // ✒️ on a setting card: the confirm is a module command (delegate, or
  // reclaim-and-set). Post-start this is the crown's direct change on a
  // reserved setting; the module refuses anything else and the page keeps
  // rendering (mock discipline: commands may fail, rendering may not).
  function commitSetting(k) {
    const mid = midOf(k);
    if (k === 'quorum' && cs.quorumForm !== S.quorumForm) {
      try { cs.setQuorumForm(now(), S.quorumForm); } catch (e) {}
    }
    if (wantsDelegate(k)) { cs.delegate(now(), mid); return; }
    if (csDelegated(k)) cs.reclaim(now(), mid);
    cs.setSetting(now(), mid, TYPED[k]());
    syncPowers(k);
  }
  // the "and afterwards" pair commits here — value first, then powers,
  // because a dropped unilateral forbids setSetting (§9.7 v0.54). Pre-start
  // a flip back is reclaim (§9.6a: powers are as revisable as values until
  // judging opens); post-start the surface only offers the one-way moves.
  function syncPowers(k) {
    if (k === 'policy') return; // the register's pair rides its value
    const st = csState(k);
    if (!st || st.holder !== 'convenor') return;
    const want = pwOf(k), have = pwCur(k);
    if (want === have) return;
    if (have === 'both' && want === 'unilateral') cs.relinquish(now(), midOf(k), 'assent');
    else if (have === 'both' && want === 'assent') cs.relinquish(now(), midOf(k), 'unilateral');
    else if (want === 'both') cs.reclaim(now(), midOf(k));
  }

  const S = {
    title: '', slug: '',
    titleBy: 'founder', slugBy: 'founder', policyBy: 'founder',
    emailSent: false, emailVerified: false, mailOpen: false,
    viewer: 0,
    app: { started: false, email: '', emailSent: false, emailVerified: false,
      mailOpen: false, name: '', pic: '', text: '', submitted: false, csId: null },
    ending: 'roster', endsAt: '2026-08-20T18:00',
    barBy: 'roster', tClose: 78, shape: 'ramp', tStart: 55,
    quorumBy: 'roster', quorumForm: 'share', quorumPct: 33, quorumN: 5,
    joinBy: 'invite', rosterBy: 'roster',
    lapse: 'roster', lapseDays: 90,
    authorship: 'roster', signing: 'roster', judgments: 'roster',
    rateBy: 'founder', grant: 4, dripMin: 180, cap: 8,
    chamber: 'roster', auditor: false, auditorBudget: 6,
    roster: [{ n: '', e: '', role: 'member', founder: true, in: true, ans: {}, okd: new Set(), mid: 'founder' }],
    // **Confirmed, not merely defaulted** (Ed, 2026-08-17). A default nobody
    // read is not a decision, and these are the decisions that cannot be changed
    // once people are drafting. So a card carries its value from the first
    // render — the rail is never a list of blanks — and stays yellow until it
    // has been opened and committed.
    seen: new Set(),
    open: null,
  };
  // ---- who is looking (Ed, 362: a dev dropdown of the actual users) ----
  // Per-user state lives on the roster rows; S.myAns / S.okd / S.myname…
  // are accessors delegating to whoever is in the chair, so every existing
  // call site reads and writes the current viewer without knowing it.
  const APP_STUB = { n: '', pic: '', role: 'applicant', ans: {}, okd: new Set() };
  const viewerRow = () => (S.viewer === 'applicant' ? APP_STUB : (S.roster[S.viewer] || S.roster[0]));
  const amFounder = () => !!viewerRow().founder;
  // any reservation crowns (Q379 wide): the module's read where it exists,
  // the radios' before the save. startingText never counts (no post-start
  // change route); title and link always do, so this is true until Q381.
  const founderCrowned = () => (cs ? cs.crowned()
    : DELEGABLE.some((key) => S[key] !== 'roster') || S.rosterBy === 'founder' || true);
  const viewerIsMember = () => S.viewer !== 'applicant' && viewerRow().role !== 'clerk';
  for (const [prop, key] of [['myname', 'n'], ['mypic', 'pic'], ['myemail', 'e']]) {
    Object.defineProperty(S, prop, { get: () => viewerRow()[key] || '',
      set: (v) => { viewerRow()[key] = v; } });
  }
  Object.defineProperty(S, 'myAns', { get: () => (viewerRow().ans || (viewerRow().ans = {})) });
  Object.defineProperty(S, 'okd', { get: () => (viewerRow().okd || (viewerRow().okd = new Set())) });
  // a motion draft and your consent answers are yours, not the room's
  Object.defineProperty(S, 'mAns', { get: () => (viewerRow().mAns || (viewerRow().mAns = {})) });
  Object.defineProperty(S, 'draft', { get: () => viewerRow().draft || null,
    set: (v) => { viewerRow().draft = v; } });
  const me = () => ({ n: S.myname, pic: S.mypic });

  // Everybody on the roster is a member; the only person who might not be is
  // the founder, who may be the clerk instead. There is no observer here —
  // see the chamber card.
  const members = () => S.roster.filter((p) => p.role !== 'clerk');
  // **Membership begins at first arrival, not at invitation** (Ed, 2026-08-18,
  // §9.6a). An invitee is listed under the membership as *invited* and counts
  // toward nothing — which is what keeps one unopened email from blocking
  // judging for everybody. E is the arrived.
  const arrived = () => (cs ? cs.E() : members().filter((m) => m.in).length);
  const E = () => Math.max(arrived(), 1);
  const meRow = () => S.roster.find((p) => p.founder);
  const iDraft = () => { const m = meRow(); return !!m && m.role !== 'clerk'; };
  const quorumCount = () => {
    const st = csState('quorum');
    if (st && st.value) return Math.min(M.quorumCount(st.value, E()), E());
    return (S.quorumForm === 'share'
      ? Math.max(1, Math.round(E() * S.quorumPct / 100)) : Math.min(S.quorumN, E()));
  };
  const endingVal = () => takenOf('ending') ||
    (S.ending === 'roster' ? null : S.ending === 'perpetual' ? 'never' : S.endsAt);
  const perpetual = () => endingVal() === 'never';
  const SLUG_OK = /^[a-z0-9][a-z0-9-]{2,}$/;
  const EMAIL_OK = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  // The mockup's stand-in for the real registry check: these slugs exist, so
  // a title that collides gets a short suffix — which is also why the
  // fixture's own link ends in one.
  const TAKEN = new Set(['hollow-oak-club', 'the-hollow-oak-club',
    'the-hollow-oak-club-house-charter', 'house-charter', 'charter']);
  const slugify = (t) => t.toLowerCase().replace(/['’]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40)
    .replace(/-+$/g, '');
  // deterministic, so the mockup behaves the same on every load
  const suffix = (t) => Math.abs([...t].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) | 0, 7))
    .toString(16).slice(0, 4);
  const suggestSlug = (title) => {
    const base = slugify(title);
    if (!base || base.length < 3) return { slug: 'untitled-' + suffix(title || 'x'), taken: null };
    return TAKEN.has(base) ? { slug: base + '-' + suffix(title), taken: base } : { slug: base, taken: null };
  };

  // ---- the document ------------------------------------------------------
  function relabel() {
    const sel = getSelection();
    const at = sel.rangeCount ? sel.getRangeAt(0).startContainer : null;
    for (const b of [...prose.children]) {
      const t = b.textContent;
      const m = t.match(/^(#{1,3})\s+/);
      if (m) {
        const liveHere = at && b.contains(at);
        b.textContent = t.slice(m[0].length);
        b.className = 'docline lvl' + m[1].length;
        b.dataset.h = b.textContent;
        if (liveHere && b.firstChild) {
          const r = document.createRange();
          r.setStart(b.firstChild, 0); r.collapse(true);
          sel.removeAllRanges(); sel.addRange(r);
        }
      } else if (b.className) { b.dataset.h = t; } else { delete b.dataset.h; }
    }
    prose.classList.toggle('empty', prose.textContent.trim() === '');
    renderToc(); render();
  }
  function renderToc() {
    const hs = [...prose.children].filter((b) => b.dataset.h !== undefined);
    // the constitution's sections lead the table of contents (Ed,
    // 2026-08-18); on this surface they appear as their cards do
    // the outline lists only what exists: before the save there is no
    // constitution to point at (Ed, 2026-08-18)
    document.getElementById('toc').innerHTML =
      (!settled(card('slug')) ? '' :
      '<li class="lvl1"><a href="#cs-constitution">Constitution</a></li>' +
      secLive().filter((s2) => !s2.railOnly).map((s2) =>
        '<li class="lvl2"><a href="#cs-' + s2.key + '">' + esc(s2.title) + '</a></li>').join('')) +
      hs.map((b, i) => {
      b.id = 'h' + i;
      const lvl = (b.className.match(/lvl(\d)/) || [0, 2])[1];
      return '<li class="lvl' + lvl + '"><a href="#h' + i + '">' + esc(b.dataset.h) + '</a></li>';
    }).join('');
  }
  prose.addEventListener('paste', (ev) => {
    ev.preventDefault();
    const txt = (ev.clipboardData || window.clipboardData).getData('text');
    let lines = txt.split(/\n{2,}|\n/).filter((l) => l.trim());
    const first = lines[0] && lines[0].match(/^#\s+(.+)$/);
    if (first && !S.title) { S.title = first[1]; lines = lines.slice(1);
      S.seen.add('title');
      if (!S.slug) { const sg = suggestSlug(S.title); S.slug = sg.slug; S.slugTaken = sg.taken; } }
    document.execCommand('insertHTML', false, lines.map((l) => '<div>' + esc(l) + '</div>').join(''));
    setTimeout(relabel, 0);
  });
  prose.addEventListener('input', relabel);

  // ---- the nineteen decisions ----------------------------------------------
  // **One card per decision, and the test is whether somebody could answer it
  // differently and on its own** (Ed, 2026-08-18: *break them down as much as
  // you can — picture and name separate! — admin choosing if they're a
  // participant — etc*). Both of his examples are the same fault: two questions
  // of *different kinds* bundled into one card because they happened to be asked
  // at the same moment. A picture and a name; a membership and whether the
  // founder is in it; how many ✏️s you start with and how fast they come back.
  //
  // `key` is the state field that carries delegation, and it is what decides
  // which **pile** a card stands in: taking a setting back moves its tab from
  // the members' pile to the founder's, in front of you.
  const DELEGABLE = ['ending', 'barBy', 'quorumBy', 'authorship', 'signing',
    'judgments', 'rateBy', 'chamber', 'auditor', 'lapse'];
  const delegated = (key) => DELEGABLE.includes(key) && S[key] === 'roster';

  // **The gates are cards** (Ed, 330b) — see the ceremony surface for the
  // reasoning. Here they wait on the founder's own work rather than on a
  // room, and they stand in the members' pile because what they gate is what
  // the members will be able to do.
  const GATES = [
    { k: 'canpropose', g: '✏️', t: 'Proposing', own: 'you', isGate: true,
      open: () => !!cs && !!viewerId() && cs.canPropose(viewerId()),
      why: 'Members can read a document from the first second, and they cannot propose against a text that is not there yet — nor should you be able to act on a document whose rules you have not yet said what you will accept of — so your own outstanding answers wait here too.',
      waiting: 'Waiting on the starting text, and on your own answers.',
      done: 'Open — members can propose as soon as they arrive.',
      blockers: () => [card('text')].filter((c) => !settled(c)).concat(LIVE().filter(owesAnswer)) },
    { k: 'canjudge', g: '⚖️', t: 'Judging', own: 'you', isGate: true,
      open: () => canJudge(),
      why: 'A judgment is counted towards a quorum and recorded under a disclosure rule, so none of the constitution can be settled after it without changing what the judgment was.',
      waiting: 'Waiting on the constitution.',
      done: 'Open — the constitution is settled.',
      blockers: () => ceremony().filter((c) => !settled(c) || (isRoom(c) && (c.in || 0) < E())) },
  ];

  const CARDS = [
    // — the opening order is Ed's, card by card (2026-08-18): **title →
    // email (verified) → link → the rest**. The first three are the order
    // of existence — a name, the address that can always get back in, the
    // address that saves it — and then everything that lives inside the
    // saved document. Each is born when the one before it settles, so
    // arriving at docs.vote you are asked exactly one thing.
    // inDoc: the document's own heading IS the title (Ed, 2026-08-18) — no
    // paragraph restates it; the heading opens the card
    { k: 'title', g: '🏷️', t: 'Title', kind: 'ordinary', inDoc: true, ready: () => !!S.title, changeable: true },
    // Pre-filled with a slug generated from the title and checked against the
    // ones that already exist; confirming it is what SAVES the document.
    // **The address is verified before anything is saved** (Ed, 2026-08-18:
    // *we should do this before saving anything, just in case a founder
    // loses their ability to log in*). There are no passwords — getting back
    // in is a magic link — so the first mail is the proof the address works,
    // sent while nothing yet exists and a typo still costs nothing. The mail
    // is the login: clicking it is what carries you on to the save.
    { k: 'myemail', g: '📧', t: 'Your Email', kind: 'personal', own: 'you', dep: ['title'],
      hide: () => !amFounder(), ready: () => S.emailVerified, changeable: true },
    { k: 'slug', g: '🔗', t: 'Link', kind: 'ordinary', dep: ['myemail'], ready: () => SLUG_OK.test(S.slug), changeable: true },
    // — the rest, together once the document exists ----------------------
    // 🎩 folded into 🪪 (Ed, 2026-08-18): whether the founder is a
    // member is just whether they invite themselves, asked as their own
    // pre-checked row in the membership card.
    { k: 'roster', g: '🪪', t: 'Membership', kind: 'constitutional', dep: ['policy'], ready: () => members().length >= 1, changeable: true },
    // **The register and the door are two decisions** (Ed, 2026-08-18: *We
    // should separate "Membership" which is the register of people who are
    // members from "Membership Policy" which is how people become members
    // after the ceremony*). The one-card test agrees: who is in the room
    // now, and how anybody gets in later, can be answered differently and
    // on their own.
    { k: 'policy', g: '🤝', t: 'Applications', kind: 'constitutional', dep: ['slug'], changeable: true },
    // optional for a clerk (Ed, 2026-08-18): an anonymous founder is a
    // perfectly ordinary thing — they can simply not set a name or picture
    { k: 'myname', g: '✋', t: 'Your Name', kind: 'personal', own: 'you', dep: ['slug'], ready: () => (iDraft() ? !!S.myname.trim() : true), changeable: true },
    { k: 'mypic', g: '🖼️', t: 'Your Picture', kind: 'personal', own: 'you', dep: ['slug'], changeable: true },
    // A document may start empty, which is why this is not a blocker on having
    // content but on having *decided*: a page nobody has looked at and a page
    // somebody chose to leave blank look identical, and only one of them should
    // let people start proposing.
    { k: 'text', g: '📄', t: 'Starting Text', kind: 'ordinary', dep: ['slug'], gate: 'propose' },

    // — the document's shape --------------------------------------------
    // **When it ends and whether it ends are one card** (Ed, 2026-08-18:
    // *“if it ends” is just the “never” option*). They had been split under the
    // one-card-per-decision rule, and the split does not survive that rule's own
    // test — you cannot answer *when* differently from *whether*, because
    // **never** is one of the answers to *when*. What made them look like two
    // decisions is that they take different routes to change afterwards, and
    // that is a fact about the motion rather than about the question (Q329).
    { k: 'ending', g: '⏰', t: 'When Does It End?', kind: 'constitutional', motionKind: 'ordinary',
      key: 'ending', dep: ['roster'], p: 0.5,
      // 329(a): *never* is the constitutional answer; any date is ordinary.
      routeOf: (v) => (/never|perpetual|no end/i.test(v) ? 'constitutional' : 'ordinary'),
      routeNote: 'Which route this takes depends on what you write. A different date is a proposal (✏️), judged like any other. Never — no ending at all — re-opens the founding question instead, because a document with no ending has no rising threshold, and every decision already taken was taken under one.',

      ready: () => S.ending !== 'ends' || !!S.endsAt,
      knote: '<b>Whether</b> it ends is constitutional: a document with no ending has no ramp, so every past adoption would mean something different. <b>When</b> it ends is not — a date can be moved by proposal (✏️), because moving it changes nothing that has already happened.',
      rule: 'Each member says when they want it to end and the <b>latest</b> answer is taken — <b>never</b> being the latest of all — so nobody is cut off before they were ready.',
      takes: 'The document takes the latest', result: 'Saturday 18:00',
      dist: [2, 3, 5, 3, 1], distTop: 4, distEnds: ['Tue', 'Never'] },

    // — the constitution -------------------------------------------------
    // **The threshold is two decisions of different kinds** (Ed, 2026-08-18,
    // Q341). Consent is about the bar **at the close**, where an adoption is
    // permanent — one number. How it gets there is *pacing*, ordinary by §9.6's
    // own test, on the next card.
    { k: 'bar', g: '✒️', t: 'How Sure Must the Room Be?', kind: 'constitutional', gate: 'judge', key: 'barBy', dep: ['ending'], p: 0.64,
      rule: 'Each member states the <b>lowest bar</b> they will accept — at the close, where an adoption is permanent — and the document takes the highest, so it will never be easier to change than any one of them wanted.',
      takes: 'The document takes the highest', result: '80%',
      dist: [0, 1, 2, 3, 2, 1, 2, 1, 1, 1], distTop: 8, distEnds: ['50%', '95%'] },
    { k: 'pace', g: '📈', t: 'How Does the Bar Get There?', kind: 'ordinary', dep: ['ending'], changeable: true },
    // The number is the room's; the **form** — count or share — is the
    // founder's wording of the question (Ed, 2026-08-18: *quorum can either be
    // a fixed number or a proportion of membership size*; §9.0a).
    { k: 'quorum', g: '👥', t: 'Quorum', kind: 'constitutional', gate: 'judge', key: 'quorumBy', dep: ['roster'], p: 0.79,
      rule: 'Each member states the <b>lowest quorum</b> they will accept and the document takes the highest.',
      takes: 'The document takes the highest', result: '10 of 14',
      dist: [0, 0, 1, 1, 2, 3, 2, 2, 1, 1, 1, 0, 0, 0], distTop: 9, distEnds: ['1 of 14', 'all of them'] },
    { k: 'authorship', g: '👤', t: 'When Is a Proposer Named?', kind: 'constitutional', gate: 'judge', key: 'authorship', dep: ['roster'], p: 0.5,
      rule: 'A privacy question, so it runs the other way and takes the <b>most private</b> answer: one member who wants to stay unnamed keeps the whole document unnamed.',
      takes: 'The document takes the most private', result: 'Nobody’s name, ever',
      dist: [8, 4, 2], distTop: 0, distEnds: ['No names, ever', 'Names from the start'] },
    { k: 'signing', g: '✍️', t: 'Who May Sign a Proposal?', kind: 'constitutional', gate: 'judge', key: 'signing', dep: ['roster'], p: 0.5,
      rule: 'Also a privacy question, and the <b>most private</b> answer wins.',
      takes: 'The document takes the most private', result: 'Nobody signs',
      dist: [9, 3, 2], distTop: 0, distEnds: ['Nobody signs', 'Everybody signs'] },
    { k: 'judgments', g: '👁️', t: 'When Are Judgments Revealed?', kind: 'constitutional', gate: 'judge', key: 'judgments', dep: ['roster'], p: 0.86,
      rule: 'Never revealed while a question is live, whichever is chosen. What this settles is only whether they are published with the record.',
      takes: 'The document takes the most private', result: 'Never revealed',
      dist: [11, 3], distTop: 0, distEnds: ['Never', 'After the decision'] },

    // — the **proposal rate**: how often anybody may propose ---------------
    // Not an “economy” and not “tokens” (Ed, 2026-08-18). Both words describe
    // the machinery from the outside; what a member is being asked is how
    // often they may propose, and that is two decisions — how many ✏️s they
    // start with, and how fast a spent one comes back.
    //
    // It is **not three**: the stake is a flat 1 and always was (§13 parameters,
    // §7), so the card that offered to set it was offering a decision the
    // mechanism does not have (Ed, 2026-08-18: *isn’t the stake fixed at 1?*).
    // **One decision, not two** (Ed, 2026-08-18: the grant and the drip
    // merged — the rate is one thought, stated as one sentence)
    { k: 'rate', g: '⏱️', t: 'Proposal Rate', kind: 'ordinary', key: 'rateBy', dep: ['roster'], p: 0.36,
      rule: 'Each member states the <b>most generous</b> rate they would accept, and the document takes it.',
      takes: 'The document takes the most generous', result: '5 each, one back every 120 minutes',
      dist: [1, 2, 4, 3, 2, 1, 1], distTop: 4, distEnds: ['sparing', 'generous'] },

    // — the room around it ------------------------------------------------
    // gate 'judge': constitutional (§9.6 disclosure family), so judging waits
    // on it — the member surface already did, and the two disagreed (review
    // finding, 2026-08-18)
    { k: 'chamber', g: '🌍', t: 'Visibility', kind: 'constitutional', gate: 'judge', key: 'chamber', dep: ['roster'], p: 0.43,
      rule: 'A privacy question, so the <b>most private</b> answer wins: one member who wants the room closed closes it.',
      takes: 'The document takes the most private', result: 'Members only',
      dist: [5, 8, 1], distTop: 1, distEnds: ['Members only', 'Public'] },
    // **Do memberships lapse?** (Ed, 2026-08-18, closing Q345 with the sunset
    // option.) Constitutional — it is a rule about the roster, and it passes
    // §9.6's test the honest way round: it re-rates nothing already decided,
    // and it binds by consent, since everyone stated the shortest spell they
    // would accept on the way in.
    { k: 'lapse', g: '💤', t: 'Do Memberships Lapse?', kind: 'constitutional', gate: 'judge', key: 'lapse', dep: ['roster'], p: 0.29,
      rule: 'Each member states the <b>shortest period of inactivity</b> they would accept being lapsed after, and the document takes the longest — <b>never</b> being the longest of all — so nobody is lapsed faster than they accepted.',
      takes: 'The document takes the longest', result: 'Never',
      dist: [1, 3, 4, 2, 4], distTop: 4, distEnds: ['30 days', 'Never'] },
    // **Not a member** (Ed, 2026-08-18): it never judges and counts toward
    // nothing — it only proposes, so it lives with the proposal settings.
    // **Ordinary since Q352** (Ed, same day): switching it re-rates nothing
    // already decided, so it defaults to the founder and judging never
    // waits on it; delegating it is still the founder's option.
    { k: 'machines', g: '🤖', t: 'AI Proposals', kind: 'ordinary', key: 'auditor', dep: ['roster'], p: 0.86,
      rule: 'The <b>most restrictive</b> answer wins, so a single member who would rather not draft alongside a machine keeps it out.',
      takes: 'The document takes the most restrictive', result: 'People only',
      dist: [9, 5], distTop: 0, distEnds: ['People only', 'A machine is fine'] },
  ];
  const card = (k) => CARDS.find((c) => c.k === k) || ANS.find((c) => c.k === k) ||
    GATES.find((c) => c.k === k);
  const isRoom = (c) => !!(c.key && delegated(c.key));
  // who holds it (§9.7 v0.52): any setting the founder has delegated —
  // pre-start into its founding question, post-start as a hand-over — is
  // the members', and the founder composes on it like any member
  // committed truth first (363a: choosing and committing are two acts —
  // the radio is provisional, and it must not re-render the card as the
  // members' before the ✒️ commits the hand-over); isRoom's provisional
  // read survives only where the module holds no state for the key
  const membersHold = (c) => { const st = csState(c.k);
    return st ? st.holder === 'members' : isRoom(c); };
  // the watch-half only where a blind question actually ran (or is running):
  // a post-start hand-over asks the room nothing, so there is nothing to watch
  const wasAsked = (c) => { const st = csState(c.k);
    return st ? (!!st.collecting || st.distribution !== null) : isRoom(c); };
  // **Your own answer is a separate card in the membership pile** (Ed,
  // 2026-08-18, revising the both-halves-on-one-card build of the same
  // morning): delegating is one act and answering is another, done later and
  // wearing a different hat — so the setting card stays in the founder's
  // pile with the delegation radio and the watching half, and handing a
  // question to the room makes a question card **appear** in the membership
  // pile, which is the same card a member gets. Nothing jumps piles any
  // more, which also closes Q323: delegation reads as a birth rather than a
  // teleport.
  const ansKey = (c) => c.ansFor || c.k;
  // **Choosing and committing are two acts** (Ed, 363a, 2026-08-18): a blind
  // question's answers feed a count everyone sees and resolve to maxima, so
  // a stray click while exploring the ladder must not be an answer. Touching
  // the control fills a provisional value (which is what wakes the ✓); the ✓
  // commits it, and only committed answers count anywhere — the tally, the
  // gates, the resolution. Every other card already works this way.
  const filled = (c) => S.myAns[ansKey(c)] !== null && S.myAns[ansKey(c)] !== undefined;
  // committed = the answer reached the module; provisional stays page-side
  const answered = (c) => { const st = csState(ansKey(c));
    return !!st && st.answers.has(viewerId()); };
  const owesAnswer = (c) => !!c.ansFor && viewerIsMember() && !answered(c);
  const ready = (c) => (c.ansFor ? filled(c) : c.ready ? c.ready() : true);
  const settled = (c) => {
    if (c.isGate) return S.okd.has(c.k);
    if (c.ansFor) return answered(c);
    if (!S.seen.has(c.k) || !ready(c)) return false; // confirmed, not defaulted
    if (!cs) return true;                            // pre-save: title, email
    if (c.k === 'text') return cs.textConfirmed;
    const st = csState(c.k);
    if (st) return st.holder === 'members' ? true : st.settledBy !== null;
    return true;                                     // roster, personal cards
  };
  // nothing on a founder-held card is asked of anybody else: a member sees
  // it waiting (⏳) until it settles, then as news to acknowledge
  const mustAct = (c) => (motionOn(c) ? (viewerIsMember() && !answeredMotion(c))
    : c.isGate ? (c.open() && !S.okd.has(c.k))
    : c.ansFor || c.own === 'you' || amFounder() ? !settled(c)
    : false);
  // How far the room has got, against the roster **as it stands** — held as a
  // proportion because a founder's roster starts at one person and grows.
  // The fixture's other members answer in proportion, but never the
  // founder's own share: a question cannot read as resolved while the one
  // answer the surface can actually collect is still outstanding.
  // how far the room has got: the module's blind count, nothing invented —
  // the p-fixture arithmetic died with the shadow engine (plan 367a)
  const resolveCounts = () => CARDS.forEach((c) => { if (c.key || c.p != null) {
    const st = csState(c.k);
    if (!st) { c.in = 0; return; }
    if (st.settledBy === 'ceremony') { c.in = E(); return; }
    const eIds = cs.motionElectorate();
    c.in = eIds.filter((id) => st.answers.has(id)).length;
  } });

  // **A card with a dependency does not appear until its dependency is settled**
  // (Ed, 2026-08-18: *if there are dependencies, just don't show them the next
  // cards until they're done*). Two dependencies, both real: anything the room
  // can be asked waits on the **roster**, since *the members decide* means
  // nothing until there are members; and the threshold, the drip and the ending
  // date wait on **whether it ends**, since a rising bar needs an endpoint and
  // the drip is paced against one.
  const visible = (c) => (c.ansFor
    ? viewerIsMember() && isRoom(card(c.ansFor)) && visible(card(c.ansFor))
    : !(c.hide && c.hide()) && (c.dep || []).every((k) => settled(card(k))));
  // One question card per delegable setting, born when its setting is handed
  // over and gone if it is taken back. Same glyph, same title — it is the
  // same question — told apart by whose pile it stands in.
  const ANS = CARDS.filter((c) => c.key && ANSWER[c.k]).map((c) => ({
    k: 'ans-' + c.k, g: c.g, t: c.t, kind: c.kind, own: 'you', ansFor: c.k }));
  const LIVE = () => CARDS.concat(ANS, GATES).filter(visible);
  // **The sections of the constitution** (Ed, 2026-08-18): subtitles his
  // ask, the grouping and the prose mine to draft — each line says what
  // the section governs, in the surface's own words.
  const SEC = [
    // no intro line (Ed, 2026-08-18) — the sentences are the section
    { key: 'members', title: 'Membership',
      text: '',
      keys: ['roster', 'policy', 'lapse', 'myemail', 'myname', 'mypic'],
      // **Members and Applications are subsections** (Ed, 2026-08-18):
      // Members IS the list — 🪪, the tab for invitations, stands beside
      // it, and the bottom row is your own membership wearing the ✋ and
      // 🖼️ tabs. Applications is the 🤝 decision (its Applicants list
      // arrives with the first applicant, after the start).
      body: (h) => {
        const my = ['myname', 'mypic'].map(card).filter((c) => c && visible(c));
        const others = S.roster.filter((p) => !p.founder);
        const list = '<div class="memlist">' +
          others.map((p) => '<div class="memrow">' + avHtml(p) +
            '<span class="mn">' + esc(p.n || p.e || '—') +
            (p.in ? '' : ' <span class="chip pending">invited</span>') + '</span></div>').join('') +
          '<div class="memrow meRow">' + (my.length ? h.pile(my) : '') + avHtml(me()) +
          '<span class="mn">' + esc(S.myname || 'Not named yet') + ' <span class="chip founder">founder</span> <span class="chip">you</span>' +
          (iDraft() ? '' : ' <span class="chip">clerk</span>') + '</span></div></div>';
        const openId = my.find((c) => S.open === c.k);
        const rest = ['myemail']
          .map(card).filter((c) => c && visible(c));
        // policy first, lapse under it, then the Members list (Ed)
        return (visible(card('policy')) ? h.para(card('policy')) : '') +
          (visible(card('lapse')) ? h.para(card('lapse')) + h.tasks(card('lapse')) : '') +
          '<h2 class="docline lvl3">Members</h2>' +
          (S.open === 'roster' ? h.para(card('roster'))
            : visible(card('roster'))
            ? '<div class="cpara"><span class="chipcol">' + h.chip(card('roster')) + '</span>' + list + '</div>'
            : '') +
          (openId ? h.paraWith(openId, my) : '') +
          rest.map((c) => h.para(c) + h.tasks(c)).join('');
      } },
    // the gates lead the Proposals section (Ed, 2026-08-18)
    { key: 'rate', title: 'Proposals',
      text: 'How often anybody may put something to the room, and whether an AI drafts proposals alongside them.',
      keys: ['canpropose', 'canjudge', 'rate', 'machines'] },
    { key: 'deciding', title: 'Decisions',
      text: 'How a change carries: how many must weigh in, how sure the room must be, and when the document ends.',
      keys: ['ending', 'quorum', 'bar', 'pace'] },
    { key: 'privacy', title: 'Privacy',
      text: 'Who is seen doing what — proposing, signing, judging — and who may read the document at all.',
      keys: ['authorship', 'signing', 'judgments', 'chamber'] },
    // rail-only: the title is the heading, the link leads the constitution,
    // and the starting text anchors the prose (Ed, 2026-08-18)
    { key: 'doc', title: 'The Document', railOnly: true,
      text: '', keys: ['title', 'slug', 'text'] },
  ];
  const secLive = () => SEC.map((s2) => ({ ...s2,
    cards: s2.keys.map(card).filter((c) => c && visible(c)) }))
    .filter((s2) => s2.cards.length);
  // a delegated setting's paragraph is followed by the founder's own
  // answer-task, the same card a member gets, standing where the rule is
  // a resolved question keeps no answer-task paragraph: the rule above it
  // now states the outcome, and a standing “has answered” line under a
  // decided rule is a task that finished still asking to be read
  const tasksFor = (c) => (c.key && ANSWER[c.k] && (c.in || 0) < E()
    ? [card('ans-' + c.k)].filter((x) => x && visible(x)) : []);
  // A member who has not opened the document yet is drawn faintly rather than
  // left out: they are on the membership, which is the fact the heading is
  // stating, and whether they have looked at it yet is a different one.
  const groups = () => [
    { key: 'constitution', label: 'Constitution',
      sections: secLive(),
      // Founded by [avatar] [name] — only once the founder has a name; the
      // founding time is never known before the start (Ed)
      lead: (h) => (visible(card('slug')) ? h.para(card('slug')) : '') +
        (S.myname.trim()
          ? '<div class="cpara notab"><p class="cpv founded">Founded by ' +
            avHtml(me()) + ' ' + esc(S.myname) +
            // 👑 by any reservation (Ed, Q379 wide); 📯 = holds nothing.
            // Today the title and link cannot be handed over, so every
            // founder is a 👑 until Q381's exit lands — drawn honestly.
            ' <span title="' + (founderCrowned()
              ? 'Part of the constitution is reserved: changing it needs the founder’s assent'
              : 'The founder reserves nothing — no special part in the document') + '">' +
            (founderCrowned() ? '👑' : '📯') + '</span>.</p></div>' : ''),
      textAnchor: (h) => (!visible(card('text')) ? ''
        : S.open === 'text' ? h.para(card('text'))
        : '<div class="cpara textanchor"><span class="chipcol">' + h.chip(card('text')) + '</span></div>'),
      note: (n) => (n ? n + ' still to confirm or answer' : 'all confirmed') },
  ];

  const VALUE = {
    text: () => { const n = [...prose.children].filter((b) => b.textContent.trim()).length;
      return n ? n + ' blocks' : (S.seen.has('text') ? 'Starts empty — the room writes it' : 'Nothing yet'); },
    title: () => S.title || 'Not named yet',
    slug: () => 'docs.vote/' + (S.slug || '…'),
    myemail: () => (S.emailVerified ? S.myemail + ' · verified'
      : S.emailSent ? 'Check your inbox' : 'Not given yet'),
    myname: () => S.myname || 'Not given yet',
    mypic: () => (S.mypic ? 'Chosen' : 'Your initials'),
    // an invitee is not a member yet (§9.6a): the line counts the arrived,
    // and says who is still only invited
    roster: () => arrived() + (arrived() === 1 ? ' member' : ' members') +
      (members().length > arrived() ? ' · ' + (members().length - arrived()) + ' invited' : '') +
      (iDraft() ? '' : ' · you are the clerk'),
    policy: () => { const v = takenValOf('policy');
      return ({ invite: 'Invitation only', proposed: 'Applications by proposal',
        apply: 'Anyone may apply', open: 'Open' }[v ? v.joinPolicy : S.joinBy]) +
        ((v ? v.holder !== 'members' : S.rosterBy === 'founder') ? ' · 👑 reserved' : ''); },
    ending: () => (perpetual() ? 'Never — it runs until it is frozen'
      : new Date(endingVal() || S.endsAt).toLocaleString(undefined,
        { weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false })),
    bar: () => (takenOf('bar') || S.tClose) + '% sure at the close',
    pace: () => { const v = takenValOf('pace');
      const shape2 = v ? v.shape : S.shape;
      const start2 = v && v.shape === 'ramp' ? v.startPct : S.tStart;
      return (perpetual() ? 'Fixed — no window to rise over'
        : shape2 === 'ramp' ? 'Rising from ' + start2 + '%' : 'The close bar throughout'); },
    quorum: () => (S.quorumForm === 'count'
      ? Math.min(takenOf('quorum') || S.quorumN, E()) + ' of ' + E()
      : (takenOf('quorum') || S.quorumPct) + '% — ' + quorumCount() + ' of ' + E()),
    authorship: () => ({ anonymous: 'Nobody’s name, ever', sealed: 'Names at the close',
      public: 'Names from the start' }[takenOf('authorship') || (S.authorship === 'roster' ? 'anonymous' : S.authorship)]),
    signing: () => ({ nobody: 'Nobody signs', each: 'Each author chooses', everybody: 'Everybody signs' }[
      takenOf('signing') || (S.signing === 'roster' ? 'nobody' : S.signing)]),
    judgments: () => ({ never: 'Never revealed', after: 'Revealed after the decision' }[
      takenOf('judgments') || (S.judgments === 'roster' ? 'never' : S.judgments)]),
    rate: () => { const v = takenValOf('rate');
      return (v ? v.grant : S.grant) + ' each · +1 every ' + (v ? v.dripMinutes : S.dripMin) +
        ' min · cap ' + (v ? v.cap : S.cap); },
    chamber: () => ({ link: 'Anyone with the link', closed: 'Members only', public: 'Public' }[S.chamber]),
    machines: () => { const tv = takenValOf('machines');
      const on = tv ? tv.enabled : S.auditor === true;
      return (on ? 'The coherence auditor, ' + (tv && tv.enabled ? tv.budget : S.auditorBudget) + ' ✏️s' : 'People only'); },
    lapse: () => (S.lapse === 'never' ? 'Never — however long inactive'
      : 'After ' + S.lapseDays + ' days of inactivity'),
    canpropose: () => (canPropose() ? 'Open' : 'Waiting on the starting text'),
    canjudge: () => (canJudge() ? 'Open' : 'Waiting on the constitution'),
  };
  const ANSVALUE = {
    quorum: (v) => 'You said ' + v + ' of ' + E(),
    bar: (v) => 'You said ' + v + '%',
    ending: (v) => (v === 'never' ? 'You said never'
      : 'You said ' + (isNaN(Date.parse(v)) ? v
        : new Date(v).toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false }))),
    authorship: (v) => 'You said ' + ({ anonymous: 'no names, ever', sealed: 'names at the close', public: 'names from the start' }[v] || v),
    signing: (v) => 'You said ' + ({ nobody: 'nobody signs', each: 'each author chooses', everybody: 'everybody signs' }[v] || v),
    judgments: (v) => 'You said ' + ({ never: 'never revealed', after: 'revealed after the decision' }[v] || v),
    chamber: (v) => 'You said ' + ({ closed: 'members only', link: 'anyone with the link', public: 'public' }[v] || v),
    machines: (v) => 'You said ' + (v ? 'AI proposals are fine' : 'no AI proposals'),
    lapse: (v) => (v === 'never' ? 'You said never' : 'You said after ' + v + ' days of inactivity'),
    rate: (v) => 'You said ' + v,
  };
  const ANSASK = { quorum: 'The lowest you will accept', bar: 'The lowest you will accept',
    ending: 'The latest you will accept', authorship: 'The most you will accept',
    signing: 'The most you will accept', judgments: 'The most you will accept',
    chamber: 'The most you will accept', machines: 'The most you will accept',
    lapse: 'The shortest you will accept',
    rate: 'The most generous you will accept' };
  const value = (c) => (c.ansFor
    ? esc(filled(c) ? ANSVALUE[c.ansFor](S.myAns[c.ansFor]) : ANSASK[c.ansFor])
    : esc(VALUE[c.k]()));
  const summary = (c) => {
    const m = motionOn(c);
    if (m) return 'Under motion — ' + esc(m.to);
    return (c.k === 'title' ? '' : isRoom(c)
    ? (settled(c) ? '<i>The members decide</i> · ' + someIn(c.in || 0, E()) : '<i>The members decide</i>')
    : value(c));
  };

  // **What is unlocked, and by what.** Reading needs nothing. Proposing needs a
  // text to propose against. Judging needs the constitution settled, because a
  // judgment is *recorded under a disclosure setting* and *counted towards a
  // quorum*, and neither can be decided after the judgment without changing what
  // the judgment was.
  const canPropose = () => !!cs && cs.textConfirmed;
  const ceremony = () => CARDS.filter((c) => c.gate === 'judge');
  const canJudge = () => !!cs && cs.canJudge();

  // ---- motions (stage D of the merge, Ed 361) ---------------------------
  // A motion is the act of changing a **settled** document's rules (§9.6a):
  // before judging opens there are no past decisions for a change to re-rate,
  // so nothing is amended, only set — the founder re-sets freely, and these
  // exist only once the constitution is settled and judging is open.
  const motionsLive = () => canJudge();
  // ---- motions live in the module (9c): the page renders records --------
  const PKEY = { link: 'slug', startingText: 'text', applications: 'policy', membership: 'roster' };
  const pkeyOf = (mid2) => PKEY[mid2] || mid2;
  const motionTargets = (rec) =>
    pkeyOf(rec.payload.kind === 'set' || rec.payload.kind === 'reserve'
      ? rec.payload.setting : 'membership');
  const nameOfMember = (mid2) => {
    const row = S.roster.find((r) => (r.mid || 'founder') === mid2);
    return row ? (row.n || row.e || mid2) : mid2;
  };
  // what a typed motion proposes, said in the page's own vocabulary
  const motionDisplay = (rec) => {
    const p = rec.payload;
    if (p.kind === 'reserve') {
      const rc = card(pkeyOf(p.setting));
      return 'Returns ' + (rc ? '“' + rc.t + '”' : p.setting) + ' to the founder’s reserve';
    }
    if (p.kind === 'invite') return p.email.split('@')[0] + ' joins the membership';
    if (p.kind === 'remove') return nameOfMember(p.member) + ' leaves the membership';
    if (p.kind === 'admit') return 'an applicant joins the membership';
    const k = pkeyOf(p.setting);
    if (k === 'title') return p.value.text;
    if (k === 'slug') return 'docs.vote/' + p.value.slug;
    if (k === 'pace') return (p.value.shape === 'fixed' ? 'The close bar throughout'
      : 'Rising from ' + p.value.startPct + '%');
    if (k === 'policy') return ({ invite: 'Invitation only', proposed: 'Applications by proposal',
      apply: 'Anyone may apply', open: 'Open' })[p.value.joinPolicy];
    if (k === 'rate') return p.value.grant + ' each, up to ' + p.value.cap +
      ', one every ' + p.value.dripMinutes + ' minutes';
    return STANDS[k] ? STANDS[k](PAGEVAL[k](p.value)) : JSON.stringify(p.value);
  };
  const pageMotion = (rec) => ({ id: rec.id, kind: rec.route, by: rec.by,
    why: rec.why || '', to: motionDisplay(rec), status: rec.status,
    invite: rec.payload.kind === 'invite' ? rec.payload.email.split('@')[0] : undefined });
  const liveMotionRec = (c) => {
    if (!cs || !c || c.isGate || c.ansFor || !motionsLive()) return null;
    for (const rec of cs.motionRecords().values()) {
      if (rec.status !== 'running' && rec.status !== 'awaiting-crown') continue;
      if (motionTargets(rec) === c.k) return rec;
    }
    return null;
  };
  const motionOn = (c) => { const rec = liveMotionRec(c); return rec ? pageMotion(rec) : null; };
  const routeOfM = (m) => m.kind;
  // the same two-act gesture (363a): the radio is provisional, the ✓ commits.
  // Constitutional commits are answerMotion; ordinary judging is a page-side
  // marker feeding the dev adjudication seam (the engine's job post-368).
  const myMAnsOk = () => (viewerRow().mAnsOk || (viewerRow().mAnsOk = new Set()));
  const motionPicked = (c) => S.mAns[c.k] !== undefined;
  const answeredMotion = (c) => {
    const rec = liveMotionRec(c);
    if (!rec) return false;
    if (rec.route === 'constitutional') return rec.answers.has(viewerId());
    return motionPicked(c) && myMAnsOk().has(c.k);
  };
  const motionJudged = (k) => {
    const rec = liveMotionRec(card(k));
    if (!rec) return 0;
    if (rec.route === 'constitutional') return rec.answers.size;
    return S.roster.filter((r) => r.mAnsOk && r.mAnsOk.has(k)).length;
  };
  // one 🏛️ out per member at a time (Ed, Q327): withdrawn, it comes back whole
  const myHeldOut = () => {
    if (!cs) return null;
    for (const rec of cs.motionRecords().values()) {
      if ((rec.status === 'running' || rec.status === 'awaiting-crown') &&
        rec.route === 'constitutional' && rec.by === viewerId()) {
        return motionTargets(rec);
      }
    }
    return null;
  };
  // DEV SEAM: the mock has no race engine, so an ordinary motion is
  // adjudicated the moment every member has judged it — carried if the
  // proposal out-polls what stands ('either' counts to neither side).
  // Post-368 the caller of adjudicateOrdinaryMotion is a real race (§9.6).
  function maybeAdjudicate(rec, k) {
    const rows = S.roster.filter((r) => r.role !== 'clerk' && r.in);
    if (!rows.every((r) => r.mAnsOk && r.mAnsOk.has(k))) return;
    const votes = rows.map((r) => (r.mAns || {})[k]);
    const up = votes.filter((v) => v === 'proposed').length;
    const down = votes.filter((v) => v === 'stands').length;
    try { cs.adjudicateOrdinaryMotion(now(), rec.id, up > down ? 'carried' : 'held');
      syncFromCs(); }
    catch (e) { console.warn('[cs]', e && e.message); }
    rows.forEach((r) => { if (r.mAns) delete r.mAns[k]; if (r.mAnsOk) r.mAnsOk.delete(k); });
  }
  // the typed value rides along as the draft is composed (d.val); the two
  // membership sentences parse at commit, where the row is at hand
  function draftPayload(d) {
    if (d.k === 'roster') {
      if (/ leaves the membership$/.test(d.to)) {
        const nm = d.to.replace(/ leaves the membership$/, '');
        const row = S.roster.find((r) => (r.n || r.e) === nm);
        return { kind: 'remove', member: row && row.mid ? row.mid : FOUNDER };
      }
      const who = d.to.replace(/ joins the membership$/, '');
      return { kind: 'invite', email: who.includes('@') ? who
        : who.toLowerCase().replace(/\s+/g, '.') + '@invited.example' };
    }
    if (!d.val) throw new Error('no typed value on the draft');
    return { kind: 'set', setting: midOf(d.k), value: d.val };
  }
  // a lane's display string → its typed value, one table (never parsed back)
  const MVAL = {
    pace: { 'The close bar throughout': { shape: 'fixed' } },
    ending: { 'Never — it runs until it is frozen': { endsAtMs: null } },
    lapse: { 'Never — however long inactive': { afterMs: null } },
    machines: { 'People only': { enabled: false, budget: 0 } },
    chamber: { 'Members only': { rung: 'closed' }, 'Anyone with the link': { rung: 'link' }, 'Public': { rung: 'public' } },
    authorship: { 'Nobody’s name, ever': { rung: 'anonymous' }, 'Names at the close': { rung: 'sealed' }, 'Names from the start': { rung: 'public' } },
    signing: { 'Nobody signs': { rung: 'nobody' }, 'Each author chooses': { rung: 'each' }, 'Everybody signs': { rung: 'everybody' } },
    judgments: { 'Never revealed': { rung: 'never' }, 'Revealed after the decision': { rung: 'after' } },
  };
  const mvalTyped = (k, disp) => {
    if (k === 'policy') {
      const jp = { 'Invitation only': 'invite', 'Applications by proposal': 'proposed',
        'Anyone may apply': 'apply', 'Open': 'open' }[disp];
      const cur = csState('policy') && csState('policy').value;
      return jp ? { holder: cur ? cur.holder : regHolder(),
        joinPolicy: jp } : null;
    }
    if (k === 'roster') return null;
    return (MVAL[k] || {})[disp] || null;
  };
  // **The settled card is the composer** (Ed, 2026-08-18) — for any member,
  // on any settled setting, once the document is live. The founder is the
  // one exception on the settings they reserved: their control there is
  // unilateral (the 👑 rule, consented on the way in), so they keep the
  // setting body itself rather than a composer.
  // §9.7 v0.54: the founder's direct hand IS the unilateral power — where
  // it is given up (assent-only state) the founder composes like a member
  const founderDirect = (c) => { const st = csState(c.k);
    return !st || st.powers.unilateral; };
  // the 👑 question exists exactly where the assent power is held
  const crownWaits = (c) => { const st = csState(c.k);
    return st ? st.holder === 'convenor' && st.powers.assent : !membersHold(c); };
  const composerOn = (c) => motionsLive() && viewerIsMember() && !c.isGate && !c.ansFor &&
    c.kind !== 'personal' && c.k !== 'text' && settled(c) && !motionOn(c) &&
    !(amFounder() && !membersHold(c) && founderDirect(c));
  const commitFor = (c) => motionCommitHtml(c,
    (S.draft && S.draft.k === c.k) ? S.draft.to : '',
    !!myHeldOut() && myHeldOut() !== c.k);

  /* **A motion is composed with the setting's own control** (motion-controls),
     and the grammar is session-view's, via cards.js (Ed, 2026-08-18: *the
     composers on the session-view are the better ones*): the lane radios are
     laneBarHtml speaking data-mval, the rationale is the editing-card's own
     sealed-disc speaker — never an avatar, since authorship is sealed. */
  const PC = window.CARDS.make({ valAttr: 'data-mval', pickOf: (d) => (d ? d.to : null) });
  const laneBlock = (d, val, text) =>
    '<div class="propblock"><div class="rtext">' + text + '</div>' +
    PC.laneBarHtml(d, val, { edit: false }) + '</div>';
  const inputBlock = (html, note) =>
    '<div class="propblock"><div class="rtext">' + html + '</div>' + (note || '') + '</div>';
  // **What stands on a delegated setting is what the room's answers took**,
  // never the founder's field — that still says 'roster'. The consent rule,
  // computed live: highest for quorum and the bar, latest for the ending
  // (never latest of all), longest for lapse, most private for the privacy
  // family, most restrictive for machines, most generous for the rate.
  // what the room settled — the ceremony's resolution, a carried motion, a
  // crown-accepted change — translated back into the page's vocabulary.
  // Anything settled away from the convenor's own hand outranks the page's
  // provisional fields (v0.48: motions now apply).
  const takenOf = (k) => {
    const st = csState(k);
    if (!st || st.settledBy === null || st.settledBy === 'convenor' || st.value === null) return null;
    return PAGEVAL[k] ? PAGEVAL[k](st.value) : null;
  };
  // the whole typed value where one number is not enough (the rate)
  const takenValOf = (k) => {
    const st = csState(k);
    return st && st.settledBy !== null && st.settledBy !== 'convenor' ? st.value : null;
  };
  // a carried title or link changed under the page's mirrors — resync; and
  // the rows follow the register (carried invitations, removals, admissions)
  const syncFromCs = () => {
    if (!cs) return;
    const tv = csState('title'), lv = csState('slug');
    if (tv && tv.settledBy === 'motion' && tv.value.text !== S.title) S.title = tv.value.text;
    if (lv && lv.settledBy === 'motion' && lv.value.slug !== S.slug) S.slug = lv.value.slug;
    for (const [mid2, rec] of cs.memberRecords()) {
      if (mid2 === FOUNDER) continue;
      const row = S.roster.find((r) => r.mid === mid2);
      if (!row && !rec.removed) {
        S.roster.push({ n: rec.name || rec.email.split('@')[0], e: rec.email,
          role: 'member', in: rec.arrivedAtT !== null, mid: mid2, ans: {}, okd: new Set() });
      } else if (row && rec.removed) {
        const at = S.roster.indexOf(row);
        S.roster.splice(at, 1);
        if (S.viewer === at) S.viewer = 0;
      } else if (row && rec.arrivedAtT !== null && !row.in) {
        row.in = true;
      }
    }
  };
  // ...stated in the composers' own vocabulary, so a lane equal to what
  // stands filters itself out
  const STANDS = {
    chamber: (v) => ({ closed: 'Members only', link: 'Anyone with the link', public: 'Public' })[v],
    authorship: (v) => ({ anonymous: 'Nobody’s name, ever', sealed: 'Names at the close', public: 'Names from the start' })[v],
    signing: (v) => ({ nobody: 'Nobody signs', each: 'Each author chooses', everybody: 'Everybody signs' })[v],
    judgments: (v) => ({ never: 'Never revealed', after: 'Revealed after the decision' })[v],
    lapse: (v) => (v === 'never' ? 'Never — however long inactive' : 'After ' + v + ' days of inactivity'),
    machines: (v) => (v ? 'The coherence auditor drafts here' : 'People only'),
    quorum: (v) => (S.quorumForm === 'count' ? v + ' of the membership' : v + '% of the membership'),
    bar: (v) => v + '% sure at the close',
    ending: (v) => (v === 'never' ? 'Never — it runs until it is frozen'
      : new Date(v).toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false })),
    rate: (v) => { const tv = takenValOf('rate');
      return v + ' each · +1 every ' + (tv ? tv.dripMinutes : S.dripMin) +
        ' min · cap ' + (tv ? tv.cap : S.cap); },
  };
  const standsOf = (k) => {
    const c = card(k);
    if (c && isRoom(c)) {
      const v = takenOf(k);
      if (v !== null && STANDS[k]) return STANDS[k](v) || '';
    }
    return VALUE[k] ? String(VALUE[k]() || '') : '';
  };
  // what stands is never offered back: picking the current rule is not a change
  const currentOf = (k) => standsOf(k);
  const lanesFor = (d, pairs, k) => pairs.filter(([val]) => !currentOf(k).startsWith(val))
    .map(([val, text]) => laneBlock(d, val, text)).join('');
  const whyLane = (d) =>
    '<div class="lanebox whylane"><div class="speaker">' +
    '<span class="disc" aria-hidden="true" title="This is how your reason will reach everybody else: with your name off it."></span>' +
    '<div class="said edit-why" contenteditable="plaintext-only" spellcheck="false" data-motionlane="why"' +
    ' data-placeholder="We should change this because…">' + esc((d && d.why) || '') + '</div></div></div>';

  const POLICY_TEXTS = [
    ['Invitation only', 'Membership is by invitation only.'],
    ['Applications by proposal', 'Anyone may apply, but an application must be proposed by a member, who stakes the ✏️.'],
    ['Anyone may apply', 'Anyone may apply to join.'],
    ['Open', 'Anyone with the link joins on arrival.'],
  ];
  // every composable setting has its control (Ed's QA, 2026-08-18) — a text
  // box asks somebody to guess a format the surface already knows
  const PROPOSE = {
    title: (d) => inputBlock('The document is titled ' +
      '<input data-mtext="1" value="' + esc(d.to || S.title) + '" style="width:22rem">.'),
    slug: (d) => inputBlock('The document lives at docs.vote/' +
      '<input data-mslug="1" value="' + esc((d.to || S.slug).replace(/^docs\.vote\//, '')) + '" style="width:12rem">.',
      '<p class="setnote">Every link the document has ever had keeps working — a change leaves a redirect behind.</p>'),
    pace: (d) => lanesFor(d, [['The close bar throughout',
        'The approval threshold holds at its close value throughout.']], 'pace') +
      inputBlock('The approval threshold rises from ' +
        '<input class="num" type="number" min="50" max="99" data-mpace="1" value="' +
        esc((/^Rising/.test(d.to) && (d.to.match(/\d+/) || [])[0]) || S.tStart) + '">% to the close.'),
    rate: (d) => {
      const n = d.to.match(/\d+/g) || [];
      return inputBlock('Members start with ' +
        '<input class="num" type="number" min="0" max="40" data-mrate="x" value="' + esc(n[0] || S.grant) + '"> ✏️ each, up to a maximum of ' +
        '<input class="num" type="number" min="1" max="99" data-mrate="y" value="' + esc(n[1] || S.cap) + '">. They get an additional ✏️ every ' +
        '<input class="num" type="number" min="5" max="2880" data-mrate="z" value="' + esc(n[2] || S.dripMin) + '"> minutes.');
    },
    ending: (d) => {
      const never = /never/i.test(d.to);
      return inputBlock('The drafting process will end on ' +
          '<input type="datetime-local" data-mdate="1" value="' + esc(S.endsAt || '') + '">.') +
        lanesFor(d, [['Never — it runs until it is frozen',
          'The drafting process has no set end — it runs until it is frozen.']], 'ending') +
        (never ? '<p class="setnote">Removing the ending is constitutional — a document with no ending has no rising threshold.</p>' : '');
    },
    bar: (d) => inputBlock('A change is adopted when the room is ' +
      '<input class="num" type="number" min="50" max="99" data-mnum="% sure at the close" value="' +
      esc((d.to.match(/\d+/) || [])[0] || takenOf('bar') || S.tClose) + '">% sure at the close.'),
    quorum: (d) => (S.quorumForm === 'count'
      ? inputBlock('Quorum is <input class="num" type="number" min="1" max="99" data-mnum=" of the membership" value="' +
        esc((d.to.match(/\d+/) || [])[0] || takenOf('quorum') || quorumCount()) + '"> of the membership.')
      : inputBlock('Quorum is <input class="num" type="number" min="1" max="100" data-mnum="% of the membership" value="' +
        esc((d.to.match(/\d+/) || [])[0] || takenOf('quorum') || S.quorumPct) + '">% of the membership.')),
    lapse: (d) => lanesFor(d, [['Never — however long inactive',
        'A membership never lapses, however long inactive.']], 'lapse') +
      inputBlock('A membership lapses after ' +
        '<input class="num" type="number" min="7" max="720" data-mnum=" days of inactivity" value="' +
        esc((d.to.match(/\d+/) || [])[0] || S.lapseDays) + '"> days of inactivity.'),
    authorship: (d) => lanesFor(d, [
      ['Nobody’s name, ever', 'A proposer is never named — not even in the closing record.'],
      ['Names at the close', 'Proposers are named in the closing record, never before.'],
      ['Names from the start', 'Every proposal carries its proposer’s name from the moment it is made.']], 'authorship'),
    signing: (d) => lanesFor(d, [
      ['Nobody signs', 'No proposal carries a signature.'],
      ['Each author chooses', 'A proposer may sign or stay unsigned, proposal by proposal.'],
      ['Everybody signs', 'Every proposal is signed.']], 'signing'),
    judgments: (d) => lanesFor(d, [
      ['Never revealed', 'Judgments are never revealed — not even in the closing record.'],
      ['Revealed after the decision', 'Judgments are published with the record of each decision, never before.']], 'judgments'),
    chamber: (d) => lanesFor(d, [
      ['Members only', 'Only members can read the document.'],
      ['Anyone with the link', 'Anyone with the link can read it; it is not listed.'],
      ['Public', 'Listed and readable by anyone.']], 'chamber'),
    machines: (d) => lanesFor(d, [['People only', 'People only — no machine drafts here.']], 'machines') +
      inputBlock('The coherence auditor drafts alongside the members, with a budget of ' +
        '<input class="num" type="number" min="1" max="40" data-mnum=" ✏️s for the coherence auditor" value="' +
        esc(S.auditorBudget) + '"> ✏️s.'),
    policy: (d) => POLICY_TEXTS.filter(([val]) => !currentOf('policy').startsWith(val))
      .map(([val, text]) => laneBlock(d, val, text)).join('') +
      '<p class="setnote">One motion proposes one rule; what you do not touch stands.</p>',
    // the membership, in front of you, with an ✕ beside each and a field at
    // the bottom — which is what “propose a change to the membership” means
    roster: (d) =>
      '<div class="roster">' + S.roster.map((p, i) =>
        '<div class="rperson' + (d.to === (p.n || p.e) + ' leaves the membership' ? ' picked' : '') + '">' +
        avHtml(p) + '<span><span class="nm">' + esc(p.n || p.e || '—') +
        (i === S.viewer ? ' <span class="chip">you</span>' : '') + '</span></span>' +
        (i === S.viewer ? '<span class="xdrop"> </span>'
          : '<button class="xdrop" data-mval="' + esc((p.n || p.e) + ' leaves the membership') + '"' +
            ' title="Propose that they leave">✕</button>') +
        '</div>').join('') +
      '<div class="addrow"><input placeholder="Somebody to invite" data-mjoin="1">' +
      '<button class="btn" data-mjoinbtn="1">Invite</button></div></div>' +
      '<p class="setnote">Either way it is one motion and it is constitutional, because who is in the room is what quorum is a fraction of. One member who says no settles it.</p>',
  };

  // A constitutional motion re-opens consent: what is proposed, what stands,
  // two answers, one refusal keeps what stands. inviteBody is this body with
  // a person where the value is.
  const inviteBody = (m) =>
    '<p class="why">Whether <b>' + esc(m.invite) + '</b> joins the membership. Adding a member changes what quorum is a fraction of, so it is constitutional: the most restrictive answer wins, and one member who says no keeps them out.</p>' +
    '<div class="choice" role="radiogroup">' +
    '<div class="pick' + (S.mAns.roster === 'no' ? ' on' : '') + '"><button class="lanepick"' +
    ' aria-pressed="' + (S.mAns.roster === 'no') + '" data-motion="no"><span class="dot"></span>' +
    '<span>I would rather they did not</span></button>' +
    '<span class="exp">They stay out. Nobody is told who said so.</span></div>' +
    '<div class="pick' + (S.mAns.roster === 'yes' ? ' on' : '') + '"><button class="lanepick"' +
    ' aria-pressed="' + (S.mAns.roster === 'yes') + '" data-motion="yes"><span class="dot"></span>' +
    '<span>I accept them joining</span></button>' +
    '<span class="exp">They start with the ✏️s everyone got, plus what the drip has added since, and quorum recomputes.</span></div>' +
    '<div class="pick' + (S.mAns.roster === 'abstain' ? ' on' : '') + '"><button class="lanepick"' +
    ' aria-pressed="' + (S.mAns.roster === 'abstain') + '" data-motion="abstain"><span class="dot"></span>' +
    '<span>Abstain</span></button>' +
    '<span class="exp">An answer, not a block: they can join without your consent counting either way.</span></div></div>' + BLINDNOTE;
  const consentBody = (c, m) => (m.invite ? inviteBody(m) :
    '<p class="why">Whether <b>' + esc(m.to) + '</b> replaces <i>' + esc(standsOf(c.k)) + '</i>. Nothing is being judged: you state what you will accept, and one refusal keeps what stands.</p>' +
    '<div class="choice" role="radiogroup">' +
    '<div class="pick' + (S.mAns[c.k] === 'no' ? ' on' : '') + '"><button class="lanepick"' +
    ' aria-pressed="' + (S.mAns[c.k] === 'no') + '" data-motion="no"><span class="dot"></span>' +
    '<span>Keep what stands</span></button>' +
    '<span class="exp">Nobody is told who said so.</span></div>' +
    '<div class="pick' + (S.mAns[c.k] === 'yes' ? ' on' : '') + '"><button class="lanepick"' +
    ' aria-pressed="' + (S.mAns[c.k] === 'yes') + '" data-motion="yes"><span class="dot"></span>' +
    '<span>I accept the change</span></button>' +
    '<span class="exp">It carries once all ' + E() + ' stand at accept — or abstain.</span></div>' +
    '<div class="pick' + (S.mAns[c.k] === 'abstain' ? ' on' : '') + '"><button class="lanepick"' +
    ' aria-pressed="' + (S.mAns[c.k] === 'abstain') + '" data-motion="abstain"><span class="dot"></span>' +
    '<span>Abstain</span></button>' +
    '<span class="exp">An answer, not a block: the motion can carry without your consent counting either way.</span></div></div>' + BLINDNOTE);

  // dev only (with the dropdown, Ed 362): complete the founding in one press,
  // because motions live on the far side of it and the mock has no persistence
  // ⏩ settle the founding — now a scripted drive of REAL module commands
  // (plan 367a: the strongest single assertion — the module-driven page must
  // render what the state-poked page rendered)
  function devFastForward() {
    if (!S.title) { S.title = 'The Hollow Oak Club — House Charter'; }
    if (!S.slug) { const sg = suggestSlug(S.title); S.slug = sg.slug; S.slugTaken = sg.taken; }
    const f = S.roster[0];
    if (!f.e) f.e = 'ash@hollowoak.org';
    if (!f.n) f.n = 'Ash Bellamy';
    S.emailSent = true; S.emailVerified = true;
    try {
      if (!cs) {
        cs = window.cs = M.ConstitutionSession.open({ title: S.title, slug: S.slug,
          convenor: { id: FOUNDER, email: f.e, isMember: f.role !== 'clerk' } }, now());
      }
      if (f.role !== 'clerk') { try { cs.setIdentity(now(), FOUNDER, { name: f.n }); } catch (e) {} }
      if (S.roster.length === 1) { invite('ivy@hollowoak.org'); invite('moss@hollowoak.org'); }
      const named = { 'ivy@hollowoak.org': 'Ivy Fen', 'moss@hollowoak.org': 'Moss Whitlow' };
      S.roster.forEach((r) => { if (named[r.e]) r.n = named[r.e]; });
      S.roster.forEach((r) => { if (!r.founder && !r.in) { r.in = true;
        if (r.mid) { try { cs.arrive(now(), r.mid);
          cs.setIdentity(now(), r.mid, { name: r.n }); } catch (e) {} } } });
      if (!cs.textConfirmed) { try { cs.confirmStartingText(now(), proseText()); } catch (e) {} }
      CARDS.forEach((c) => S.seen.add(c.k));
      // the founder's confirms: delegate what the radios delegate, set the rest
      for (const k of MANAGED_KEYS) {
        if (k === 'title' || k === 'slug') continue;
        try { commitSetting(k); } catch (e) {}
      }
      // the room answers what was delegated — real commands, every seat,
      // dependency order (ending first: the bar question waits on it)
      const FILL = { ending: S.endsAt || '2026-08-20T18:00',
        quorum: (S.quorumForm === 'count' ? S.quorumN : S.quorumPct),
        bar: S.tClose, authorship: 'anonymous', signing: 'nobody',
        judgments: 'never', chamber: 'closed', machines: false,
        lapse: 'never', rate: S.grant };
      for (const k of Object.keys(FILL)) {
        const st = csState(k);
        if (!st || !st.collecting) continue;
        S.roster.forEach((r) => {
          if (r.role === 'clerk' || !r.in) return;
          r.ans = r.ans || {};
          if (r.ans[k] === undefined || r.ans[k] === null) r.ans[k] = FILL[k];
          try { cs.answer(now(), r.mid || FOUNDER, midOf(k), ANSTYPED[k](r.ans[k])); } catch (e) {}
        });
      }
      // acknowledgments, page and module agreeing
      S.roster.forEach((r) => {
        if (r.role === 'clerk') return;
        r.okd = r.okd || new Set();
        CARDS.forEach((c) => { r.okd.add('res-' + c.k); r.okd.add('set-' + c.k); });
        r.okd.add('canpropose'); r.okd.add('canjudge');
        const rec = cs.memberRecords().get(r.mid || FOUNDER);
        if (rec) for (const sid of [...rec.okOwed]) {
          try { cs.giveOk(now(), r.mid || FOUNDER, sid); } catch (e) {}
        }
      });
    } catch (e) { console.warn('[cs devff]', e && e.message); }
  }

  // the membership list, as the 🪪 card's clause — the current text of the
  // rule, with the ✕ that edits it, replacing the copy that lived in the body
  // **The hat is a row in this list** (Ed, 2026-08-18: *does the founder
  // invite themselves? … make it a default, pre-checked*). Your own row is
  // first and ticked; unticking it makes you the clerk — administering
