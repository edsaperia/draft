    }
    const cardFor = (g) => {
      const c = card(S.open);
      // A card the room owns keeps its own body — choosing to hand it over is
      // the founder's decision and stays editable — and grows a **watching**
      // half underneath, which is the whole of what anybody may see of a blind
      // question while it runs.
      if (c.isGate) {
        return cardHtml(c, ctx, gateBody(c),
          '<button class="btn" data-close="1">Close</button>' +
          '<button class="btn btn-approve"' + (c.open() ? '' : ' disabled') +
          ' data-ok="' + c.k + '">OK</button>', g.cards);
      }
      // 403/405 (Ed, 2026-08-19): a power tab, opened — the 🔧 or 👑
      // half of a setting's governance, its head the rule as it stands
      if (c.power) {
        const pHeld = c.power === 'u' ? pwPair(c.base).u : pwPair(c.base).a;
        const editable = amFounder() && !(cs && cs.constitutedAtT !== null && !pHeld);
        // ✒️, not ✓: giving up a power is the founder's unilateral set,
        // and ✒️ is the pen every unilateral set on this surface commits
        // with — the ✓ is reserved for answering a shared question
        return cardHtml(c, ctx, powerBody(c),
          (editable ? binBtn(snapDirty()) +
            '<button class="btn btn-approve glyphbtn emojibtn" data-confirm="1"' +
            ' title="Set it">✒️</button>'
            : '<button class="btn" data-close="1">Close</button>'),
          g.cards);
      }
      const m = motionOn(c);
      // **Reserved is assent, not silence** (§9.7): the room passed it, and
      // it now sits with the founder — Accept applies it, Reject files it.
      if (m && m.status === 'awaiting-crown') {
        return cardHtml(c, ctx,
          '<div class="unlocks"><b>Passed — awaiting the 👑.</b> The room passed <i>' + esc(m.to) + '</i>' +
          (m.why ? ' — <i>' + esc(m.why) + '</i>' : '') +
          '. The setting is reserved, so the change goes to the founder as a <b>👑 question</b>, theirs to accept or reject. Until then, what stands stands.</div>',
          (amFounder()
            ? '<button class="btn" data-crownq="reject">Reject</button>' +
              '<button class="btn btn-approve" data-crownq="accept">Accept</button>'
            : '<button class="btn" data-close="1">Close</button>'), g.cards);
      }
      // a live motion takes the route its own value asks for (329a)
      if (m && routeOfM(m, c) === 'ordinary') {
        const mLive = { ...m, judged: motionJudged(c.k), pick: S.mAns[c.k] };
        return cardHtml(c, ctx, motionBody(c, ctx, mLive),
          (m.by === viewerId()
            ? '<button class="btn" data-withdrawmotion="' + c.k + '" title="Withdrawing returns the ✏️ in full">🗑️ Withdraw</button>'
            : '') +
          '<button class="lanepick" aria-pressed="' + (S.mAns[c.k] === 'either') + '"' +
          ' data-motion="either"><span class="dot"></span><span>Indifferent</span></button>' +
          '<button class="btn btn-approve glyphbtn"' + (motionPicked(c) ? '' : ' disabled') +
          ' data-confirm="1">' + TICK + '</button>',
          g.cards, { v: 'stands', s: { ...m, pick: S.mAns[c.k] } });
      }
      if (m) {
        // constitutional: the founding question, live again. Yours carries
        // the withdraw at the very left, where 🗑️ always is — it hands the
        // 🏛️ back whole, which is what makes the one-each limit livable.
        return cardHtml(c, ctx,
          motionReopen(c, ctx, { ...m, judged: motionJudged(c.k) }) + consentBody(c, m),
          (m.by === viewerId()
            ? '<button class="btn" data-withdrawmotion="' + c.k + '" title="Withdrawing hands your 🏛️ back">🗑️ Withdraw</button>'
            : '<button class="btn" data-close="1">Close</button>') +
          '<button class="btn btn-approve glyphbtn"' + (motionPicked(c) ? '' : ' disabled') +
          ' data-confirm="1">' + TICK + '</button>', g.cards);
      }
      if (composerOn(c)) {
        // **The settled card is the composer** (Ed, 2026-08-18): the rule as
        // it stands at the head, the alternatives as the setting's own
        // controls, session-view's rationale lane, 🗑️ and the route's commit.
        const d = (S.draft && S.draft.k === c.k) ? S.draft : { k: c.k, to: '', why: '' };

          whyLane(d) +

            // the price is not said in words (Ed, 2026-08-19): the pencil

            : (crownWaits(c) ? '<p class="setnote">If this carries it goes to the Founder, who can accept or reject it.</p>' : '')) +
          (wasAsked(c) && settled(c) ? '<div class="body">' + watchBody(c, ctx) + '</div>' : '');

          '<button class="btn glyphbtn" data-dropmotion="1"' +
          (S.draft && S.draft.k === c.k ? '' : ' disabled') + ' title="Discard this motion">🗑️</button>' +
          commitFor(c), g.cards);
      }
      const body = c.ansFor ? ANSWER[c.ansFor](S.myAns, E(), c.ansFor === 'quorum' ? S.quorumForm : undefined)
        // a card that is not yours to answer reads as the rule it is —
        // the founder's settings are read-only from any other chair
        : (!amFounder() && c.own !== 'you')
        ? readBody(c, ctx) + (wasAsked(c) && settled(c) ? '<div class="body">' + watchBody(c, ctx) + '</div>' : '')
        : BODY[c.k]() +
          (wasAsked(c) && settled(c) ? '<div class="body">' + watchBody(c, ctx) + '</div>' : '');
      // **The route left the card bodies** (Ed's copy pass, 2026-08-19,
      // finishing what the kind-eyebrow removal started): every card carried

      // routes are stated once — the clause states its deviations, and the

      // the one sentence only its own card can say: the ⏰ card's

      const kindLine = c.knote ? '<p class="setnote">' + c.knote + '</p>' : '';
      const clearable = { myname: S.myname, mypic: S.mypic };
      const newsKey = isRoom(c) ? 'res-' + c.k : 'set-' + c.k;
      const foot = (!amFounder() && c.own !== 'you' && !c.ansFor)
        ? (stateOf(c, ctx) === 'news'
          ? '<button class="btn" data-close="1">Close</button>' +

        : (c.k === 'myname' || c.k === 'mypic')
        ? '<button class="btn glyphbtn" data-clearval="' + c.k + '"' + (clearable[c.k] ? '' : ' disabled') +
          ' title="' + (c.k === 'myname' ? 'Clear the name' : 'Remove the picture') + '">🗑️</button>' +
          '<button class="btn btn-approve glyphbtn emojibtn"' + (ready(c) ? '' : ' disabled') +
          ' data-confirm="1" title="Set it">✒️</button>'
        : c.k === 'title'
        ? '<button class="btn glyphbtn" data-cleartitle="1"' +
          ((S.titleDraft !== null && S.titleDraft !== cs_titleNow()) ? '' : ' disabled') +
          ' title="Put it back as it stands">🗑️</button>' +
          '<button class="btn btn-approve glyphbtn emojibtn"' + (commitReady(c) ? '' : ' disabled') +
          ' data-confirm="1" title="' + (commitReady(c) ? 'Set it — yours to change any time' : 'Give it a name first') + '">✒️</button>'

    // **The link takes you to the document, not into a card** (Ed,
    // 2026-08-19): arriving is arriving. What is waiting for you is a task in
    // the rail, which is where every other thing that wants you stands, and
    // opening it is your click rather than the page's.
    if (cm) { S.emailVerified = true; S.mailOpen = false; S.seen.add('myemail');
      S.open = null; return render(); }
    const ee = ev.target.closest('[data-act="editemail"]');
    if (ee) { S.emailSent = false; return render(); }

      return render(); }
    const pic = ev.target.closest('[data-pic]');
    if (pic) { S.mypic = pic.dataset.pic; return render(); }
    const d = ev.target.closest('[data-drop]');
    if (d) { const row = S.roster[+d.dataset.drop];
      if (cs && row && row.mid) { try { cs.uninvite(now(), row.mid); } catch (e) { return render(); } }
      S.roster.splice(+d.dataset.drop, 1); return render(); }
    if (ev.target.closest('[data-act="add"]')) {
      const f = document.querySelector('[data-add]');
      if (f && f.value.trim()) invite(f.value.trim());
      return render(); }
    if (ev.target.closest('[data-act="invite"]')) {
      const box = document.querySelector('[data-emails]');

  });
  // sending the verification mail: at the birth it mints the real document
  // server-side (§9.7a), in the mockup it opens the pretend inbox
  function sendVerify() {
    if (BIRTH && S.viewer !== 'applicant') {
      S.emailErr = null;
      api.post('/api/docs', { title: S.title || 'Untitled', email: S.myemail })
        .then((res) => {
          // api.post resolves the error JSON rather than throwing, so a
          // refused send must be caught here — a card that says "Sent"
          // over a mail that never went is the one lie this step can tell
          if (res && res.error) {
            S.emailErr = res.error; S.emailSent = false; return render();
          }
          api.birth = res; if (res.slug) S.slug = res.slug;

    }

    // mail just went out, and a modal over it read as the page play-acting

    // the mail actually is
    S.emailSent = true; S.mailOpen = !BIRTH; return render();
  }

  function invite(em) {
    if (S.roster.some((p) => p.e === em)) return;
    if (cs && cs.isRemote) { api.cmd('invite', { email: em }); return; }
    let mid = null;
    if (cs) { try { mid = cs.invite(now(), em); } catch (e) { return; } }
    S.roster.push({ n: em.split('@')[0].replace(/[._-]+/g, ' ').replace(/\b\w/g, (x) => x.toUpperCase()),
      e: em, role: 'member', in: false, mid });
    // the arrival theatre stays; its payload is a real command now (§9.6a)
    setTimeout(() => { const p = S.roster.find((x) => x.e === em);
      if (p) { p.in = true;
        if (cs && p.mid) { try { cs.arrive(now(), p.mid);
          cs.setIdentity(now(), p.mid, { name: p.n }); } catch (e) {} }
        render(); } },
      1200 + Math.random() * 2600);
  }
  // ---- assembly-press (Ed, 2026-08-18) -----------------------------------
  // A constitutional change goes in by a **full ten-second hold**, and the
  // progress meter is the room itself: the members convene onto a circle
  // around the button, and the motion is put at the moment the assembly is
  // complete. Release early and it disperses — nothing sent.
  const HOLD_MS = 10000;
  let assembly = null;
  function conveneAssembly(btn, k) {
    disperseAssembly();
    const d0 = S.draft;
    if (!d0 || d0.k !== k) return;
    const r = btn.getBoundingClientRect();
    const el = document.createElement('div');
    el.id = 'assembly';
    el.style.left = (r.left + r.width / 2) + 'px';
    el.style.top = (r.top + r.height / 2) + 'px';
    const RADIUS = 88;
    const room = S.roster.filter((p) => p.in && p.role !== 'clerk');
    room.forEach((p, i) => {
      const seat = document.createElement('span');
      seat.className = 'seat';
      const th = -Math.PI / 2 + (i / room.length) * 2 * Math.PI;
      seat.style.left = Math.round(Math.cos(th) * RADIUS) + 'px';
      seat.style.top = Math.round(Math.sin(th) * RADIUS) + 'px';
      seat.innerHTML = avHtml(p);
      el.appendChild(seat);
    });
    document.body.appendChild(el);
    const seats = [...el.children];
    const timers = seats.map((s2, i) =>
      setTimeout(() => s2.classList.add('in'), 80 + i * (HOLD_MS - 800) / seats.length));
    assembly = { el, timers, done: setTimeout(() => {
      el.classList.add('done');
      try { cs.openMotion(now(), viewerId(), draftPayload(d0), d0.why || undefined);
        // the module auto-answered accept for the mover (§9.6 v0.49) —
        // the provisional layer agrees, so their own radio reads pressed
        S.mAns[d0.k] = 'yes'; }
      catch (e) { console.warn('[cs]', e && e.message); }
      S.draft = null; assembly = null;
      setTimeout(() => { el.remove(); render(); }, 420);
    }, HOLD_MS) };
  }
  function disperseAssembly() {
    if (!assembly) return;
    assembly.timers.forEach(clearTimeout); clearTimeout(assembly.done);
    const el = assembly.el; assembly = null;
    el.classList.add('gone');
    setTimeout(() => el.remove(), 260);
  }
  document.addEventListener('pointerdown', (ev) => {
    const b = ev.target.closest('[data-holdmotion]');
    if (b && !b.disabled) { ev.preventDefault(); conveneAssembly(b, b.dataset.holdmotion); }
  });
  ['pointerup', 'pointercancel'].forEach((t) => document.addEventListener(t, disperseAssembly));

  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && S.open) { S.open = null; return render(); }
    if (ev.key === 'Enter' && ev.target.closest('[data-titlelane]')) ev.preventDefault();
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.closest('[data-tab]')) {
      ev.preventDefault(); ev.target.closest('[data-tab]').click();
    }
  });
  // A lane rebuilt on every keystroke would lose the caret, so typing repaints
  // the bar and the rail and leaves the card alone — only the commit control,
  // which is about what you have just typed, is set directly.
  document.addEventListener('input', (ev) => {
    const sl = ev.target.closest && ev.target.closest('[data-slide]');
    if (sl) { S.myAns[sl.dataset.slide] = +sl.value; render();
      const again = document.querySelector('[data-slide="' + sl.dataset.slide + '"]');
      if (again) again.focus(); return; }
    const t = ev.target;
    const lane = t.closest && t.closest('[data-titlelane]');
    if (lane) { S.titleDraft = lane.textContent.trim();
      lane.classList.toggle('blank', !S.titleDraft);
      refreshCommit(); return; }
    if (t.dataset.appmail !== undefined) { S.app.email = t.value.trim();
      const sb = document.querySelector('[data-appmailsend]');
      if (sb) sb.disabled = !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.app.email) ||
        MEMBER_EMAILS.has(S.app.email.toLowerCase());
      return; }
    if (t.dataset.appname !== undefined) { S.app.name = t.value; return; }
    const at = t.closest && t.closest('[data-apptext]');
    if (at) { S.app.text = at.textContent.trim(); at.classList.toggle('blank', !S.app.text); return; }
    const ml = t.closest && t.closest('[data-motionlane]');
    if (ml) { if (!S.draft || S.draft.k !== S.open) S.draft = { k: S.open, to: '', why: '' };
      S.draft[ml.dataset.motionlane] = ml.textContent.trim();
      ml.classList.toggle('blank', !ml.textContent.trim());
      // the commit slot follows the route of what is now typed (329a) —
      // swapped in place, because a re-render would throw the caret out
      const slot = document.querySelector('[data-putmotion], [data-holdmotion]');
      if (slot && S.draft) slot.outerHTML = commitFor(card(S.draft.k));
      const dr = document.querySelector('[data-dropmotion]');
      if (dr) dr.disabled = false;
      return; }
    if (t.dataset.slug) { S.slug = t.value.trim().toLowerCase(); renderRail(); refreshCommit(); return; }
    if (t.dataset.txt === 'myname') { S.myname = t.value; renderRail(); refreshCommit(); return; }
    if (t.dataset.txt === 'myemail') { S.myemail = t.value.trim();
      S.emailSent = false; S.emailVerified = false; S.seen.delete('myemail');

    if (t.dataset.txt) { S[t.dataset.txt] = t.value; renderRail(); }
    if (t.dataset.num) { S[t.dataset.num] = +t.value; renderRail(); }
  });
  document.getElementById('devwho').addEventListener('change', (ev) => {
    const v = ev.target.value;
    S.viewer = v === 'applicant' ? 'applicant' : +v;
    // sitting in an invited seat is that member's first arrival (§9.6a)

  // ---- the live layer (Q391b) -------------------------------------------
  // A ConstitutionSession lookalike over the last-fetched view: the page's
  // predicates render a real document through the same `cs` they render
  // the fixture through. Reads come from the blind projection — a member's
  // client never holds the log (§3.5/§9.0a on the wire) — and every
  // command is a POST the server folds as the cookie's member.
  function remoteCS(v0) {
    // the page's predicates call settingState and the record maps per card
    // per render, over data that only changes when a new view lands — so
    // the fetched view is indexed once per assignment, not per call
    let v = v0, ix = null;
    const index = () => ix || (ix = {
      settings: new Map(v.view.settings.map((x) => [x.setting, x])),
      questions: new Map(v.view.questions.map((x) => [x.setting, x])),
      resolutions: new Map(v.view.resolutions.map((x) => [x.setting, x])),
      members: null, motions: null, crowns: null, applicants: null,
    });
    const self = {
      isRemote: true,
      get v() { return v; },
      set v(nv) { v = nv; ix = null; },
      get textConfirmed() { return self.v.textConfirmed; },
      get constitutedAtT() { return self.v.constitutedAtT; },
      get titleOf() { return self.v.title; },
      get slug() { return self.v.slug; },
      get quorumForm() { return self.v.quorumForm; },
      get text() { return self.v.text; },
      E: () => self.v.electorateSize,
      motionElectorate: () => [],
      membershipReserved: () => self.v.membershipReserved,
      crowned: () => self.v.crowned,
      canPropose: () => self.v.view.gates.proposing,
      canJudge: () => self.v.view.gates.judging,
      settingState: (mid) => {
        if (mid === 'membership') {
          const reg = self.v.view.register ||
            { holder: 'members', powers: { unilateral: false, assent: false } };
          return { holder: reg.holder, powers: reg.powers, value: null,
            settledBy: null, settledAtT: null, collecting: false,
            distribution: null, answeredCount: 0,
            answers: { has: () => false } };
        }
        const st = index().settings.get(mid);
        if (!st) return null;
        const q = index().questions.get(mid);
        const res = index().resolutions.get(mid);
        const mine = q ? q.myAnswer !== null : false;
        return { holder: st.holder, powers: st.powers, value: st.value,
          settledBy: st.settledBy, settledAtT: st.settledAtT,
          collecting: st.collecting,
          distribution: res ? res.distribution : null,
          answeredCount: q ? q.answeredCount
            : (st.settledBy === 'ceremony' ? self.v.electorateSize : 0),
          answers: { has: (id) => id === self.v.me && mine } };
      },
      memberRecords: () => index().members || (index().members = new Map(
        self.v.view.members.map((r) => [r.id, { id: r.id, email: r.email,
          name: r.name, picture: r.picture, arrivedAtT: r.arrived ? 1 : null,
          lapsed: r.lapsed, removed: false,
          okOwed: r.id === self.v.me ? self.v.view.owedOks : [] }]))),
      convenorRecord: () => self.v.convenor,
      motionRecords: () => index().motions || (index().motions = new Map(
        self.v.view.motions.map((rec) => [rec.id, { id: rec.id,
          route: rec.route, payload: rec.payload, why: rec.why,
          status: rec.status, by: rec.mine ? self.v.me : '(sealed)',
          answers: { has: (id) => id === self.v.me && rec.myAnswer !== null,
            get: (id) => (id === self.v.me ? rec.myAnswer : undefined),
            size: rec.answeredCount } }]))),
      crownQuestionRecords: () => index().crowns || (index().crowns = new Map(
        self.v.view.crownTasks.map((q) =>
          [q.id, { id: q.id, motion: q.motion, status: 'pending' }]))),
      applicantRecords: () => index().applicants || (index().applicants =
        new Map(((self.v.view && self.v.view.applicants) || [])
          .map((a) => [a.id, a]))),
      setSetting: (t, mid, value) => api.cmd('set-setting', { setting: mid, value }),
      delegate: (t, mid) => api.cmd('delegate', { setting: mid }),
      reclaim: (t, mid) => api.cmd('reclaim', { setting: mid }),
      relinquish: (t, mid, power) => api.cmd('relinquish', { setting: mid, power }),
      setQuorumForm: (t, form) => api.cmd('set-quorum-form', { form }),
      confirmStartingText: (t, text) => api.cmd('confirm-starting-text', { text }),
      invite: (t, email) => { api.cmd('invite', { email }); return null; },
      uninvite: (t, member) => api.cmd('uninvite', { member }),
      arrive: () => {}, // arrival is the invitation link (§9.6a), never a page act
      setIdentity: (t, member, identity) => api.cmd('set-identity', identity),
      answer: (t, member, setting, value) => api.cmd('answer', { setting, value }),
      giveOk: (t, member, setting) => api.cmd('give-ok', { setting }),
      openMotion: (t, by, payload, why) => api.cmd('open-motion', { payload, why }),
      answerMotion: (t, member, motion, answer) => api.cmd('answer-motion', { motion, answer }),
      withdrawMotion: (t, member, motion) => api.cmd('withdraw-motion', { motion }),
      answerCrownQuestion: (t, question, outcome) => api.cmd('answer-crown-question', { question, outcome }),
      setConvenorMembership: (t, isMember) => api.cmd('set-convenor-membership', { isMember }),

      startApplication: () => { throw new Error('applications go live with Q346'); },
      verifyApplication: () => {}, submitApplication: () => {}, tick: () => {},
    };
    return self;
  }

  // an ordinary motion's judgment is a real pairwise judgment (Q391c): the
  // served race card carries the two option ids; keep prefers the standing
  // side, the proposal prefers the candidate side, abstain is indifference
  // the served race card carrying a setting's motion, by the setting's id
  const raceCardOf = (settingId) => ((cs && cs.v && cs.v.raceCards) || []).find((x) =>
    (x.a.setting && x.a.setting.settingId === settingId) ||
    (x.b.setting && x.b.setting.settingId === settingId));
  // one encoding of a pairwise judgment on a served card: the engine marks
  // which option is what stands (OptionView.incumbent), and keep / prefer /
  // indifferent translate into the race's own outcome vocabulary here and
  // nowhere else
  function judgeRaceCard(rc, pick) {
    const incSide = rc.a.incumbent ? 'a' : rc.b.incumbent ? 'b' : null;
    const outcome = (pick === 'either' || pick === 'abstain') ? 'tie'
      : (pick === 'stands' || pick === 'no') ? (incSide || 'tie')
      : (incSide === 'a' ? 'b' : 'a');
    api.cmd('judge-race', { a: rc.a.id, b: rc.b.id, outcome });
  }
  function liveJudge(cw) {
    const mid = midOf(cw.k);
    const rc = raceCardOf(mid);
    if (!rc) { console.warn('[live] no race card served for', mid); return; }
    judgeRaceCard(rc, S.mAns[cw.k]); // 'stands' | 'proposed' | 'either'
  }

  // the document column, filled from the server's text (confirmed, or the
  // founder's provisional draft riding the §9.7a stash)
  function setProse(text) {
    const html = textDivs(text);
    prose.innerHTML = html;
    prose.classList.toggle('empty', html === '');
    relabel();
  }

  // the value half of hydration, re-run on every refresh: what stands is
  // the server's; the card you have open keeps your provisional hand
  function hydrateValues(skipKey) {
    const v = cs.v;
    if (skipKey !== 'title') S.title = v.title;
    if (skipKey !== 'slug') S.slug = v.slug;
    const val2 = (mid) => { const st = cs.settingState(mid); return st && st.value; };
    const MAPV = {
      ending: (x) => { S.ending = x.endsAtMs === null ? 'perpetual' : 'ends';
        if (x.endsAtMs !== null) S.endsAt = msToLocal(x.endsAtMs); },
      bar: (x) => { S.tClose = x.pct; },
      pace: (x) => { S.shape = x.shape; if (x.startPct) S.tStart = x.startPct; },
      quorum: (x) => { if (x.form === 'share') S.quorumPct = x.n; else S.quorumN = x.n; },
      authorship: (x) => { S.authorship = x.rung; },
      signing: (x) => { S.signing = x.rung; },
      judgments: (x) => { S.judgments = x.rung; },
      chamber: (x) => { S.chamber = x.rung; },
      rate: (x) => { S.grant = x.grant; S.cap = x.cap; S.dripMin = x.dripMinutes; },
      lapse: (x) => { S.lapse = x.afterMs === null ? 'never' : String(Math.round(x.afterMs / 86400000)); },
      removal: (x) => { S.removal = x.rung; },
      machines: (x) => { S.auditor = x.enabled; if (x.enabled) S.auditorBudget = x.budget; },
      applications: (x) => { S.joinBy = x.joinPolicy;
        S.rosterBy = x.holder === 'members' ? 'roster' : 'founder';
        S['pw:policy'] = x.holder === 'reserved-unilateral' ? 'unilateral'
          : x.holder === 'reserved-assent' ? 'assent' : 'both'; },
    };
    for (const mid of Object.keys(MAPV)) {
      if (pkeyOf(mid) === skipKey) continue;
      const x = val2(mid);
      // value non-null implies settled (every module fold sets or nulls
      // the pair together), so this guard is the whole condition
      if (x) MAPV[mid](x);
    }
  }

  // the provisional radio layer, hydrated once from what the server holds.
  // The value half is hydrateValues — one mapping, shared with the 4s poll,
  // so boot and refresh cannot disagree about how a value lands in S —
  // plus what is genuinely boot's own: identity, the delegation seeds,
  // committed answers, and the seen/okd reconstruction.
  function hydrateS() {
    const v = cs.v;
    const meRow2 = v.view.members.find((r) => r.id === v.me);
    S.myemail = (meRow2 ? meRow2.email : v.convenor.email) || '';
    S.emailSent = true; S.emailVerified = true;
    S.myname = v.view.identity.name || '';
    S.mypic = v.view.identity.picture || '';
    S.quorumForm = v.quorumForm;
    hydrateValues(null);
    // delegation seeds: a members-held setting with no resolved value reads
    // 'roster' in the page's own radio vocabulary; the *By flags say who
    // holds where the radio and the value are separate fields
    const val = (mid) => { const st = cs.settingState(mid); return st && st.value; };
    const del = (mid) => { const st = cs.settingState(mid); return !!st && st.holder === 'members'; };
    for (const mid of ['ending', 'authorship', 'signing', 'judgments', 'chamber',
      'removal', 'lapse', 'machines']) {
      if (del(mid) && !val(mid)) S[DKEY[pkeyOf(mid)]] = 'roster';
    }
    S.barBy = del('bar') ? 'roster' : 'founder';
    S.quorumBy = del('quorum') ? 'roster' : 'founder';
    S.rateBy = del('rate') ? 'roster' : 'founder';
    S.policyBy = del('applications') ? 'roster' : 'founder';
    // my committed answers, back in the page's own vocabulary
    for (const q of v.view.questions) {
      if (q.myAnswer === null) continue;
      const k = pkeyOf(q.setting);
      S.myAns[k] = PAGEVAL[k] ? PAGEVAL[k](q.myAnswer) : q.myAnswer;
    }
    // settled means confirmed here (the server's record IS the confirm),
    // and acknowledged means not owed (§9.0b)
    const owed = new Set(v.view.owedOks);
    CARDS.forEach((c) => {
      if (c.isGate || c.ansFor) return;
      if (c.k === 'title' || c.k === 'slug' || c.k === 'myemail' || c.k === 'roster') { S.seen.add(c.k); return; }
      if (c.k === 'text') { if (v.textConfirmed) S.seen.add(c.k); return; }
      if (c.k === 'myname' || c.k === 'mypic') { S.seen.add(c.k); return; }
      const st = csState(c.k);
      if (st && (st.settledBy !== null || st.holder === 'members')) {
        S.seen.add(c.k);
        if (st.settledBy !== null && !owed.has(midOf(c.k))) {
          S.okd.add('set-' + c.k); S.okd.add('res-' + c.k);
        }
      }
    });
  }

  // ---- the live Applicants block (§9.7½ v0.56, Q397) ----------------------
  // Members see who is asking, in their own words, and judge each admit
  // motion as the one-candidate race it is: admit them, or keep the
  // membership as it is. Live only — the fixture has its own applicant
  // seat and no server to race against.
  const admitCardOf = (apId) => raceCardOf('admit:' + apId);
  function liveApplicantsHtml() {
    if (!cs || !cs.isRemote) return '';
    const aps = (cs.v.view && cs.v.view.applicants) || [];
    if (!aps.length) return '';
    const stp = csState('policy');
    const policy = (stp && stp.value && stp.value.joinPolicy) || 'invite';
    const rows = aps.map((ap) => {
      const nm = ap.name || 'Anonymous'; // the email stands on its own line
      const motion = ap.motion && ((cs.v.view.motions || []).find((m) => m.id === ap.motion) || null);
      const why = (motion && motion.why) || ap.words || '';
      const rc = admitCardOf(ap.id);
      const pick = S['adm:' + ap.id] || null;
      let tail = '';
      if (ap.status === 'admitted') tail = '<span class="chip">member</span>';
      else if (ap.status === 'refused') tail = '<span class="chip pending">not admitted</span>';
      else if (ap.status === 'submitted' && policy === 'proposed' && !motion) {
        tail = '<span class="chip pending">waiting for a member to propose them</span>' +
          (viewerIsMember()
            ? '<div style="display:flex;gap:.4rem;margin-top:.35rem;align-items:center">' +
              '<input data-apwhy="' + ap.id + '" placeholder="Why should they join?" style="flex:1;min-width:10rem">' +
              '<button class="btn" data-appropose="' + ap.id + '" title="Costs one ✏️, returned in full if withdrawn">✏️ Propose them</button></div>'
            : '');
      } else if (motion && motion.status === 'running') {
        tail = rc
          ? '<div style="display:flex;gap:.4rem;margin-top:.35rem;flex-wrap:wrap;align-items:center">' +
            '<button class="lanepick" aria-pressed="' + (pick === 'admit') + '" data-admitpick="' + ap.id + '" data-v="admit"><span class="dot"></span><span>Admit</span></button>' +
            '<button class="lanepick" aria-pressed="' + (pick === 'stands') + '" data-admitpick="' + ap.id + '" data-v="stands"><span class="dot"></span><span>Keep the membership as it is</span></button>' +
            '<button class="lanepick" aria-pressed="' + (pick === 'either') + '" data-admitpick="' + ap.id + '" data-v="either"><span class="dot"></span><span>Indifferent</span></button>' +
            '<button class="btn btn-approve glyphbtn" data-admitgo="' + ap.id + '"' + (pick ? '' : ' disabled') + '>' + TICK + '</button></div>'
          : '<span class="chip">before the members — you have judged it</span>';
      }
      return '<div class="rperson" style="display:block"><span class="nm">' + esc(nm) +
        ' <span class="chip pending">applicant</span></span><br>' +
        '<span class="em">' + esc(ap.email) + (why ? ' · <i>' + esc(why) + '</i>' : '') + '</span>' +
        (tail ? '<div style="margin-top:.3rem">' + tail + '</div>' : '') + '</div>';
    }).join('');
    return '<div class="roster clauselist" style="margin-top:.5rem">' +
      '<div class="rechead">Applicants</div>' + rows + '</div>';
  }
  // The admit judgment is the same pairwise act as any ordinary motion's
  // (liveJudge): admit prefers the candidate side, keep the incumbent.
  function liveJudgeAdmit(apId) {
    const rc = admitCardOf(apId);
    if (!rc) { console.warn('[live] no admit card served for', apId); return; }
    const pick = S['adm:' + apId];
    if (!pick) return;
    delete S['adm:' + apId];
    judgeRaceCard(rc, pick); // 'admit' prefers the candidate side
  }

  // ---- the dev inbox as a modal (Ed, 2026-08-19) --------------------------
  // QA plays every seat, so the magic links belong on the screen, not in a
  // console. Off the design system on purpose, like the dev dropdown: a
  // stagehand, not a member of the cast. The button appears only where
  // /api/dev/outbox exists — dev mail mode on a live server — so neither
  // production nor the static fixture ever shows it.
  function devInboxButton() {
    fetch('/api/dev/outbox').then((r) => (r.ok ? r.json() : null)).then((d) => {
      if (!d || document.getElementById('devmailbtn')) return;
      const b = document.createElement('button');
      b.id = 'devmailbtn';
      b.textContent = '📬 outbox';
      b.style.cssText = 'position:fixed;top:64px;left:10px;z-index:60;font:12px ui-monospace,monospace;border:1px dashed #999;background:#fff;padding:.3rem .6rem;cursor:pointer';
      b.onclick = openDevInbox;
      document.body.appendChild(b);
    }).catch(() => {});
  }
  function openDevInbox() {
    fetch('/api/dev/outbox').then((r) => r.json()).then((d) => {
      const old = document.getElementById('devoutbox');
      if (old) old.remove();
      const wrap = document.createElement('div');
      wrap.id = 'devoutbox';
      wrap.style.cssText = 'position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:70;overflow:auto;padding:6vh 1rem';
      const mails = ((d && d.mails) || []).map((m) =>
        '<div style="border-bottom:1px solid #ddd;padding:.7rem 0">' +
        '<div style="color:#666;font-size:12px">' + esc(new Date(m.at).toLocaleTimeString()) + ' · to ' + esc(m.to) + '</div>' +
        '<div style="font-weight:700;margin:.15rem 0">' + esc(m.subject) + '</div>' +
        '<div style="white-space:pre-wrap;font-size:13px;color:#333">' + esc(m.text) + '</div>' +
        (m.link ? '<a href="' + esc(m.link) + '" style="display:inline-block;margin-top:.4rem;background:#1a73e8;color:#fff;text-decoration:none;padding:.4rem .8rem;border-radius:3px">Follow the magic link →</a>' : '') +
        '</div>').join('') || '<div style="color:#666;padding:.7rem 0">The outbox is empty — nothing has been sent yet.</div>';
      wrap.innerHTML = '<div style="max-width:38rem;margin:0 auto;background:#fff;font-family:Arial,Helvetica,sans-serif;padding:1rem 1.2rem;border-radius:4px">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.3rem">' +
        '<b style="font-family:ui-monospace,monospace">📬 dev outbox — every mail this server would have sent</b>' +
        '<button id="devoutclose" style="border:1px dashed #999;background:#fff;cursor:pointer;padding:.2rem .5rem">✕</button></div>' +
        mails + '</div>';
      wrap.addEventListener('click', (e) => {
        if (e.target === wrap || e.target.id === 'devoutclose') wrap.remove();
      });
      document.body.appendChild(wrap);
    }).catch(() => {});
  }

  function liveLogin() {
    document.body.innerHTML = '<div style="font-family:ui-monospace,monospace;max-width:26rem;margin:18vh auto;border:1px dashed #999;padding:1.2rem">' +
      '<div style="font-weight:600;margin-bottom:.4rem">Log in</div>' +
      '<div style="margin-bottom:.6rem">Enter the address this membership knows you by, and follow the link it sends.</div>' +
      '<input id="lemail" type="email" style="width:100%;padding:.45rem" placeholder="you@example.com">' +
      '<button id="lgo" style="margin-top:.5rem;padding:.45rem .9rem">Send the link</button>' +
      '<div id="lmsg" style="margin-top:.6rem"></div></div>';
    devInboxButton(); // the login screen is where the link is needed most
    document.getElementById('lgo').onclick = () => {
      api.post('/api/d/' + LIVESLUG + '/login',
        { email: document.getElementById('lemail').value.trim() })
        .then((res) => {
          document.getElementById('lmsg').innerHTML = res.devLink
            ? '<a href="' + res.devLink + '">dev · follow the magic link</a>'
            : 'If that address is on the membership, a link is on its way.';
        });
    };
  }

  function liveBoot() {
    const dev = document.querySelector('.devswitch');
    if (dev) dev.style.display = 'none';
    devInboxButton();
    fetch('/api/d/' + LIVESLUG + '/view').then((r) => {
      if (r.status === 401) { liveLogin(); return null; }
      return r.json();
    }).then((data) => {
      if (!data) return;
      cs = remoteCS(data);
      syncFromCs();
      const at = S.roster.findIndex((row) => (row.mid || FOUNDER) === data.me);
      if (at >= 0) S.viewer = at;
      const f = S.roster[0];
      if (f && data.convenor) { f.e = data.convenor.email;
        f.role = data.convenor.isMember ? 'member' : 'clerk';
        f.n = (data.me === data.convenor.id ? data.view.identity.name : data.convenor.name) || f.n || ''; }
      hydrateS();
      if (data.text) setProse(data.text);
      else if (data.provisionalText) setProse(data.provisionalText);
      render();
      setInterval(() => api.refresh(), 4000);
      // the founder's unconfirmed draft rides the stash (§9.7a v0.55)
      let deb = null;
      prose.addEventListener('input', () => {
        if (cs.textConfirmed || !amFounder()) return;
        clearTimeout(deb);
        deb = setTimeout(() => {
          api.post('/api/d/' + LIVESLUG + '/stash', { text: proseText() })
            .catch(() => {}); }, 800);
      });
    }).catch((e) => console.warn('[live] boot', e && e.message));
  }

  function birthBoot() {
    const dev = document.querySelector('.devswitch');
    if (dev) dev.style.display = 'none';
    devInboxButton();
    // pasted text syncs against the pending creation (§9.7a v0.55)
    let deb = null;
    prose.addEventListener('input', () => {
      if (!api.birth || !api.birth.pendingId) return;
      clearTimeout(deb);
      deb = setTimeout(() => {
        api.post('/api/docs/pending',
          { pendingId: api.birth.pendingId, text: proseText() })
          .catch(() => {}); }, 800);
    });
  }

  if (LIVEMODE) { liveBoot(); }
  else {
    // nothing opens itself, arrival included (Ed, 2026-08-20, reversing
    // the same morning's auto-open): the surface teaches by being clicked,
    // and the title task standing alone in the rail IS the first question
    if (BIRTH) birthBoot();
    relabel(); render();
  }
})();
</script>
