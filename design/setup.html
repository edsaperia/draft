          (S.open === 'text' ? h.para(card('text'))
          : '<div class="cpara textanchor"><span class="chipcol">' + h.chip(card('text')) + '</span>' +
            '<h2 class="doctitle dochead" id="dochead">' + esc(S.title || 'Untitled') + '</h2></div>')),
      note: (n) => (n ? n + ' still to confirm or answer' : 'all confirmed') },
  ];

  const VALUE = {
    text: () => { const n = [...prose.children].filter((b) => b.textContent.trim()).length;
      return n ? n + ' blocks' : (S.seen.has('text') ? 'Starts empty — the room writes it' : 'Nothing yet'); },
    title: () => S.title || 'Not named yet',
    slug: () => 'docs.vote/' + (S.slug || '…'),
    invite: () => 'Everyone has to agree',
    remove: () => ({ everyone: 'Everyone has to agree, including them',
      others: 'Everyone else has to agree',
      ordinary: 'A proposal ✏️ like any other' }[removalRung()]),
    myemail: () => (S.emailVerified ? S.myemail + ' · verified'
      : S.emailSent ? 'Check your inbox' : 'Not given yet'),
    myname: () => S.myname || 'Not given yet',
    mypic: () => (S.mypic ? 'Chosen' : 'Your initials'),
    // an invitee is not a member yet (§9.6a): the line counts the arrived,
    // and says who is still only invited
    roster: () => arrived() + (arrived() === 1 ? ' member' : ' members') +
      (members().length > arrived() ? ' · ' + (members().length - arrived()) + ' invited' : '') +
      (iDraft() ? '' : ' · you are the clerk'),
    policy: () => { const v = takenValOf('policy');
      return ({ invite: 'Invitation only', proposed: 'Applications by proposal',
        apply: 'Anyone may apply', open: 'Open' }[v ? v.joinPolicy : S.joinBy]) +
        ((v ? v.holder !== 'members' : S.rosterBy === 'founder') ? ' · 👑 reserved' : ''); },
    ending: () => (perpetual() ? 'Never — it runs until too few members are active'
      : new Date(endingVal() || S.endsAt).toLocaleString(undefined,
        { weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false })),
    bar: () => (takenOf('bar') || S.tClose) + '% sure at the end',
    pace: () => { const v = takenValOf('pace');
      const shape2 = v ? v.shape : S.shape;
      const start2 = v && v.shape === 'ramp' ? v.startPct : S.tStart;
      return (perpetual() ? 'Fixed — no end date to rise towards'
        : shape2 === 'ramp' ? 'Rising from ' + start2 + '%' : 'The same number throughout'); },
    quorum: () => (S.quorumForm === 'count'
      ? Math.min(takenOf('quorum') || S.quorumN, E()) + ' of ' + E()
      : (takenOf('quorum') || S.quorumPct) + '% — ' + quorumCount() + ' of ' + E()),
    authorship: () => ({ anonymous: 'Nobody’s name, ever', sealed: 'Names at the close',
      public: 'Names from the start' }[takenOf('authorship') || (S.authorship === 'roster' ? 'anonymous' : S.authorship)]),
    signing: () => ({ nobody: 'Nobody signs', each: 'Each author chooses', everybody: 'Everybody signs' }[
      takenOf('signing') || (S.signing === 'roster' ? 'nobody' : S.signing)]),
    judgments: () => ({ never: 'Never revealed', after: 'Revealed after the decision' }[
      takenOf('judgments') || (S.judgments === 'roster' ? 'never' : S.judgments)]),
    rate: () => { const v = takenValOf('rate');
      return (v ? v.grant : S.grant) + ' each · +1 every ' + (v ? v.dripMinutes : S.dripMin) +
        ' min · cap ' + (v ? v.cap : S.cap); },
    chamber: () => ({ link: 'Anyone with the link', closed: 'Members only', public: 'Public' }[S.chamber]),
    machines: () => { const tv = takenValOf('machines');
      const on = tv ? tv.enabled : S.auditor === true;
      return (on ? 'The coherence auditor, ' + (tv && tv.enabled ? tv.budget : S.auditorBudget) + ' ✏️s' : 'People only'); },
    lapse: () => (S.lapse === 'never' ? 'Never — however long you are away'
      : 'After ' + S.lapseDays + ' days without logging in'),
    removal: () => ({ everyone: 'Everyone has to agree, including them',
      others: 'Everyone else has to agree', ordinary: 'A proposal ✏️ like any other' }[removalRung()]),
    canpropose: () => (canPropose() ? 'Open' : 'Waiting on the starting text'),
    canjudge: () => (canJudge() ? 'Open' : 'Waiting on the constitution'),
  };
  const ANSVALUE = {
    quorum: (v) => 'You said ' + v + ' of ' + E(),
    bar: (v) => 'You said ' + v + '%',
    ending: (v) => (v === 'never' ? 'You said never'
      : 'You said ' + (isNaN(Date.parse(v)) ? v
        : new Date(v).toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false }))),
    authorship: (v) => 'You said ' + ({ anonymous: 'no names, ever', sealed: 'names at the close', public: 'names from the start' }[v] || v),
    signing: (v) => 'You said ' + ({ nobody: 'nobody signs', each: 'each author chooses', everybody: 'everybody signs' }[v] || v),
    judgments: (v) => 'You said ' + ({ never: 'never revealed', after: 'revealed after the decision' }[v] || v),
    chamber: (v) => 'You said ' + ({ closed: 'members only', link: 'anyone with the link', public: 'public' }[v] || v),
    machines: (v) => 'You said ' + (v ? 'AI proposals are fine' : 'no AI proposals'),
    lapse: (v) => (v === 'never' ? 'You said never' : 'You said after ' + v + ' days without logging in'),
    removal: (v) => 'You said ' + ({ everyone: 'everyone has to agree, including them',
      others: 'everyone but them', ordinary: 'a proposal ✏️ like any other' }[v] || v),
    rate: (v) => 'You said ' + v,
  };
  const ANSASK = { quorum: 'The lowest you will accept', bar: 'The lowest you will accept',
    ending: 'The latest you will accept', authorship: 'The most you will accept',
    signing: 'The most you will accept', judgments: 'The most you will accept',
    chamber: 'The most you will accept', machines: 'The most you will accept',
    lapse: 'The shortest you will accept',
    removal: 'The easiest you will accept',
    rate: 'The most generous you will accept' };
  const value = (c) => (c.ansFor
    ? esc(filled(c) ? ANSVALUE[c.ansFor](S.myAns[c.ansFor]) : ANSASK[c.ansFor])
    : esc(VALUE[c.k]()));
  // **A task you have to do needs no subtitle** (Ed, 2026-08-19: *subtitles
  // are there to help me make choices — if I have to do them, they don't need
  // extra information*; and on 📧, *the queue-card does not need "Not given
  // yet", that's why it's yellow*). The wash already says the state and the
  // title already says the question, so a line restating either was the rail
  // telling you twice. What survives is the two entries that are **not** asks
  // — a motion, whose subtitle is the thing being proposed and is exactly the
  // information you need to decide whether to open it, and a decision arriving
  // as news, where what happened is the whole point.
  const summary = (c) => {
    const m = motionOn(c);
    if (m) return 'Under motion — ' + esc(m.to);
    if (stateOf(c, ctx) === 'news') return value(c);
    return '';
  };

  // **What is unlocked, and by what.** Reading needs nothing. Proposing needs a
  // text to propose against. Judging needs the constitution settled, because a
  // judgment is *recorded under a disclosure setting* and *counted towards a
  // quorum*, and neither can be decided after the judgment without changing what
  // the judgment was.
  const canPropose = () => !!cs && cs.textConfirmed;
  const ceremony = () => CARDS.filter((c) => c.gate === 'judge');
  const canJudge = () => !!cs && cs.canJudge();

  // ---- motions (stage D of the merge, Ed 361) ---------------------------
  // A motion is the act of changing a **settled** document's rules (§9.6a):
  // before judging opens there are no past decisions for a change to re-rate,
  // so nothing is amended, only set — the founder re-sets freely, and these
  // exist only once the constitution is settled and judging is open.
  const motionsLive = () => canJudge();
  // ---- motions live in the module (9c): the page renders records --------
  const motionTargets = (rec) =>
    rec.payload.kind === 'invite' ? 'invite'
    : rec.payload.kind === 'remove' ? 'remove'
    : pkeyOf(rec.payload.kind === 'set' || rec.payload.kind === 'reserve'
      ? rec.payload.setting : 'membership');
  const nameOfMember = (mid2) => {
    const row = S.roster.find((r) => (r.mid || 'founder') === mid2);
    return row ? (row.n || row.e || mid2) : mid2;
  };
  // what a typed motion proposes, said in the page's own vocabulary
  const motionDisplay = (rec) => {
    const p = rec.payload;
    if (p.kind === 'reserve') {
      const rc = card(pkeyOf(p.setting));
      return 'Returns ' + (rc ? '“' + rc.t + '”' : p.setting) + ' to the founder’s reserve';
    }
    if (p.kind === 'invite') return p.email.split('@')[0] + ' joins the membership';
    if (p.kind === 'remove') return nameOfMember(p.member) + ' leaves the membership';
    if (p.kind === 'admit') return 'an applicant joins the membership';
    const k = pkeyOf(p.setting);
    if (k === 'title') return p.value.text;
    if (k === 'slug') return 'docs.vote/' + p.value.slug;
    if (k === 'pace') return (p.value.shape === 'fixed' ? 'The same number throughout'
      : 'Rising from ' + p.value.startPct + '%');
    if (k === 'policy') return ({ invite: 'Invitation only', proposed: 'Applications by proposal',
      apply: 'Anyone may apply', open: 'Open' })[p.value.joinPolicy];
    if (k === 'rate') return p.value.grant + ' each, up to ' + p.value.cap +
      ', one every ' + p.value.dripMinutes + ' minutes';
    return STANDS[k] ? STANDS[k](PAGEVAL[k](p.value)) : JSON.stringify(p.value);
  };
  const pageMotion = (rec) => ({ id: rec.id, kind: rec.route, by: rec.by,
    why: rec.why || '', to: motionDisplay(rec), status: rec.status,
    invite: rec.payload.kind === 'invite' ? rec.payload.email.split('@')[0] : undefined,
    removee: rec.payload.kind === 'remove' ? rec.payload.member : undefined });
  const liveMotionRec = (c) => {
    if (!cs || !c || c.isGate || c.ansFor || !motionsLive()) return null;
    for (const rec of cs.motionRecords().values()) {
      if (rec.status !== 'running' && rec.status !== 'awaiting-crown') continue;
      if (motionTargets(rec) === c.k) return rec;
    }
    return null;
  };
  const motionOn = (c) => { const rec = liveMotionRec(c); return rec ? pageMotion(rec) : null; };
  const routeOfM = (m) => m.kind;
  // the same two-act gesture (363a): the radio is provisional, the ✓ commits.
  // Constitutional commits are answerMotion; ordinary judging is a page-side
  // marker feeding the dev adjudication seam (the engine's job post-368).
  const myMAnsOk = () => (viewerRow().mAnsOk || (viewerRow().mAnsOk = new Set()));
  const motionPicked = (c) => S.mAns[c.k] !== undefined;
  const answeredMotion = (c) => {
    const rec = liveMotionRec(c);
    if (!rec) return false;
    if (rec.route === 'constitutional') return rec.answers.has(viewerId());
    return motionPicked(c) && myMAnsOk().has(c.k);
  };
  const motionJudged = (k) => {
    const rec = liveMotionRec(card(k));
    if (!rec) return 0;
    if (rec.route === 'constitutional') return rec.answers.size;
    return S.roster.filter((r) => r.mAnsOk && r.mAnsOk.has(k)).length;
  };
  // one 🏛️ out per member at a time (Ed, Q327): withdrawn, it comes back whole
  const myHeldOut = () => {
    if (!cs) return null;
    for (const rec of cs.motionRecords().values()) {
      if ((rec.status === 'running' || rec.status === 'awaiting-crown') &&
        rec.route === 'constitutional' && rec.by === viewerId()) {
        return motionTargets(rec);
      }
    }
    return null;
  };
  // DEV SEAM: the mock has no race engine, so an ordinary motion is
  // adjudicated the moment every member has judged it — carried if the
  // proposal out-polls what stands ('either' counts to neither side).
  // Post-368 the caller of adjudicateOrdinaryMotion is a real race (§9.6).
  function maybeAdjudicate(rec, k) {
    if (cs && cs.isRemote) return; // the engine adjudicates (Q391a)
    const rows = S.roster.filter((r) => r.role !== 'clerk' && r.in);
    if (!rows.every((r) => r.mAnsOk && r.mAnsOk.has(k))) return;
    const votes = rows.map((r) => (r.mAns || {})[k]);
    const up = votes.filter((v) => v === 'proposed').length;
    const down = votes.filter((v) => v === 'stands').length;
    try { cs.adjudicateOrdinaryMotion(now(), rec.id, up > down ? 'carried' : 'held');
      syncFromCs(); }
    catch (e) { console.warn('[cs]', e && e.message); }
    rows.forEach((r) => { if (r.mAns) delete r.mAns[k]; if (r.mAnsOk) r.mAnsOk.delete(k); });
  }
  // the typed value rides along as the draft is composed (d.val); the two
  // membership sentences parse at commit, where the row is at hand
  function draftPayload(d) {
    const dc = card(d.k);
    if (dc && dc.reg) {
      if (/ leaves the membership$/.test(d.to)) {
        const nm = d.to.replace(/ leaves the membership$/, '');
        const row = S.roster.find((r) => (r.n || r.e) === nm);
        return { kind: 'remove', member: row && row.mid ? row.mid : FOUNDER };
      }
      const who = d.to.replace(/ joins the membership$/, '');
      return { kind: 'invite', email: who.includes('@') ? who
        : who.toLowerCase().replace(/\s+/g, '.') + '@invited.example' };
    }
    if (!d.val) throw new Error('no typed value on the draft');
    return { kind: 'set', setting: midOf(d.k), value: d.val };
  }
  // a lane's display string → its typed value, one table (never parsed back)
  const MVAL = {
    pace: { 'The same number throughout': { shape: 'fixed' } },
    ending: { 'Never — it runs until too few members are active': { endsAtMs: null } },
    lapse: { 'Never — however long you are away': { afterMs: null } },
    removal: { 'Everyone has to agree, including them': { rung: 'everyone' },
      'Everyone else has to agree': { rung: 'others' },
      'A proposal ✏️ like any other': { rung: 'ordinary' } },
    machines: { 'People only': { enabled: false, budget: 0 } },
    chamber: { 'Members only': { rung: 'closed' }, 'Anyone with the link': { rung: 'link' }, 'Public': { rung: 'public' } },
    authorship: { 'Nobody’s name, ever': { rung: 'anonymous' }, 'Names at the close': { rung: 'sealed' }, 'Names from the start': { rung: 'public' } },
    signing: { 'Nobody signs': { rung: 'nobody' }, 'Each author chooses': { rung: 'each' }, 'Everybody signs': { rung: 'everybody' } },
    judgments: { 'Never revealed': { rung: 'never' }, 'Revealed after the decision': { rung: 'after' } },
  };
  const mvalTyped = (k, disp) => {
    if (k === 'policy') {
      const jp = { 'Invitation only': 'invite', 'Applications by proposal': 'proposed',
        'Anyone may apply': 'apply', 'Open': 'open' }[disp];
      const cur = csState('policy') && csState('policy').value;
      return jp ? { holder: cur ? cur.holder : regHolder(),
        joinPolicy: jp } : null;
    }
    if (card(k) && card(k).reg) return null; // membership sentences parse at commit
    return (MVAL[k] || {})[disp] || null;
  };
  // **The settled card is the composer** (Ed, 2026-08-18) — for any member,
  // on any settled setting, once the document is live. The founder is the
  // one exception on the settings they reserved: their control there is
  // unilateral (the 👑 rule, consented on the way in), so they keep the
  // setting body itself rather than a composer.
  // §9.7 v0.54: the founder's direct hand IS the unilateral power — where
  // it is given up (assent-only state) the founder composes like a member
  const founderDirect = (c) => {
    // direct removal is not built (the removal-policy setting will decide
    // its routes) — the founder composes a removal like any member
    if (c.k === 'remove') return false;
    if (c.reg) return regHolder() === 'reserved' || regHolder() === 'reserved-unilateral';
    const st = csState(c.k);
    return !st || st.powers.unilateral; };
  // the 👑 question exists exactly where the assent power is held
  const crownWaits = (c) => {
    if (c.reg) return regHolder() === 'reserved' || regHolder() === 'reserved-assent';
    const st = csState(c.k);
    return st ? st.holder === 'convenor' && st.powers.assent : !membersHold(c); };
  // The register counts as settled here (Ed's QA, 2026-08-19: *I can't seem
  // to suggest removing a member*): it has no value to settle, and what it
  // is, it always is — without this the membership card never composed, and
  // invitations and removals had no door.
  const composerOn = (c) => motionsLive() && viewerIsMember() && !c.isGate && !c.ansFor &&
    c.kind !== 'personal' && c.k !== 'text' && c.k !== 'roster' && settled(c) && !motionOn(c) &&
    !(amFounder() && !membersHold(c) && founderDirect(c));
  const commitFor = (c) => motionCommitHtml(c,
    (S.draft && S.draft.k === c.k) ? S.draft.to : '',
    !!myHeldOut() && myHeldOut() !== c.k);

  /* **A motion is composed with the setting's own control** (motion-controls),
     and the grammar is session-view's, via cards.js (Ed, 2026-08-18: *the
     composers on the session-view are the better ones*): the lane radios are
     laneBarHtml speaking data-mval, the rationale is the editing-card's own
     sealed-disc speaker — never an avatar, since authorship is sealed. */
  const PC = window.CARDS.make({ valAttr: 'data-mval', pickOf: (d) => (d ? d.to : null) });
  const laneBlock = (d, val, text) =>
    '<div class="propblock"><div class="rtext">' + text + '</div>' +
    PC.laneBarHtml(d, val, { edit: false }) + '</div>';
  const inputBlock = (html, note) =>
    '<div class="propblock"><div class="rtext">' + html + '</div>' + (note || '') + '</div>';
  // **What stands on a delegated setting is what the room's answers took**,
  // never the founder's field — that still says 'roster'. The consent rule,
  // computed live: highest for quorum and the bar, latest for the ending
  // (never latest of all), longest for lapse, most private for the privacy
  // family, most restrictive for machines, most generous for the rate.
  // what the room settled — the ceremony's resolution, a carried motion, a
  // crown-accepted change — translated back into the page's vocabulary.
  // Anything settled away from the convenor's own hand outranks the page's
  // provisional fields (v0.48: motions now apply).
  const takenOf = (k) => {
    const st = csState(k);
    if (!st || st.settledBy === null || st.settledBy === 'convenor' || st.value === null) return null;
    return PAGEVAL[k] ? PAGEVAL[k](st.value) : null;
  };
  // the whole typed value where one number is not enough (the rate)
  const takenValOf = (k) => {
    const st = csState(k);
    return st && st.settledBy !== null && st.settledBy !== 'convenor' ? st.value : null;
  };
  // a carried title or link changed under the page's mirrors — resync; and
  // the rows follow the register (carried invitations, removals, admissions)
  const syncFromCs = () => {
    if (!cs) return;
    const tv = csState('title'), lv = csState('slug');
    if (tv && tv.settledBy === 'motion' && tv.value.text !== S.title) S.title = tv.value.text;
    if (lv && lv.settledBy === 'motion' && lv.value.slug !== S.slug) S.slug = lv.value.slug;
    for (const [mid2, rec] of cs.memberRecords()) {
      if (mid2 === FOUNDER) continue;
      const row = S.roster.find((r) => r.mid === mid2);
      if (!row && !rec.removed) {
        S.roster.push({ n: rec.name || rec.email.split('@')[0], e: rec.email,
          role: 'member', in: rec.arrivedAtT !== null, mid: mid2, ans: {}, okd: new Set() });
      } else if (row && rec.removed) {
        const at = S.roster.indexOf(row);
        S.roster.splice(at, 1);
        if (S.viewer === at) S.viewer = 0;
      } else if (row && rec.arrivedAtT !== null && !row.in) {
        row.in = true;
      }
    }
  };
  // ...stated in the composers' own vocabulary, so a lane equal to what
  // stands filters itself out
  const STANDS = {
    chamber: (v) => ({ closed: 'Members only', link: 'Anyone with the link', public: 'Public' })[v],
    authorship: (v) => ({ anonymous: 'Nobody’s name, ever', sealed: 'Names at the close', public: 'Names from the start' })[v],
    signing: (v) => ({ nobody: 'Nobody signs', each: 'Each author chooses', everybody: 'Everybody signs' })[v],
    judgments: (v) => ({ never: 'Never revealed', after: 'Revealed after the decision' })[v],
    lapse: (v) => (v === 'never' ? 'Never — however long you are away' : 'After ' + v + ' days without logging in'),
    removal: (v) => ({ everyone: 'Everyone has to agree, including them',
      others: 'Everyone else has to agree',
      ordinary: 'A proposal ✏️ like any other' })[v],
    machines: (v) => (v ? 'The coherence auditor drafts here' : 'People only'),
    quorum: (v) => (S.quorumForm === 'count' ? v + ' of the membership' : v + '% of the membership'),
    bar: (v) => v + '% sure at the end',
    ending: (v) => (v === 'never' ? 'Never — it runs until too few members are active'
      : new Date(v).toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false })),
    rate: (v) => { const tv = takenValOf('rate');
      return v + ' each · +1 every ' + (tv ? tv.dripMinutes : S.dripMin) +
        ' min · cap ' + (tv ? tv.cap : S.cap); },
  };
  const standsOf = (k) => {
    const c = card(k);
    if (c && isRoom(c)) {
      const v = takenOf(k);
      if (v !== null && STANDS[k]) return STANDS[k](v) || '';
    }
    return VALUE[k] ? String(VALUE[k]() || '') : '';
  };
  // what stands is never offered back: picking the current rule is not a change
  const currentOf = (k) => standsOf(k);
  const lanesFor = (d, pairs, k) => pairs.filter(([val]) => !currentOf(k).startsWith(val))
    .map(([val, text]) => laneBlock(d, val, text)).join('');
  const whyLane = (d) =>
    '<div class="lanebox whylane"><div class="speaker">' +
    '<span class="disc" aria-hidden="true" title="This is how your reason will reach everybody else: with your name off it."></span>' +
    '<div class="said edit-why" contenteditable="plaintext-only" spellcheck="false" data-motionlane="why"' +
    ' data-placeholder="We should change this because…">' + esc((d && d.why) || '') + '</div></div></div>';

  const POLICY_TEXTS = [
    ['Invitation only', 'Membership is by invitation only.'],
    ['Applications by proposal', 'Anyone may apply, but an application must be proposed ✏️ by a member.'],
    ['Anyone may apply', 'Anyone may apply to join.'],
    ['Open', 'Anyone with the link joins on arrival.'],
  ];
  // every composable setting has its control (Ed's QA, 2026-08-18) — a text
  // box asks somebody to guess a format the surface already knows
  const PROPOSE = {
    title: (d) => inputBlock('The document is titled ' +
      '<input data-mtext="1" value="' + esc(d.to || S.title) + '" style="width:22rem">.'),
    slug: (d) => inputBlock('The document lives at docs.vote/' +
      '<input data-mslug="1" value="' + esc((d.to || S.slug).replace(/^docs\.vote\//, '')) + '" style="width:12rem">.',
      '<p class="setnote">Every link the document has ever had keeps working — a change leaves a redirect behind.</p>'),
    pace: (d) => lanesFor(d, [['The same number throughout',
        'The approval threshold stays the same all the way through.']], 'pace') +
      inputBlock('The approval threshold starts at ' +
        '<input class="num" type="number" min="50" max="99" data-mpace="1" value="' +
        esc((/^Rising/.test(d.to) && (d.to.match(/\d+/) || [])[0]) || S.tStart) + '">% and rises to the number at the end.'),
    rate: (d) => {
      const n = d.to.match(/\d+/g) || [];
      return inputBlock('Members start with ' +
        '<input class="num" type="number" min="0" max="40" data-mrate="x" value="' + esc(n[0] || S.grant) + '"> ✏️ each, up to a maximum of ' +
        '<input class="num" type="number" min="1" max="99" data-mrate="y" value="' + esc(n[1] || S.cap) + '">. They get an additional ✏️ every ' +
        '<input class="num" type="number" min="5" max="2880" data-mrate="z" value="' + esc(n[2] || S.dripMin) + '"> minutes.');
    },
    ending: (d) => {
      const never = /never/i.test(d.to);
      return inputBlock('The drafting process will end on ' +
          '<input type="datetime-local" data-mdate="1" value="' + esc(S.endsAt || '') + '">.') +
        lanesFor(d, [['Never — it runs until too few members are active',
          'The drafting process has no set end — it runs until too few members are active.']], 'ending') +
        (never ? '<p class="setnote">Taking the end date away needs everyone to agree — with no end date the approval threshold cannot rise.</p>' : '');
    },
    bar: (d) => inputBlock('A change carries when the members are ' +
      '<input class="num" type="number" min="50" max="99" data-mnum="% sure at the end" value="' +
      esc((d.to.match(/\d+/) || [])[0] || takenOf('bar') || S.tClose) + '">% sure at the end.'),
    quorum: (d) => (S.quorumForm === 'count'
      ? inputBlock('Quorum is <input class="num" type="number" min="1" max="99" data-mnum=" of the membership" value="' +
        esc((d.to.match(/\d+/) || [])[0] || takenOf('quorum') || quorumCount()) + '"> of the membership.')
      : inputBlock('Quorum is <input class="num" type="number" min="1" max="100" data-mnum="% of the membership" value="' +
        esc((d.to.match(/\d+/) || [])[0] || takenOf('quorum') || S.quorumPct) + '">% of the membership.')),
    removal: (d) => lanesFor(d, [
      ['Everyone has to agree, including them', 'Removing a member needs everyone to agree, including them.'],
      ['Everyone else has to agree', 'Removing a member needs every other member to agree.'],
      ['A proposal ✏️ like any other', 'A member is removed by a proposal, judged like any other.']], 'removal'),
    lapse: (d) => lanesFor(d, [['Never — however long you are away',
        'A membership never lapses, however long somebody is away.']], 'lapse') +
      inputBlock('A membership lapses after ' +
        '<input class="num" type="number" min="7" max="720" data-mnum=" days without logging in" value="' +
        esc((d.to.match(/\d+/) || [])[0] || S.lapseDays) + '"> days without logging in.'),
    authorship: (d) => lanesFor(d, [
      ['Nobody’s name, ever', 'A proposer is never named — not even in the closing record.'],
      ['Names at the close', 'Proposers are named in the closing record, never before.'],
      ['Names from the start', 'Every proposal carries its proposer’s name from the moment it is made.']], 'authorship'),
    signing: (d) => lanesFor(d, [
      ['Nobody signs', 'No proposal carries a signature.'],
      ['Each author chooses', 'A proposer may sign or stay unsigned, proposal by proposal.'],
      ['Everybody signs', 'Every proposal is signed.']], 'signing'),
    judgments: (d) => lanesFor(d, [
      ['Never revealed', 'Judgments are never revealed — not even in the closing record.'],
      ['Revealed after the decision', 'Judgments are published with the record of each decision, never before.']], 'judgments'),
    chamber: (d) => lanesFor(d, [
      ['Members only', 'Only members can read the document.'],
      ['Anyone with the link', 'Anyone with the link can read it; it is not listed.'],
      ['Public', 'Listed and readable by anyone.']], 'chamber'),
    machines: (d) => lanesFor(d, [['People only', 'People only — no machine drafts here.']], 'machines') +
      inputBlock('The coherence auditor drafts alongside the members, with a budget of ' +
        '<input class="num" type="number" min="1" max="40" data-mnum=" ✏️s for the coherence auditor" value="' +
        esc(S.auditorBudget) + '"> ✏️s.'),
    policy: (d) => POLICY_TEXTS.filter(([val]) => !currentOf('policy').startsWith(val))
      .map(([val, text]) => laneBlock(d, val, text)).join('') +
      '<p class="setnote">One motion proposes one rule; what you do not touch stands.</p>',
    // ✉️: whom to bring in — the invite half of what was one roster
    // composer (Ed, 2026-08-19, 400a)
    invite: (d) =>
      '<div class="roster"><div class="addrow"><input placeholder="Somebody to invite" data-mjoin="1">' +
      '<button class="btn" data-mjoinbtn="1">Invite</button></div></div>' +
      '<p class="setnote">An invitation is constitutional, because who is in the room is what quorum is a fraction of: everyone consents, and one member who says no keeps them out.</p>',
    // ❌: the membership, in front of you, with an ✕ beside each — which
    // is what “propose a removal” means
    remove: (d) =>
      '<div class="roster">' + S.roster.map((p, i) =>
        '<div class="rperson' + (d.to === (p.n || p.e) + ' leaves the membership' ? ' picked' : '') + '">' +
        avHtml(p) + '<span><span class="nm">' + esc(p.n || p.e || '—') +
        (i === S.viewer ? ' <span class="chip">you</span>' : '') + '</span></span>' +
        (i === S.viewer ? '<span class="xdrop"> </span>'
          : '<button class="xdrop" data-mval="' + esc((p.n || p.e) + ' leaves the membership') + '"' +
            ' title="Propose that they leave">✕</button>') +
        '</div>').join('') + '</div>' +
      // no route note: the 🚪 clause states how a removal is decided, and
      // hardcoding one rung here lied under the other two (copy pass,
      // 2026-08-19)
      '<p class="setnote">Whoever it is will see the proposal — nobody is removed in secret.</p>',
  };

  // A constitutional motion re-opens consent: what is proposed, what stands,
  // two answers, one refusal keeps what stands. The pick markup is one
  // helper — invite, removal and the generic body differ only in copy.
  const consentPicks = (key, opts) => '<div class="choice" role="radiogroup">' +
    opts.map(([v, label, exp]) =>
      '<div class="pick' + (S.mAns[key] === v ? ' on' : '') + '"><button class="lanepick"' +
      ' aria-pressed="' + (S.mAns[key] === v) + '" data-motion="' + v + '"><span class="dot"></span>' +
      '<span>' + label + '</span></button>' +
      '<span class="exp">' + exp + '</span></div>').join('') + '</div>';
  const inviteBody = (m) =>
    '<p class="why">Whether <b>' + esc(m.invite) + '</b> joins the membership. Adding a member changes what quorum is a fraction of, so it is constitutional: the most restrictive answer wins, and one member who says no keeps them out.</p>' +
    consentPicks('invite', [
      ['no', 'I would rather they did not', 'They stay out. Nobody is told who said so.'],
      ['yes', 'I accept them joining', 'They start with the ✏️s everyone got, plus what the drip has added since, and quorum recomputes.'],
      ['abstain', 'Abstain', 'An answer, not a block: they can join without your consent counting either way.'],
    ]) + BLINDNOTE;
  const removeBody = (m) => {
    const nm = nameOfMember(m.removee);
    // 🏛️ without [avatar] (Q401a): under 'others' the subject sees the
    // motion running against them — ruled, Ed 2026-08-19 — and is asked
    // nothing; it settles without them.
    if (removalRung() === 'others' && m.removee && m.removee === viewerId()) {
      return '<p class="why">Whether <b>you</b> leave the membership. Under this document’s rule that is decided by <b>everyone but you</b> — you see it running, and your answer is not asked.</p>' +
        '<p class="setnote">' + (m.judged || 0) + ' of ' + Math.max(E() - 1, 0) + ' have answered. One refusal keeps you in.</p>';
    }
    return '<p class="why">Whether <b>' + esc(nm) + '</b> leaves the membership. Removing a member changes what quorum is a fraction of, so it is constitutional — ' +
    (removalRung() === 'others'
      ? 'decided by everyone but them; they see it running.'
      : 'and their own answer counts among everyone’s.') + '</p>' +
    consentPicks('remove', [
      ['no', 'They stay', 'Nobody is told who said so.'],
      ['yes', 'I accept their leaving', 'Their judgments already cast keep counting; quorum recomputes.'],
      ['abstain', 'Abstain', 'An answer, not a block.'],
    ]) + BLINDNOTE;
  };
  const consentBody = (c, m) => (m.invite ? inviteBody(m)
    : m.removee !== undefined ? removeBody(m) :
    '<p class="why">Whether <b>' + esc(m.to) + '</b> replaces <i>' + esc(standsOf(c.k)) + '</i>. Nothing is being judged: you state what you will accept, and one refusal keeps what stands.</p>' +
    consentPicks(c.k, [
      ['no', 'Keep what stands', 'Nobody is told who said so.'],
      ['yes', 'I accept the change', 'It carries once all ' + E() + ' stand at accept — or abstain.'],
      ['abstain', 'Abstain', 'An answer, not a block: the motion can carry without your consent counting either way.'],
    ]) + BLINDNOTE);

  // dev only (with the dropdown, Ed 362): complete the founding in one press,
  // because motions live on the far side of it and the mock has no persistence
  // ⏩ settle the founding — now a scripted drive of REAL module commands
  // (plan 367a: the strongest single assertion — the module-driven page must
  // render what the state-poked page rendered)
  function devFastForward() {
    if (!S.title) { S.title = 'The Hollow Oak Club — House Charter'; }
    if (!S.slug) { const sg = suggestSlug(S.title); S.slug = sg.slug; S.slugTaken = sg.taken; }
    const f = S.roster[0];
    if (!f.e) f.e = 'ash@hollowoak.org';
    if (!f.n) f.n = 'Ash Bellamy';
    S.emailSent = true; S.emailVerified = true;
    try {
      if (!cs) {
        cs = window.cs = M.ConstitutionSession.open({ title: S.title, slug: S.slug,
          convenor: { id: FOUNDER, email: f.e, isMember: f.role !== 'clerk' } }, now());
      }
      if (f.role !== 'clerk') { try { cs.setIdentity(now(), FOUNDER, { name: f.n }); } catch (e) {} }
      if (S.roster.length === 1) { invite('ivy@hollowoak.org'); invite('moss@hollowoak.org'); }
      const named = { 'ivy@hollowoak.org': 'Ivy Fen', 'moss@hollowoak.org': 'Moss Whitlow' };
      S.roster.forEach((r) => { if (named[r.e]) r.n = named[r.e]; });
      S.roster.forEach((r) => { if (!r.founder && !r.in) { r.in = true;
        if (r.mid) { try { cs.arrive(now(), r.mid);
          cs.setIdentity(now(), r.mid, { name: r.n }); } catch (e) {} } } });
      if (!cs.textConfirmed) { try { cs.confirmStartingText(now(), proseText()); } catch (e) {} }
      CARDS.forEach((c) => S.seen.add(c.k));
      // the founder's confirms: delegate what the radios delegate, set the rest
      for (const k of MANAGED_KEYS) {
        if (k === 'title' || k === 'slug') continue;
        try { commitSetting(k); } catch (e) {}
      }
      // the room answers what was delegated — real commands, every seat,
      // dependency order (ending first: the bar question waits on it)
      const FILL = { ending: S.endsAt || '2026-08-20T18:00',
        quorum: (S.quorumForm === 'count' ? S.quorumN : S.quorumPct),
        bar: S.tClose, authorship: 'anonymous', signing: 'nobody',
        judgments: 'never', chamber: 'closed', machines: false,
        lapse: 'never', removal: 'everyone', rate: S.grant };
      for (const k of Object.keys(FILL)) {
        const st = csState(k);
        if (!st || !st.collecting) continue;
        S.roster.forEach((r) => {
          if (r.role === 'clerk' || !r.in) return;
          r.ans = r.ans || {};
          if (r.ans[k] === undefined || r.ans[k] === null) r.ans[k] = FILL[k];
          try { cs.answer(now(), r.mid || FOUNDER, midOf(k), ANSTYPED[k](r.ans[k])); } catch (e) {}
        });
      }
      // acknowledgments, page and module agreeing
      S.roster.forEach((r) => {
        if (r.role === 'clerk') return;
        r.okd = r.okd || new Set();
        CARDS.forEach((c) => { r.okd.add('res-' + c.k); r.okd.add('set-' + c.k); });
        r.okd.add('canpropose'); r.okd.add('canjudge');
        const rec = cs.memberRecords().get(r.mid || FOUNDER);
        if (rec) for (const sid of [...rec.okOwed]) {
          try { cs.giveOk(now(), r.mid || FOUNDER, sid); } catch (e) {}
        }
      });
    } catch (e) { console.warn('[cs devff]', e && e.message); }
  }

  // the membership list, as the 🪪 card's clause — the current text of the
  // rule, with the ✕ that edits it, replacing the copy that lived in the body
  // **The hat is a row in this list** (Ed, 2026-08-18: *does the founder
  // invite themselves? … make it a default, pre-checked*). Your own row is
  // first and ticked; unticking it makes you the clerk — administering
  // without writing — and you did not have to be the first member you
  // invited. Only yours to flip until judging starts; after that you join
  // the way anybody joins.
  const rosterClause = () =>
    '<div class="roster clauselist">' + S.roster.map((p, i) =>
      '<div class="rperson">' + avHtml(p) +
      '<span><span class="nm">' + esc(p.n || 'Anonymous') + (p.founder ? ' <span class="chip founder">founder</span>' : '') +
      '</span><br><span class="em">' + esc(p.e || '—') + '</span></span>' +
      (p.founder
        ? '<span class="chip">' + (iDraft() ? 'member' : 'clerk') + '</span>'
        : '<span class="chip' + (p.in ? '' : ' pending') + '">' +
          (p.role === 'clerk' ? 'clerk' : 'member') + (p.in ? '' : ' · invited') + '</span>') +
      (p.founder ? '<span class="xdrop"> </span>' : '<button class="xdrop" data-drop="' + i + '">✕</button>') +
      '</div>').join('') + '</div>' + liveApplicantsHtml();

  // **The constitution, stated** (Ed, 2026-08-18): who convened it, when it
  // was constituted — the moment judging opens — and every constitutional
  // setting's current value, one line each, the glyph doing the naming.
  // ---- the grammar's other three states (Ed, 2026-08-18) ------------------
  // wait: the inbox holds the next move, a delegated question is being
  // answered, your own answer is in and the room's are not, a gate's
  // blockers are still above it. news: a delegated question resolved — the
  // number came back, and it pins until your OK, because a reveal you
  // answered blind into is a decision you are owed; a gate opening takes
  // the same rule, being exactly the shape of an unacknowledged decision.
  const waiting = (c) => (motionOn(c) ? answeredMotion(c)
    : c.isGate ? !c.open()
    : c.k === 'myemail' ? (S.emailSent && !S.emailVerified)
    : c.ansFor ? (answered(c) && ((card(c.ansFor).in || 0) < E()))
    : isRoom(c) && settled(c) && (c.in || 0) < E());
  // **Nothing is owed an OK until the document begins** (Ed, 2026-08-19,
  // closing 414: *the bar is not actually set until judging starts, so they
  // shouldn't get the OK until then — same for anything else like this*).
  // §9.6a is the reason it was always half-true: before the start the founder
  // re-sets freely and a resolved question can still ground-shift, so an OK
  // collected then acknowledges a rule that may not be the rule. A gate is
  // the exception and the proof — a gate opening is not a rule being set, it
  // is a thing that has happened to you.
  const constituted = () => !!(cs && cs.constitutedAtT !== null);
  const news = (c) => (motionOn(c) ? false
    : c.isGate ? (c.open() && !S.okd.has(c.k))
    : !constituted() ? false
    : !c.ansFor && isRoom(c) && settled(c) && E() > 0 && (c.in || 0) >= E() &&
      !S.okd.has('res-' + c.k))
    // **a constitutional rule you had no say in is a decision you are
    // owed** (the live rail's rule, arriving here): a founder-set
    // constitutional setting is news to every other member until their OK
    // a door is not a decision — nobody set it, nothing binds through it —
    // so it is never news to acknowledge (pacing pass, 2026-08-19: the ✉️❌
    // doors were landing in every member's rail as OK cards at the start)
    || (!amFounder() && !c.ansFor && !c.isGate && !c.door && !isRoom(c) && c.own !== 'you' &&
      c.kind === 'constitutional' && settled(c) && !S.okd.has('set-' + c.k));

  // **The constitution states itself in sentences** (Ed, 2026-08-18): each
  // decision has a what-phrase for its open states and a declarative
  // sentence once decided, all in the founder's own frame.
  const WHAT = {
    ending: 'when the drafting process will end',
    quorum: 'how many members must weigh in before a question can carry',
    bar: 'how sure the room must be at the close',
    pace: 'how the approval threshold climbs to the close',
    authorship: 'when a proposer is named',
    signing: 'who may sign a proposal',
    judgments: 'whether judgments are revealed with the record',
    chamber: 'who may read the document',
    lapse: 'whether an inactive membership lapses',
    removal: 'how a member is removed',
    machines: 'whether an AI makes proposals',
    rate: 'how often members may propose',
    policy: 'how people become members',
    slug: 'the document’s address',
    text: 'the text the document starts from',
  };
  // the 🚪 rung as it stands (Q401) — unset reads as today's rule
  const removalRung = () => takenOf('removal') ||
    (S.removal === 'roster' ? 'everyone' : S.removal);
  const endFmt = () => new Date((endingVal() !== 'never' && endingVal()) || S.endsAt)
    .toLocaleString(undefined,
      { weekday: 'long', hour: '2-digit', minute: '2-digit', hour12: false }).replace(' ', ' at ');
  const DECIDED = {
    ending: () => (perpetual() ? 'The drafting process has no set end — it runs until too few members are active.'
      : 'The drafting process will end on ' + endFmt() + '.'),
    quorum: () => (S.quorumForm === 'count'
      ? Math.min(takenOf('quorum') || S.quorumN, E()) + ' of the ' + E() + ' members'
      : (takenOf('quorum') || S.quorumPct) + '% of the members') + ' must have judged a question before it can change the document.',
    bar: () => 'By the end, the members must be ' + (takenOf('bar') || S.tClose) + '% sure a change is better for it to carry.',
    pace: () => { const v = takenValOf('pace');
      const shape2 = v ? v.shape : S.shape;
      const start2 = v && v.shape === 'ramp' ? v.startPct : S.tStart;
      return (perpetual() || shape2 !== 'ramp'
        ? 'The approval threshold stays the same all the way through.'
        : 'The approval threshold starts at ' + start2 + '% and rises to ' + (takenOf('bar') || S.tClose) + '% by the end.'); },
    authorship: () => ({ anonymous: 'Nobody who proposes a change is ever named, even after the document is finished.',
      sealed: 'Whoever proposes a change is named when the document is finished, and not before.',
      public: 'Whoever proposes a change is named from the moment they propose it.' })[
      takenOf('authorship') || (S.authorship === 'roster' ? 'anonymous' : S.authorship)],
    signing: () => ({ nobody: 'Nobody may sign a proposal.', each: 'Each author chooses whether to sign.',
      everybody: 'Every proposal is signed.' })[
      takenOf('signing') || (S.signing === 'roster' ? 'nobody' : S.signing)],
    judgments: () => ({ never: 'What somebody preferred is never made public.',
      after: 'What somebody preferred is made public when the document is finished, and not before.' })[
      takenOf('judgments') || (S.judgments === 'roster' ? 'never' : S.judgments)],
    chamber: () => ({ closed: 'Only members can see the document.',
      link: 'Anyone with the link can read the document.',
      public: 'The document is public — listed and readable by anyone.' })[
      takenOf('chamber') || (S.chamber === 'roster' ? 'closed' : S.chamber)],
    lapse: () => { const tv = takenOf('lapse');
      const v = tv !== null ? tv : (S.lapse === 'roster' ? null : S.lapse);
      return (v === 'never' ? 'Nobody stops being a member, however long they are away.'
      : 'Somebody stops being a member after ' + (typeof v === 'number' ? v : S.lapseDays) + ' days without logging in.'); },
    machines: () => { const tv = takenValOf('machines');
      const on = tv ? tv.enabled : (S.auditor === 'roster' ? false : S.auditor === true);
      const budget = tv && tv.enabled ? tv.budget : S.auditorBudget;
      return (on
      ? 'An AI makes proposals here, with ' + budget + ' ✏️s of its own. It never judges and counts towards nothing.'
      : 'There are no AI proposals.'); },
    rate: () => { const v = takenValOf('rate');
      return 'Members start with ' + (v ? v.grant : S.grant) + ' ✏️ each, up to a maximum of ' +
        (v ? v.cap : S.cap) + '. They get an additional ✏️ every ' + (v ? v.dripMinutes : S.dripMin) +
        ' minutes. A proposal that carries gives its ✏️ back.'; },
    policy: () => { const v = takenValOf('policy');
      return ({ invite: 'Membership is by invitation only.',
        proposed: 'Anyone may apply, but nothing happens until a member takes the application up and proposes it ✏️.',
        apply: 'Anyone may apply to join.',
        open: 'Anyone with the link joins on arrival.' })[v ? v.joinPolicy : S.joinBy] +
        regLine(v ? v.holder : regHolder()); },
    slug: () => 'The document lives at docs.vote/' + S.slug + '.',
    removal: () => ({
      everyone: 'Removing a member needs every member to agree, including them.',
      others: 'Removing a member needs every other member to agree — they see the proposal, and it is decided without them.',
      ordinary: 'A member is removed by a proposal ✏️, judged like any other change.',
    })[removalRung()],
    invite: () => 'Anyone may be proposed as a new member, and every member has to agree — one refusal keeps them out.',
    // the ❌ door states whatever route the 🚪 setting decides (Q401)
    remove: () => ({
      everyone: 'A member may be proposed for removal, and every member has to agree — including them.',
      others: 'A member may be proposed for removal, and every other member has to agree.',
      ordinary: 'A member may be proposed for removal — a proposal ✏️ like any other.',
    })[removalRung()],
    text: () => { const n = [...prose.children].filter((b) => b.textContent.trim()).length;
      return n ? 'The document starts from ' + n + ' blocks of text.'
        : 'The document starts empty — the members write it.'; },
  };
  // 404 (Ed, 2026-08-19): the preamble states the defaults once; a clause
  // states only its deviations, in 396c's precise third person. Delegated
  // ⇒ silence — the defaults are the whole of the rule.
  const holderLine = (k) => {
    if (!cs || k === 'policy' || !MANAGED_KEYS.includes(k)) return '';
    const st = csState(k);
    if (!st || st.holder === 'members') return '';
    const p = st.powers;
    return (p.unilateral ? ' ' + PW_HELD.u : '') +
      (p.assent ? ' ' + PW_HELD.a : '');
  };
  // **Links in the constitution are real links** (Ed, 2026-08-19):
  // underlined, ink-coloured (.doclink), applied after escaping so a
  // sentence can never smuggle markup in
  const linkify = (s) => String(s).replace(/\bdocs\.vote\/[a-z0-9][a-z0-9-]*/g,
    (m2) => '<a class="doclink" href="https://' + m2 + '" target="_blank" rel="noopener">' + m2 + '</a>');
  const decisionLine = (c) => {
    if (c.ansFor) return answered(c)
      ? 'The Founder has answered as a member.'
      : 'The Founder has not yet answered as a member.';
    if (c.k === 'canpropose') { const done = LIVE().some(owesAnswer) ? 0 : 1;
      return canPropose() && done
      ? 'Members may propose as soon as they arrive.'
      : 'Members may begin proposing when the starting text has been decided and they have answered the questions the Founder delegated — ' +
        done + ' of ' + E() + ' have answered everything.'; }
    if (c.k === 'canjudge') return canJudge()
      ? 'Members may judge proposals.'
      : 'Members may begin judging proposals when the whole constitution has been decided.';
    if (c.k === 'myemail') return S.emailVerified ? 'Your address is verified.'
      : S.emailSent ? 'Your address is awaiting verification.'
      : 'Your address is not yet given.';
    if (c.kind === 'personal') return summary(c);
    if (isRoom(c)) {
      const st = csState(c.k);
      const collecting = st ? st.collecting : !((c.in || 0) >= E() && E() > 0);
      return !collecting && (!st || st.value !== null)
        ? (DECIDED[c.k] ? DECIDED[c.k]() : value(c)) + holderLine(c.k)
        // while the founder is the only person the document knows about, an
        // answer count would be counting the founder alone (pacing pass,
        // 2026-08-19) — the honest tail is that the question waits for a room
        : 'The Founder has delegated to members to decide ' + (WHAT[c.k] || 'this') + ' — ' +
          (roomExists() ? Math.min(c.in || 0, E()) + ' of ' + E() + ' have answered.'
            : 'waiting for members.');
    }
    return settled(c) ? (DECIDED[c.k] ? DECIDED[c.k]() : value(c)) + holderLine(c.k)
      : 'The Founder is deciding ' + (WHAT[c.k] || 'this') + '.';
  };

  const ctx = {
    get open() { return S.open; }, get E() { return E(); },
    clauseFor: (c) => (c.k === 'roster' ? rosterClause() : ''),
    // the title card's head is the document title itself — the clause,
    // opened — never the word “Title” (Ed, 2026-08-18)
    inDocOpenSlot: false,
    headFor: (c) => {
      if (c.power) return esc(powerHeadLine(c));
      // post-save the title card opens at its own clause, so its head is
      // the clause sentence (the headdoct span stays: refreshCommit types
      // into it live); at the birth it is still the big heading itself
      if (c.k === 'title') return (cs ? 'The document is titled ' + LD : '') +
        '<span class="headdoct' + (S.title ? '' : ' ph') + '">' +
        esc(S.title || 'Untitled') + '</span>' + (cs ? RD + '.' : '');
      const m = motionOn(c);
      // an ordinary motion's head is the value as it stands, wearing the
      // keep-lane; a constitutional one re-opens the question, title head.
      if (m) return routeOfM(m, c) === 'ordinary' ? esc(standsOf(c.k)) : null;
      // **The head is the rule, not the task's name** (Ed's QA, 2026-08-19):
      // a settled card is its own paragraph, opened, so what stands at its
      // head is the constitutional sentence the paragraph states. The
      // exceptions are cards whose clause is a thing rather than a sentence
      // — the membership (the list) and the starting text (the document
      // itself) — and open questions, which their title names better than
      // a rule that does not exist yet.
      if (c.k === 'text' || c.k === 'roster') return null;
      if (c.isGate) return linkify(esc(decisionLine(c)));
      if (c.ansFor || c.kind === 'personal') return null;
      if (settled(c)) return linkify(esc(decisionLine(c)));
      if (composerOn(c)) return esc(standsOf(c.k));
      return null;
    },
    // reserved = held by the founder: the room may pass a change, and it
    // then goes to the founder as a 👑 question (accept or reject)
    reserved: (c) => !c.power && !c.isGate && !c.ansFor && c.kind !== 'personal' && !membersHold(c),
    // a section never folds while it holds the open card or its tasks
    foldedSec: (sec) => S.folded.has('cs-' + sec.key) &&
      !sec.cards.some((c) => S.open === c.k ||
        (tasksFor(c) || []).some((t2) => S.open === t2.k)),
    secToggle: (sec) => secToggleHtml('cs-' + sec.key),
    // the whole constitution folds under its own heading (Ed, 2026-08-19);
    // never while any card is open — a fold must not swallow the open card
    foldedGroup: () => S.folded.has('cs-constitution') && !S.open,
    groupToggle: () => secToggleHtml('cs-constitution'),
    // power tabs (403): synthetic cards — never asks, never tasks; their
    // decision line is the power's own rule sentence
    mustAct: (c) => (c.power ? false : mustAct(c)),
    waiting: (c) => (c.power ? false : waiting(c)),
    news: (c) => (c.power ? false : news(c)),
    tasksFor: (c) => (c.power ? [] : tasksFor(c)),
    // esc before linkify, like the head path (review #1, finding 20): the
    // sentence carries the title, which is member text — unescaped it was
    // stored XSS into the constitution paragraph
    decisionLine: (c) => linkify(esc(c.power ? powerHeadLine(c) : decisionLine(c))),
    chipsFor: (c) => (cs && !c.power && !c.ansFor && PW_KEYS.includes(c.k)
      ? [c, card('pw:u:' + c.k), card('pw:a:' + c.k)] : [c]),
    summary, value, isRoom,
  };

  // ---- the rail ----------------------------------------------------------
  // Grouped by pile and in pile order, so the two columns agree and nothing
  // jumps when you confirm something (Q320). Your own pile first: on this
  // screen that is the founder's, on the ceremony it is the members'.
  function renderRail() {
    if (S.viewer === 'applicant') {
      // **The applicant's seat follows the 🤝 rule as it stands** (pacing
      // pass, 2026-08-19: the topbar said "applications open" whatever the
      // policy said). Under invitation-only there is nothing to apply for;
      // under "open" arrival is joining, not applying; and an application
      // becomes an ordinary motion, so before judging opens there is no
      // room to put one before — the Apply task exists only where and when
      // applying is a real act.
      const applying = (S.joinBy === 'proposed' || S.joinBy === 'apply');
      const now2 = applying && canJudge();
      rail.innerHTML = now2
        ? '<ul>' + APPCARDS().map((c) => railEntry(c, appCtx)).join('') + '</ul>' : '';
      document.getElementById('stat-stage').textContent = 'reading only · ' +
        (!applying ? (S.joinBy === 'open' ? 'anyone with the link may join' : 'membership is by invitation')
          : now2 ? 'applications open' : 'applications open when the document begins');
      document.getElementById('stat-who').textContent = arrived() + ' in the room';
      return;
    }
    const gs = groups();
    rail.innerHTML =
      // What is settled leaves the rail — it is the pile's, and the block's
      // to name — and a gate shows only as news: the moment it opens, until
      // its OK. Locked, it is a ⏳ tab in the pile and nothing else, because
      // nothing is being asked of you (Ed, 2026-08-18: *everyone should only
      // see cards they can act on*). ⏳ entries stay: they are where the
      // fill says how far the room has got.
      '<ul>' + secLive().map((s2) => ({ ...s2, cards: s2.cards
        .flatMap((c) => [c].concat(tasksFor(c)))
        .filter((c) => !owesOwnAnswer(c))
        .filter((c) => (c.isGate ? stateOf(c, ctx) === 'news' : stateOf(c, ctx) !== 'done')) }))
        .filter((s2) => s2.cards.length).map((s2) =>
        s2.cards.map((c) => railEntry(c, ctx)).join('')).join('') + '</ul>';

    document.getElementById('stat-stage').textContent =
      canJudge() ? 'open' : canPropose() ? 'proposals open' : 'reading only';
    document.getElementById('stat-who').textContent = arrived() + ' in the room';
    document.getElementById('mebtn').innerHTML = avHtml(me(), 'face');
  }
  // the dev dropdown of actual users (Ed, 362) — rebuilt only when it
  // changes, so an open dropdown is not snapped shut under the pointer
  function renderDev() {
    const sel = document.getElementById('devwho');
    const opts = S.roster.map((r, i) => '<option value="' + i + '"' + (S.viewer === i ? ' selected' : '') + '>' +
      esc(r.n || (r.founder ? 'Unnamed founder' : 'Invited · ' + (r.e || '?'))) +
      (r.founder ? ' 🎩' : r.in ? '' : ' (invited)') + '</option>').join('') +
      '<option value="applicant"' + (S.viewer === 'applicant' ? ' selected' : '') + '>— an applicant</option>';
    if (sel.innerHTML !== opts) sel.innerHTML = opts;
  }

  function renderTitle() {
    const d = document.getElementById('doctitle');
    for (const el of [titleEl, d]) {
      el.textContent = S.title || 'Untitled';
      el.classList.toggle('ph', !S.title);
    }
    // At the birth the open card IS the title, so the heading does not also
    // stand above it (the decision-card gesture: the clause, opened) and
    // the tab stands beside the heading. Once the document exists the tab
    // lives on the "The document is titled…" clause instead (Ed,
    // 2026-08-19), the heading is just a heading, and it stays put while
    // the card opens down at its clause.
    d.style.display = (!cs && S.open === 'title') ? 'none' : '';
    document.getElementById('titlechip').innerHTML =
      (cs || S.open === 'title') ? '' : pileHtml([card('title')], ctx);
    prose.classList.toggle('pasteready', visible(card('text')));
    // **The caret leaves with the founder's hand** (Ed's QA, 2026-08-19: he
    // went looking for how to relinquish direct editing on the text — there
    // is nothing to relinquish, because the text is never held (§9.7): once
    // it is confirmed it changes by drafting. Until that drafting surface
    // exists here, an editable prose is a phantom power — keystrokes were
    // accepted and silently discarded — so the column goes read-only the
    // moment the text is confirmed, and was never editable off the
    // founder's own seat.
    prose.contentEditable = String(!(cs && cs.textConfirmed) &&
      S.viewer !== 'applicant' && amFounder());
  }

  // ---- the bodies a founder fills in ------------------------------------
  // **Constitutional settings default to the room; ordinary ones default to
  // you** (Ed, 2026-08-18, agreeing the proposal rate back to the founder). One rule
  // where there had been a rule and three exceptions, and the ordinary /
  // constitutional cut is what explains it: an ordinary setting can be taken
  // back by the room at any time with a motion at the bar, so defaulting it to
  // the founder costs them nothing. A constitutional one cannot — changing it
  // needs everybody — so it has to be theirs from the start or it is not
  // really theirs at all.
  // §9.7 v0.52 (Ed, 2026-08-19): the verb is **delegate**, and it is never
  // a button — a constitutional sentence among the setting's own options.
  // Since 403 the sentence survives only on the applications card (whose
  // holder rides its value, so delegation IS one of its values); every
  // other setting delegates through the 🔧/👑 tabs.
  const POSTLABEL = 'Applications are delegated to the members';
  const POSTNOTE = 'The rule stays as it is, but from now on the members change it: you propose like anybody else, and nothing waits for your OK. You cannot take this back on your own — that would need everyone to agree.';
  // 403 (Ed, 2026-08-19): “The members decide” is no longer a value —
  // delegation is the state of holding neither power, said by the 🔧 and
  // 👑 tabs. On a delegated setting the value card explains, and picking
  // a value is the taking-back.
  const theyDecide = (key, note) => (wantsDelegate(key)
    ? '<p class="setnote">' +
      (cs && cs.constitutedAtT !== null
        ? 'You propose like anybody, and nothing comes to you for assent.'
        : '<b>Asked of everyone before drafting begins, blind</b> — you among them, if you are on the membership. ' + note) +
      ' Picking a value here takes it back.</p>'
    : '');

  // 396c (Ed, 2026-08-19): *make it easy for the founder to decide* — the
  // "and afterwards" pair under a kept value picks between the two crown
  // powers' states, and the third state (assent without unilateral) is
  // offered only once the document is live, because it is unreachable
  // before then (§9.7 v0.54). Post-start the moves are one-way.
  const pw = (val, ttl, exp) => opt({ 'pw:policy': regPower() }, 'pw:policy', val, ttl, exp);
  // the register's pair (Ed's own example, §9.7½): rides the applications
  // value rather than the setting's powers, same gesture either way
  function registerTail() {
    const live = cs && cs.constitutedAtT !== null;
    const cur = regPowerCur();
    if (live && cur === 'unilateral') {
      return '<p class="setnote">You gave up the need for your OK on applications: members decide them without you, and you still invite directly.</p>';
    }
    if (live && cur === 'assent') {
      return '<p class="setnote">You no longer invite directly: members carry applications, and each comes to you as a 👑 question.</p>';
    }
    return '<div class="eyebrow fieldlab" style="margin-top:var(--s4)">And afterwards</div>' +
      '<div class="choice" role="radiogroup" aria-label="And afterwards">' +
      pw('both', 'Applications the members carry need your OK',
        'And you invite and remove directly. A carried application comes to you as a 👑 question — yours to accept or reject.') +
      pw('unilateral', 'Members decide applications without you',
        'You keep inviting directly; an application the members carry needs nobody’s OK.') +
      (live ? pw('assent', 'Stop inviting directly',
        'From here the members carry applications, and each comes to you as a 👑 question. One way — the road back is theirs to give.') : '') +
      '</div>';
  }
  // Founded by [avatar] [name] at [time] on [date] (Ed, 2026-08-19) —
  // the time is the start (§9.6a), never known before it
  const foundedAt = () => {
    if (!cs || cs.constitutedAtT === null) return '';
    const d0 = new Date(cs.constitutedAtT);
    const p2 = (x) => String(x).padStart(2, '0');
    return ' at ' + p2(d0.getHours()) + ':' + p2(d0.getMinutes()) + ' on ' +
      d0.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
  };
  const BODY = {
    text: () => (cs && cs.textConfirmed
      ? '<div class="unlocks"><b>The text the document started from.</b> Drafting changes the document in place, so the page may have moved on — this is what stood when it began.</div>' +
        '<div class="propblock"><div class="rtext">' +
        (String(cs.text || '').trim() === ''
          ? '<i>It began empty — the room wrote it.</i>'
          : textDivs(cs.text)) +
        '</div></div>'
      : '<div class="unlocks">Once you confirm this, members can start <b>proposing</b> changes. They cannot judge until the rest of the constitution is settled.</div>' +
      '<p class="why">Type or paste it into the page below — the same column it will be edited in once drafting begins.</p>' +
      '<p class="setnote"><b>Or leave it blank.</b> Starting from nothing is a perfectly good way to begin. This card is asking whether you have decided, not whether there is any text yet.</p>'),
    hat: () => {
      const started = !!(cs && cs.constitutedAtT !== null);
      // the radio is the session-view's own opt(), over the derived current
      // (the pw() pattern): the generic data-set handler lands S.hatPick
      const o = { hatPick: S.hatPick || (iDraft() ? 'member' : 'clerk') };
      return '<p class="why">Whether the Founder is also on the membership — inviting themselves like anybody else — or only runs the document.</p>' +
        '<div class="choice" role="radiogroup">' +
        opt(o, 'hatPick', 'member', 'Member — drafting too',
          'You get ✏️s, you judge, you count towards quorum, and you answer the founding questions like anybody.', '', started) +
        opt(o, 'hatPick', 'clerk', 'Clerk — not drafting',
          'No ✏️s, no judging, you count towards nothing, and there is nothing for you to answer. A clerk can stay unnamed.', '', started) +
        '</div>' +
        (started ? '<p class="setnote"><b>Settled.</b> Now that people are judging, the Founder joins the same way as anybody else.</p>' : '');
    },
    title: () =>
      '<div class="lanebox"><div class="lp editlane titlelane' + (titlePending() ? '' : ' blank') + '"' +
      ' contenteditable="plaintext-only" spellcheck="false" data-titlelane="1"' +
      ' data-ph="Name this document">' + esc(titlePending()) + '</div></div>',
    // Stripped to the field on Ed's word (2026-08-19): the unlocks line, the
    // suggested-from-the-title note, "what people paste to each other", the
    // label and the Copy button all went. The card is titled Link and holds a
    // link — everything else was the surface explaining a thing that explains
    // itself. What survives is what the field cannot say: that a *collision*
    // moved your slug, whether what you have typed is legal and free, and
    // that changing it later breaks nothing.
    slug: () =>
      (S.slugTaken ? '<p class="setnote">Suggested from the title — <b>docs.vote/' + esc(S.slugTaken) + '</b> already exists, so a short suffix was added.</p>' : '') +
      '<span class="fld"><span class="setrow2">' +
      '<span class="setnote" style="margin:0">docs.vote/</span>' +
      '<input data-slug="1" value="' + esc(S.slug) + '" spellcheck="false" style="width:16rem">' +
      '</span></span>' +
      // the rules recital went with the rest (Ed, 2026-08-19) — a legal link
      // says the one thing worth saying, that it is free. The illegal case
      // keeps its line: that is not helper text, it is why the ✒️ is greyed.
      // only when there is something wrong with it (Ed, 2026-08-19: *only
      // tell me when it's not free*) — a legal, free link needs no receipt
      (SLUG_OK.test(S.slug) ? ''
        : '<p class="setnote">Lower case, digits and hyphens, three characters or more.</p>') +
      // **Changing it sets up a redirect** (Ed, 2026-08-18). The link is
      // changeable and it is also the thing that has already been sent to
      // fourteen people — so a change that broke the old one would make this
      // the one ordinary setting with a cost for using it as intended.
      // **Said where you might change it, not where you set it** (Ed,
      // 2026-08-19): before the save nothing has been sent to anybody, so a
      // promise about old links is answering a worry nobody has yet.
      (cs ? '<p class="setnote">Every link this document has ever had keeps working: changing it leaves a redirect behind, so an invitation somebody was sent weeks ago still opens the right document.</p>' : ''),
    invite: () =>
      '<p class="why">You invite people yourself. An invitation is just the link, sent by email, and whoever arrives starts with the same ✏️s as everybody else.</p>' +
      '<div class="roster"><div class="addrow"><input type="email" placeholder="name@example.com" data-add="1">' +
      '<button class="btn" data-act="add">Invite</button></div></div>',
    remove: () => '<p class="why">Propose that somebody stops being a member. It follows whatever the 🚪 rule says, and they always see it.</p>',
    myemail: () => (S.emailVerified
      ? '<div class="lockline">' + TICK + '<span>Verified — <b>' + esc(S.myemail) + '</b> can get back in.</span></div>' +
        '<span class="fld"><label>Change it</label><input type="email" data-txt="myemail" value="' + esc(S.myemail) + '" style="width:20rem"></span>' +
        '<p class="setnote">Changing it starts verification again — the new address has to prove it works too.</p>'
      : S.emailSent
      ? '<p class="why">Sent to <b>' + esc(S.myemail) + '</b>. ' + (cs
          ? 'The mail is the login: clicking its link is what proves the address works.'
          : 'Nothing is saved yet, so a typo here still costs nothing — which is exactly why this happens now and not after.') + '</p>' +
        '<div style="margin-top:var(--s3)">' +
        (BIRTH ? '' : '<button class="btn" data-act="openmail">Open your inbox</button> ') +
        '<button class="btn" data-act="sendverify">Resend the link</button> ' +
        '<button class="btn" data-act="editemail">Wrong address?</button></div>' +
        (BIRTH
          ? '<p class="setnote">Following the link in the mail is what saves the document and carries you to it.</p>'
          : '<p class="setnote">In the mockup the inbox is a pretend one — the mail in it is the magic link, and clicking it proves the address works' + (cs ? '.' : ' and carries you on to the save.') + '</p>')
      // the send button and the two explanatory blocks left on Ed's word
      // (2026-08-19): ✒️ sends it, and the card is a field with a title over
      // it — which is the whole of what it has ever been asking for
      : (S.emailErr
          ? '<p class="why"><b>' + esc(S.emailErr) + '</b></p>'
          : '') +
        (cs
          ? '<p class="why">Your address is the only way back in — there are no passwords — so a new one has to prove it works before it replaces the old.</p>'
          : '') +
        '<span class="fld"><input type="email" data-txt="myemail" value="' + esc(S.myemail) + '" placeholder="you@example.com" style="width:20rem"></span>'),
    myname: () => nameBody(me(), { optional: !iDraft() }),
    mypic: () => pictureBody(me()),
    // **Whether the founder is in it is its own question** (Ed, 2026-08-18).
    // It had been the top half of the roster card, which made a decision about
    // one person a preamble to a list of everybody — and the founder is a hat
    // worn over a role rather than a role itself (SPEC §9.0a), so the hat and
    // the roster are two things.
    roster: () => (cs && cs.constitutedAtT !== null && regHolder() === 'members'
      ? '<p class="why">Who is a member. Bringing somebody in, or proposing that somebody leaves, is the ✉️ and ❌ tabs beside this list.</p>'
      : '<p class="why">An invitation is just the link, sent by email — there are no passwords. Somebody becomes a member when they open it; until then they are listed as <i>invited</i> and count towards nothing. For now you can invite and uninvite freely, because nothing has been decided yet. Once people start judging, bringing somebody in or taking them out is a decision of its own — the ✉️ and ❌ tabs beside this list.</p>' +
      '<div class="roster"><div class="addrow"><input type="email" placeholder="name@example.com" data-add="1">' +
      '<button class="btn" data-act="add">Invite</button></div></div>' +
      '<div class="eyebrow fieldlab" style="margin-top:var(--s5)">Several at once</div>' +
      '<textarea placeholder="Paste addresses here, one per line" data-emails="1"></textarea>' +
      '<div style="margin-top:var(--s2)"><button class="btn" data-act="invite">Send invitations</button></div>' +
      '<p class="setnote">' + arrived() + ' of ' + S.roster.length + ' have opened it so far. ' +
      'Nobody has to be here for the document to exist, and anybody who arrives later ' +
      'starts with the same ✏️s as everybody else.</p>'),
    // **The door, apart from the register** (Ed, 2026-08-18). The policy is
    // the constitutional act; each application that arrives through it is
    // its ordinary consequence.
    policy: () =>
      '<p class="why">How somebody who is not a member can become one.</p>' +
      // **Who holds it** (Ed, 2026-08-18): delegated — the members' — by
      // default, like every constitutional setting. A founder may **reserve**
      // it instead (reserved is the word for not-delegated, Ed), and a
      // document with a reserved membership is a 👑: the founder keeps
      // unilateral invite-and-remove past the start. What keeps a crown from
      // being immortal is the lapse rule: it applies to the crown as to any
      // member, and a lapsed crown passes to the members.
      '<div class="eyebrow fieldlab" style="margin-top:var(--s5)">Who decides</div>' +
      '<div class="choice" role="radiogroup" aria-label="Who decides who joins">' +
      opt(S, 'rosterBy', 'roster', 'The members', 'Bringing somebody in is a proposal every member has to agree to. An application is a proposal the members judge.') +
      opt(S, 'rosterBy', 'founder', 'The Founder', 'You invite people yourself and nobody else has to agree. Your name carries a 👑 in the constitution so everyone can see it — and if you stop logging in for long enough, the members carry on without you until you come back.') +
      '</div>' +
      (S.rosterBy === 'founder' ? registerTail() : '') +
      // **Who may join** (Ed, 2026-08-18, with the Applicants subsection):
      // the gate the Apply card hangs off. An application becomes an
      // ordinary proposal to grant membership, judged like any other.
      '<div class="eyebrow fieldlab" style="margin-top:var(--s5)">Who may join</div>' +
      '<div class="choice" role="radiogroup" aria-label="Who may join">' +
      opt(S, 'joinBy', 'invite', 'Invitation only', 'Nobody joins unless a member brings them in.') +
      opt(S, 'joinBy', 'proposed', 'Applications must be proposed', 'Anybody can apply, but nothing happens until a member takes the application up and proposes it.') +
      opt(S, 'joinBy', 'apply', 'Anyone may apply', 'An application goes straight to the members, who judge it like any other proposal. Applying costs nothing.') +
      opt(S, 'joinBy', 'open', 'Open', 'Anyone with the link becomes a member the moment they open it.') +
      '</div>' +
      // §9.7 v0.52: past the start the founder may hand the whole card over —
      // both holds at once, the register's crown living in this value (§9.7½)
      (cs && cs.constitutedAtT !== null && csState('policy') &&
        (csState('policy').holder === 'convenor' || cs.membershipReserved())
        ? '<div class="eyebrow fieldlab" style="margin-top:var(--s5)">Or hand it over</div>' +
          '<div class="choice" role="radiogroup" aria-label="Hand applications to the members">' +
          opt(S, 'policyBy', 'roster', POSTLABEL,
            'Both halves at once: who decides, and who may join. ' + POSTNOTE) +
          '</div>'
        : ''),
    ending: () =>
      '<p class="why">When drafting stops. At that moment the text is final and the record is published. <b>Never</b> is one of the answers: a document with no end date stops only when too few members are still active.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('ending', 'The document takes the <b>latest</b> answer anybody gives, and <b>never</b> is later than any date — so one member who wants it to run on keeps it running.') +
      opt(S, 'ending', 'ends', 'At a set time', '',
        '<span class="fld"><label>Ends</label><input type="datetime-local" data-txt="endsAt" value="' + S.endsAt + '"></span>') +
      opt(S, 'ending', 'perpetual', 'Never', 'It runs until too few members are still active.') +
      '</div>',
    bar: () =>
      '<p class="why">How sure the members have to be that a change is better than the words it would replace. It is not a vote — nobody counts for and against; members compare the two versions, and this is how clear the result has to be. This is the number that applies <b>at the end</b>, when a change can no longer be challenged.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('bar', 'Each member says the lowest they will accept, and the document takes the highest.') +

  // ---- the applicant's seat (ported from founding-ceremony, Ed 361) -------

  const APPLICANT = { get judged() {

    const rec = a && a.motion ? cs.motionRecords().get(a.motion) : null;
    if (!rec) return 0;
    if (rec.status === 'carried') return E();
    return S.roster.filter((r) => r.mAnsOk && r.mAnsOk.has('roster')).length;

  const MEMBER_EMAILS = { has: (e2) => S.roster.some((r) => (r.e || '').toLowerCase() === e2) };
  const APPCARDS = () => {
    const a = S.app;
    const base = [{ k: 'apply', g: '🪪', t: 'Apply for Membership', own: 'you',
      kind: 'personal', done: () => a.submitted }];
    if (!a.started) return base;
    return base.concat([
      { k: 'appmail', g: '📧', t: 'Your Email', own: 'you', kind: 'personal', done: () => a.emailVerified },
      { k: 'appname', g: '✋', t: 'Your Name', own: 'you', kind: 'personal', done: () => !!a.name.trim() },
      { k: 'apppic', g: '🖼️', t: 'Your Picture', own: 'you', kind: 'personal', done: () => !!a.pic },
      { k: 'apptext', g: '📝', t: 'Your Application', own: 'you', kind: 'personal', optional: true, done: () => !!a.text.trim() },
    ]);
  };
  const appCtx = {
    get open() { return S.open; }, get E() { return E(); },
    mustAct: (c) => !c.done() && !(c.optional && S.app.submitted),
    yours: (c) => c.k === 'apply' && S.app.submitted,
    waiting: (c) => c.k === 'appmail' && S.app.emailSent && !S.app.emailVerified,
    fillOf: (c) => (c.k === 'apply' && S.app.submitted
      ? Math.round(APPLICANT.judged / E() * 100) + '%' : '100%'),
    summary: (c) => (c.k === 'apply'
      ? (S.app.submitted ? 'Before the members — a proposal like any other' : S.app.started ? (['appname', 'apppic'].every((k2) => APPCARDS().find((x) => x.k === k2).done()) ? 'Ready to submit' : 'Three small tasks') : 'Membership is by application')
      : c.k === 'appmail' ? (S.app.emailVerified ? S.app.email + ' · verified'
        : S.app.emailSent ? 'Check your inbox' : 'Your identity here')
      : c.k === 'appname' ? (S.app.name || 'What members will call you')
      : c.k === 'apppic' ? (S.app.pic ? 'Chosen' : 'A ground for your initials')

  const APPBODY = {
    apply: () => {
      const a = S.app;

  // ---- the band: two piles, and the card one of them opens into ----------
  function renderBand() {
    if (S.viewer === 'applicant') {
      const tp0 = document.getElementById('titlepara');
      tp0.classList.remove('open');
      tp0.querySelectorAll('.setupcard').forEach((el) => el.remove());

        ? '<div class="setrow constsec"><div class="csec"><div class="cpara open">' + applicantCardHtml() + '</div></div></div>' : '') +
