<meta charset="utf-8">
<title>Document creation</title>
<link rel="stylesheet" href="system.css">
<link rel="stylesheet" href="setup.css">
<style>
/* ============================================================================
   document-creation — **the document, from its first minute.**

   Five notes built this, in order, and each one made the screen less of a form:

   1. *Something that looks like the document itself; the admin pastes the text
      into the space where it will later be edited, the ToC appears on cue, they
      click the placeholder title in the topbar, and the sidebar holds cards with
      each of the questions they need to decide.*
   2. *Can we import as much of the session-view as we can? I think ultimately
      this will literally be the session view.*
   3. *You can start inviting people immediately after creating the document …
      and as soon as you've confirmed the starting text they can start making
      proposals … and judgements unlock as soon as everyone is ready.*
   4. *Ceremony and admin cards are absolutely just queue-cards. Instead of
      modals they open cards in the document at the top, above the text, pushing
      it down like decision-cards do a clause. They have cables and tabs.*
   5. *I'd like all of these tabs to act like clause-tabs and pile like clause
      tabs. The convenor's settings sit in one pile, and members' in the
      pile below. … Go through every decision each role needs to make and turn it
      into a queue-card. Break them down as much as you can.*

   The third changed the model — there is no moment when the document "opens".
   The fourth retired the modal. The fifth retired the last two inventions on the
   screen: the flat tab group, which is now two `chip-gutter` piles like
   everything else, and the compound card, which was a form in card's clothing.
   **One decision, one card**, and the test is whether somebody could answer it
   differently and on its own: a picture and a name are two questions, and so are
   a membership and whether the convenor is in it. What is *not* split is a
   parameter and its own value — *rising, 55% → 78%* is one thought, and cutting
   it in half would be splitting a sentence rather than a decision. The same test
   cuts the other way twice, on 2026-08-18: *when it ends* swallowed *whether it
   ends*, because **never** is one of the answers to *when*; and the stake stopped
   being a card at all, because it is a flat 1 in the mechanism and a card for it
   was offering a decision nobody has. Then ✒️ split the other way on Ed’s Q341 rethink — the close bar is consent where the ramp is pacing, two kinds — so seventeen became eighteen.

   What is left in this file is its own fixture and the bodies of the cards a
   convenor fills in. The piles, the strip, the cable, the rail entry, the card
   shell, the read-only and watching bodies and the identity cards are in
   `setup.js`, because the founding ceremony is this same screen seen by
   somebody else.
   ========================================================================== */

  /* **The title is not edited in the topbar** (Ed, 2026-08-18). It had been a
     contenteditable in the bar, which is the one place on this screen that is
     not a card — so the title was the single setting with no card behind it, no
     confirm, and no way back to it except clicking the words. The bar shows the
     title; the 🏷️ card is where you write it, in the same `.lanebox` the
     `editing-card` writes a clause in. */
  .navbar .brand.ph { color: var(--muted); font-weight: 400; }

  /* the paste-well: the empty state of the prose column, and nothing more */
  .prose.empty::before {
    content: "Paste the text this document starts from, or begin typing it.\A\A Markdown headings become its sections, and the contents appear beside you as you go.";
    white-space: pre-wrap; color: var(--muted); font-size: var(--t-body); line-height: 1.6;
  }

  /* the controls the share box took with it, now on the 🔗 and ✉️ cards */
  .setupcard textarea { width: 100%; font-size: var(--t-ui); padding: var(--s2);
    resize: vertical; min-height: 60px; }
  .setupcard .btn { font: inherit; font-size: var(--t-cap); padding: var(--s1) var(--s3);
    cursor: pointer; border: 1px solid var(--border); background: var(--bg);
    border-radius: var(--r-sm); }
  .setupcard .btn:hover { border-color: var(--primary); color: var(--primary-emphasis); }
  .pf.waiting { color: var(--muted); }

  /* ---- what is unlocked, and what is waiting ----------------------------- */
  .stage-REMOVED { display: none;
    font-size: var(--t-small); }
  .stage .nm { font-weight: 600; }
  .stage .st { color: var(--muted); font-size: var(--t-cap); margin-left: auto; text-align: right; }
  .stage.live .nm, .stage.live .st { color: var(--ok); }
  .stage .mkg { flex: none; }
  .stage.wait .mkg { visibility: hidden; }
</style>

<header class="navbar">
  <div class="wrap">
    <p class="brand ph" id="title">Untitled document</p>
    <div class="stats">
      <span id="stat-stage">reading only</span>
      <span id="stat-who">1 in the room</span>
      <button class="me" id="mebtn" title="You, and the convenor of this document."></button>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="layout">
    <nav class="toc"><ul id="toc"></ul></nav>
    <main>
      <div class="doc" id="doc">
        <h1 class="doctitle ph" id="doctitle">Untitled document</h1>
        <div class="setupband" id="band"></div>
        <div class="prose empty" id="prose" contenteditable="true" spellcheck="false"></div>
      </div>
    </main>
    <aside class="queue stack"><div id="rail"></div></aside>
  </div>
</div>
<svg id="wires" aria-hidden="true"></svg>

<script src="setup.js"></script>
<script>
(function () {
  const { esc, TICK, avHtml, bandHtml, fitBand, railEntry, cardHtml, watchBody,
    nameBody, pictureBody, drawWire, opt, num, someIn, KIND, kindNote, ANSWER } = window.SETUP;
  const prose = document.getElementById('prose');
  const titleEl = document.getElementById('title');
  const band = document.getElementById('band');
  const rail = document.getElementById('rail');
  const wires = document.getElementById('wires');

  const S = {
    title: '', slug: 'hollow-oak-4f2a',
    myname: 'Wren Ashby', mypic: 'c0',
    ending: 'roster', endsAt: '2026-08-20T18:00',
    myAns: { ending: null, bar: null, quorum: null, authorship: null,
      signing: null, judgments: null, chamber: null, machines: null,
      grant: null, drip: null },
    barBy: 'roster', tClose: 78, shape: 'ramp', tStart: 55,
    quorumBy: 'roster', quorumForm: 'share', quorumPct: 33, quorumN: 5,
    authorship: 'roster', signing: 'roster', judgments: 'roster',
    authorshipSet: 'anonymous', signingSet: 'nobody', judgmentsSet: 'never',
    grantBy: 'convenor', grant: 4,
    dripBy: 'convenor', drip: 1, dripPer: 10, cap: 8,
    chamber: 'roster', auditor: 'roster', auditorBudget: 6,
    roster: [{ n: 'Wren Ashby', e: 'wren@hollowoak.club', role: 'member', convenor: true, in: true }],
    // **Confirmed, not merely defaulted** (Ed, 2026-08-17). A default nobody
    // read is not a decision, and these are the decisions that cannot be changed
    // once people are drafting. So a card carries its value from the first
    // render — the rail is never a list of blanks — and stays yellow until it
    // has been opened and committed.
    seen: new Set(), okd: new Set(),
    open: null,
  };
  const me = () => ({ n: S.myname, pic: S.mypic });

  // Everybody on the roster is a member; the only person who might not be is
  // the convenor, who may be the clerk instead. There is no observer here —
  // see the chamber card.
  const members = () => S.roster.filter((p) => p.role !== 'clerk');
  // **Membership begins at first arrival, not at invitation** (Ed, 2026-08-18,
  // §9.6a). An invitee is listed under the membership as *invited* and counts
  // toward nothing — which is what keeps one unopened email from blocking
  // judging for everybody. E is the arrived.
  const arrived = () => members().filter((m) => m.in).length;
  const E = () => Math.max(arrived(), 1);
  const meRow = () => S.roster.find((p) => p.convenor);
  const iDraft = () => { const m = meRow(); return !!m && m.role !== 'clerk'; };
  const quorumCount = () => (S.quorumForm === 'share'
    ? Math.max(1, Math.round(E() * S.quorumPct / 100)) : Math.min(S.quorumN, E()));
  const perpetual = () => S.ending === 'perpetual';
  const SLUG_OK = /^[a-z0-9][a-z0-9-]{2,}$/;

  // ---- the document ------------------------------------------------------
  function relabel() {
    const sel = getSelection();
    const at = sel.rangeCount ? sel.getRangeAt(0).startContainer : null;
    for (const b of [...prose.children]) {
      const t = b.textContent;
      const m = t.match(/^(#{1,3})\s+/);
      if (m) {
        const liveHere = at && b.contains(at);
        b.textContent = t.slice(m[0].length);
        b.className = 'docline lvl' + m[1].length;
        b.dataset.h = b.textContent;
        if (liveHere && b.firstChild) {
          const r = document.createRange();
          r.setStart(b.firstChild, 0); r.collapse(true);
          sel.removeAllRanges(); sel.addRange(r);
        }
      } else if (b.className) { b.dataset.h = t; } else { delete b.dataset.h; }
    }
    prose.classList.toggle('empty', prose.textContent.trim() === '');
    renderToc(); render();
  }
  function renderToc() {
    const hs = [...prose.children].filter((b) => b.dataset.h !== undefined);
    document.getElementById('toc').innerHTML = hs.map((b, i) => {
      b.id = 'h' + i;
      const lvl = (b.className.match(/lvl(\d)/) || [0, 2])[1];
      return '<li class="lvl' + lvl + '"><a href="#h' + i + '">' + esc(b.dataset.h) + '</a></li>';
    }).join('');
  }
  prose.addEventListener('paste', (ev) => {
    ev.preventDefault();
    const txt = (ev.clipboardData || window.clipboardData).getData('text');
    let lines = txt.split(/\n{2,}|\n/).filter((l) => l.trim());
    const first = lines[0] && lines[0].match(/^#\s+(.+)$/);
    if (first && !S.title) { S.title = first[1]; lines = lines.slice(1); }
    document.execCommand('insertHTML', false, lines.map((l) => '<div>' + esc(l) + '</div>').join(''));
    setTimeout(relabel, 0);
  });
  prose.addEventListener('input', relabel);

  // ---- the nineteen decisions ----------------------------------------------
  // **One card per decision, and the test is whether somebody could answer it
  // differently and on its own** (Ed, 2026-08-18: *break them down as much as
  // you can — picture and name separate! — admin choosing if they're a
  // participant — etc*). Both of his examples are the same fault: two questions
  // of *different kinds* bundled into one card because they happened to be asked
  // at the same moment. A picture and a name; a membership and whether the
  // convenor is in it; how many ✏️s you start with and how fast they come back.
  //
  // `key` is the state field that carries delegation, and it is what decides
  // which **pile** a card stands in: taking a setting back moves its tab from
  // the members' pile to the convenor's, in front of you.
  const DELEGABLE = ['ending', 'barBy', 'quorumBy', 'authorship', 'signing',
    'judgments', 'grantBy', 'dripBy', 'chamber', 'auditor'];
  const delegated = (key) => DELEGABLE.includes(key) && S[key] === 'roster';

  // **The gates are cards** (Ed, 330b) — see the ceremony surface for the
  // reasoning. Here they wait on the convenor's own work rather than on a
  // room, and they stand in the members' pile because what they gate is what
  // the members will be able to do.
  const GATES = [
    { k: 'canpropose', g: '✏️', t: 'Proposing', own: 'you', isGate: true,
      open: () => canPropose() && !LIVE().some(owesAnswer),
      why: 'Members can read a document from the first second, and they cannot propose against a text that is not there yet — nor should you be able to act on a document whose rules you have not yet said what you will accept of (§9.0b), so your own outstanding answers wait here too.',
      waiting: 'Waiting on the starting text, and on your own answers.',
      done: 'Open — members can propose as soon as they arrive.',
      blockers: () => [card('text')].filter((c) => !settled(c)).concat(LIVE().filter(owesAnswer)) },
    { k: 'canjudge', g: '⚖️', t: 'Judging', own: 'you', isGate: true,
      open: () => canJudge(),
      why: 'A judgment is counted towards a quorum and recorded under a disclosure rule, so none of the constitution can be settled after it without changing what the judgment was.',
      waiting: 'Waiting on the constitution.',
      done: 'Open — the constitution is settled.',
      blockers: () => ceremony().filter((c) => !settled(c) || (isRoom(c) && (c.in || 0) < E())) },
  ];

  const CARDS = [
    // — the convenor's own, never delegable ------------------------------
    // A document may start empty, which is why this is not a blocker on having
    // content but on having *decided*: a page nobody has looked at and a page
    // somebody chose to leave blank look identical, and only one of them should
    // let people start proposing.
    { k: 'text', g: '📄', t: 'The starting text', kind: 'ordinary', gate: 'propose' },
    { k: 'title', g: '🏷️', t: 'The title', kind: 'ordinary', ready: () => !!S.title, changeable: true },
    // The link had been a read-only field in the share box, which quietly made
    // it the one thing on the screen decided by not being decided.
    { k: 'slug', g: '🔗', t: 'The link', kind: 'ordinary', ready: () => SLUG_OK.test(S.slug), changeable: true },
    { k: 'roster', g: '✉️', t: 'Membership', kind: 'constitutional', ready: () => members().length >= 1, changeable: true },
    { k: 'myrole', g: '🎩', t: 'Is the convenor a member?', kind: 'constitutional' },

    // — yours as a person, whoever you are ------------------------------
    { k: 'myname', g: '📛', t: 'Your name', kind: 'personal', own: 'you', ready: () => !!S.myname.trim(), changeable: true },
    { k: 'mypic', g: '🖼️', t: 'Your picture', kind: 'personal', own: 'you', changeable: true },

    // — the document's shape --------------------------------------------
    // **When it ends and whether it ends are one card** (Ed, 2026-08-18:
    // *“if it ends” is just the “never” option*). They had been split under the
    // one-card-per-decision rule, and the split does not survive that rule's own
    // test — you cannot answer *when* differently from *whether*, because
    // **never** is one of the answers to *when*. What made them look like two
    // decisions is that they take different routes to change afterwards, and
    // that is a fact about the motion rather than about the question (Q329).
    { k: 'ending', g: '⏰', t: 'When does it end?', kind: 'constitutional', motionKind: 'ordinary',
      key: 'ending', dep: ['roster'], p: 0.5,
      // 329(a): *never* is the constitutional answer; any date is ordinary.
      routeOf: (v) => (/never|perpetual|no end/i.test(v) ? 'constitutional' : 'ordinary'),
      routeNote: 'Which route this takes depends on what you write. A different date is an ordinary proposal, judged like any other. Never — no ending at all — re-opens the founding question instead, because a document with no ending has no rising threshold, and every decision already taken was taken under one.',

      ready: () => S.ending !== 'ends' || !!S.endsAt,
      knote: '<b>Whether</b> it ends is constitutional: a document with no ending has no ramp, so every past adoption would mean something different. <b>When</b> it ends is ordinary — a date can be moved by proposal, because moving it changes nothing that has already happened.',
      rule: 'Each member says when they want it to end and the <b>latest</b> answer is taken — <b>never</b> being the latest of all — so nobody is cut off before they were ready.',
      takes: 'The document takes the latest', result: 'Saturday 18:00',
      dist: [2, 3, 5, 3, 1], distTop: 4, distEnds: ['Tue', 'Never'] },

    // — the constitution -------------------------------------------------
    // **The threshold is two decisions of different kinds** (Ed, 2026-08-18,
    // Q341). Consent is about the bar **at the close**, where an adoption is
    // permanent — one number. How it gets there is *pacing*, ordinary by §9.6's
    // own test, on the next card.
    { k: 'bar', g: '✒️', t: 'How sure must the room be?', kind: 'constitutional', gate: 'judge', key: 'barBy', dep: ['ending'], p: 0.64,
      rule: 'Each member states the <b>lowest bar</b> they will accept — at the close, where an adoption is permanent — and the document takes the highest, so it will never be easier to change than any one of them wanted.',
      takes: 'The document takes the highest', result: '80%',
      dist: [0, 1, 2, 3, 2, 1, 2, 1, 1, 1], distTop: 8, distEnds: ['50%', '95%'] },
    { k: 'pace', g: '📈', t: 'How does the bar get there?', kind: 'ordinary', dep: ['ending'], changeable: true },
    // The number is the room's; the **form** — count or share — is the
    // convenor's wording of the question (Ed, 2026-08-18: *quorum can either be
    // a fixed number or a proportion of membership size*; §9.0a).
    { k: 'quorum', g: '👥', t: 'Quorum', kind: 'constitutional', gate: 'judge', key: 'quorumBy', dep: ['roster'], p: 0.79,
      rule: 'Each member states the <b>lowest quorum</b> they will accept and the document takes the highest.',
      takes: 'The document takes the highest', result: '10 of 14',
      dist: [0, 0, 1, 1, 2, 3, 2, 2, 1, 1, 1, 0, 0, 0], distTop: 9, distEnds: ['1 of 14', 'all of them'] },
    { k: 'authorship', g: '👤', t: 'When is a proposer named?', kind: 'constitutional', gate: 'judge', key: 'authorship', dep: ['roster'], p: 0.5,
      rule: 'A privacy question, so it runs the other way and takes the <b>most private</b> answer: one member who wants to stay unnamed keeps the whole document unnamed.',
      takes: 'The document takes the most private', result: 'Nobody’s name, ever',
      dist: [8, 4, 2], distTop: 0, distEnds: ['No names, ever', 'Names from the start'] },
    { k: 'signing', g: '✍️', t: 'Who may sign a proposal?', kind: 'constitutional', gate: 'judge', key: 'signing', dep: ['roster'], p: 0.5,
      rule: 'Also a privacy question, and the <b>most private</b> answer wins.',
      takes: 'The document takes the most private', result: 'Nobody signs',
      dist: [9, 3, 2], distTop: 0, distEnds: ['Nobody signs', 'Everybody signs'] },
    { k: 'judgments', g: '👁️', t: 'When are judgments revealed?', kind: 'constitutional', gate: 'judge', key: 'judgments', dep: ['roster'], p: 0.86,
      rule: 'Never revealed while a question is live, whichever is chosen. What this settles is only whether they are published with the record.',
      takes: 'The document takes the most private', result: 'Never revealed',
      dist: [11, 3], distTop: 0, distEnds: ['Never', 'After the decision'] },

    // — the **proposal rate**: how often anybody may propose ---------------
    // Not an “economy” and not “tokens” (Ed, 2026-08-18). Both words describe
    // the machinery from the outside; what a member is being asked is how
    // often they may propose, and that is two decisions — how many ✏️s they
    // start with, and how fast a spent one comes back.
    //
    // It is **not three**: the stake is a flat 1 and always was (§13 parameters,
    // §7), so the card that offered to set it was offering a decision the
    // mechanism does not have (Ed, 2026-08-18: *isn’t the stake fixed at 1?*).
    { k: 'grant', g: '🪙', t: 'How many ✏️s do members start with?', kind: 'ordinary', key: 'grantBy', dep: ['roster'], p: 0.36,
      rule: 'Each member states the <b>fewest</b> they would accept being given, and the document takes the most generous answer.',
      takes: 'The document takes the most generous', result: '5 each',
      dist: [1, 2, 4, 3, 2, 1, 1], distTop: 4, distEnds: ['0', '12'] },
    { k: 'drip', g: '💧', t: 'How fast do ✏️s come back?', kind: 'ordinary', key: 'dripBy', dep: ['ending'], p: 0.36,
      rule: 'Each member states the <b>slowest</b> return they would accept, and the document takes the fastest.',
      takes: 'The document takes the fastest', result: '1 per 10%, up to 8',
      dist: [2, 3, 5, 2, 1, 1], distTop: 2, distEnds: ['slowest', 'fastest'] },

    // — the room around it ------------------------------------------------
    // gate 'judge': constitutional (§9.6 disclosure family), so judging waits
    // on it — the member surface already did, and the two disagreed (review
    // finding, 2026-08-18)
    { k: 'chamber', g: '🔭', t: 'Who else can see it?', kind: 'constitutional', gate: 'judge', key: 'chamber', dep: ['roster'], p: 0.43,
      rule: 'A privacy question, so the <b>most private</b> answer wins: one member who wants the room closed closes it.',
      takes: 'The document takes the most private', result: 'Roster only',
      dist: [5, 8, 1], distTop: 1, distEnds: ['Roster only', 'Public'] },
    { k: 'machines', g: '🤖', t: 'Is there a machine member?', kind: 'constitutional', gate: 'judge', key: 'auditor', dep: ['roster'], p: 0.86,
      rule: 'The <b>most restrictive</b> answer wins, so a single member who would rather not draft alongside a machine keeps it out.',
      takes: 'The document takes the most restrictive', result: 'People only',
      dist: [9, 5], distTop: 0, distEnds: ['People only', 'A machine is fine'] },
  ];
  const card = (k) => CARDS.find((c) => c.k === k) || ANS.find((c) => c.k === k) ||
    GATES.find((c) => c.k === k);
  const isRoom = (c) => !!(c.key && delegated(c.key));
  // **Your own answer is a separate card in the membership pile** (Ed,
  // 2026-08-18, revising the both-halves-on-one-card build of the same
  // morning): delegating is one act and answering is another, done later and
  // wearing a different hat — so the setting card stays in the convenor's
  // pile with the delegation radio and the watching half, and handing a
  // question to the room makes a question card **appear** in the membership
  // pile, which is the same card a member gets. Nothing jumps piles any
  // more, which also closes Q323: delegation reads as a birth rather than a
  // teleport.
  const ansKey = (c) => c.ansFor || c.k;
  const answered = (c) => S.myAns[ansKey(c)] !== null && S.myAns[ansKey(c)] !== undefined;
  const owesAnswer = (c) => !!c.ansFor && iDraft() && !answered(c);
  const ready = (c) => (c.ansFor ? answered(c) : c.ready ? c.ready() : true);
  const settled = (c) => (c.isGate ? S.okd.has(c.k)
    : c.ansFor ? answered(c)
    : S.seen.has(c.k) && ready(c));
  const mustAct = (c) => (c.isGate ? (c.open() && !S.okd.has(c.k)) : !settled(c));
  // How far the room has got, against the roster **as it stands** — held as a
  // proportion because a convenor's roster starts at one person and grows.
  const resolveCounts = () => CARDS.forEach((c) => { if (c.p != null)
    c.in = Math.min(E(), Math.round(c.p * E()) + (isRoom(c) && iDraft() && answered(c) ? 1 : 0)); });

  // **A card with a dependency does not appear until its dependency is settled**
  // (Ed, 2026-08-18: *if there are dependencies, just don't show them the next
  // cards until they're done*). Two dependencies, both real: anything the room
  // can be asked waits on the **roster**, since *the members decide* means
  // nothing until there are members; and the threshold, the drip and the ending
  // date wait on **whether it ends**, since a rising bar needs an endpoint and
  // the drip is paced against one.
  const visible = (c) => (c.ansFor
    ? iDraft() && isRoom(card(c.ansFor)) && visible(card(c.ansFor))
    : !(c.hide && c.hide()) && (c.dep || []).every((k) => settled(card(k))));
  // One question card per delegable setting, born when its setting is handed
  // over and gone if it is taken back. Same glyph, same title — it is the
  // same question — told apart by whose pile it stands in.
  const ANS = CARDS.filter((c) => c.key && ANSWER[c.k]).map((c) => ({
    k: 'ans-' + c.k, g: c.g, t: c.t, kind: c.kind, own: 'you', ansFor: c.k }));
  const LIVE = () => CARDS.concat(ANS, GATES).filter(visible);
  const pileOf = (c) => (c.own === 'you' ? 'room' : 'convenor');
  // A member who has not opened the document yet is drawn faintly rather than
  // left out: they are on the membership, which is the fact the heading is
  // stating, and whether they have looked at it yet is a different one.
  const face = (p, ghost) => '<span class="pf' + (ghost ? ' ghost' : '') +
    (p && p.in === false ? ' waiting' : '') + '">' +
    avHtml(ghost ? {} : p, p && p.in === false ? 'pending' : '') +
    esc(ghost ? 'Not named yet' : p.n) + '</span>';
  const groups = () => {
    const live = LIVE();
    return [
      { key: 'convenor', label: 'Convenor', cards: live.filter((c) => pileOf(c) === 'convenor'),
        who: () => face(me(), !S.myname.trim()),
        note: (n) => (n ? n + ' still to confirm' : 'all confirmed') },
      { key: 'room', label: 'Membership', cards: live.filter((c) => pileOf(c) === 'room'),
        // the convenor is in the membership too, if they are a drafter (Ed)
        who: () => (members().length ? members().map((p) => face(p)).join('') : face({}, true)),
        note: (n) => (n ? n + ' still to hand over' : 'theirs to answer') },
    ].filter((g) => g.cards.length);
  };

  const VALUE = {
    text: () => { const n = [...prose.children].filter((b) => b.textContent.trim()).length;
      return n ? n + ' blocks' : (S.seen.has('text') ? 'Starts empty — the room writes it' : 'Nothing yet'); },
    title: () => S.title || 'Not named yet',
    slug: () => 'docs.vote/' + (S.slug || '…'),
    myname: () => S.myname || 'Unnamed',
    mypic: () => (S.mypic ? 'Chosen' : 'Your initials'),
    myrole: () => (iDraft() ? 'Yes — a drafter like everybody else' : 'No — the clerk, who does not write'),
    roster: () => members().length + (members().length === 1 ? ' member' : ' members') +
      (iDraft() ? '' : ' — you are the clerk, and not one of them'),
    ending: () => (perpetual() ? 'Never — it runs until it is frozen'
      : new Date(S.endsAt).toLocaleString(undefined,
        { weekday: 'short', hour: '2-digit', minute: '2-digit' })),
    bar: () => S.tClose + '% sure at the close',
    pace: () => (perpetual() ? 'Fixed — no window to rise over'
      : S.shape === 'ramp' ? 'Rising from ' + S.tStart + '%' : 'The close bar throughout'),
    quorum: () => (S.quorumForm === 'count' ? Math.min(S.quorumN, E()) + ' of ' + E()
      : S.quorumPct + '% — ' + quorumCount() + ' of ' + E()),
    authorship: () => ({ anonymous: 'Nobody’s name, ever', sealed: 'Names at the close',
      public: 'Names from the start' }[S.authorshipSet]),
    signing: () => ({ nobody: 'Nobody signs', each: 'Each author chooses', everybody: 'Everybody signs' }[S.signingSet]),
    judgments: () => ({ never: 'Never revealed', after: 'Revealed after the decision' }[S.judgmentsSet]),
    grant: () => S.grant + ' each',
    drip: () => S.drip + ' back per ' + (perpetual() ? S.dripPer + ' hours' : S.dripPer + '% of the window') +
      ', up to ' + S.cap,
    chamber: () => ({ link: 'Anyone with the link', closed: 'Roster only', public: 'Public' }[S.chamber]),
    machines: () => (S.auditor === true ? 'The coherence auditor, ' + S.auditorBudget + ' ✏️s' : 'People only'),
    canpropose: () => (canPropose() ? 'Open' : 'Waiting on the starting text'),
    canjudge: () => (canJudge() ? 'Open' : 'Waiting on the constitution'),
  };
  const ANSVALUE = {
    quorum: (v) => 'You said ' + v + ' of ' + E(),
    bar: (v) => 'You said ' + v + '%',
    ending: (v) => (v === 'never' ? 'You said never' : 'You said ' + v),
    authorship: (v) => 'You said ' + ({ anonymous: 'no names, ever', sealed: 'names at the close', public: 'names from the start' }[v] || v),
    signing: (v) => 'You said ' + ({ nobody: 'nobody signs', each: 'each author chooses', everybody: 'everybody signs' }[v] || v),
    judgments: (v) => 'You said ' + ({ never: 'never revealed', after: 'revealed after the decision' }[v] || v),
    chamber: (v) => 'You said ' + ({ closed: 'roster only', link: 'anyone with the link', public: 'public' }[v] || v),
    machines: (v) => 'You said ' + (v ? 'a machine member is fine' : 'people only'),
    grant: (v) => 'You said ' + v + ' ✏️s',
    drip: (v) => 'You said ' + v + ' per 10%',
  };
  const ANSASK = { quorum: 'The lowest you will accept', bar: 'The lowest you will accept',
    ending: 'The latest you will accept', authorship: 'The most you will accept',
    signing: 'The most you will accept', judgments: 'The most you will accept',
    chamber: 'The most you will accept', machines: 'The most you will accept',
    grant: 'The fewest you will accept', drip: 'The slowest you will accept' };
  const value = (c) => (c.ansFor
    ? esc(answered(c) ? ANSVALUE[c.ansFor](S.myAns[c.ansFor]) : ANSASK[c.ansFor])
    : esc(VALUE[c.k]()));
  const summary = (c) => (isRoom(c)
    ? (settled(c) ? '<i>The members decide</i> · ' + someIn(c.in || 0, E()) : '<i>The members decide</i>')
    : value(c));

  // **What is unlocked, and by what.** Reading needs nothing. Proposing needs a
  // text to propose against. Judging needs the constitution settled, because a
  // judgment is *recorded under a disclosure setting* and *counted towards a
  // quorum*, and neither can be decided after the judgment without changing what
  // the judgment was.
  const canPropose = () => settled(card('text'));
  const ceremony = () => CARDS.filter((c) => c.gate === 'judge');
  const ceremonyRunning = () => ceremony().some((c) => isRoom(c) && (c.in || 0) < E());
  const canJudge = () => ceremony().every(settled) && !ceremonyRunning();

  const ctx = {
    get open() { return S.open; }, get E() { return E(); },
    mustAct, settled, summary, value, isRoom,
    // the head says **what kind of decision this is** and then who holds it,
    // because the kind is what tells you what could ever be done about it
    bandLabel: (c) => (c.isGate ? 'Not a decision · it follows from the others'
      : c.ansFor ? KIND[c.kind] + ' · yours to answer, as a member'
      : c.kind === 'personal' ? 'Yours alone'
      : KIND[c.kind || 'ordinary'] + ' · ' +
        (isRoom(c) ? 'the members decide' : 'the convenor sets this')),
  };

  // ---- the rail ----------------------------------------------------------
  // Grouped by pile and in pile order, so the two columns agree and nothing
  // jumps when you confirm something (Q320). Your own pile first: on this
  // screen that is the convenor's, on the ceremony it is the members'.
  function renderRail() {
    const gs = groups();
    rail.innerHTML =
      // A gate is in the rail only while it wants something — the moment it
      // opens and until you have taken it in. Locked, it is a tab in the pile
      // and nothing else, because nothing is being asked of you (Ed, 2026-08-18:
      // *everyone should only see cards they can act on*).
      '<ul>' + gs.map((g) => ({ ...g, cards: g.cards.filter((c) => !c.isGate || mustAct(c)) }))
        .filter((g) => g.cards.length).map((g) =>
        '<li class="qhead">' + esc(g.label) + '</li>' +
        g.cards.map((c) => railEntry(c, ctx)).join('')).join('') + '</ul>';

    document.getElementById('stat-stage').textContent =
      canJudge() ? 'open' : canPropose() ? 'proposals open' : 'reading only';
    document.getElementById('stat-who').textContent = arrived() + ' in the room';
    document.getElementById('mebtn').innerHTML = avHtml(me(), 'face');
  }
  function renderTitle() {
    const d = document.getElementById('doctitle');
    for (const el of [titleEl, d]) {
      el.textContent = S.title || 'Untitled document';
      el.classList.toggle('ph', !S.title);
    }
  }

  // ---- the bodies a convenor fills in ------------------------------------
  // **Constitutional settings default to the room; ordinary ones default to
  // you** (Ed, 2026-08-18, agreeing the proposal rate back to the convenor). One rule
  // where there had been a rule and three exceptions, and the ordinary /
  // constitutional cut is what explains it: an ordinary setting can be taken
  // back by the room at any time with a motion at the bar, so defaulting it to
  // the convenor costs them nothing. A constitutional one cannot — changing it
  // needs everybody — so it has to be theirs from the start or it is not
  // really theirs at all.
  const theyDecide = (key, note) => opt(S, key, 'roster', 'The members decide',
    'Asked of everyone before drafting begins, blind — you among them, if you are on the roster. ' + note);

  const BODY = {
    text: () =>
      '<div class="unlocks">Confirming this lets everyone start <b>proposing</b>. They will not be able to judge until the constitution is settled.</div>' +
      '<p class="why">Type or paste it into the page below — the same column it will be edited in once drafting begins. Lines starting with #, ## or ### become sections, and the contents appear on the left as you go.</p>' +
      '<p class="setnote"><b>Or leave it blank.</b> A roster writing something from nothing is an ordinary way to begin, and an empty page is a real answer to this question. What this card asks is not whether there is text, but whether you have decided.</p>',
    title: () =>
      '<p class="why">What members read in the bar at the top, and what the invitation says. Unlike almost everything else here it is not fixed at creation — come back to this card and change it whenever you like.</p>' +
      '<div class="lanebox"><div class="lp editlane titlelane' + (S.title ? '' : ' blank') + '"' +
      ' contenteditable="plaintext-only" spellcheck="false" data-titlelane="1"' +
      ' data-ph="The name of this document">' + esc(S.title) + '</div></div>',
    slug: () =>
      '<p class="why">What people paste to each other. Also the one setting here that is awkward rather than impossible to change later — an old link keeps working, but the one in everybody’s address bar stops matching the one in the invitation.</p>' +
      '<span class="fld"><label>The link</label><span class="setrow2">' +
      '<span class="setnote" style="margin:0">docs.vote/</span>' +
      '<input data-slug="1" value="' + esc(S.slug) + '" spellcheck="false" style="width:16rem">' +
      '<button class="btn" data-act="copy">Copy</button></span></span>' +
      '<p class="setnote">' + (SLUG_OK.test(S.slug)
        ? 'Lower case, digits and hyphens. <b>docs.vote/' + esc(S.slug) + '</b> is free.'
        : 'Lower case, digits and hyphens, three characters or more.') + '</p>' +
      // **Changing it sets up a redirect** (Ed, 2026-08-18). The link is
      // changeable and it is also the thing that has already been sent to
      // fourteen people — so a change that broke the old one would make this
      // the one ordinary setting with a cost for using it as intended.
      '<p class="setnote">Every link this document has ever had keeps working: changing it leaves a redirect behind, so an invitation somebody was sent weeks ago still opens the right document.</p>',
    myname: () => nameBody(me()),
    mypic: () => pictureBody(me()),
    // **Whether the convenor is in it is its own question** (Ed, 2026-08-18).
    // It had been the top half of the roster card, which made a decision about
    // one person a preamble to a list of everybody — and the convenor is a hat
    // worn over a role rather than a role itself (SPEC §9.0a), so the hat and
    // the roster are two things.
    myrole: () =>
      '<p class="why">You set this document up. That is an administrative act, and it does not by itself put you in the room — a facilitator running a convention they are not a member of and a member who happened to start the document are different people performing it.</p>' +
      '<div class="choice" role="radiogroup">' +
      '<div class="pick' + (iDraft() ? ' on' : '') + '"><button class="lanepick" aria-pressed="' + iDraft() + '" data-me="member">' +
      '<span class="dot"></span><span>Yes</span></button>' +
      '<span class="exp">A member like anybody else: a wallet, judgments, a place in quorum, and the opening questions to answer with the rest of the room.</span></div>' +
      '<div class="pick' + (iDraft() ? '' : ' on') + '"><button class="lanepick" aria-pressed="' + !iDraft() + '" data-me="clerk">' +
      '<span class="dot"></span><span>No</span></button>' +
      '<span class="exp">You are the <b>clerk</b>: you set it up and keep it running, but the document is not yours to write — no wallet, no judgments, no place in quorum, and no opening questions to answer.</span></div></div>',
    roster: () =>
      '<p class="why">Everyone here gets a link by email — there are no passwords, and an invitation is an invitation <b>to become a member</b>: until somebody opens the document they are listed as <i>invited</i> and count toward nothing. Until judging opens you may invite and uninvite freely — nothing has been decided yet, so nothing is being changed (§9.6a). After that, both directions are constitutional motions. A joiner gets the base grant plus the drip accrued so far, and quorum recomputes.</p>' +
      '<div class="roster">' + S.roster.map((p, i) =>
        '<div class="rperson">' + avHtml(p) +
        '<span><span class="nm">' + esc(p.n) + (p.convenor ? ' <span class="chip convenor">convenor</span>' : '') +
        '</span><br><span class="em">' + esc(p.e) + '</span></span>' +
        '<span class="chip' + (p.in ? '' : ' pending') + '">' +
        (p.role === 'clerk' ? 'clerk' : 'member') + (p.in ? '' : ' · invited') + '</span>' +
        (p.convenor ? '<span class="xdrop"> </span>' : '<button class="xdrop" data-drop="' + i + '">✕</button>') +
        '</div>').join('') +
      '<div class="addrow"><input type="email" placeholder="name@example.com" data-add="1">' +
      '<button class="btn" data-act="add">Invite</button></div></div>' +
      '<div class="eyebrow fieldlab" style="margin-top:var(--s5)">Several at once</div>' +
      '<textarea placeholder="Paste addresses here, one per line" data-emails="1"></textarea>' +
      '<div style="margin-top:var(--s2)"><button class="btn" data-act="invite">Send invitations</button></div>' +
      '<p class="setnote">' + arrived() + ' of ' + S.roster.length + ' have opened it so far. ' +
      'Nobody has to be here for the document to exist — the link works from the first second, and ' +
      'a joiner gets the base grant plus the drip accrued so far.</p>',
    ending: () =>
      '<p class="why">The moment this document closes: the close itself, the record, and the top of the approval threshold’s ramp. <b>Never</b> is one of the answers — a perpetual document has no close of its own and a bar that cannot rise, because a ramp needs an endpoint to rise towards, and it ends by <b>freeze</b> when too few members are still active (§9.5) rather than by the calendar.</p>' +
      '<div class="choice" role="radiogroup">' +
      opt(S, 'ending', 'ends', 'At a set time', '',
        '<span class="fld"><label>Ends</label><input type="datetime-local" data-txt="endsAt" value="' + S.endsAt + '"></span>') +
      opt(S, 'ending', 'perpetual', 'Never', 'It runs until it is frozen. The ✏️s come back against real time instead of against a window.') +
      theyDecide('ending', 'That means the <b>latest</b> answer anybody gives, and <b>never</b> is the latest of all — so one member who wants it to run on keeps it running.') +
      '</div>',
    bar: () =>
      '<div class="unlocks">Part of the constitution — judging waits on this and the rest of it.</div>' +
      '<p class="why">How sure the room has to be that a change beats the current text before it is <b>permanent</b> — the bar at the close. Never a vote share, a confidence. Everything before the close can still be challenged, so this one number covers the whole way there; how the bar climbs is pacing, on the next card.</p>' +
      '<div class="choice" role="radiogroup">' +
      opt(S, 'barBy', 'convenor', 'I set it', '',
        '<span class="setrow2">' + num(S, 'tClose', 'At the close', 50, 99, '%') + '</span>') +
      theyDecide('barBy', 'Each states the <b>lowest bar</b> they will accept — at the close — and the document takes the highest.') +
      '</div>',
    pace: () =>
      '<p class="why">How the bar gets to the close: held there for the whole window, or rising from a lower start so early adoptions come cheap while they are still challengeable. Pacing, not consent — every adoption is recorded against the bar as it stood, so re-shaping the ramp re-rates nothing already decided, which is what makes this card ordinary while the close is constitutional.</p>' +
      '<div class="choice" role="radiogroup">' +
      opt(S, 'shape', 'ramp', 'Rising', 'From a lower start when judging opens, up to the close bar.',
        '<span class="setrow2">' + num(S, 'tStart', 'When judging opens', 50, 99, '%') + '</span>', perpetual()) +
      opt(S, 'shape', 'fixed', 'Fixed', 'The close bar for the life of the document.') +
      '</div>' + (perpetual() ? '<p class="setnote">A rising bar needs an endpoint to rise towards, so a perpetual document holds its bar fixed.</p>' : ''),
    quorum: () =>
      '<div class="unlocks">Part of the constitution — judging waits on it.</div>' +
      '<p class="why">How many distinct members must weigh in before a question can be adopted. A question short of quorum simply waits — silence is never counted as a vote.</p>' +
      // **The form is the wording, the number is the decision** (§9.0a): count
      // or share is how the question tracks a changing membership, and it is
      // the convenor's even when the number is the room's.
      '<div class="eyebrow fieldlab">Asked as</div>' +
      '<div class="choice" role="radiogroup" aria-label="Form">' +
      opt(S, 'quorumForm', 'share', 'A share of the membership', 'Suits a document with a window: the number tracks the membership as it changes.') +
      opt(S, 'quorumForm', 'count', 'A fixed number', 'Suits a perpetual document, where a drifting membership would otherwise silently re-rate every parked race.') +
      '</div>' +
      '<div class="eyebrow fieldlab" style="margin-top:var(--s4)">The number</div>' +
      '<div class="choice" role="radiogroup" aria-label="Number">' +
      opt(S, 'quorumBy', 'convenor', 'I set it', '',
        '<span class="setrow2">' + (S.quorumForm === 'share'
          ? num(S, 'quorumPct', 'Share', 1, 100, '% — ' + quorumCount() + ' of ' + E() + ' today')
          : num(S, 'quorumN', 'Members', 1, 40, 'of ' + E())) + '</span>') +
      theyDecide('quorumBy', 'Each states the <b>lowest quorum</b> they will accept — in the form above — and the document takes the highest.') +
      '</div>',
    authorship: () =>
      '<div class="unlocks">Part of the constitution — judging waits on it, because a judgment is recorded under whatever this says.</div>' +
      '<p class="why">Rationales are visible whatever is chosen. What varies is only whether a name is attached to one.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('authorship', 'A privacy question, so it takes the <b>most private</b> answer — which is what makes anonymity structural rather than merely the default.') +
      opt(S, 'authorship', 'anonymous', 'Anonymous', 'Never revealed, not even in the record.') +
      opt(S, 'authorship', 'sealed', 'Sealed', 'Hidden while live; revealed at the close.') +
      opt(S, 'authorship', 'public', 'Public', 'Visible from the moment a proposal is made.') +
      '</div><p class="setnote">Setting it yourself has a cost worth naming: anonymity becomes a default like any other, and members can be named without having agreed to it.</p>',
    signing: () =>
      '<div class="unlocks">Part of the constitution.</div>' +
      '<p class="why">Whether an author may put their name to a proposal that is otherwise unattributed.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('signing', 'The <b>most private</b> answer wins.') +
      opt(S, 'signing', 'nobody', 'Nobody signs', 'The only setting under which an unsigned proposal says nothing about its author.') +
      opt(S, 'signing', 'each', 'Each author chooses', 'In a roster this small, an unsigned candidate among signed ones says something.') +
      opt(S, 'signing', 'everybody', 'Everybody signs', 'Uniform in the other direction.') +
      '</div>',
    judgments: () =>
      '<div class="unlocks">Part of the constitution.</div>' +
      '<p class="why">Whether what somebody preferred is ever attached to their name. Never while a question is live, whichever is chosen — blind judgment while preferences are being collected is what makes the measurement mean anything.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('judgments', 'The <b>most private</b> answer wins.') +
      opt(S, 'judgments', 'never', 'Never revealed', 'What you preferred stays yours, permanently.') +
      opt(S, 'judgments', 'after', 'Revealed once the decision is made', 'Published with the record, never before it.') +
      '</div>',
    grant: () =>
      '<p class="why">How many ✏️s everybody holds on the first day. Proposing costs one, and members see the number in their wallets from the first minute — so a document meant to move quickly and one meant to be hard to change want different answers. A proposal also stakes one, which comes back in full if you withdraw it and in proportion to how well it did if it does not carry (§7) — that is a flat one, and not settable.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('grantBy', 'Each states the <b>fewest edits</b> they would accept being given, and the document takes the most generous answer. Until it settles, everyone drafts on the standard grant.') +
      opt(S, 'grantBy', 'convenor', 'I set it', '',
        '<span class="setrow2">' + num(S, 'grant', '✏️s to start with', 0, 40) + '</span>') +
      '</div>',
    drip: () =>
      '<p class="why">How fast a spent ✏️ comes back, and the most anybody may hold at once. Between them these two settings are the <b>proposal rate</b> — how often anybody may put something to the room. This is the half that decides whether the wallet is ever felt: at v1 defaults most members sit near the cap all session and never meet the constraint at all.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('dripBy', 'Each states the <b>slowest drip</b> they would accept, and the document takes the fastest.') +
      opt(S, 'dripBy', 'convenor', 'I set it', '',
        '<span class="setrow2">' + num(S, 'drip', '✏️s returned', 0, 10) +
        num(S, 'dripPer', perpetual() ? 'every N hours' : 'per N% of the window', 1, 100) +
        num(S, 'cap', 'Never more than', 1, 99) + '</span>') +
      '</div>',
    chamber: () =>
      '<p class="why">Who may read it besides the members. Whoever that is, they are <b>not members</b> — nothing is known about them, they have a link and nothing else, and they cannot propose, judge or be counted. What they see is the chamber view: adoptions as they land, the rolling log hash and which races are stuck. Live standings are never visible to anybody, whatever is chosen here.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('chamber', 'A privacy question, so the <b>most private</b> answer wins: one member who wants the room closed closes it.') +
      opt(S, 'chamber', 'link', 'Anyone with the link') +
      opt(S, 'chamber', 'closed', 'Roster only') +
      opt(S, 'chamber', 'public', 'Public', 'Listed and readable by anyone.') + '</div>',
    machines: () =>
      '<p class="why">A machine member holds ✏️s like anybody else and competes on the same terms.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('auditor', 'The <b>most restrictive</b> answer wins, so a single member who would rather not draft alongside a machine keeps it out.') +
      opt(S, 'auditor', true, 'Include the coherence auditor', 'Patrols the document for drift — a definition changed in one place and not another — and proposes fixes.',
        '<span class="setrow2">' + num(S, 'auditorBudget', 'Its edit budget', 0, 40) + '</span>') +
      opt(S, 'auditor', false, 'People only') + '</div>',
  };

  // ---- the band: two piles, and the card one of them opens into ----------
  function renderBand() {
    band.innerHTML = bandHtml(groups(), ctx, (g) => {
      const c = card(S.open);
      // A card the room owns keeps its own body — choosing to hand it over is
      // the convenor's decision and stays editable — and grows a **watching**
      // half underneath, which is the whole of what anybody may see of a blind
      // question while it runs.
      if (c.isGate) {
        return cardHtml(c, ctx, gateBody(c),
          '<button class="btn" data-close="1">Close</button>' +
          '<button class="btn btn-approve"' + (c.open() ? '' : ' disabled') +
          ' data-ok="' + c.k + '">OK</button>', g.cards);
      }
      const body = c.ansFor ? ANSWER[c.ansFor](S.myAns, E())
        : BODY[c.k]() +
          (isRoom(c) && settled(c) ? '<div class="body">' + watchBody(c, ctx) + '</div>' : '');
      const kindLine = (c.kind === 'personal' || c.ansFor) ? '' :
        '<p class="setnote"><b>' + KIND[c.kind] + '.</b> ' + (c.knote || kindNote[c.kind]) + '</p>';
      const foot = '<button class="btn" data-close="1">Close</button>' +
        '<button class="btn btn-approve glyphbtn"' + (ready(c) ? '' : ' disabled') +
        ' data-confirm="1" title="' + (ready(c) ? 'Confirm' : 'Not answered yet') + '">' + TICK + '</button>';
      return cardHtml(c, ctx, body + kindLine, foot, g.cards);
    });
    fitBand(band);
  }

  function refreshCommit() {
    const b = document.querySelector('[data-confirm]');
    if (b && S.open) b.disabled = !ready(card(S.open));
  }

  const render = () => {
    // the identity cards and the roster are two views of one person, so the
    // convenor's row follows what those cards say rather than holding a copy
    const row = meRow(); if (row) { row.n = S.myname; row.pic = S.mypic; }
    resolveCounts();
    renderTitle(); renderRail(); renderBand(); drawWire(wires, S.open);
  };

  // ---- wiring ------------------------------------------------------------
  // **The picture card is an uploader** (Ed, 2026-08-18). Delegated, because
  // the card is rebuilt on every render; the file is read locally and never
  // sent anywhere.
  const takePic = (file) => {
    if (!file || !/^image\//.test(file.type)) return;
    const fr = new FileReader();
    fr.onload = () => { S.mypic = 'u' + fr.result; render(); };
    fr.readAsDataURL(file);
  };
  document.addEventListener('change', (ev) => {
    if (ev.target.matches('[data-picfile]')) return takePic(ev.target.files[0]);
    if (ev.target.matches('[data-ansdate]')) {
      S.myAns[ev.target.dataset.ansdate] = ev.target.value || null; return render(); }
    if (ev.target.matches('[data-ansnum]')) {
      S.myAns[ev.target.dataset.ansnum] = ev.target.value === '' ? null : +ev.target.value;
      return render(); }
  });
  document.addEventListener('dragover', (ev) => {
    const z = ev.target.closest && ev.target.closest('.picdrop');
    if (z) { ev.preventDefault(); z.classList.add('over'); }
  });
  document.addEventListener('dragleave', (ev) => {
    const z = ev.target.closest && ev.target.closest('.picdrop');
    if (z) z.classList.remove('over');
  });
  document.addEventListener('drop', (ev) => {
    const z = ev.target.closest && ev.target.closest('.picdrop');
    if (!z) return;
    ev.preventDefault(); z.classList.remove('over');
    takePic(ev.dataTransfer.files && ev.dataTransfer.files[0]);
  });

  // A gate card says one thing: what it is waiting for, and whether that has
  // happened. What it is waiting *on* is drawn as the cards themselves, so a
  // member reads it as “these, and then you can write” rather than as a rule.
  const gateBody = (c) =>
    '<p class="why">' + c.why + '</p>' +
    '<div class="lockline">' + (c.open() ? TICK : '') + '<span>' +
    (c.open() ? c.done : c.waiting) + '</span></div>' +
    (c.open() ? '' : '<div class="gatelist">' + c.blockers().map((b) =>
      '<span class="gaterow"><span class="gg">' + b.g + '</span>' + esc(b.t) + '</span>').join('') + '</div>') +
    '<p class="setnote">' + (c.open()
      ? 'Nothing is being asked here — <b>OK</b> files it and it leaves your queue.'
      : 'It comes back to you the moment it opens.') + '</p>';

  document.addEventListener('click', (ev) => {
    const okb = ev.target.closest('[data-ok]');
    if (okb) { S.okd.add(okb.dataset.ok); S.open = null; return render(); }
    const t = ev.target.closest('[data-tab], [data-card]');
    if (t) { const k = t.dataset.tab || t.dataset.card;
      S.open = (S.open === k) ? null : k; return render(); }
    if (ev.target.closest('[data-confirm]')) { S.seen.add(S.open); S.open = null; return render(); }
    if (ev.target.closest('button[data-close]')) { S.open = null; return render(); }
    const an = ev.target.closest('[data-ans]');
    if (an) { const v = an.dataset.ansval;
      S.myAns[an.dataset.ans] = (v === 'true') ? true : (v === 'false') ? false
        : (v === 'date') ? (S.myAns[an.dataset.ans] === 'never' ? null : S.myAns[an.dataset.ans])
        : v;
      return render(); }
    const o = ev.target.closest('[data-set]');
    if (o) { const v = o.dataset.val;
      S[o.dataset.set] = (v === 'true') ? true : (v === 'false') ? false : v;
      if (perpetual() && S.shape === 'ramp') S.shape = 'fixed';
      return render(); }
    const pic = ev.target.closest('[data-pic]');
    if (pic) { S.mypic = pic.dataset.pic; return render(); }
    const m = ev.target.closest('[data-me]');
    if (m) { const row = meRow(); if (row) row.role = m.dataset.me; return render(); }
    const d = ev.target.closest('[data-drop]');
    if (d) { S.roster.splice(+d.dataset.drop, 1); return render(); }
    if (ev.target.closest('[data-act="add"]')) {
      const f = document.querySelector('[data-add]');
      if (f && f.value.trim()) invite(f.value.trim());
      return render(); }
    if (ev.target.closest('[data-act="invite"]')) {
      const box = document.querySelector('[data-emails]');
      if (box) { box.value.split(/[\s,;]+/).filter((x) => x.includes('@')).forEach(invite); box.value = ''; }
      return render();
    }
  });
  function invite(em) {
    if (S.roster.some((p) => p.e === em)) return;
    S.roster.push({ n: em.split('@')[0].replace(/[._-]+/g, ' ').replace(/\b\w/g, (x) => x.toUpperCase()),
      e: em, role: 'member', in: false });
    setTimeout(() => { const p = S.roster.find((x) => x.e === em); if (p) { p.in = true; render(); } },
      1200 + Math.random() * 2600);
  }
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && S.open) { S.open = null; return render(); }
    if (ev.key === 'Enter' && ev.target.closest('[data-titlelane]')) ev.preventDefault();
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.closest('[data-tab]')) {
      ev.preventDefault(); ev.target.closest('[data-tab]').click();
    }
  });
  // A lane rebuilt on every keystroke would lose the caret, so typing repaints
  // the bar and the rail and leaves the card alone — only the commit control,
  // which is about what you have just typed, is set directly.
  document.addEventListener('input', (ev) => {
    const sl = ev.target.closest && ev.target.closest('[data-slide]');
    if (sl) { S.myAns[sl.dataset.slide] = +sl.value; render();
      const again = document.querySelector('[data-slide="' + sl.dataset.slide + '"]');
      if (again) again.focus(); return; }
    const t = ev.target;
    const lane = t.closest && t.closest('[data-titlelane]');
    if (lane) { S.title = lane.textContent.trim(); lane.classList.toggle('blank', !S.title);
      renderTitle(); renderRail(); refreshCommit(); return; }
    if (t.dataset.slug) { S.slug = t.value.trim().toLowerCase(); renderRail(); refreshCommit(); return; }
    if (t.dataset.txt === 'myname') { S.myname = t.value; renderRail(); refreshCommit(); return; }
    if (t.dataset.txt) { S[t.dataset.txt] = t.value; renderRail(); }
    if (t.dataset.num) { S[t.dataset.num] = +t.value; renderRail(); }
  });
  addEventListener('resize', () => { fitBand(band); drawWire(wires, S.open); });
  addEventListener('scroll', () => drawWire(wires, S.open), true);

  relabel(); render();
})();
</script>
