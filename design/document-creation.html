<meta charset="utf-8">
<title>Document creation</title>
<link rel="stylesheet" href="system.css">
<link rel="stylesheet" href="setup.css">
<style>
/* ============================================================================
   document-creation — **the document, from its first minute.**

   Four notes built this, in order, and each one made the screen less of a form:

   1. *Something that looks like the document itself; the admin pastes the text
      into the space where it will later be edited, the ToC appears on cue, they
      click the placeholder title in the topbar, and the sidebar holds cards with
      each of the questions they need to decide.*
   2. *Can we import as much of the session-view as we can? I think ultimately
      this will literally be the session view.*
   3. *You can start inviting people immediately after creating the document …
      and as soon as you've confirmed the starting text they can start making
      proposals … and judgements unlock as soon as the ceremony is complete.*
   4. *Ceremony and admin cards are absolutely just queue-cards. Instead of
      modals they open cards in the document at the top, above the text, pushing
      it down like decision-cards do a clause. They have cables and tabs.*

   The third changed the model: there is **no "open the document" button**,
   because there is no moment when the document opens. The fourth finished the
   convergence — a modal was the last thing on this screen that was not the
   session-view, and it was the wrong object twice over. It lifted the question
   off the document at exactly the moment the question is about the document,
   and it made these the only cards on the surface that do not behave like
   cards.

   What is left here is this screen's own fixture and the bodies of the cards a
   convenor fills in. The tab group, the cable, the rail entry, the read-only
   and watching bodies and the identity card are in `setup.js`, because the
   founding ceremony is this same screen seen by somebody else.
   ========================================================================== */

  /* **The title is not edited in the topbar** (Ed, 2026-08-18: *it’s a
     queue-card with a composer that you set, and can return to and change,
     like other cards that behave that way*). It had been a contenteditable in
     the bar, which is the one place on this screen that is not a card — so the
     title was the single setting with no card behind it, no confirm, and no way
     back to it except clicking the words. The bar shows the title; the 🏷️ card
     is where you write it, in the same `.lanebox` the `editing-card` writes a
     clause in. */
  .navbar .brand.ph { color: var(--muted); font-weight: 400; }

  /* the paste-well: the empty state of the prose column, and nothing more */
  .prose.empty::before {
    content: "Paste the text this document starts from, or begin typing it.\A\A Markdown headings become its sections, and the contents appear beside you as you go.";
    white-space: pre-wrap; color: var(--muted); font-size: var(--t-body); line-height: 1.6;
  }

  /* ---- the share box: first in the rail, live from the first second ------ */
  .share { border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--s3);
    background: var(--light); margin-bottom: var(--s4); }
  .share .lab { font-size: var(--t-cap); color: var(--muted); margin-bottom: var(--s2); }
  .linkrow { display: flex; gap: var(--s1); margin-bottom: var(--s2); }
  .linkrow input { flex: 1; min-width: 0; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: var(--t-cap); padding: var(--s1) var(--s2); color: var(--muted); }
  .share textarea { width: 100%; font-size: var(--t-cap); padding: var(--s2);
    resize: vertical; min-height: 48px; }
  .share .btn { font: inherit; font-size: var(--t-cap); padding: var(--s1) var(--s2); cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); border-radius: var(--r-sm); }
  .share .btn:hover { border-color: var(--primary); color: var(--primary-emphasis); }
  .here { font-size: var(--t-cap); color: var(--muted); margin-top: var(--s2); display: flex;
    align-items: center; gap: var(--s1); flex-wrap: wrap; }

  /* ---- what is unlocked, and what is waiting ----------------------------- */
  .stages { margin-bottom: var(--s4); }
  .stage { display: flex; align-items: baseline; gap: var(--s2); padding: 3px 10px;
    font-size: var(--t-small); }
  .stage .nm { font-weight: 600; }
  .stage .st { color: var(--muted); font-size: var(--t-cap); margin-left: auto; text-align: right; }
  .stage.live .nm, .stage.live .st { color: var(--ok); }
  .stage .mkg { flex: none; }
  .stage.wait .mkg { visibility: hidden; }
</style>

<header class="navbar">
  <div class="wrap">
    <p class="brand ph" id="title">Untitled document</p>
    <div class="stats">
      <span id="stat-stage">reading only</span>
      <span id="stat-who">1 in the room</span>
      <button class="me" id="mebtn" title="You, and the convenor of this document."></button>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="layout">
    <nav class="toc"><ul id="toc"></ul></nav>
    <main>
      <div class="doc" id="doc">
        <div class="setupband" id="band"></div>
        <div class="prose empty" id="prose" contenteditable="true" spellcheck="false"></div>
      </div>
    </main>
    <aside class="queue stack"><div id="rail"></div></aside>
  </div>
</div>
<svg id="wires" aria-hidden="true"></svg>

<script src="setup.js"></script>
<script>
(function () {
  const { esc, TICK, initials, avHtml, tabGroupHtml, railEntry, cardHtml,
    watchBody, identityBody, drawWire, opt, num, someIn } = window.SETUP;
  const prose = document.getElementById('prose');
  const titleEl = document.getElementById('title');
  const band = document.getElementById('band');
  const rail = document.getElementById('rail');
  const wires = document.getElementById('wires');

  const S = {
    title: '', slug: 'hollow-oak-4f2a',
    myname: 'Wren Ashby', mypic: 'c0',
    window: 'ends', endsAt: '2026-08-20T18:00',
    shape: 'roster', tStart: 55, tEnd: 78, tFixed: 66,
    quorumForm: 'roster', quorumPct: 33, quorumN: 5,
    authorship: 'roster', signing: 'roster', judgments: 'roster',
    authorshipSet: 'anonymous', signingSet: 'nobody', judgmentsSet: 'never',
    economyBy: 'roster', grant: 4, drip: 1, dripPer: 10, cap: 8, stake: 1,
    chamber: 'roster', auditor: 'roster', auditorBudget: 6,
    roster: [{ n: 'Wren Ashby', e: 'wren@hollowoak.club', role: 'member', convenor: true, in: true }],
    // **Confirmed, not merely defaulted** (Ed, 2026-08-17). A default nobody
    // read is not a decision, and these are the decisions that cannot be changed
    // once people are drafting. So a card carries its value from the first
    // render — the rail is never a list of blanks — and stays yellow until it
    // has been opened and committed. The tick means *seen and agreed*.
    seen: new Set(),
    open: null,
  };
  const me = () => ({ n: S.myname, pic: S.mypic });

  const members = () => S.roster.filter((p) => p.role === 'member');
  const E = () => Math.max(members().length, 1);
  const arrived = () => S.roster.filter((p) => p.in).length;
  const meRow = () => S.roster.find((p) => p.convenor);
  const iDraft = () => { const m = meRow(); return !!m && m.role === 'member'; };
  const quorumCount = () => (S.quorumForm === 'share'
    ? Math.max(1, Math.round(E() * S.quorumPct / 100)) : Math.min(S.quorumN, E()));
  const perpetual = () => S.window === 'perpetual';
  const SLUG_OK = /^[a-z0-9][a-z0-9-]{2,}$/;

  // ---- the document ------------------------------------------------------
  function relabel() {
    const sel = getSelection();
    const at = sel.rangeCount ? sel.getRangeAt(0).startContainer : null;
    for (const b of [...prose.children]) {
      const t = b.textContent;
      const m = t.match(/^(#{1,3})\s+/);
      if (m) {
        const liveHere = at && b.contains(at);
        b.textContent = t.slice(m[0].length);
        b.className = 'docline lvl' + m[1].length;
        b.dataset.h = b.textContent;
        if (liveHere && b.firstChild) {
          const r = document.createRange();
          r.setStart(b.firstChild, 0); r.collapse(true);
          sel.removeAllRanges(); sel.addRange(r);
        }
      } else if (b.className) { b.dataset.h = t; } else { delete b.dataset.h; }
    }
    prose.classList.toggle('empty', prose.textContent.trim() === '');
    renderToc(); render();
  }
  function renderToc() {
    const hs = [...prose.children].filter((b) => b.dataset.h !== undefined);
    document.getElementById('toc').innerHTML = hs.map((b, i) => {
      b.id = 'h' + i;
      const lvl = (b.className.match(/lvl(\d)/) || [0, 2])[1];
      return '<li class="lvl' + lvl + '"><a href="#h' + i + '">' + esc(b.dataset.h) + '</a></li>';
    }).join('');
  }
  prose.addEventListener('paste', (ev) => {
    ev.preventDefault();
    const txt = (ev.clipboardData || window.clipboardData).getData('text');
    let lines = txt.split(/\n{2,}|\n/).filter((l) => l.trim());
    const first = lines[0] && lines[0].match(/^#\s+(.+)$/);
    if (first && !S.title) { S.title = first[1]; lines = lines.slice(1); }
    document.execCommand('insertHTML', false, lines.map((l) => '<div>' + esc(l) + '</div>').join(''));
    setTimeout(relabel, 0);
  });
  prose.addEventListener('input', relabel);
  function renderTitle() {
    titleEl.textContent = S.title || 'Untitled document';
    titleEl.classList.toggle('ph', !S.title);
  }
  // A title lane rebuilt on every keystroke would lose the caret, so typing in
  // it repaints the bar and the rail and leaves the card alone — the same rule
  // the identity card's name field follows.
  document.addEventListener('input', (ev) => {
    const t = ev.target.closest('[data-titlelane]');
    if (!t) return;
    S.title = t.textContent.trim();
    t.classList.toggle('blank', S.title === '');
    renderTitle(); renderRail(); refreshCommit();
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && ev.target.closest('[data-titlelane]')) ev.preventDefault();
  });

  // ---- the cards ---------------------------------------------------------
  // **"Who may be seen" is in fact three cards** (Ed, 2026-08-18). It had been
  // one card with three ladders in it, which is a form pretending to be a
  // question. They are three genuinely separate rules — whose proposal it is,
  // who may sign, and whether your judgments are ever revealed — decided
  // separately, resolved separately, and each capable of blocking on its own.
  // Stacking them made the longest card on the surface and hid two decisions
  // behind a third's title.
  //
  // Their glyphs have to be three silhouettes rather than three shades of the
  // same idea, since all three are about being seen: 👤 a person attached to a
  // proposal, ✍️ a hand putting a name to one, 👁️ whether anybody may look at
  // what you preferred.
  const DELEG = {
    window: 'roster', shape: 'roster', quorumForm: 'roster', authorship: 'roster',
    signing: 'roster', judgments: 'roster', economyBy: 'roster', chamber: 'roster', auditor: 'roster',
  };
  const delegated = (key) => S[key] === DELEG[key];

  const CARDS = [
    // **A document may start empty** (Ed, 2026-08-17), which is why this is not
    // a blocker on having content but on having *decided*. A page nobody has
    // looked at and a page somebody chose to leave blank look identical, and
    // only one of them should let people start proposing.
    { k: 'text', g: '📄', t: 'The starting text', gate: 'propose', key: null },
    { k: 'title', g: '🏷️', t: 'The title', key: null, ready: () => !!S.title },
    // **The link is its own card** (Ed, 2026-08-18). It had been a read-only
    // field in the share box, which quietly made it the one thing on this
    // screen that was decided by not being decided: a slug is what the document
    // is called *to everybody who is not reading it yet*, it is what people
    // paste to each other, and it is the one setting that is awkward rather
    // than impossible to change afterwards. A generated one is a fine answer —
    // but it should be an answer.
    { k: 'slug', g: '🔗', t: 'The link', key: null, ready: () => SLUG_OK.test(S.slug) },
    { k: 'you', g: '🙂', t: 'How you appear', owner: 'you', key: null, ready: () => !!S.myname.trim() },
    { k: 'roster', g: '✉️', t: 'The roster', key: null, ready: () => members().length >= 1 },
    { k: 'window', g: '📅', t: 'The window', key: 'window', dep: ['roster'] },
    { k: 'bar', g: '✒️', t: 'The bar', dep: ['window'], gate: 'judge', key: 'shape', p: 0.64,
      rule: 'Each member states the <b>lowest bar</b> they will accept and the document takes the highest, so it will never be easier to change than any one of them wanted.',
      takes: 'The document takes the highest', result: '80%',
      dist: [0, 1, 2, 3, 2, 1, 2, 1, 1, 1], distTop: 8, distEnds: ['50%', '95%'] },
    { k: 'quorum', g: '👥', t: 'Quorum', dep: ['window'], gate: 'judge', key: 'quorumForm', p: 0.79,
      rule: 'Each member states the <b>lowest quorum</b> they will accept and the document takes the highest.',
      takes: 'The document takes the highest', result: '10 of 14',
      dist: [0, 0, 1, 1, 2, 3, 2, 2, 1, 1, 1, 0, 0, 0], distTop: 9, distEnds: ['1 of 14', '14 of 14'] },
    { k: 'authorship', g: '👤', t: 'Whose proposal it is', dep: ['window'], gate: 'judge', key: 'authorship', p: 0.5,
      rule: 'A privacy question, so it runs the other way and takes the <b>most private</b> answer: one member who wants to stay unnamed keeps the whole document unnamed.',
      takes: 'The document takes the most private', result: 'Nobody’s name, ever',
      dist: [8, 4, 2], distTop: 0, distEnds: ['No names, ever', 'Names from the start'] },
    { k: 'signing', g: '✍️', t: 'Signing', dep: ['window'], gate: 'judge', key: 'signing', p: 0.5,
      rule: 'Also a privacy question, and the <b>most private</b> answer wins.',
      takes: 'The document takes the most private', result: 'Nobody signs',
      dist: [9, 3, 2], distTop: 0, distEnds: ['Nobody signs', 'Everybody signs'] },
    { k: 'judgments', g: '👁️', t: 'Your judgments', dep: ['window'], gate: 'judge', key: 'judgments', p: 0.86,
      rule: 'Whether what you preferred is ever attached to your name. Never while a question is live, whatever is chosen — blind judgment is what makes the measurement mean anything.',
      takes: 'The document takes the most private', result: 'Never revealed',
      dist: [11, 3], distTop: 0, distEnds: ['Never', 'After the decision'] },
    { k: 'economy', g: '🪙', t: 'The edit economy', dep: ['window'], key: 'economyBy', p: 0.36,
      rule: 'Each member states the <b>fewest edits</b> they would accept being given and the document takes the most generous answer. Until it settles, everyone drafts on the standard grant.',
      takes: 'The document takes the most generous', result: '5 to start, 1 per 10%',
      dist: [1, 2, 4, 3, 2, 1, 1], distTop: 4, distEnds: ['0 to start', '12 to start'] },
    { k: 'chamber', g: '🔭', t: 'Who else can see it', dep: ['window'], key: 'chamber', p: 0.43,
      rule: 'A privacy question, so the <b>most private</b> answer wins: one member who wants the room closed closes it.',
      takes: 'The document takes the most private', result: 'Roster only',
      dist: [5, 8, 1], distTop: 1, distEnds: ['Roster only', 'Public'] },
    { k: 'machines', g: '🤖', t: 'Machine participants', dep: ['window'], key: 'auditor', p: 0.86,
      rule: 'The <b>most restrictive</b> answer wins, so a single member who would rather not draft alongside a machine keeps it out.',
      takes: 'The document takes the most restrictive', result: 'People only',
      dist: [9, 5], distTop: 0, distEnds: ['People only', 'A machine is fine'] },
  ];
  const card = (k) => CARDS.find((c) => c.k === k);
  const isRoom = (c) => !!(c.key && delegated(c.key));
  // How far the room has got, against the roster **as it stands**. Held as a
  // proportion rather than a count because a convenor's roster starts at one
  // person and grows as they invite: a fixture of absolute counts had the rail
  // saying nine of fourteen had answered a question in a room of one.
  const resolveCounts = () => CARDS.forEach((c) => { if (c.p != null) c.in = Math.round(c.p * E()); });
  const ready = (c) => (c.ready ? c.ready() : true);
  const settled = (c) => S.seen.has(c.k) && ready(c);
  // A convenor may act on everything: the ones they keep, the ones they hand
  // over (handing over is itself the decision), and their own name.
  const mustAct = (c) => !settled(c);

  const VALUE = {
    text: () => { const n = [...prose.children].filter((b) => b.textContent.trim()).length;
      return n ? n + ' blocks' : (S.seen.has('text') ? 'Starts empty — the room writes it' : 'Nothing yet'); },
    title: () => S.title || 'Not named yet',
    slug: () => 'draft.to/' + (S.slug || '…'),
    you: () => S.myname || 'Unnamed',
    window: () => (perpetual() ? 'Perpetual'
      : 'Ends ' + new Date(S.endsAt).toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit' })),
    roster: () => members().length + ' drafting, ' + (S.roster.length - members().length) +
      ' watching' + (iDraft() ? '' : ' — you are the clerk'),
    bar: () => (S.shape === 'fixed' ? 'Fixed at ' + S.tFixed + '%' : 'Rising, ' + S.tStart + '% → ' + S.tEnd + '%'),
    quorum: () => (S.quorumForm === 'count' ? Math.min(S.quorumN, E()) + ' of ' + E()
      : S.quorumPct + '% — ' + quorumCount() + ' of ' + E()),
    authorship: () => ({ anonymous: 'Nobody’s name, ever', sealed: 'Names at the close',
      public: 'Names from the start' }[S.authorshipSet]),
    signing: () => ({ nobody: 'Nobody signs', each: 'Each author chooses', everybody: 'Everybody signs' }[S.signingSet]),
    judgments: () => ({ never: 'Never revealed', after: 'Revealed after the decision' }[S.judgmentsSet]),
    economy: () => S.grant + ' to start, ' + S.drip + ' back per ' + (perpetual() ? S.dripPer + 'h' : S.dripPer + '%'),
    chamber: () => ({ link: 'Anyone with the link', closed: 'Roster only', public: 'Public' }[S.chamber]),
    machines: () => (S.auditor === true ? 'The coherence auditor, ' + S.auditorBudget + ' edits' : 'People only'),
  };
  const value = (c) => esc(VALUE[c.k]());
  const summary = (c) => (isRoom(c)
    ? (settled(c) ? '<i>The participants decide</i> · ' + someIn(c.in || 0, E()) : '<i>The participants decide</i>')
    : value(c));

  // **What is unlocked, and by what.** Reading needs nothing at all. Proposing
  // needs a text to propose against, and nothing else: you do not have to know
  // the constitution to say what a clause should say. Judging needs the
  // constitution settled, because a judgment is *recorded under a disclosure
  // setting* and *counted towards a quorum*, and neither can be decided after
  // the judgment without changing what the judgment was.
  const canPropose = () => settled(card('text'));
  const ceremony = () => CARDS.filter((c) => c.gate === 'judge');
  const ceremonyRunning = () => ceremony().some((c) => isRoom(c) && (c.in || 0) < E());
  const canJudge = () => ceremony().every(settled) && !ceremonyRunning();

  const ctx = {
    get open() { return S.open; }, get E() { return E(); },
    mustAct, settled, summary, value, isRoom,
    bandLabel: (c) => (isRoom(c) ? 'The participants decide' : c.owner === 'you' ? 'You' : 'The convenor sets this'),
  };

  // **A card with a dependency does not appear until its dependency is
  // settled** (Ed, 2026-08-18: *if there are dependencies, just don't show them
  // the next cards until they're done*). The alternative — every card on screen
  // from the first second with the halves that cannot yet be answered greyed —
  // is what the bar card was already doing about a perpetual window, and it
  // scales badly: a rail of twelve questions, five of which quietly mean nothing
  // yet, is a worse first screen than a rail of five that grows.
  //
  // There are only two dependencies and both are real. Anything the room can be
  // asked waits on **the roster**, because *the participants decide* means
  // nothing until there are participants; and the constitution waits on **the
  // window**, because a rising bar needs an endpoint to rise towards and the
  // drip is paced against one.
  const visible = (c) => (c.dep || []).every((k) => settled(card(k)));
  const LIVE = () => CARDS.filter(visible);

  // ---- the rail ----------------------------------------------------------
  function renderRail() {
    const CARDS = LIVE();
    const outstanding = CARDS.filter((c) => !settled(c));
    const stage = (nm, on, note) =>
      '<div class="stage ' + (on ? 'live' : 'wait') + '"><span class="nm">' + nm + '</span>' + TICK +
      '<span class="st">' + note + '</span></div>';
    const room = CARDS.filter((c) => settled(c) && isRoom(c));
    const mine = CARDS.filter((c) => !(settled(c) && isRoom(c)));

    rail.innerHTML =
      '<div class="share">' +
      '<div class="lab">Anyone with this link can open the document now.</div>' +
      '<div class="linkrow"><input readonly value="draft.to/' + esc(S.slug) + '"><button class="btn" data-act="copy">Copy</button></div>' +
      '<textarea placeholder="…or paste addresses here, one per line" data-emails="1"></textarea>' +
      '<div style="margin-top:var(--s2)"><button class="btn" data-act="invite">Send invitations</button></div>' +
      '<div class="here">' + S.roster.map((p) => avHtml(p, p.in ? '' : 'pending')).join('') +
      '<span>' + arrived() + ' of ' + S.roster.length + ' have opened it</span></div></div>' +

      '<div class="stages">' +
      stage('Reading', true, 'live') +
      stage('Proposing', canPropose(), canPropose() ? 'live' : 'waiting on the starting text') +
      stage('Judging', canJudge(), canJudge() ? 'live'
        : ceremonyRunning() ? 'waiting on the opening ceremony' : 'waiting on the constitution') +
      '</div>' +

      '<ul><li class="qhead">' + (outstanding.length ? outstanding.length + ' still to confirm' : 'All confirmed') + '</li>' +
      mine.map((c) => railEntry(c, ctx)).join('') +
      // **The room's cards, with a completion bar** (Ed, 2026-08-18). Once a
      // question is handed over there is nothing left for the convenor to do
      // with it, so it leaves the list of things to confirm — but it is the
      // thing judging is waiting on, so it must not leave the screen. It goes
      // grey and takes a fill: `grey means nothing is being asked of you`, and
      // a bar is the only honest thing a blind question can show while it runs.
      (room.length ? '<li class="qhead">Waiting on the room</li>' +
        room.map((c) => railEntry(c, ctx)).join('') : '') + '</ul>';

    document.getElementById('stat-stage').textContent =
      canJudge() ? 'open' : canPropose() ? 'proposals open' : 'reading only';
    document.getElementById('stat-who').textContent = arrived() + ' in the room';
    document.getElementById('mebtn').innerHTML = avHtml(me(), 'face');
  }

  // ---- the bodies a convenor fills in ------------------------------------
  const theyDecide = (key, note) => opt(S, key, DELEG[key], 'The participants decide',
    'Asked at the opening ceremony, blind — you among them, if you are on the roster. ' + note);

  const BODY = {
    text: () => '<h2>The starting text</h2>' +
      '<div class="unlocks">Confirming this lets everyone start <b>proposing</b>. They will not be able to judge until the constitution is settled.</div>' +
      '<p class="why">Type or paste it into the page below — the same column it will be edited in once drafting begins. Lines starting with #, ## or ### become sections, and the contents appear on the left as you go.</p>' +
      '<p class="setnote"><b>Or leave it blank.</b> A roster writing something from nothing is an ordinary way to begin, and an empty page is a real answer to this question. What this card is asking is not whether there is text, but whether you have decided.</p>',
    slug: () => '<h2>The link</h2>' +
      '<p class="why">What people paste to each other. It is also the one setting here that is awkward rather than impossible to change later — an old link keeps working, but the one in everybody’s address bar stops matching the one in the invitation.</p>' +
      '<span class="fld"><label>The link</label><span class="setrow">' +
      '<span class="setnote" style="margin:0">draft.to/</span>' +
      '<input data-slug="1" value="' + esc(S.slug) + '" spellcheck="false" style="width:16rem"></span></span>' +
      '<p class="setnote">' + (SLUG_OK.test(S.slug)
        ? 'Lower case, digits and hyphens. <b>draft.to/' + esc(S.slug) + '</b> is free.'
        : 'Lower case, digits and hyphens, three characters or more.') + '</p>',
    title: () => '<h2>The title</h2>' +
      '<p class="why">What members read in the bar at the top, and what the invitation says. Unlike almost everything else here it is not fixed at creation — come back to this card and change it whenever you like.</p>' +
      '<div class="lanebox"><div class="lp editlane titlelane' + (S.title ? '' : ' blank') + '"' +
      ' contenteditable="plaintext-only" spellcheck="false" data-titlelane="1"' +
      ' data-ph="The name of this document">' + esc(S.title) + '</div></div>',
    you: () => identityBody(me()),
    window: () => '<h2>The window</h2><p class="why">Whether this document has an ending. Fixed once people are drafting, like everything else here.</p>' +
      '<div class="choice" role="radiogroup">' +
      opt(S, 'window', 'ends', 'It ends at a set time', 'Buys a closing ceremony, a drip paced against the window, and a record cut at a known moment.',
        '<span class="fld"><label>Ends</label><input type="datetime-local" data-txt="endsAt" value="' + S.endsAt + '"></span>') +
      opt(S, 'window', 'perpetual', 'Perpetual', 'The drip runs against real time and never resets, and the document ends by <b>freeze</b> — when too few members are still active, the roster ends it rather than the calendar (§9.5).') +
      theyDecide('window', 'For a window that means the <b>latest</b> ending anybody asks for, so nobody is cut off before they were ready.') +
      '</div><p class="setnote">Along with the roster, this is usually the convenor’s to set — somebody has to say when everyone is free.</p>',
    bar: () => '<h2>The bar</h2>' +
      '<div class="unlocks">Part of the constitution — judging waits on this and the four beside it.</div>' +
      '<p class="why">How sure the room has to be that a change beats the current text. Never a vote share — a confidence.</p>' +
      '<div class="choice" role="radiogroup">' +
      opt(S, 'shape', 'ramp', 'Rising', 'Starts low and rises to the close, because the bar should track irreversibility: an early adoption can still be challenged, a late one is permanent.',
        '<span class="setrow">' + num(S, 'tStart', 'At the opening', 50, 99, '%') + num(S, 'tEnd', 'At the close', 50, 99, '%') + '</span>', perpetual()) +
      opt(S, 'shape', 'fixed', 'Fixed', 'One bar for the life of the document.',
        '<span class="setrow">' + num(S, 'tFixed', 'The bar', 50, 99, '%') + '</span>') +
      theyDecide('shape', 'Each states the <b>lowest bar</b> they will accept and the document takes the highest.') +
      '</div>' + (perpetual() ? '<p class="setnote">A rising bar needs an endpoint to rise towards, so a perpetual document holds its bar fixed.</p>' : ''),
    quorum: () => '<h2>Quorum</h2>' +
      '<div class="unlocks">Part of the constitution — judging waits on it.</div>' +
      '<p class="why">How many distinct members must weigh in before a question can be adopted. A question short of quorum simply waits — silence is never counted as a vote.</p>' +
      '<div class="choice" role="radiogroup">' +
      opt(S, 'quorumForm', 'share', 'A share of the roster', 'Suits a document with a window, where the roster is stable.',
        '<span class="setrow">' + num(S, 'quorumPct', 'Share', 1, 100, '% — ' + quorumCount() + ' of ' + E() + ' today') + '</span>') +
      opt(S, 'quorumForm', 'count', 'A fixed number', 'Suits a perpetual document, where a drifting roster would otherwise silently re-rate every parked race.',
        '<span class="setrow">' + num(S, 'quorumN', 'Members', 1, 40, 'of ' + E()) + '</span>') +
      theyDecide('quorumForm', 'Each states the <b>lowest quorum</b> they will accept and the document takes the highest.') +
      '</div>',
    authorship: () => '<h2>Whose proposal it is</h2>' +
      '<div class="unlocks">Part of the constitution — judging waits on it, because a judgment is recorded under whatever this says.</div>' +
      '<p class="why">Rationales are visible whatever is chosen. What varies is only whether a name is attached to one.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('authorship', 'A privacy question, so it takes the <b>most private</b> answer — which is what makes anonymity structural rather than merely the default.') +
      opt(S, 'authorship', 'anonymous', 'Anonymous', 'Never revealed, not even in the record.') +
      opt(S, 'authorship', 'sealed', 'Sealed', 'Hidden while live; revealed at the close.') +
      opt(S, 'authorship', 'public', 'Public', 'Visible from the moment a proposal is made.') +
      '</div><p class="setnote">Setting it yourself has a cost worth naming: anonymity becomes a default like any other, and members can be named without having agreed to it.</p>',
    signing: () => '<h2>Signing</h2>' +
      '<div class="unlocks">Part of the constitution.</div>' +
      '<p class="why">Whether an author may put their name to a proposal that is otherwise unattributed.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('signing', 'The <b>most private</b> answer wins.') +
      opt(S, 'signing', 'nobody', 'Nobody signs', 'The only setting under which an unsigned proposal says nothing about its author.') +
      opt(S, 'signing', 'each', 'Each author chooses', 'In a roster this small, an unsigned candidate among signed ones says something.') +
      opt(S, 'signing', 'everybody', 'Everybody signs', 'Uniform in the other direction.') +
      '</div>',
    judgments: () => '<h2>Your judgments</h2>' +
      '<div class="unlocks">Part of the constitution.</div>' +
      '<p class="why">Whether what somebody preferred is ever attached to their name. Never while a question is live, whichever is chosen — blind judgment while preferences are being collected is what makes the measurement mean anything.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('judgments', 'The <b>most private</b> answer wins.') +
      opt(S, 'judgments', 'never', 'Never revealed', 'What you preferred stays yours, permanently.') +
      opt(S, 'judgments', 'after', 'Revealed once the decision is made', 'Published with the record, never before it.') +
      '</div>',
    economy: () => '<h2>The edit economy</h2><p class="why">Proposing costs an edit. Members see these numbers in their wallets from the first minute, so a document meant to move quickly and one meant to be hard to change want different answers.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('economyBy', 'Each states the <b>fewest edits</b> they would accept being given, and the document takes the most generous answer.') +
      opt(S, 'economyBy', 'convenor', 'I set them',
        'Everyone drafts on the standard grant until this is settled either way.',
        '<span class="setrow">' + num(S, 'grant', 'To start with', 0, 40) + num(S, 'drip', 'Returned', 0, 10) +
        num(S, 'dripPer', perpetual() ? 'every N hours' : 'per N% of window', 1, 100) +
        num(S, 'cap', 'Never more than', 1, 99) + num(S, 'stake', 'Staked per proposal', 0, 10) + '</span>' +
        '<span class="setnote">A stake comes back in full if you withdraw, and in proportion to how well the proposal did if it does not carry (§7).</span>') +
      '</div>',
    chamber: () => '<h2>Who else can see it</h2><div class="choice" role="radiogroup">' +
      theyDecide('chamber', 'A privacy question, so the <b>most private</b> answer wins: one member who wants the room closed closes it.') +
      opt(S, 'chamber', 'link', 'Anyone with the link', 'The chamber view only: adoptions as they land, the rolling log hash, which races are stuck. Live standings are never visible to anybody.') +
      opt(S, 'chamber', 'closed', 'Roster only') +
      opt(S, 'chamber', 'public', 'Public', 'Listed and readable by anyone.') + '</div>',
    machines: () => '<h2>Machine participants</h2><p class="why">A machine member holds a token budget like anybody else and competes on the same terms.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('auditor', 'The <b>most restrictive</b> answer wins, so a single member who would rather not draft alongside a machine keeps it out.') +
      opt(S, 'auditor', true, 'Include the coherence auditor', 'Patrols the document for drift — a definition changed in one place and not another — and proposes fixes.',
        '<span class="setrow">' + num(S, 'auditorBudget', 'Its edit budget', 0, 40) + '</span>') +
      opt(S, 'auditor', false, 'People only') + '</div>',
    roster: () => '<h2>The roster</h2><p class="why">Everyone here gets a link by email — there are no passwords. You can keep adding people after this; a joiner gets the base grant plus the drip accrued so far, and quorum recomputes.</p>' +
      '<div class="eyebrow fieldlab">You set this document up. Are you also in it?</div>' +
      '<div class="choice" role="radiogroup">' +
      '<div class="pick' + (iDraft() ? ' on' : '') + '"><button class="lanepick" aria-pressed="' + iDraft() + '" data-me="member">' +
      '<span class="dot"></span><span>A drafter, like everybody else</span></button>' +
      '<span class="exp">You get a wallet, you judge, you count towards quorum, and you answer the opening ceremony with the rest of the room.</span></div>' +
      '<div class="pick' + (iDraft() ? '' : ' on') + '"><button class="lanepick" aria-pressed="' + !iDraft() + '" data-me="observer">' +
      '<span class="dot"></span><span>Just the clerk</span></button>' +
      '<span class="exp">You set it up and keep it running, but the document is not yours to write: no wallet, no judgments, no place in quorum, and no answer at the ceremony.</span></div></div>' +
      '<div class="body"><div class="roster">' + S.roster.map((p, i) =>
        '<div class="rperson">' + avHtml(p) +
        '<span><span class="nm">' + esc(p.n) + (p.convenor ? ' <span class="chip convenor">convenor</span>' : '') +
        '</span><br><span class="em">' + esc(p.e) + '</span></span>' +
        '<button class="chip' + (p.in ? '' : ' pending') + '" data-role="' + i + '">' +
        (p.role === 'member' ? 'drafting' : 'watching') + (p.in ? '' : ' · invited') + '</button>' +
        (p.convenor ? '<span class="xdrop"> </span>' : '<button class="xdrop" data-drop="' + i + '">✕</button>') +
        '</div>').join('') +
      '<div class="addrow"><input type="email" placeholder="name@example.com" data-add="1">' +
      '<button class="btn" data-act="add">Invite</button></div></div></div>',
  };

  // ---- the band: the tab group, and the card it opens --------------------
  function renderBand() {
    band.className = 'setupband' + (S.open ? ' open' : '');
    let h = tabGroupHtml(LIVE(), ctx);
    if (S.open) {
      const c = card(S.open);
      // A card the room owns keeps its own body — choosing to hand it over is
      // the convenor's decision and stays editable — and grows a **watching**
      // half underneath, which is the whole of what the convenor can see of a
      // blind question while it runs.
      const body = BODY[c.k]() + (isRoom(c) && settled(c) ? '<div class="body">' + watchBody(c, ctx) + '</div>' : '');
      const foot = '<button class="btn" data-close="1">Close</button>' +
        '<button class="btn btn-approve glyphbtn"' + (ready(c) ? '' : ' disabled') +
        ' data-confirm="1" title="' + (ready(c) ? 'Confirm' : 'Not answered yet') + '">' + TICK + '</button>';
      h += cardHtml(c, ctx, body, foot);
    }
    band.innerHTML = h;
  }

  function refreshCommit() {
    const b = document.querySelector('[data-confirm]');
    if (b && S.open) b.disabled = !ready(card(S.open));
  }

  const render = () => {
    // the identity card and the roster are two views of one person, so the
    // convenor's row follows what the identity card says rather than holding a
    // second copy of it
    const row = meRow(); if (row) { row.n = S.myname; row.pic = S.mypic; }
    resolveCounts();
    renderTitle(); renderRail(); renderBand(); drawWire(wires, S.open);
  };

  // ---- wiring ------------------------------------------------------------
  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-tab], [data-card]');
    if (t) { const k = t.dataset.tab || t.dataset.card;
      S.open = (S.open === k) ? null : k; return render(); }
    if (ev.target.closest('[data-confirm]')) { S.seen.add(S.open); S.open = null; return render(); }
    if (ev.target.closest('button[data-close]')) { S.open = null; return render(); }
    const o = ev.target.closest('[data-set]');
    if (o) { const v = o.dataset.val;
      S[o.dataset.set] = (v === 'true') ? true : (v === 'false') ? false : v;
      if (perpetual() && S.shape === 'ramp') S.shape = 'fixed';
      return render(); }
    const pic = ev.target.closest('[data-pic]');
    if (pic) { S.mypic = pic.dataset.pic; return render(); }
    const m = ev.target.closest('[data-me]');
    if (m) { const row = meRow(); if (row) row.role = m.dataset.me; return render(); }
    const r = ev.target.closest('[data-role]');
    if (r) { const p = S.roster[+r.dataset.role];
      p.role = p.role === 'member' ? 'observer' : 'member'; return render(); }
    const d = ev.target.closest('[data-drop]');
    if (d) { S.roster.splice(+d.dataset.drop, 1); return render(); }
    if (ev.target.closest('[data-act="add"]')) {
      const f = document.querySelector('[data-add]');
      if (f && f.value.trim()) invite(f.value.trim());
      return render(); }
    if (ev.target.closest('[data-act="invite"]')) {
      const box = document.querySelector('[data-emails]');
      if (box) { box.value.split(/[\s,;]+/).filter((x) => x.includes('@')).forEach(invite); box.value = ''; }
      return render();
    }
  });
  function invite(em) {
    if (S.roster.some((p) => p.e === em)) return;
    S.roster.push({ n: em.split('@')[0].replace(/[._-]+/g, ' ').replace(/\b\w/g, (x) => x.toUpperCase()),
      e: em, role: 'member', in: false });
    setTimeout(() => { const p = S.roster.find((x) => x.e === em); if (p) { p.in = true; render(); } },
      1200 + Math.random() * 2600);
  }
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && S.open) { S.open = null; return render(); }
  });
  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.dataset.slug) { S.slug = t.value.trim().toLowerCase(); renderRail(); refreshCommit(); return; }
    if (t.dataset.txt === 'myname') { S.myname = t.value; renderRail(); refreshCommit(); return; }
    if (t.dataset.txt) { S[t.dataset.txt] = t.value; renderRail(); }
    if (t.dataset.num) { S[t.dataset.num] = +t.value; renderRail(); }
  });
  addEventListener('resize', () => drawWire(wires, S.open));
  addEventListener('scroll', () => drawWire(wires, S.open), true);

  relabel(); render();
})();
</script>
