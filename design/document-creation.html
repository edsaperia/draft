<meta charset="utf-8">
<title>Document creation</title>
<link rel="stylesheet" href="system.css">
<style>
/* ============================================================================
   document-creation — **the document, from its first minute** (Ed, 2026-08-17).

   Three notes built this, in order, and each one made the screen less of a form:

   1. *Something that looks like the document itself; the admin pastes the text
      into the space where it will later be edited, the ToC appears on cue, they
      click the placeholder title in the topbar, and the sidebar holds cards with
      each of the questions they need to decide.*
   2. *Can we import as much of the session-view as we can? I think ultimately
      this will literally be the session view.* — so it has no stylesheet of its
      own. It wears `system.css`, which is session-view's, lifted out for exactly
      this: two copies of one design system drift, and the housekeeping pass of
      the same day was mostly an inventory of what drifting had already cost
      inside a *single* file.
   3. *You can start inviting people immediately after creating the document …
      and as soon as you've confirmed the starting text they can start making
      proposals … and judgements unlock as soon as the ceremony is complete.*

   The third is the one that changed the model. There is **no "open the
   document" button**, because there is no moment when the document opens: it
   exists from the first second, the link works immediately, and capabilities
   arrive as their prerequisites are met. Reading needs nothing. Proposing needs
   a text to propose against. Judging needs the constitution, because a judgment
   is recorded under disclosure rules and counted towards a quorum, and neither
   of those can be settled after the fact.

   What is below is only what a setup screen needs and a live one does not.
   ========================================================================== */

  .navbar .brand.edit { padding: 2px var(--s2); margin-left: calc(var(--s2) * -1);
    border-radius: var(--r-sm); cursor: text; border: 1px solid transparent; min-width: 14ch; }
  .navbar .brand.edit:hover { background: var(--bg); border-color: var(--border); }
  .navbar .brand.edit:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; background: var(--bg); }
  .navbar .brand.edit.empty::before { content: attr(data-ph); color: var(--muted); font-weight: 400; }

  /* the paste-well: the empty state of the prose column, and nothing more */
  .prose.empty::before {
    content: "Paste the text this document starts from, or begin typing it.\A\A Markdown headings become its sections, and the contents appear beside you as you go.";
    white-space: pre-wrap; color: var(--muted); font-size: var(--t-body); line-height: 1.6;
  }

  /* ---- the share box: first in the rail, live from the first second ------ */
  .share { border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--s3);
    background: var(--light); margin-bottom: var(--s4); }
  .share .lab { font-size: var(--t-cap); color: var(--muted); margin-bottom: var(--s2); }
  .linkrow { display: flex; gap: var(--s1); margin-bottom: var(--s2); }
  .linkrow input { flex: 1; min-width: 0; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: var(--t-cap); border: 1px solid var(--border); border-radius: var(--r-sm);
    padding: var(--s1) var(--s2); background: var(--bg); color: var(--muted); }
  .share textarea { width: 100%; font: inherit; font-size: var(--t-cap); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: var(--s2); resize: vertical; min-height: 48px; }
  .share .btn { font: inherit; font-size: var(--t-cap); padding: var(--s1) var(--s2); cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); border-radius: var(--r-sm); }
  .share .btn:hover { background: var(--bg); border-color: var(--primary); color: var(--primary-emphasis); }
  .here { font-size: var(--t-cap); color: var(--muted); margin-top: var(--s2); display: flex;
    align-items: center; gap: var(--s1); flex-wrap: wrap; }
  .dotface { width: 20px; height: 20px; border-radius: 50%; background: var(--light);
    border: 1px solid var(--border); color: var(--muted); font-size: 8px; font-weight: 700;
    display: inline-grid; place-items: center; }
  .dotface.in { background: var(--primary-subtle); border-color: var(--primary); color: var(--primary-emphasis); }

  /* ---- what is unlocked, and what is waiting ----------------------------- */
  .stages { margin-bottom: var(--s4); }
  .stage { display: flex; align-items: baseline; gap: var(--s2); padding: 3px 10px;
    font-size: var(--t-small); }
  .stage .nm { font-weight: 600; }
  .stage .st { color: var(--muted); font-size: var(--t-cap); margin-left: auto; text-align: right; }
  .stage.live .nm { color: var(--ok); }
  .stage.live .st { color: var(--ok); }
  .stage .mkg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .stage.wait .mkg { visibility: hidden; }

  .queue .setmark { margin-left: auto; display: inline-flex; align-items: center; }
  .queue .setmark .mkg { width: 12px; height: 12px; fill: none; stroke: currentColor;
    stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .queue .qhead { font-size: var(--t-cap); color: var(--muted); margin: 0 0 var(--s2); padding: 0 10px; }

  /* **The modal is a decision card on a scrim** — the same object this surface
     already opens over a document, lifted off the page instead of into it. */
  .scrim { position: fixed; inset: 0; background: rgba(33, 37, 41, 0.28); z-index: 60;
    display: grid; place-items: center; padding: var(--s5); }
  .scrim .sugg { width: min(620px, 100%); max-height: 86vh; overflow-y: auto;
    box-shadow: var(--shadow-xl); margin: 0; }
  .scrim .sugg h2 { font-size: var(--t-lead); font-weight: 600; margin: var(--s1) 0; }
  .scrim .sugg .why { color: var(--muted); font-size: var(--t-small); margin: 0 0 var(--s5); max-width: 58ch; }
  .unlocks { font-size: var(--t-cap); color: var(--primary-emphasis); background: var(--primary-subtle);
    border-radius: var(--r-sm); padding: var(--s2) var(--s3); margin: 0 0 var(--s4); }

  .choice { display: flex; flex-direction: column; gap: var(--s2); }
  .opt { display: grid; grid-template-columns: 20px 1fr; gap: var(--s3); align-items: start;
    padding: var(--s3) var(--s4); border: 1px solid var(--border); border-radius: var(--r-lg);
    cursor: pointer; background: var(--bg); }
  .opt:hover { background: var(--light); }
  .opt.on { border-color: var(--primary); background: var(--primary-subtle); box-shadow: var(--shadow-sm); }
  .opt.on .dot { border-color: var(--primary); }
  .opt.on .dot::after { transform: scale(1); }
  .opt[aria-disabled="true"] { opacity: 0.42; cursor: default; }
  .dot { width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid var(--muted);
    margin-top: 3px; display: grid; place-items: center; }
  .dot::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--primary);
    transform: scale(0); transition: transform 120ms ease; }
  .opt .ttl { display: block; font-weight: 600; font-size: var(--t-ui); }
  .opt .exp { display: block; color: var(--muted); font-size: var(--t-small); margin-top: 2px; }
  .opt .inner { display: none; margin-top: var(--s3); }
  .opt.on .inner { display: block; }
  .setrow { display: flex; gap: var(--s3); align-items: baseline; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: var(--s1); }
  .field > label { font-size: var(--t-cap); color: var(--muted); }
  input { font: inherit; font-size: var(--t-ui); color: var(--fg); background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--s2) var(--s3); }
  input:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .num { width: 5.5rem; }
  .setnote { font-size: var(--t-cap); color: var(--muted); margin-top: var(--s3); }

  .roster { border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
  .rperson { display: grid; grid-template-columns: 30px 1fr auto auto; gap: var(--s3);
    align-items: center; padding: var(--s2) var(--s3); border-top: 1px solid var(--border); }
  .rperson:first-child { border-top: 0; }
  .rface { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff;
    font-size: var(--t-micro); font-weight: 700; display: grid; place-items: center; }
  .rperson .nm { font-size: var(--t-ui); }
  .rperson .em { font-size: var(--t-cap); color: var(--muted); }
  .chip { font-size: var(--t-cap); border: 1px solid var(--border); border-radius: 999px;
    padding: 2px var(--s2); color: var(--muted); background: var(--bg); cursor: pointer; font-family: inherit; }
  .chip.convenor { border-color: var(--primary); color: var(--primary-emphasis); background: var(--primary-subtle); cursor: default; }
  .chip.pending { border-style: dashed; }
  .xdrop { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 var(--s1); }
  .addrow { display: flex; gap: var(--s2); padding: var(--s3); background: var(--light); border-top: 1px solid var(--border); }
  .addrow input { flex: 1; }

  /* **A setup rail lays itself out, and pins** (Ed, 2026-08-17: *the ceremony
     and admin cards should be pinned*).

     Two halves. `system.css` positions `.qitem` **absolutely**, because in a
     live session `layoutQueue` places every entry against its own clause in
     the document; there is nothing to track here, so they go back into normal
     flow. And then the whole column is sticky — which is what pinning means
     for this set. It is the same rule the live rail follows and reaches the
     same answer from the other end: there, four kinds of entry pin because
     they are the things that are about *you* rather than about a clause. Here
     **every** card is one of those. A setup question belongs to no clause, so
     there is nowhere for it to scroll away to, and nothing on this screen may
     be missed by reading past it.

     Marked with a class rather than by loosening `.qitem`, so the live layout
     is untouched and the difference is visible in the markup. */
  .queue.stack { position: sticky; top: calc(var(--nav-h) + var(--s5)); align-self: start;
    max-height: calc(100vh - var(--nav-h) - var(--s5)); overflow-y: auto;
    scrollbar-width: none; -ms-overflow-style: none; }
  .queue.stack::-webkit-scrollbar { width: 0; }
  .queue.stack ul, .queue.stack > div { display: flex; flex-direction: column; gap: var(--s2); }
  .queue.stack .qitem { position: static; }
  /* the **subject** glyph: what this question is about. A live rail marks
     lifecycle state, because every card there is a different state of one
     kind of thing; a setup rail is the reverse — one state, many kinds — so
     it marks subject instead. The two sets never share a column. */
  .ql .subj { margin-right: var(--s1); font-size: 1.05em; line-height: 1; }
  /* the subject glyph, the name and the tick are three slots on one line */
  .queue.stack .ql { display: flex; align-items: baseline; gap: var(--s1); }
  .queue.stack .ql > span:nth-child(2) { flex: 1; min-width: 0; }
</style>

<header class="navbar">
  <div class="wrap">
    <p class="brand edit empty" id="title" contenteditable="plaintext-only" spellcheck="false"
       data-ph="Untitled document"></p>
    <div class="stats">
      <span id="stat-stage">reading only</span>
      <span id="stat-who">1 in the room</span>
      <button class="me" title="Wren Ashby — you, and the convenor of this document.">
        <span class="face" aria-hidden="true">WA</span>
      </button>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="layout">
    <nav class="toc"><ul id="toc"></ul></nav>
    <main><div class="doc" id="doc"><div class="prose empty" id="prose" contenteditable="true" spellcheck="false"></div></div></main>
    <aside class="queue stack"><div id="rail"></div></aside>
  </div>
</div>
<div id="modalroot"></div>

<script>
(function () {
  const TICK = '<svg class="mkg" viewBox="0 0 12 12"><path d="M2 6.4 L4.7 9.2 L10 2.9"/></svg>';
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const prose = document.getElementById('prose');
  const titleEl = document.getElementById('title');
  const rail = document.getElementById('rail');

  const S = {
    title: '',
    window: 'ends', endsAt: '2026-08-20T18:00',
    shape: 'roster', tStart: 55, tEnd: 78, tFixed: 66,
    quorumForm: 'roster', quorumPct: 33, quorumN: 5,
    disclosureBy: 'roster', economyBy: 'roster',
    authorship: 'anonymous', signing: 'nobody', judgments: 'never',
    grant: 4, drip: 1, dripPer: 10, cap: 8, stake: 1,
    chamber: 'roster', auditor: 'roster', auditorBudget: 6,
    roster: [{ n: 'Wren Ashby', e: 'wren@hollowoak.club', role: 'member', convenor: true, in: true }],
    // **Confirmed, not merely defaulted** (Ed, 2026-08-17: *"participants are
    // the default", but you should still have to open each card and confirm*).
    // Which separates two things a default was quietly conflating: what the
    // setting *is*, and whether anybody has looked at it. A default nobody read
    // is not a decision, and these are the decisions that cannot be changed once
    // people are drafting. So a card carries its value from the first render —
    // the rail is never a list of blanks — and stays yellow until it has been
    // opened and committed. The tick means *seen and agreed*, not *has a value*.
    seen: new Set(),
    open: null,
  };

  const members = () => S.roster.filter((p) => p.role === 'member');
  const E = () => members().length;
  const arrived = () => S.roster.filter((p) => p.in).length;
  const meRow = () => S.roster.find((p) => p.convenor);
  const iDraft = () => { const m = meRow(); return !!m && m.role === 'member'; };
  const quorumCount = () => (S.quorumForm === 'share'
    ? Math.max(1, Math.round(E() * S.quorumPct / 100)) : Math.min(S.quorumN, E()));
  const initials = (n) => n.split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
  const perpetual = () => S.window === 'perpetual';

  // ---- the document ------------------------------------------------------
  function relabel() {
    const sel = getSelection();
    const at = sel.rangeCount ? sel.getRangeAt(0).startContainer : null;
    for (const b of [...prose.children]) {
      const t = b.textContent;
      const m = t.match(/^(#{1,3})\s+/);
      if (m) {
        const liveHere = at && b.contains(at);
        b.textContent = t.slice(m[0].length);
        b.className = 'docline lvl' + m[1].length;
        b.dataset.h = b.textContent;
        if (liveHere && b.firstChild) {
          const r = document.createRange();
          r.setStart(b.firstChild, 0); r.collapse(true);
          sel.removeAllRanges(); sel.addRange(r);
        }
      } else if (b.className) { b.dataset.h = t; } else { delete b.dataset.h; }
    }
    prose.classList.toggle('empty', prose.textContent.trim() === '');
    renderToc(); renderRail();
  }
  function renderToc() {
    const hs = [...prose.children].filter((b) => b.dataset.h !== undefined);
    document.getElementById('toc').innerHTML = hs.map((b, i) => {
      b.id = 'h' + i;
      const lvl = (b.className.match(/lvl(\d)/) || [0, 2])[1];
      return '<li class="lvl' + lvl + '"><a href="#h' + i + '">' + esc(b.dataset.h) + '</a></li>';
    }).join('');
  }
  prose.addEventListener('paste', (ev) => {
    ev.preventDefault();
    const txt = (ev.clipboardData || window.clipboardData).getData('text');
    let lines = txt.split(/\n{2,}|\n/).filter((l) => l.trim());
    const first = lines[0] && lines[0].match(/^#\s+(.+)$/);
    if (first && !S.title) {
      titleEl.textContent = first[1]; S.title = first[1];
      titleEl.classList.remove('empty'); lines = lines.slice(1);
    }
    document.execCommand('insertHTML', false, lines.map((l) => '<div>' + esc(l) + '</div>').join(''));
    setTimeout(relabel, 0);
  });
  prose.addEventListener('input', relabel);
  titleEl.addEventListener('input', () => {
    S.title = titleEl.textContent.trim();
    titleEl.classList.toggle('empty', S.title === '');
    renderRail();
  });
  titleEl.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); titleEl.blur(); } });

  // ---- the settings ------------------------------------------------------
  const DELEG = { window: () => S.window === 'roster', bar: () => S.shape === 'roster',
    quorum: () => S.quorumForm === 'roster', disclosure: () => S.disclosureBy === 'roster',
    economy: () => S.economyBy === 'roster', chamber: () => S.chamber === 'roster',
    machines: () => S.auditor === 'roster' };
  const delegated = (k) => !!(DELEG[k] && DELEG[k]());

  const CARDS = [
    // **A document may start empty** (Ed, 2026-08-17), which is why this is not
    // a blocker on having content but on having *decided*. A roster writing a
    // charter from nothing is an ordinary case — arguably the purest one — and a
    // blank page is a legitimate answer to *what does this start from*. So the
    // card confirms either way, and says which was meant: a page nobody has
    // looked at and a page somebody chose to leave blank look identical, and
    // only one of them should let people start proposing.
    { k: 'text', g: '📄', t: 'The starting text', gate: 'propose',
      val: () => { const n = [...prose.children].filter((b) => b.textContent.trim()).length;
        return n ? n + ' blocks' : (S.seen.has('text') ? 'Starts empty — the room writes it' : 'Nothing yet'); },
      ready: () => true },
    { k: 'title', g: '🏷️', t: 'The title', val: () => S.title || 'Not named yet', ready: () => !!S.title },
    { k: 'window', g: '📅', t: 'The window',
      val: () => (S.window === 'perpetual' ? 'Perpetual'
        : 'Ends ' + new Date(S.endsAt).toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit' })),
      ready: () => true },
    { k: 'roster', g: '✉️', t: 'The roster',
      val: () => E() + ' drafting, ' + (S.roster.length - E()) + ' watching' + (iDraft() ? '' : ' — you are the clerk'),
      ready: () => E() >= 2 },
    { k: 'bar', g: '✒️', t: 'The bar', gate: 'judge',
      val: () => (S.shape === 'fixed' ? 'Fixed at ' + S.tFixed + '%' : 'Rising, ' + S.tStart + '% → ' + S.tEnd + '%'),
      ready: () => true },
    { k: 'quorum', g: '👥', t: 'Quorum', gate: 'judge',
      val: () => (S.quorumForm === 'count' ? Math.min(S.quorumN, E()) + ' of ' + E()
        : S.quorumPct + '% — ' + quorumCount() + ' of ' + E()), ready: () => true },
    { k: 'disclosure', g: '👤', t: 'Who may be seen', gate: 'judge',
      val: () => ({ anonymous: 'Nobody’s name, ever', sealed: 'Names at the close', public: 'Names from the start' }[S.authorship]),
      ready: () => true },
    { k: 'economy', g: '🪙', t: 'The edit economy',
      val: () => S.grant + ' to start, ' + S.drip + ' back per ' + (perpetual() ? S.dripPer + 'h' : S.dripPer + '%'),
      ready: () => true },
    { k: 'chamber', g: '🔭', t: 'Who else can see it',
      val: () => ({ link: 'Anyone with the link', closed: 'Roster only', public: 'Public' }[S.chamber] || 'Anyone with the link'),
      ready: () => true },
    { k: 'machines', g: '🤖', t: 'Machine participants',
      val: () => (S.auditor === true ? 'The coherence auditor, ' + S.auditorBudget + ' edits' : 'People only'),
      ready: () => true },
  ];
  const settled = (c) => S.seen.has(c.k) && c.ready();
  const card = (k) => CARDS.find((c) => c.k === k);

  // **What is unlocked, and by what.** Reading needs nothing at all — the link
  // works from the first second. Proposing needs a text to propose against, and
  // nothing else: you do not have to know the constitution to say what a clause
  // should say. Judging needs the constitution settled, and that is not
  // bureaucracy — a judgment is *recorded under a disclosure setting* and
  // *counted towards a quorum*, and neither of those can be decided after the
  // judgment has been made without changing what the judgment was.
  const canPropose = () => settled(card('text'));
  const ceremonyCards = () => CARDS.filter((c) => c.gate === 'judge');
  const ceremonyDone = () => ceremonyCards().every(settled) && !ceremonyCards().some((c) => delegated(c.k));
  const ceremonyRunning = () => ceremonyCards().some((c) => delegated(c.k)) && ceremonyCards().every(settled);
  const canJudge = () => ceremonyDone();

  // ---- the rail ----------------------------------------------------------
  function renderRail() {
    const outstanding = CARDS.filter((c) => !settled(c));
    const stage = (nm, on, note) =>
      '<div class="stage ' + (on ? 'live' : 'wait') + '"><span class="nm">' + nm + '</span>' + TICK +
      '<span class="st">' + note + '</span></div>';

    rail.innerHTML =
      // the share box comes first, because it is live first
      '<div class="share">' +
      '<div class="lab">Anyone with this link can open the document now.</div>' +
      '<div class="linkrow"><input readonly value="draft.to/hollow-oak-4f2a"><button class="btn" data-act="copy">Copy</button></div>' +
      '<textarea placeholder="…or paste addresses here, one per line" data-emails="1"></textarea>' +
      '<div style="margin-top:var(--s2)"><button class="btn" data-act="invite">Send invitations</button></div>' +
      '<div class="here">' + S.roster.map((p) =>
        '<span class="dotface' + (p.in ? ' in' : '') + '" title="' + esc(p.n) + (p.in ? ' — here' : ' — invited, not opened it yet') + '">' +
        initials(p.n) + '</span>').join('') +
      '<span>' + arrived() + ' of ' + S.roster.length + ' have opened it</span></div></div>' +

      '<div class="stages">' +
      stage('Reading', true, 'live') +
      stage('Proposing', canPropose(), canPropose() ? 'live' : 'waiting on the starting text') +
      stage('Judging', canJudge(), canJudge() ? 'live'
        : ceremonyRunning() ? 'waiting on the opening ceremony' : 'waiting on the constitution') +
      '</div>' +

      '<ul>' +
      '<li class="qhead">' + (outstanding.length ? outstanding.length + ' still to confirm' : 'All confirmed') + '</li>' +
      CARDS.map((c) => {
        const done = settled(c);
        const col = done ? 'rgba(var(--lc-closed), 0.16)' : 'rgba(var(--lc-open), 0.22)';
        const bg = done ? 'rgba(var(--lc-closed), 0.06)' : 'rgba(var(--lc-open), 0.06)';
        return '<li class="qitem" data-q="' + c.k + '">' +
          '<button class="' + (done ? 'deciding' : 'needs') + '" data-card="' + c.k + '"' +
          ' style="--washcol: ' + col + '; --washbg: ' + bg + '; --fill: 100%">' +
          '<span class="ql"><span class="subj" aria-hidden="true">' + c.g + '</span>' +
          '<span>' + c.t + '</span><span class="setmark">' + (done ? TICK : '') + '</span></span>' +
          '<span class="qwhy">' + (delegated(c.k) ? '<i>The participants decide</i>' : esc(c.val())) + '</span>' +
          '</button></li>';
      }).join('') + '</ul>';

    document.getElementById('stat-stage').textContent =
      canJudge() ? 'open' : canPropose() ? 'proposals open' : 'reading only';
    document.getElementById('stat-who').textContent = arrived() + ' in the room';
  }

  // ---- the modal ---------------------------------------------------------
  const opt = (key, val, ttl, exp, inner, off) =>
    '<div class="opt' + (S[key] === val ? ' on' : '') + '"' +
    (off ? ' aria-disabled="true"' : ' data-set="' + key + '" data-val="' + val + '" role="radio" tabindex="0"' +
      ' aria-checked="' + (S[key] === val) + '"') + '>' +
    '<span class="dot"></span><span><span class="ttl">' + ttl + '</span>' +
    (exp ? '<span class="exp">' + exp + '</span>' : '') +
    (inner ? '<span class="inner">' + inner + '</span>' : '') + '</span></div>';

  const num = (key, label, min, max, suffix) =>
    '<span class="field"><label>' + label + '</label><span class="setrow">' +
    '<input class="num" type="number" data-num="' + key + '" value="' + S[key] + '" min="' + min + '" max="' + max + '">' +
    (suffix ? '<span class="setnote" style="margin:0">' + suffix + '</span>' : '') + '</span></span>';

  const theyDecide = (key, val, note) => opt(key, val, 'The participants decide',
    'Asked at the opening ceremony, blind — you among them, if you are on the roster. ' +
    (note || 'Each states the least they will accept and the document takes the most demanding answer, so nothing is imposed on anybody.'));

  const BODY = {
    text: () => '<h2>The starting text</h2>' +
      '<div class="unlocks">Confirming this lets everyone start <b>proposing</b>. They will not be able to judge until the constitution is settled.</div>' +
      '<p class="why">Paste it into the page behind this card — the same column it will be edited in once drafting begins. Lines starting with #, ## or ### become sections, and the contents appear on the left as you go.</p>' +
      '<p class="setnote"><b>Or leave it blank.</b> A roster writing something from nothing is an ordinary way to begin, and an empty page is a real answer to this question — confirm with the document empty and the room starts from a blank sheet. What this card is really asking is not whether there is text, but whether you have decided.</p>',
    title: () => '<h2>The title</h2><p class="why">Click it in the bar at the top — the same place members read it.</p>' +
      '<p class="setnote">Currently: <b>' + (esc(S.title) || 'untitled') + '</b></p>',
    window: () => '<h2>The window</h2><p class="why">Whether this document has an ending. Fixed once people are drafting, like everything else here.</p>' +
      '<div class="choice" role="radiogroup">' +
      opt('window', 'ends', 'It ends at a set time', 'Buys a closing ceremony, a drip paced against the window, and a record cut at a known moment.',
        '<span class="field"><label>Ends</label><input type="datetime-local" data-txt="endsAt" value="' + S.endsAt + '"></span>') +
      opt('window', 'perpetual', 'Perpetual', 'The drip runs against real time and never resets, and the document ends by <b>freeze</b> — when too few members are still active, the roster ends it rather than the calendar (§9.5).') +
      theyDecide('window', 'roster', 'For a window that means the <b>latest</b> ending anybody asks for, so nobody is cut off before they were ready.') +
      '</div><p class="setnote">Along with the roster, this is usually the convenor’s to set — somebody has to say when everyone is free.</p>',
    bar: () => '<h2>The bar</h2>' +
      '<div class="unlocks">Part of the constitution — judging waits on this and the two below it.</div>' +
      '<p class="why">How sure the room has to be that a change beats the current text. Never a vote share — a confidence.</p>' +
      '<div class="choice" role="radiogroup">' +
      opt('shape', 'ramp', 'Rising', 'Starts low and rises to the close, because the bar should track irreversibility: an early adoption can still be challenged, a late one is permanent.',
        '<span class="setrow">' + num('tStart', 'At the opening', 50, 99, '%') + num('tEnd', 'At the close', 50, 99, '%') + '</span>', perpetual()) +
      opt('shape', 'fixed', 'Fixed', 'One bar for the life of the document.',
        '<span class="setrow">' + num('tFixed', 'The bar', 50, 99, '%') + '</span>') +
      theyDecide('shape', 'roster', 'Each states the <b>lowest bar</b> they will accept and the document takes the highest — so it will never be easier to change than any one of you wanted.') +
      '</div>' + (perpetual() ? '<p class="setnote">A rising bar needs an endpoint to rise towards, so a perpetual document holds its bar fixed.</p>' : ''),
    quorum: () => '<h2>Quorum</h2>' +
      '<div class="unlocks">Part of the constitution — judging waits on it.</div>' +
      '<p class="why">How many distinct members must weigh in before a question can be adopted. A question short of quorum simply waits — silence is never counted as a vote.</p>' +
      '<div class="choice" role="radiogroup">' +
      opt('quorumForm', 'share', 'A share of the roster', 'Suits a document with a window, where the roster is stable.',
        '<span class="setrow">' + num('quorumPct', 'Share', 1, 100, '% — ' + quorumCount() + ' of ' + E() + ' today') + '</span>') +
      opt('quorumForm', 'count', 'A fixed number', 'Suits a perpetual document, where a drifting roster would otherwise silently re-rate every parked race.',
        '<span class="setrow">' + num('quorumN', 'Members', 1, 40, 'of ' + E()) + '</span>') +
      theyDecide('quorumForm', 'roster', 'Each states the <b>lowest quorum</b> they will accept and the document takes the highest.') +
      '</div>',
    disclosure: () => '<h2>Who may be seen</h2>' +
      '<div class="unlocks">Part of the constitution — judging waits on it, because a judgment is recorded under whatever this says.</div>' +
      '<p class="why">Rationales are always visible whatever is chosen. What varies is only whether a name is attached to one.</p>' +
      '<div class="choice" role="radiogroup" style="margin-bottom:var(--s5)">' +
      theyDecide('disclosureBy', 'roster', 'Here the rule runs the other way and takes the <b>most private</b> answer, so one person who wants to stay unnamed keeps the whole document unnamed. That is what makes anonymity structural rather than merely the default.') +
      opt('disclosureBy', 'convenor', 'I set them', 'Note the cost: anonymity becomes a default like any other, and members can be named without having agreed to it.') +
      '</div>' + (S.disclosureBy !== 'convenor' ? '' :
        '<div class="eyebrow" style="margin-bottom:var(--s2)">Candidate authorship</div><div class="choice" role="radiogroup" style="margin-bottom:var(--s5)">' +
        opt('authorship', 'anonymous', 'Anonymous', 'Never revealed, not even in the record.') +
        opt('authorship', 'sealed', 'Sealed', 'Hidden while live; revealed at the close.') +
        opt('authorship', 'public', 'Public', 'Visible from the moment a proposal is made.') +
        '</div><div class="eyebrow" style="margin-bottom:var(--s2)">Who may sign</div><div class="choice" role="radiogroup" style="margin-bottom:var(--s5)">' +
        opt('signing', 'nobody', 'Nobody signs', 'The only setting under which an unsigned proposal says nothing about its author.') +
        opt('signing', 'each', 'Each author chooses', 'In a small roster, an unsigned candidate among signed ones says something.') +
        opt('signing', 'everybody', 'Everybody signs') +
        '</div><div class="eyebrow" style="margin-bottom:var(--s2)">Judgments</div><div class="choice" role="radiogroup">' +
        opt('judgments', 'never', 'Never revealed') +
        opt('judgments', 'after', 'Revealed after the decision they contributed to', 'Never live — blind judgment while it is being collected is what keeps the measurement honest.') +
        '</div>'),
    economy: () => '<h2>The edit economy</h2><p class="why">Proposing costs an edit. Members see these numbers in their wallets from the first minute, so a document meant to move quickly and one meant to be hard to change want different answers.</p>' +
      '<div class="choice" role="radiogroup" style="margin-bottom:var(--s5)">' +
      theyDecide('economyBy', 'roster', 'Each states the <b>fewest edits</b> they would accept being given, and the document takes the most generous answer. Until the ceremony settles it, everyone drafts on the standard grant.') +
      opt('economyBy', 'convenor', 'I set them') + '</div>' +
      (S.economyBy !== 'convenor' ? '' :
        '<div class="setrow">' + num('grant', 'To start with', 0, 40) + num('drip', 'Returned', 0, 10) +
        num('dripPer', perpetual() ? 'every N hours' : 'per N% of window', 1, 100) +
        num('cap', 'Never more than', 1, 99) + num('stake', 'Staked per proposal', 0, 10) + '</div>' +
        '<p class="setnote">A stake comes back in full if you withdraw, and in proportion to how well the proposal did if it does not carry (§7).</p>'),
    chamber: () => '<h2>Who else can see it</h2><div class="choice" role="radiogroup">' +
      opt('chamber', 'link', 'Anyone with the link', 'The chamber view only: adoptions as they land, the rolling log hash, which races are stuck. Live standings are never visible to anybody.') +
      opt('chamber', 'closed', 'Roster only') + opt('chamber', 'public', 'Public', 'Listed and readable by anyone.') +
      theyDecide('chamber', 'roster', 'A privacy question, so the <b>most private</b> answer wins: one member who wants the room closed closes it.') + '</div>',
    machines: () => '<h2>Machine participants</h2><p class="why">A machine member holds a token budget like anybody else and competes on the same terms.</p>' +
      '<div class="choice" role="radiogroup">' +
      opt('auditor', true, 'Include the coherence auditor', 'Patrols the document for drift — a definition changed in one place and not another — and proposes fixes.',
        '<span class="setrow">' + num('auditorBudget', 'Its edit budget', 0, 40) + '</span>') +
      opt('auditor', false, 'People only') +
      theyDecide('auditor', 'roster', 'The <b>most restrictive</b> answer wins, so a single member who would rather not draft alongside a machine keeps it out.') + '</div>',
    roster: () => '<h2>The roster</h2><p class="why">Everyone here gets a link by email — there are no passwords. You can keep adding people after this; a joiner gets the base grant plus the drip accrued so far, and quorum recomputes.</p>' +
      '<div class="eyebrow" style="margin-bottom:var(--s2)">You set this document up. Are you also in it?</div>' +
      '<div class="choice" role="radiogroup" style="margin-bottom:var(--s5)">' +
      '<div class="opt' + (iDraft() ? ' on' : '') + '" data-me="member" role="radio" tabindex="0" aria-checked="' + iDraft() + '">' +
      '<span class="dot"></span><span><span class="ttl">A drafter, like everybody else</span>' +
      '<span class="exp">You get a wallet, you judge, you count towards quorum, and you answer the opening ceremony with the rest of the room.</span></span></div>' +
      '<div class="opt' + (iDraft() ? '' : ' on') + '" data-me="observer" role="radio" tabindex="0" aria-checked="' + !iDraft() + '">' +
      '<span class="dot"></span><span><span class="ttl">Just the clerk</span>' +
      '<span class="exp">You set it up and keep it running, but the document is not yours to write: no wallet, no judgments, no place in quorum, and no answer at the ceremony.</span></span></div></div>' +
      '<div class="roster">' + S.roster.map((p, i) =>
        '<div class="rperson"><span class="rface">' + initials(p.n) + '</span>' +
        '<span><span class="nm">' + esc(p.n) + (p.convenor ? ' <span class="chip convenor">convenor</span>' : '') +
        '</span><br><span class="em">' + esc(p.e) + '</span></span>' +
        '<button class="chip' + (p.in ? '' : ' pending') + '" data-role="' + i + '">' +
        (p.role === 'member' ? 'drafting' : 'watching') + (p.in ? '' : ' · invited') + '</button>' +
        (p.convenor ? '<span class="xdrop"> </span>' : '<button class="xdrop" data-drop="' + i + '">✕</button>') +
        '</div>').join('') +
      '<div class="addrow"><input type="email" placeholder="name@example.com" data-add="1">' +
      '<button class="btn" data-act="add">Invite</button></div></div>',
  };

  function renderModal() {
    const root = document.getElementById('modalroot');
    if (!S.open) { root.innerHTML = ''; return; }
    const c = card(S.open);
    root.innerHTML = '<div class="scrim" data-close="1"><div class="sugg quick-open" role="dialog" aria-modal="true">' +
      BODY[S.open]() +
      '<div class="race-mid commitrow">' +
      '<button class="btn" data-close="1">Cancel</button>' +
      '<button class="btn btn-approve glyphbtn"' + (c.ready() ? '' : ' disabled') +
      ' data-confirm="1" title="' + (c.ready() ? 'Confirm' : 'Not answered yet') + '">' + TICK + '</button>' +
      '</div></div></div>';
  }

  const render = () => { renderRail(); renderModal(); };

  // ---- wiring ------------------------------------------------------------
  document.addEventListener('click', (ev) => {
    const c = ev.target.closest('[data-card]');
    if (c) { S.open = c.dataset.card; return render(); }
    if (ev.target.closest('[data-confirm]')) { S.seen.add(S.open); S.open = null; return render(); }
    // **Only the scrim itself closes, and only a button that says so.**
    // `data-close` sits on the scrim, and the scrim is an ancestor of every
    // control in the card — so `closest('[data-close]')` matched on *every*
    // click inside the modal and shut it before the option it had just set
    // could be seen. It looked like the radios were not working; they were
    // working and then being thrown away. Tested last, and against the target
    // rather than its ancestry.
    if (ev.target.closest('button[data-close]') || ev.target.classList.contains('scrim')) {
      S.open = null; return render(); }
    const o = ev.target.closest('[data-set]');
    if (o) { const v = o.dataset.val;
      S[o.dataset.set] = (v === 'true') ? true : (v === 'false') ? false : v;
      if (perpetual() && S.shape === 'ramp') S.shape = 'fixed';
      return render(); }
    const me = ev.target.closest('[data-me]');
    if (me) { const m = meRow(); if (m) m.role = me.dataset.me; return render(); }
    const r = ev.target.closest('[data-role]');
    if (r) { const p = S.roster[+r.dataset.role];
      p.role = p.role === 'member' ? 'observer' : 'member'; return render(); }
    const d = ev.target.closest('[data-drop]');
    if (d) { S.roster.splice(+d.dataset.drop, 1); return render(); }
    const add = ev.target.closest('[data-act="add"]');
    if (add) { const f = document.querySelector('[data-add]');
      if (f && f.value.trim()) invite(f.value.trim());
      return render(); }
    if (ev.target.closest('[data-act="invite"]')) {
      const box = document.querySelector('[data-emails]');
      if (box) { box.value.split(/[\s,;]+/).filter((x) => x.includes('@')).forEach(invite); box.value = ''; }
      return render();
    }
  });
  function invite(em) {
    if (S.roster.some((p) => p.e === em)) return;
    S.roster.push({ n: em.split('@')[0].replace(/[._-]+/g, ' ').replace(/\b\w/g, (x) => x.toUpperCase()),
      e: em, role: 'member', in: false });
    // people arrive on their own time; the mockup lets a couple wander in so the
    // "who is here" row is not permanently a list of nobody
    setTimeout(() => { const p = S.roster.find((x) => x.e === em); if (p) { p.in = true; render(); } },
      1200 + Math.random() * 2600);
  }
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && S.open) { S.open = null; return render(); }
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    const o = ev.target.closest('[data-set], [data-me]');
    if (o) { ev.preventDefault(); o.click(); }
  });
  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.dataset.txt) { S[t.dataset.txt] = t.value; renderRail(); }
    if (t.dataset.num) { S[t.dataset.num] = +t.value; renderRail(); }
  });

  relabel(); render();
})();
</script>
