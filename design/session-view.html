    policy: () => { const v = takenValOf('policy');
      return ({ invite: 'Membership is by invitation only.',
        proposed: 'Anyone may apply, but nothing happens until a member takes the application up and proposes it ✏️.',
        apply: 'Anyone may apply to join.',
        open: 'Anyone with the link joins on arrival.' })[v ? v.joinPolicy : S.joinBy]; },
    slug: () => 'The document lives at docs.vote/' + S.slug + '.',
    removal: () => ({
      everyone: 'Removing a member needs every member to agree, including them.',
      others: 'Removing a member needs every other member to agree — they see the proposal, and it is decided without them.',
      ordinary: 'A member is removed by a proposal ✏️, judged like any other change.',
    })[removalRung()],
    invite: () => 'Anyone may be proposed as a new member, and every member has to agree — one refusal keeps them out.',
    // the ❌ door states whatever route the 🥾 setting decides (Q401)
    remove: () => ({
      everyone: 'A member may be proposed for removal, and every member has to agree — including them.',
      others: 'A member may be proposed for removal, and every other member has to agree.',
      ordinary: 'A member may be proposed for removal — a proposal ✏️ like any other.',
    })[removalRung()],
    text: () => { const n = [...prose.children].filter((b) => b.textContent.trim()).length;
      return n ? 'The document starts from ' + n + ' blocks of text.'
        : 'The document starts empty — the members write it.'; },
  };
  // 404 (Ed, 2026-08-19): the preamble states the defaults once; a clause
  // states only its deviations, in 396c's precise third person. Delegated
  // ⇒ silence — the defaults are the whole of the rule.
  // The first Membership question. Until one is decided the document has no
  // membership to speak of, so no clause says what decisions from one take
  // (Ed, 2026-08-21) — which is also what keeps the birth's first sentences
  // to the one fact that is true at the birth: the founder holds this.
  const membershipDecided = () =>
    ['hat', 'roster', 'policy', 'lapse', 'removal'].some((k) => settled(card(k)));
  const holderLine = (k) => {
    if (!PW_KEYS.includes(k)) return '';
    // at the birth the founder holds everything by construction — there is no
    // module yet, and nobody else to hold anything
    if (!cs) return ' ' + founderMay([pwPhrase(k, 'u')]);
    const st = pwState(k);
    if (!st || st.holder === 'members') return '';
    const p = st.powers;
    // one sentence, joining whichever powers the Founder actually holds
    const parts = [];
    if (p.unilateral) parts.push(pwPhrase(k, 'u'));
    if (p.assent && membershipDecided()) parts.push(pwPhrase(k, 'a'));
    return parts.length ? ' ' + founderMay(parts) : '';
  };
  // **Links in the constitution are real links** (Ed, 2026-08-19):
  // underlined, ink-coloured (.doclink), applied after escaping so a
  // sentence can never smuggle markup in
  const linkify = (s) => String(s).replace(/\bdocs\.vote\/[a-z0-9][a-z0-9-]*/g,
    (m2) => '<a class="doclink" href="https://' + m2 + '" target="_blank" rel="noopener">' + m2 + '</a>');
  const decisionLine = (c) => {
    // a grant's paragraph states the document's rule (third person, the same
    // for every reader); the card that opens on it is yours
    // 🍾's clause is the Proposals preamble (Ed, 2026-08-22): the tab hangs
    // on the sentence the press makes true, and the moment itself stays on the
    // Founded line, which carried it already
    if (c.isBegin) return preambleText();
    if (c.isClosing) return 'The document closed' + closedAtWords() + '. ' +
      (closeSignatures().length === 0 ? 'Nobody has signed it yet.'
        : closeSignatures().length + (closeSignatures().length === 1 ? ' member has' : ' members have') + ' signed it.');
    if (c.k === 'grant-voice') return 'Each member holds one voice in every constitutional question.';
    // ✒️ and 🛡️ write no sentence (Q639 (a), Ed 2026-08-22). They used to
    // state a count — *The Founder holds the pen on 16 settings.* — which
    // `holderLine` already says on every setting the power turns, and which
    // the wallet's own tooltip already says in the second person. Their tabs
    // now stand on the Founded line and that sentence is their clause, so
    // neither this function nor `para` is ever called with them; `headFor`
    // returns null and `ctx.clauseFor` supplies the head.
    if (c.ansFor) return answered(c)
      ? 'The Founder has answered as a member.'
      : 'The Founder has not yet answered as a member.';
    if (c.k === 'canpropose') { const done = !LIVE().some(owesAnswer);
      return canPropose()
      ? (done ? 'Members may propose as soon as they arrive.'
        // a delegated ordinary question may still be collecting after the
        // start (🍾 waits only on the judge-gate ones), and the module keeps
        // a member who owes it an answer from proposing until they give it
        : 'Members may propose once they have answered the questions the Founder delegated.')
      // proposing opens at the start (§9.0b, Q606): the blocker is 🍾, and the
      // text — which used to be named here — is decided as part of the start
      : 'Members may begin proposing when the document begins.'; }
    if (c.k === 'canjudge') return canJudge()
      ? 'Members may judge proposals.'
      : 'Members may begin judging proposals when the whole constitution has been decided.';
    // **The birth is its own phase** (Ed, 2026-08-21). Before the save the
    // band is writing a constitution, whose sentences are third person, and
    // 📧 stands in the opening run beside the title and the link — there is
    // no Membership yet for it to belong to. After the save the same card
    // lives on your own member row, where the members list's sanctioned
    // "you" is the right voice.
    // Before the mail goes out the clause is **blank** (Ed, 2026-08-21): the
    // 📧 tab simply stands where its sentence will appear, the way an
    // `insert-anchor` is a held-open gap with its mark beside it. Nothing
    // has been decided, and a document does not narrate that somebody is
    // about to type.
    if (c.k === 'myemail') return !cs
      ? (S.emailSent ? 'The Founder is checking their email for a link.' : '')
      : S.emailVerified ? 'Your address is verified.'
      : S.emailSent ? 'Your address is awaiting verification.'
      : 'Your address is not yet given.';
    if (c.kind === 'personal') return summary(c);
    if (isRoom(c)) {
      const st = csState(c.k);
      const collecting = st ? st.collecting : !((c.in || 0) >= E() && E() > 0);
      return !collecting && (!st || st.value !== null)
        ? (DECIDED[c.k] ? DECIDED[c.k]() : value(c)) + holderLine(c.k)
        // while the founder is the only person the document knows about, an
        // answer count would be counting the founder alone (pacing pass,
        // 2026-08-19) — the honest tail is that the question waits for a room
        // **The interim visibility rule is stated** (Q618 (a), 2026-08-22): before
        // 🌍 is settled a document is members-only, so the 🌍 clause says so
        // rather than only who is deciding — a stranger reading the door is
        // reading this rule, and the by-deviation grammar would otherwise leave
        // them reading a rule the members cannot see
        : (c.k === 'chamber'
          ? 'Until the members decide, only members can see the document — '
          : 'The Founder has delegated to members to decide ' + (WHAT[c.k] || 'this') + ' — ') +
          (isStranger() ? 'the members are answering.'
            : roomExists() ? Math.min(c.in || 0, E()) + ' of ' + E() + ' have answered.'
            : 'waiting for members.');
    }
    return settled(c) ? (DECIDED[c.k] ? DECIDED[c.k]() : value(c)) + holderLine(c.k)
      // the same interim rule while the Founder holds 🌍 undecided (Q618 (a))
      : c.k === 'chamber' ? 'Until the Founder decides, only members can see the document.'
      : 'The Founder is deciding ' + (WHAT[c.k] || 'this') + '.';
  };

  const ctx = {
    get open() { return S.open; }, get E() { return E(); },
    // a setup entry's wash alpha rides the charter's urgency ramp (Q623 (a)):
    // the urgency is the rail's own `RAIL_U`, so the two columns agree
    urgencyOf: (c) => RAIL_U[stateOf(c, ctx)],
    // a clause that is a thing rather than a sentence: the membership list,
    // and — since Q639 — the Founded line the two grants hang their tabs on
    clauseFor: (c) => (c.k === 'roster' ? rosterClause()
      : onFoundedLine(c) ? foundedClause() : ''),
    // the title card's head is the document title itself — the clause,
    // opened — never the word “Title” (Ed, 2026-08-18)
    inDocOpenSlot: false,
    headFor: (c) => {
      if (c.power) return esc(powerHeadLine(c));
      // post-save the title card opens at its own clause, so its head is
      // the clause sentence (the headdoct span stays: refreshCommit types
      // into it live); at the birth it is still the big heading itself
      if (c.k === 'title') return (cs ? 'The document is titled ' + LD : '') +
        '<span class="headdoct' + (S.title ? '' : ' ph') + '">' +
        esc(S.title) + '</span>' + (cs ? RD + '.' : '');
      const m = motionOn(c);
      // an ordinary motion's head is the value as it stands, wearing the

      if (m) return routeOfM(m, c) === 'ordinary' ? esc(standsOf(c.k)) : null;
      // **The head is the rule, not the task's name** (Ed's QA, 2026-08-19):
      // a settled card is its own paragraph, opened, so what stands at its
      // head is the constitutional sentence the paragraph states. The
      // exceptions are cards whose clause is a thing rather than a sentence
      // — the membership (the list), the starting text (the document
      // itself), and since Q639 the two grants, whose clause is the Founded
      // line they hang their tabs on — and open questions, which their title
      // names better than a rule that does not exist yet.
      if (c.k === 'text' || c.k === 'roster' || onFoundedLine(c)) return null;
      if (c.isGate) return linkify(esc(decisionLine(c)));
      if (c.ansFor || c.kind === 'personal') return null;
      if (settled(c)) return linkify(esc(decisionLine(c)));
      if (composerOn(c)) return esc(standsOf(c.k));
      return null;
    },
    // reserved = held by the founder: the room may pass a change, and it
    // then goes to the founder as a 👑 question (accept or reject)
    reserved: (c) => !c.power && !c.isGate && !c.ansFor && c.kind !== 'personal' && !membersHold(c),
    // a section never folds while it holds the open card or its tasks
    foldedSec: (sec) => S.folded.has('cs-' + sec.key) &&
      !sec.cards.some((c) => S.open === c.k ||
        (tasksFor(c) || []).some((t2) => S.open === t2.k)),
    secToggle: (sec) => secToggleHtml('cs-' + sec.key),
    // the whole constitution folds under its own heading (Ed, 2026-08-19);
    // never while any card is open — a fold must not swallow the open card
    foldedGroup: () => S.folded.has('cs-constitution') && !S.open,
    groupToggle: () => secToggleHtml('cs-constitution'),
    // power tabs (403): synthetic cards — never asks, never tasks; their
    // decision line is the power's own rule sentence
    mustAct: (c) => (c.power ? false : mustAct(c)),
    waiting: (c) => (c.power ? false : waiting(c)),
    news: (c) => (c.power ? false : news(c)),
    tasksFor: (c) => (c.power ? [] : tasksFor(c)),
    // esc before linkify, like the head path (review #1, finding 20): the
    // sentence carries the title, which is member text — unescaped it was
    // stored XSS into the constitution paragraph
    decisionLine: (c) => linkify(esc(c.power ? powerHeadLine(c) : decisionLine(c))),
    // 🪜 has no paragraph of its own (Q512): the ramp is part of what the
    // threshold says, so its tab stands in 🌡️'s stack and opening it opens
    // at 🌡️'s own clause — which is also where its rail entry anchors,
    // since anchorOf falls back to the tab's paragraph.
    chipsFor: (c) => {
      const k = c.k === 'pace' ? 'bar' : c.k;
      if (c.power || c.ansFor) return [c];
      const base = (k === 'bar' && card('pace') && visible(card('pace')))
        ? [card('bar'), card('pace')] : [card(k)];

        ? base.concat([card('pw:u:' + k), card('pw:a:' + k)]) : base;
    },
    // **The lockline tells the truth about who set it** (Q510(a), Ed
    // 2026-08-21). It had said *Set by the founder when the document was
    // made* on every rule, including the ones the room decided by consent —
    // half-corrected on this surface by the watching half underneath, and
    // not corrected at all at the stranger's door, which is what forced it
    // there first. The *when* survives where it is true.
    lockline: (c) => { const st = csState(c.k);
      return st && st.settledBy && st.settledBy !== 'convenor'
        ? 'Decided by the members.'
        : 'Set by the founder when the document was made.'; },
    summary, value, isRoom,
  };

  // ---- the rail ----------------------------------------------------------
  // Grouped by pile and in pile order, so the two columns agree and nothing
  // jumps when you confirm something (Q320). Your own pile first: on this
  // screen that is the founder's, on the ceremony it is the members'.
  // ---- the setup tasks as session entries (stage 8) ----------------------
  // railEntry's markup, unchanged, wearing session.js's wash attributes so it
  // fades between colours like every other entry; and the margin-index meta
  // the layout needs: where it stands, whether it pins, how it ranks.
  // ask pins (it is the question you are being asked), news pins (a decision
  // you are owed), yours pins and is force-kept (a proposal of your own);
  // wait flows beside its paragraph. Ranks follow the tab stack's order
  // (urgent · … · adopted · … · propose · deciding); u is judgment leverage.
  let railEntries = [];
  const RAIL_RANK = { ask: 0, news: 4, yours: 6, wait: 7, done: 9 };
  const RAIL_U = { ask: 0.95, news: 0.5, yours: 0.5, wait: 0.2, done: 0 };
  const anchorOf = (k) => {
    const tab = document.querySelector('#band .achip[data-tab="' + k + '"], #titlepara .achip[data-tab="' + k + '"]');
    return document.querySelector('.setupcard[data-setupcard="' + k + '"]')
      || document.querySelector('.cpara[data-para="' + k + '"]')
      || (tab && tab.closest('.cpara'))
      || document.getElementById('titlepara');
  };
  function entryOf(c, cx) {
    const st = stateOf(c, cx);
    const html = railEntry(c, cx)
      .replace(/ data-washkey="[^"]*"/, '')
      .replace(/ style="--washcol: ([^;]+); --washbg: [^;]+; --fill: ([^"]+)"/,
        (m, col, fill) => SESSION.washAttrs('set:' + c.k, col, fill));
    return { id: c.k, html, pinned: st !== 'wait' && st !== 'done', rank: RAIL_RANK[st],
      u: RAIL_U[st], mine: st === 'yours', anchor: () => anchorOf(c.k) };
  }
  // birthPass sees only the setup tasks: the charter's own entries arrive
  // by session.js's rules, not by being reborn on every render
  const setupRail = () => ({ querySelectorAll: (sel) => {
    const ids = new Set(railEntries.map((e) => e.id));
    return [...rail.querySelectorAll(sel)].filter((el) => ids.has(el.dataset.q)); } });

  function renderRail() {
    if (isStranger()) {
      // the stranger's rail holds one card: 📧 Log in — or Apply, where the
      // 🤝 rule allows it (Q456)
      railEntries = STRCARDS().map((c) => entryOf(c, strRailCtx));
      stageWords = 'reading only';
      renderClock();
      return;
    }
    if (S.viewer === 'applicant') {
      // **The applicant's seat follows the 🤝 rule as it stands** (pacing
      // pass, 2026-08-19: the topbar said "applications open" whatever the
      // policy said). Under invitation-only there is nothing to apply for;
      // under "open" arrival is joining, not applying; and an application
      // becomes an ordinary motion, so before judging opens there is no
      // room to put one before — the Apply task exists only where and when
      // applying is a real act.
      const applying = (S.joinBy === 'proposed' || S.joinBy === 'apply');
      const now2 = applying && canJudge();
      railEntries = now2 ? APPCARDS().map((c) => entryOf(c, appCtx)) : [];
      stageWords = 'reading only · ' +
        (!applying ? (S.joinBy === 'open' ? 'anyone with the link may join' : 'membership is by invitation')
          : now2 ? 'applications open' : 'applications open when the document begins');
      renderClock();
      return;
    }
    // **The rail is session.js's margin index now** (stage 8): each task is
    // an entry anchored to its own band paragraph, laid out by layoutQueue
    // with every charter entry — ask, news and yours pin, wait flows. This
    // only decides *which* entries; SESSION.refreshRail draws them.
    railEntries =
      // What is settled leaves the rail — it is the pile's, and the block's
      // to name — and a gate shows only as news: the moment it opens, until
      // its OK. Before that 💡 and ⚖️ are nowhere at all (Q529: the gate
      // clauses hide until 🍾, where they are decided), because nothing is
      // being asked of you (Ed, 2026-08-18: *everyone should only see cards
      // they can act on*). ⏳ entries stay: they are where the fill says how
      // far the room has got.
      secLive().map((s2) => ({ ...s2, cards: s2.cards
        .flatMap((c) => [c].concat(tasksFor(c)))
        .filter((c) => !owesOwnAnswer(c))
        .filter((c) => ((c.isGate && !c.isBegin && !c.isClosing) ? stateOf(c, ctx) === 'news' : stateOf(c, ctx) !== 'done'))
        // **A constitutional question waiting on the room is not a task**
        // (Ed, 2026-08-21): nothing is being asked of you — you have either
        // answered it or were never asked — so it keeps its own glyph on the
        // grey tab in the band and leaves the rail. It covers the three ways
        // a constitutional card waits: the watcher on a setting you handed
        // over, your own question once you have answered it, and a
        // constitutional motion you have answered.
        .filter((c) => !(c.kind === 'constitutional' && stateOf(c, ctx) === 'wait'))
        // the closed page asks nothing but the signature (Q470): a grant or
        // a question outstanding at the close is moot, and leaves the rail
        .filter((c) => !(cs && cs.closed) || c.isClosing) }))
        .filter((s2) => s2.cards.length).flatMap((s2) =>
        s2.cards.map((c) => entryOf(c, ctx)));

    stageWords = canJudge() ? 'open' : 'reading only';
    renderClock();
    document.getElementById('mebtn').innerHTML = avHtml(me(), 'face');
  }
  // ---- `session-clock` (Q466/Q471) ----------------------------------------
  // The topbar middle reads the room: pulse · clock · quorum. Before the
  // start the line keeps the founding's stage words and the head count;
  // from the start it is where the document is in its life — the countdown
  // at the ladder (empty on a perpetual document), Frozen, or Closed [date]
  // forever — and *quorum N of E*. The countdown runs on the server's clock:
  // the view carries serverNowMs and the page offsets by when it arrived.
  let stageWords = 'reading only';
  const serverNow = () => (cs && cs.isRemote && cs.v.serverNowMs)
    ? cs.v.serverNowMs + (Date.now() - (cs.v.receivedAtMs || Date.now())) : Date.now();
  // the ending as it stands, in ms — the module's typed value, never the
  // founder's field once something is settled
  const endsAtMsOf = () => {
    const st = csState('ending');
    if (st && st.value) return st.value.endsAtMs;           // null = never
    if (S.ending === 'perpetual') return null;
    const ms = Date.parse(S.endsAt); return Number.isFinite(ms) ? ms : null;
  };
  const clockState = () => {
    if (!cs || cs.constitutedAtT === null) return { kind: 'none' };
    if (cs.closed) return { kind: 'closed', atMs: cs.closedAt, todayMs: serverNow() };
    if (cs.frozen) { const mr = typeof cs.mustReturn === 'function' ? cs.mustReturn() : cs.mustReturn;
      return { kind: 'frozen', mustReturn: mr == null ? undefined : mr }; }
    const end = endsAtMsOf();
    if (end === null) return { kind: 'none' };
    return { kind: 'left', ms: end - serverNow() };
  };
  function renderClock() {
    const clock = document.getElementById('clock'), quorum = document.getElementById('quorum');
    const begun = !!(cs && cs.constitutedAtT !== null);
    const st = clockState();
    const text = begun ? SESSION.clockText(st) : stageWords;
    if (clock.textContent !== text) clock.textContent = text;
    // the clock is the door to moving the close: live only while there is
    // a close to move
    clock.disabled = !(begun && st.kind === 'left');
    clock.title = clock.disabled ? '' : 'When does it end? — open the ⏰ card';
    const q = begun
      ? 'quorum ' + ((cs.isRemote && cs.v.floor) || quorumCount()) + ' of ' + arrived()
      : arrived() + ' in the room';
    if (quorum.textContent !== q) quorum.textContent = q;
  }
  // the ladder sharpens on its own: the coarsest step is ten minutes, so a
  // half-minute tick is never late by a visible amount
  setInterval(() => { if (cs) renderClock(); }, 30_000);
  // the dev dropdown of actual users (Ed, 362) — rebuilt only when it
  // changes, so an open dropdown is not snapped shut under the pointer
  function renderDev() {
    const sel = document.getElementById('devwho');
    const opts = S.roster.map((r, i) => '<option value="' + i + '"' + (S.viewer === i ? ' selected' : '') + '>' +
      esc(r.n || (r.founder ? 'Unnamed founder' : 'Invited · ' + (r.e || '?'))) +
      (r.founder ? ' 🎩' : r.in ? '' : ' (invited)') + '</option>').join('') +
      '<option value="applicant"' + (S.viewer === 'applicant' ? ' selected' : '') + '>— an applicant</option>' +
      '<option value="stranger"' + (isStranger() ? ' selected' : '') + '>— a stranger</option>';
    if (sel.innerHTML !== opts) sel.innerHTML = opts;
  }

  function renderTitle() {
    const d = document.getElementById('doctitle');
    for (const el of [titleEl, d]) {
      // **A nameless document says "Untitled"** (Ed, 2026-08-21, restoring
      // it after watching a user tester type the title into the prose
      // column below). It had been blanked that morning on the argument
      // that *Untitled* was helper text standing where the answer goes —
      // but the answer goes on the 🪶 card, and this is where the *result*
      // appears, so the word is an honest statement of the result so far.
      // A heading with nothing in it gives the eye nothing, and the eye
      // goes looking for the nearest thing it can write in.
      el.textContent = S.title || 'Untitled';
      el.classList.toggle('ph', !S.title);
    }
    // The browser tab: the homepage is docs.vote, any other page is the
    // document's title (Ed, 2026-08-20). The birth stays "docs.vote" even
    // once titled — until the save it is still the homepage.
    document.title = (BIRTH || !S.title) ? 'docs.vote' : S.title;
    // At the birth the open card IS the title, so the heading does not also
    // stand above it (the decision-card gesture: the clause, opened) and
    // the tab stands beside the heading. Once the document exists the tab
    // lives on the "The document is titled…" clause instead (Ed,
    // 2026-08-19), the heading is just a heading, and it stays put while
    // the card opens down at its clause.
    d.style.display = (!cs && S.open === 'title' && !settled(card('title'))) ? 'none' : '';
    // **One tab, and it is the clause's** (Ed, 2026-08-21: *I see the 🪶 tab
    // in two places*). The heading carried one because until the birth wrote
    // its own clauses there was nothing else to carry it. From the moment
    // the title is set the clause has it, and the heading is just a heading.
    document.getElementById('titlechip').innerHTML =
      (cs || S.open === 'title' || settled(card('title'))) ? '' : pileHtml([card('title')], ctx);
    prose.classList.toggle('pasteready', visible(card('text')));
    // from the save until 📄's own turn, the column says you may write in it
    prose.classList.toggle('writeready', !!cs && !visible(card('text')));
    // **The caret leaves with the founder's hand** (Ed's QA, 2026-08-19: he
    // went looking for how to relinquish direct editing on the text — there
    // is nothing to relinquish, because the text is never held (§9.7): once
    // it is confirmed it changes by drafting. Until that drafting surface
    // exists here, an editable prose is a phantom power — keystrokes were
    // accepted and silently discarded — so the column goes read-only the
    // moment the text is confirmed, and was never editable off the
    // founder's own seat.
    prose.contentEditable = String(!(cs && cs.textConfirmed) &&
      S.viewer !== 'applicant' && amFounder());
    document.getElementById('doc').classList.toggle('begun', charterOn());
    // **The ✏️ socket stands whether or not you may propose** (Q532). It used
    // to be `display: none` for everybody who could not — a stranger, an
    // applicant, a clerk, a member before 🍾, a member who has not accepted the
    // grant — which is precisely the set of readers the toolbar exists to tell
    // something. Now the socket is there with the tool struck through, and the
    // grant fills it.
    //
    // `stormHolding` is the one case that still hides it outright, and must:
    // the pencil storm hides `#wallet` so its pencils can fly into an empty
    // one, and a struck-through ✏️ sitting in the target would be a lie for the
    // length of the flight. Note the wallet is **not** struck for a member who
    // simply has none left — that is `.empty` plus the countdown, a power you
    // hold and are waiting on, which is a different sentence entirely.
    document.getElementById('wallet').style.display = stormHolding ? 'none' : '';
    SESSION.setWalletHeld(charterOn() && mayPropose());
    document.getElementById('pulse').style.display = (FIX || (LIVEMODE && charterOn())) ? '' : 'none';
    syncWallet();
  }

  // ---- the bodies a founder fills in ------------------------------------
  // **Constitutional settings default to the room; ordinary ones default to
  // you** (Ed, 2026-08-18, agreeing the proposal rate back to the founder). One rule
  // where there had been a rule and three exceptions, and the ordinary /
  // constitutional cut is what explains it: an ordinary setting can be taken
  // back by the room at any time with a motion at the bar, so defaulting it to
  // the founder costs them nothing. A constitutional one cannot — changing it
  // needs everybody — so it has to be theirs from the start or it is not
  // really theirs at all.
  // §9.7 v0.52 (Ed, 2026-08-19): the verb is **delegate**, and it is never
  // a button — a constitutional sentence among the setting's own options.
  // Since 403 the sentence survives only on the applications card (whose
  // holder rides its value, so delegation IS one of its values); every
  // other setting delegates through the ✒️/🛡️ tabs.
  const POSTLABEL = 'Applications are delegated to the members';
  const POSTNOTE = 'The rule stays as it is, but from now on the members change it: you propose like anybody else, and nothing waits for your OK. You cannot take this back on your own — that would need everyone to agree.';
  // 403 (Ed, 2026-08-19): “The members decide” is no longer a value —
  // delegation is the state of holding neither power, said by the ✒️ and
  // 👑 tabs. On a delegated setting the value card explains, and picking
  // a value is the taking-back.
  // **Delegation is an option on the card** (Q511, Ed 2026-08-21: *delegation
  // should be an option on the decision card … which is essentially the same
  // as “skip this and go to the next one”, because it means “don't decide
  // now”*). It stands apart from the values, after them, because it is not
  // one of them: the others answer the question, this one hands it over. It
  // is the same act the ✒️/🛡️ tabs perform — holding neither power — said
  // where a founder walking the constitution will meet it, and in a single-
  // file founding it is also the only way past a question you are not ready
  // to answer. Rendered once, for whatever card is open, so no body can
  // forget it and none of the settings that cannot be delegated can get it.
  const delegateRung = (c) => {
    const dk = DKEY[c.k];
    if (!dk || !DELEGABLE.includes(dk)) return '';
    if (!cs || cs.constitutedAtT !== null) return '';   // one-way after the start
    return '<div class="choice delegrung" role="radiogroup">' +
      opt(S, dk, 'roster', 'Delegate to the membership',
        'Not now — every member states what they will accept, blind, before drafting begins, and the document takes the answer that satisfies all of them. ' +
        (c.rule ? String(c.rule).replace(/<[/]?b>/g, '') : '')) +
      '</div>';
  };
  const theyDecide = (key, note) => (wantsDelegate(key)
    ? '<p class="setnote">' +
      (cs && cs.constitutedAtT !== null
        ? 'You propose like anybody, and nothing comes to you for assent.'
        : '<b>Asked of everyone before drafting begins, blind</b> — you among them, if you are on the membership. ' + note) +
      ' Picking a value here takes it back.</p>'
    : '');

  // Q506: the register's "and afterwards" pair is gone from this card —
  // the ✒️ and 🛡️ tabs under 🤝 are where the Founder keeps or gives up
  // inviting directly and the OK on carried applications, like any setting.
  // Founded by [avatar] [name] at [time] on [date] (Ed, 2026-08-19) —
  // the time is the start (§9.6a), never known before it. **The line itself
  // stands from the save** (Q640, Ed 2026-08-22): what is unknown before the
  // start is the *moment*, not the founding, so the sentence renders as soon
  // as there is a document and *gains* its time at the 🍾 press — the same
  // reasoning that makes an unnamed document read *Untitled* rather than
  // leave a gap where the answer goes.
  const foundedAt = () => {
    if (!cs || cs.constitutedAtT === null) return '';
    const d0 = new Date(cs.constitutedAtT);
    const p2 = (x) => String(x).padStart(2, '0');
    return ' at ' + p2(d0.getHours()) + ':' + p2(d0.getMinutes()) + ' on ' +
      d0.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
  };
  // **The Founded line is a clause, not a colophon** (Q639 (a), Ed 2026-08-22).
  // It is where ✒️ and 🛡️ hang their tabs now, so the sentence has to be
  // available in two places at once: as the paragraph in the band, and as the
  // *thing* at the head of the card that opens on it — the 🪪 pattern, where a
  // clause is a list rather than a sentence. It carries markup (the avatar, the
  // 👑 span), so it rides `ctx.clauseFor` beside `rosterClause()` and never
  // `headFor`, which escapes what it is given.
  const foundedClause = () =>
    (!cs ? '' : '<p class="cpv founded">Founded by ' +
      avHtml(founderInfo()) + ' ' + esc(founderInfo().n.trim() || 'Anonymous') +
      // 👑 by any reservation (Ed, Q379 wide); 📯 = holds nothing.
      ' <span title="' + (founderCrowned()
        ? 'Part of the constitution is reserved: changing it needs the founder’s assent'
        : 'The Founder reserves nothing — no special part in the document') + '">' +
      (founderCrowned() ? '👑' : '📯') + '</span>' + esc(foundedAt()) + '.</p>');
  // the close's moment, the same shape as the founding's
  const closedAtWords = () => {
    if (!cs || !cs.closed || cs.closedAt == null) return '';
    const d0 = new Date(cs.closedAt);
    const p2 = (x) => String(x).padStart(2, '0');
    return ' at ' + p2(d0.getHours()) + ':' + p2(d0.getMinutes()) + ' on ' +
      d0.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
  };
  const BODY = {
    text: () => (cs && cs.textConfirmed
      ? '<div class="unlocks"><b>The text the document started from.</b> Drafting changes the document in place, so the page may have moved on — this is what stood when it began.</div>' +
        '<div class="propblock"><div class="rtext">' +
        (String(cs.text || '').trim() === ''
          ? '<i>It began empty — the room wrote it.</i>'
          : textDivs(cs.text)) +
        '</div></div>'
      : '<div class="unlocks">Once you confirm this, members can start <b>proposing</b> changes. They cannot judge until the rest of the constitution is settled.</div>' +
      '<p class="why">Type or paste it into the page below — the same column it will be edited in once drafting begins.</p>' +
      '<p class="setnote"><b>Or leave it blank.</b> Starting from nothing is a perfectly good way to begin. This card is asking whether you have decided, not whether there is any text yet.</p>'),
    hat: () => {
      const started = !!(cs && cs.constitutedAtT !== null);
      // the radio is the session-view's own opt(), over the derived current
      // (the pw() pattern): the generic data-set handler lands S.hatPick
      // nothing is preselected until it has been answered once
      const o = { hatPick: S.hatPick || (S.seen.has('hat') ? (iDraft() ? 'member' : 'clerk') : null) };
      return '<p class="why">Whether the Founder is also on the membership — inviting themselves like anybody else — or only runs the document.</p>' +
        '<div class="choice" role="radiogroup">' +
        opt(o, 'hatPick', 'member', 'Member — drafting too',
          'You get ✏️s, you judge, you count towards quorum, and you answer the founding questions like anybody.', '', started) +
        opt(o, 'hatPick', 'clerk', 'Clerk — not drafting',
          'No ✏️s, no judging, you count towards nothing, and there is nothing for you to answer. A clerk can stay unnamed.', '', started) +
        '</div>' +
        (started ? '<p class="setnote"><b>Settled.</b> Now that people are judging, the Founder joins the same way as anybody else.</p>' : '');
    },
    title: () =>
      '<div class="lanebox"><div class="lp editlane titlelane' + (titlePending() ? '' : ' blank') + '"' +
      ' contenteditable="plaintext-only" spellcheck="false" data-titlelane="1"' +
      ' data-ph="Give this document a title">' + esc(titlePending()) + '</div></div>',
    // Stripped to the field on Ed's word (2026-08-19): the unlocks line, the
    // suggested-from-the-title note, "what people paste to each other", the
    // label and the Copy button all went. The card is titled Link and holds a
    // link — everything else was the surface explaining a thing that explains
    // itself. What survives is what the field cannot say: that a *collision*
    // moved your slug, whether what you have typed is legal and free, and
    // that changing it later breaks nothing.
    slug: () =>
      '<div data-slugnote>' + slugNoteHtml() + '</div>' +
      '<span class="fld"><span class="setrow2">' +
      '<span class="setnote" style="margin:0">docs.vote/</span>' +
      '<input data-slug="1" value="' + esc(S.slug) + '" spellcheck="false" style="width:16rem">' +
      '</span></span>' +
      // the rules recital went with the rest (Ed, 2026-08-19) — a legal link
      // says the one thing worth saying, that it is free. The illegal case
      // keeps its line: that is not helper text, it is why the ✒️ is greyed.
      // only when there is something wrong with it (Ed, 2026-08-19: *only
      // tell me when it's not free*) — a legal, free link needs no receipt
      (SLUG_OK.test(S.slug) ? ''
        : '<p class="setnote">Lower case, digits and hyphens, three characters or more.</p>') +
      // **Changing it sets up a redirect** (Ed, 2026-08-18). The link is
      // changeable and it is also the thing that has already been sent to
      // fourteen people — so a change that broke the old one would make this
      // the one ordinary setting with a cost for using it as intended.
      // **Said where you might change it, not where you set it** (Ed,
      // 2026-08-19): before the save nothing has been sent to anybody, so a
      // promise about old links is answering a worry nobody has yet.
      (cs ? '<p class="setnote">Every link this document has ever had keeps working: changing it leaves a redirect behind, so an invitation somebody was sent weeks ago still opens the right document.</p>' : ''),
    invite: () =>
      '<p class="why">You invite people yourself. An invitation is just the link, sent by email, and whoever arrives starts with the same ✏️s as everybody else.</p>' +
      '<div class="roster"><div class="addrow"><input type="email" placeholder="name@example.com" data-add="1" value="' + esc(S.inviteOne) + '">' +
      '<button class="btn" data-act="add">Invite</button></div></div>',
    remove: () => '<p class="why">Propose that somebody stops being a member. It follows whatever the 🥾 rule says, and they always see it.</p>',
    myemail: () => (S.emailVerified
      ? '<div class="lockline">' + TICK + '<span>Verified — <b>' + esc(S.myemail) + '</b> can get back in.</span></div>' +
        '<span class="fld"><label>Change it</label><input type="email" data-txt="myemail" value="' + esc(S.myemail) + '" style="width:20rem"></span>' +
        '<p class="setnote">Changing it starts verification again — the new address has to prove it works too.</p>'
      : S.emailSent
      // **The document says it was sent** (Ed, 2026-08-21): the clause reads
      // *The Founder is checking their email for a link*, so the card does
      // not repeat it — and *nothing exists yet, so a typo costs nothing* was
      // reassurance about a state the reader is not in danger from.
      ? (cs ? '<p class="why">The mail is the login: clicking its link is what proves the address works.</p>' : '') +
        // **The composer is simply there** (Ed, 2026-08-21). *Wrong address?*
        // was a button whose whole job was to put the field back — so the
        // field stays, and typing in it is the correction. Resending moved to
        // the commit row, where every other act on this surface lives.
        '<span class="fld"><input type="email" data-txt="myemail" value="' + esc(S.myemail) + '" placeholder="you@example.com" style="width:20rem"></span>' +
        (BIRTH ? '' : '<div style="margin-top:var(--s3)"><button class="btn" data-act="openmail">Open your inbox</button></div>') +
        (BIRTH ? ''
          : '<p class="setnote">In the mockup the inbox is a pretend one — the mail in it is the magic link, and clicking it proves the address works' + (cs ? '.' : ' and creates the document at docs.vote/' + esc(S.slug) + '.') + '</p>')
      // the send button and the two explanatory blocks left on Ed's word
      // (2026-08-19): ✒️ sends it, and the card is a field with a title over
      // it — which is the whole of what it has ever been asking for
      : (S.emailErr
          ? '<p class="why"><b>' + esc(S.emailErr) + '</b></p>'
          : '') +
        (cs
          ? '<p class="why">Your address is the only way back in — there are no passwords — so a new one has to prove it works before it replaces the old.</p>'
          : '') +
        '<span class="fld"><input type="email" data-txt="myemail" value="' + esc(S.myemail) + '" placeholder="you@example.com" style="width:20rem"></span>'),
    myname: () => nameBody(me(), { optional: !iDraft() }),
    mypic: () => pictureBody(me()),
    // **Whether the founder is in it is its own question** (Ed, 2026-08-18).
    // It had been the top half of the roster card, which made a decision about
    // one person a preamble to a list of everybody — and the founder is a hat
    // worn over a role rather than a role itself (SPEC §9.0a), so the hat and
    // the roster are two things.
    roster: () => (cs && cs.constitutedAtT !== null && !(regPair().u || regPair().a)
      ? '<p class="why">Who is a member. Bringing somebody in, or proposing that somebody leaves, is the ✉️ and ❌ tabs beside this list.</p>'
      : '<p class="why">An invitation is just the link, sent by email — there are no passwords. Somebody becomes a member when they open it; until then they are listed as <i>invited</i> and count towards nothing. For now you can invite and uninvite freely, because nothing has been decided yet. Once people start judging, bringing somebody in or taking them out is a decision of its own — the ✉️ and ❌ tabs beside this list.</p>' +
      '<div class="roster"><div class="addrow"><input type="email" placeholder="name@example.com" data-add="1" value="' + esc(S.inviteOne) + '">' +
      '<button class="btn" data-act="add">Invite</button></div></div>' +
      '<div class="eyebrow fieldlab" style="margin-top:var(--s5)">Several at once</div>' +
            // the boxes keep what is in them across a close, like every other
      // field here: a pasted list of addresses is the most expensive thing
      // anybody types on this card (Ed, 2026-08-21)
      '<textarea placeholder="Paste addresses here, one per line" data-emails="1">' + esc(S.inviteMany) + '</textarea>' +
      '<div style="margin-top:var(--s2)"><button class="btn" data-act="invite">Send invitations</button></div>' +
      '<p class="setnote">' + arrived() + ' of ' + S.roster.length + ' have opened it so far. ' +
      'Nobody has to be here for the document to exist, and anybody who arrives later ' +
      'starts with the same ✏️s as everybody else.</p>'),
    // **The door, apart from the register** (Ed, 2026-08-18). The policy is
    // the constitutional act; each application that arrives through it is
    // its ordinary consequence.
    policy: () =>
      '<p class="why">How somebody who is not a member can become one. Whether the Founder invites at will, and whether an application the membership passes needs their assent, are the ✒️ and 🛡️ tabs beside this one.</p>' +
      // **Who may join** (Ed, 2026-08-18, with the Applicants subsection):
      // the gate the Apply card hangs off. An application becomes an
      // ordinary proposal to grant membership, judged like any other.
      // Q506: the holder left this card for the power tabs; delegated by
      // default like every constitutional setting, so the members' option
      // leads the list the way it does on ⏰ or 🌍.
      '<div class="choice" role="radiogroup" aria-label="Who may join">' +
      theyDecide('policy', 'Each member says the <b>most open</b> door they would accept, and the document takes the least open of them — one member who wants invitation only keeps it so.') +
      opt(S, 'joinBy', 'invite', 'Invitation only', 'Nobody joins unless a member brings them in.') +
      opt(S, 'joinBy', 'proposed', 'Applications must be proposed by members', 'Anybody can apply, but nothing happens until a member takes the application up and proposes it.') +
      opt(S, 'joinBy', 'apply', 'Anyone may apply', 'An application goes straight to the members, who judge it like any other proposal. Applying costs nothing.') +
      opt(S, 'joinBy', 'open', 'Open', 'Anyone with the link becomes a member the moment they open it.') +
      '</div>',
    ending: () =>
      '<p class="why">When drafting stops. At that moment the text is final and the record is published. <b>Never</b> is one of the answers: a document with no end date stops only when too few members are still active.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('ending', 'The document takes the <b>latest</b> answer anybody gives, and <b>never</b> is later than any date — so one member who wants it to run on keeps it running.') +
      opt(S, 'ending', 'ends', 'At a set time', '',
        '<span class="fld"><label>Ends</label><input type="datetime-local" data-txt="endsAt" value="' + S.endsAt + '"></span>') +
      opt(S, 'ending', 'perpetual', 'Never', 'It runs until too few members are still active.') +
      '</div>',
    bar: () =>
      '<p class="why">How sure the members have to be that a change is better than the words it would replace. It is not a vote — nobody counts for and against; members compare the two versions, and this is how clear the result has to be. This is the number that applies <b>at the end</b>, when a change can no longer be challenged.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('bar', 'Each member says the lowest they will accept, and the document takes the highest.') +
      opt(S, 'barBy', 'founder', 'I set it', '',
        '<span class="setrow2">' + num(S, 'tClose', 'At the end', 50, 99, '%') + '</span>') +
      '</div>',
    pace: () =>
      '<p class="why">Whether the approval threshold applies the whole way through, or starts lower and climbs to it. Starting lower lets early changes through more easily, while there is still time for somebody to challenge them.</p>' +
      '<div class="choice" role="radiogroup">' +
      opt(S, 'shape', 'ramp', 'Rising', 'Starts lower when people begin judging and climbs to the number at the end.',
        '<span class="setrow2">' + num(S, 'tStart', 'When judging opens', 50, 99, '%') + '</span>', perpetual()) +
      opt(S, 'shape', 'fixed', 'Fixed', 'The same number all the way through.') +
      '</div>' + (perpetual() ? '<p class="setnote">With no end date there is nothing to climb towards, so the number stays fixed.</p>' : ''),
    quorum: () =>
      '<p class="why">How many members have to have judged something before it can change the document. Until that many have, it waits — nobody’s silence counts either way.</p>' +
      // **The form is the wording, the number is the decision** (§9.0a): count
      // or share is how the question tracks a changing membership, and it is
      // the founder's even when the number is the room's.
      '<div class="eyebrow fieldlab">Asked as</div>' +
      '<div class="choice" role="radiogroup" aria-label="Form">' +
      opt(S, 'quorumForm', 'share', 'A share of the membership', 'The number goes up and down as members join and leave.') +
      opt(S, 'quorumForm', 'count', 'A fixed number', 'The number stays the same however the membership changes.') +
      '</div>' +
      '<div class="eyebrow fieldlab" style="margin-top:var(--s4)">The number</div>' +
      '<div class="choice" role="radiogroup" aria-label="Number">' +
      theyDecide('quorum', 'Each member says the lowest they will accept, and the document takes the highest.') +
      opt(S, 'quorumBy', 'founder', 'I set it', '',
        '<span class="setrow2">' + (S.quorumForm === 'share'
          ? num(S, 'quorumPct', 'Share', 1, 100, '% — ' + quorumCount() + ' of ' + E() + ' today')
          : num(S, 'quorumN', 'Members', 1, 40, 'of ' + E())) + '</span>') +
      '</div>',
    authorship: () =>
      '<p class="why">Whoever proposes a change writes a reason for it, and everybody can read that. This is only about whether their name is on it.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('authorship', 'This one is about privacy, so the document takes the <b>most private</b> answer anybody gives.') +
      // one vocabulary with the member ladder (copy pass, 2026-08-19: the
      // same three rungs wore three wordings across the two seats)
      opt(S, 'authorship', 'anonymous', 'Nobody’s name, ever', 'No proposal ever carries a name, even after the document is finished.') +
      opt(S, 'authorship', 'sealed', 'Names at the close', 'Hidden while the document is being written, and published with it at the end.') +
      opt(S, 'authorship', 'public', 'Names from the start', 'Every proposal carries its writer’s name from the moment it is made.') +
      '</div><p class="setnote">If you choose this yourself, members can end up named without having agreed to it.</p>',
    signing: () =>
      '<p class="why">Whether somebody can choose to put their name on a proposal that would otherwise carry no name.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('signing', 'This one is about privacy, so the document takes the <b>most private</b> answer anybody gives.') +
      opt(S, 'signing', 'nobody', 'Nobody signs', 'No proposal carries a name, so no proposal says anything about who wrote it.') +
      opt(S, 'signing', 'each', 'Each author chooses', 'Anyone may sign — which means a proposal with no name on it stands out.') +
      opt(S, 'signing', 'everybody', 'Everybody signs', 'Every proposal carries its writer’s name.') +
      '</div>',
    judgments: () =>
      '<p class="why">Whether what somebody preferred is ever attached to their name. Nobody can see it while a question is still open, whichever you choose — that is what keeps the judging honest.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('judgments', 'This one is about privacy, so the document takes the <b>most private</b> answer anybody gives.') +
      opt(S, 'judgments', 'never', 'Never revealed', 'What you preferred stays yours, permanently.') +
      opt(S, 'judgments', 'after', 'Revealed after the decision', 'Published with the document at the end, never before.') +
      '</div>',
    rate: () =>
      '<p class="why">How often a member can propose something. Each proposal costs one ✏️, and you get it back if the proposal passes or if you withdraw it.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('rate', 'Each member says the <b>most generous</b> they would accept, and the document takes it. Until it is settled everybody gets the standard rate.') +
      opt(S, 'rateBy', 'founder', 'I set it', '',
        '<span class="setrow2">' + num(S, 'grant', '✏️ to start with', 0, 40) +
        num(S, 'cap', 'up to a maximum of', 1, 99) +
        num(S, 'dripMin', 'an additional ✏️ every N minutes', 5, 2880) + '</span>') +
      '</div>' +
      // the commit waits on all three numbers, and on the maximum being a
      // maximum: without this the button just stays dark and says nothing
      // about why (found walking the founding, 2026-08-21)
      (isNum(S.grant) && isNum(S.cap) && +S.cap < +S.grant
        ? '<p class="setnote">The maximum cannot be lower than the number they start with.</p>' : ''),
    chamber: () =>
      '<p class="why">Who else can read the document. Readers are <b>not members</b>: they cannot propose or judge, and nothing about them is known. The Founder can always read it, whichever of these the room chooses. Nobody, member or not, can see how a question is going while it is still open.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('chamber', 'This one is about privacy, so the document takes the <b>most private</b> answer anybody gives.') +
      // most-private-first, the order every ladder on the surface reads in
      opt(S, 'chamber', 'closed', 'Members only') +
      opt(S, 'chamber', 'link', 'Anyone with the link') + '</div>',
    lapse: () =>
      '<p class="why">Whether somebody stops being a member if they go a long time without logging in. They are warned by email first, and sent the document as it stands when it happens. Anything they already judged still counts, the other members can finish without them, and coming back is just logging in again.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('lapse', 'Each member says the shortest gap they would accept, and the document takes the longest — <b>never</b> being longer than any of them.') +

  // ---- the band: two piles, and the card one of them opens into ----------
  function renderBand() {
    if (isStranger()) {

      const c = card(S.open);

      // the founder's decision and stays editable — and grows a **watching**
      // half underneath, which is the whole of what anybody may see of a blind

      if (c.isBegin) {

        return cardHtml(c, ctx, grantProv(c) + gateBody(c) + grantNote(c),
          binBtn() +
          '<button class="btn btn-approve"' + (c.open() ? '' : ' disabled') +
          ' data-ok="' + c.k + '">OK</button>', g.cards);

      // 403/405 (Ed, 2026-08-19): a power tab, opened — the ✒️ or 🛡️
      // half of a setting's governance, its head the rule as it stands
      if (c.power) {
        const pHeld = c.power === 'u' ? pwPair(c.base).u : pwPair(c.base).a;
        const editable = amFounder() && !(cs && cs.constitutedAtT !== null && !pHeld);
        // ✒️, not ✓: giving up a power is the founder's unilateral set,
        // and ✒️ is the pen every unilateral set on this surface commits

        return cardHtml(c, ctx, powerBody(c),
          (editable ? binBtn() +
            '<button class="btn btn-approve glyphbtn emojibtn" data-confirm="1"' +
            ' title="Set it">✒️</button>'
            : binBtn()),
          g.cards);
      }
      const m = motionOn(c);
      // **Reserved is assent, not silence** (§9.7): the room passed it, and
      // it now sits with the founder — Accept applies it, Reject files it.
      if (m && m.status === 'awaiting-crown') {
        return cardHtml(c, ctx,
          '<div class="unlocks"><b>Passed — awaiting the 👑.</b> The room passed <i>' + esc(m.to) + '</i>' +
          (m.why ? ' — <i>' + esc(m.why) + '</i>' : '') +
          '. The setting is reserved, so the change goes to the founder as a <b>👑 question</b>, theirs to assent to or refuse. Until then, what stands stands.</div>',
          (amFounder()
            ? '<button class="btn" data-crownq="reject">Refuse</button>' +
              '<button class="btn btn-approve" data-crownq="accept">Accept</button>'
            : binBtn()), g.cards);
      }

        return cardHtml(c, ctx, motionBody(c, ctx, mLive),
          // one bin on every card, always live (Q613 (a), 2026-08-22): for the
          // mover it withdraws, for anybody else it simply closes the card
          (m.by === viewerId()
            ? '<button class="btn" data-withdrawmotion="' + c.k + '" title="Withdrawing returns the ✏️ in full">🗑️ Withdraw</button>'

          ' data-confirm="1">' + TICK + '</button>',

      }
      if (m) {
        // constitutional: the founding question, live again. Yours carries
        // the withdraw at the very left, where 🗑️ always is — it hands the
        // 🏛️ back whole, which is what makes the one-each limit livable.
        return cardHtml(c, ctx,
          motionReopen(c, ctx, { ...m, judged: motionJudged(c.k) }) + consentBody(c, m),
          (m.by === viewerId()
            ? '<button class="btn" data-withdrawmotion="' + c.k + '" title="Withdrawing hands your 🏛️ back">🗑️ Withdraw</button>'
            : binBtn()) +
          '<button class="btn btn-approve glyphbtn"' + (motionPicked(c) ? '' : ' disabled') +
          ' data-confirm="1">' + TICK + '</button>', g.cards);
      }
      // — unless it is a decision you are owed: the OK comes before the
      // motion, since an unacknowledged rule sits in the rail until it is
      // pressed (the composer returns the moment it is)
      if (composerOn(c) && stateOf(c, ctx) !== 'news') {
        // **The settled card is the composer** (Ed, 2026-08-18): the rule as
        // it stands at the head, the alternatives as the setting's own
        // controls, session-view's rationale lane, 🗑️ and the route's commit.
        const d = (S.draft && S.draft.k === c.k) ? S.draft : { k: c.k, to: '', why: '' };
        const route = routeFor(c, d.to);
        const body2 = (PROPOSE[c.k] ? PROPOSE[c.k](d)
            : '<div class="lanebox"><div class="lp editlane" contenteditable="plaintext-only" spellcheck="false"' +
              ' data-motionlane="to" data-ph="The value you are proposing">' + esc(d.to) + '</div></div>') +
          whyLane(d) +
          (route === 'constitutional'
            ? (crownWaits(c) ? '<p class="setnote">If it passes it goes to the Founder, who may assent or refuse.</p>' : '')
            // the price is not said in words (Ed, 2026-08-19): the pencil

            : (crownWaits(c) ? '<p class="setnote">If it passes it goes to the Founder, who may assent or refuse.</p>' : '')) +

        return cardHtml(c, ctx, body2 + changeHalf(c),

          ' title="Discard this motion">🗑️</button>' +

      }
      const body = c.ansFor ? ANSWER[c.ansFor](S.myAns, E(), c.ansFor === 'quorum' ? S.quorumForm : undefined)
        // a card that is not yours to answer reads as the rule it is —
        // the founder's settings are read-only from any other chair
        : (!amFounder() && c.own !== 'you')
        ? readBody(c, ctx) + (wasAsked(c) && settled(c) ? '<div class="body">' + watchBody(c, ctx) + '</div>' : '')
        : BODY[c.k]() + delegateRung(c) +
          (wasAsked(c) && settled(c) ? '<div class="body">' + watchBody(c, ctx) + '</div>' : '');
      // **The route left the card bodies** (Ed's copy pass, 2026-08-19,
      // finishing what the kind-eyebrow removal started): every card carried
      // a kind line restating the preamble, and the preamble is where the
      // routes are stated once — the clause states its deviations, and the
      // controls convey the rest (a 🏛️ hold, a 👑 note). What survives is
      // the one sentence only its own card can say: the ⏰ card's
      // whether/when split, where the constitutional line falls inside a
      // single setting.
      // **A pen change is an amendment, and reads like one** (Ed, 2026-08-22:
      // *a unilateral rule change by the founder is still just a kind of
      // amendment and so should be treated in the same way in terms of how
      // it's communicated and reported*). So this stopped reading the
      // setting's own last-set fields and reads **the amendment record**,
      // which is where every route already lives — and the dividend is that a
      // clause now carries its history whoever changed it, the founder's pen
      // and the membership's motion in one line with one shape.
      //
      // Who it names follows the route, and has to: the pen is attributed by
      // construction, so the founder's name and face are on it; a raised
      // motion's mover is **sealed until the record** (§3.4), so that one is
      // the membership's act and wears the featureless disc.
      // The module hands back `MotionRecord`s and the wire hands back
      // `MotionView`s, and they name two of these fields differently — so
      // they are normalised here into the one shape the copy below reads,
      // rather than each caller remembering which it is holding.
      function lastAmendment(k) {
        if (!cs) return null;
        const mid = midOf(k);
        let best = null;
        try {
          for (const m of cs.motionRecords().values()) {
            if (m.status !== 'carried') continue;
            if (!m.payload || m.payload.kind !== 'set' || m.payload.setting !== mid) continue;
            const at = m.at !== undefined && m.at !== null ? m.at : (m.settledAtT || 0);
            const from = m.from !== undefined && m.from !== null ? m.from
              : (cs.amendedFrom ? cs.amendedFrom(m.id) : null);
            const one = { route: m.route, why: m.why || null, at, from };
            if (!best || one.at >= best.at) best = one;
          }
        } catch (e) { return null; }
        return best;
      }
      // the two halves of Q530, chosen by which side of the act you are on
      // **Declared, not assigned, so the composer above can reach it.** A
      // member's settled card post-start renders through the composer's own
      // early return, which is *before* this point in the function — so as an
      // arrow const the history was drawn on the news card and lost the
      // moment the OK turned it back into a composer. Ed's answer was that
      // the clause keeps it permanently, and a settled clause is exactly
      // where somebody goes to ask why a rule is the way it is.
      function changeHalf(cc) {
        const k = cc.k;
        if (cc.ansFor || cc.isGate || cc.door || !PW_KEYS.includes(k) || k === 'text') return '';
        // the founder, about to change something that already stands: a lane
        if (amFounder() && cs && isChange(k) && !motionOn(cc) && !membersHold(cc)) {
          const v = (S.setWhy && S.setWhy[k]) || '';
          return '<div class="body whyset"><p class="eyebrow fieldlab">Why are you changing this?</p>' +
            founderSpeakerLane(v) + '</div>';
        }
        // anybody else, reading what happened: what changed, and their reason
        const am = lastAmendment(k);
        if (!am || amFounder()) return '';
        const from = am.from || changedFrom(k);
        if (!from) return '';
        const was = wordsFor(k, from);
        const now2 = wordsFor(k, (csState(k) || {}).value);
        if (!was) return '';
        const what = esc(WHAT[k] || (k === 'title' ? 'the document’s title' : cc.t.toLowerCase()));
        const who = am.route === 'pen' ? 'The Founder has changed ' : 'The membership has changed ';
        // **Long values are shown, not narrated** (2026-08-22). *from x to y*
        // reads well for a rung, a percentage or a date, and badly for ⏱️,
        // whose value is three numbers in a sentence — *from 4 ✏️ to start, up
        // to 8, one more every 180 minutes to 2 ✏️ to start, up to 8, one more
        // every 180 minutes* buries the one number that moved and loses its
        // own *to* in the middle. Past a short value the pair goes on two
        // aligned lines instead, where the eye finds the difference itself.
        const longish = was.length > 32 || (now2 || '').length > 32;
        // **News says what happened; history says when.** The same block does
        // both jobs, because it is the same fact — but an amendment you have
        // already acknowledged is no longer being announced to you, and a
        // line on a settled clause that a reader may meet months later has to
        // date itself or it reads as something that has just happened.
        const dated = stateOf(cc, ctx) === 'news' ? ''
          : '<p class="eyebrow fieldlab">Last amended' +
            (am.at ? ' ' + esc(new Date(am.at).toLocaleDateString(undefined,
              { day: 'numeric', month: 'long' })) : '') + '</p>';
        return '<div class="body changed">' + dated +
          (longish
            ? '<p class="cpv">' + who + what + '.</p>' +
              '<p class="waswas"><span>was</span>' + esc(was) + '</p>' +
              (now2 ? '<p class="waswas"><span>now</span>' + esc(now2) + '</p>' : '')
            : '<p class="cpv">' + who + what +
              ' from ' + esc(was) + (now2 ? ' to ' + esc(now2) : '') + '.</p>') +
          (am.route === 'pen' ? founderSpeaker(am.why)
            : window.CARDS.speakerHtml(am.why)) + '</div>';
      }
      const kindLine = c.knote ? '<p class="setnote">' + c.knote + '</p>' : '';
      const newsKey = isRoom(c) ? 'res-' + c.k : 'set-' + c.k;
      // **The ground belongs to the glyph, never to the card's kind** (Ed's
      // QA, 2026-08-21: *the buttons during the birth are many different
      // colours*). Two rules chose the commit's look and they were keyed on
      // different things: the *glyph* on whether the document exists yet (at
      // the birth every commit is the 🪶, whoever the card is about), the
      // *quiet ground* on the card's kind. On 📧 — a personal card, so ✓ by
      // kind — they disagreed, and the third feather of the birth stood on
      // the solid green the drawn ✓ owns, between two on the accent-subtle.
      // One expression now decides both: an emoji needs a quiet ground
      // wherever it sits, and the ✓ stays the one solid green thing.
      const commitGlyph = !cs ? '🪶' : (c.ansFor || c.kind === 'personal') ? TICK : '✒️';

        : (c.k === 'myname' || c.k === 'mypic')
        // **The bin clears un-actioned input and never touches what is set**
        // (Q520, Ed 2026-08-21). ✋ and 🖼️ were the two bins whose act was to
        // *delete* the value rather than put the card back, which was
        // survivable while a bin greyed out unless there was something to

        // the way out of a card. They take the shared bin: it restores what

        // saved name is still a thing you can do — by emptying the field, the
        // way you set it — and a picture is removed by choosing initials.
        ? binBtn() +

          // so it commits with ✓ — the pen is for sets that bind the document

        : c.k === 'title'

        // there is the close it always was under another name.
        : binBtn() +

        // and a setting about yourself — your name, picture, email — bind

    if (!settled(card('myemail'))) {

  // **Opening the title must not move the title** (Ed, 2026-08-18: *the

  // first rule by shifting the whole card onto the heading's text and
  // dragging the strip back onto the closed tab — which pulled the strip
  // off the card's edge, because the strip hangs on the card's box. So the
  // two corrections go to different owners: the **vertical** one moves the
  // card (a card moving up does not break the strip's contact with its own

  // closed tab standing on the card's edge too (see #titlechip .chipcol in
  // setup.css), the tab needs pinning only in Y. All measured, from text
  // rects rather than boxes, because the title wraps and paddings differ.
  const textRect = (el) => { const r = document.createRange();
    r.selectNodeContents(el); const rs = r.getClientRects(); return rs.length ? rs[0] : null; };
  function fitTitleCard() {
    if (S.open !== 'title' || cs) return; // post-save fitBand owns the card
    const cardEl = document.querySelector('#titlepara > .setupcard');

    d.style.display = 'none';
    const have = textRect(hd);
    if (want && have) {
      const dy = want.top - have.top, dx = want.left - have.left;
      if (Math.abs(dy) > 0.5) cardEl.style.marginTop =
        ((parseFloat(getComputedStyle(cardEl).marginTop) || 0) + dy).toFixed(1) + 'px';
      if (Math.abs(dx) > 0.5) hd.style.marginLeft = dx.toFixed(1) + 'px';
    }

    // unpainted beat, never shown. No horizontal pin: the strip's x is the
    // card's edge, which is where the closed tab now stands by rule.
    const col = cardEl.querySelector('.chipcol');
    const chipHost = document.getElementById('titlechip');
    if (col && chipHost) {
      col.style.transform = '';
      d.style.display = '';

  // the card (it would take the caret), so the label is corrected in place.

  // been edited since is not a resend
  const resendTitle = () => (S.myemail === S.sentAddr ? 'Send the link again' : 'Send the link to this address');
  const commitTitle = (c) => (c.k === 'title'
    // 🪶's own wording: the title card is the one that is typed into, so it

    ? (commitReady(c) ? (cs ? 'Set it — yours to change any time' : 'Name it') : 'Give it a name first')

      ? (!SLUG_OK.test(S.slug) ? 'Lower case, digits and hyphens, three characters or more'

  // Typing deliberately does not re-render, because a render would take the
  // caret, so everything on the row whose state depends on what has been
  // typed must be corrected in place. Only the commit and the title card's
  // own bin ever were — which left every 🗑️ on a card you *type* into (the
  // address, the numbers, the dates, a motion's draft) wearing whatever the
  // render drew before the first keystroke, and that is always disabled. A
  // bin woke only where the change was a radio, because a radio re-renders.

  function refreshCommit() {

    if (ev.target.matches('[data-mtext]')) { S.draft.to = ev.target.value.trim();

    if (ev.target.matches('[data-mslug]')) {

  // what it prints must come from the module — the same mapping the member
  // surface hydrates through, never a second copy of it
  function hydrateFromModule(skipKey) {
    const val2 = (mid) => { const st = cs.settingState(mid); return st && st.value; };
    const MAPV = {
      ending: (x) => { S.ending = x.endsAtMs === null ? 'perpetual' : 'ends';
        if (x.endsAtMs !== null) S.endsAt = msToLocal(x.endsAtMs); },
      bar: (x) => { S.tClose = x.pct; },
      pace: (x) => { S.shape = x.shape; if (x.startPct) S.tStart = x.startPct; },
      quorum: (x) => { if (x.form === 'share') S.quorumPct = x.n; else S.quorumN = x.n; },
      authorship: (x) => { S.authorship = x.rung; },
      signing: (x) => { S.signing = x.rung; },
      judgments: (x) => { S.judgments = x.rung; },
      chamber: (x) => { S.chamber = x.rung; },
      rate: (x) => { S.grant = x.grant; S.cap = x.cap; S.dripMin = x.dripMinutes; },
      lapse: (x) => { S.lapse = x.afterMs === null ? 'never' : String(Math.round(x.afterMs / 86400000)); },
      removal: (x) => { S.removal = x.rung; },
      machines: (x) => { S.auditor = x.enabled; if (x.enabled) S.auditorBudget = x.budget; },
      applications: (x) => { S.joinBy = x.joinPolicy; },
    };
    for (const mid of Object.keys(MAPV)) {
      if (pkeyOf(mid) === skipKey) continue;
      const x = val2(mid);
      // value non-null implies settled (every module fold sets or nulls
      // the pair together), so this guard is the whole condition
      if (x) MAPV[mid](x);
    }
  }

  // the provisional radio layer, hydrated once from what the server holds.
  // The value half is hydrateValues — one mapping, shared with the 4s poll,
  // so boot and refresh cannot disagree about how a value lands in S —
  // plus what is genuinely boot's own: identity, the delegation seeds,
  // committed answers, and the seen/okd reconstruction.
  function hydrateS() {
    const v = cs.v;
    const meRow2 = v.view.members.find((r) => r.id === v.me);
    S.myemail = (meRow2 ? meRow2.email : v.convenor.email) || '';
    S.emailSent = true; S.emailVerified = true;
    S.myname = v.view.identity.name || '';
    S.mypic = v.view.identity.picture || '';
    // whether they were ever *answered*, which the values cannot say (Q645)
    S.nameSet = !!v.view.identity.nameSet;
    S.picSet = !!v.view.identity.pictureSet;
    S.quorumForm = v.quorumForm;
    hydrateValues(null);
    // delegation seeds: a members-held setting with no resolved value reads
    // 'roster' in the page's own radio vocabulary; the *By flags say who
    // holds where the radio and the value are separate fields
    const val = (mid) => { const st = cs.settingState(mid); return st && st.value; };
    const del = (mid) => { const st = cs.settingState(mid); return !!st && st.holder === 'members'; };
    for (const mid of ['ending', 'authorship', 'signing', 'judgments', 'chamber',
      'removal', 'lapse', 'machines']) {
      if (del(mid) && !val(mid)) S[DKEY[pkeyOf(mid)]] = 'roster';
    }
    // **A holder radio reports an act, never a default** (Ed, 2026-08-21).
    // Since nothing arrives delegated, `holder === 'convenor'` no longer
    // means *the founder chose to keep it* — it is also what an untouched
    // setting looks like, and the two must not render alike. Delegated reads
    // 'roster'; held **and set** reads 'founder'; held and unset is the
    // undecided '' the page starts every radio at. This line used to read
    // `del(mid) ? 'roster' : 'founder'`, which stated an answer the founder
    // had not given — the same defect as arriving delegated, mirrored.
    const stOf = (mid) => { try { return cs.settingState(mid); } catch (e) { return null; } };
    const byOf = (mid) => { const st = stOf(mid);
      return del(mid) ? 'roster' : (st && st.settledBy !== null) ? 'founder' : ''; };
    S.barBy = byOf('bar');
    S.quorumBy = byOf('quorum');
    S.rateBy = byOf('rate');
    S.policyBy = byOf('applications');
    // my committed answers, back in the page's own vocabulary
    for (const q of v.view.questions) {
      if (q.myAnswer === null) continue;
      const k = pkeyOf(q.setting);
      S.myAns[k] = PAGEVAL[k] ? PAGEVAL[k](q.myAnswer) : q.myAnswer;
    }
    // settled means confirmed here (the server's record IS the confirm),
    // and acknowledged means not owed (§9.0b)
    const owed = new Set(v.view.owedOks);
    CARDS.forEach((c) => {
      if (c.isGate || c.ansFor) return;
      if (c.k === 'title' || c.k === 'slug' || c.k === 'myemail' || c.k === 'roster') { S.seen.add(c.k); return; }
      if (c.k === 'text') { if (v.textConfirmed) S.seen.add(c.k); return; }
      // ✋ and 🖼️ answer for themselves now, per seat, off `view.identity`'s
      // own flags (Q645) — this line used to declare them settled on every
      // live render, which is why neither task existed on a real document.
      if (c.k === 'myname' || c.k === 'mypic') return;
      const st = csState(c.k);
      if (st && (st.settledBy !== null || st.holder === 'members')) {
        S.seen.add(c.k);
        // **Owed means not acknowledged, in both directions** (Q530). This
        // only ever *added*, so an acknowledgement given once could never be
        // taken back — and a change re-owes the OK it dropped, which is the
        // whole mechanism by which a change announces itself.
        if (st.settledBy !== null) {
          if (owed.has(midOf(c.k))) { S.okd.delete('set-' + c.k); S.okd.delete('res-' + c.k); }
          else { S.okd.add('set-' + c.k); S.okd.add('res-' + c.k); }
        }
      }
    });
  }

  // ---- the live Applicants block (§9.7½ v0.56, Q397) ----------------------
  // Members see who is asking, in their own words, and judge each admit
  // motion as the one-candidate race it is: admit them, or keep the
  // membership as it is. Live only — the fixture has its own applicant
  // seat and no server to race against.
  const admitCardOf = (apId) => raceCardOf('admit:' + apId);
  function liveApplicantsHtml() {
    if (!cs || !cs.isRemote) return '';
    const aps = (cs.v.view && cs.v.view.applicants) || [];
    if (!aps.length) return '';
    const stp = csState('policy');
    const policy = (stp && stp.value && stp.value.joinPolicy) || 'invite';
    const rows = aps.map((ap) => {
      const nm = ap.name || 'Anonymous'; // the email stands on its own line
      const motion = ap.motion && ((cs.v.view.motions || []).find((m) => m.id === ap.motion) || null);
      const why = (motion && motion.why) || ap.words || '';
      const rc = admitCardOf(ap.id);
      const pick = S['adm:' + ap.id] || null;
      let tail = '';
      if (ap.status === 'admitted') tail = '<span class="chip">member</span>';
      else if (ap.status === 'refused') tail = '<span class="chip pending">not admitted</span>';
      else if (ap.status === 'submitted' && policy === 'proposed' && !motion) {
        tail = '<span class="chip pending">waiting for a member to propose them</span>' +
          (viewerIsMember()
            ? '<div style="display:flex;gap:.4rem;margin-top:.35rem;align-items:center">' +
              '<input data-apwhy="' + ap.id + '" placeholder="Why should they join?" style="flex:1;min-width:10rem">' +
              '<button class="btn" data-appropose="' + ap.id + '" title="Costs one ✏️, returned in full if withdrawn">✏️ Propose them</button></div>'
            : '');
      } else if (motion && motion.status === 'running') {
        tail = rc
          ? '<div style="display:flex;gap:.4rem;margin-top:.35rem;flex-wrap:wrap;align-items:center">' +
            '<button class="lanepick" aria-pressed="' + (pick === 'admit') + '" data-admitpick="' + ap.id + '" data-v="admit"><span class="dot"></span><span>Admit</span></button>' +
            '<button class="lanepick" aria-pressed="' + (pick === 'stands') + '" data-admitpick="' + ap.id + '" data-v="stands"><span class="dot"></span><span>Keep the membership as it is</span></button>' +
            '<button class="lanepick" aria-pressed="' + (pick === 'either') + '" data-admitpick="' + ap.id + '" data-v="either"><span class="dot"></span><span>Indifferent</span></button>' +
            '<button class="btn btn-approve glyphbtn" data-admitgo="' + ap.id + '"' + (pick ? '' : ' disabled') + '>' + TICK + '</button></div>'
          : '<span class="chip">before the members — you have judged it</span>';
      }
      return '<div class="rperson" style="display:block"><span class="nm">' + esc(nm) +
        ' <span class="chip pending">applicant</span></span><br>' +
        '<span class="em">' + esc(ap.email) + (why ? ' · <i>' + esc(why) + '</i>' : '') + '</span>' +
        (tail ? '<div style="margin-top:.3rem">' + tail + '</div>' : '') + '</div>';
    }).join('');
    return '<div class="roster clauselist" style="margin-top:.5rem">' +
      '<div class="rechead">Applicants</div>' + rows + '</div>';
  }
  // The admit judgment is the same pairwise act as any ordinary motion's
  // (liveJudge): admit prefers the candidate side, keep the incumbent.
  function liveJudgeAdmit(apId) {
    const rc = admitCardOf(apId);
    if (!rc) { console.warn('[live] no admit card served for', apId); return; }
    const pick = S['adm:' + apId];
    if (!pick) return;
    delete S['adm:' + apId];
    judgeRaceCard(rc, pick); // 'admit' prefers the candidate side
  }

  // ---- the dev inbox as a modal (Ed, 2026-08-19) --------------------------

  function liveBoot() {

    fetch('/api/d/' + LIVESLUG + '/view').then((r) => {

      return r.json();
    }).then((data) => {
      if (!data) return;
      // **There is no login screen** (Q456): a stranger arrives at the three
      // columns like everybody else — the rules, the text's shape, one
      // sentence, and a rail holding the 📧 task
      if (data.stranger) {
        STR = data;
        cs = remoteCS(strangerAsView(data));
        S.viewer = 'stranger';
        hydrateS();
        render();
        setInterval(() => {
        // **Nothing rebuilds under a press.** A pen hold is a gesture in
        // progress — the glyph is in the air and the button is under the
        // pointer — and a poll that re-renders mid-hold replaces the very
        // control being held. The same rule the draft typing guard keeps,
        // for the same reason: the surface must not move under the hand.
        // The poll simply waits for the next tick.
        // a pen hold here, or a propose hold in the charter — either way a
        // press is in progress and the surface must not move under it
        if (penHold || SESSION.holding) return;

      }, 4000);
        return;
      }
      cs = remoteCS(data);
      wireLive();
      syncFromCs();
      const at = S.roster.findIndex((row) => (row.mid || FOUNDER) === data.me);
      if (at >= 0) S.viewer = at;
      const f = S.roster[0];
      if (f && data.convenor) { f.e = data.convenor.email;
        f.role = data.convenor.isMember ? 'member' : 'clerk';
        f.n = (data.me === data.convenor.id ? data.view.identity.name : data.convenor.name) || f.n || ''; }
      hydrateS();
      for (const k of loadGrants()) S.okd.add(k);
      if (data.text) setProse(data.text);
      else if (data.provisionalText) setProse(data.provisionalText);
      render();
      setInterval(() => {
        // **Nothing rebuilds under a press.** A pen hold is a gesture in
        // progress — the glyph is in the air and the button is under the
        // pointer — and a poll that re-renders mid-hold replaces the very
        // control being held. The same rule the draft typing guard keeps,
        // for the same reason: the surface must not move under the hand.
        // The poll simply waits for the next tick.

        // press is in progress and the surface must not move under it

      // the founder's unconfirmed draft rides the stash (§9.7a v0.55)
      let deb = null;
      prose.addEventListener('input', () => {
        if (cs.textConfirmed || !amFounder()) return;
        clearTimeout(deb);
        deb = setTimeout(() => {
          api.post('/api/d/' + LIVESLUG + '/stash', { text: proseText() })
            .catch(() => {}); }, 800);
