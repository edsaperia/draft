/* ============================================================================
   document-creation — **the document, from its first minute.**

   Five notes built this, in order, and each one made the screen less of a form:

   1. *Something that looks like the document itself; the admin pastes the text
      into the space where it will later be edited, the ToC appears on cue, they
      click the placeholder title in the topbar, and the sidebar holds cards with
      each of the questions they need to decide.*
   2. *Can we import as much of the session-view as we can? I think ultimately
      this will literally be the session view.*
   3. *You can start inviting people immediately after creating the document …
      and as soon as you've confirmed the starting text they can start making
      proposals … and judgements unlock as soon as everyone is ready.*
   4. *Ceremony and admin cards are absolutely just queue-cards. Instead of
      modals they open cards in the document at the top, above the text, pushing
      it down like decision-cards do a clause. They have cables and tabs.*
   5. *I'd like all of these tabs to act like clause-tabs and pile like clause
      tabs. The founder's settings sit in one pile, and members' in the
      pile below. … Go through every decision each role needs to make and turn it
      into a queue-card. Break them down as much as you can.*

   The third changed the model — there is no moment when the document "opens".
   The fourth retired the modal. The fifth retired the last two inventions on the
   screen: the flat tab group, which is now two `chip-gutter` piles like
   everything else, and the compound card, which was a form in card's clothing.
   **One decision, one card**, and the test is whether somebody could answer it
   differently and on its own: a picture and a name are two questions, and so are
   a membership and whether the founder is in it. What is *not* split is a
   parameter and its own value — *rising, 55% → 78%* is one thought, and cutting
   it in half would be splitting a sentence rather than a decision. The same test
   cuts the other way twice, on 2026-08-18: *when it ends* swallowed *whether it
   ends*, because **never** is one of the answers to *when*; and the stake stopped
   being a card at all, because it is a flat 1 in the mechanism and a card for it
   was offering a decision nobody has. Then ✒️ split the other way on Ed’s Q341 rethink — the close bar is consent where the ramp is pacing, two kinds — so seventeen became eighteen — and 💤 *Do memberships lapse?* (Ed, closing Q345) made it nineteen.

   What is left in this file is its own fixture and the bodies of the cards a
   founder fills in. The piles, the strip, the cable, the rail entry, the card
   shell, the read-only and watching bodies and the identity cards are in
   `setup.js`, because the founding ceremony is this same screen seen by
   somebody else.
   ========================================================================== */

  /* **The title is not edited in the topbar** (Ed, 2026-08-18). It had been a
     contenteditable in the bar, which is the one place on this screen that is
     not a card — so the title was the single setting with no card behind it, no
     confirm, and no way back to it except clicking the words. The bar shows the
     title; the 🏷️ card is where you write it, in the same `.lanebox` the
     `editing-card` writes a clause in. */
  .navbar .brand .ph { color: var(--muted); font-weight: 400; }
  /* dev chrome, deliberately off the design system: dashed, monospace, and
     since Ed 2026-08-19 **bottom-left** — a stagehand stands in the wings,
     and the top-left corner is where the document's own first clause begins */
  /* the alpha flag (Ed, 2026-08-20): docs.vote is a real address people
     are being invited to, and a document drafted in an alpha is a
     document whose room deserves to know. Bottom-left, quiet, and out of
     the way of everything: it asks nothing of you, so by the palette's
     own rule it takes no hot colour and no glyph — a permanent banner
     that shouted would fight every card on the surface for the whole
     session. pointer-events: none, because it stands over the document's
     own margin and must never eat a click meant for the text. */
  /* once the text is confirmed the founder's editor gives way to the charter
     column session.js renders (#charter); both are in the markup, one shows */
  .doc.begun #prose, .doc.begun #prosefolds { display: none; }
  /* ?fixture=session runs the Hollow Oak charter with the constitution out of
     the way, so its geometry is the frozen session-view's to the pixel (the
     session-probe's gate); add &band=1 to see the whole composition */
  .doc.fixsession .titlerow, .doc.fixsession #band { display: none; }
  /* the stranger's door (Q455/456): the holding sentence is the one line that
     changes — who decided, what they decided, what you may do about it — and
     the charter stands as bars at real metrics: grey, because grey means
     nothing is being asked of you; ?bars=black is the experiment Ed asked to
     look at */
  /* both stand on the prose's own column (.doc .prose: 70ch, centred) */
  .doc .holding { font-size: var(--t-body); color: var(--muted); margin: var(--s4) auto var(--s5); max-width: 70ch; font-style: italic; }
  .redacted { padding-bottom: var(--s5); max-width: 70ch; margin: 0 auto; }
  .redacted .rblock { margin: 0 0 1em; }
  .redacted .rblock.h1 { margin: 1.6em 0 .6em; } .redacted .rblock.h2 { margin: 1.4em 0 .5em; } .redacted .rblock.h3 { margin: 1.2em 0 .4em; }
  .redacted .bar { display: block; height: .72em; border-radius: 3px; background: var(--border); margin: .42em 0; }
  .redacted .h1 .bar { height: 1.1em; } .redacted .h2 .bar { height: .95em; } .redacted .h3 .bar { height: .85em; }
  .redacted.black .bar { background: var(--fg); }
  .alphaflag { position: fixed; bottom: 10px; left: 10px; z-index: 55;
    font-size: var(--t-small); color: var(--muted); background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    padding: 3px 8px; pointer-events: none; }
  .alphaflag b { font-weight: 600; color: var(--fg); }
  /* the stagehand stands above the flag rather than on it */
  .devswitch { position: fixed; bottom: 47px; left: 10px; z-index: 60;
    font: 11px/1.4 ui-monospace, Consolas, monospace; color: var(--muted);
    background: var(--bg); border: 1px dashed var(--border); border-radius: 6px;
    padding: 4px 8px; opacity: 0.85; }
  .devswitch select { font: inherit; color: var(--fg); border: none; background: transparent; }
  .devswitch button { font: inherit; color: var(--muted); background: transparent;
    border: 1px dashed var(--border); border-radius: 4px; cursor: pointer; padding: 1px 6px; }

  /* **The column invites you before it asks you** (Q513(c), Ed 2026-08-21).
     📄 is the constitution's last clause, so the text is the last thing the
     founding asks for — but the column it will be written in exists from the
     save, and a founder who came here to write should not have to answer
     eighteen questions before they may. From the save the well says so, in
     grey, asking nothing; at 📄's own turn it becomes the paste-well below.
     The save is the moment because it is the first moment there is anywhere
     to put the words: before it nothing is stored anywhere. */
  .prose.empty.writeready::before {
    content: "Start writing whenever you like.AA The document's own words are the last thing the constitution settles, so nothing here is being asked of you yet.";
    white-space: pre-wrap; color: var(--muted); font-size: var(--t-body); line-height: 1.6;
  }
  /* the paste-well: the empty state of the prose column, and nothing more */
  .prose.empty.pasteready::before {
    content: "Paste the text this document starts from, or begin typing it.\A\A Markdown headings become its sections, and the contents appear beside you as you go.";
    white-space: pre-wrap; color: var(--muted); font-size: var(--t-body); line-height: 1.6;
  }


  /* the controls the share box took with it, now on the 📍 and 🪪 cards */
  .setupcard textarea { width: 100%; font-size: var(--t-ui); padding: var(--s2);
    resize: vertical; min-height: 60px; }
  /* **The shape of a labelled card button here; its ground belongs to what
     the button IS.** This used to set the ground too, which tied with
     system.css's `.btn.btn-approve` and won on order — leaving white on
     white — so the approve look was restated at this scope to beat it. That
     restatement is what kept a *disabled* commit wearing the live accent:
     three files described one button and the last one loaded won, and the
     disabled rules all lived in the two that lost. Shape here, ground in the
     design system (system.css for an approve, setup.css for an emoji commit
     and for every disabled one), and no rule states a colour twice. */
  .setupcard .btn:not(.glyphbtn) { font: inherit; font-size: var(--t-cap); padding: var(--s1) var(--s3);
    cursor: pointer; border-width: 1px; border-style: solid; border-radius: var(--r-sm); }
  .setupcard .btn:not(.glyphbtn):not(.btn-approve) { background: var(--bg); border-color: var(--border); }
  .setupcard .btn:not(.btn-approve):hover { border-color: var(--primary); color: var(--primary-emphasis); }
  .pf.waiting { color: var(--muted); }

  /* ---- what is unlocked, and what is waiting ----------------------------- */
  .stage-REMOVED { display: none;
    font-size: var(--t-small); }
  .stage .nm { font-weight: 600; }
  .stage .st { color: var(--muted); font-size: var(--t-cap); margin-left: auto; text-align: right; }
  .stage.live .nm, .stage.live .st { color: var(--ok); }
  .stage .mkg { flex: none; }
  .stage.wait .mkg { visibility: hidden; }
</style>

<script>
(function () {
  const { esc, TICK, avHtml, avatarOptions, bandHtml, fitBand, railEntry, cardHtml, watchBody,
    nameBody, pictureBody, opt, num, someIn, ANSWER, stateOf,
    MAILS, renderMailModal, gateBody, wirePicDrop, pileHtml, readBody,
    motionBody, motionReopen, routeFor, motionCommitHtml, BLINDNOTE } = window.SETUP;
  // **A setup card opens and closes like a decision card** (Ed, 2026-08-18:
  // *the whole point of building off session-view is that we would have all
  // this stuff*): cards.js own expandCard/collapseCard, which have been
  // sitting in the shared module since the lift — the card grows out of its
  // own head, and every way of leaving it rolls it back into its paragraph.
  const CC = window.CARDS.make({ onExpand: () => SESSION.drawWires() });
  // one rendering of stored text as document lines — the settled 📄 card
  // and the live document column must escape and wrap identically
  const textDivs = (text) => String(text).split(/\n/).filter((l) => l.trim())
    .map((l) => { const m = l.match(/^(#{1,3})\s+(.*)$/);
      return m ? '<div class="docline lvl' + m[1].length + '" data-h="' + esc(m[2]) + '">' + esc(m[2]) + '</div>'
        : '<div>' + esc(l) + '</div>'; }).join('');
  let lastOpen = null;
  // **An opened card puts the caret in its composer** (Ed, 2026-08-21): if a
  // card is asking for words, you should be able to type them without first
  // going to find the box. Three rules keep it from becoming a nuisance.
  // **Only on the opening** — the surface re-renders wholesale on every
  // change and on the 4s poll, so focusing anywhere but here would pull the
  // caret out from under whatever you were typing. **Only onto something you
  // type into**: the first text-entry control in the card's own DOM order,
  // never a radio, a date, a button or a bare number. And **preventScroll**,
  // because the card is mid-expansion and a focus that scrolls fights the
  // animation it is landing in. The caret goes after any text already there,
  // so typing extends a draft that survived a close rather than sitting in
  // front of it (`setSelectionRange` throws on email inputs, hence the try).
  // **An opening card focuses its main decision** (Ed, 2026-08-22), which
  // reverses the narrower rule built the day before — *only onto something
  // you type into, never a radio* — and reverses it for a good reason: on a
  // card whose decision **is** a radio, refusing to focus radios did not
  // leave focus alone, it sent the caret **past** the decision into the
  // rationale lane below. The card asked *which of these* and put your cursor
  // in the box for explaining yourself.
  //
  // The main decision is **the first interactive control in the card's own
  // DOM order**, which needs no per-card list because the card grammar
  // already puts the decision first: the values, then the rationale, then the
  // commit row. It falls out right everywhere — 🌍 focuses its first rung,
  // ⏱️ its first number (the delegate rung is *set apart after the values*,
  // so it can never be first), 🪶 its title lane, 📧 its address, a motion
  // card the value it is proposing rather than the reason for it.
  //
  // Two refinements. The commit row is excluded: it is where the card ends,
  // never what it asks. And within a chosen radio group the focus goes to the
  // **chosen** option rather than the first, because where a decision stands
  // is the decision.
  const DECIDE_SEL = ['[data-titlelane]', 'textarea:not([disabled])',
    'input[type="text"]:not([disabled])', 'input[type="email"]:not([disabled])',
    'input[type="number"]:not([disabled])', 'input[type="datetime-local"]:not([disabled])',
    'input:not([type]):not([disabled])',
    '[contenteditable=""]', '[contenteditable="true"]',
    '[data-set]:not([disabled])', '[data-ans]:not([disabled])',
    '[data-mval]:not([disabled])', '[data-v]:not([disabled])'].join(',');
  const chosenOf = (el) => {
    const group = el.closest('.choice, .lanepick, .field') || el.parentElement;
    if (!group) return el;
    const on = [...group.querySelectorAll('[aria-checked="true"], [aria-pressed="true"], .on')]
      .find((x) => x.matches(DECIDE_SEL) && x.offsetParent !== null);
    return on || el;
  };
  const focusComposer = (card) => {
    if (!card) return;
    const el = [...card.querySelectorAll(DECIDE_SEL)]
      .find((x) => x.offsetParent !== null && !x.closest('.commitrow'));
    if (!el) return;
    const isPick = el.matches('[data-set],[data-ans],[data-mval],[data-v]');
    const target = isPick ? chosenOf(el) : el;
    // focus is not a press: a radio is only put under the keyboard, never
    // chosen — choosing stays the click it always was
    try { target.focus({ preventScroll: true }); } catch (e) { target.focus(); }
    if (isPick) return;
    // the caret goes *after* what is already there, so typing extends a draft
    // that survived a close rather than sitting in front of it
    if (typeof el.value === 'string' && el.setSelectionRange) {
      try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* email/number */ }
    } else if (el.isContentEditable) {
      const r = document.createRange();
      r.selectNodeContents(el); r.collapse(false);
      const sel = window.getSelection();
      if (sel) { sel.removeAllRanges(); sel.addRange(r); }
    }
  };
  // run the close animation, then the state change it was closing for
  const closeThen = (fn) => {
    const el = document.querySelector('.setupcard');
    if (!el) { fn(); return render(); }
    CC.collapseCard(el, () => { fn(); render(); });
  };
  // **Clicking a rail entry travels to its card** (Ed, 2026-08-21). The
  // charter's rail has done this for as long as it has existed — session.js's
  // `bringIntoView`, aimed at the reading line — but the constitution's rail
  // never did: it set the open card and re-rendered, so a task whose clause
  // sat below the fold opened somewhere the reader could not see and the
  // press looked like it had done nothing.
  //
  // **Only from the rail.** A tab in the band is already where you are
  // looking, and *the tab you click does not move* is the one geometric
  // promise this surface makes; scrolling on a tab press would break it.
  // The same two rules as the charter's: leave the page alone if the card is
  // already sitting comfortably, and aim at the reading line rather than the
  // top of the viewport. It borrows session.js's own scroll so the probes'
  // instant-jump seam applies here too.
  const scrollToCard = (k) => requestAnimationFrame(() => {
    const el = document.querySelector('.setupcard') ||
      document.querySelector('#band [data-para="' + k + '"]');
    if (!el) return;
    const y = el.getBoundingClientRect().top;
    if (y >= 100 && y <= 300) return;
    SESSION.smoothScrollBy(y - 150, () => { SESSION.layoutQueue(); SESSION.drawWires(); });
  });
  // switch the open card in place: the box's height glides from the old
  // card's to the new card's while the contents crossfade — the strip in the
  // gutter belongs to both, so it never moves and never blinks
  const MORPH_MS = 190;
  const morphTo = (k) => {
    const was = document.querySelector('.setupcard');
    const h0 = was ? was.offsetHeight : 0;
    S.open = k; lastOpen = k;            // the morph is the entrance — no expandCard
    render();
    const el = document.querySelector('.setupcard');
    // a morph is an opening too — it sets lastOpen itself, so it never
    // reaches render's open branch and has to put the caret in place here
    focusComposer(el);
    if (!el || !was) return;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const h1 = el.offsetHeight;
    // the head keeps the strip (the tab you clicked must not blink), so only
    // the body crossfades; the head's sentence swaps in place
    const parts = window.CARDS.cardBody(el);
    el.style.clipPath = 'inset(-60px -100px 0 -100px)';
    el.style.height = h0 + 'px';
    parts.forEach((c) => { c.style.opacity = '0'; });
    void el.offsetHeight;
    el.style.transition = 'height ' + MORPH_MS + 'ms cubic-bezier(.22, .61, .36, 1)';
    el.style.height = h1 + 'px';
    parts.forEach((c) => {
      c.style.transition = 'opacity ' + (MORPH_MS - 40) + 'ms ease-out 40ms';
      c.style.opacity = '1';
    });
    setTimeout(() => {
      el.style.height = ''; el.style.clipPath = ''; el.style.transition = '';
      parts.forEach((c) => { c.style.opacity = ''; c.style.transition = ''; });
      SESSION.drawWires();
    }, MORPH_MS + 10);
  };
  const prose = document.getElementById('prose');
  const titleEl = document.getElementById('titletext');
  const band = document.getElementById('band');
  const rail = document.getElementById('rail');

  // ---- the module keeps truth (plan 367a): @draft/constitution ----------
  // The page keeps rendering, its copy, and the provisional layer — radio
  // positions, unsent answers, a motion being typed. Everything the ROOM
  // holds — settled values, delegations, blind counts, resolutions, gates,
  // motions, the membership — lives in the ConstitutionSession, born at
  // the save (§9.7a: until the link exists, nothing does, anywhere).
  const M = window.CONSTITUTION;
  let cs = null;
  // ---- the charter column (stage 8) --------------------------------------
  // Confirmed text renders as clauses through session.js; the founder's
  // editor (#prose) is for the text before it exists. FIX is the Hollow Oak
  // session fixture when the page runs as ?fixture=session.
  let FIX = null;
  let charterKey = null;
  const charterOn = () => !!(cs && cs.textConfirmed);
  function syncCharter() {
    if (isStranger()) return syncStrangerCharter();
    const on = charterOn();
    // the close re-keys the column: the backlog and the signatures are blocks of the closed document, and a new signature is a new block
    const closeKey = cs && cs.closed ? '␀closed:' + closeSignatures().length + ':' + undecidedCount() : '';
    const key = !on ? '' : (FIX ? '␀fixture' : cs.text) + closeKey +
      (mayPropose() ? ' P' : '') + (mayJudge() ? ' J' : '');
    // live, the items are rebuilt on every movement the poll sees (the
    // text only when it changed) — except under a draft being typed, where a
    // rebuild would take the caret; the rail alone refreshes then
    const typing = SESSION.openId === 'draft-yours';
    if (key !== charterKey) {
      charterKey = key;
      SESSION.setData({
        DOC: !on ? [] : (FIX ? FIX.DOC : blocksOf(cs.text)).concat(closedBlocks()),
        SUGGS: !on ? [] : LIVE_HOOKS.items ? LIVE_HOOKS.items() : FIX ? FIX.SUGGS.concat(FIX.CLOSED ? FIX.CLOSED.items : []) : [],
      });
    } else if (on && LIVE_HOOKS.items && !typing) {
      SESSION.setData({ SUGGS: LIVE_HOOKS.items() });
    } else {
      SESSION.refreshRail();
    }
  }
  // based at load time so a stamp renders as today, not 1970 — commands
  // still advance it by one, and the module only ever reads differences
  let T = Date.now();               // the logical clock every command stamps
  const now = () => ++T;
  const FOUNDER = 'founder';
  // ---- live mode (Q391b): the page served by the product server ---------
  // /d/:slug is a real document: identity is the cookie, view() is the only
  // read, commands are POSTs (serialized, so the server folds them in the
  // order they were made), and the page keeps only the provisional layer.
  // '/' is birth mode (§9.7a): a brand-new unsaved document — the email
  // step mints the creation mail, pasted text syncs to the pending stash
  // (v0.55), and the save is following the mailed link. Anywhere else
  // (localhost:8137/session-view.html, file) the fixture runs as before.
  const LIVEMODE = location.pathname.startsWith('/d/');
  const BIRTH = location.pathname === '/';
  const LIVESLUG = LIVEMODE ? decodeURIComponent(location.pathname.split('/')[2] || '') : null;
  const api = {
    chain: Promise.resolve(),
    birth: null, // {pendingId, devLink, slug} once the creation mail is sent
    post(path, body) {
      return fetch(path, { method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body || {}) }).then((r) => r.json());
    },
    cmd(name, args) {
      // resolves with the server's answer ({ok, result} or {error}) after the
      // refresh that follows it — a hook that has to act on a refusal (a
      // stale base under a text proposal) reads it here
      let answer = null;
      this.chain = this.chain
        .then(() => this.post('/api/d/' + LIVESLUG + '/cmd', { cmd: name, args: args || {} }))
        .then((res) => { answer = res; if (res && res.error) console.warn('[live]', name, res.error); })

  Object.defineProperty(S, 'emailSent', {

  const me = () => ({ n: S.myname, pic: S.mypic });

  // see the chamber card.
  const members = () => S.roster.filter((p) => p.role !== 'clerk');

  const arrived = () => (cs ? cs.E() : members().filter((m) => m.in).length);

  const meRow = () => S.roster.find((p) => p.founder);
  const iDraft = () => { const m = meRow(); return !!m && m.role !== 'clerk'; };
  const quorumCount = () => {
    const st = csState('quorum');
    if (st && st.value) return Math.min(M.quorumCount(st.value, E()), E());
    return (S.quorumForm === 'share'
      ? Math.max(1, Math.round(E() * S.quorumPct / 100)) : Math.min(S.quorumN, E()));

  const endingVal = () => takenOf('ending') ||

  const perpetual = () => endingVal() === 'never';
  const SLUG_OK = /^[a-z0-9][a-z0-9-]{2,}$/;
  const EMAIL_OK = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  // The mockup's stand-in for the real registry check: these slugs exist, so
  // a title that collides gets a short suffix — which is also why the
  // fixture's own link ends in one.
  const TAKEN = new Set(['hollow-oak-club', 'the-hollow-oak-club',
    'the-hollow-oak-club-house-charter', 'house-charter', 'charter']);
  // the module's own slug grammar (also the server's), so the address the
  // page suggests is the address the save actually takes
  const slugify = M.slugify;
  // deterministic, so the mockup behaves the same on every load
  const suffix = (t) => Math.abs([...t].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) | 0, 7))
    .toString(16).slice(0, 4);
  // Q460/462b: the address is asked before the email and checked live —
  // {slug, available, suggestion} for the last address the server was asked
  // about. The fixture keeps its TAKEN set; the birth asks /api/slug/:slug.
  // the verdict is swapped in place while you type — a re-render would
  // throw the caret out of the field
  const slugNoteHtml = () => (slugRefused()
    ? '<p class="setnote"><b>docs.vote/' + esc(S.slug) + '</b> is taken.' +
      (S.slugFree.suggestion ? ' <b>docs.vote/' + esc(S.slugFree.suggestion) + '</b> is free.' : '') + '</p>'
    // Q534c: the address the title actually wanted, and where this one
    // landed — naming both is the whole point, since the alternative is the
    // machine choosing an address and not mentioning it
    : S.slugTaken ? '<p class="setnote">Suggested from the title — <b>docs.vote/' + esc(S.slugTaken) + '</b> is taken, so this one is <b>docs.vote/' + esc(S.slug) + '</b>.</p>' : '');
  const refreshSlugNote = () => {
    const n = document.querySelector('[data-slugnote]');
    if (n) n.innerHTML = slugNoteHtml();
    refreshCommit();
  };
  const slugRefused = () => !!(S.slugFree && S.slugFree.slug === S.slug && !S.slugFree.available);
  // **An address is checked because it is the address, not because it was
  // typed** (Ed, 2026-08-22: *the address was taken — we shouldn't allow it
  // to be set if it's taken*). 📍's commit has been gated on `slugRefused()`
  // for as long as it has existed, but the only thing that ever asked the
  // server was the **input** handler — so an address the founder never
  // edited had no verdict at all, and the gate stood open on an unasked
  // question. The birth pre-fills 📍 from the title, and `suggestSlug`
  // consults the fixture's own TAKEN set, which knows nothing about the live
  // host; accept the suggestion unedited and the first thing in the world to
  // ask about the address is the **send**, which answered truthfully that it
  // was taken and walked the founder back to 📍 — the right answer to a
  // question the card should have asked first, arriving at the one step that
  // mints the document.
  //
  // So the check is idempotent and callable from anywhere: `S.slugSeen` is
  // the address the last verdict was about, whatever that verdict said, and
  // asking twice about one address is free. `render` asks whenever there is
  // an address to ask about, which covers the pre-filled one and every other
  // path that sets it without a keystroke.
  // a cap on the automatic move, so a pathological server that keeps
  // offering an address it then refuses cannot become a request storm: past
  // it the collision is simply shown, which is the behaviour we started from
  let slugCheckT = null, slugAsking = null, autoSlugMoves = 0;
  const slugKnown = () => !BIRTH || S.slugSeen === S.slug;
  const checkSlug = (slug, wait = 0) => {
    if (S.slugSeen === slug || slugAsking === slug) return;
    if (!BIRTH) { S.slugFree = TAKEN.has(slug) ? { slug, available: false, suggestion: slug + '-' + suffix(S.title || slug) } : null; S.slugSeen = slug; refreshSlugNote(); return; }
    // **A creation's own reservation is not somebody else's** — Q462b, on
    // the check rather than the send. The first send reserves the address
    // for this pending creation, so asking the server about it afterwards is
    // told, truthfully, that it is taken — by us. This page knows which
    // address its own send holds, so it answers for that one rather than
    // refusing the founder their own document.
    if (api.birth && api.birth.slug === slug) {
      S.slugSeen = slug; S.slugFree = null; refreshSlugNote(); return; }
    clearTimeout(slugCheckT);
    slugAsking = slug;
    // typing waits out the keystrokes; an address that simply arrived is
    // asked about at once, so the commit is never still dark by the time
    // anybody has read the card
    slugCheckT = setTimeout(() => {
      fetch('/api/slug/' + encodeURIComponent(slug)).then((r) => r.json()).then((res) => {
        slugAsking = null;
        if (S.slug !== slug) return;
        // **The machine may pick the address, but it must say so** (Q534c,
        // Ed 2026-08-22). A suggested address that turns out to be taken
        // moves to the nearest free one *before* the founder ever meets it,
        // so the ordinary birth never opens a task that is already refused
        // — and the note says which address the title actually wanted and
        // where this one landed, because silently handing somebody a
        // suffixed address is the machine deciding without telling them.
        // Only ever on an address that is still the machine's: one the
        // founder typed keeps its refusal, which is theirs to correct.
        if (!res.available && S.slugAuto && res.suggestion && autoSlugMoves < 3) {
          autoSlugMoves++;
          if (!S.slugTaken) S.slugTaken = slug;
          S.slug = res.suggestion; S.slugFree = null;
          const f = document.querySelector('[data-slug]');
          if (f) f.value = S.slug;
          // the address it moved to is asked about in its own right on the
          // next render: the server called it free a moment ago, and this
          // page does not take that on trust when a request settles it
          refreshSlugNote(); return;
        }
        S.slugSeen = slug;
        S.slugFree = res.available ? null : { slug, available: false, suggestion: res.suggestion || null };
        refreshSlugNote();
      }).catch(() => {
        // **A verdict that cannot be got counts as one.** The commit waits
        // for the check, so an unreachable host would otherwise leave the
        // founder at a permanently dark 📍 with nothing to read and no way
        // on — worse than the bug this fixes. The send's own 409 is the
        // backstop it always was: it refuses, says why, and offers the
        // nearest free address.
        slugAsking = null;
        if (S.slug !== slug) return;
        S.slugSeen = slug; refreshSlugNote();
      });
    }, wait);
  };
  const suggestSlug = (title) => {
    const base = slugify(title);
    if (!base || base.length < 3) return { slug: 'untitled-' + suffix(title || 'x'), taken: null };
    // the fixture's TAKEN set is the Hollow Oak world's, so at a live birth
    // it can neither confirm nor deny an address — and the note it drives
    // says *already exists*, which would be a claim the page has not
    // checked. Suggest the plain address there and let the live check answer.
    return (!BIRTH && TAKEN.has(base)) ? { slug: base + '-' + suffix(title), taken: base } : { slug: base, taken: null };
  };
  // **The address is the machine's until you touch it** (Q534c), which is
  // exactly what makes it safe to swap for a free one: the live check may
  // move a *suggested* address out from under a collision, and must never
  // move one the founder typed — there the refusal is the answer and the
  // correction is theirs. One place sets it, and the one act that can make
  // the address yours clears it.
  const fillSuggestedSlug = () => {
    const sg = suggestSlug(S.title);
    S.slug = sg.slug; S.slugTaken = sg.taken; S.slugAuto = true;
  };

  // ---- the document ------------------------------------------------------
  function relabel() {
    const sel = getSelection();
    const at = sel.rangeCount ? sel.getRangeAt(0).startContainer : null;
    for (const b of [...prose.children]) {
      const t = b.textContent;
      const m = t.match(/^(#{1,3})\s+/);
      if (m) {
        const liveHere = at && b.contains(at);
        b.textContent = t.slice(m[0].length);
        b.className = 'docline lvl' + m[1].length;
        b.dataset.h = b.textContent;
        if (liveHere && b.firstChild) {
          const r = document.createRange();
          r.setStart(b.firstChild, 0); r.collapse(true);
          sel.removeAllRanges(); sel.addRange(r);
        }
      } else if (b.className) { b.dataset.h = t; } else { delete b.dataset.h; }
    }
    prose.classList.toggle('empty', prose.textContent.trim() === '');
    renderToc(); render();
  }
  // **Headings fold with ▸s, mirrored in the table of contents** (Ed,
  // 2026-08-19). The control is session-view's own sectoggle; in the prose
  // the triangles live on an overlay rail, because a button inside a
  // contenteditable region would become text the harvest reads.
  const secToggleHtml = (key) => window.CARDS.secToggleHtml(key, !S.folded.has(key));
  function applyProseFolds() {
    let hideLvl = null;
    for (const b of [...prose.children]) {
      const isH = b.dataset.h !== undefined;
      const lvl = isH ? +((b.className.match(/lvl(\d)/) || [0, 9])[1]) : 9;
      if (isH && hideLvl !== null && lvl <= hideLvl) hideLvl = null;
      const hidden = hideLvl !== null;
      b.classList.toggle('pfolded', hidden);
      if (isH && !hidden && S.folded.has('ph:' + b.dataset.h)) hideLvl = lvl;
    }
    positionProseToggles();
  }
  function positionProseToggles() {
    let rail = document.getElementById('prosefolds');
    if (!rail) {
      rail = document.createElement('div'); rail.id = 'prosefolds';
      prose.parentElement.insertBefore(rail, prose);
    }
    const hs = [...prose.children].filter((b) => b.dataset.h !== undefined && !b.classList.contains('pfolded'));
    // measured, not offsetTop: the rail and the blocks answer to different
    // offset parents, and a rect delta is true whatever the ancestry
    const rTop = rail.getBoundingClientRect().top;
    rail.innerHTML = hs.map((b) =>
      '<span style="top:' + (b.getBoundingClientRect().top - rTop).toFixed(1) + 'px">' +
      secToggleHtml('ph:' + b.dataset.h) + '</span>').join('');
  }
  // The constitution's sections lead the table of contents, then the title;
  // the charter's own headings follow — from #prose while the founder is
  // still writing, from session.js's DOC once the text is confirmed.
  function tocLead() {
    const hs = charterOn() ? [] : [...prose.children].filter((b) => b.dataset.h !== undefined);
    // the constitution's sections lead the table of contents (Ed,
    // 2026-08-18); on this surface they appear as their cards do
    // the outline lists only what exists: before the save there is no
    // constitution to point at (Ed, 2026-08-18)
    return (!settled(card('myemail')) ? '' :
      '<li class="lvl1">' + secToggleHtml('cs-constitution') + '<a href="#cs-constitution">Constitution</a></li>' +
      secLive().filter((s2) => !s2.railOnly).map((s2) =>
        '<li class="lvl2">' + secToggleHtml('cs-' + s2.key) + '<a href="#cs-' + s2.key + '">' + esc(s2.title) + '</a></li>').join('') +
      '<li class="lvl1"><a href="#dochead">' + esc(S.title || 'Untitled') + '</a></li>') +
      hs.map((b, i) => {
      b.id = 'h' + i;
      const lvl = (b.className.match(/lvl(\d)/) || [0, 2])[1];
      return '<li class="lvl' + lvl + '">' + secToggleHtml('ph:' + b.dataset.h) + '<a href="#h' + i + '">' + esc(b.dataset.h) + '</a></li>';
    }).join('');
  }
  function renderToc() { SESSION.renderToc(); }
  prose.addEventListener('paste', (ev) => {
    ev.preventDefault();
    const txt = (ev.clipboardData || window.clipboardData).getData('text');
    let lines = txt.split(/\n{2,}|\n/).filter((l) => l.trim());
    const first = lines[0] && lines[0].match(/^#\s+(.+)$/);
    if (first && !S.title) { S.title = first[1]; lines = lines.slice(1);
      S.seen.add('title');
      if (!S.slug) { fillSuggestedSlug(); } }
    document.execCommand('insertHTML', false, lines.map((l) => '<div>' + esc(l) + '</div>').join(''));
    setTimeout(relabel, 0);
  });

  // ---- the nineteen decisions ----------------------------------------------
  // **One card per decision, and the test is whether somebody could answer it
  // differently and on its own** (Ed, 2026-08-18: *break them down as much as
  // you can — picture and name separate! — admin choosing if they're a
  // participant — etc*). Both of his examples are the same fault: two questions
  // of *different kinds* bundled into one card because they happened to be asked

  const DELEGABLE = ['ending', 'barBy', 'quorumBy', 'authorship', 'signing',
    'judgments', 'rateBy', 'chamber', 'auditor', 'lapse', 'removal', 'policyBy'];
  const delegated = (key) => DELEGABLE.includes(key) && S[key] === 'roster';

  // the members will be able to do.
  const GATES = [
    // **The gate clauses wait for 🍾** (Q529, Ed 2026-08-22: *let's try
    // that*). They used to arrive the moment their position in the founding
    // order was reached, because a gate is skipped as a blocker — so crossing
    // into Proposals delivered the section heading, the preamble and **both**
    // gate clauses in one frame, three paragraphs where every other step of

    // pacing trick: it is where they are actually decided, and 🍾's own card
    // states them as part of its batch. So the Proposals section now fills a
    // clause at a time like every other, and the two gates arrive together at

    //
    // This supersedes the ⏳-tab-in-the-band waiting state for these two.

    { k: 'canpropose', g: '💡', t: 'Proposing', own: 'you', isGate: true,

      why: 'Anybody can read the document from the first second. Nobody can propose a change until the document begins — the text a proposal is made against is decided as part of the start, and so are the rules a proposal is judged under.',

      open: () => canJudge(),
      why: 'A judgment counts towards quorum, and whether your name goes on it is one of the rules being decided. Settling those afterwards would change what the judgment meant, so they come first.',
      waiting: 'Waiting on the constitution.',
      done: 'Open — the constitution is settled.',
      blockers: () => ceremony().filter((c) => !settled(c) || (isRoom(c) && (c.in || 0) < E())) },
    // **No power arrives without acknowledgment** (Q448/453, 2026-08-21): a

    // **🏛️ arrives with the first blind question you are asked** (Q605 (a), Ed
    // 2026-08-22): for an invitee arriving into a founding with open

    // it keeps as the fallback. `early` is the override: the card is visible

    // above it in the order, and it hangs off that first question's
    // paragraph (`voiceHost`) rather than ⚖️'s, because the voice is what
    // the question is answered with. It still blocks nothing (a gate).
    { k: 'grant-voice', g: '🏛️', t: 'Your Voice', own: 'you', isGate: true, isGrant: true,
      open: () => !!cs && viewerIsMember() && !!viewerRow().in,
      early: () => firstAsked() !== null,
      why: 'Every member holds one voice in every constitutional question — the blind founding answers before the document begins, the ask-everyone motions after. One at a time, and it comes back whole when the question settles or you withdraw it.',
      waiting: 'Waiting on your arrival.',
      done: 'You hold a voice in every constitutional question.',
      blockers: () => [] },
    // **A grant is the holder's** (SURFACE E8's audience column, enforced here
    // since Q639). ✒️ and 🛡️ arrive in the founder's hands alone, and `open`
    // has always said so — but nothing hid them, so a *member* was served two
    // ⏳ tabs titled *Your Pen* and *Your Shield* about somebody else's powers,
    // which they could never acknowledge and were never asked to. It went
    // unnoticed while the pair wrote clauses of their own (a member read the
    // count and the tab had a sentence beside it); with the clauses retired it
    // would have left two unexplained tabs on the Founded line. What the
    // founder holds is stated where it bites — on each setting's own clause,
    // by `holderLine` — which is the whole of Ed's argument for retiring them.
    { k: 'grant-pen', g: '✒️', t: 'Your Pen', own: 'you', isGate: true, isGrant: true,
      hide: () => !amFounder(),
      open: () => !!cs && amFounder() && holdsPenAnywhere(),
      why: 'The pen amends a setting at will, where it turns — each setting’s ✒️ tab says whether it does. One pen, many locks, and a pen is not spent. It was issued when the address went live, because that is the moment somebody could first knock.',
      waiting: 'Waiting on the save.',
      done: 'You hold the pen.',
      blockers: () => [] },

    // very important for them to understand what they can and can't do*). The

    // one OK cover both; the objection is exactly the rule *no power arrives

    // writes, one only refuses — and a founder who has pressed OK on a single
    // card saying "your powers" has learned one thing where there were two.

    // rather than the pen's exception, and stands alongside 🌍 the way a grant
    // always has. That also leaves the rail at the save holding the pen alone,

      open: () => !!cs && amFounder() && holdsShieldAnywhere(),
      why: 'The shield refuses. Where you hold it, a change the membership passes waits for you to accept it — you cannot write with it, only refuse. One shield, many locks, and a shield is not spent. It was issued with the pen, when the address went live.',
      waiting: 'Waiting on the save.',
      done: 'You hold the shield.',
      blockers: () => [] },

    { k: 'begin', g: '🍾', t: 'Begin', own: 'you', isGate: true, isBegin: true,

      hide: () => !amFounder() && !constituted(),
      why: '', waiting: '', done: '', blockers: () => [] },

  // 🪶 (Ed, 2026-08-19) — the quill, retiring the drawn home plate of the
  // same morning: the title is the document's first act of writing.
  const CARDS = [
    // — the opening order is Ed's, card by card (2026-08-18): **title →
    // email (verified) → link → the rest**. The first three are the order
    // of existence — a name, the address that can always get back in, the

    // saved document. Each is born when the one before it settles, so
    // arriving at docs.vote you are asked exactly one thing.

    // paragraph restates it; the heading opens the card
    { k: 'title', g: '🪶', t: 'Title', kind: 'ordinary', inDoc: true, changeable: true,
      ready: () => !!S.title },
    // **The birth is 🪶 → 📍 → 📧** (Q460, Ed 2026-08-20): the link is
    // pre-filled from the title, checked live against the addresses that
    // exist or are reserved, and chosen *before* the email — so all three
