     html/head/body, so a screen reader was handed English copy with no voice
     to read it in. **No doctype, deliberately** — there has never been one,
     the page has always rendered in quirks mode (`document.compatMode` is
     `BackCompat`), and adding one would re-measure every box on the surface.

     stands first and this note stands under it — the charset declaration has

<title>docs.vote</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪶</text></svg>">

<style>
/* ============================================================================
   document-creation — **the document, from its first minute.**

   Five notes built this, in order, and each one made the screen less of a form:

   1. *Something that looks like the document itself; the admin pastes the text
      into the space where it will later be edited, the ToC appears on cue, they
      click the placeholder title in the topbar, and the sidebar holds cards with
      each of the questions they need to decide.*
   2. *Can we import as much of the session-view as we can? I think ultimately
      this will literally be the session view.*
   3. *You can start inviting people immediately after creating the document …
      and as soon as you've confirmed the starting text they can start making
      proposals … and judgements unlock as soon as everyone is ready.*
   4. *Ceremony and admin cards are absolutely just queue-cards. Instead of
      modals they open cards in the document at the top, above the text, pushing
      it down like decision-cards do a clause. They have cables and tabs.*
   5. *I'd like all of these tabs to act like clause-tabs and pile like clause
      tabs. The founder's settings sit in one pile, and members' in the
      pile below. … Go through every decision each role needs to make and turn it
      into a queue-card. Break them down as much as you can.*

   The third changed the model — there is no moment when the document "opens".
   The fourth retired the modal. The fifth retired the last two inventions on the
   screen: the flat tab group, which is now two `chip-gutter` piles like
   everything else, and the compound card, which was a form in card's clothing.
   **One decision, one card**, and the test is whether somebody could answer it
   differently and on its own: a picture and a name are two questions, and so are
   a membership and whether the founder is in it. What is *not* split is a
   parameter and its own value — *rising, 55% → 78%* is one thought, and cutting
   it in half would be splitting a sentence rather than a decision. The same test
   cuts the other way twice, on 2026-08-18: *when it ends* swallowed *whether it
   ends*, because **never** is one of the answers to *when*; and the stake stopped
   being a card at all, because it is a flat 1 in the mechanism and a card for it
   was offering a decision nobody has. Then ✒️ split the other way on Ed’s Q341 rethink — the close bar is consent where the ramp is pacing, two kinds — so seventeen became eighteen — and 💤 *Do memberships lapse?* (Ed, closing Q345) made it nineteen,
   which is the count as it stood in August 2026 and not today's. **The catalogue holds eighteen settings** (SPEC §9.7.1): 🌡️ and 🪜 left the surface
   with the bar itself (Q1362 (b), R-117) and 🧭's presets left the birth (Q1363), each keeping whatever the engine needs to replay an older log.

   What is left in this file is its own fixture and the bodies of the cards a
   founder fills in. The piles, the strip, the cable, the rail entry, the card
   shell, the read-only and watching bodies and the identity cards are in
   `setup.js`, because the founding ceremony is this same screen seen by
   somebody else.
   ========================================================================== */

  /* **The title is not edited in the topbar** (Ed, 2026-08-18). It had been a
     contenteditable in the bar, which is the one place on this screen that is
     not a card — so the title was the single setting with no card behind it, no
     confirm, and no way back to it except clicking the words. The bar shows the
     title; the 🏷️ card is where you write it, in the same `.lanebox` the
     `editing-card` writes a clause in. */
  .navbar .brand .ph { color: var(--muted); font-weight: 400; }
  /* dev chrome, deliberately off the design system: dashed, monospace, and
     since Ed 2026-08-19 **bottom-left** — a stagehand stands in the wings,
     and the top-left corner is where the document's own first clause begins */
  /* the alpha flag (Ed, 2026-08-20): docs.vote is a real address people
     are being invited to, and a document drafted in an alpha is a
     document whose room deserves to know. Bottom-left, quiet, and out of
     the way of everything: it asks nothing of you, so by the palette's
     own rule it takes no hot colour and no glyph — a permanent banner
     that shouted would fight every card on the surface for the whole
     session. pointer-events: none, because it stands over the document's
     own margin and must never eat a click meant for the text. */
  /* once the document begins the founder's editor gives way to the charter
     column session.js renders (#charter); both are in the markup, one shows.
     It used to give way at 📄's OK; the OK is an acknowledgement that the
     column will become the text, not the act of setting it, so the column
     stays until 🍾 (Q819) — which is also the moment the text stops being
     anybody's to type and starts changing by proposal. */
  .doc.begun #prose, .doc.begun #prosefolds { display: none; }
  /* ?fixture=session runs the Hollow Oak charter with the constitution out of
     the way, so its geometry is the frozen session-view's to the pixel (the
     session-probe's gate); add &band=1 to see the whole composition */
  .doc.fixsession .titlerow, .doc.fixsession #band { display: none; }
  /* the stranger's door (Q455/456): the holding sentence is the one line that
     changes — who decided, what they decided, what you may do about it — and
     the charter stands as bars at real metrics: grey, because grey means
     nothing is being asked of you; ?bars=black is the experiment Ed asked to
     look at */
  /* both stand on the prose's own column (.doc .prose: 70ch, centred).
     Keyed on the **id**, never the class: `holding` is the propose hold's own
     class (session.js's flyStart), and this rule on a class matched the ✏️
     button too — `margin: auto` on a flex item in the commit row slid it to
     the middle of the row for the length of a hold (entry 59) */
  .doc #holding { font-size: var(--t-body); color: var(--muted); margin: var(--s4) auto var(--s5); max-width: 70ch; font-style: italic; }
  .redacted { padding-bottom: var(--s5); max-width: 70ch; margin: 0 auto; }
  .redacted .rblock { margin: 0 0 1em; }
  .redacted .rblock.h1 { margin: 1.6em 0 .6em; } .redacted .rblock.h2 { margin: 1.4em 0 .5em; } .redacted .rblock.h3 { margin: 1.2em 0 .4em; }
  .redacted .bar { display: block; height: .72em; border-radius: 3px; background: var(--border); margin: .42em 0; }
  .redacted .h1 .bar { height: 1.1em; } .redacted .h2 .bar { height: .95em; } .redacted .h3 .bar { height: .85em; }
  .redacted.black .bar { background: var(--fg); }
  /* narrow: the dock owns the foot of the window and nothing may sit over the
     text, so the flag is a strip in the flow under the topbar */
  @media (max-width: 900px) { .alphaflag { position: static !important; display: block; width: fit-content; margin: 8px auto 0; } }
  .alphaflag { position: fixed; bottom: 10px; left: 10px; z-index: 55;
    font-size: var(--t-small); color: var(--muted); background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    padding: 3px 8px; pointer-events: none; }
  .alphaflag b { font-weight: 600; color: var(--fg); }
  /* **The red flag** (Q1346, Ed: *just a red flag on the page*): a document
     whose saves the store rejects says so where the alpha flag stands, in
     the one red the surface otherwise reserves (`--slash`). Fixed on wide,
     a strip on narrow like the alpha flag; never eats a click. */
  .stalledflag { position: fixed; bottom: 40px; left: 10px; z-index: 56;
    font-size: var(--t-small); color: #fff; background: #c1121f;
    border: 1px solid #a00e19; border-radius: var(--r-sm);
    padding: 4px 10px; pointer-events: none; max-width: 320px; }
  .stalledflag b { font-weight: 600; }
  @media (max-width: 900px) { .stalledflag { position: static; display: block; width: fit-content; max-width: none; margin: 8px auto 0; } }
  /* **The pause modal** (Q1345, Ed: *a modal pop up … with a progress bar
     that guesses how long the downtime will be*): the ground darkens, one
     box says the document is paused and roughly for how long, and the bar
     fills over the host's guess, holding short of full until the host
     answers again. On the design system — it is product, not stagehand. */
  .pausemodal { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center;
    background: rgba(33, 37, 41, 0.45); padding: var(--s4); }
  .pausemodal .box { background: var(--bg); border-radius: var(--r-lg); box-shadow: var(--shadow-xl);
    padding: var(--s5); max-width: 420px; width: 100%; }
  .pausemodal .lead { font-size: var(--t-lead); font-weight: 600; margin: 0 0 var(--s2); text-wrap: balance; }
  .pausemodal .when { font-size: var(--t-body); color: var(--muted); margin: 0 0 var(--s4); }
  .pausemodal .track { height: 8px; border-radius: 4px; background: var(--light); overflow: hidden; }
  .pausemodal .track i { display: block; height: 100%; width: 0; background: var(--primary); border-radius: 4px;
    transition: width 900ms linear; }
  /* **The reconnecting bar** (Q1505, Ed 2026-09-23: *warn before anybody
     acts* — a red bar along the top, not a modal, because members may still
     want to scroll and read while they cannot submit). Directly under the
     topbar, full width, in the surface's one red (`--slash`, SURFACE §6 —
     this bar is its third use by ruling); it never eats a click, and it does
     not move, so there is no still form to give it under reduced motion.
     While it stands every commit is held: greyed as a disabled control is,
     its tooltip the reason (`data-held`, live.js). */
  .reconnectbar { position: fixed; left: 0; right: 0; top: var(--nav-h); z-index: 58;
    background: var(--slash); color: #fff; text-align: center;
    font-family: var(--font-ui); font-size: var(--t-small); line-height: 1.4;
    padding: var(--s1) var(--s3); box-shadow: var(--shadow-sm); pointer-events: none; }
  .reconnectbar[hidden] { display: none; }
  .reconnectbar b { font-weight: 600; }
  html.reconnecting [data-held] { opacity: 0.45; filter: grayscale(1); cursor: not-allowed; }
  /* the stagehand stands above the flag rather than on it */
  .devswitch { position: fixed; bottom: 47px; left: 10px; z-index: 60;
    font: 11px/1.4 ui-monospace, Consolas, monospace; color: var(--muted);
    background: var(--bg); border: 1px dashed var(--border); border-radius: 6px;
    padding: 4px 8px; opacity: 0.85; }
  .devswitch select { font: inherit; color: var(--fg); border: none; background: transparent; }
  .devswitch button { font: inherit; color: var(--muted); background: transparent;
    border: 1px dashed var(--border); border-radius: 4px; cursor: pointer; padding: 1px 6px; }
  /* the stagehand's refusal line (Q1330): bottom right, off the design
     system like the flag and the dropdown — addressed to whoever is
     debugging, not to a member. `--slash` is the one red on the surface and
     this is off it; a click dismisses, the next refusal replaces. */
  #errline { position: fixed; bottom: 10px; right: 10px; z-index: 60; max-width: 64ch;
    font: 11px/1.45 ui-monospace, Consolas, monospace; color: var(--fg);
    background: var(--bg); border: 1px solid var(--border); border-left: 3px solid var(--slash);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; box-shadow: var(--shadow-sm); }
  #errline b { display: block; font-weight: 600; margin-bottom: 2px; }
  #errline .dbg { color: var(--muted); overflow-wrap: anywhere; }

  /* **The column invites you before it asks you** (Q513(c), Ed 2026-08-21).
     The column the text will be written in exists from the save, and a
     founder who came here to write should not have to answer eighteen
     questions before they may. From the save the empty column says so, in
     grey, asking nothing, until 🍾 — keyed on the column being empty and the
     founder's (`writeready`), never on a task's turn: since backlog 204 the
     text is no task at all, 📄's OK is gone and 📝 is the door in. **Q518
     landed here** (Ed, 2026-08-29: pre-fill as a grey placeholder — not
     document text, gone at the first keystroke): the first line suggests the
     shape of a charter and the invitation follows it, one string in copy.js
     (`prose.writeready`) read off `data-placeholder`, so the words live where
     every member-readable string lives. A pseudo-element is what keeps it out
     of the flow: `proseText()` never sees it, and the `empty` class it hangs
     on goes at the first keystroke. Distinct from `.doc p.editable.blank`'s
     block placeholder in system.css, which says a block is empty; this one
     says what a charter looks like. */
  .prose.empty.writeready::before {
    content: attr(data-placeholder);
    white-space: pre-wrap; color: var(--muted); font-size: var(--t-body); line-height: 1.6;
  }


  /* the controls the share box took with it, now on the 📍 and 🪪 cards */
  .setupcard textarea { width: 100%; font-size: var(--t-ui); padding: var(--s2);
    resize: vertical; min-height: 60px; }
  /* **The shape of a labelled card button here; its ground belongs to what
     the button IS.** This used to set the ground too, which tied with
     system.css's `.btn.btn-approve` and won on order — leaving white on
     white — so the approve look was restated at this scope to beat it. That
     restatement is what kept a *disabled* commit wearing the live accent:
     three files described one button and the last one loaded won, and the
     disabled rules all lived in the two that lost. Shape here, ground in the
     design system (system.css for an approve, setup.css for an emoji commit
     and for every disabled one), and no rule states a colour twice. */
  .setupcard .btn:not(.glyphbtn) { font: inherit; font-size: var(--t-cap); padding: var(--s1) var(--s3);
    cursor: pointer; border-width: 1px; border-style: solid; border-radius: var(--r-sm); }
  .setupcard .btn:not(.glyphbtn):not(.btn-approve) { background: var(--bg); border-color: var(--border); }
  .setupcard .btn:not(.btn-approve):hover { border-color: var(--primary); color: var(--primary-emphasis); }
  /* **One commit-label size** (census F-E, 2026-08-31): the --t-cap shrink
     above serves a card body's utility buttons; a commit-row word takes
     --t-ui like the charter's, so OK on a gate and OK on a sealed record
     are one size. The row's 40px height is §9.1's and set elsewhere. */
  .setupcard .commitrow .btn:not(.glyphbtn) { font-size: var(--t-ui); }
  /* the door's head-people (CP6, Q1101): the pile's list as the card's
     standing text, quiet rows above the rule sentence */
  .headrule .headpeople { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4);
    margin-bottom: var(--s2); font-size: var(--t-ui); }
  .headpeople .hp { display: inline-flex; align-items: center; gap: 6px; }
  .headpeople .hpnone { color: var(--muted); font-size: var(--t-small); }
  .headrule .doorrule { margin-top: var(--s1); }
  .pf.waiting { color: var(--muted); }

  /* ---- what is unlocked, and what is waiting ----------------------------- */
  .stage-REMOVED { display: none;
    font-size: var(--t-small); }
  .stage .nm { font-weight: 600; }
  .stage .st { color: var(--muted); font-size: var(--t-cap); margin-left: auto; text-align: right; }
  .stage.live .nm, .stage.live .st { color: var(--ok); }
  .stage .mkg { flex: none; }
  .stage.wait .mkg { visibility: hidden; }
</style>

<header class="navbar">
  <div class="wrap">
    <!-- `quill-wallet` (Q444b, Q447): four feathers at the birth, three spent
         on the founding acts, and the one that remains IS the logo — the mark
         of docs.vote is the act of making a document. -->
    <!-- the two drawer doors, narrow only (Ed, 2026-09-12): the contents rail
         slides in from the left, the task rail from the right -->
    <button class="drawerbtn" id="drawerleft" type="button" aria-expanded="false" aria-controls="toc">☰</button>
    <!-- **The document's name is the page's first-level heading** (Q1394 (b),
         Ed 2026-09-18). `h1#doctitle` sits at the top of the document, and
         was the h1 wherever it showed — but the fixture's session and closed
         epochs hide the whole title row (`.doc.fixsession .titlerow`), so on
         those a reader found no level-one heading at all and the first
         heading was a section's `h2`. This span is the one place the title
         stands in **every** epoch, live path included, and it is first in
         reading order. It takes the heading semantics as attributes rather
         than as a tag: an `<h1>` inside this `<p>` would close the paragraph
         at the parser, and the name has to be the title alone — the 🪶 beside
         it is a link to a new document, not part of what this heading says.
         Since 2026-09-25 it is the **only** level-one heading: `h1#doctitle`
         is `aria-hidden`, so birth and band no longer read two. -->
    <p class="brand ph" id="title"><a class="quill" id="quill" href="/" title="docs.vote — make a new document"></a><span id="titletext" role="heading" aria-level="1">Untitled</span></p>
    <div class="stats">
      <!-- room-pulse: one content-free beat per action by anybody (session-view's) -->
      <span class="pulse" id="pulse" aria-hidden="true"
            title="The membership is working — this blinks when anybody votes or proposes anything. It never says who, what, or which way."></span>
      <!-- `session-clock` (Q466/Q471): the topbar reads the document · the
           room · you. The middle is one plain line — pulse, clock, quorum —
           cold at every distance; the clock is the door to ⏰.
           `room-faces` (Q858): and the room itself, as the faces of everybody
           else who has arrived. Pre-Begin the row is what *n in the room* used
           to say in words; from 🍾 the count beside it is the quorum reading,
           which is the engine's and stays. -->
      <span class="room"><button class="clock" id="clock" type="button" data-card="ending" disabled></button><span class="count" id="quorum"></span><span class="facestack" id="faces"></span></span>
      <!-- the wallets you spend in this document, ✏️ ✒️ 🏛️, beside `me`
           (Q444b): proposing, drafting, consensus — a member's power is
           limited in quantity and unlimited in scope; the founder's the
           reverse. A clerk holds none of them (Q458). -->
      <span class="wallet" id="wallet"></span>
      <span class="wallet powerwallet" id="penwallet"></span>
      <span class="wallet powerwallet" id="shieldwallet"></span>
      <span class="wallet powerwallet" id="voicewallet"></span>
      <button class="me" id="mebtn" title="You, and the founder of this document."></button>
      <button class="drawerbtn" id="drawerright" type="button" aria-expanded="false" aria-controls="rail"><span class="n" id="drawercount">0</span></button>
    </div>
  </div>
</header>
<script>
  // **The page reports its own uncaught errors** (plan stage 5b, after the
  // nh2026 convention). A refusal has been written down on the host since
  // Q1330; an error the page *threw* was written down nowhere at all, and
  // the only two this project has ever caught were found by hand — Q1281's
  // swallowed boot error months later, and the `?debug=1` strip's on a
  // phone Ed happened to be holding. So every uncaught error and rejection
  // goes to `POST /api/page-error` and joins the same log (OPERATING §11).
  //
  // **First in the file, so it is listening before anything else loads**:
  // the load-order block below is where a boot error comes from, and a
  // reporter registered after it would miss exactly the errors it exists
  // for. The `?debug=1` strip at the foot of this block is the other half
  // of the same idea and sends nothing; both can run at once.
  //
  // **Five fields and no more**: the message, the file and line the browser
  // names, this page's path, and the document's address so the host can
  // find the seat. The seat and the build are the host's to add and are not
  // ours to claim. **Nothing a member typed goes** — which is why the stack
  // stays here, the server caps and collapses what does go, and the path is
  // sent without its query, a magic link's token travelling in one.
  (() => {
    const slug = (/^\/d\/([A-Za-z0-9-]+)/.exec(location.pathname) || [])[1] || null;
    // the page's own brake, before the host's: a render that throws throws
    // on every frame, and the tenth copy of one sentence tells nobody more
    // than the first did
    let sent = 0;
    let last = '';
    const report = (message, source, line, col) => {
      if (!message || sent >= 5) return;
      const key = message + '@' + source + ':' + line;
      if (key === last) return;
      last = key;
      sent++;
      try {
        fetch('/api/page-error', {
          method: 'POST', credentials: 'same-origin', keepalive: true,
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ message: String(message), source: String(source || ''),
            line: line, col: col, path: location.pathname, slug: slug }),
        }).catch(() => {});
      } catch (e) { /* a report is never the thing that fails */ }
    };
    // capture, because a failed <script> or <img> fires an error event that
    // does not bubble — and a page whose own files did not arrive is the
    // most useful report there is
    addEventListener('error', (ev) => {
      if (ev.error || ev.message) {
        report(ev.message || String(ev.error), ev.filename, ev.lineno, ev.colno);
        return;
      }
      const t = ev.target;
      if (t && t !== window && (t.src || t.href)) {
        report('failed to load ' + String(t.src || t.href).split('?')[0], '', 0, 0);
      }
    }, true);
    addEventListener('unhandledrejection', (ev) => {
      const r = ev.reason;
      report('rejection: ' + ((r && r.message) || String(r)), '', 0, 0);
    });
  })();
  // The contents drawer and the task sheet (narrow only).
  //
  // The contents rail is a **drawer**: `data-drawer="left"` on the root names
  // it open, ☰ toggles it, and a tap anywhere outside it — the darkened
  // ground, the document — closes it; choosing a heading closes it after the
  // choice has landed.
  //
  // The task rail is a **sheet that peeks** (`task-sheet`, Ed 2026-09-24,
  // replacing the right-hand drawer of 2026-09-12): a bar at the foot of the
  // window says the most urgent thing that asks you, in its rail entry's own
  // words, and how many more there are; a swipe up or a tap raises the whole
  // list, a swipe down, a tap on the ground or a choice puts it back. Reading
  // down the document slides the bar away and any scroll up brings it back.
  // `data-sheet` on the root is `peek` or `open`, absent while nothing asks
  // you; `data-sheethide` says the peek is scrolled away; `data-sheetdrag`
  // that a finger is on it, which is a press in flight, so the 4 s poll
  // defers (`pressInFlight`). The list is the rail's own: `layoutQueue`'s
  // narrow branch sorts it and announces the result as `tasks-laid`. All of
  // it lives on the root, never in the list, so a rail rebuild cannot reset
  // it. Self-contained otherwise: nothing else on the page knows a drawer or
  // a sheet exists.
  (() => {
    const root = document.documentElement;
    const mq = matchMedia('(max-width: 900px)');
    const doors = { left: document.getElementById('drawerleft'), right: document.getElementById('drawerright') };
    const queueEl = () => document.querySelector('.layout > .queue');
    const sheet = () => root.getAttribute('data-sheet');
    // a sheet act's own scroll (an entry travelling to its card) never hides
    // the bar it has just put back
    let quietUntil = 0;
    let bar = null, line = null, more = null, topKey = null, peekSrc = null;
    const sheetTo = (s) => {
      if (!sheet()) return;                       // nothing asks: nothing to raise
      root.setAttribute('data-sheet', s);
      root.removeAttribute('data-sheethide');
      doors.right.setAttribute('aria-expanded', String(s === 'open'));
      if (bar) bar.setAttribute('aria-expanded', String(s === 'open'));
      if (s === 'open' && root.getAttribute('data-drawer')) set(null);
      quietUntil = Date.now() + 1200;
    };
    const set = (side) => {
      if (side) root.setAttribute('data-drawer', side); else root.removeAttribute('data-drawer');
      doors.left.setAttribute('aria-expanded', String(side === 'left'));
      if (side && sheet() === 'open') sheetTo('peek');
    };
    // the open panel, if any, and how to put it away: the drawer, or the
    // sheet raised (a peeking sheet is not open — it asks for no ground)

  // 17:38: a live page with every box empty, an hour after a deploy that
  // paused and replaced the host — the one fetch had met the paused instance
  // and nothing ever asked again). Eight tries, the wait doubling from a
  // second to about two minutes; a sprite that never comes still costs
  // nothing but the pictures.
  var wait = 1000, left = 8;
  function load() {
    fetch('fluent-glyphs.svg').then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {

  // the Founder ✒️, by a founding choice or an amendment at will — one
  // wording for both eras, the pen being the mark of the Founder's own hand.
  // …and `crown` is two hands (found with Q1293, 2026-09-09): the module
  // writes it for the Founder's own post-start pen (`foldSet`) and for a
  // membership motion the Founder assented to (`applyPayloadSet`), so a rule
  // the Founder amended at will read *Chosen by the membership*. The record
  // tells them apart — a pen set files as a carried motion on the `pen`
  // route (Q530) — and the latest carried set on the setting decides.
  const lastCarriedRoute = (k) => {
    if (!cs || !cs.motionRecords) return null;
    const mid = midOf(k);
    let best = null;
    try {
      for (const m of cs.motionRecords().values()) {
        if (m.status !== 'carried' || !m.payload || m.payload.kind !== 'set' || m.payload.setting !== mid) continue;
        const at = m.at !== undefined && m.at !== null ? m.at : (m.settledAtT || 0);
        if (!best || at >= best.at) best = { at, route: m.route };
      }
    } catch (e) { return null; }
    return best ? best.route : null;
  };
  // **the one reader** is card-state.js's `provenanceOf` (Q1541 stage 1,
  // 1541.5 (b)); this page's source below hands it `settledBy` and the last
  // carried route, and every card that prints who chose a rule asks it
  const provOf = (k) => { const p = window.CARD_STATE.provenanceOf(k);
    return p ? p.label : PAGE_COPY.motionRec.provPen; };
  const chosenRadio = (label) => '<button class="lanepick" aria-pressed="true" disabled>' +
    '<span class="dot"></span><span>' + esc(label) + '</span></button>';
  const clauseOf = (k, v) => window.CARDS.clauseOf(k, v, clauseCtx());
  const RULES = window.CARDS.RULES;
  const ADM_RULE = RULES.admission;
  const REMOVAL_RULE = RULES.removal;
  const AUTH_RULE = RULES.authorship;
  const JUDG_RULE = RULES.judgments;
  const CHAMBER_RULE = {
    closed: () => clauseOf('chamber', 'closed'),
    link: () => clauseOf('chamber', 'link'),
    public: () => clauseOf('chamber', 'public') };
  const APPL_RULE = (v) => clauseOf('applications', v);
  // **What the surface offers is a subset of what the table reads back**, and
  // the subset is named once. 🌍's `public` left every ladder on 2026-08-22
  // (Q603) — offered nowhere, still stated by a document that took it — so a
  // composer must not put it either; naming it here rather than in each
  // caller is what keeps the lanes and the typed values below one list.
  const OFFERED_RUNGS = { chamber: ['closed', 'link'] };
  const offeredRungs = (k) => window.CARDS.clauseRungs(k, clauseCtx())
    .filter(([v]) => !OFFERED_RUNGS[k] || OFFERED_RUNGS[k].includes(v));
  // **A rung is keyed by its own sentence** — the lane the composer draws,
  // the key `MVAL` types it back from and the string a motion is reported in
  // are one string from one table, so `checkComposer`'s both-ways assertion
  // holds by construction rather than by two spellings agreeing. `type` is
  // the shape this setting's value takes: 🪪 and 🥾 a price, 👤 ⚖️ 🌍 a rung
  // name, 🤝 a switch.
  const ruleMval = (k, type) => Object.fromEntries(
    offeredRungs(k).map(([v, say]) => [say, type(v)]));
  const priceMval = (k) => ruleMval(k, (v) => ({ price: v }));
  // …and the lane says the rule it would set, so its text and its value are
  // the same sentence: there is nothing left for a per-lane explainer to add
  // (T43, and item 74's own precedent on the founder's card).
  // …and it carries the rung's own name as a third element, which nothing on
  // the page routes on: it is what lets `card-audit`'s T5 lens see that this
  // lane, the founder's radio and the member's ladder are one rung.
  const ruleLanes = (k) => offeredRungs(k).map(([v, say]) => [say, say, v]);
  // what the document is called now, and what the lane is proposing
  const cs_titleNow = () => (cs ? cs.titleOf : S.title);
  const titlePending = () => (S.titleDraft !== null ? S.titleDraft : cs_titleNow());
  // whether a title stands yet — the key the 🪶 card's shape turns on (Ed,
  // 2026-09-06): before one does the card is one lane and nothing else; after,
  // it is the standing name and a blank composer, two option blocks
  const titleStands = () => !!cs_titleNow();
  const viewerId = () => (S.viewer === 'applicant' || S.viewer === 'stranger'
    ? null : (viewerRow().mid || FOUNDER));
  // **A heading on the screen is a heading in the text**: the editor keeps
  // the '# ' as a class while you type (relabel), so it is put back when the
  // text is read out — the stored text is the document, and the charter
  // column reads its headings from it (stage 8)
  // **One read-out for both views** (Q1313): in source view the block's
  // characters already are the line; rendered, the marks are written back
  // (`htmlToMd`, as the lane reads itself) behind the marker the class holds.
  const proseText = () => [...prose.children].map((b) => {
    if (prose.classList.contains('mdsrc')) return b.textContent;
    const m = b.className.match(/lvl(\d)/);
    return (m ? '#'.repeat(+m[1]) + ' ' : b.classList.contains('bullet') ? '- ' : '') + window.CARDS.htmlToMd(b);
  }).join('\n').trim();
  // **The column, counted once** — 📄's own value, the 📄 clause and the rail
  // entry all state the same fact about the same blocks, and each used to
  // count them itself. A heading is a block whose class carries `lvl<n>`, the
  // same test `proseText` uses to put the Markdown hashes back. It returns
  // the counts; every caller phrases them.
  const proseCounts = () => {
    let paras = 0; let heads = 0;
    for (const b of prose.children) {
      if (!b.textContent.trim()) continue;
      const src = prose.classList.contains('mdsrc') && window.CARDS.mdBlock(b.textContent);
      if (/lvl\d/.test(b.className) || (src && src.t === 'h')) heads++; else paras++;
    }
    return { paras, heads, blocks: paras + heads };
  };
  // 📄's value slot: what stands in the column, said in the fewest words that
  // are still a count. An empty column is a real answer (§9.0b), so it gets a
  // statement of its own rather than a zero.
  const proseLine = () => {
    const c = proseCounts();
    if (!c.blocks) return PAGE_COPY.prose.nothingYet;
    const n = (x, w) => x + ' ' + w + (x === 1 ? '' : 's');
    return listOf([c.paras ? n(c.paras, PAGE_COPY.prose.paragraph) : '',
      c.heads ? n(c.heads, PAGE_COPY.prose.heading) : '']) + PAGE_COPY.prose.below;
  };
  // which page field carries a setting's delegation radio ('roster' = the members')
  const DKEY = { ending: 'ending', quorum: 'quorumBy',
    authorship: 'authorship', judgments: 'judgments',
    chamber: 'chamber', rate: 'rateBy', lapse: 'lapse', removal: 'removal',
    // v0.52: these three only ever read 'roster' once their options render
    // (title/link after the text confirms, applications after the start)
    title: 'titleBy', slug: 'slugBy', applications: 'policyBy', admission: 'admission' };
  const wantsDelegate = (k) => { const dk = DKEY[k]; return !!dk && S[dk] === 'roster'; };
  // a radio's value comes off the DOM as a string; two settings hold booleans
  const setVal = (v) => (v === 'true' ? true : v === 'false' ? false : v);
  // ✒️ on a setting card: the confirm is a module command (delegate, or
  // reclaim-and-set). Post-start this is the crown's direct change on a
  // reserved setting; the module refuses anything else and the page keeps
  // rendering (mock discipline: commands may fail, rendering may not).
  function commitSetting(k) {
    const mid = midOf(k);
    if (k === 'quorum' && cs.quorumForm !== S.quorumForm) {
      try { cs.setQuorumForm(now(), S.quorumForm); } catch (e) {}
    }
    // **Both halves of F18 retired together** (Q1362, 2026-09-15). 🪜 rode
    // 🌡️'s commit because it was no task of its own (Q512), and Q775's fix
    // moved that ride above the delegate return so a handed-over bar still
    // answered the ramp — the defect being that 🪜 was in neither `ORDER` nor
    // any section's keys, so nothing on the surface could ask for it and a
    // delegated 🌡️ left `mustAct('pace')` true for ever. There is no ride
    // left to place: the bar is not a member's question any more and neither
    // setting has a card, so both carry a `retiredAnswer` and 🍾 resolves
    // whatever a founder handed over before the change. The post-mortem is
    // Q775's, in design/DECISIONS.md.
    if (wantsDelegate(k)) { cs.delegate(now(), mid); return; }
    if (csDelegated(k)) cs.reclaim(now(), mid);
    watchSet(k, cs.setSetting(now(), mid, TYPED[k](), (S.setWhy && S.setWhy[k]) || undefined));
    if (S.setWhy) delete S.setWhy[k];
    // taking a value back restores both powers (reclaim) — drop any unsent
    // tab choices so the ✒️/🛡️ tabs show what now stands
    S['pw:u:' + k] = undefined; S['pw:a:' + k] = undefined;
  }

  // **Discard and commit, on every card you can commit** (Ed, 2026-08-19,
  // closing 412): the left slot is 🗑️ — *put this card back the way it
  // stands* — and "Close" survives only where the card holds nothing to put
  // back. **OK** is a third control and not a variant of either: it is what
  // a card wears when it asks nothing of you but to have seen it (Ed's own
  // words) — a gate opening, a decision you are owed.
  //
  // A radio on a setting card writes straight into S, so *what it stands as*
  // has to be remembered rather than derived: one snapshot per opening,
  // taken in render after the module has had its say, and compared to decide
  // whether the bin has anything to throw away.
  const REVERTKEYS = () => ['title', 'slug', 'ending', 'endsAt',
    'quorumForm', 'quorumPct', 'quorumN', 'joinBy', 'policyBy', 'titleBy', 'slugBy',
    // 💤's spell and its typed pair (Q1439), ⏱️'s three below it
    'lapse', 'lapseMs', 'lapseN', 'lapseUnit', 'removal', 'removeWho', 'admission', 'authorship', 'judgments',
    // ⏱️'s number and unit fields (Q1161) — missing until Q1286 (e), so 🗑️ on
    // ⏱️ left the typed number on the card and a later ✒️ would have committed it
    'grant', 'dripMin', 'dripN', 'dripUnit', 'cap', 'chamber',
    'quorumBy', 'rateBy', 'myname', 'mypic', 'myemail', 'hatPick',
    'namePick', 'picPick', 'appPicPick',
    // ✋ 🖼️'s unsent value rides the snapshot too (Q1327): 🗑️ puts the draft
    // back to what it was at the opening, and the standing value is untouched
    'mynameDraft', 'mypicDraft',
    // the title's provisional lane rides the snapshot like every other
    // provisional value, so 🪶 needs no bin of its own (2026-08-21)
    'titleDraft']
    .concat(PW_KEYS.flatMap((k) => ['pw:u:' + k, 'pw:a:' + k]));
  // **The snapshot is per card, and it lives until that card commits** (Ed's
  // QA, 2026-08-21). It used to be taken once per *opening*, which was true
  // until *what you have typed survives a close* landed the same day: type an
  // address, close the card, open it again, and the snapshot was retaken from
  // the value you had typed — so the bin had nothing to put back and went
  // dead, stranding the very change it exists to undo. What a card stands as
  // only moves when the card is committed, so that is when the snapshot is
  // dropped and the next opening takes a fresh one.
  const snaps = Object.create(null);
  // the blind answers ride the snapshot too, as their own `ans:` keys — an
  // answer is one more provisional value, and the bin that puts a card back
  // should not need to know which kind of card it is standing on
  // …and 🍾's power table and the reason lanes the same way (issue #34 F2,
  // F3): both are written in place into objects the plain keys below would
  // hold by identity, so they are copied, and kept under `__` names so
  // `openCardDirty` never compares them by identity
  const takeSnap = (k) => { const s = { __ans: Object.assign({}, S.myAns),
    __begin: Object.assign({}, S.beginRows), __why: Object.assign({}, S.setWhy || {}) };
    REVERTKEYS().forEach((kk) => { s[kk] = S[kk]; }); snaps[k] = s; };
  const dropSnap = (k) => { delete snaps[k]; };
  // **The bin puts back its own card, not the whole surface.** The snapshot
  // covers every revertable key, but a card may only undo the ones it can
  // write — otherwise a snapshot taken at one opening could roll back a draft
  // made on a *different* card in between. Every control names the field it
  // writes (opt()'s data-set, the text and number fields' own data-txt and
  // data-num), so the card's keys are read off the open card rather than kept
  // in a hand-maintained list that would rot silently. A card naming none
  // falls back to the whole set, which is what every bin did before.
  const cardKeys = () => {
    const el = document.querySelector('.setupcard');
    if (!el) return null;
    const ks = new Set();
    el.querySelectorAll('[data-set]').forEach((b) => ks.add(b.dataset.set));
    el.querySelectorAll('[data-txt]').forEach((b) => ks.add(b.dataset.txt));
    el.querySelectorAll('[data-num]').forEach((b) => ks.add(b.dataset.num));
    el.querySelectorAll('[data-ans]').forEach((b) => ks.add('ans:' + b.dataset.ans));
    // …and a date rung's pending kind (issue #75 F1), which it writes beside
    // the answer rather than into it
    el.querySelectorAll('[data-ans][data-ansval="date"]').forEach((b) => ks.add('ans:' + b.dataset.ans + 'Kind'));
    if (el.querySelector('[data-setwhy]')) ks.add('setWhy');
    // 🍾's power table (issue #34 F2): a struck cell is unsent like any radio
    if (el.querySelector('.pwtoggle[data-bkey]')) ks.add('beginRows');
    if (el.querySelector('[data-titlelane]')) ks.add('titleDraft');
    // ❌'s subject is provisional input like any other, so 🗑️ puts it back
    if (el.querySelector('[data-removewho]')) ks.add('removeWho');
    // **A derived value rides with its field** (Q1286 (e), Ed 2026-09-08):
    // ⏱️'s typed number rescales `dripMin` and claims `rateBy` as it is typed
    // (Q1161), so a bin that put back `dripN` alone left the minutes standing
    // and the reopened card read them back as the number
    if (el.querySelector('[data-num="dripN"], [data-dripunit]')) { ks.add('dripMin'); ks.add('dripUnit'); ks.add('rateBy'); }
    // …and 💤's the same way since Q1439: the typed number rescales the spell
    // and claims the rung, so a bin that put back `lapseN` alone would leave
    // the spell standing and the reopened card would read it back
    if (el.querySelector('[data-num="lapseN"], [data-lapseunit]')) { ks.add('lapseMs'); ks.add('lapseUnit'); ks.add('lapse'); }
    // **The picture card names itself by its uploader, not by its grid.**
    // `[data-pic]` used to be the always-present row of grounds; since Q732
    // the only `[data-pic]` elements are the picker's own buttons and the
    // Remove button, and neither is guaranteed — the grid says *the emoji
    // list is still loading* when `EMOJI_DATA` has not arrived, and with no
    // picture set there is nothing to remove, so the card can carry no
    // `[data-pic]` at all and 🗑️ would decline to put a picture back. The file
    // drop zone is rendered by `pictureBody` unconditionally and names whose
    // picture it is, so it is the honest marker of "this is *your* picture
    // card" — the applicant's body is the same one and must not reach across
    // to `mypic`.
    if (el.querySelector('[data-pic], [data-picinto="me"]')) ks.add('mypic');
    // **A draft rides with its field** (Q1327): the composer's own key is
    // what the input and the picker write, so the bin names it beside the
    // standing one — the standing value is never the card's to change here
    if (ks.has('myname')) ks.add('mynameDraft');
    if (ks.has('mypic')) ks.add('mypicDraft');
    if (el.querySelector('[data-slide]')) {
      el.querySelectorAll('[data-slide]').forEach((b) => ks.add('ans:' + b.dataset.slide));
    }
    return ks.size ? [...ks] : [];
  };
  // A card that names no field puts nothing back — it simply closes. The old
  // fallback was "restore everything", which was safe only while a snapshot
  // could not outlive one opening; now that it can, a card with no fields of
  // its own must never reach across the surface and undo another card's work.
  const revertSnap = (only) => { const s = snaps[S.open];
    if (!s) return;
    (only || []).forEach((k) => {
      if (k.startsWith('ans:')) { const a = k.slice(4);
        if (s.__ans) S.myAns[a] = a in s.__ans ? s.__ans[a] : null; return; }
      // a copy, since the snapshot outlives the press (issue #34 F2)
      if (k === 'beginRows') { S.beginRows = Object.assign({}, s.__begin || {}); return; }
      // the open card's reason alone — the snapshot can predate a reason
      // typed on another card (issue #34 F3, SURFACE C3)
      if (k === 'setWhy') { const w = s.__why || {}; S.setWhy = S.setWhy || {};
        if (S.open in w) S.setWhy[S.open] = w[S.open]; else delete S.setWhy[S.open]; return; }
      if (k in s) S[k] = s[k];
    }); };
  // **What the bin would put back, asked as a question** (issue #12): the one
  // reader of "this card is holding something you have not sent", over the
  // same snapshot and the same `cardKeys()` the bin restores from, so there is
  // no second idea of unsent on the surface. Only the deferred reload asks it
  // — 🗑️ itself is always live and never did (the dirty predicates the row
  // kept in three places stay retired). A key the snapshot does not carry is
  // not the card's provisional state, since the bin would not put it back
  // either; an answer's "stands as" is `revertSnap`'s own `null` fallback.
  const openCardDirty = () => {
    if (!S.open) return false;
    const s = snaps[S.open];
    if (!s) return false;
    return (cardKeys() || []).some((k) => {
      if (k.startsWith('ans:')) { const a = k.slice(4);
        const was = s.__ans && a in s.__ans ? s.__ans[a] : null;
        const is = S.myAns[a];
        return (was == null ? is != null : is !== was); }
      // the two copied keys compare by content (issue #34)
      if (k === 'beginRows') return JSON.stringify(S.beginRows || {}) !== JSON.stringify(s.__begin || {});
      if (k === 'setWhy') return ((S.setWhy || {})[S.open] || '') !== ((s.__why || {})[S.open] || '');
      return k in s && S[k] !== s[k];
    });
  };
  // **🗑️ is always live** (Ed, 2026-08-21: *the bin should still close the
  // card even if the fields are empty*). It used to grey out when there was
  // nothing to put back, which made the one control that leaves a card
  // unpressable exactly when a reader most wanted out of it — and left them
  // pressing a dead button. So the act is *put it back as it stands, and
  // close*, and with nothing to put back it is simply the close. That also
  // retires the dirty predicates the row was keeping in three places.
  const binBtn = () => '<button class="btn glyphbtn" data-revert="1"' +
    ' title="' + PAGE_COPY.binPutBack + '">' + glyphHtml('🗑️') + '</button>';

  const S = {
    // **Nothing in the document changes until ✒️** (Ed's QA, 2026-08-19: the
    // title card was rewriting the heading, the topbar and its own head as
    // you typed, *which is inconsistent with all other decision behaviour*).
    // Every other card holds what stands at the top and what you are
    // proposing below it; the title was the one that let the two be the same
    // string. titleDraft is the provisional value — the lane's, and nothing
    // else's — dropped whenever the open card changes.
    title: '', titleDraft: null, slug: '',
    folded: new Set(),  // folded headings: 'cs-<section>' and 'ph:<prose heading>'
    // **No defaults** (Ed, 2026-08-21: *we should remove the defaults, each
    // should start as “The Founder is deciding [parameter]”*). Every setting
    // starts with nothing chosen — not the value, not the number, and not
    // who holds it — so a clause states the question until the founder has
    // answered it, and no rule can be arrived at by not reading it. Note
    // what this retires: constitutional settings used to arrive delegated to
    // the members, which stated an answer the founder had not given.
    titleBy: 'founder', slugBy: 'founder', policyBy: '',
    mailOpen: false,
    sentAddr: '', inviteOne: '', inviteMany: '',
    // the address the pending creation became, learned by the birth tab left
    // open beside the document (issue #38 F3, F4) — null until the host says
    birthMade: null,
    // (`pwKeep`, the power tabs' *Keep this* by tab key, left with Q1378: the
    // return tab is one block, the change, and the head is what stands)
    // the last refusal, against the card it belongs to: {k, m} (Q811)
    doorErr: null,
    viewer: 0,
    app: { started: false, email: '', emailSent: false, emailVerified: false,
      mailOpen: false, name: '', pic: '', text: '', submitted: false, csId: null,
      // whether the door shutting under you has been acknowledged (E33, Q901):
      // the module is the truth about it, this is the provisional layer's copy
      shutAcked: false,
      // …and whether the membership answered no (Q1473): the applicant's own
      // status, which the 🪪 card reads to stop saying they are deciding
      refused: false },
    ending: '', endsAt: '',
    quorumBy: '', quorumForm: '', quorumPct: '', quorumN: '',
    joinBy: '', admission: '',
    // 💤: the rung, the spell in milliseconds, and the number and unit it is
    // typed as (Q1439) — `lapseMs` is `dripMin`'s twin and the two typed
    // fields are `dripN`/`dripUnit`'s
    lapse: '', lapseMs: '', lapseN: '', lapseUnit: '',
    // ❌'s chosen subject (entry 96), provisional until the act
    removal: '', removeWho: '',
    authorship: '', judgments: '',
    rateBy: '', grant: '', dripMin: '', cap: '',
    chamber: '',
    // the reason for a change, per setting, until its ✒️ commits it (Q530) —
    // a provisional value like any other, so it survives a close
    setWhy: {},
    hatPick: null,
    // 🍾's power table, unsent until the press (entry 158; per setting since
    // Q1195 (c)): one position per setting × power, keyed `<page key>:u|a`,
    // absent meaning the row's own start. A provisional value like a radio
    // position and nothing more — the act it composes is `begin`'s list.
    beginRows: {},
    roster: [{ n: '', e: '', role: 'member', founder: true, in: true, ans: {}, okd: new Set(), mid: 'founder' }],
    // **Confirmed, not merely defaulted** (Ed, 2026-08-17). A default nobody
    // read is not a decision, and these are the decisions that cannot be changed
    // once people are drafting. So a card carries its value from the first
    // render — the rail is never a list of blanks — and stays yellow until it
    // has been opened and committed.
    seen: new Set(),
    open: null,
    // edit mode (backlog 204): page-only, provisional, nothing in the log
    editMode: false,
  };
  // ---- who is looking (Ed, 362: a dev dropdown of the actual users) ----
  // Per-user state lives on the roster rows; S.myAns / S.okd / S.myname…
  // are accessors delegating to whoever is in the chair, so every existing
  // call site reads and writes the current viewer without knowing it.
  const APP_STUB = { n: '', pic: '', role: 'applicant', ans: {}, okd: new Set() };
  // the stranger (Q455/456): the fifth seat — nothing about them is known, so
  // the chair holds nothing
  const STRANGER_STUB = { n: '', pic: '', role: 'stranger', ans: {}, okd: new Set() };
  const isStranger = () => S.viewer === 'stranger';
  // the two seats outside the room, who read the document as the door
  // shows it (Q1281: an applicant is a stranger who has knocked)
  const atTheDoor = () => isStranger() || S.viewer === 'applicant';
  const viewerRow = () => (S.viewer === 'applicant' ? APP_STUB
    : isStranger() ? STRANGER_STUB : (S.roster[S.viewer] || S.roster[0]));
  const amFounder = () => !!viewerRow().founder;
  // any reservation crowns (Q379 wide): the module's read where it exists,
  // the radios' before the save. startingText never counts (no post-start
  // change route); title and link always do, so this is true until Q381.
  const founderCrowned = () => (cs ? cs.crowned() : true);
  // **The founder is marked by a glyph, never a word** (entry 197): the
  // Founded line and the register row say the same thing from one predicate,
  // called once here so the two can never disagree. Not `.emojiface` —
  // `journey-walk.mjs` reads one inside a row as *the member's face*, and

    // **🍾 Begin — the founder's explicit act of starting the document**

  // 🪶 (Ed, 2026-08-19) — the quill, retiring the drawn home plate of the

  const CARDS = [
    // — the opening order is Ed's, card by card (2026-08-18): **title →
    // email (verified) → link → the rest**. The first three are the order
    // of existence — a name, the address that can always get back in, the

    { k: 'title', g: '🪶', t: PAGE_COPY.cards.title.t, n: PAGE_COPY.cards.title.n, kind: 'ordinary', inDoc: true, changeable: true,

    // **The birth is 🪶 → 📍 → 📧** (Q460, Ed 2026-08-20): the link is

    { k: 'admission', g: '🪪', t: PAGE_COPY.cards.admission.t, n: PAGE_COPY.cards.admission.n, kind: 'constitutional', key: 'admission', p: 0.40, changeable: true,

    // gate 'judge': constitutional (§9.6 disclosure family), so judging waits

    { k: 'chamber', g: '🌍', t: PAGE_COPY.cards.chamber.t, n: PAGE_COPY.cards.chamber.n, kind: 'constitutional', gate: 'judge', key: 'chamber', p: 0.43,
      rule: PAGE_COPY.cards.chamber.rule,
      takes: PAGE_COPY.cards.chamber.takes, result: 'Members only',
      dist: [5, 9], distTop: 1, distEnds: ['Members only', 'Anyone with the link'] },

  const remedyOnly = (c) => c.k === 'invite' && settled(c) && (oneVoiceRemedy() || inviteTask());

  const ansWaveReady = (c) => {

  // **✋ and 🖼️ stand at the save, above the pen** (Ed, 2026-08-28, Q980):

  const ORDER = ['title', 'slug', 'myemail', 'myname', 'mypic',
    'grant-pen', 'grant-shield', 'chamber',
    'admission', 'applications', 'hat', 'lapse', 'removal',
    'canpropose', 'canjudge', 'grant-voice', 'rate',
    'ending', 'quorum',
    'authorship', 'judgments',
    'text', 'begin'];
  // a card in the order waits for everything above it and nothing else: the

  // left with 🌡️ — which `orderReady` still paces by their own dependency; the answer
  // tasks cascade in ORDER too (`ansWaveReady`), so nothing else reads one.
  // **A gate holds its place without holding the queue.** A gate is settled
  // only once it has been OK'd, and ⚖️ Judging cannot open until the whole

  // would stop the constitution being finished at all. It takes a position,
  // so nothing arrives before its turn, and is skipped as a blocker.
  //
  // **The pen is the exception** (Ed, 2026-08-22: *immediately after the
  // birth I can see "Your Pen" and "Visibility"; visibility is a
  // constitutional setting with a ✒️ action, and if I haven't accepted the
  // pen yet I shouldn't see it, because I shouldn't be given tasks that I
  // can't action*). The skip-as-blocker rule was written for ⚖️, which
  // cannot open until the whole constitution is decided — blocking on it
  // would stop the constitution being finished at all. ✒️ is in no such

  // **every card below it in the order is committed with the very pen it
  // hands over**, so until it is acknowledged they are, to the letter, tasks
  // the founder may not action.

  // 🏛️ deliberately keeps the gates' rule. A voice is spent on motions and
  // never on a founding commit, so it hands over nothing the queue below it
  // needs — and a clerk founder, who is not a member, never opens it at all,
  // so a blocking 🏛️ would strand the founding four questions from its end.

  // **And a personal card holds its place without holding the queue either**
  // (Ed, 2026-08-28, Q980: *✋ and 🖼️ should both appear together after the

    return i < 0 ? (c.dep || []).every((k) => settled(card(k)))
      : ORDER.slice(0, i).every((k) => {

  // **A delegated question is a member's the moment it is delegated** (Q1372,

  // founding order paces the *founder* (C14, `orderReady`); it used to pace
  // every reader through the founder's card, so an unanswered 🎩 hid a
  // member's ⏱️ 👥 for as long as the founder left it — two hours in the

  // member whatever the founder has left unanswered above it; what the
  // founder has not reached stays absent, an undecided rule not yet being a

  const askedOfMember = (c) => !amFounder() && viewerIsMember() && !!c.key &&

  // `visible`, clause by clause, in the document's terms:

  //  - a blind question is served to a member who holds 🏛️ acknowledged
  //    (Q1365 — *don't show blind questions until you have acknowledged the

  const visible = (c) => (isStranger() && (c.isGate || c.kind === 'personal' || c.ansFor) ? false : c.ansFor
    ? viewerIsMember() && acked('grant-voice') && ansDue() && ansWaveReady(c) &&
      isRoom(card(c.ansFor)) && roomAsking(card(c.ansFor)) && visible(card(c.ansFor))
    // a gate or a grant belongs to a document that exists: before the save
    // there is nothing to gate and no pen to be given, and its paragraph
    // would otherwise stand in the birth's own band saying so
    // **the founding order paces the founder, and stops at the start** (Q1325,
    // Ed 2026-09-11, the moon room): after 🍾 every paragraph stands, an unset
    // rule reading as undecided (Q510) — with 🥾 never set, the order had hidden
    // 💡 ⚖️ ⏱️ ⏰ 🌡️ 👥 👤 👁️ and their three sections from every reader
    : !(c.hide && c.hide()) && (!c.isGate || !!cs) &&
      (constituted() || orderReady(c) || !!(c.early && c.early()) || askedOfMember(c)));

  // every purpose that counts them — the rail enumerates from `tasksFor`, and
  // so does the group's own note — but they draw no paragraph of their own:
  // their tabs stand on the Founded line, and that sentence is their clause.
  const onFoundedLine = (c) => !!c && (c.k === 'grant-pen' || c.k === 'grant-shield' || c.k === 'grant-voice');

  // …and 🌂 last, the way out at the end of the stack (Q1400)
  const myIdCards = () => ['myname', 'mypic', 'myemail', 'leave'].map(card).filter((c) => c && visible(c));
  const idOnFounded = () => (cs && amFounder() && !viewerIsMember() ? myIdCards() : []);
  // One question card per delegable setting, born when its setting is handed
  // over and gone if it is taken back. Same glyph, same title — it is the
  // same question — told apart by whose pile it stands in.
  const ANS = CARDS.filter((c) => c.key && ANSWER[c.k]).map((c) => ({
    k: 'ans-' + c.k, g: c.g, t: c.t, n: c.n, kind: c.kind, own: 'you', ansFor: c.k }));

      // **Members and Applications are subsections** (Ed, 2026-08-18):
