  // share is followed — after *of the membership* — by the numbers it comes to
  // in the membership as it stands. Both sentences live in copy.js.
  const QUORUM_RULE = (n, form) => (((form || S.quorumForm) === 'count')
    ? PAGE_COPY.quorumRule.count(n)
    : PAGE_COPY.quorumRule.share(n + '%', shareTail(n, E())));
  // **The threshold clause went with the threshold** (Q1362, 2026-09-15).
  // `BAR_RULE` printed 🌡️'s rung sentence with 🪜's ramp sentence hung off
  // it, because the ramp was part of what the threshold said (Q512); the
  // constitution now says what carries a proposal in 👥's clause alone.
  // Ed's sentences (card review 2026-09-02, Q1149 — the options swap so the
  // card leads with lapsing; Q1168 — *automatically abstain* is §9.5a's own
  // mechanism, stated accurately)
  // `v` is the spell itself in milliseconds since Q1439 (it was a number of
  // days, possibly fractional); the words are `spellWords`'s, in the unit
  // that divides the spell (Q1321)
  const LAPSE_RULE = (v) => (v === 'never' || v === null
    ? 'Inactive members never lapse and are still counted towards votes.'
    : 'After ' + spellOfMs(v) + ', inactive members lapse and automatically abstain from votes.');
  // **⏱️ is one number** (Ed, 2026-09-02, Q1160/Q1161, R-083): the grant and
  // the maximum are the mechanism's fixed 3 (SPEC §7), the interval is the
  // setting, and **the unit is worked out from the stored minutes** — the
  // clause prints the largest unit that divides exactly (1440 → *every day*,
  // 120 → *every 2 hours*, 45 → *every 45 minutes*); the card's selector is
  // input only, minutes stored everywhere (the drip runs on real minutes).
  const DRIP_UNITS = { minutes: 1, hours: 60, days: 1440 };
  const dripParts = (mins) => (isNum(mins) && +mins > 0
    ? (+mins % 1440 === 0 ? { n: +mins / 1440, unit: 'days' }
      : +mins % 60 === 0 ? { n: +mins / 60, unit: 'hours' }
      : { n: +mins, unit: 'minutes' })
    : null);
  const dripPhrase = (mins) => { const p = dripParts(mins);
    return !p ? '' : p.n === 1
      ? { days: 'day', hours: 'hour', minutes: 'minute' }[p.unit]
      : p.n + ' ' + p.unit; };
  const RATE_RULE = (drip) =>
    'Members may make a new proposal ✏️ every ' + dripPhrase(drip) + '.';
  const DECIDED = {
    // the ⏰ clause is `ENDING_RULE`'s like the readback's — it was the one
    // numeric clause left spelling itself a second time beside its builder
    ending: () => (perpetual() ? ENDING_NEVER
      : ENDING_RULE(endingAt())),
    quorum: () => { const tv = takenValOf('quorum');
      return tv ? QUORUM_RULE(tv.n, tv.form)
        : QUORUM_RULE(S.quorumForm === 'count' ? S.quorumN : S.quorumPct); },
    authorship: () => AUTH_RULE[
      takenOf('authorship') || (S.authorship === 'roster' ? 'anonymous' : S.authorship)],
    judgments: () => JUDG_RULE[
      takenOf('judgments') || (S.judgments === 'roster' ? 'never' : S.judgments)],
    // **Foundership carries a read, whatever 🌍 says** (Ed, 2026-08-22).
    // 🌍 settles who may read *besides* the people the document is already
    // about, and a clerk founder is not a member — so under *members only*
    // the clause stated a rule that shut the founder out of the document
    // they convened, which the product has never actually done. It is said
    // only where it is a deviation: a founder who is a member is covered by
    // the sentence already, and under link or public everybody reads anyway.
    chamber: () => CHAMBER_RULE[
      takenOf('chamber') || (S.chamber === 'roster' ? 'closed' : S.chamber)](),
    lapse: () => { const tv = takenOf('lapse');
      const v = tv !== null ? tv : (S.lapse === 'roster' ? null : S.lapse);
      return LAPSE_RULE(v === 'never' ? 'never'
        : (typeof v === 'number' ? v : S.lapseMs)); },
    rate: () => { const v = takenValOf('rate');
      return RATE_RULE(v ? v.dripMinutes : S.dripMin); },
    // 🤝 is one switch; what an application costs is 🪪's sentence (entry 94)
    applications: () => APPL_RULE(policyNow()),
    slug: () => 'The document lives at ' + docAddr(S.slug) + '.',
    // **The admissions clause** (Ed, 2026-08-26): what it costs to bring
    // somebody in, in the room's words; the Founder's own sentence follows
    // from the powers held on the ✉️ door, in the power clause
    admission: () => ADM_RULE[admissionPrice()],
    removal: () => REMOVAL_RULE[removalPrice()],
    // the doors state the price their setting decides
    invite: () => ({
      assembly: 'Anyone may be proposed as a new member, and every member has to agree — one refusal keeps them out.',
      proposal: 'Anyone may be proposed as a new member, and the membership decides.',
      pen: 'Any member may invite whom they like — an invitation is sent on their word.',
    })[admissionPrice()],
    remove: () => ({
      consent: 'A member may be proposed for removal, and every member has to agree — including them.',
      assembly: 'A member may be proposed for removal, and every other member has to agree.',
      proposal: 'A member may be proposed for removal, and the membership decides.',
    })[removalPrice()],
    // 📄's sentence, in the two tenses its task now has (Q799). Before the
    // start the fact is the one the founder is acknowledging — what stands in
    // the column is what the document begins from — and afterwards it is the
    // record of what did. **Nothing renders it today**: `doc` is a rail-only
    // section, `textAnchor` draws 📄's pile beside the charter heading rather
    // than on a clause of its own, and `headFor` returns null for 📄 because
    // its clause is the document itself (F15). It is kept in step so that the
    // sentence and the card cannot drift apart if 📄 is ever given a paragraph.
    text: () => { const n = proseCounts().blocks;

        ? 'The document begins from whatever stands in the column below.'

  };
  // 404 (Ed, 2026-08-19): the preamble states the defaults once; a clause
  // states only its deviations, in 396c's precise third person. Delegated
  // ⇒ silence — the defaults are the whole of the rule.
  // The first Membership question. Until one is decided the document has no
  // membership to speak of, so no clause says what decisions from one take
  // (Ed, 2026-08-21) — which is also what keeps the birth's first sentences
  // to the one fact that is true at the birth: the founder holds this.
  const membershipDecided = () =>
    ['hat', 'admission', 'applications', 'lapse', 'removal'].some((k) => settled(card(k)));
  const holderLine = (k) => {
    if (!PW_KEYS.includes(k)) return '';
    // at the birth the founder holds everything by construction — there is no
    // module yet, and nobody else to hold anything
    // — and the title's is the one that says whose hand that is (backlog 140)
    if (!cs) return ' ' + founderMay([pwPhrase(k, 'u')], k === 'title');
    const st = pwState(k);
    if (!st || st.holder === 'members') return '';
    const p = st.powers;
    const pend = pwPend(k);
    // one sentence, joining whichever powers the Founder actually holds —
    // and, since R-048, a second for whichever they have laid down from the
    // start. The two cannot be joined: *until the document begins* would
    // scope over both halves of a sentence that means it about one.
    const parts = [];
    const going = [];
    if (p.unilateral) (pend.u ? going : parts).push(pwPhrase(k, 'u'));
    if (p.assent && membershipDecided()) (pend.a ? going : parts).push(pwPhrase(k, 'a'));
    const said = [founderMay(parts), founderMayNotYet(going)].filter(Boolean);
    return said.length ? ' ' + said.join(' ') : '';
  };
  // **The document keeps the powers; the card drops them** (Ed, 2026-09-03,
  // correcting the QA round's over-reach): the constitution's own paragraph
  // still states the rule and then, on entry 198's second line, what the
  // Founder may do about it — *The Founder may amend this at will…* — exactly
  // as before. What lost the sentence is the **decision card** for a setting
  // that is not itself about founder powers: there the rule stands alone and
  // the ✒️ 🛡️ tabs on the very same clause carry the powers. One function,
  // the caller declaring which text it is (`withPowers`), so the two cannot
  // drift apart silently.
  const clauseText = (rule, k, withPowers) => {
    const h = withPowers ? holderLine(k) : '';
    return rule + (h ? ' \n' + h.slice(1) : '');
  };
  // **Links in the constitution are real links** (Ed, 2026-08-19):
  // underlined, ink-coloured (.doclink), applied after escaping so a
  // sentence can never smuggle markup in. The `d/` is optional so a member's
  // own sentence naming a bare address still becomes a link — but the route
  // segment has to be in the pattern, or the clause's own address links as
  // far as `docs.vote/d` and stops (backlog 70). Shared since Q1294: the
  // charter's clauses link the same addresses after their markdown renders
  // (`mdLine`, text nodes only, never inside a code span).
  const linkify = window.CARDS.linkify;
  // the clause's own line break, made after escaping for the same reason
  // `linkify` is: the sentence carries member text, and a `<br>` written into
  // the plain string would print as characters. Applied **only** to the
  // clause sentence, never to a record's title or a power head — for those
  // `esc` stays the whole of the answer, and a newline in member-written text
  // must not become markup.
  const breakLines = (s) => String(s).replace(/\n/g, '<br>');
  // `withPowers` — true only from the paragraph seam (ctx.decisionLine): the
  // document states the holder line, the card does not (Ed, 2026-09-03)
  const decisionLine = (c0, withPowers) => {
    // a motion card states the sentence of the setting it is about (Q1367)
    const c = hostOf(c0);
    // a grant's paragraph states the document's rule (third person, the same
    // for every reader); the card that opens on it is yours
    // 🍾's clause is the Proposals preamble (Ed, 2026-08-22): the tab hangs
    // on the sentence the press makes true, and the moment itself stays on the
    // Founded line, which carried it already. Since Q748 the preamble is
    // **the whole opening of the section** and 💡 ⚖️ 🏛️ share it, so all four
    // heads are the rule as the document states it (F15).
    if (c.isBegin) return proposalsClause();
    if (c.k === 'canpropose' || c.k === 'canjudge') return proposalsClause();

        : closeSignatures().length + (closeSignatures().length === 1 ? ' member has' : ' members have') + ' signed it.');

    // Founded line with ✒️ 🛡️ — but its card's head is still the preamble's
    // three rule lines (Q750; the whole body of the card, Ed's QA 2026-09-02
    // pm), whichever paragraph the tab stands on

    // ✒️ and 🛡️ write no sentence (Q639 (a), Ed 2026-08-22). They used to

    // `holderLine` already says on every setting the power turns, and which
    // the wallet's own tooltip already says in the second person. Their tabs
    // now stand on the Founded line and that sentence is their clause, so
    // neither this function nor `para` is ever called with them; `headFor`
    // returns null and `ctx.clauseFor` supplies the head.
    // **The founder's own answer writes no clause** (Q786, Ed 2026-08-25). It
    // used to state one in either direction — *The Founder has (not yet)
    // answered as a member.* — standing under the delegated setting's own
    // sentence, which already says how many of the members have answered and
    // counts the founder among them. Two clauses for one fact, and the second
    // of them about a person rather than the document. Since Q787 the card
    // draws no paragraph at all (its tab rides the setting's pile), so this
    // branch is reached only where something asks for the sentence directly.
    if (c.ansFor) return '';
    // 💡's and ⚖️'s own branches are `proposalsClause`'s sentence 1 now
    // (Q749), handled above: proposing opens at the start (§9.0b, Q606), the
    // blocker being 🍾 rather than the text.
    // **The birth is its own phase** (Ed, 2026-08-21). Before the save the

    // 📧 stands in the opening run beside the title and the link — there is
    // no Membership yet for it to belong to. After the save the same card
    // lives on your own member row, where the members list's sanctioned
    // "you" is the right voice.
    // Before the mail goes out the clause is **blank** (Ed, 2026-08-21): the

      ? (S.birthMade ? PAGE_COPY.birthMade(S.birthMade)

      : S.emailSent ? 'Your address is awaiting verification.'

    if (isRoom(c)) {
      const st = csState(c.k);
      const collecting = st ? st.collecting : !((c.in || 0) >= E() && E() > 0);
      return !collecting && (!st || st.value !== null)
        ? clauseText((DECIDED[c.k] ? DECIDED[c.k]() : value(c)), c.k, withPowers)
        // while the founder is the only person the document knows about, an
        // answer count would be counting the founder alone (pacing pass,
        // 2026-08-19) — the honest tail is that the question waits for a room
        // **The interim visibility rule is stated** (Q618 (a), 2026-08-22): before
        // 🌍 is settled a document is members-only, so the 🌍 clause says so
        // rather than only who is deciding — a stranger reading the door is
        // reading this rule, and the by-deviation grammar would otherwise leave
        // them reading a rule the members cannot see

        : (c.k === 'chamber'

    }
    // the provenance rides between the rule and the powers (entry 166), and
    // since entry 198 the powers stand on their own line: *… As for a
    // meeting.* / *The Founder may amend this at will.*
    return settled(c) ? clauseText((DECIDED[c.k] ? DECIDED[c.k]() : value(c)), c.k, withPowers)
      // the same interim rule while the Founder holds 🌍 undecided (Q618 (a))
      : c.k === 'chamber' ? 'Until the Founder decides, only members can see the document.'

  const ctx = {
    get open() { return S.open; }, get E() { return E(); },
    // the room a meaning is about, read on every render like `E` — the
    // settled strip's *takes* line says what the value means for the room
    // **as it stands now**, never for the room at the resolution (entry 167)
    get room() { return roomNow(); },
    // a setup entry's wash alpha rides the charter's urgency ramp (Q623 (a)):
    // the urgency is the rail's own `RAIL_U`, so the two columns agree
    urgencyOf: (c) => RAIL_U[stateOf(c, ctx)],

    // the Founded paragraph and hang their tabs on it, but the card no longer
    // restates it; the paragraph itself stays in the constitution.
    clauseFor: () => '',
    // the title card's head is the document title itself — the clause,

    inDocOpenSlot: false,

      // the card head, which has replaced the paragraph that gave *this* its

      // whole choice (Q1430); `noTitleHead` below carries the same test, so
      // the name does not come back in the head's place

      // and its blocks say what it did. E41's news card on a rule is the

      // post-save the title card opens at its own clause, so its head is
      // the clause sentence (the headdoct span stays: refreshCommit types
      // into it live); at the birth it is still the big heading itself
      // …and once a title stands, in either era, it is block one and wears
      // its provenance radio like every standing rule (CP2, Q1188; Ed,
      // 2026-09-06: the name with *Chosen by the Founder* underneath)
      if (c.k === 'title') return (cs ? 'The document is titled ' + LD : '') +
        '<span class="headdoct' + (S.title ? '' : ' ph') + '">' +
        esc(S.title) + '</span>' + (cs ? RD + '.' : '') +
        (titleStands() && !bare ? chosenRadio(provOf('title')) : '');
      const m = motionOn(c);
      // a motion card on either route is the settled card's own shape — no
      // head, what stands as block one (Q1182 for the consent card, Q1331

      // door**: a stranger's tab opens the settled card read-only (Q1183),
      // and a motion in flight is the members' business — without this the

      // Q1331's seeded ⏱️ motion; 👤 and 🌍 had read empty since Q1183)

      // a settled card is its own paragraph, opened, so what stands at its
      // head is the constitutional sentence the paragraph states. The
      // exceptions are cards whose clause is a thing rather than a sentence

      // line they hang their tabs on — and open questions, which their title

      // …and 🏛️ since Q1502: its card is the strip, its own body and the commit
      if (c.k === 'text' || c.k === 'grant-pen' || c.k === 'grant-shield' || c.k === 'grant-voice') return null;
      if (c.isGate) return breakLines(linkify(esc(decisionLine(c))));

        const asBlock = OPTHEADLESS.has(c.k) || c.k === 'title' || c.k === 'slug';

        const line = sent ? clauseText(sent, c.k, false) : decisionLine(c);
        return breakLines(linkify(esc(line))) +
          (asBlock && !bare ? chosenRadio(provOf(c.k)) : '');
      }
      if (composerOn(c)) return esc(standsOf(c.k));
      return null;
    },
    // **the thirteen option-block settings cards carry no title head**
    // (Q1151, F15): the founder's own setting card, whose blocks state the

    // a gate, which keep their titles
    // …and since Ed's card review round 3 (2026-09-05) neither does a record
    // (32/56: the eyebrow dates it, the blocks say what it did — Q1186), nor
    // 📍 at the birth (02: its field is the whole card)
    // …nor a settings card under a motion on either route (Q1182, Q1331):
    // its blocks state both rules, so 📍's motion card is headless too
    // …nor a heading-over-text card (Q1373, Ed 2026-09-15: *founder actions
    // and founder veto decision cards still had titles*): the five
    // `textcard`s — the grants ✒️ 🛡️ 🏛️ and the gates 💡 ⚖️ — open as the
    // strip, the paragraph and OK; the name stays on the entry, the tooltip
    // and the record. Only ✒️ 🛡️ ever drew a title here (the other three
    // head with the Proposals clause through `headFor`), but the rule is the
    // card kind's, not the pair's.
    // …nor a power tab at the birth (Q1430): `headFor` has dropped its
    // sentence, and without this the card would answer with its *question* —

    // record, exactly as it does for the thirteen.
    noTitleHead: (c) => c.textcard || powerHeadless(c) || (!c.power && !c.isGate && !c.door &&

        OPTHEADLESS.has(c.k) || (c.ansFor && OPTHEADLESS.has(c.ansFor)) ||

    // over one lane, and the hairline between them went with Ed's round 3
    // (01): the head is the field's own value, not a rule over a control
    // …while it has no title yet. Once one stands the birth's 🪶 takes the
    // block grammar like the settled one (Ed, 2026-09-06)
    bareHead: (c) => c.k === 'title' && !cs && !titleStands(),
    // a settled option-block setting draws its rule as the first block
    // (Q1167 a) — same keys, same exclusions; an identity card never reaches
    // it (no catalogue rule to draw), so the widened set is safe here too.
    // 🪶 joins once there is a document (Ed's QA, 2026-09-02 pm): the settled
    // title is two options, the standing sentence on top, the composer's
    // sentence beneath.
    // 📍 joins 🪶 there (Ed's card review round 3, 2026-09-05, Q1183's
    // approved mockup: the standing address wearing its provenance radio)
    blockHead: (c) => !c.power && !c.record && !c.isGate && !c.ansFor && !c.door &&
      (OPTHEADLESS.has(c.k) || (c.k === 'title' && titleStands()) || (c.k === 'slug' && !!cs)),
    // a section never folds while it holds the open card or its tasks
    // (🏛️ is enumerated by `tasksFor` on the Founded line since Q1365, so
    // the special case Q750 needed here is gone)
    foldedSec: (sec) => S.folded.has('cs-' + sec.key) &&
      !sec.cards.some((c) => S.open === c.k ||
        (tasksFor(c) || []).some((t2) => S.open === t2.k) ||
        motionCardsFor(c).some((t2) => S.open === t2.k)),
    secToggle: (sec) => secToggleHtml('cs-' + sec.key),
    // the whole constitution folds under its own heading (Ed, 2026-08-19);
    // never while any card is open — a fold must not swallow the open card
    foldedGroup: () => S.folded.has('cs-constitution') && !S.open,
    groupToggle: () => secToggleHtml('cs-constitution'),
    // power tabs (403) and record chips (Q942): synthetic cards — never asks,
    // never tasks; a power tab's decision line is the power's own rule
    // sentence, and a record's is what it says it is. **A record is history,
    // not a task**: nothing is owed an OK, so it is `done` from the moment it
    // exists and wears the grey the band gives a settled thing.
    // **A power tab asks nothing until somebody moves on it** (Q386): the tab
    // has never been a task and still is not, but a return in flight is a
    // 🏛️ motion like any other — it asks, and once you have answered it waits
    // — so the three predicates read the motion where there is one, and the
    // tab is grey again the moment it settles.
    mustAct: (c) => (c.record || (c.power && !motionOn(c)) ? false : mustAct(c)),
    waiting: (c) => (c.record || (c.power && !motionOn(c)) ? false : waiting(c)),
    // which wait is a vote of yours (Ed, 2026-09-08, Q1286 (a)): a delegated
    // question you answered, or a motion you answered — those wear ⏳ and
    // stay in the rail like a race's ⏳ (Q1202); every other wait keeps its
    // glyph, and the watcher on a setting you handed over leaves the rail
    voted: (c) => !c.record && !(c.power && !motionOn(c)) &&
      (motionOn(c) ? answeredMotion(c) : !!c.ansFor && answered(c)),
    // **An ordinary motion of yours is a thing of your own in flight** (Q1370,
    // Ed 2026-09-15; M3's *yours*, the alphabet's ✏️ row): it asks you
    // nothing — the mover stands at accept from the open (K8) — and settles
    // never; withdraw is the remaining act, so the entry is force-kept as a
    // proposal of yours is. A constitutional motion of yours keeps ⏳: you
    // have answered it and the room has not finished (Q1286 (a)). Before
    // this the mover's invitation had no entry at all where the ⚖️ OK was
    // still owed, and where it was not the card asked them to judge it.
    yours: (c) => !c.record && (() => { const m = motionOn(c);
      return !!m && m.kind === 'ordinary' && m.status === 'running' &&
        m.by !== null && m.by !== undefined && m.by === viewerId(); })(),
    news: (c) => (c.power || c.record ? false : news(c)),
    // the paragraph seam, so 🏛️ draws no clause of its own where the
    // preamble is standing to carry it (Q750). The rail reads `tasksFor`
    // itself and is unaffected — the news still travels with its question.
    // Since Q787 an `ans-*` task is filtered here too: it is a chip of its
    // host setting's pile (`chipsFor` below), so a paragraph of its own would
    // be the same tab drawn twice.
    tasksFor: (c) => (c.power || c.record ? []
      : tasksFor(c).filter((t) => !t.ansFor)),
    // esc before linkify, like the head path (review #1, finding 20): the
    // sentence carries the title, which is member text — unescaped it was
    // stored XSS into the constitution paragraph
    // a record draws no paragraph, so this is never asked for one — it
    // answers with the record's own title rather than throwing if it is
    // and `breakLines` only over the clause branch (entry 198): a record's
    // title and a power head carry no break, and wrapping them would turn a
    // newline in member-written text into markup after `esc` had made it safe
    decisionLine: (c) => (c.record ? linkify(esc(c.t))
      // the **document paragraph**, which is the one place *this* has a
      // referent: the sentence stands under the setting's own clause, so it
      // takes no noun (Q1429)
      : c.power ? linkify(esc(powerHeadLine(c)))
      // the paragraph is the document speaking, holder line included
      // (Ed, 2026-09-03) — the card heads call decisionLine without it
      : breakLines(linkify(esc(decisionLine(c, true))))),
    chipsFor: (c) => {
      // 📭 stands in the *Invitees* pile, not the Proposals one (E34): the
      // give-up is about somebody in the register, so its tab is beside the
      // subsection they are listed under — which is `admitCard`'s arrangement
      // and deliberately not `releaseCard`'s, a release belonging to no clause
      // …and 🥾's departure news stands in the *Members* pile for the same
      // reason (E31, E32, E40): the person who left was listed there
      // …and E41's rejection news with them (Q1447): it stands in the rule's
      // pile in the record's place, and opens alone as a record does
      if (c.power || c.ansFor || c.record || c.mailgiveup || c.departure ||
        c.held) return [c];
      // the Proposals opening is one clause carrying four tabs (Q748): the
      // group is the same whichever of the four you come in by, and `para`
      // opens the card at 🍾's paragraph for any of them
      if (PROPOSAL_CHIPS.includes(c.k) || c.release) return proposalChips();
      // 🪜 shared 🌡️'s stack, having no clause of its own; both left the
      // surface on 2026-09-15 (Q1362), so every card is its own pile again
      const k = c.k;
      const base = [card(k)];
      // your own answer to a delegated question stands in the pile of the
      // clause it answers (Q787): the value's tab, your question, then the
      // two power tabs — those still held, once the document has begun (Q1404).
      // `stackOrder` puts whichever is asking in front, so an
      // unanswered question leads and an answered one falls in beside the
      // watcher — one place to click, and no clause about the founder.
      const withAns = base.concat(ansTaskFor(card(k)));
      const withPw = (cs && PW_KEYS.includes(k))
        ? withAns.concat(pwTabsFor(k)) : withAns;
      // **and behind all of it, what has already been decided here** (Q942).
      // `stackOrder` ranks `done` last and sorts stably, so the rule — or its
      // question, or its power tabs — is always in front and the records stand
      // behind it in settle order. The ordering is this list's, never a second
      // sort.
      // …every motion running here is its own tab (Q1367), between the
      // rule's own tabs and the records
      // …and a record this seat is still owed the news of stands **in its own
      // place** as the news card, not beside it (E41, Q1447): one rejection is
      // one tab, wearing ✖ here as the grey chip does and going back to being
      // the grey chip the moment the OK is given
      const owedHeld = owedHeldIds();
      return withPw.concat(motionCardsFor(card(k))).concat(settledMotionsFor(k)
        .map((rec, i) => card(owedHeld.has(rec.id) && !S.okd.has('held:' + rec.id)
          ? 'held:' + rec.id : 'rec:' + k + ':' + i)).filter(Boolean));
    },
    // **The lockline tells the truth about who set it** (Q510(a), Ed
    // 2026-08-21). It had said *Set by the founder when the document was
    // made* on every rule, including the ones the room decided by consent —
    // half-corrected on this surface by the watching half underneath, and
    // not corrected at all at the stranger's door, which is what forced it
    // there first. The *when* survives where it is true.
    lockline: (c) => { const st = csState(c.k);
      return st && st.settledBy && st.settledBy !== 'convenor'
        ? PAGE_COPY.lockline.members
        : PAGE_COPY.lockline.founder; },
    summary, value, isRoom,
    // a rule change's own words on its rail entry (Q1523)
    railTitle: (c) => railRuleTitle(c),
  };

  // ---- the rail ----------------------------------------------------------
  // Grouped by pile and in pile order, so the two columns agree and nothing
  // jumps when you confirm something (Q320). Your own pile first: on this
  // screen that is the founder's, on the ceremony it is the members'.
  // ---- the setup tasks as session entries (stage 8) ----------------------
  // railEntry's markup, unchanged, wearing session.js's wash attributes so it
  // fades between colours like every other entry; and the margin-index meta
  // the layout needs: where it stands, whether it pins, how it ranks.
  // ask pins (it is the question you are being asked), news pins (a decision
  // you are owed), yours pins and is force-kept (a proposal of your own);
  // wait flows beside its paragraph. Ranks follow the tab stack's order
  // (urgent · … · adopted · … · propose · deciding); u is judgment leverage.
  let railEntries = [];
  const RAIL_RANK = { ask: 0, news: 4, yours: 6, wait: 7, done: 9 };
  const RAIL_U = { ask: 0.95, news: 0.5, yours: 0.5, wait: 0.2, done: 0 };
  // a setting's tab, wherever it currently stands — in the band, or beside the
  // big heading while the birth still has no clauses to hang it on
  const tabFor = (k) => document.querySelector(
    '#band .achip[data-tab="' + k + '"], #titlepara .achip[data-tab="' + k + '"], #ridetab .achip[data-tab="' + k + '"]');
  // **A stacked tab that is not in front carries no `data-tab`** (Q752): it is
  // inert, because nothing may click past the tab in front of it — so `tabFor`
  // was blind to it and its rail entry fell all the way through to the title
  // paragraph. Nothing reached that branch while the only piles with hidden
  // tabs were 🪜 and the power tabs, none of which has a rail entry; the
  // Proposals stack is the first group where three of four do. Every chip
  // carries `data-chip` whether or not it is clickable, so a pile's own
  // paragraph is findable for all of them — a fix for every pile, not this one.
  const hostParaOf = (k) => {
    const ch = document.querySelector('#band .achip[data-chip="' + k + '"]');
    return ch ? ch.closest('.cpara') : null;
  };
  // **The last resort has to be something on screen.** The fallback was the
  // title paragraph, which was the top of the document until the pre-save
  // heading started retiring at the save (backlog 33) — a hidden element
  // measures as a rect of zeros, which would lay the entry at the top of the
  // window and scroll the rail's click to y=0. So it is the title paragraph
  // while the title paragraph is showing, and the band's first clause after
  // that, which is what the top of the document then is.
  const anchorOf = (k) => {
    const tab = tabFor(k);
    const tp = document.getElementById('titlepara');
    return document.querySelector('.setupcard[data-setupcard="' + k + '"]')
      || document.querySelector('.cpara[data-para="' + k + '"]')
      || hostParaOf(k)
      || (tab && tab.closest('.cpara'))
      || (tp.offsetParent ? tp : (band.querySelector('.cpara') || tp));
  };
  function entryOf(c, cx) {
    const st = stateOf(c, cx);
    const html = railEntry(c, cx)
      .replace(/ data-washkey="[^"]*"/, '')
      .replace(/ style="--washcol: ([^;]+); --washbg: [^;]+; --fill: ([^"]+)"/,
        (m, col, fill) => SESSION.washAttrs('set:' + c.k, col, fill));
    // `news` is what the rail's `BAND_PIN_CAP` counts (Q113, Ed 2026-09-14;
    // Q1532 as amended, Ed 2026-09-24): a setting owing you an OK is the
    // Rules' own queue, oldest first, the oldest three pinning, apart from the
    // charter's text records, which pin one at a time. It rides beside `pinned`
    // rather than narrowing it, because *this* entry is still a pinning kind —
    // whether it gets to pin is a question about the whole queue, and only
    // `layoutQueue`, which can see both populations at once, can answer it.
    // an applicant's five stay listed whatever their state (`pinAll`, Q1392,
    // Ed 2026-09-16: *they should appear as greyed out queue cards in the
    // sidebar, so I can easily get back to them, as I have nothing else to
    // see or do*): a filed entry is a position in the gutter for a member,
    // and an applicant has no gutter to find it in. The state chain stays a
    // literal in front — `spec-check` reads it against SURFACE §6's alphabet.
    return { id: c.k, html, pinned: st !== 'wait' && st !== 'done' || !!cx.pinAll, rank: RAIL_RANK[st],
      u: RAIL_U[st], mine: st === 'yours', news: st === 'news', anchor: () => anchorOf(c.k) };
  }
  // **The birth-pass sees the whole rail** (Q1338, Ed 2026-09-11). It used to
  // be scoped to the setup tasks, on the ground that a charter entry arrives
  // by session.js's own rules — but session.js has exactly one, the next pair
  // of a race you have just judged sliding in, and a race that is new to you
  // has none at all. That never showed while a race was served the moment it
  // existed; since Q1328 holds every race back until ⚖️ Voting is
  // acknowledged, a dozen land in one render at the OK and pop. F14 is one
  // rule over both columns — what is born arrives, it does not appear — and
  // `bornKeys` already remembers across the wholesale rebuild the rail takes
  // on every render and every poll, so a charter entry is keyed by its own
  // item id exactly as a setup task is by its page key.

  // ---- `dead-click-nudge` (Q650–Q653, Ed 2026-08-23) ---------------------
  // A founder meeting the birth has never seen this surface, and the rail is
  // where every piece of work is. But the failure Ed watched in user testing
  // was worse than the rail going unnoticed: #doctitle is a bare <h1> with no
  // data-card and nothing listening above it, so clicking "Untitled" — the
  // obvious door, and the thing people reach for first because they expect to
  // edit a title in place — does *nothing at all*. The tester got no response
  // and went looking for the nearest thing that would accept typing, which is
  // the prose column underneath. They typed the title into the document.
  //
  // So a click that lands on nothing answers itself: the task that *is*
  // waiting beats, in its tab and in its rail entry at once (Q650), which is
  // what teaches that the two are one thing rather than just pointing at a
  // corner of the screen. It never opens the card, however many times they
  // click (Q652) — the nudge is a teacher, and C1/F10 keep the opening click
  // the user's own. Nothing beats unprompted: the intermittent jiggle first
  // asked for was dropped (Q651), because every other motion on this surface
  // is a consequence — a clause fades because it was born, an entry lifts
  // because it was pressed — and the birth has no clock to ride in any case.
  //
  // It renders nothing and changes no state: a pure DOM poke, in the shape of
  // session.js's own beat(). A render would rebuild both rails wholesale and
  // take the class with it.
  const BEAT_MS = 640;                   // the taskBeat keyframe's own duration
  function beatEl(el) {
    if (!el) return;
    el.classList.remove('nudge');
    void el.offsetWidth;                 // so a second click beats again
    el.classList.add('nudge');
    const off = () => el.classList.remove('nudge');
    el.addEventListener('animationend', off, { once: true });
    // the wallet's lesson — never depend on your own animation finishing. Under
    // reduced motion there is no animation to end at all, and this timeout is
    // the only thing that lets the held lift go.
    setTimeout(off, BEAT_MS + 60);
  }
  // The next task: the first entry still asking for something, in rail order —
  // during the birth the rail runs single file, so this is normally the only
  // one. `needs` is the class setup.js gives an 'ask' or a 'news' entry.
  //
  // The class rides the <li>, never its button and never a data-*: setup-probe
  // strips `<li class="…">` from its rail hash but hashes the button's classes
  // and every data-* it does not know. The CSS reaches the button from there.
  function nudgeNextTask() {
    const li = [...rail.querySelectorAll('.qitem')].find((q) => q.querySelector('button.needs'));
    if (!li) return;                     // nothing is waiting; nothing to point at
    beatEl(li);
    beatEl(tabFor(li.dataset.q));
  }
  document.addEventListener('click', (ev) => {
    if (cs || S.open) return;            // the birth only (Q653), and only with no card open
    if (ev.shiftKey || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const docEl = document.getElementById('doc');
    if (!docEl || !docEl.contains(ev.target)) return;
    // A dead click is one with no real control under it. Structural rather than
    // a list of data-* hooks, which would rot: every hook in the delegated
    // handlers below sits on a button or an anchor. #prose is excluded by the
    // contenteditable test on purpose — writing there is invited from arrival
    // and stashed across the save, so it is not a mistake (Q654).
    if (ev.target.closest('a, button, input, textarea, select, label, [role="button"], [contenteditable="true"]')) return;
    // selecting a phrase is reading, not reaching for a door
    const sel = window.getSelection();
    if (sel && !sel.isCollapsed && String(sel).trim()) return;
    nudgeNextTask();
  });
  /* **A click on nothing, with a card open, closes it** (Ed, 2026-09-06:
     *when I click on the surface outside of a decision card, it should
     close*). The same gesture as the nudge above with the opposite meaning —
     no card open, point at the task; a card open, close it — and the same
     structural test: no control under the pointer, nothing selected. Two
     things the nudge did not need:
     · **The pointer went down outside too.** A drag that starts in a card and
       ends on the page fires its click on their common ancestor, which reads
       as outside; selecting a rationale must not slam the card shut.
     · **Capture phase, state read first.** The delegated handlers below
       change `S.open` on the same click (a tab press, a rail entry); read
       before they run, and step aside for anything that is itself a way into
       or out of a card, so those keep their own meaning.
     The one carve-out is edit mode's own card (K31, Y18): there the column
     is the editor and a click in a clause is a caret, never a close. */
  let downOn = null;
  document.addEventListener('pointerdown', (ev) => { downOn = ev.target; }, true);
  const WAY_IN = 'a, button, input, textarea, select, label, [role="button"], [contenteditable="true"], ' +
    '.achip, .insert-anchor, [data-tab], [data-card], [data-anchor], [data-q], [data-toc], [data-sec-toggle]';
  const CARD_SIDE = '.setupcard, .sugg, #ridetab, #proserow, [data-proposalrow], .editctl, #prosefolds, .walletsay, ' +
    '#mailmodal, #devoutbox, .devswitch, .ladderbar, #errline';
  document.addEventListener('click', (ev) => {
    const bandOpen = S.open, charterOpen = SESSION.openId, editing = !!S.editMode;
    if (!bandOpen && charterOpen == null && !editing) return;
    if (ev.button !== 0 || ev.shiftKey || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (WAL.penHoldFired) return;        // a hold's own click lands on its commit
    const origin = (downOn && document.contains(downOn)) ? downOn : ev.target;
    for (const at of [origin, ev.target]) {
      if (!(at instanceof Element)) return;
      if (at.closest(WAY_IN) || at.closest(CARD_SIDE)) return;
    }
    const sel = window.getSelection();
    if (sel && !sel.isCollapsed && String(sel).trim()) return;
    closedByClick = true;
    setTimeout(() => { closedByClick = false; }, 0);
    // **Edit mode is a card too** (Q1315, Ed 2026-09-11: *clicking outside
    // of cards should close them*): a click on nothing outside the lifted
    // column — the strip, the row, the riding tab and any editing card are
    // its sides, and the column itself is a caret — leaves through the
    // door's own path, the draft kept (K31), before the start and after.
    // It used to keep the mode and the editing card both.
    if (editing) { leaveEditMode(); return; }
    if (charterOpen != null) SESSION.closeCard();
    if (bandOpen) closeThen(() => { S.open = null; });
  }, true);

  function renderRail() {
    if (isStranger()) {
      // the stranger's rail holds one card: 📧 Log in — or Apply, where the
      // 🤝 rule allows it (Q456)
      railEntries = STRCARDS().map((c) => entryOf(c, strRailCtx));
      stageWords = 'reading only';
      renderClock();
      return;
    }
    if (S.viewer === 'applicant') {
      // **The applicant's seat follows the 🤝 rule as it stands** (pacing
      // pass, 2026-08-19: the topbar said "applications open" whatever the
      // policy said). Under invitation-only there is nothing to apply for;
      // under "open" arrival is joining, not applying; and an application
      // becomes an ordinary motion, so before judging opens there is no
      // room to put one before — the Apply task exists only where and when
      // applying is a real act.
      // 🤝 says whether the door is open, 🪪 what it costs: open *and* free
      // is arrival (entry 94), open at a price is applying
      const applying = policyNow() === 'apply' && admissionPrice() !== 'pen';
      // **a verified applicant keeps their cards when 🪪 moves to ✒️** (issue
      // #36 F3): 🤝 is still yes, so the submit they came to make is still a
      // real act — at ✒️ it admits them — and the rail fell to one *Applications
      // Have Closed* card over a door that had not shut
      const now2 = policyNow() === 'apply' && canJudge();
      // **A submitted application's card stands whatever 🤝 says** (SURFACE
      // Y28, Q1357, Ed 2026-09-14). The door's state is about *new*
      // applications: 🤝 whether strangers may knock and 🪪 what a knock
      // costs. An application already submitted is a race running in the
      // engine (`admit:<id>`, §9.7½), and it runs on regardless — so the
      // rail keeps it, the count, the state and the settle when it comes,
      // exactly as it does while the door stands open. Before this the
      // applicant lost their own card the moment 🤝 shut, while the members
      // went on voting on them.
      const standing = S.app.submitted && canJudge();
      // **A door that shut under you leaves one entry standing** (SURFACE
      // E33, Q901, Ed 2026-09-14). The rail empties the moment 🤝 shuts,
      // which is right for the four tasks an application is made of — there
      // is nothing left to fill in — and wrong for 🪪 itself, which is now
      // news owed an OK: without this the sentence was reachable only on a
      // card that happened to be open already, and the OK could not be
      // pressed at all. It goes when the OK does. That news is for somebody
      // who had *not* submitted, which is why `applyShutOnMe` excludes them.
      railEntries = (now2 || standing) ? APPCARDS().map((c) => entryOf(c, appCtx))
        : applyShutNews()
          ? APPCARDS().filter((c) => c.k === 'apply').map((c) => entryOf(c, appCtx))
          : [];
      stageWords = 'reading only · ' +
        (!applying ? (policyNow() === 'apply' ? 'anyone with the link may join' : 'membership is by invitation')
          : now2 ? 'applications open' : 'applications open when the document begins');
      renderClock();
      return;
    }
    // **The rail is session.js's margin index now** (stage 8): each task is
    // an entry anchored to its own band paragraph, laid out by layoutQueue
    // with every charter entry — ask, news and yours pin, wait flows. This
    // only decides *which* entries; SESSION.refreshRail draws them.
    railEntries = servedCards().map((c) => entryOf(c, ctx));

    stageWords = canJudge() ? 'open' : 'reading only';
    renderClock();
    document.getElementById('mebtn').innerHTML = avHtml(me(), 'face');
  }
  // ---- `session-clock` (Q466/Q471) ----------------------------------------
  // The topbar middle reads the room: pulse · clock · quorum. Before the
  // start the line keeps the founding's stage words and the head count;
  // from the start it is where the document is in its life — the countdown
  // at the ladder (empty on a perpetual document), or Closed [date] forever
  // (no Frozen: there is no freeze since v0.99, R-088) — and *quorum N of E*. The countdown runs on the server's clock:
  // the view carries serverNowMs and the page offsets by when it arrived.
  let stageWords = 'reading only';
  const serverNow = () => (cs && cs.isRemote && cs.v.serverNowMs)
    ? cs.v.serverNowMs + (Date.now() - (cs.v.receivedAtMs || Date.now())) : Date.now();
  // the ending as it stands, in ms — the module's typed value, never the
  // founder's field once something is settled
  const endsAtMsOf = () => {
    const st = csState('ending');
    if (st && st.value) return st.value.endsAtMs;           // null = never
    if (S.ending === 'perpetual') return null;
    const ms = Date.parse(S.endsAt); return Number.isFinite(ms) ? ms : null;
  };
  const clockState = () => {
    if (!cs || cs.constitutedAtT === null) return { kind: 'none' };
    if (cs.closed) return { kind: 'closed', atMs: cs.closedAt, todayMs: serverNow() };
    const end = endsAtMsOf();
    if (end === null) return { kind: 'none' };
    return { kind: 'left', ms: end - serverNow() };
  };
  function renderClock() {
    const clock = document.getElementById('clock'), quorum = document.getElementById('quorum');
    const begun = !!(cs && cs.constitutedAtT !== null);
    const st = clockState();
    const text = begun ? SESSION.clockText(st) : stageWords;
    if (clock.textContent !== text) clock.textContent = text;
    // the clock is the door to moving the close: live only while there is
    // a close to move

  const extra = {
    entries: () => railEntries,
    isOpen: (id) => S.open === id,
    openId: () => S.open,
    // the review walk arriving at a Rules card from a text record's OK (Q1536)
    walkTo: (k) => { bandWalkTo(k); render(); },
    closeOthers: (mine) => {
      // one card at a time (backlog 204): a charter card opening leaves edit
      // mode — the draft is kept — with no render of its own, since `toggle`
      // renders the charter itself in the same sequence.
      //
      // **Except the editing card, which is edit mode's own** (Q1134, Ed's QA
      // 2026-09-02). K31 names what leaves — *any other card opening (race,
      // band, identity)* — and the draft's card is not among them: it is
      // opened *by* a keystroke in edit mode (K13), and the column goes on
      // intercepting every input into a clause, which is how a second site
      // joins the same draft. Clearing the flag here was the whole of the bug
      // Ed found: by the time he pressed 📝 the mode was already off, so the
      // door opened again — closing the card, keeping the lift — where K31
      // says one press leaves (Q1133).
      if (!mine && S.editMode) {
        S.editMode = false;
        document.getElementById('doc').classList.remove('editing');
        renderRideTab();
      }
      if (S.open) closeThen(() => { S.open = null; });
    },
    tocLead,
    afterToc: () => { if (!charterOn()) applyProseFolds(); },
  };
  const sessionEnv = (fix) => ({
    DOC: [], SUGGS: [],
    // live: the wallet has no clock in the view (the drip tray says nothing),
    // and the pulse beats from the poll rather than a timer
    ...(LIVEMODE ? { SESSION_MINUTES: Infinity, editsHeld: 0, editsToNext: 0, fixturePulse: false } : {}),
    ...(fix ? { ROSTER: fix.ROSTER, FLOOR: fix.FLOOR, EDIT_RULES: fix.EDIT_RULES,
      SESSION_MINUTES: fix.SESSION_MINUTES, editsHeld: fix.editsHeld, editsToNext: fix.editsToNext,
      // the fixture's own moment (Q1523): its records are dated against it, so
      // the rail reads *Sun 15:25* on every run rather than drifting by the day
      railNow: () => fix.NOW } : {}),
    mounts: { doc: document.getElementById('charter'), queue: rail,
      toc: document.getElementById('toc'), wires: document.getElementById('wires'),
      wallet: document.getElementById('wallet'), pulse: document.getElementById('pulse') },
    // the two capabilities the charter half needs to know about: read at
    // call time, so pressing OK on a grant takes effect on the next render
    // with no remount (**a power is not held until it is acknowledged**)
    mayPropose: () => mayPropose(),
    mayJudge: () => mayJudge(),
    // ✒️ on the Text (R-058, entry 160): whether this reader's own hand
    // amends the document. `mayPenOn('text')` is already the true question —
    // the pen held on 📄, the document open, the grant acknowledged — and
    // `constituted()` is the era: **before the start nothing is amended, only
    // set** (§9.6a), where the road is `confirmStartingText` and the module
    // would refuse this one anyway.
    mayPen: () => constituted() && mayPenOn('text'),
    // edit mode (backlog 204): the caret is edit mode's, read at call time
    editing: () => !!S.editMode,
    // …and the way in, for the one charter act that is itself a door into
    // writing: *re-make it here* on a stranded proposal (Q170, SURFACE E38).
    // `setEditMode` and not `toggleEditMode`, which would close the card the
    // press has just turned into the draft.
    enterEditing: () => setEditMode(true),
    // …and the way out, for the act that ends the writing (Q1485 (A)):
    // proposing spends the whole draft, so the lifted column has nothing left
    // in it. `setEditMode` and not `leaveEditMode`, whose first act is to
    // close the open card — the card has already collapsed by then.
    leaveEditing: () => setEditMode(false),
    // the sign control (Q770): the elective 👤 rung's base, or null — read at
    // call time, so a 👤 motion carrying while a draft is open changes what the
    // next draft offers and nothing about the one being typed
    signing: () => {
      const auth = csState('authorship');
      const r = auth && auth.value ? auth.value.rung || auth.value : null;
      return r === 'anonymousElective' ? 'anonymous' : r === 'sealedElective' ? 'sealed' : null;
    },
    // what the signature will read as: the module's record where there is
    // one (the name the wire will attach), the provisional row before it
    signerName: () => {
      const id = viewerId();
      if (cs && id) {
        const m = cs.memberRecords().get(id);
        const n = m ? m.name : (id === FOUNDER ? cs.convenorRecord().name : null);
        if (typeof n === 'string') return n;
      }
      return viewerRow().n || '';
    },
    // **The face the room will see** (K30, backlog 255). The rung *whole*, not
    // the elective base — `public` attaches a name with no choice offered, so
    // the sign control is silent there and the speaker is not.
    authorRung: () => {
      const auth = csState('authorship');
      return (auth && auth.value ? auth.value.rung || auth.value : null) || null;
    },
    // and the viewer as everybody else would see them, off the same records
    // `signerName` reads — the module's where there is one, the provisional row
    // before it. A member with no name signs *as Anonymous* (§9.0c), so the
    // name falls back the way the sign control's label does.
    signerPerson: () => {
      const id = viewerId();
      if (cs && id) {
        const m = cs.memberRecords().get(id);
        const rec = m || (id === FOUNDER ? cs.convenorRecord() : null);
        if (rec) return { n: (rec.name || '').trim() || 'Anonymous', pic: rec.picture || '' };
      }
      const row = viewerRow();
      return { n: (row.n || '').trim() || 'Anonymous', pic: row.pic || '' };
    },
    extra, hooks: hookProxy,
  });
  const FIXTURE = new URLSearchParams(location.search).get('fixture');
  const boot = () => {
    if (LIVEMODE) { liveBoot(); return; }
    // nothing opens itself, arrival included (Ed, 2026-08-20, reversing
    // the same morning's auto-open): the surface teaches by being clicked,
    // and the title task standing alone in the rail IS the first question
    if (BIRTH) birthBoot();
    relabel(); render();
  };
  if (FIXTURE === 'session' && !LIVEMODE && !BIRTH) {
    // ?fixture=session — the Hollow Oak session: the founding settled by ⏩,
    // the constitution folded, and the fixture's charter with its 42 items.
    // The fixture file is loaded only here, so the served page never carries it.
    const sc = document.createElement('script');
    sc.src = 'fixture-session.js';
    sc.onload = () => {
      FIX = window.FIXTURE_SESSION;
      SESSION.init(sessionEnv(FIX));
      setProse(fixtureText(FIX.DOC));
      // the fixture's clock: the Hollow Oak session has 2h 11m left (its old
      // hard-coded stat), which the ladder renders at the 20-minute step
      const left = new Date(Date.now() + 131 * 60_000);
      const p2 = (n) => String(n).padStart(2, '0');
      S.endsAt = left.getFullYear() + '-' + p2(left.getMonth() + 1) + '-' + p2(left.getDate()) + 'T' + p2(left.getHours()) + ':' + p2(left.getMinutes());
      devFastForward();
      // the rules' history is the band's, so it is put where the band is drawn
      if (new URLSearchParams(location.search).get('band')) fixtureMotions();
      S.folded.add('cs-constitution');
      if (!new URLSearchParams(location.search).get('band')) document.getElementById('doc').classList.add('fixsession');
      // ?fixture=session&closed=1 — the Hollow Oak session, closed (Q470):
      // two races left undecided, two signatures (one anonymous), the
      // founder's seat still to sign — for looking at, not probed
      if (new URLSearchParams(location.search).get('closed')) closeFixture();
      S.open = null; lastOpen = null; BND.birthsMuted = true;
      render();
    };
    document.head.appendChild(sc);
  } else {
    SESSION.init(sessionEnv(null));
    boot();
  }
})();
</script>
</html>
