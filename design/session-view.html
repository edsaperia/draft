  // ---- 🧭 the shape (entry 166) — read from the bundle's table, never a

  const SHAPE_NOUN = { meeting: 'a meeting', conference: 'a conference', ongoing: 'an ongoing document' };

  const shapeHides = (k) => { const r = shapeRow(); return !!(cs && r && r.hides.includes(midOf(k))); };
  // *given by the shape and untouched, before the start* — the module's own
  // test (`SettingView.shaped`), read through whichever `cs` this is
  const shapedOn = (k) => { if (!cs || !MANAGED_KEYS.includes(k)) return false;
    if (cs.isRemote) { const st = csState(k); return !!(st && st.shaped); }
    return cs.shaped(midOf(k)); };
  // the provenance sentence: third person, a fact about the document, gone
  // the moment the founder touches the clause or presses 🍾

  // **A chip is lit by which chip was pressed, never by its own value.** The

    if (!r || !r.unit || !cs || cs.constitutedAtT !== null) return [];

      id: 'h' + h2,

    return [1, 2, 3].map((d2) => { const at = new Date(now2.getFullYear(), now2.getMonth(), now2.getDate() + d2, 18, 0);
      return { id: 'd' + d2, label: d2 === 1 ? 'tomorrow evening' : 'in ' + d2 + ' days', val: msToLocal(at.getTime()) }; }); };
  const endChipsHtml = () => { const chips = endChips();
    return chips.length ? '<span class="setrow2 endchips">' + chips.map((c2) =>
      '<button class="btn' + (S.endChip === c2.id ? ' on' : '') + '" data-set="endsAt"' +
      ' data-chip="' + c2.id + '" data-val="' + c2.val + '">' +
      esc(c2.label) + '</button>').join('') + '</span>' : ''; };
  // **The one price scale** (entry 94): what an act on the membership costs,
  // in the document's three verbs — the same words on 🪪 and 🥾, so a reader
  // learns them once. 🥾 keeps the rung admission has no analogue for.
  const PRICE_WORDS = {
    admission: { assembly: 'All members must approve every new member joining',
      proposal: 'Members must vote on every new member joining',

  const POLICY_WORDS = { invite: 'Invitation only', apply: 'Anyone may apply' };

    ending: () => (perpetual() ? 'The drafting process has no set end — it runs until too few members are active.'

    quorum: () => (S.quorumForm === 'count'

    // 🤝 is one switch; what an application costs is 🪪's sentence (entry 94)
    applications: () => (policyNow() === 'apply'

    slug: () => 'The document lives at ' + docAddr(S.slug) + '.',
    // **The admissions clause** (Ed, 2026-08-26): what it costs to bring

    admission: () => ({
      assembly: 'Members may propose to invite people to join the membership, and all members must agree 🏛️.',
      proposal: 'Members may propose to invite people to join the membership, and the membership decides ✏️.',
      pen: 'Members may invite people to join the membership ✒️.',
    })[admissionPrice()],
    removal: () => ({
      consent: 'Removing a member needs every member to agree, including them 🏛️.',
      assembly: 'Removing a member needs every other member to agree 🏛️ — they see the proposal, and it is decided without them.',
      proposal: 'Members may propose to remove a member, and the membership decides ✏️.',
    })[removalPrice()],
    // the doors state the price their setting decides
    invite: () => ({
      assembly: 'Anyone may be proposed as a new member, and every member has to agree — one refusal keeps them out.',
      proposal: 'Anyone may be proposed as a new member, and the membership decides.',
      pen: 'Any member may invite whom they like — an invitation is sent on their word.',
    })[admissionPrice()],
    remove: () => ({
      consent: 'A member may be proposed for removal, and every member has to agree — including them.',
      assembly: 'A member may be proposed for removal, and every other member has to agree.',
      proposal: 'A member may be proposed for removal, and the membership decides.',
    })[removalPrice()],
    // 📄's sentence, in the two tenses its task now has (Q799). Before the
    // start the fact is the one the founder is acknowledging — what stands in
    // the column is what the document begins from — and afterwards it is the
    // record of what did. **Nothing renders it today**: `doc` is a rail-only
    // section, `textAnchor` draws 📄's pile beside the charter heading rather
    // than on a clause of its own, and `headFor` returns null for 📄 because
    // its clause is the document itself (F15). It is kept in step so that the
    // sentence and the card cannot drift apart if 📄 is ever given a paragraph.
    text: () => { const n = proseCounts().blocks;
      return !constituted()
        ? 'The document begins from whatever stands in the column below.'
        : n ? 'The document starts from ' + n + ' blocks of text.'
        : 'The document starts empty — the members write it.'; },
  };
  // 404 (Ed, 2026-08-19): the preamble states the defaults once; a clause
  // states only its deviations, in 396c's precise third person. Delegated
  // ⇒ silence — the defaults are the whole of the rule.
  // The first Membership question. Until one is decided the document has no
  // membership to speak of, so no clause says what decisions from one take
  // (Ed, 2026-08-21) — which is also what keeps the birth's first sentences
  // to the one fact that is true at the birth: the founder holds this.
  const membershipDecided = () =>
    ['hat', 'admission', 'applications', 'lapse', 'removal'].some((k) => settled(card(k)));
  const holderLine = (k) => {
    if (!PW_KEYS.includes(k)) return '';
    // at the birth the founder holds everything by construction — there is no
    // module yet, and nobody else to hold anything
    // — and the title's is the one that says whose hand that is (backlog 140)
    if (!cs) return ' ' + founderMay([pwPhrase(k, 'u')], k === 'title');
    const st = pwState(k);
    if (!st || st.holder === 'members') return '';
    const p = st.powers;
    const pend = pwPend(k);
    // one sentence, joining whichever powers the Founder actually holds —
    // and, since R-048, a second for whichever they have laid down from the
    // start. The two cannot be joined: *until the document begins* would
    // scope over both halves of a sentence that means it about one.
    const parts = [];
    const going = [];
    if (p.unilateral) (pend.u ? going : parts).push(pwPhrase(k, 'u'));
    if (p.assent && membershipDecided()) (pend.a ? going : parts).push(pwPhrase(k, 'a'));
    const said = [founderMay(parts), founderMayNotYet(going)].filter(Boolean);
    return said.length ? ' ' + said.join(' ') : '';
  };
  // **A settled clause is the rule, then the deviation** (Ed's QA, entry 198):
  // the rule and its provenance make line one, and what the Founder may do
  // about it stands on the line beneath, so a reader who wants the rule alone
  // stops at the end of the first line. The break is a newline character,
  // never a `<br>`: this string is plain text and both consumers escape it,
  // so the markup is made after escaping (`breakLines`). `holderLine`'s own
  // leading space is kept **before** the break, which is what leaves
  // `textContent` byte-identical and the frozen strings undisturbed.
  const clauseText = (rule, k) => {
    const h = holderLine(k);
    return rule + shapedLine(k) + (h ? ' \n' + h.slice(1) : '');
  };
  // **Links in the constitution are real links** (Ed, 2026-08-19):
  // underlined, ink-coloured (.doclink), applied after escaping so a
  // sentence can never smuggle markup in. The `d/` is optional so a member's
  // own sentence naming a bare address still becomes a link — but the route
  // segment has to be in the pattern, or the clause's own address links as
  // far as `docs.vote/d` and stops (backlog 70)
  const linkify = (s) => String(s).replace(/\bdocs\.vote\/(?:d\/)?[a-z0-9][a-z0-9-]*/g,
    (m2) => '<a class="doclink" href="https://' + m2 + '" target="_blank" rel="noopener">' + m2 + '</a>');
  // the clause's own line break, made after escaping for the same reason
  // `linkify` is: the sentence carries member text, and a `<br>` written into
  // the plain string would print as characters. Applied **only** to the
  // clause sentence, never to a record's title or a power head — for those
  // `esc` stays the whole of the answer, and a newline in member-written text
  // must not become markup.
  const breakLines = (s) => String(s).replace(/\n/g, '<br>');
  const decisionLine = (c) => {
    // a grant's paragraph states the document's rule (third person, the same
    // for every reader); the card that opens on it is yours
    // 🍾's clause is the Proposals preamble (Ed, 2026-08-22): the tab hangs
    // on the sentence the press makes true, and the moment itself stays on the
    // Founded line, which carried it already. Since Q748 the preamble is
    // **the whole opening of the section** and 💡 ⚖️ 🏛️ share it, so all four
    // heads are the rule as the document states it (F15).
    if (c.isBegin) return proposalsClause();
    if (c.k === 'canpropose' || c.k === 'canjudge') return proposalsClause();
    if (c.isClosing) return 'The document closed' + closedAtWords() + '. ' +
      (closeSignatures().length === 0 ? 'Nobody has signed it yet.'
        : closeSignatures().length + (closeSignatures().length === 1 ? ' member has' : ' members have') + ' signed it.');
    // 🏛️'s own sentence survives only where there is no preamble to join
    // (Q750) — otherwise the preamble's own sentence 2 states the route
    if (c.k === 'grant-voice') return voiceInStack() ? proposalsClause()
      : 'Each member holds one voice in every constitutional question.';
    // ✒️ and 🛡️ write no sentence (Q639 (a), Ed 2026-08-22). They used to
    // state a count — *The Founder holds the pen on 16 settings.* — which
    // `holderLine` already says on every setting the power turns, and which
    // the wallet's own tooltip already says in the second person. Their tabs
    // now stand on the Founded line and that sentence is their clause, so
    // neither this function nor `para` is ever called with them; `headFor`
    // returns null and `ctx.clauseFor` supplies the head.
    // **The founder's own answer writes no clause** (Q786, Ed 2026-08-25). It
    // used to state one in either direction — *The Founder has (not yet)
    // answered as a member.* — standing under the delegated setting's own
    // sentence, which already says how many of the members have answered and
    // counts the founder among them. Two clauses for one fact, and the second
    // of them about a person rather than the document. Since Q787 the card
    // draws no paragraph at all (its tab rides the setting's pile), so this
    // branch is reached only where something asks for the sentence directly.
    if (c.ansFor) return '';
    // 💡's and ⚖️'s own branches are `proposalsClause`'s sentence 1 now
    // (Q749), handled above: proposing opens at the start (§9.0b, Q606), the
    // blocker being 🍾 rather than the text.
    // **The birth is its own phase** (Ed, 2026-08-21). Before the save the
    // band is writing a constitution, whose sentences are third person, and
    // 📧 stands in the opening run beside the title and the link — there is
    // no Membership yet for it to belong to. After the save the same card
    // lives on your own member row, where the members list's sanctioned
    // "you" is the right voice.
    // Before the mail goes out the clause is **blank** (Ed, 2026-08-21): the
    // 📧 tab simply stands where its sentence will appear, the way an
    // `insert-anchor` is a held-open gap with its mark beside it. Nothing
    // has been decided, and a document does not narrate that somebody is
    // about to type.
    // 🧭's clause (entry 166): blank until chosen, as 📧's is until sent;
    // custom says nothing, being the absence of a shape
    if (c.k === 'shape') return S.seen.has('shape') && SHAPE_NOUN[S.docShape]
      ? 'The rules will be as for ' + SHAPE_NOUN[S.docShape] + '.' : '';
    if (c.k === 'myemail') return !cs
      ? (S.emailSent ? 'The Founder is checking their email for a link.' : '')
      : S.emailVerified ? 'Your address is verified.'
      : S.emailSent ? 'Your address is awaiting verification.'
      : 'Your address is not yet given.';
    if (c.kind === 'personal') return summary(c);
    if (isRoom(c)) {
      const st = csState(c.k);
      const collecting = st ? st.collecting : !((c.in || 0) >= E() && E() > 0);
      return !collecting && (!st || st.value !== null)
        ? clauseText((DECIDED[c.k] ? DECIDED[c.k]() : value(c)), c.k)
        // while the founder is the only person the document knows about, an
        // answer count would be counting the founder alone (pacing pass,
        // 2026-08-19) — the honest tail is that the question waits for a room
        // **The interim visibility rule is stated** (Q618 (a), 2026-08-22): before
        // 🌍 is settled a document is members-only, so the 🌍 clause says so
        // rather than only who is deciding — a stranger reading the door is
        // reading this rule, and the by-deviation grammar would otherwise leave
        // them reading a rule the members cannot see
        : (c.k === 'chamber'
          ? 'Until the members decide, only members can see the document — '
          : 'The Founder has delegated to members to decide ' + (WHAT[c.k] || 'this') + ' — ') +
          (isStranger() ? 'the members are answering.'
            : roomExists() ? Math.min(c.in || 0, E()) + ' of ' + E() + ' have answered.'
            : 'waiting for members.');
    }
    // the provenance rides between the rule and the powers (entry 166), and
    // since entry 198 the powers stand on their own line: *… As for a
    // meeting.* / *The Founder may amend this at will.*
    return settled(c) ? clauseText((DECIDED[c.k] ? DECIDED[c.k]() : value(c)), c.k)
      // the same interim rule while the Founder holds 🌍 undecided (Q618 (a))
      : c.k === 'chamber' ? 'Until the Founder decides, only members can see the document.'
      : 'The Founder is deciding ' + (WHAT[c.k] || 'this') + '.';
  };

  const ctx = {
    get open() { return S.open; }, get E() { return E(); },
    // the room a meaning is about, read on every render like `E` — the
    // settled strip's *takes* line says what the value means for the room
    // **as it stands now**, never for the room at the resolution (entry 167)
    get room() { return roomNow(); },
    // a setup entry's wash alpha rides the charter's urgency ramp (Q623 (a)):
    // the urgency is the rail's own `RAIL_U`, so the two columns agree
    urgencyOf: (c) => RAIL_U[stateOf(c, ctx)],
    // a clause that is a thing rather than a sentence: the membership list,
    // and — since Q639 — the Founded line the two grants hang their tabs on
    clauseFor: (c) => (onFoundedLine(c) ? foundedClause() : ''),
    // the title card's head is the document title itself — the clause,
    // opened — never the word “Title” (Ed, 2026-08-18)
    inDocOpenSlot: false,
    headFor: (c) => {
      if (c.power) return esc(powerHeadLine(c));
      // **A record's head is what was proposed** (Q942) — the way the top of
      // the ranking is a sealed text record's head (SURFACE §9). The outcome
      // and its date are the field's first line, not the clause.
      if (c.record) { const rec = recOf(c); return rec ? esc(motionDisplay(rec)) : esc(c.t); }
      // **a door heads with its people** (CP6, Q1101): the pile's list first,
      // then the rule as it stands beneath it, both inside the one head
      if (c.door) {
        const rule = settled(c) ? breakLines(linkify(esc(decisionLine(c))))
          : composerOn(c) ? esc(standsOf(c.k)) : '';
        return doorPeople(c) + (rule ? '<div class="doorrule">' + rule + '</div>' : '');
      }
      // post-save the title card opens at its own clause, so its head is
      // the clause sentence (the headdoct span stays: refreshCommit types
      // into it live); at the birth it is still the big heading itself
      if (c.k === 'title') return (cs ? 'The document is titled ' + LD : '') +
        '<span class="headdoct' + (S.title ? '' : ' ph') + '">' +
        esc(S.title) + '</span>' + (cs ? RD + '.' : '');
      const m = motionOn(c);
      // an ordinary motion's head is the value as it stands, wearing the
      // keep-lane; a constitutional one re-opens the question, title head.
      if (m) return routeOfM(m, c) === 'ordinary' ? esc(standsOf(c.k)) : null;
      // **The head is the rule, not the task's name** (Ed's QA, 2026-08-19):
      // a settled card is its own paragraph, opened, so what stands at its
      // head is the constitutional sentence the paragraph states. The
      // exceptions are cards whose clause is a thing rather than a sentence
      // — the membership (the list), the starting text (the document
      // itself), and since Q639 the two grants, whose clause is the Founded
      // line they hang their tabs on — and open questions, which their title
      // names better than a rule that does not exist yet.
      if (c.k === 'text' || onFoundedLine(c)) return null;
      if (c.isGate) return breakLines(linkify(esc(decisionLine(c))));
      if (c.ansFor || c.kind === 'personal') return null;
      if (settled(c)) return breakLines(linkify(esc(decisionLine(c))));
      if (composerOn(c)) return esc(standsOf(c.k));
      return null;
    },
    // reserved = held by the founder: the room may pass a change, and it
    // then goes to the founder as a 👑 question (accept or reject)
    reserved: (c) => !c.power && !c.record && !c.isGate && !c.ansFor && c.kind !== 'personal' && !membersHold(c),
    // a section never folds while it holds the open card or its tasks —
    // including a card pinned to its `lead` rather than enumerated by its
    // own keys: 🏛️ hangs on the Proposals preamble (Q750) and appears in
    // neither `cards` nor `tasksFor`, so without this the fold hid the one
    // paragraph its card can render in and the rail entry opened nothing
    foldedSec: (sec) => S.folded.has('cs-' + sec.key) &&
      !sec.cards.some((c) => S.open === c.k ||
        (tasksFor(c) || []).some((t2) => S.open === t2.k)) &&
      !(sec.key === 'rate' && voiceInStack() && S.open === 'grant-voice'),
    secToggle: (sec) => secToggleHtml('cs-' + sec.key),
    // the whole constitution folds under its own heading (Ed, 2026-08-19);
    // never while any card is open — a fold must not swallow the open card
    foldedGroup: () => S.folded.has('cs-constitution') && !S.open,
    groupToggle: () => secToggleHtml('cs-constitution'),
    // power tabs (403) and record chips (Q942): synthetic cards — never asks,
    // never tasks; a power tab's decision line is the power's own rule
    // sentence, and a record's is what it says it is. **A record is history,
    // not a task**: nothing is owed an OK, so it is `done` from the moment it
    // exists and wears the grey the band gives a settled thing.
    mustAct: (c) => (c.power || c.record ? false : mustAct(c)),
    waiting: (c) => (c.power || c.record ? false : waiting(c)),
    news: (c) => (c.power || c.record ? false : news(c)),
    // the paragraph seam, so 🏛️ draws no clause of its own where the
    // preamble is standing to carry it (Q750). The rail reads `tasksFor`
    // itself and is unaffected — the news still travels with its question.
    // Since Q787 an `ans-*` task is filtered here too: it is a chip of its
    // host setting's pile (`chipsFor` below), so a paragraph of its own would
    // be the same tab drawn twice.
    tasksFor: (c) => (c.power || c.record ? []
      : tasksFor(c).filter((t) => !t.ansFor && !(t.k === 'grant-voice' && voiceInStack()))),
    // esc before linkify, like the head path (review #1, finding 20): the
    // sentence carries the title, which is member text — unescaped it was
    // stored XSS into the constitution paragraph
    // a record draws no paragraph, so this is never asked for one — it
    // answers with the record's own title rather than throwing if it is
    // and `breakLines` only over the clause branch (entry 198): a record's
    // title and a power head carry no break, and wrapping them would turn a
    // newline in member-written text into markup after `esc` had made it safe
    decisionLine: (c) => (c.record ? linkify(esc(c.t))
      : c.power ? linkify(esc(powerHeadLine(c)))
      : breakLines(linkify(esc(decisionLine(c))))),
    // 🪜 has no paragraph of its own (Q512): the ramp is part of what the
    // threshold says, so its tab stands in 🌡️'s stack and opening it opens
    // at 🌡️'s own clause — which is also where its rail entry anchors,
    // since anchorOf falls back to the tab's paragraph.
    chipsFor: (c) => {
      // 📭 stands in the *Invitees* pile, not the Proposals one (E34): the
      // give-up is about somebody in the register, so its tab is beside the
      // subsection they are listed under — which is `admitCard`'s arrangement
      // and deliberately not `releaseCard`'s, a release belonging to no clause
      if (c.power || c.ansFor || c.record || c.mailgiveup) return [c];
      // the Proposals opening is one clause carrying four tabs (Q748): the
      // group is the same whichever of the four you come in by, and `para`
      // opens the card at 🍾's paragraph for any of them
      if (PROPOSAL_CHIPS.includes(c.k) || c.release) return proposalChips();
      const k = c.k === 'pace' ? 'bar' : c.k;
      const base = (k === 'bar' && card('pace') && visible(card('pace')))
        ? [card('bar'), card('pace')] : [card(k)];
      // your own answer to a delegated question stands in the pile of the
      // clause it answers (Q787): the value's tab, your question, then the
      // two power tabs. `stackOrder` puts whichever is asking in front, so an
      // unanswered question leads and an answered one falls in beside the
      // watcher — one place to click, and no clause about the founder.
      const withAns = base.concat(ansTaskFor(card(k)));
      const withPw = (cs && PW_KEYS.includes(k))
        ? withAns.concat([card('pw:u:' + k), card('pw:a:' + k)]) : withAns;
      // **and behind all of it, what has already been decided here** (Q942).
      // `stackOrder` ranks `done` last and sorts stably, so the rule — or its
      // question, or its power tabs — is always in front and the records stand
      // behind it in settle order. The ordering is this list's, never a second
      // sort.
      return withPw.concat(settledMotionsFor(k)
        .map((_rec, i) => card('rec:' + k + ':' + i)).filter(Boolean));
    },
    // **The lockline tells the truth about who set it** (Q510(a), Ed
    // 2026-08-21). It had said *Set by the founder when the document was
    // made* on every rule, including the ones the room decided by consent —
    // half-corrected on this surface by the watching half underneath, and
    // not corrected at all at the stranger's door, which is what forced it
    // there first. The *when* survives where it is true.
    lockline: (c) => { const st = csState(c.k);
      return st && st.settledBy && st.settledBy !== 'convenor'
        ? 'Decided by the members.'
        : 'Set by the founder when the document was made.'; },
    summary, value, isRoom,
  };

  // ---- the rail ----------------------------------------------------------
  // Grouped by pile and in pile order, so the two columns agree and nothing
  // jumps when you confirm something (Q320). Your own pile first: on this
  // screen that is the founder's, on the ceremony it is the members'.
  // ---- the setup tasks as session entries (stage 8) ----------------------
  // railEntry's markup, unchanged, wearing session.js's wash attributes so it
  // fades between colours like every other entry; and the margin-index meta
  // the layout needs: where it stands, whether it pins, how it ranks.
  // ask pins (it is the question you are being asked), news pins (a decision
  // you are owed), yours pins and is force-kept (a proposal of your own);
  // wait flows beside its paragraph. Ranks follow the tab stack's order
  // (urgent · … · adopted · … · propose · deciding); u is judgment leverage.
  let railEntries = [];
  const RAIL_RANK = { ask: 0, news: 4, yours: 6, wait: 7, done: 9 };
  const RAIL_U = { ask: 0.95, news: 0.5, yours: 0.5, wait: 0.2, done: 0 };
  // a setting's tab, wherever it currently stands — in the band, or beside the
  // big heading while the birth still has no clauses to hang it on
  const tabFor = (k) => document.querySelector(
    '#band .achip[data-tab="' + k + '"], #titlepara .achip[data-tab="' + k + '"], #ridetab .achip[data-tab="' + k + '"]');
  // **A stacked tab that is not in front carries no `data-tab`** (Q752): it is
  // inert, because nothing may click past the tab in front of it — so `tabFor`
  // was blind to it and its rail entry fell all the way through to the title
  // paragraph. Nothing reached that branch while the only piles with hidden
  // tabs were 🪜 and the power tabs, none of which has a rail entry; the
  // Proposals stack is the first group where three of four do. Every chip
  // carries `data-chip` whether or not it is clickable, so a pile's own
  // paragraph is findable for all of them — a fix for every pile, not this one.
  const hostParaOf = (k) => {
    const ch = document.querySelector('#band .achip[data-chip="' + k + '"]');
    return ch ? ch.closest('.cpara') : null;
  };
  // **The last resort has to be something on screen.** The fallback was the
  // title paragraph, which was the top of the document until the pre-save
  // heading started retiring at the save (backlog 33) — a hidden element
  // measures as a rect of zeros, which would lay the entry at the top of the
  // window and scroll the rail's click to y=0. So it is the title paragraph
  // while the title paragraph is showing, and the band's first clause after
  // that, which is what the top of the document then is.
  const anchorOf = (k) => {
    const tab = tabFor(k);
    const tp = document.getElementById('titlepara');
    return document.querySelector('.setupcard[data-setupcard="' + k + '"]')
      || document.querySelector('.cpara[data-para="' + k + '"]')
      || hostParaOf(k)
      || (tab && tab.closest('.cpara'))
      || (tp.offsetParent ? tp : (band.querySelector('.cpara') || tp));
  };
  function entryOf(c, cx) {
    const st = stateOf(c, cx);
    const html = railEntry(c, cx)
      .replace(/ data-washkey="[^"]*"/, '')
      .replace(/ style="--washcol: ([^;]+); --washbg: [^;]+; --fill: ([^"]+)"/,
        (m, col, fill) => SESSION.washAttrs('set:' + c.k, col, fill));
    return { id: c.k, html, pinned: st !== 'wait' && st !== 'done', rank: RAIL_RANK[st],
      u: RAIL_U[st], mine: st === 'yours', anchor: () => anchorOf(c.k) };
  }
  // birthPass sees only the setup tasks: the charter's own entries arrive
  // by session.js's rules, not by being reborn on every render
  const setupRail = () => ({ querySelectorAll: (sel) => {
    const ids = new Set(railEntries.map((e) => e.id));
    return [...rail.querySelectorAll(sel)].filter((el) => ids.has(el.dataset.q)); } });

  // ---- `dead-click-nudge` (Q650–Q653, Ed 2026-08-23) ---------------------
  // A founder meeting the birth has never seen this surface, and the rail is
  // where every piece of work is. But the failure Ed watched in user testing
  // was worse than the rail going unnoticed: #doctitle is a bare <h1> with no
  // data-card and nothing listening above it, so clicking "Untitled" — the
  // obvious door, and the thing people reach for first because they expect to
  // edit a title in place — does *nothing at all*. The tester got no response
  // and went looking for the nearest thing that would accept typing, which is
  // the prose column underneath. They typed the title into the document.
  //
  // So a click that lands on nothing answers itself: the task that *is*
  // waiting beats, in its tab and in its rail entry at once (Q650), which is
  // what teaches that the two are one thing rather than just pointing at a
  // corner of the screen. It never opens the card, however many times they
  // click (Q652) — the nudge is a teacher, and C1/F10 keep the opening click
  // the user's own. Nothing beats unprompted: the intermittent jiggle first
  // asked for was dropped (Q651), because every other motion on this surface
  // is a consequence — a clause fades because it was born, an entry lifts
  // because it was pressed — and the birth has no clock to ride in any case.
  //
  // It renders nothing and changes no state: a pure DOM poke, in the shape of
  // session.js's own beat(). A render would rebuild both rails wholesale and
  // take the class with it.
  const BEAT_MS = 640;                   // the taskBeat keyframe's own duration
  function beatEl(el) {
    if (!el) return;
    el.classList.remove('nudge');
    void el.offsetWidth;                 // so a second click beats again
    el.classList.add('nudge');
    const off = () => el.classList.remove('nudge');
    el.addEventListener('animationend', off, { once: true });
    // the wallet's lesson — never depend on your own animation finishing. Under

    // the only thing that lets the held lift go.
    setTimeout(off, BEAT_MS + 60);

  // The next task: the first entry still asking for something, in rail order —

  function nudgeNextTask() {
    const li = [...rail.querySelectorAll('.qitem')].find((q) => q.querySelector('button.needs'));

  document.addEventListener('click', (ev) => {

    if (ev.target.closest('a, button, input, textarea, select, label, [role="button"], [contenteditable="true"]')) return;

    const sel = window.getSelection();

  function renderRail() {

    railEntries = servedCards().map((c) => entryOf(c, ctx));

  // ---- `session-clock` (Q466/Q471) ----------------------------------------
  // The topbar middle reads the room: pulse · clock · quorum. Before the
  // start the line keeps the founding's stage words and the head count;
  // from the start it is where the document is in its life — the countdown
  // at the ladder (empty on a perpetual document), Frozen, or Closed [date]
  // forever — and *quorum N of E*. The countdown runs on the server's clock:
  // the view carries serverNowMs and the page offsets by when it arrived.
  let stageWords = 'reading only';
  const serverNow = () => (cs && cs.isRemote && cs.v.serverNowMs)
    ? cs.v.serverNowMs + (Date.now() - (cs.v.receivedAtMs || Date.now())) : Date.now();
  // the ending as it stands, in ms — the module's typed value, never the
  // founder's field once something is settled
  const endsAtMsOf = () => {
    const st = csState('ending');
    if (st && st.value) return st.value.endsAtMs;           // null = never
    if (S.ending === 'perpetual') return null;
    const ms = Date.parse(S.endsAt); return Number.isFinite(ms) ? ms : null;
  };
  const clockState = () => {
    if (!cs || cs.constitutedAtT === null) return { kind: 'none' };
    if (cs.closed) return { kind: 'closed', atMs: cs.closedAt, todayMs: serverNow() };
    if (cs.frozen) { const mr = typeof cs.mustReturn === 'function' ? cs.mustReturn() : cs.mustReturn;
      return { kind: 'frozen', mustReturn: mr == null ? undefined : mr }; }
    const end = endsAtMsOf();
    if (end === null) return { kind: 'none' };
    return { kind: 'left', ms: end - serverNow() };
  };
  function renderClock() {
    const clock = document.getElementById('clock'), quorum = document.getElementById('quorum');
    const begun = !!(cs && cs.constitutedAtT !== null);
    const st = clockState();
    const text = begun ? SESSION.clockText(st) : stageWords;
    if (clock.textContent !== text) clock.textContent = text;
    // the clock is the door to moving the close: live only while there is
    // a close to move
    clock.disabled = !(begun && st.kind === 'left');
    clock.title = clock.disabled ? '' : 'When does it end? — open the ⏰ card';
    // **The count belongs to what it is about** (Q860). The begun reading is
    // the quorum's — `arrived()` is `cs.E()` live, the electorate, which drops
    // the lapsed — and it stays a sentence, because *k of n* is a fact about a
    // decision and not about who is in the room. The pre-Begin head count is
    // what the row of faces replaces, so it says nothing at all now.
    const q = begun
      ? 'quorum ' + ((cs.isRemote && cs.v.floor) || quorumCount()) + ' of ' + arrived()
      : '';
    if (quorum.textContent !== q) quorum.textContent = q;
    // The faces themselves. `renderClock` diffs by `textContent` and beats on
    // its own 30-second interval, out of step with `render()` — and a row of
    // faces is markup, so it is guarded by a key of exactly what it draws.
    // Without that the stack is either rebuilt twice a minute under whatever
    // the pointer is doing, or never rebuilt at all.
    const faces = document.getElementById('faces');
    const others = roomFaces();
    const shown = others.slice(0, FACE_CAP);
    const key = JSON.stringify([others.length,
      shown.map((p) => [p.mid || p.e || '', p.pic || '', p.n || ''])]);
    if (faces.dataset.k !== key) {
      faces.dataset.k = key;
      // the overflow counts everybody else the row could not fit, which is the
      // stack's own arithmetic and not the room's: the row is the register's
      // arrived rows, where the quorum line above is the engine's electorate
      faces.innerHTML = shown.map((p) => '<span class="seat"' +
        (p.mid ? ' data-mid="' + esc(p.mid) + '"' : '') + '>' + avHtml(p) + '</span>').join('') +
        (others.length > shown.length
          ? '<span class="more">+' + (others.length - shown.length) + '</span>' : '');
    }
    // and the head count stays reachable. It used to be printed as *n in the
    // room*; entry 215 took that word off the surface, and *n members here* is
    // the same claim — presence, and nothing else (C16) — so it is a phrase
    // rather than a noun swap, and it counts one member in the singular.
    const here = members().filter((p) => p.in).length;
    const t = others.length ? here + (here === 1 ? ' member here' : ' members here') : '';
    if (faces.title !== t) faces.title = t;
  }
  // the ladder sharpens on its own: the coarsest step is ten minutes, so a

  setInterval(() => { if (cs) renderClock(); }, 30_000);
  // the dev dropdown of actual users (Ed, 362) — rebuilt only when it

  function renderDev() {
    const sel = document.getElementById('devwho');

      esc(r.n || (r.founder ? 'Unnamed founder' : 'Invited · ' + (r.e || '?'))) +
      (r.founder ? ' 🎩' : r.in ? '' : ' (invited)') + '</option>').join('') +
      '<option value="applicant"' + (S.viewer === 'applicant' ? ' selected' : '') + '>— an applicant</option>' +
      '<option value="stranger"' + (isStranger() ? ' selected' : '') + '>— a stranger</option>';

  function renderTitle() {
    const d = document.getElementById('doctitle');

      // but the answer goes on the 🪶 card, and this is where the *result*

      el.textContent = S.title || 'Untitled';

    d.style.display = (!cs && S.open === 'title' && !settled(card('title'))) ? 'none' : '';
    // **One tab, and it is the clause's** (Ed, 2026-08-21: *I see the 🪶 tab

    document.getElementById('titlechip').innerHTML =

    prose.classList.toggle('writeready', !!cs && !constituted() && amFounder());
    // **The caret leaves with the founder's hand** (Ed's QA, 2026-08-19: he

    // one exists an editable prose is a phantom power — keystrokes accepted
    // and silently discarded. It was never editable off the founder's own
    // seat, and it still is not.
    //
    // **The hand leaves at 🍾, not at 📄's OK** (Q820, Ed 2026-08-25). The
    // moment the old rule froze on was the acknowledgement, which is a
    // statement about what the document *will* begin from — so between the OK
    // and the cork the founder was locked out of a column nothing else could
    // yet change. The phantom-power argument is exactly why the freeze moves
    // rather than simply lifting: the write channel moves with it (the stash
    // while unconfirmed; after the first confirm the row's ✒️, the only save

    // and 🍾 flushes the column one last time (Q822), so every keystroke has

    //
    // **And since backlog 204 the caret is edit mode's**: before the save the
    // birth column is free (the quill line — no tab, no row); from the save
    // the founder presses 📝, or types, and the column takes the caret.
    prose.contentEditable = String(!constituted() &&
      S.viewer !== 'applicant' && amFounder() && (!cs || S.editMode));
    document.getElementById('doc').classList.toggle('begun', charterOn());
    document.getElementById('doc').classList.toggle('editing', !!S.editMode);
    renderProseRow();
    renderRideTab();
    // **The ✏️ socket stands whether or not you may propose** (Q532). It used
    // to be `display: none` for everybody who could not — a stranger, an
    // applicant, a clerk, a member before 🍾, a member who has not accepted the
    // grant — which is precisely the set of readers the toolbar exists to tell
    // something. Now the socket is there with the tool struck through, and the
    // grant fills it.

    document.getElementById('wallet').style.display = stormHolding ? 'none' : '';
    SESSION.setWalletHeld(charterOn() && mayPropose());
    document.getElementById('pulse').style.display = (FIX || (LIVEMODE && charterOn())) ? '' : 'none';
    syncWallet();
  }

  // ---- the bodies a founder fills in ------------------------------------
  // **Constitutional settings default to the room; ordinary ones default to
  // you** (Ed, 2026-08-18, agreeing the proposal rate back to the founder). One rule
  // where there had been a rule and three exceptions, and the ordinary /
  // constitutional cut is what explains it: an ordinary setting can be taken
  // back by the room at any time with a motion at the bar, so defaulting it to
  // the founder costs them nothing. A constitutional one cannot — changing it
  // needs everybody — so it has to be theirs from the start or it is not
  // really theirs at all.
  // §9.7 v0.52 (Ed, 2026-08-19): the verb is **delegate**, and it is never
  // a button — a constitutional sentence among the setting's own options.
  // Since 403 the sentence survives only on the applications card (whose
  // holder rides its value, so delegation IS one of its values); every
  // other setting delegates through the ✒️/🛡️ tabs.
  const POSTLABEL = 'Applications are delegated to the members';
  const POSTNOTE = 'The rule stays as it is, but from now on the members change it: you propose like anybody else, and nothing waits for your OK. You cannot take this back on your own — that would need all members to agree.';
  // 403 (Ed, 2026-08-19): “The members decide” is no longer a value —
  // delegation is the state of holding neither power, said by the ✒️ and
  // 👑 tabs. On a delegated setting the value card explains, and picking
  // a value is the taking-back.
  // **Delegation is an option on the card** (Q511, Ed 2026-08-21: *delegation
  // should be an option on the decision card … which is essentially the same
  // as “skip this and go to the next one”, because it means “don't decide
  // now”*). It stands apart from the values, after them, because it is not
  // one of them: the others answer the question, this one hands it over. It
  // is the same act the ✒️/🛡️ tabs perform — holding neither power — said
  // where a founder walking the constitution will meet it, and in a single-
  // file founding it is also the only way past a question you are not ready
  // to answer. Rendered once, for whatever card is open, so no body can
  // forget it and none of the settings that cannot be delegated can get it.
  const delegateRung = (c) => {
    const dk = DKEY[c.k];
    if (!dk || !DELEGABLE.includes(dk)) return '';
    if (!cs || cs.constitutedAtT !== null) return '';   // one-way after the start
    // **No radiogroup of its own** (Q771): this rung writes the *same* state
    // key as the values above it, so it is part of that question rather than a
    // second one. Two elements each claiming the role made two groups out of
    // one decision, which the value group's own label already covers.
    return '<div class="choice delegrung">' +
      opt(S, dk, 'roster', 'Let the membership decide this rule themselves',
        'Not now — every member states what they will accept, blind, before drafting begins, and the document takes the answer that satisfies all of them. ' +
        (c.rule ? String(c.rule).replace(/<[/]?b>/g, '') : '')) +
      '</div>';
  };
  // **One fact, one home** (Q763, STYLE T36). How blind answers aggregate had
  // two homes and both printed into one body: the card record's `rule`, which
  // the delegate rung above explains itself with, and a literal note handed to
  // this function at every call site. On ⏱️, 👥 and 🥾 the two were verbatim,
  // so a delegated card said the same sentence twice a few lines apart. The
  // note argument is gone: the record owns the aggregation rule and this
  // paragraph prints the one fact only it can know — the frame, and what
  // applies **meanwhile**, while the question is still collecting.
  const theyDecide = (key) => {
    if (!wantsDelegate(key)) return '';
    const c = card(key);
    return '<p class="setnote">' +
      (cs && cs.constitutedAtT !== null
        ? 'You propose like anybody, and nothing comes to you for assent.'
        : '<b>Asked of everyone before drafting begins, blind</b> — you among them, if you are on the membership.' +
          (c && c.meanwhile ? ' ' + c.meanwhile : '')) +
      ' Picking a value here takes it back.</p>';
  };

  // Q506: the register's "and afterwards" pair is gone from this card —
  // the ✒️ and 🛡️ tabs under 🤝 are where the Founder keeps or gives up
  // inviting directly and the OK on carried applications, like any setting.
  // Founded by [avatar] [name] at [time] on [date] (Ed, 2026-08-19) —
  // the time is the start (§9.6a), never known before it. **The line itself
  // stands from the save** (Q640, Ed 2026-08-22): what is unknown before the
  // start is the *moment*, not the founding, so the sentence renders as soon
  // as there is a document and *gains* its time at the 🍾 press — the same
  // reasoning that makes an unnamed document read *Untitled* rather than
  // leave a gap where the answer goes.
  const foundedAt = () => {
    if (!cs || cs.constitutedAtT === null) return '';
    const d0 = new Date(cs.constitutedAtT);
    const p2 = (x) => String(x).padStart(2, '0');
    return ' at ' + p2(d0.getHours()) + ':' + p2(d0.getMinutes()) + ' on ' +
      d0.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
  };
  // **The Founded line is a clause, not a colophon** (Q639 (a), Ed 2026-08-22).
  // It is where ✒️ and 🛡️ hang their tabs now, so the sentence has to be
  // available in two places at once: as the paragraph in the band, and as the
  // *thing* at the head of the card that opens on it — the 🪪 pattern, where a
  // clause is a list rather than a sentence. It carries markup (the avatar, the
  // 👑 span), so it rides `ctx.clauseFor` beside `rosterClause()` and never
  // `headFor`, which escapes what it is given.
  const foundedClause = () =>
    (!cs ? '' : '<p class="cpv founded">Founded by ' +
      avHtml(founderInfo()) + ' ' + esc(founderInfo().n.trim() || 'Anonymous') +
      // 👑 by any reservation (Ed, Q379 wide); 📯 = holds nothing.
      ' ' + founderMark() + esc(foundedAt()) + '.</p>');
  // the close's moment, the same shape as the founding's
  const closedAtWords = () => {
    if (!cs || !cs.closed || cs.closedAt == null) return '';
    const d0 = new Date(cs.closedAt);
    const p2 = (x) => String(x).padStart(2, '0');
    return ' at ' + p2(d0.getHours()) + ':' + p2(d0.getMinutes()) + ' on ' +
      d0.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
  };
  // **A rung that carries a percent, and says what the percent would do**
  // (entry 165, Ed 2026-08-27: *3 preset buttons, and they can edit the
  // precise % if they really want to*). `opt`'s exact markup — the same
  // `.pick` · `.lanepick` · `.exp` · `.inner` a settings choice is drawn with
  // — plus two things only a percent ladder has: the number itself in small
  // type after the rung's name, and an `.exp` that is not fixed copy but the
  // module's sentence about **this room as it stands**, re-read on every
  // render the way `ceilingNote` is.
  //
  // An options object rather than `opt`'s positionals because the four rungs
  // of one ladder disagree about three things at once — the own rung sets a
  // different key from the three presets, states its own `on` (*whatever is
  // not a preset*), and is the only one carrying a field.
  const pctRung = (o) => {
    const on = !!o.on;
    return '<div class="pick' + (on ? ' on' : '') + (o.off ? ' off' : '') + '">' +
      '<span class="opttext">' + esc(o.label) +
      (o.pct ? '<span class="pct">' + o.pct + '%</span>' : '') + '</span>' +
      '<button class="lanepick" aria-pressed="' + on + '"' + (o.off ? ' disabled' : '') +
      (o.off ? '' : ' data-set="' + o.set + '" data-val="' + o.val + '"') + '>' +
      '<span class="dot"></span><span class="off">Prefer this</span>' +
      '<span class="on">Preferred</span></button>' +
      // `mean` is the rung whose sentence is about a number being typed rather
      // than about a fixed preset, so it carries the `data-meaning` hook
      // `syncMeaning` writes into — without it the sentence under the caret
      // keeps saying what the *previous* number meant until the field blurs.
      // The slot is rendered even while empty, which `.exp:empty` hides.
      (o.exp || o.mean
        ? '<span class="exp"' + (o.mean ? ' data-meaning="' + esc(o.mean) + '"' : '') + '>' +
          esc(o.exp || '') + '</span>' : '') +
      (o.inner ? '<span class="inner">' + o.inner + '</span>' : '') + '</div>';
  };
  // **The room every meaning is about, built once per read** (entry 167).
  // Four fields and no more, because a sentence may depend on the room and on
  // nothing else: the arrived membership, ⏰'s answer as it stands, this
  // page's own clock (the module reads none), and 🌡️'s number — the
  // founder's field where they have set one, else what the room settled,
  // which is the same source `startRungs`' dimming reads.
  // **An unanswered ⏰ is absent, not *never***: `endsAtMsOf` returns null for

  // as it runs* on a card the founder meets **before** ⏰ in the order.
  const endingKnown = () => { const st = csState('ending');
    return !!(st && st.value) || S.ending === 'perpetual' || isNum(Date.parse(S.endsAt)); };
  const roomNow = () => ({
    e: E(),
    endsAtMs: endingKnown() ? endsAtMsOf() : undefined,
    nowMs: serverNow(),
    barPct: isNum(S.tClose) ? +S.tClose : ((takenValOf('bar') || {}).pct ?? null),
  });
  // what a value would mean for the room as it stands, or nothing
  const meaning = (k, v) => M.meaningOf(k, v, roomNow()) || '';
  // …and the line it is printed on, which is `setup.js`'s (`.meaning`, one
  // class, one home). This surface only has to hand it the room.
  const meanLine = (k, v) => window.SETUP.meaningLine(k, v, roomNow());
  // **…and it follows the keystroke in place** (entry 167). The founder's
  // number fields store straight into `S`, and `TYPED[k]()` reads `S`, so
  // this asks the same question the render would have asked and writes only
  // the one line — because **nothing rebuilds under a press**, and a card
  // rebuilt under the caret is the drag bug's cousin. The full render still
  // waits for `change`, as the slider's does.
  const syncMeaning = (el) => {
    const k = S.open;
    if (!k || !TYPED[k] || !el.closest) return;
    const card = el.closest('.setupcard') || document;
    const slot = (el.closest('.pick') || card).querySelector('[data-meaning="' + k + '"]') ||
      card.querySelector('[data-meaning="' + k + '"]');
    if (!slot) return;
    slot.textContent = (!CHOSEN[k] || CHOSEN[k]()) ? meaning(k, TYPED[k]()) : '';
  };
  const isRungPct = (v) => M.BAR_RUNGS.some((r) => r.pct === +v);
  // 🌡️'s ladder: the three presets, then the number itself. The three set
  // `tClose` directly (`fillRung` takes `barBy` with them); the fourth is the
  // card's original *I set it* rung under its own name, so the field, its
  // `data-num` and the probe's two steps are exactly where they were.
  const barRungs = () =>
    M.BAR_RUNGS.map((r) => pctRung({
      // the block text is the rule as it would stand (Q1104 (b)); the short
      // label stays the strip's and 🪜's
      set: 'tClose', val: r.pct, label: r.sentence, pct: r.pct,
      on: S.barBy === 'founder' && +S.tClose === r.pct,
      exp: meaning('bar', { pct: r.pct }),
    })).join('') +
    pctRung({
      set: 'barBy', val: 'founder', label: M.OWN_RUNG_LABEL, mean: 'bar',
      on: S.barBy === 'founder' && !isRungPct(S.tClose),
      exp: isNum(S.tClose) && !isRungPct(S.tClose) ? meaning('bar', { pct: +S.tClose }) : '',
      inner: '<span class="setrow2">' + num(S, 'tClose', 'At the end', 50, 99, '%') + '</span>',
    });
  // 🪜's, inside *Rising*: the same three percents read as a starting bar, and
  // a rung is dimmed where it would not actually start below the close — a
  // ramp that starts at its own ceiling is not a ramp. The close is the
  // founder's own field where they have set one, else what the room settled;
  // with neither known nothing is dimmed, because nothing is yet false.
  const startRungs = () => {
    const close = isNum(S.tClose) ? +S.tClose : takenOf('bar');
    const dim = (pct) => isNum(close) && pct >= +close;
    // a dimmed rung carries no sentence: since entry 167 the sentence names
    // where the climb ends as well as where it starts, and *starts at broad
    // agreement and climbs to broad agreement* is what a ramp that does not
    // ramp would say — the dimming is already the whole of that fact
    // **A dimmed rung is never the chosen one, and what it leaves behind falls
    // to the own-number rung.** Lowering 🌡️ under a start already taken from a
    // preset dims every rung at or above it — including the one that is on —
    // and a disabled rung cannot be clicked off, so the box has to come back or
    // the card has no way left to change its own number.
    const stray = (v) => isRungPct(v) && dim(+v);
    return M.BAR_RUNGS.map((r) => pctRung({
      set: 'tStart', val: r.pct, label: r.label, pct: r.pct, off: dim(r.pct),
      on: S.shape === 'ramp' && +S.tStart === r.pct && !dim(r.pct),
      exp: dim(r.pct) ? '' : meaning('pace', { shape: 'ramp', startPct: r.pct }),
    })).join('') +
      // **The own rung sets the field it is about, not the shape**, and it is
      // T5 that says so: 🌡️'s fourth rung can wear `barBy=founder` because
      // that pair means nothing else on the card, but 🪜 has no holder key and
      // `shape=ramp` is already *Rising*'s — one rung value with two labels,
      // which `card-audit`'s cross-card pass reads as one rung that cannot
      // make up its mind. So it clears the start instead, which is also what
      // choosing it means: an empty box to type your own number into.
      pctRung({
        set: 'tStart', val: '', label: M.OWN_RUNG_LABEL, mean: 'pace',
        on: S.shape === 'ramp' && (!isRungPct(S.tStart) || stray(S.tStart)),
        exp: isNum(S.tStart) && (!isRungPct(S.tStart) || stray(S.tStart))
          ? meaning('pace', { shape: 'ramp', startPct: +S.tStart }) : '',
        inner: '<span class="setrow2">' + num(S, 'tStart', 'When voting opens', 50, 99, '%') + '</span>',
      });
  };
  const BODY = {
    // the retrospective branch keys on the **start**, not on the OK (Q820):
    // until 🍾 the column below is still the founder's and still the answer,
    // so the card that describes it must still describe it in the present
    text: () => (constituted()
      ? '<div class="unlocks"><b>The text the document started from.</b> Drafting changes the document in place, so the page may have moved on — this is what stood when it began.</div>' +
        '<div class="propblock"><div class="rtext">' +
        (String(cs.text || '').trim() === ''
          ? '<i>It began empty — the membership wrote it.</i>'
          : textDivs(cs.text)) +
        '</div></div>'
      // **Before the start the text is not a card body at all** (backlog
      // 204): 📝 toggles edit mode on the column itself, and the only card
      // that opens here is a power tab's, whose head is its own sentence
      // (`powerHeadLine`) and whose clause is the column below. The
      // acknowledgement this branch used to carry (Q797, an OK) is retired —
      // 📝 → write → ✒️, and no OK anywhere.
      : ''),
    hat: () => {
      const started = !!(cs && cs.constitutedAtT !== null);
      // the radio is the session-view's own opt(), over the derived current
      // (the pw() pattern): the generic data-set handler lands S.hatPick
      // nothing is preselected until it has been answered once
      const o = { hatPick: S.hatPick || (S.seen.has('hat') ? (iDraft() ? 'member' : 'clerk') : null) };
      return '<p class="why">Whether the Founder is also on the membership — inviting themselves like anybody else — or only runs the document.</p>' +
        '<div class="choice" role="radiogroup">' +
        opt(o, 'hatPick', 'member', 'Member — drafting too',
          'You get ✏️s, you vote, you count towards quorum, and you answer the founding questions like anybody.', '', started) +
        opt(o, 'hatPick', 'clerk', 'Clerk — not drafting',
          'No ✏️s, no voting, you count towards nothing, and there is nothing for you to answer. A clerk can stay unnamed.', '', started) +
        '</div>' +
        (started ? '<p class="setnote"><b>Settled.</b> Now that people are voting, the Founder joins the same way as anybody else.</p>' : '');
    },
    // 🧭 (entry 166): the three rows from the bundle's table and a fourth,
    // custom, whose two strings live here. Nothing preselected (F6); each
    // rung its title in bold and its consequence beneath. No number is typed
    // into the page — a row's `say` is the row's.
    shape: () =>
      '<p class="why">A shape sets the rules the way a document of that kind usually runs. You can change any of them afterwards.</p>' +
      '<div class="choice" role="radiogroup">' +
      M.SHAPES.map((r) => opt(S, 'docShape', r.name, esc(r.title), esc(r.say))).join('') +
      opt(S, 'docShape', 'custom', 'Custom', 'Decide everything yourself — every rule is a card.') +
      '</div>',
    title: () =>
      '<div class="lanebox"><div class="lp editlane titlelane' + (titlePending() ? '' : ' blank') + '"' +
      ' contenteditable="plaintext-only" spellcheck="false" data-titlelane="1"' +
      ' data-ph="Give this document a title">' + esc(titlePending()) + '</div></div>',
    // Stripped to the field on Ed's word (2026-08-19): the unlocks line, the
    // suggested-from-the-title note, "what people paste to each other", the
    // label and the Copy button all went. The card is titled Link and holds a
    // link — everything else was the surface explaining a thing that explains
    // itself. What survives is what the field cannot say: that a *collision*
    // moved your slug, whether what you have typed is legal and free, and
    // that changing it later breaks nothing.
    slug: () =>
      '<div data-slugnote>' + slugNoteHtml() + '</div>' +
      '<span class="fld"><span class="setrow2">' +
      '<span class="setnote" style="margin:0">' + docAddr('') + '</span>' +
      '<input data-slug="1" value="' + esc(S.slug) + '" spellcheck="false" style="width:16rem">' +
      '</span></span>' +
      // the rules recital went with the rest (Ed, 2026-08-19) — a legal link
      // says the one thing worth saying, that it is free. The illegal case
      // keeps its line: that is not helper text, it is why the ✒️ is greyed.
      // only when there is something wrong with it (Ed, 2026-08-19: *only
      // tell me when it's not free*) — a legal, free link needs no receipt
      (SLUG_OK.test(S.slug) ? ''
        : '<p class="setnote">Lower case, digits and hyphens, three characters or more.</p>') +
      // **Changing it sets up a redirect** (Ed, 2026-08-18). The link is
      // changeable and it is also the thing that has already been sent to
      // fourteen people — so a change that broke the old one would make this
      // the one ordinary setting with a cost for using it as intended.
      // **Said where you might change it, not where you set it** (Ed,
      // 2026-08-19): before the save nothing has been sent to anybody, so a
      // promise about old links is answering a worry nobody has yet.
      (cs ? '<p class="setnote">Every link this document has ever had keeps working: changing it leaves a redirect behind, so an invitation somebody was sent weeks ago still opens the right document.</p>' : ''),
    myemail: () => (S.emailVerified
      ? '<div class="lockline">' + TICK + '<span>Verified — <b>' + esc(S.myemail) + '</b> can get back in.</span></div>' +
        '<span class="fld"><label>Change it</label><input type="email" data-txt="myemail" value="' + esc(S.myemail) + '" style="width:20rem"></span>' +
        '<p class="setnote">Changing it starts verification again — the new address has to prove it works too.</p>'
      : S.emailSent
      // **The document says it was sent** (Ed, 2026-08-21): the clause reads
      // *The Founder is checking their email for a link*, so the card does
      // not repeat it — and *nothing exists yet, so a typo costs nothing* was
      // reassurance about a state the reader is not in danger from.
      ? (cs ? '<p class="why">The mail is the login: clicking its link is what proves the address works.</p>' : '') +
        // **The composer is simply there** (Ed, 2026-08-21). *Wrong address?*
        // was a button whose whole job was to put the field back — so the
        // field stays, and typing in it is the correction. Resending moved to
        // the commit row, where every other act on this surface lives.
        '<span class="fld"><input type="email" data-txt="myemail" value="' + esc(S.myemail) + '" placeholder="you@example.com" style="width:20rem"></span>' +
        (BIRTH ? '' : '<div style="margin-top:var(--s3)"><button class="btn" data-act="openmail">Open your inbox</button></div>') +
        (BIRTH ? ''
          : '<p class="setnote">In the mockup the inbox is a pretend one — the mail in it is the magic link, and clicking it proves the address works' + (cs ? '.' : ' and creates the document at ' + docAddr(esc(S.slug)) + '.') + '</p>')
      // the send button and the two explanatory blocks left on Ed's word
      // (2026-08-19): ✒️ sends it, and the card is a field with a title over
      // it — which is the whole of what it has ever been asking for
      : (S.emailErr
          ? '<p class="why"><b>' + esc(S.emailErr) + '</b></p>'
          : '') +
        (cs
          ? '<p class="why">Your address is the only way back in — there are no passwords — so a new one has to prove it works before it replaces the old.</p>'
          : '') +
        '<span class="fld"><input type="email" data-txt="myemail" value="' + esc(S.myemail) + '" placeholder="you@example.com" style="width:20rem"></span>'),
    myname: () => nameBody(me(), { optional: viewerIsClerk() }),
    mypic: () => pictureBody(me()),
    // **Whether the founder is in it is its own question** (Ed, 2026-08-18).
    // It had been the top half of the roster card, which made a decision about
    // one person a preamble to a list of everybody — and the founder is a hat
    // worn over a role rather than a role itself (SPEC §9.0a), so the hat and
    // the roster are two things.
    // The box is drawn only where it can send (Q812): before the start
    // anybody may be brought in freely, and after it only the pen invites
    // directly — with the shield alone, or with neither power, inviting is a
    // proposal like any other and the sentence says so rather than offering
    // a field that answers nothing (Q813).
    // **✉️ is where invitations are made** (Ed, 2026-08-26, entry 94): the
    // box that was 🪪's, on the door — drawn only where the viewer's word can
    // send (Q812): the founder before the start or holding the door's ✒️,
    // any member while 🪪 stands at ✒️. Otherwise the door is a composer,
    // and the sentence says what the proposal will cost.
    invite: () => (constituted() && !directInvite()
      ? '<p class="why">' + ({
          assembly: 'Bringing somebody in is a proposal all members must agree to — one refusal keeps them out.',
          proposal: 'Bringing somebody in is a proposal the membership decides at the approval threshold.',
          pen: 'Any member may invite on their own word.' })[admissionPrice()] +
        ' Proposing that somebody leaves is ❌.</p>' +
        doorErrHtml('invite')
      // and where the document is stuck on a question nobody can answer, the
      // card leads with *why you are here* (Q828) — the remedy above the door
      : oneVoiceAsk() +
      '<p class="why">An invitation is just the link, sent by email: somebody becomes a member when they open it, and is listed as <i>invited</i> until then.</p>' +
      // **The send wears the mark of the act** (Ed, entry 37): *it is the
      // Invite / Send invitations buttons that should be ✒️, as each invite is
      // the proposal.* In the direct form the viewer's own word sends (Y24),
      // and that is the ✒️ verb — nobody has to agree, because you hold the
      // power (the four verbs, SURFACE §7). It is a **click, not a hold**: the
      // ladder is for what comes out of a wallet, and a direct invitation
      // spends nothing — a member inviting at 🪪 *pen* holds no pen wallet at
      // all. And it is never disabled on an empty field, because the refusal
      // sentence (Y25) is what an empty field is owed.
      // The word goes, as it did on 📨 (Ed, 2026-08-21): a label beside a glyph
      // and a tooltip does nothing they were not already doing, and the
      // *Several at once* eyebrow already names the second box.
      '<div class="roster"><div class="addrow"><input type="email" placeholder="name@example.com" data-add="1" value="' + esc(S.inviteOne) + '">' +
      '<button class="btn btn-approve glyphbtn emojibtn" data-act="add"' +
      ' title="Send the invitation">✒️</button>' +
      // **A door's second act sits beside the door's own** (entry 161, Q1024).
      // ✉️'s act is the field and its ✒️, and §9.1 already rules that a door
      // whose act is in the body has nothing left to commit on the row — so
      // the route's commit joins the act here rather than contradicting a row
      // that is a bare ✓ exactly because the act is elsewhere.
      founderCommit(card('invite')) + '</div></div>' +
      doorErrHtml('invite') +
      '<div class="eyebrow fieldlab" style="margin-top:var(--s5)">Several at once</div>' +
            // the boxes keep what is in them across a close, like every other
      // field here: a pasted list of addresses is the most expensive thing
      // anybody types on this card (Ed, 2026-08-21)
      '<textarea placeholder="Paste addresses here, one per line" data-emails="1">' + esc(S.inviteMany) + '</textarea>' +
      '<div style="margin-top:var(--s2)"><button class="btn btn-approve glyphbtn emojibtn"' +
      ' data-act="invite" title="Send them all">✒️</button></div>' +
      '<p class="setnote">' + arrived() + ' of ' + S.roster.length + ' have opened it so far. ' +
      'Nobody has to be here for the document to exist, and anybody who arrives later ' +
      'starts with the same ✏️s as everybody else.</p>'),
    // **❌ with the pen is exile at will** (Ed, 2026-08-26): immediate, and
    // every answer the member was standing on leaves with them — the card
    // says so in the sentence, and the button is the whole of the act
    // **❌ names its subject with one control** (entry 96, Ed 2026-08-26): a
    // dropdown of **members and invitees alike** — withdrawing an invitation
    // is a kind of removal — in place of the per-row *❌ Remove* list, which
    // put the same act on as many buttons as there were people.
    remove: () => (directRemove()
      ? '<p class="why">' + (constituted()
          ? 'Removing a member is yours to do at will ✒️: they leave the moment you press, their standing answers go with them, and nobody else is asked.'
          : 'Until the document begins, taking somebody off the list is yours alone — an invitation withdrawn is nobody else’s business yet.') +
        '</p>' + removeSubjectPicker() +
        '<div style="margin-top:var(--s2)"><button class="btn" data-exile="1"' +
        (S.removeWho ? '' : ' disabled') + '>❌ Remove</button>' +
        // beside the door's own act, as on ✉️ (entry 161, Q1024) — the row's
        // ✒️ here is inert for a door and is not what this joins
        founderCommit(card('remove')) + '</div>' +
        doorErrHtml('remove')
      : '<p class="why">' + ({
          consent: 'Removing a member is a proposal every member answers, including them — nobody leaves against their will.',
          assembly: 'Removing a member is a proposal every other member answers; they see it running.',
          proposal: 'Removing a member is a proposal the membership decides at the approval threshold.' })[removalPrice()] +
        ' Anybody may leave at any time.</p>' + doorErrHtml('remove')),

    // **The door, apart from the register** (Ed, 2026-08-18). The policy is
    // the constitutional act; each application that arrives through it is
    // its ordinary consequence.
    applications: () =>
      '<p class="why">Whether somebody who is not a member may ask to become one. An application is a stranger proposing their own invitation, decided as Admissions says.</p>' +
      // **Who may join** (Ed, 2026-08-18, with the Applicants subsection):
      // the gate the Apply card hangs off. An application becomes an
      // ordinary proposal to grant membership, judged like any other.
      // Q506: the holder left this card for the power tabs; delegated by

      // leads the list the way it does on ⏰ or 🌍.
      '<div class="choice" role="radiogroup" aria-label="Who may join">' +
      theyDecide('applications') +
      opt(S, 'joinBy', 'invite', 'Invitation only', 'Nobody joins unless a member brings them in.') +
      opt(S, 'joinBy', 'apply', 'Anyone may apply', 'An application is a stranger proposing their own invitation: it is decided the way Admissions says, and costs the applicant nothing.') +
      '</div>',
    // **Admissions** (Ed, 2026-08-26, entry 94): one price for every route
    // in — a member's invitation, a stranger's application — on the same
    // three-verb scale as 🥾. The Founder's own hand is the ✉️ door's.
    admission: () =>
      '<p class="why">What it costs to bring somebody into the membership. Whichever is chosen, the Founder’s own powers over invitations are the ✉️ door’s.</p>' +
      '<div class="choice" role="radiogroup" aria-label="The price of admission">' +
      theyDecide('admission') +
      opt(S, 'admission', 'assembly', 'All members must approve every new member joining', 'A proposed member joins only when every member has agreed 🏛️ — one refusal keeps them out.') +
      opt(S, 'admission', 'proposal', 'Members must vote on every new member joining', 'A proposed member is voted on at the approval threshold ✏️, like any change.') +
      opt(S, 'admission', 'pen', 'Any member can invite new people to join', 'An invitation is sent on a member’s word ✒️ — nobody else has to agree.') +
      '</div>',
    ending: () =>
      '<p class="why">When drafting stops and the text is final. <b>Never</b> is one of the answers: a document with no end date stops only when too few members are active.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('ending') +
      // under a shaped document that did not set ⏰ (a meeting, a conference)
      // the rung grows chips in the shape's unit above the field (entry 166,
      // F6: picking a chip fills the rung's own field); the field stays
      opt(S, 'ending', 'ends', 'At a set time', '',
        endChipsHtml() +
        '<span class="fld"><label>Ends</label><input type="datetime-local" data-txt="endsAt" value="' + S.endsAt + '"></span>') +
      opt(S, 'ending', 'perpetual', 'Never', 'It runs until too few members are still active.') +
      '</div>',
    bar: () =>
      '<p class="why">How sure the members have to be that a change is better than the words it replaces, <b>at the end</b>.</p>' +
      // read before choosing whether to set it or hand it over (entry 163)
      methodNote() +
      '<div class="choice" role="radiogroup">' +
      theyDecide('bar') +
      barRungs() +
      '</div>' + ceilingNote(E(), 99),
    pace: () =>
      '<p class="why">Whether the approval threshold holds the whole way through, or starts lower and climbs to it. Starting lower lets early changes through more easily.</p>' +
      '<div class="choice" role="radiogroup">' +
      // **Fixed first** (entry 167, rule 4): it is the more demanding shape —
      // a change made an hour in faces the same number as one made at the
      // close — so it heads the ladder, as *the most I will accept* does
      // everywhere else. Both explanations come from the family now: *The
      // same number all the way through.* and *Starts lower…* restated the
      // rung's own name, where the sentence says what the number would be.
      // Both explanations are the family's now, and where it has nothing true
      // to say — 🌡️ unset, so there is no number to hold or climb to — the
      // rung carries its name alone rather than a stand-in of the card's own.
      opt(S, 'shape', 'fixed', 'Fixed', meaning('pace', { shape: 'fixed' })) +
      // *Rising* carries no sentence of its own: what a rise would mean
      // depends on where it starts, and every rung inside it says so — the
      // fourth one included. A sentence here would be one of theirs, printed
      // twice on one card (T36).
      opt(S, 'shape', 'ramp', 'Rising', '',
        '<div class="choice">' + startRungs() + '</div>', perpetual()) +
      '</div>' + (perpetual() ? '<p class="setnote">With no end date there is nothing to climb towards, so the number stays fixed.</p>' : ''),
    quorum: () =>
      '<p class="why">How many members have to have voted on something before it can change the document. Until that many have, it waits — nobody’s silence counts either way.</p>' +
      // **The form is the wording, the number is the decision** (§9.0a): count

      // the founder's even when the number is the room's.
      '<div class="eyebrow fieldlab">Asked as</div>' +
      '<div class="choice" role="radiogroup" aria-label="Form">' +
      opt(S, 'quorumForm', 'share', 'A share of the membership', 'The number goes up and down as members join and leave.') +

      '</div>' +
      '<div class="eyebrow fieldlab">The number</div>' +
      '<div class="choice" role="radiogroup" aria-label="Number">' +
      theyDecide('quorum') +
      // the `suffix` on the share field stays: it is the **readout** — what

      // **consequence**, and the two are different jobs (entry 167)
      opt(S, 'quorumBy', 'founder', 'I set it', '',
        '<span class="setrow2">' + (S.quorumForm === 'share'
          ? num(S, 'quorumPct', 'Share', 1, 100, '% — ' + quorumCount() + ' of ' + E() + ' today')
          : num(S, 'quorumN', 'Members', 1, 40, 'of ' + E())) + '</span>' +
        meanLine('quorum', CHOSEN.quorum() ? TYPED.quorum() : null)) +
      '</div>',
    authorship: () =>
      '<p class="why">Whoever proposes a change writes a reason for it, and everybody can read that. This is only about whether their name is on it.</p>' +
      '<div class="choice" role="radiogroup">' +
      theyDecide('authorship') +

      (isNum(S.grant) && isNum(S.cap) && +S.cap < +S.grant

      // (*After a gap you choose.*) said only that the field below is a

      opt(S, 'lapse', 'never', 'Never', meaning('lapse', { afterMs: null })) +

  // ---- the applicant's seat (ported from founding-ceremony, Ed 361) -------
  // Plain tasks: the same rail entries and the same card shell, asking for
  // the only things an application is. The email is the identity (verified
  // by magic link before anything can be submitted), member emails are
  // unique, and an empty application is a real application.
  const APPLICANT = { get judged() {
    if (!cs || !S.app.csId) return 2; // fixture until the module holds it

    // off — its key is `adm:<applicant>` now, and `motionTargets` is the one
    // place that is spelled, so the readout cannot drift from the card again.
    return judgedOn(rec, motionTargets(rec));

  const MEMBER_EMAILS = { has: (e2) => S.roster.some((r) => (r.e || '').toLowerCase() === e2) };
  const APPCARDS = () => {
