    : !(c.hide && c.hide()) && (!c.isGate || !!cs) && (orderReady(c) || !!(c.early && c.early())));
  // the first delegated question this viewer is being asked, in ORDER — the
  // question 🏛️ arrives with, and the paragraph it hangs off (Q605 (a))
  // Re-entrant by construction, so it guards itself: `visible(ans)` asks
  // `ansDue()`, which counts the other tasks left, which asks `visible` of
  // this very grant — inside that inner ask the voice simply does not count
  // as a task left, which is right (it is news, not a question) and what
  // keeps the answer from depending on itself.
  let askingFirst = false;
  const firstAsked = () => {
    if (askingFirst) return null;
    askingFirst = true;
    try {
      return ORDER.map((k) => ANS.find((a) => a.ansFor === k))
        .find((a) => a && visible(a)) || null;
    } finally { askingFirst = false; }
  };
  // **A founder-member is handed the voice, so a founder-member is served it**
  // (Q829, Ed 2026-08-25: *when I (as a founder-member) was granted 🏛️ I did
  // not get a task — the 🏛️ tab was grey*). The host was the first blind
  // question asking you, else ⚖️ Judging — and ⚖️ is hidden until 🍾, so before
  // the start the fallback host was a card nothing could see and `tasksFor`
  // never reached the grant. A founder who delegates nothing has no blind
  // question to hang it on and was therefore never served the voice they hold
  // from the save; and a founder who *does* delegate has one only once
  // `ansDue()` lets the question through, which for a sole founder-member is
  // after every other task. Either way the grant sat unacknowledged behind the
  // very thing it accompanies, which is Q645's shape in a third place.
  // **🪪 is the pre-start host**: the voice is one every member holds, so the
  // membership's own clause is where it belongs while there is no question to
  // ride, and the register is always visible from its place in ORDER. Only the
  // *enumeration* moves — the tab is pinned to the Proposals preamble by Q750
  // and the rail entry follows its own chip (`anchorOf`), so nothing changes
  // where the founder looks.
  const voiceHost = () => { const a = firstAsked();
    return a ? a.ansFor : (cs && !constituted() ? 'admission' : 'canjudge'); };
  // **The two grants whose clause is the Founded line** (Q639 (a), Ed
  // 2026-08-22). They are still tasks of the 📍 link for every purpose that
  // counts them — the rail enumerates from `tasksFor`, and so does the
  // group's own note — but they draw no paragraph of their own: their tabs
  // stand on the Founded line, and that sentence is their clause.
  const onFoundedLine = (c) => !!c && (c.k === 'grant-pen' || c.k === 'grant-shield');
  // **Your identity tabs ride wherever you appear in the document** (Q759, Ed
  // 2026-08-23). Ordinarily that is your own row in the Members list; a clerk
  // has no row there (Q758) and appears in the document only on the Founded
  // line, so their ✋🖼️📧 stack joins the grants' pile on it. The open-card
  // path comes free — that paragraph already routes an open pile card through
  // `paraWith` — and so does the rail anchor, `hostParaOf` reading `data-chip`.
  const myIdCards = () => ['myname', 'mypic', 'myemail'].map(card).filter((c) => c && visible(c));
  const idOnFounded = () => (cs && amFounder() && !viewerIsMember() ? myIdCards() : []);
  // One question card per delegable setting, born when its setting is handed
  // over and gone if it is taken back. Same glyph, same title — it is the
  // same question — told apart by whose pile it stands in.
  const ANS = CARDS.filter((c) => c.key && ANSWER[c.k]).map((c) => ({
    k: 'ans-' + c.k, g: c.g, t: c.t, kind: c.kind, own: 'you', ansFor: c.k }));
  const LIVE = () => CARDS.concat(ANS, GATES).filter(visible);
  // **The watcher waits for your own answer** (Ed, 2026-08-19: *we shouldn't
  // see the watcher for a group task until I have given my answer for that
  // task*). A delegated setting stands in the rail twice — the ⏳ entry
  // saying how far the room has got, and your own question — which is the
  // same title twice, and the wrong one first: how many have answered is not
  // something you need before you have answered, and arguably not something
  // you should be reading while you decide.
  // not 'once you could have answered' but 'once you have' — the watcher is
  // hidden while the answer is still outstanding, whether or not the question
  // has reached you yet
  const owesOwnAnswer = (c) => { const a = ANS.find((x) => x.ansFor === c.k);
    return !!a && settled(c) && viewerIsMember() && isRoom(c) && !answered(a); };
  // **The sections of the constitution** (Ed, 2026-08-18): subtitles his
  // ask, the grouping and the prose mine to draft — each line says what
  // the section governs, in the surface's own words.
  const SEC = [
    // no intro line (Ed, 2026-08-18) — the sentences are the section
    { key: 'members', title: 'Membership',
      text: '',
      keys: ['admission', 'invite', 'remove', 'hat', 'applications', 'lapse', 'removal', 'myemail', 'myname', 'mypic'],
      // one admit card per applicant — a task at 🏛️/✏️, news at ✒️ (entry 96)
      // — and one 📭 per sender pass whose mail gave up (SURFACE E34), news
      // to the whole membership. Both are enumerated here because the rail
      // reads a section's own keys: a card no section enumerates is a card
      // nothing can serve.
      extraKeys: () => admitKeys().concat(mailGiveUpKeys()),
      // **Members and Applications are subsections** (Ed, 2026-08-18):
      // Members IS the list — 🪪, the tab for invitations, stands beside
      // it, and the bottom row is your own membership wearing the ✋ and
      // 🖼️ tabs. Applications is the 🤝 decision (its Applicants list
      // arrives with the first applicant, after the start).
      body: (h) => {
        // **The list is split by who is reading, not by who founded** (Q754).
        // It was built from the viewer's own name and face but labelled with
        // the founder's chips and split on `!p.founder`, so every member who
        // is not the founder wore the founder chip, appeared a second time in
        // the tail, and never saw the founder at all — the ordinary case on
        // any live document, where the viewer is seated by roster index.
        // `showMe` is the whole of it: the you-row is *yours*, the tail is
        // everybody else in roster order, and the chips are per row on both
        // halves, mirroring `rosterClause`, which has always got this right.
        const meIdx = S.roster.indexOf(viewerRow());   // -1 for the applicant and stranger stubs
        // **A clerk is not in the Members list** (Q758, Ed 2026-08-23) — the
        // same predicate `members()` uses, so a clerk founder falls out of
        // the list by the rule rather than by a special case. They appear in
        // the 🪪 register and on the Founded line, and nowhere else.
        const inList = (p) => p.role !== 'clerk';
        const showMe = meIdx >= 0 && inList(S.roster[meIdx]);
        const others = S.roster.filter((p, i) => i !== meIdx && inList(p));
        // the You stack: name, picture, email (Ed, 2026-08-19 — everyone
        // logged in has an address they may want to change or re-send). Only
        // where there is a row to hang it on: a clerk's rides the Founded
        // line instead (Q759), and an applicant's is in their own rail.
        const my = showMe ? myIdCards() : [];
        // **The card opens where its tab is** (entry 188, Ed's QA of batch Q:
        // *if I click on the ✋ stack the decision card opens up beneath the ❌
        // stack*). It always went at the very end of this group's HTML, which
        // was a few rows below your own when the register was one flat `.cpara`;
        // since entry 95 four lvl-3 subsections stand between your row and the
        // end, so the card landed under the last of them — *Proposed for
        // removal* and its ❌ pile — while the closed pile stayed on your row.
        // It is your row's card, so it replaces your row, the way every other
        // decision card replaces its own paragraph. Declared here rather than
        // below the helpers because `meBlock` is the thing that needs it, and
        // it can only be truthy where there is a row: `my` is empty unless
        // `showMe`, so a clerk (Q758) and a stranger reach neither branch and
        // keep the routing they already have — the clerk's rides the Founded
        // line (`idOnFounded`, Q759).
        const openId = my.find((c) => S.open === c.k);
        // **The placeholder is a statement about the list, so it stands above
        // you** (Q753, Ed 2026-08-23). It was invented doing two jobs (Q407a):
        // saying the true thing about an empty list, and giving the you-row
        // clearance from the 🪪 pile above. When *you* moved to the top of the
        // list (2026-08-21) the clearance job went with you onto the you-row's
        // own margin — the list's padding now (Q757) — and the sentence was
        // left dangling below your row, reading as a caption on you rather
        // than a statement about the list. Its wording follows from whether
        // there is a you-row at all, so neither string is chosen by hand.
        // No avatar: a face here would
        // claim a person who does not exist.
        // **And it counts who is *here*, not who is on the roster** (Q870).
        // Once the invitees have a heading of their own the sentence is about
        // the rows above it, and an outstanding invitation is precisely the
        // case where *nobody else here yet* is both true and worth saying.
        // **Three kinds of person, three groups, each standing only where it
        // has rows** (Q868–Q870, Ed 2026-08-26: *separate subheadings under
        // Members for applicants and invitees*). Membership begins at first
        // arrival, so the list proper is the people who are **here**; an
        // invitation is a fact about somebody who is not yet one of them, and
        // an application is a request from somebody nobody has invited. They
        // were one flat list distinguished by a chip on the row, which read as
        // *these are your members, some of them faintly* — the chip was doing a
        // heading's job. The arrived rows keep the order B2 gave them, you
        // first, and the two subheadings are the only new furniture: no chip
        // survives that its own heading now says (the *invited* chip goes, the
        // *applicant* chip stays out of this view, which never had one).
        // **A row says what is true of it, wherever it stands** (Ed,
        // 2026-08-26): somebody both lapsed and proposed for removal stands
        // under *Proposed for removal* — the motion being the more urgent fact
        // — and wears a **lapsed** pill there, so the subsection they are not
        // in is not the only place that fact could have been read.
        // **And an invitation that gave up says so, to the founder** (SURFACE
        // E34): the mail reached the outbox's attempt cap and its link was
        // revoked, so the person is not sitting on an unopened invitation —
        // there is nothing in their inbox at all. The line and the 📨 beside
        // it are the founder's, E34 naming *the founder's ✉️ row*; everybody
        // else is told once, by the 📭 card, and can do nothing about it.
        const gaveUpRow = (p) => !p.in && !!p.mailGaveUp && amFounder();
        const memRow = (p) => '<div class="memrow">' + avHtml(p) +
          '<span class="mn">' + esc(p.n || (!p.in && p.e) || 'Anonymous') +
          (p.founder ? ' ' + founderMark() : '') +
          (p.lapsed && p.in ? ' <span class="chip pending">lapsed</span>' : '') +
          (gaveUpRow(p) ? ' <span class="chip pending">that did not send</span>' : '') +
          '</span>' +
          // outside `.mn`: the name is text and this is a control
          (gaveUpRow(p) ? '<button class="btn small" data-act="resend-invite" data-member="' +
            esc(p.mid || '') + '" title="Send the invitation again">📨</button>' : '') +
          '</div>';
        // **One subsection per status** (entry 95, Ed 2026-08-26: *these are
        // sections of the constitution, one per status, and the document's own
        // text — not a card's*). Q868–Q870 had already found that a flat list
        // told apart by a chip reads as *these are your members, some of them
        // faintly*, and answered it with eyebrow subheadings **inside** the
        // list; the chip was doing a heading's job, and so, it turns out, was
        // the eyebrow. These are headings, at lvl3 under Membership, and the
        // rows under each are document text like any other.
        //
        // **A removal running names them, whatever else is true of them**: a
        // motion about somebody is the more urgent fact than a quiet spell, so
        // *Proposed for removal* takes precedence over *Lapsed* where a member
        // is both, and neither leaves *Members* by leaving the room.
        const pendingOut = removalPendingIds();
        const proposedOut = others.filter((p) => p.in && pendingOut.has(p.mid));
        // **A lapsed member is still here** (Y10; entry 94 ruling 5): they move
        // out of *Members* into *Lapsed* and count all the same — lapse is a
        // stall, not a departure, and they abstain rather than leave.
        const lapsedOut = others.filter((p) => p.in && p.lapsed && !pendingOut.has(p.mid));
        const here = others.filter((p) => p.in && !p.lapsed && !pendingOut.has(p.mid));
        const invited = others.filter((p) => !p.in);
        // **Leaving is free** (entry 94): a member's own row carries the one
        // act nobody may refuse — and the founder's membership is ordinary
        // membership (§9.6a, entry 248), so their row carries it too. Before
        // the start it is the 🎩 untick instead, which `constituted()` already
        // excludes; a clerk has no row here at all (`viewerIsMember`).
        const leaveBtn = constituted() && viewerIsMember() && !isStranger()
          ? ' <button class="btn small" data-act="resign" title="Leave the membership now — nobody has to agree">Leave</button>' : '';
        // *(nobody else here yet)* counts the arrived rows alone (Q870), and
        // now that every other status has a heading of its own it is a
        // statement about *Members* and nothing else.
        const nobody = here.length ? ''
          : '<div class="memrow nobody">(nobody' + (showMe ? ' else' : '') + ' here yet)</div>';
        // **You are at the top** (Ed, 2026-08-21). A membership starts as one
        // person, and that person is reading this: the list opens with your
        // own row — the only one wearing your ✋🖼️ tabs.
        const meBlock = !showMe ? ''
          : openId ? h.paraWith(openId, my)
          : '<div class="memrow meRow">' + (my.length ? h.pile(my) : '') + avHtml(me()) +
            '<span class="mn">' + esc(S.myname || 'Anonymous') +
            (S.roster[meIdx].founder ? ' ' + founderMark() : '') +
            ' <span class="chip">you</span>' + leaveBtn + '</span></div>';
        // a stranger reads the register as the door serves it, under *Members*
        // alone — the per-subsection counts entry 95 asks for are unbuilt, and
        // tangled with Q508's own question about what a door may show at all
        const strangerRows = strMemberList() ||
          '<div class="memlist"><div class="memrow nobody">' + strMembersLine() + '</div></div>';
        // **A heading for a status the document cannot produce would be a rule
        // stated as furniture** (entry 95): *Applicants* stands only where 🤝
        // allows applications, *Lapsed* only where 💤 lapses.
        const lapsesOn = () => { const v = takenValOf('lapse');
          return v ? v.afterMs !== null : !!S.lapse && S.lapse !== 'never'; };
        // **The ones that carry a control stand when empty** (entry 95) — a
        // control needs a fixed home, and inviting matters most when nobody
        // has been invited yet. *Lapsed* has none, so it stands on its rows.
        // **Every heading in the document folds** (Ed, 2026-08-26, closing the
        // lvl3 half of Q406). The constitution's sections and the charter's
        // prose headings already did; its subsections did not, which made them
        // the one kind of heading that behaved differently from the rest. They
        // carry the same `cs-`-prefixed id the section headings do, so the
        // heading-click handler and `secToggleHtml` reach them unchanged — and
        // like every other fold, **a section never folds over the open card**.
        // `inRows` is the caller's half of that promise: *Members* carries the
        // identity card inside its own rows rather than on its pile, so the
        // pile check above cannot see it and a folded *Members* would fold the
        // open card away (entry 188).
        const memSub = (title, rows, pileKeys, raw, inRows) => {
          const cards = (pileKeys || []).map(card)
            .filter((c) => c && visible(c) && (!c.base || cs));
          const open = cards.find((c) => S.open === c.k);
          const id = 'cs-mem-' + title.toLowerCase().replace(/[^a-z]+/g, '-');
          const head = '<h2 class="docline lvl3" id="' + id + '">' +
            secToggleHtml(id) + esc(title) + '</h2>';
          // **A subsection is its own birth** (entry 185, Ed's QA of batch Q:
          // *when I make the first choice on the Applications decision card,
          // the card flashes*). `.csub` carries no style — it is a plain block,
          // and the card-audit proves it moves nothing — but it gives
          // `birthPass` something to fade that is the subsection itself. A bare
          // heading here was a `.csec > h2[id]` like a section heading, so its
          // parent was the whole Membership `.csec`: picking *Anyone may apply*
          // born *Applicants* for the first time and faded the section in, with
          // the open 🤝 card standing inside it. What is born arrives (F14); the
          // defect was what its arrival was charged to.
          const sub = (inner) => '<div class="csub">' + head + inner + '</div>';
          if (open) return sub(h.paraWith(open, cards));
          if (S.folded.has(id) && !inRows) return sub('');
          return sub('<div class="cpara' + (cards.length ? '' : ' notab') + '">' +
            (cards.length ? h.pile(cards) : '') +
            (raw ? rows
              : '<div class="memlist' + (cards.length ? '' : ' nopile') + '">' + rows + '</div>') +
            '</div>');
        };
        // **🤝 how they join, 💤 and 🥾 how they leave, and only then who they
        // are** (Q865, Q867, Ed 2026-08-26: *💤 and 🥾 sections should be above
        // the Members heading* — reversing the second half of Q617 (a)). The
        // first half stands and is untouched: 🤝 Applications leads the
        // section, because inviting is an act under that rule (Ed, 2026-08-22:
        // *I need to decide Applications before I can do Membership*). What is
        // reversed is where the list falls. It used to stand above 💤 and 🥾 on
        // the argument that *a register is the fact and those are rules about
        // it* — true of the document, but it is the founding that reads this
        // order, and there the register is not a fact yet: it is the founder's
        // own name and nobody else's, and every rule below it will be in force
        // before the first invitation goes out. So the three rules governing a
        // membership now stand together above the heading, the way in and the
        // two ways out, and *Members* opens on the people it applies to. The
        // founding follows the document, so 🎩 *are you a member* and your own
        // name and picture still come before you invite anybody, which is the
        // order somebody actually does it in.
        // **🪪 leads** (Ed, 2026-08-26, entry 94): what admission costs comes
        // before whether strangers may apply, since an application pays it
        return (visible(card('admission')) ? h.para(card('admission')) + h.tasks(card('admission')) : '') +
          (visible(card('applications')) ? h.para(card('applications')) + h.tasks(card('applications')) : '') +
          (visible(card('lapse')) ? h.para(card('lapse')) + h.tasks(card('lapse')) : '') +
          (visible(card('removal')) ? h.para(card('removal')) + h.tasks(card('removal')) : '') +
          // **A door stands by its result** (entry 96, Ed 2026-08-26): ✉️ on
          // *Invitees*, ❌ on *Proposed for removal*, the admit judgment on
          // *Applicants* — each still wearing its own ✒️/🛡️ pair, and each a
          // pile rather than a button in a row. 🎩 stays on *Members*, being
          // about the founder's own place in it. The stranger reads the
          // register as the door serves it, under *Members* alone.
          // **The register tells the room who left** (Q901, E31–E32): one grey
          // sentence per departure after the rows — document text, so it
          // reads on the closed page and in the record, and the stranger
          // reads it where 🌍 lets them read *Members*
          // **And a subsection that stands empty says so** (entry 183, Ed's QA
          // of batch Q). The three that carry a control stand whether or not
          // they have rows (F21), so empty each was a heading over a pile and
          // nothing else — a heading that had lost its paragraph. Each takes
          // *(nobody else here yet)*'s own treatment: one grey parenthetical
          // row, no glyph, no full stop. Supplied **here** rather than inside
          // `memSub`, because the helper also builds *Lapsed*, which stands
          // only on its rows and must stay bare, and the stranger's raw
          // branch — a per-title default inside a layout function would be a
          // table of words hidden where nobody reads copy.
          (isStranger()
            ? memSub('Members', strangerRows + departureLines(), [], true)
            : memSub('Members', nobody + meBlock + here.map(memRow).join('') + departureLines(),
                ['hat'], false, !!openId) +
              memSub('Invitees', invited.length ? invited.map(memRow).join('')
                : '<div class="memrow nobody">(no outstanding invitations)</div>',
                // 📭 stands on the *Invitees* heading (E34): the give-up is
                // about somebody listed here, and this is where a reader looks
                ['invite', 'pw:u:invite', 'pw:a:invite'].concat(mailGiveUpKeys())) +
              (policyNow() === 'apply'
                ? memSub('Applicants', memApplicantRows() ||
                  '<div class="memrow nobody">(no applicants at the moment)</div>', admitKeys()) : '') +
              (lapsesOn() && lapsedOut.length
                ? memSub('Lapsed', lapsedOut.map(memRow).join(''), []) : '') +
              memSub('Proposed for removal', proposedOut.length ? proposedOut.map(memRow).join('')
                : '<div class="memrow nobody">(nobody proposed for removal)</div>',
                ['remove', 'pw:u:remove', 'pw:a:remove']));
      } },
    // **Proposals reads second** (Q871, Q872, Ed 2026-08-26: *Proposals above
    // Decisions* — reversing *Proposals reads fourth*, Ed 2026-08-21). That
    // ruling was itself a restoration: the section had drifted to second and
    // was put back to fourth because its whole arrival landed directly beneath
    // the Membership clauses the founder was still working through. What has
    // changed since is that the section no longer arrives at once — Q748 made
    // its opening one clause wearing four tabs, and ORDER (not a wave graph)
    // paces the two settings under it one at a time — so the objection the
    // fourth-place ruling was answering no longer holds. What is left is the
    // reading order, and it reads better this way: who may propose, and how
    // often, before how the room decides what is proposed. Membership ·
    // Proposals · Decisions · Anonymity · The Document.
    // The gates lead it (Ed, 2026-08-18); the preamble opens it
    // (Ed, 2026-08-19 — moved from the head of the constitution, redrafted
    // in his words); no intro lines — the sections are not big enough to
    // need explanations, and the clauses ought to be self-explanatory
    // (Ed, 2026-08-19)
    { key: 'rate', title: 'Proposals',
      text: '',
      // **The section opens with one clause wearing four tabs** (Q748). The
      // preamble stands tab-less while the group is empty, so the sentence
      // saying what beginning will do is readable from the moment the section
      // is live; each of 🍾 💡 ⚖️ 🏛️ *joins the stack* as it arrives rather
      // than a new paragraph appearing under it, and the whole group opens at
      // this one paragraph (`chipsFor` / `PROPOSAL_CHIPS`). `body` therefore
      // skips all four; `keys` keeps 🍾 💡 ⚖️, because the rail and the
      // group's own count enumerate from the section's cards. 🏛️ stays out of
      // `keys` deliberately — it is `visible` from its place in ORDER, and
      // admitting it would make the whole section live that early and offer
      // its news before 🍾 (F9). It is enumerated by `tasksFor`, as Q605
      // built it, and only its *clause* moves here.
      lead: (H) => (cs ? (proposalChips().length ? H.para(card('begin')) : preamblePara()) : ''),
      body: (H) => ['rate'].map(card)
        .filter((c) => c && visible(c)).map((c) => H.para(c) + H.tasks(c)).join(''),
      keys: ['begin', 'canpropose', 'canjudge', 'rate'],
      // one 👑 card per act that laid powers down (entry 162) — news, never a
      // task, and enumerated here because the rail reads a section's own keys:
      // a card the section does not enumerate is a card nothing can serve
      extraKeys: () => releaseKeys() },
    { key: 'deciding', title: 'Decisions',
      text: '',
      // ⏰ when it ends, 🌡️ how sure the room must be at that point, 🪜 how
      // that number gets there, 👥 how many must have judged. The threshold
      // and its pacing are one thought on two cards, so they are adjacent;
      // quorum is a different kind of number and reads last (Ed, 2026-08-21).
      keys: ['ending', 'closing', 'bar', 'quorum'],
      // 🪜 is in neither `keys` nor ORDER (Q512, finding 598): it has no
      // clause and no rail entry — it arrives answered, is stated inside the
      // threshold clause, and is changed on a tab in 🌡️'s own stack.
      body: (h) => ['ending', 'closing', 'bar', 'quorum'].map(card)
        .filter((c) => c && visible(c)).map((c) => h.para(c) + h.tasks(c)).join('') },
    // "Anonymity" (Ed, 2026-08-19), not "Privacy"
    { key: 'privacy', title: 'Anonymity',
      text: '',
      keys: ['authorship', 'judgments'] },
    // rail-only: the title is the heading, the link leads the constitution,
    // and the starting text anchors the prose (Ed, 2026-08-18)
    { key: 'doc', title: 'The Document', railOnly: true,
      text: '', keys: ['title', 'slug', 'shape', 'chamber', 'text'] },
  ];
  // `extraKeys` is how a section enumerates cards it cannot name in a literal
  // — the admit cards, one per applicant (entry 96). It has to be here rather
  // than only in the band, because this is what the rail reads: a card the
  // section does not enumerate is a card nothing can ever serve (Q775).
  const secLive = () => SEC.map((s2) => ({ ...s2,
    cards: s2.keys.concat(s2.extraKeys ? s2.extraKeys() : [])
      .map(card).filter((c) => c && visible(c)) }))
    .filter((s2) => s2.cards.length);
  // **The founder's own answer is a tab on the setting's clause** (Q786–Q788,
  // Ed 2026-08-25: *whether the founder specifically has answered their member
  // question doesn't matter enough to have a whole clause, it's just part of
  // the x of y members have answered this delegated question*). The card is
  // still a task and still stands in the rail; what it no longer has is a
  // paragraph and a sentence of its own — its tab rides the delegated
  // setting's own pile, on the one clause that already counts the answers,
  // the founder's among them. The ✒️/🛡️ precedent (Q639), not 📧's blank line.
  // A resolved question keeps no answer task at all: the rule above states the
  // outcome, and a finished task has nothing left to ask.
  const ansTaskFor = (c) => (c && c.key && ANSWER[c.k] && (c.in || 0) < E()
    ? [card('ans-' + c.k)].filter((x) => x && visible(x)) : []);
  const tasksFor = (c) => ansTaskFor(c)
    // the grants stand as tasks beside the gates they belong with (Q461):
    // the pen and the shield with the 📍 link — issued when the address went
    // live (Q451) — the voice with the first blind question you are asked,
    // or with ⚖️ Judging where nothing was delegated to you (Q605 (a)).
    // ✒️ and 🛡️ are enumerated here and drawn on the Founded line (Q639).
    .concat(c.k === 'slug' ? [card('grant-pen'), card('grant-shield')].filter(visible)
      : c.k === voiceHost() ? [card('grant-voice')].filter(visible) : []);
  // **The keys the rail can ever list** (Q775). Every section's own keys, plus
  // the three grants and the answer tasks `tasksFor` adds beside them — the
  // whole of what `servedCards` below can produce, read off the same literals
  // it reads. It exists because a card can be *owed* without being **servable**:
  // 🪜 is in neither ORDER nor any section's keys (Q512), so nothing could ever
  // put it in front of the founder, and `otherTasksLeft` counting it held every
  // delegated question shut for ever. Whatever makes a task owed must make it
  // served; where it cannot, the task must not block.
  const railable = (c) => !!c && (!!c.ansFor || !!c.admit || !!c.release || !!c.mailgiveup ||
    SEC.some((s2) => s2.keys.includes(c.k)) ||
    c.k === 'grant-pen' || c.k === 'grant-shield' || c.k === 'grant-voice');
  // **The rail's own set, in one place** (Q773). The rail is what tells a
  // founder there is anything left to do, so *what is being served* has to be
  // a question anything can ask — 🍾's own last-resort door asks it, and so
  // does the walks' readout. It used to live inline in `renderRail`, where the
  // only way to ask it was to read the DOM back: a second implementation of
  // the thing under test.
  const servedCards = () =>
    // What is settled leaves the rail — it is the pile's, and the block's
    // to name — and a gate shows only as news: the moment it opens, until
    // its OK. Before that 💡 and ⚖️ are nowhere at all (Q529: the gate
    // clauses hide until 🍾, where they are decided), because nothing is
    // being asked of you (Ed, 2026-08-18: *everyone should only see cards
    // they can act on*). ⏳ entries stay: they are where the fill says how
    // far the room has got.
    secLive().flatMap((s2) => s2.cards)
      .flatMap((c) => [c].concat(tasksFor(c)))
      .filter((c) => !owesOwnAnswer(c))
      .filter((c) => ((c.isGate && !c.isBegin && !c.isClosing) ? stateOf(c, ctx) === 'news' : stateOf(c, ctx) !== 'done'))
      // **A constitutional question waiting on the room is not a task**
      // (Ed, 2026-08-21): nothing is being asked of you — you have either
      // answered it or were never asked — so it keeps its own glyph on the
      // grey tab in the band and leaves the rail. It covers the three ways
      // a constitutional card waits: the watcher on a setting you handed
      // over, your own question once you have answered it, and a
      // constitutional motion you have answered.
      .filter((c) => !(c.kind === 'constitutional' && stateOf(c, ctx) === 'wait'))
      // the closed page asks nothing but the signature (Q470): a grant or
      // a question outstanding at the close is moot, and leaves the rail
      .filter((c) => !(cs && cs.closed) || c.isClosing);
  // A member who has not opened the document yet is drawn faintly rather than
  // left out: they are on the membership, which is the fact the heading is
  // stating, and whether they have looked at it yet is a different one.
  const groups = () => [
    // **No Constitution heading during the birth** (Ed, 2026-08-21). Nothing
    // is being headed yet — the run is three clauses on an unsaved document —
    // and the table of contents already withholds its Constitution entry
    // until the save, so a heading here disagreed with the outline beside it.
    { key: 'constitution', label: cs ? 'Constitution' : '',
      // **The birth has no sections** (Ed, 2026-08-21: *during the birth we
      // don't need to see the Membership section*). Before the save there is
      // no constitution to divide up — the run is the title, the link and
      // 📧, all three in this group's own `lead`. The band used to take its
      // sections from whatever had a visible card, and 📧 is a Membership
      // key, so a *Membership* heading, a *Members* subheading and an empty
      // list stood on a document that did not exist yet. The rail still
      // enumerates from `secLive()`, which is what keeps the birth's own
      // tasks in it.
      sections: cs ? secLive() : [],
      // Founded by [avatar] [name] — from the save (Q640), gaining its time
      // at the 🍾 press; a founder who set no name is Anonymous like anybody
      // else (§9.0c). **It is where ✒️ and 🛡️ hang their tabs** (Q639 (a)).
      lead: (h) => titleGovPara(h) +
        // the link's own answer-task still draws here; the two grants it
        // carries do not — they are drawn on the Founded line below (Q639)
        (visible(card('slug')) ? h.para(card('slug')) +
          tasksFor(card('slug')).filter((t) => !onFoundedLine(t)).map((t) => h.para(t)).join('') : '') +
        // 🧭 stands in the lead with a clause of its own during the birth
        // (entry 166): blank until chosen, then *The rules will be as for a
        // meeting.*; post-save the band is rendered from the module and no
        // such setting exists, so the clause is gone by construction
        (!cs && visible(card('shape')) ? h.para(card('shape')) : '') +
        // **The birth's third clause** (Ed, 2026-08-21): the document says
        // what is happening and wears the 📧 tab, so the card does not have
        // to say *Sent to…* and the founder can get back to their own
        // address from the document itself. It stands here for the whole of
        // the birth — open, unsent, and awaiting the link — because the tab
        // must not move: it used to be rendered by the Membership section's
        // own body while the card was open and by this line once the mail
        // was out, so the paragraph jumped up the page at the send.
        (!cs && visible(card('myemail')) ? h.para(card('myemail')) : '') +
        // 🌍 is about the document, not member privacy — the penultimate
        // clause of the opening section (Ed, 2026-08-19)
        (visible(card('chamber')) ? h.para(card('chamber')) + h.tasks(card('chamber')) : '') +
        // **The grants stand here** (Q639 (a), Ed 2026-08-22). Their own two
        // clauses — *The Founder holds the pen on 16 settings.* and its
        // shield twin — are retired: the count is already stated on every
        // setting the power turns (`holderLine`) and in the second person on
        // the wallet's own tooltip, so the clause was the third telling and
        // the one that went stale whenever a power was laid down. Every
        // *settings* clause wears ✒️ and 🛡️ for its **own** powers, so a
        // grant could not hang on one without putting two ✒️ tabs meaning
        // different things in one stack; the Founded line carries none, sits
        // in the opening run where the grants arrive, and already wears 👑 —
        // the mark that means *holds either power*. The tabs make the crown
        // clickable, which is the dividend rather than the cost.
        (cs ? (() => {
          // and a clerk's ✋🖼️📧 join them (Q759): the Founded line is where
          // a clerk appears in the document, so it is where their identity
          // tabs ride. Five tabs is the tallest this pile gets.
          const gc = [card('grant-pen'), card('grant-shield')].filter((c) => c && visible(c))
            .concat(idOnFounded());
          // a member, a stranger, a founder who holds nothing: no pile, and
          // the line renders exactly as it always did
          return gc.some((c) => S.open === c.k) ? h.paraWith(card(S.open), gc)
            : '<div class="cpara' + (gc.length ? '' : ' notab') + '" data-para="founded">' +
              (gc.length ? h.pile(gc) : '') +
              '<div class="cptext">' + foundedClause() + '</div></div>'; })() : ''),
      // **The hairline and the title are facts about the document, not about
      // the 📄 task** (Ed, backlog 33: *immediately after the birth, when my
      // named document opens for the first time, the Text area should already
      // have the title and hairline above it*). They arrive at the **save**,
      // which is when both become true — the document has a name and it has a
      // column to be written in — and the outline has been pointing at
      // `#dochead` from the save for as long as it has existed (`tocLead`),
      // at an anchor that did not exist until 📄's turn at the very end of
      // the founding. **The pile is the riding tab now** (backlog 204):
      // `#ridetab`, a sticky child of `.doc` beside this heading, drawn by
      // `renderRideTab` — there from the save, since the text is a card with
      // two modes and no task. This row draws the hairline and the title, or
      // the power tab's card while one is open (`pw:u:text` / `pw:a:text`
      // still need a clause to sit under: the settled record, `BODY.text`).
      textAnchor: (h) => (!cs ? ''
        : '<div class="cpara notab docsep"></div>' +
          (/^pw:[ua]:text$/.test(S.open || '') ? h.para(card('text'))
          : '<div class="cpara textanchor notab">' +
            '<h2 class="doctitle dochead" id="dochead">' + esc(S.title || 'Untitled') + '</h2></div>')) },
  ];

  const VALUE = {
    text: () => { const n = proseCounts().blocks;
      return n ? n + ' blocks' : (cs && cs.textConfirmed ? 'Starts empty — the membership writes it' : 'Nothing yet'); },
    title: () => S.title || 'Not named yet',
    slug: () => docAddr(S.slug || '…'),
    invite: () => PRICE_WORDS.admission[admissionPrice()],
    remove: () => PRICE_WORDS.removal[removalPrice()],
    myemail: () => (S.emailVerified ? S.myemail + ' · verified'
      : S.emailSent ? 'Check your inbox' : 'Not given yet'),
    myname: () => S.myname || 'Not given yet',
    mypic: () => (S.mypic ? 'Chosen' : 'Your initials'),
    // an invitee is not a member yet (§9.6a): the line counts the arrived,
    // and says who is still only invited
    admission: () => PRICE_WORDS.admission[admissionPrice()],
    applications: () => POLICY_WORDS[policyNow()],
    chamber: () => ({ link: 'Anyone with the link', closed: 'Members only',
      public: 'Public' }[takenOf('chamber') || S.chamber]),
    ending: () => (perpetual() ? 'Never — it runs until too few members are active'
      : new Date(endingVal() || S.endsAt).toLocaleString(undefined,
        { weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false })),
    bar: () => (takenOf('bar') || S.tClose) + '% sure at the end',
    pace: () => { const v = takenValOf('pace');
      const shape2 = v ? v.shape : S.shape;
      const start2 = v && v.shape === 'ramp' ? v.startPct : S.tStart;
      return (perpetual() ? 'Fixed — no end date to rise towards'
        : shape2 === 'ramp' ? 'Rising from ' + start2 + '%' : 'The same number throughout'); },
    quorum: () => (S.quorumForm === 'count'
      ? Math.min(takenOf('quorum') || S.quorumN, E()) + ' of ' + E()
      : (takenOf('quorum') || S.quorumPct) + '% — ' + quorumCount() + ' of ' + E()),
    authorship: () => ({'anonymous':'Nobody’s name, ever','anonymousElective':'Nobody’s name unless they choose','sealed':'Names at the close','sealedElective':'Names at the close, or earlier by choice','public':'Names from the start'})[takenOf('authorship') || (S.authorship === 'roster' ? 'anonymous' : S.authorship)],
    judgments: () => ({ never: 'Never revealed', after: 'Revealed at the end' }[
      takenOf('judgments') || (S.judgments === 'roster' ? 'never' : S.judgments)]),
    rate: () => { const v = takenValOf('rate');
      return (v ? v.grant : S.grant) + ' each · +1 every ' + (v ? v.dripMinutes : S.dripMin) +
        ' min · cap ' + (v ? v.cap : S.cap); },
    // (🌍 and 🤝 are stated once, above, module-first like every neighbour:
    // a second entry here used to override them and read S alone)
    lapse: () => (S.lapse === 'never' ? 'Never — however long you are away'
      : 'After ' + S.lapseDays + ' days without logging in'),
    removal: () => PRICE_WORDS.removal[removalPrice()],
    canpropose: () => (canPropose() ? 'Open' : 'Waiting on the start'),
    'grant-voice': () => 'You hold a voice in every constitutional question',
    begin: () => (constituted() ? 'Begun' + foundedAt() : 'Not yet begun'),
    closing: () => (cs && cs.closed ? 'Closed' + closedAtWords() : ''),
    'grant-pen': () => 'You hold the pen',
    'grant-shield': () => 'You hold the shield',
    canjudge: () => (canJudge() ? 'Open' : 'Waiting on the constitution'),
  };
  const ANSVALUE = {
    quorum: (v) => 'You said ' + v + ' of ' + E(),
    bar: (v) => 'You said ' + v + '%',
    ending: (v) => (v === 'never' ? 'You said never'
      : 'You said ' + (isNaN(Date.parse(v)) ? v
        : new Date(v).toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false }))),
    authorship: (v) => 'You said ' + ({ anonymous: 'no names, ever', anonymousElective: 'no names unless somebody chooses', sealed: 'names at the close', sealedElective: 'names at the close, or earlier by choice', public: 'names from the start' }[v] || v),
    judgments: (v) => 'You said ' + ({ never: 'never revealed', after: 'revealed at the end' }[v] || v),
    chamber: (v) => 'You said ' + ({ closed: 'members only', link: 'anyone with the link', public: 'public' }[v] || v),
    applications: (v) => 'You said ' + ({ invite: 'invitation only', apply: 'anyone may apply' }[v] || v),
    lapse: (v) => (v === 'never' ? 'You said never' : 'You said after ' + v + ' days without logging in'),
    // keyed by the page's own removal vocabulary — `consent` · `assembly` ·
    // `proposal`, what `ANSTYPED`/`PAGEVAL` and setup.js's ladder speak. It
    // was keyed `everyone`/`others`/`ordinary`, a vocabulary nothing on this
    // page has ever written, so every lookup missed and the readback fell
    // through to the raw token.
    removal: (v) => 'You said ' + ({ consent: 'all members must approve removing a member, and the person themselves must agree',
      assembly: 'all other members must approve removing a member',
      proposal: 'members must vote on removing a member' }[v] || v),
    rate: (v) => 'You said ' + v,
  };
  const ANSASK = { quorum: 'The lowest you will accept', bar: 'The lowest you will accept',
    ending: 'The latest you will accept', authorship: 'The most you will accept',
    judgments: 'The most you will accept',
    chamber: 'The most you will accept',
    applications: 'The most open you will accept',
    lapse: 'The shortest you will accept',
    removal: 'The easiest you will accept',
    rate: 'The most generous you will accept' };
  // **A power tab has no VALUE of its own — its value *is* its rule.**
  // `chipsFor` hands every viewer the ✒️/🛡️ tabs of a settled setting, and on
  // any chair but the founder's the card body is `readBody`, which asks for
  // `ctx.value(c)` — so `VALUE['pw:u:title']` was read as a function and the
  // TypeError took the whole `render()` with it: a member or a stranger
  // clicking a power tab got a page frozen at its last good frame. Found by
  // the card-audit's power walk, 2026-08-23. The missing-key guard beside it
  // is the one `holderLine`'s own lookup already keeps.
  const value = (c) => (c.ansFor
    ? esc(filled(c) ? ANSVALUE[c.ansFor](S.myAns[c.ansFor]) : ANSASK[c.ansFor])
    : c.power ? esc(powerHeadLine(c))
    // a record has no VALUE of its own either — its title *is* what it says
    : c.record ? esc(c.t)
    : esc(VALUE[c.k] ? VALUE[c.k]() : ''));
  // **A task you have to do needs no subtitle** (Ed, 2026-08-19: *subtitles
  // are there to help me make choices — if I have to do them, they don't need
  // extra information*; and on 📧, *the queue-card does not need "Not given
  // yet", that's why it's yellow*). The wash already says the state and the
  // title already says the question, so a line restating either was the rail
  // telling you twice. What survives is the two entries that are **not** asks
  // — a motion, whose subtitle is the thing being proposed and is exactly the
  // information you need to decide whether to open it, and a decision arriving
  // as news, where what happened is the whole point.
  const summary = (c) => {
    const m = motionOn(c);
    if (m) return 'Under motion — ' + esc(m.to);
    if (stateOf(c, ctx) === 'news') return value(c);
    return '';
  };

  // **What is unlocked, and by what.** Reading needs nothing. Proposing and
  // judging both open at the start (§9.0b, Q606, 2026-08-22): there is no
  // state between 📄 and 🍾 where proposals are open, because the text a
  // proposal is made against is decided as part of the start, and a judgment
  // is *recorded under a disclosure setting* and *counted towards a quorum*,
  // neither of which can be decided after it without changing what it was.
  // `canPropose` used to be true from the text alone, so the topbar read
  // *proposals open* on a document that had not begun.
  const canPropose = () => !!cs && cs.textConfirmed && constituted();
  const ceremony = () => CARDS.filter((c) => c.gate === 'judge');
  const canJudge = () => !!cs && cs.canJudge();

  // **A power is not held until it has been acknowledged** (Ed, 2026-08-21:
  // *I should not be able to do actions until I have acknowledged that I have
  // been given the right to do them. I shouldn't be shown actions that I
  // can't do.*)
  //
  // The grant *is* the conferring act, so the OK on it is not a receipt for
  // something already true — it is the moment the thing becomes true. Until
  // then the act is refused **and never offered**. Acknowledgment had gated
  // exactly three `style.display` lines (the ✏️ ✒️ 🏛️ wallets) and nothing
  // else, which is the rule inside out: the receipt was hidden while the
  // power ran. `may*` is therefore the only thing any control may ask;
  // `can*` stays what the *document* permits, which is what the grant card
  // itself reads to know whether it has opened.
  //
  // Where the distinction lands on the surface: an **offer** disappears (the
  // caret in the charter, ✏️ propose edit, a motion composer, the ✒️
  // commit) — you are not shown an act you cannot take. A **question put to
  // you** stays visible and goes `locked` (a race card), because it still
  // has to be readable; that is the state cards.js already draws for a card
  // whose reader may not judge it.
  const acked = (k) => S.okd.has(k);
  const mayPropose = () => canPropose() && viewerIsMember() && acked('canpropose');
  const mayJudge = () => canJudge() && viewerIsMember() && acked('canjudge');
  const mayVoice = () => !!cs && viewerIsMember() && !!viewerRow().in && acked('grant-voice');
  const mayPen = () => !!cs && amFounder() && holdsPenAnywhere() && acked('grant-pen');
  // **The wallet says you hold a pen; the lock says you hold *this* one**
  // (entry 62, Ed's batch-B QA 2026-08-25: *after giving up the pen on Title,
  // I can still edit the title*). `mayPen()` is the wallet question and stays
  // it — `holdWallet`, the spend-preview and the topbar socket ask it, and on
  // a closed document a founder who never gave the pen up still holds it, so
  // a `closed` term here would draw a struck ✒️ and say they had (Ed, B25 (a)).
  // Every **commit** asks this instead: the grant accepted, the document still
  // open, and the pen on the setting being set. `pwPair` reads the hand
  // actually on the setting, and a release made before 🍾 still reads held —
  // which is R-048's rule and what makes the pre-start control correct here
  // without a special case.
  const docOpen = () => !(cs && cs.closed);
  const mayPenOn = (k) => mayPen() && docOpen() && pwPair(k).u;
  // **The shield has a grant of its own** (`grant-shield`, since d20f67a — the
  // purer reading of *no power arrives without acknowledgment* that Q532 asked
  // for): it used to ride the pen's OK, since both powers arrive in the
  // founder's hands by one act, but they are opposite powers and a founder
  // who has pressed OK on one card saying "your powers" has learned one thing
  // where there were two.
  const mayShield = () => !!cs && amFounder() && holdsShieldAnywhere() && acked('grant-shield');
  // A commit that spends out of a wallet needs that wallet to have arrived.
  // The pen is the one this bites for: `holdWallet` reads ✒️ as a **hold**
  // only while the glyph is in the topbar, so before the grant was
  // acknowledged a pen commit quietly degraded into a plain click — the hold
  // discipline disappearing exactly where the founder is being taught it.
  // Gates hold a position in the founding order without blocking it, so a
  // settings card really can arrive before ✒️ has been accepted.
  // **With a card it asks the lock; without one it asks the wallet.** The
  // disabled test passes the card, so a pen laid down on *this* setting greys
  // its commit; the tooltip does not, because `penWaitTitle` explains the
  // wallet and there is nothing to explain where the setting's own pen is
  // down — that card has already stopped being the founder's to edit (step 3).
  const penOkFor = (glyph, c) => glyph !== '✒️' || (c ? mayPenOn(c.k) : mayPen());
  const penWaitTitle = 'Your pen is waiting in your tasks — accept it and this turns.';

  // ---- motions (stage D of the merge, Ed 361) ---------------------------
  // A motion is the act of changing a **settled** document's rules (§9.6a):
  // before judging opens there are no past decisions for a change to re-rate,
  // so nothing is amended, only set — the founder re-sets freely, and these
  // exist only once the constitution is settled and judging is open.
  const motionsLive = () => canJudge();
  // ---- motions live in the module (9c): the page renders records --------
  // **An admit motion targets its own card** (entry 96): before this it fell
  // through to 🪪's own key (`membership` as the id was then spelled, Q903)
  // and landed on the price card — which was harmless
  // only because nothing drew it, and would now put every applicant's
  // judgment on the price card. Pointing it at `adm:<applicant>` is also what
  // hands the whole generic motion path to these cards: `liveMotionRec`,
  // `motionOn`, `answeredMotion` and `mustAct` all key on this, so an
  // application raises a task the way any other motion does (Ed, 2026-08-26:
  // *applications should generate a task when they are made*).
  const motionTargets = (rec) =>
    rec.payload.kind === 'invite' ? 'invite'
    : rec.payload.kind === 'remove' ? 'remove'
    : rec.payload.kind === 'admit' ? 'adm:' + rec.payload.applicant
    : pkeyOf(rec.payload.kind === 'set' || rec.payload.kind === 'reserve'
      ? rec.payload.setting : 'admission');
  // the members a removal is running against (entry 94): the ❌ door's
  // pending list, read off the motions like everything else on the page
  // **A member-pile card heads with its people** (CP6, Q1101, 2026-08-31):
  // the pile's avatar-and-name list is the card's standing text — the status
  // quo the act is about — so opening ❌ never hides the people it acts on.
  // ✉️ heads with the invitees, ❌ with the proposed-for-removal; the price
  // sentence stands beneath the list, in the same head.
  const doorPeople = (c) => {
    const rows = c.k === 'invite'
      ? S.roster.filter((p) => !p.in)
      : (cs ? S.roster.filter((p) => removalPendingIds().has(p.mid || 'founder')) : []);
    const empty = c.k === 'invite' ? 'Nobody has been invited yet.' : 'Nobody is proposed for removal.';
    return '<div class="headpeople">' + (rows.length
      ? rows.map((p) => '<span class="hp">' + avHtml(p) + ' ' +
          esc(p.n || p.e || 'Anonymous') + '</span>').join('')
      : '<span class="hpnone">' + empty + '</span>') + '</div>';
  };
  const removalPendingIds = () => {
    const ids = new Set();
    if (!cs || !motionsLive()) return ids;
    for (const rec of cs.motionRecords().values()) {
      if (rec.payload && rec.payload.kind === 'remove' &&
        (rec.status === 'running' || rec.status === 'awaiting-crown')) ids.add(rec.payload.member);
    }
    return ids;
  };
  const nameOfMember = (mid2) => {
    const row = S.roster.find((r) => (r.mid || 'founder') === mid2);

    const why = (S.setWhy || {})[c.k] || '';
    if (c.door) {
      if (c.k === 'invite') {
        const at = (S.inviteOne || '').trim();
        return at ? { k: c.k, to: at + ' joins the membership', why } : null;
      }
      const row = removableRows().find((p) => p.mid === S.removeWho);
      return row ? { k: c.k, to: (row.n || row.e || 'Anonymous') + ' leaves the membership', why } : null;
    }
    if (wantsDelegate(c.k)) return null;      // handing it over is not a value
    if (CHOSEN[c.k] && !CHOSEN[c.k]()) return null;
    let val = null;
    try { val = TYPED[c.k] ? TYPED[c.k]() : null; } catch (e) { return null; }
    if (!val) return null;
    const stands = standsTyped(c.k);
    if (stands && JSON.stringify(stands) === JSON.stringify(val)) return null;
    const to = wordsFor(c.k, val);
    return to ? { k: c.k, to, val, why } : null;
  };
  // the row's second control: whatever the route asks for at this value —
  // ✏️ Propose on an ordinary one, 🏛️ on a constitutional one (K6, K7) — and
  // the one-🏛️-out disable and the ✏️ flight come with it
  const founderCommit = (c) => (founderPair(c)
    ? motionCommitHtml(c, (founderProposal(c) || {}).to || '', !!myHeldOut()) : '');
  // **A clerk is told why, rather than left to notice** (T13, T37): they are
  // not a member, so there is no ✏️ to spend and `openMotion` would refuse
  // them anyway. Drawn exactly where the pair would otherwise stand.
  const founderPairNote = (c) => (founderPairOn(c) && !viewerIsMember()
    ? '<p class="setnote">You are not a member, so there is no ✏️ for you to spend — ' +
      'this one is yours to set.</p>' : '');
  // what a press finds when the value it was drawn for has gone (F17: a click
  // that lands on nothing is answered). One sentence, both gestures.
  const NOTHING_TO_PUT = 'That could not be proposed: nothing is chosen on this card.';
  // **The founder's editing body follows the setting's own pen** (entry 62).
  // True exactly where the founder is being shown the card and no longer has
  // the hand it is drawn for: the value radios, the title lane, the delegate
  // rung and the *why are you changing this* lane all hang off this. A
  // founder-member falls through to `composerOn` and composes like anybody
  // else; a **clerk** founder has no composer to fall to (`viewerIsMember()`),
  // and lands on the settled card — the sentence, the watch half, a bin.
  // Scoped to the catalogue settings the founder's card sets: gates, the
  // personal cards, 🎩 and 📄 are none of them a `powers.unilateral` question,
  // and the two doors have carried their own gate since Q811.
  // **A delegated setting is not a pen laid down.** `setting-delegated` clears
  // both powers, so `founderDirect` is false there too — and read-only on a
  // members-held card takes the delegate rung and the value radios away with
  // it, which pre-start are the *only* way back: `commitSetting` reclaims when
  // the founder picks a value, and 🍾's own hold sentence tells them to do
  // exactly that (*take it back on its own card and set it yourself*). So
  // `membersHold` is excluded: this is about the founder's own hand coming off
  // a setting they still hold, never about one they handed to the room.
  const founderHandOff = (c) => amFounder() && !c.ansFor && !c.isGate && !c.door &&
    !c.power && !c.record && c.kind !== 'personal' &&
    MANAGED_KEYS.includes(c.k) && !membersHold(c) && !founderDirect(c);
  // **One 🏛️ out per member, on every card including the one it is out on**
  // (Q816). The exemption for `c.k` was a guess about which card could still
  // be composing, and the module makes no such exemption: `openMotion`
  // refuses a second constitutional motion whatever it targets. ✉️ is where
  // that bites, since two invitations in a row are one act repeated — so the
  // commit greys and says to withdraw the first, rather than taking the
  // press and losing it.
  const commitFor = (c) => motionCommitHtml(c,
    (S.draft && S.draft.k === c.k) ? S.draft.to : '',
    !!myHeldOut());

  /* **A motion is composed with the setting's own control** (motion-controls),
     and the grammar is session-view's, via cards.js (Ed, 2026-08-18: *the
     composers on the session-view are the better ones*): the lane radios are
     laneBarHtml speaking data-mval, the rationale is the editing-card's own
     sealed-disc speaker — never an avatar, since authorship is sealed. */
  const PC = window.CARDS.make({ valAttr: 'data-mval', pickOf: (d) => (d ? d.to : null) });
  const laneBlock = (d, val, text) =>
    '<div class="propblock"><div class="rtext">' + text + '</div>' +
    PC.laneBarHtml(d, val, { edit: false }) + '</div>';
  const inputBlock = (html, note) =>
    '<div class="propblock"><div class="rtext">' + html + '</div>' + (note || '') + '</div>';
  // **What stands on a delegated setting is what the room's answers took**,
  // never the founder's field — that still says 'roster'. The consent rule,
  // computed live: highest for quorum and the bar, latest for the ending
  // (never latest of all), longest for lapse, most private for the privacy
  // family, most generous for the rate.
  // what the room settled — the ceremony's resolution, a carried motion, a
  // crown-accepted change — translated back into the page's vocabulary.
  // Anything settled away from the convenor's own hand outranks the page's
  // provisional fields (v0.48: motions now apply).
  const takenOf = (k) => {
    const st = csState(k);
    if (!st || st.settledBy === null || st.settledBy === 'convenor' || st.value === null) return null;
    return PAGEVAL[k] ? PAGEVAL[k](st.value) : null;
  };
  // the whole typed value where one number is not enough (the rate)
  const takenValOf = (k) => {
    const st = csState(k);
    return st && st.settledBy !== null && st.settledBy !== 'convenor' ? st.value : null;
  };
  // a carried title or link changed under the page's mirrors — resync; and
  // the rows follow the register (carried invitations, removals, admissions)
  // **A name and a face reach every seat** (Q850–Q853). The register is
  // public by the spec's own test — names, pictures and who has arrived
  // (§9.0c, and `MemberRowView`'s note in the module) — and the module has
  // always projected all three to everybody. The page threw two thirds of it
  // away: `rec.name` was read only on the push that *created* a row, so a
  // name or a face chosen after that reached nobody, and the founder's row
  // was skipped outright, so an invitee read the founder as *Anonymous* and
  // never saw their picture at all. The founder's picture is the sharper
  // half: no live path has ever written it, the boot line setting `f.e`,
  // `f.role` and `f.n` once and nothing since.
  //
  // **Your own row is not reconciled.** ✋ and 🖼️ write straight onto it as
  // you type and as you pick, before anything is committed, so a render or a
  // 4s poll landing mid-choice would put the module's answer back over the
  // one you are making — the same rule the value hydration keeps for the
  // open card. What you have committed is already on the row, by way of
  // `hydrateS`'s own read of `view.identity`.
  //
  // The fallback stays each row's own: an invitee is listed by their address
  // until a name exists (which is why the register carries emails at all),
  // and a founder who set no name is *Anonymous* like anybody else (§9.0c),
  // which is what the Founded line says.
  const syncIdentity = (row, rec) => {
    if (!row || row === viewerRow()) return;
    row.n = rec.name || (row.founder ? '' : String(rec.email || '').split('@')[0]);
    row.pic = rec.picture || '';
  };
  const syncFromCs = () => {
    if (!cs) return;
    const tv = csState('title'), lv = csState('slug');
    if (tv && tv.settledBy === 'motion' && tv.value.text !== S.title) S.title = tv.value.text;
    if (lv && lv.settledBy === 'motion' && lv.value.slug !== S.slug) S.slug = lv.value.slug;
    for (const [mid2, rec] of cs.memberRecords()) {
      // the founder is in here too, seeded `mid: 'founder'` and minted by the
      // server with that same literal, so the row is found rather than
      // duplicated — which is the whole of why the skip could simply go
      const row = S.roster.find((r) => r.mid === mid2);
      if (!row && !rec.removed) {
        S.roster.push({ n: rec.name || rec.email.split('@')[0], pic: rec.picture || '',
          e: rec.email,
          // **the row carries its own lapse** (entry 95): *Lapsed* is a
          // subsection of the register, so the fact has to be on the row the
          // list is built from, not only on the member record behind it
          lapsed: !!rec.lapsed,
          // and its own dead mail (SURFACE E34), for entry 95's reason: the
          // *Invitees* row is built from this list, so the fact has to be on
          // the row and not only on the member record behind it
          mailGaveUp: !!rec.mailGaveUp,
          role: 'member', in: rec.arrivedAtT !== null, mid: mid2, ans: {}, okd: new Set() });
      } else if (row && rec.removed && !row.founder) {
        const at = S.roster.indexOf(row);
        S.roster.splice(at, 1);
        if (S.viewer === at) S.viewer = 0;
      } else if (row) {
        if (rec.arrivedAtT !== null && !row.in) row.in = true;
        // lapse is re-read whenever 💤 changes (entry 97), so this is a
        // straight assignment rather than a one-way latch: a member the room
        // has just put back leaves *Lapsed* on the next render
        row.lapsed = !!rec.lapsed;
        // straight assignment for lapse's reason: 📨 clears it in the module
        // and the row must follow on the next render (E34)
        row.mailGaveUp = !!rec.mailGaveUp;
        syncIdentity(row, rec);
      }
    }
    // **A clerk is no member, and still has a name and a face** (§9.7 X15): a
    // founder with no powers and no membership keeps both. They are in no
    // `MemberRecord` at all — 🎩 deletes it — so the register's founder row
    // reads from the convenor record instead, which is exactly where the
    // module puts a clerk's identity.
    const f = S.roster.find((r) => r.founder);
    if (f && !cs.memberRecords().has(f.mid || FOUNDER) && cs.convenorRecord) {
      const c = cs.convenorRecord();
      if (c) syncIdentity(f, { name: c.name, picture: c.picture, email: c.email || f.e });
    }
  };
  // ...stated in the composers' own vocabulary, so a lane equal to what
  // stands filters itself out
  const STANDS = {
    chamber: (v) => ({ closed: 'Members only', link: 'Anyone with the link', public: 'Public' })[v],
    applications: (v) => ({ invite: 'Invitation only', apply: 'Anyone may apply' })[v],
    authorship: (v) => ({'anonymous':'Nobody’s name, ever','anonymousElective':'Nobody’s name unless they choose','sealed':'Names at the close','sealedElective':'Names at the close, or earlier by choice','public':'Names from the start'})[v],
    judgments: (v) => ({ never: 'Never revealed', after: 'Revealed at the end' })[v],
    lapse: (v) => (v === 'never' ? 'Never — however long you are away' : 'After ' + v + ' days without logging in'),
    // `standsOf` feeds this `takenOf('removal')`, which is `PAGEVAL.removal`
    // — the price, `consent` · `assembly` · `proposal`. Keyed
    // `everyone`/`others`/`ordinary` it returned `undefined` for every value
    // the page can produce, so `standsOf('removal')` fell to `''` on a 🥾 the
    // membership decided and the 🏛️ card read *replaces <i></i>*.
    removal: (v) => ({ consent: 'All members must approve removing a member, and the person themselves must agree',
      assembly: 'All other members must approve removing a member',
      proposal: 'Members must vote on removing a member' })[v],
    quorum: (v) => (S.quorumForm === 'count' ? v + ' of the membership' : v + '% of the membership'),
    bar: (v) => v + '% sure at the end',
    ending: (v) => (v === 'never' ? 'Never — it runs until too few members are active'
      : new Date(v).toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false })),
    rate: (v) => { const tv = takenValOf('rate');
      return v + ' each · +1 every ' + (tv ? tv.dripMinutes : S.dripMin) +
        ' min · cap ' + (tv ? tv.cap : S.cap); },
  };
  const standsOf = (k) => {
    const c = card(k);
    if (c && isRoom(c)) {
      const v = takenOf(k);
      if (v !== null && STANDS[k]) return STANDS[k](v) || '';
    }
    return VALUE[k] ? String(VALUE[k]() || '') : '';
  };
  // what stands is never offered back: picking the current rule is not a change
  const currentOf = (k) => standsOf(k);
  // **Filtered by value, never by label** (Q620 (a), 2026-08-22). The old
  // test was `currentOf(k).startsWith(label)`, a string comparison between a
  // lane's label and the standing rule's sentence — so it held only while
  // STANDS and the composer happened to spell a rung the same way, and one
  // label per rung everywhere is now the rule rather than the accident. A
  // lane is what stands when its typed value equals the module's (or, before
  // the module holds one, the founder's own fields typed the same way).
  const standsTyped = (k) => { const st = csState(k);
    return st && st.value !== null ? st.value : (TYPED[k] ? TYPED[k]() : null); };
  const offersStanding = (k, label) => { const v = mvalTyped(k, label), s = standsTyped(k);
    return v && s ? JSON.stringify(v) === JSON.stringify(s) : currentOf(k).startsWith(label); };
  const lanesFor = (d, pairs, k) => pairs.filter(([val]) => !offersStanding(k, val))
    .map(([val, text]) => laneBlock(d, val, text)).join('');
  const whyLane = (d) =>
    '<div class="lanebox whylane"><div class="speaker">' +
    '<span class="disc" aria-hidden="true" title="This is how your reason will reach everybody else: with your name off it."></span>' +
    '<div class="said edit-why" contenteditable="plaintext-only" spellcheck="false" data-motionlane="why"' +
    ' data-placeholder="We should change this because…">' + esc((d && d.why) || '') + '</div></div></div>';

  const POLICY_TEXTS = [
    ['Invitation only', 'Membership is by invitation only.'],
    ['Anyone may apply', 'Anyone may apply to join.'],
  ];
  // every composable setting has its control (Ed's QA, 2026-08-18) — a text
  // box asks somebody to guess a format the surface already knows
  const PROPOSE = {
    title: (d) => inputBlock('The document is titled ' +
      '<input data-mtext="1" value="' + esc(d.to || S.title) + '" style="width:22rem">.'),
    slug: (d) => inputBlock('The document lives at ' + docAddr('') +
      // the field holds the slug alone, so the stored form is stripped back
      // off it; the `d/` is optional in the strip so a draft composed before
      // the address gained its route still round-trips into the box
      '<input data-mslug="1" value="' + esc((d.to || S.slug).replace(/^docs\.vote\/(?:d\/)?/, '')) + '" style="width:12rem">.',
      '<p class="setnote">Every link the document has ever had keeps working — a change leaves a redirect behind.</p>'),
    pace: (d) => lanesFor(d, [['The same number throughout',
        'The approval threshold stays the same all the way through.']], 'pace') +
      inputBlock('The approval threshold starts at ' +
        '<input class="num" type="number" min="50" max="99" data-mpace="1" value="' +
        esc((/^Rising/.test(d.to) && (d.to.match(/\d+/) || [])[0]) || S.tStart) + '">% and rises to the number at the end.',
        // a motion is composed with the setting's own control (K1), so the
        // meaning belongs beside it exactly as on the founder's card
        meanLine('pace', d.val && d.val.shape ? d.val : null)),
    rate: (d) => {
      const n = d.to.match(/\d+/g) || [];
      return inputBlock('Members start with ' +
        '<input class="num" type="number" min="0" max="40" data-mrate="x" value="' + esc(n[0] || S.grant) + '"> ✏️ each, up to a maximum of ' +
        '<input class="num" type="number" min="1" max="99" data-mrate="y" value="' + esc(n[1] || S.cap) + '">. They get an additional ✏️ every ' +
        '<input class="num" type="number" min="5" max="2880" data-mrate="z" value="' + esc(n[2] || S.dripMin) + '"> minutes.',
        meanLine('rate', d.val && d.val.grant !== undefined ? d.val : null));
    },
    ending: (d) => {
      const never = /never/i.test(d.to);
      return inputBlock('The drafting process will end on ' +
          '<input type="datetime-local" data-mdate="1" value="' + esc(S.endsAt || '') + '">.') +
        lanesFor(d, [['Never — it runs until too few members are active',
          'The drafting process has no set end — it runs until too few members are active.']], 'ending') +
        (never ? '<p class="setnote">Taking the end date away needs all members to agree — with no end date the approval threshold cannot rise.</p>' : '');
    },
    // the ceiling note (Q840) rides the founder's own control as well as the
    // member's slider — a founder setting 85% alone in the room is told
    // exactly what a member answering 85% is told. `max` is 99 here, this
    // field's own ceiling, so the note goes quiet at E ≥ 10.
    bar: (d) => inputBlock('A proposal passes when the members are ' +
      '<input class="num" type="number" min="50" max="99" data-mnum="% sure at the end" value="' +
      esc((d.to.match(/\d+/) || [])[0] || takenOf('bar') || S.tClose) + '">% sure at the end.',
      meanLine('bar', d.val && d.val.pct !== undefined ? d.val : null)) +
      // and the method note with it (entry 163): the pen's set card is the
      // founder card in its second epoch, so a founder who first meets 🌡️
      // after the save would otherwise never be offered the explainer
      ceilingNote(E(), 99) + methodNote(),
    quorum: (d) => (S.quorumForm === 'count'
      ? inputBlock('Quorum is <input class="num" type="number" min="1" max="99" data-mnum=" of the membership" value="' +
        esc((d.to.match(/\d+/) || [])[0] || takenOf('quorum') || quorumCount()) + '"> of the membership.',
        meanLine('quorum', d.val && d.val.form ? d.val : null))
      : inputBlock('Quorum is <input class="num" type="number" min="1" max="100" data-mnum="% of the membership" value="' +
        esc((d.to.match(/\d+/) || [])[0] || takenOf('quorum') || S.quorumPct) + '">% of the membership.',
        meanLine('quorum', d.val && d.val.form ? d.val : null))),
    removal: (d) => lanesFor(d, [
      ['All members must approve removing a member, and the person themselves must agree', 'Removing a member needs all members to agree, including them.'],
      ['All other members must approve removing a member', 'Removing a member needs every other member to agree.'],
      ['Members must vote on removing a member', 'A member is removed by a proposal, voted on like any other.']], 'removal'),
    lapse: (d) => lanesFor(d, [['Never — however long you are away',
        'A membership never lapses, however long somebody is away.']], 'lapse') +
      inputBlock('A membership lapses after ' +
        '<input class="num" type="number" min="7" max="720" data-mnum=" days without logging in" value="' +
        esc((d.to.match(/\d+/) || [])[0] || S.lapseDays) + '"> days without logging in.',
        // presence, not truthiness: `afterMs: null` is 💤's *Never*, a real
        // value with a real sentence, and the other keys all test for the
        // field being there rather than for it being non-zero
        meanLine('lapse', d.val && d.val.afterMs !== undefined ? d.val : null)),
    authorship: (d) => lanesFor(d, [
      ['Nobody’s name, ever', 'A proposer is never named — not even in the closing record.'],
      ['Nobody’s name unless they choose', 'A proposer is never named unless they sign the proposal themselves.'],
      ['Names at the close', 'Proposers are named in the closing record, never before.'],
      ['Names at the close, or earlier by choice', 'Proposers are named in the closing record, and sooner if they sign.'],
      ['Names from the start', 'Every proposal carries its proposer’s name from the moment it is made.']], 'authorship'),
    judgments: (d) => lanesFor(d, [
      ['Never revealed', 'Votes are never revealed — not even in the closing record.'],
      ['Revealed at the end', 'Votes are published with the closing record, never before.']], 'judgments'),
    chamber: (d) => lanesFor(d, [
      ['Members only', 'Only members can read the document.'],
      ['Anyone with the link', 'Anyone with the link can read it; it is not listed.']], 'chamber'),
    applications: (d) => lanesFor(d, POLICY_TEXTS, 'applications') +
      '<p class="setnote">One motion proposes one rule; what you do not touch stands.</p>',
    // ✉️: whom to bring in — the invite half of what was one roster
    // composer (Ed, 2026-08-19, 400a)
    invite: (d) =>
      '<div class="roster"><div class="addrow"><input placeholder="Somebody to invite" data-mjoin="1">' +
      '<button class="btn" data-mjoinbtn="1">Invite</button></div></div>' +
      '<p class="setnote">An invitation is constitutional, because the membership is what quorum is a fraction of: all members must agree, and one who says no keeps them out.</p>',
    // ❌: the membership, in front of you, with an ✕ beside each — which
    // is what “propose a removal” means
    // **One control names the subject** (entry 96): the same dropdown the pen
    // branch uses, members and invitees alike, in place of a ✕ on every row.
    remove: (d) => (() => {
      const rows = removableRows();
      if (!rows.length) return '<p class="setnote">There is nobody to remove.</p>';
      const val = (p) => (p.n || p.e) + ' leaves the membership';
      return '<span class="fld"><select data-mval-sel="1" style="min-width:18rem">' +
        '<option value=""' + (d.to ? '' : ' selected') + '>Choose somebody…</option>' +
        rows.map((p) => '<option value="' + esc(val(p)) + '"' +
          (d.to === val(p) ? ' selected' : '') + '>' +
          esc(p.n || p.e || 'Anonymous') + (p.in ? '' : ' — invited, not yet here') +
          '</option>').join('') + '</select></span>'; })() +
      // no route note: the 🥾 clause states how a removal is decided, and
      // hardcoding one rung here lied under the other two (copy pass,
      // 2026-08-19)
      '<p class="setnote">Whoever it is will see the proposal — nobody is removed in secret.</p>',
  };

  // A constitutional motion re-opens consent: what is proposed, what stands,
  // two answers, one refusal keeps what stands. The pick markup is one
  // helper — invite, removal and the generic body differ only in copy.
  const consentPicks = (key, opts) => '<div class="choice" role="radiogroup">' +
    opts.map(([v, label, exp]) =>
      '<div class="pick' + (S.mAns[key] === v ? ' on' : '') + '">' +
      '<span class="opttext">' + label + '</span>' +
      '<span class="exp">' + exp + '</span>' +
      '<button class="lanepick" aria-pressed="' + (S.mAns[key] === v) +
      '" data-motion="' + v + '"><span class="dot"></span>' +
      '<span class="off">Prefer this</span><span class="on">Preferred</span></button>' +
      '</div>').join('') + '</div>';
  const inviteBody = (m) =>
    '<p class="why">Whether <b>' + esc(m.invite) + '</b> joins the membership. Adding a member changes what quorum is a fraction of, so it is constitutional: the most restrictive answer wins, and one member who says no keeps them out.</p>' +
    consentPicks('invite', [
      ['no', 'I would rather they did not', 'They stay out. Nobody is told who said so.'],
      ['yes', 'I accept them joining', 'They start with the ✏️s everyone got, plus what the drip has added since, and quorum recomputes.'],
      ['abstain', 'Abstain', 'An answer, not a block: they can join without your consent counting either way.'],
    ]) + BLINDNOTE;
  const removeBody = (m) => {
    const nm = nameOfMember(m.removee);
    // 🏛️ without [avatar] (Q401a): under 'others' the subject sees the
    // motion running against them — ruled, Ed 2026-08-19 — and is asked
    // nothing; it settles without them.
    if (removalPrice() === 'assembly' && m.removee && m.removee === viewerId()) {
      return '<p class="why">Whether <b>you</b> leave the membership. Under this document’s rule that is decided by <b>everyone but you</b> — you see it running, and your answer is not asked.</p>' +
        '<p class="setnote">' + (m.judged || 0) + ' of ' + Math.max(E() - 1, 0) + ' have answered. One refusal keeps you in.</p>';
    }
    return '<p class="why">Whether <b>' + esc(nm) + '</b> leaves the membership. Removing a member changes what quorum is a fraction of, so it is constitutional — ' +
    (removalPrice() === 'assembly'
      ? 'decided by everyone but them; they see it running.'
      : 'and their own answer counts among everyone’s.') + '</p>' +
    consentPicks('remove', [
      ['no', 'They stay', 'Nobody is told who said so.'],
      ['yes', 'I accept their leaving', 'Their votes already cast keep counting; quorum recomputes.'],

  // ⏩ settle the founding — now a scripted drive of REAL module commands

  function devFastForward() {

  // **No card draws the roster** (entry 96): the register is the constitution’s

  const waiting = (c) => (motionOn(c) ? answeredMotion(c)

  // collected then acknowledges a rule that may not be the rule. A gate is

  const constituted = () => !!(cs && cs.constitutedAtT !== null);

    : c.isGate ? (c.open() && staged(c) && !S.okd.has(c.k))
    : !constituted() ? false
    : !c.ansFor && isRoom(c) && settled(c) && E() > 0 && (c.in || 0) >= E() &&
      !S.okd.has('res-' + c.k))
    // **a constitutional rule you had no say in is a decision you are
    // owed** (the live rail's rule, arriving here): a founder-set

    // a door is not a decision — nobody set it, nothing binds through it —
    // so it is never news to acknowledge (pacing pass, 2026-08-19: the ✉️❌

      // **and an ordinary setting the founder *changed*** (Q530, Ed
      // 2026-08-22). An ordinary rule the founder simply made is not news —

  // **The constitution states itself in sentences** (Ed, 2026-08-18): each

  // sentence once decided, all in the founder's own frame.
  const WHAT = {

    quorum: 'how many members must weigh in before a question can pass',
    // *the membership* twice in one sentence: `WHAT` is read inside *The

    bar: 'how sure members must be at the close',
    pace: 'how the approval threshold climbs to the close',

    lapse: 'whether an inactive membership lapses',

    rate: 'how often members may propose',
    applications: 'whether strangers may apply to join',
    slug: 'the document’s address',
    shape: 'what type of document this is',
