  // ---- the session machinery (stage 8: one surface) ----------------------
  // session.js renders the charter column, the whole rail and the wire; this
  // page renders the constitution band and hands session.js its tasks as
  // entries (extra), the contents rail's lead, and the open-card arbitration.
  //
  // **The document model is one block per line**: the stored text is one
  // line per block (a leading '# ' … '### ' marks a heading), and the engine's
  // document is the same lines — so a clause key is its line index and a
  // proposal on a block is one hunk over that line.
  const blocksOf = (text) => String(text || '').split(/\n/).flatMap((l, i) => {
    if (!l.trim()) return [];                      // a blank line is a line the engine counts, and nothing to read
    const m = l.match(/^(#{1,3})\s+(.*)$/);
    return [m ? { t: 'h', level: m[1].length, x: m[2], key: 'L' + i } : { t: 'p', x: l, key: 'L' + i }];
  });
  // ---- the closed document is bracketed (Q470) ----------------------------
  // constitution · charter · **the backlog as ranked document text** · the
  // signatures. Each undecided race is a paragraph — its best candidate's
  // wording as the text — wearing the third filed mark, whose tab opens its
  // record; then a signatures block, a name or the disc, the comment, when.
  const undecidedRecords = () => {
    if (!cs || !cs.closed) return [];
    if (cs.isRemote) return (cs.record && cs.record.undecided) || [];
    return (FIX && FIX.CLOSED && FIX.CLOSED.undecided) || [];
  };
  const undecidedCount = () => undecidedRecords().length;
  const bestOf = (o) => {
    const f = (o.field || []).slice().sort((x, y) => (y.p ?? -1) - (x.p ?? -1));
    return f[0] || null;
  };
  // **Amendments are reported the same way whoever made them** (Ed,
  // 2026-08-22). Every carried change to a rule, in order, in one section —
  // the founder's pen and the membership's motions in one list, because they
  // are one kind of thing. It names the **office** rather than the person:
  // the pen is the Founder's by construction, a raised motion is the
  // membership's act, and neither sentence has to reach into the anonymity
  // ladder to know what it may say.
  const amendmentBlocks = () => {
    if (!cs) return [];
    const rows = [];
    try {
      for (const m of cs.motionRecords().values()) {
        if (m.status !== 'carried') continue;
        if (!m.payload || m.payload.kind !== 'set') continue;
        const k = PKEYOF[m.payload.setting] || m.payload.setting;
        const at = m.at !== undefined && m.at !== null ? m.at : (m.settledAtT || 0);
        const from = m.from !== undefined && m.from !== null ? m.from
          : (cs.amendedFrom ? cs.amendedFrom(m.id) : null);
        rows.push({ k, at, from, to: m.payload.value, why: m.why || null, route: m.route });
      }
    } catch (e) { return []; }
    if (!rows.length) return [];
    rows.sort((x, y) => x.at - y.at);
    const out = [{ t: 'h', level: 1, x: 'Amendments', key: 'A:head' }];
    rows.forEach((r, i) => {
      const what = WHAT[r.k] || (r.k === 'title' ? 'the document’s title' : r.k);
      const was = wordsFor(r.k, r.from);
      const now2 = wordsFor(r.k, r.to);
      const who = r.route === 'pen' ? 'The Founder' : 'The membership';
      // an absolute date, not `whenOf`'s relative one: the record is read
      // long after the day it describes, and *today, 11:28* is false by
      // morning. Same formatting as the clause's own history line.
      const on = r.at ? new Date(r.at).toLocaleDateString(undefined,
        { day: 'numeric', month: 'long', year: 'numeric' }) : '';
      // and a reason that already ends in a full stop does not want another
      const reason = r.why
        ? ' — ' + r.why + (/[.!?…]$/.test(r.why.trim()) ? '' : '.')
        : ' — no reason given.';
      out.push({ t: 'p', key: 'A:' + i,
        x: on + ' · ' + what +
          (was && now2 ? ': ' + was + ' → ' + now2 : '') + '. ' + who + reason });
    });
    return out;
  };
  const closedBlocks = () => {
    if (!cs || !cs.closed) return [];
    const out = amendmentBlocks();
    const und = undecidedRecords();
    if (und.length) {
      out.push({ t: 'h', level: 1, x: 'Backlog', key: 'U:head' });
      for (const o of und) {
        const best = bestOf(o);
        const text = best ? best.hunks.flatMap((h) => h.lines).map(unhead).join(' ') : (o.displaced || []).join(' ');
        out.push({ t: 'p', x: text || '(the text stood)', key: 'U:' + (o.raceId || o.candidateId) });
      }
    }
    const sigs = closeSignatures();
    out.push({ t: 'h', level: 1, x: 'Signatures', key: 'S:head' });
    if (!sigs.length) out.push({ t: 'p', x: 'Nobody has signed the document yet.', key: 'S:none' });
    sigs.forEach((sg, i) => out.push({ t: 'p',
      x: (sg.name || 'A member, unnamed') + (sg.comment ? ' — ' + sg.comment : ' — signed without a comment') +
        (sg.t ? ' · ' + whenOf(sg.t) : ''), key: 'S:' + i }));
    return out;
  };
  // the closed fixture: two of the Hollow Oak's open races become undecided
  // records at their backlog paragraphs, the module closes, two members sign
  function closeFixture() {
    if (!cs || cs.closed) return;
    const pick = FIX.SUGGS.filter((g) => g.kind === 'race' && g.state === 'needs' && !g.deadlocked).slice(0, 2);
    const und = pick.map((g, i) => ({
      raceId: 'fx-u' + i, outcome: 'undecided', when: Date.now(),
      field: [g.race.a, g.race.b].map((c, j) => ({ hunks: [{ lines: [c.text] }], rationale: c.rationale,
        p: c.p ?? (j === 0 ? 0.58 : 0.47), outcome: 'undecided', author: null })),
      displaced: [String((FIX.DOC.find((l) => l.key === g.keys[0]) || {}).x || '')],
      threshold: 0.74, judges: 6, judgedByMe: i === 0,
    }));
    FIX.CLOSED = { undecided: und, items: und.map((o, i) => {
      const best = o.field.slice().sort((x, y) => y.p - x.p)[0];
      return { id: 'rec:' + o.raceId, kind: 'quick', keys: ['U:' + o.raceId], state: 'sealed',
        qLabel: 'Backlog', urgency: 0, pct: 100, cap: 'undecided at the close — the text stood',
        decided: { outcome: 'undecided', when: whenOf(o.when), p: best.p, bar: o.threshold, judges: o.judges },
        undecided: true, won: 'b', optionB: best.hunks[0].lines[0], replaced: o.displaced[0],
        rationale: best.rationale, verdict: o.judgedByMe ? 'you judged this' : undefined, unread: false,
        slate: o.field.map((f) => ({ text: f.hunks[0].lines[0], rationale: f.rationale, p: f.p, won: f === best })) };
    }) };
    // the two picked races leave the live set: they are filed now
    const gone = new Set(pick.map((g) => g.id));
    FIX.SUGGS = FIX.SUGGS.filter((g) => !gone.has(g.id));
    const who = S.roster.filter((r) => !r.founder && r.mid);
    // the second signer never gave a name: their signature is the disc
    try { if (who[1]) cs.setIdentity(now(), who[1].mid, { name: null }); } catch (e) {}
    S.roster.forEach((r) => { if (r.mid === (who[1] || {}).mid) r.n = ''; });
    try { cs.close(now()); } catch (e) { console.warn('[fixture close]', e && e.message); }
    try { if (who[0]) cs.acknowledgeClose(now(), who[0].mid, 'I still think the garden clause goes too far — but it was fairly decided.'); } catch (e) {}
    try { if (who[1]) cs.acknowledgeClose(now(), who[1].mid, ''); } catch (e) {}
  }
  // the fixture's DOC as the text the document would store
  const fixtureText = (DOC) => DOC.filter((l) => l.t !== 'title')
    .map((l) => (l.t === 'h' ? '#'.repeat(l.level || 1) + ' ' : '') + l.x).join('\n');
  // **B2b's seam**: the live wiring lands here — items() derives SUGGS from
  // the view, and each hook posts the command. Null means the fixture's own
  // behaviour (session.js's default path).
  const LIVE_HOOKS = { items: null, judge: null, propose: null, withdraw: null,
    seen: null, chill: null, textChanged: null };
  const hookProxy = Object.fromEntries(['judge', 'propose', 'withdraw', 'seen', 'chill', 'textChanged']
    .map((n) => [n, (...a) => (LIVE_HOOKS[n] ? LIVE_HOOKS[n](...a) : undefined)]));
  // ---- the live wiring (B2b): the view in, the commands out ---------------
  // Everything session.js renders about the charter is derived here from the
  // server's blind projection — `clauses` (the text races), `mine`, `records`,
  // the served `raceCards` and the `wallet` — as items in the fixture's own
  // shape, so the cards, the rail and the wires need no second grammar. What
  // is NOT in the view is not invented: no fill on a live race (Q501), no
  // drip clock, no judge counts.
  const lineIdx = (key) => +String(key).slice(1);
  const unhead = (l) => String(l).replace(/^#{1,3}\s+/, '');
  const headOf = (o) => (o && o.t === 'h' ? '#'.repeat(o.level || 1) + ' ' : '');
  // the keys of a span, the ones the charter actually shows first (a blank
  // line is a line the engine counts and nothing the page anchors to)
  const keysOfSpan = (sp, lines) => {
    const out = [];
    for (let i = sp.start; i < sp.end; i++) if ((lines[i] || '').trim()) out.push('L' + i);
    if (!out.length) out.push('L' + Math.min(sp.start, Math.max(0, lines.length - 1)));
    return out;
  };
  // a candidate's reading of a span: the current lines with its hunks applied
  const applyIn = (lines, sp, hunks) => {
    const region = lines.slice(sp.start, sp.end);
    for (const h of (hunks || []).slice().sort((a, b) => b.start - a.start)) {
      region.splice(h.start - sp.start, h.end - h.start, ...h.lines);
    }
    return region.filter((l) => l.trim()).map(unhead).join('\n');
  };
  const spanOf = (hunks) => ({ start: Math.min(...hunks.map((h) => h.start)),
    end: Math.max(...hunks.map((h) => h.end)) });
  const plain = (lines, sp) => lines.slice(sp.start, sp.end).filter((l) => l.trim()).map(unhead).join('\n');
  // the mark the quick card shows: cards.js's own diff, del and ins both
  // (resultOnly drops the dels where the card states the result)
  const markedOf = (before, after) => window.CARDS.diffPieces(before, after, true)
    .map(([t, mk]) => (mk ? window.CARDS.markHtml2(t, mk) : esc(t))).join('');
  const labelFor = (key) => {
    let h = '';
    for (const l of SESSION.DOC) { if (l.t === 'h') h = l.x; if (l.key === key) break; }
    return h || ((SESSION.DOC.find((l) => l.key === key) || {}).x || '').split(/\s+/).slice(0, 5).join(' ');
  };
  // **Raw values are not copy**: a record's moment reads like a diary entry
  const whenOf = (ms) => {
    const d = new Date(ms), today = new Date();
    const hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const same = (a, b) => a.toDateString() === b.toDateString();
    const y = new Date(today); y.setDate(today.getDate() - 1);
    return (same(d, today) ? 'today' : same(d, y) ? 'yesterday'
      : d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' })) + ', ' + hm;
  };
  // read state survives a reload: one key per document and seat
  const seenKey = () => 'draft:seen:' + LIVESLUG + ':' + ((cs && cs.v && cs.v.me) || '');
  const loadSeen = () => { try { return JSON.parse(localStorage.getItem(seenKey()) || '[]'); } catch (e) { return []; } };
  const saveSeen = () => { try { localStorage.setItem(seenKey(), JSON.stringify([...SESSION.readSeals])); } catch (e) { /* private mode */ } };
  // a proposal keeps the id the card opened under until the view knows it
  const localIdOf = new Map();      // candidate id → the id the draft was proposed as
  const proposedAs = new Map();     // the draft's local id → candidate id, once known
  const DRAFT_ID = 'draft-yours';

  function itemsFromView(v) {
    const lines = String(v.text || '').split(/\n/);
    // the Text's shield (Q440): a carried change waits on the Founder's OK —
    // the cards say so while it is held (this binding was lost in the glyph
    // batch's stash detour; every live race threw on it)
    let textAssent = false;
    try { textAssent = !!pwPair('text').a; } catch (e) { textAssent = false; }
    const cards = v.raceCards || [];
    const sideOf = (rc, ids) => (ids.has(rc.a.id) ? 'a' : ids.has(rc.b.id) ? 'b' : null);
    const items = [];
    for (const r of v.clauses || []) {
      const ids = new Set(r.candidates.map((c) => c.id).concat([r.incumbentId]));
      const at = cards.findIndex((rc) => rc.kind === 'edge' && sideOf(rc, ids));
      const rc = at >= 0 ? cards[at] : null;
      // the contested footprint is a list of spans; the page anchors the race
      // at their union (one clause run)
      const csp = spanOf(r.contested && r.contested.length ? r.contested : r.candidates.flatMap((c) => c.hunks));
      const keys = keysOfSpan(csp, lines);
      const inc = plain(lines, csp);
      const textOf = (c) => applyIn(lines, csp, c.hunks);
      const byId = (id) => r.candidates.find((c) => c.id === id);
      const base = {
        id: r.id, keys, state: r.judged ? 'deciding' : 'needs',
        qLabel: labelFor(keys[0]),
        // urgency is the router's own (SPEC §8.1): the served card's value
        // over the best in this feed; the fill is the race's closeness to
        // resolution — a magnitude the engine cannot be made to sign (Q501)
        urgency: rc && rc.urgency != null ? rc.urgency : 0.3,
        pct: Math.round((r.closeness || 0) * 100),
        judges: r.judges || 0, floor: r.floor,
        cap: r.judged ? 'you have judged this — it is still running' : 'wants your judgment',
        shifted: !!r.shifted, deadlocked: !!r.deadlocked,
        crownWaits: textAssent,
        // the served pair, for the judgment that goes back
        card: rc ? { a: rc.a.id, b: rc.b.id, inc: rc.a.incumbent ? 'a' : rc.b.incumbent ? 'b' : null } : null,
      };
      // a race holding only my own proposal is mine to withdraw, not to judge
      // — the `mine` item carries it (the author's preference is derived, never asked)
      if (r.candidates.every((c) => c.mine)) continue;
      const others = r.candidates.filter((c) => !c.mine);
      const slate = r.deadlocked
        ? { slate: r.candidates.map((x) => ({ text: textOf(x), rationale: x.rationale })) } : {};
      if (r.candidates.length === 1 || (rc && (rc.a.incumbent || rc.b.incumbent))) {
        // one challenger against what stands: the quick card
        const c = (rc ? byId(rc.a.incumbent ? rc.b.id : rc.a.id) : null) || r.candidates[0];
        items.push({ ...base, kind: 'quick', marked: markedOf(inc, textOf(c)),
          rationale: c.rationale, candId: c.id, ...slate });
      } else {
        const a = (rc ? byId(rc.a.id) : null) || others[0] || r.candidates[0];
        const b = (rc ? byId(rc.b.id) : null) || others[1] || r.candidates[1];
        items.push({ ...base, kind: 'race',
          race: { a: { id: a.id, text: textOf(a), rationale: a.rationale },
                  b: { id: b.id, text: textOf(b), rationale: b.rationale } }, ...slate });
      }
    }
    for (const m of v.mine || []) {
      if (m.state !== 'live') continue;
      const sp = spanOf(m.patch.hunks);
      const keys = keysOfSpan(sp, lines);
      const sites = m.patch.hunks.map((h) => {
        const ks = keysOfSpan(h, lines);
        return { keys: ks, label: labelFor(ks[0]), text: h.lines.map(unhead).join('\n'),
          origin: ks.map((k) => { const l = SESSION.DOC.find((x) => x.key === k) || {};
            return { key: k, text: l.x || '', note: null, t: l.t, level: l.level }; }) };
      });
      items.push({ id: localIdOf.get(m.id) || ('mine:' + m.id), kind: 'draft', mine: true, keys,
        state: 'needs', qLabel: sites[0].label, urgency: 0, pct: 0,
        cap: 'yours · in the race', rationale: m.rationale, sites, candidate: m.id });
    }
    // one record per race (Q503c): the whole field, the text it displaced
    // as it stood, and how many weighed in
    const unsealed = new Map();
    if (v.record) for (const o of (v.record.adopted || []).concat(v.record.undecided || [])) {
      for (const f of o.field || []) if (f.author && f.author.name) unsealed.set(f.id || f.candidateId, f.author.name);
    }
    for (const o of v.records || []) {
      const field = o.field || [];
      const hs = field.flatMap((f) => f.hunks);
      const sp = hs.length ? spanOf(hs) : spanOf(o.footprint || o.hunks || []);
      const adopted = o.outcome === 'adopted';
      // undecided at the close (§4.6): the race files at its backlog
      // paragraph — its best wording IS the paragraph — under the PAUSE mark,
      // never pinned (the 🥂 card is the acknowledgment the close asks for)
      const undecided = o.outcome === 'undecided';
      const keys = undecided ? ['U:' + (o.raceId || o.candidateId)] : keysOfSpan(sp, lines);
      const textOfF = (f) => f.hunks.flatMap((h) => h.lines).map(unhead).join('\n');
      // the seal lifts at the record (§3.5a): `records` stays sealed, the
      // closed `record` carries the names where the anonymity ladder allows
      const byName = (f) => (f.author && f.author.name) || unsealed.get(f.id || f.candidateId) || null;
      const best = field.slice().sort((x, y) => (y.p ?? -1) - (x.p ?? -1))[0];
      const winner = field.find((f) => f.outcome === 'adopted') || (undecided ? best : null) || field[0] || {};
      const replaced = (o.displaced || []).filter((l) => l.trim()).map(unhead).join('\n') || undefined;
      const slate = field.length > 1
        ? { slate: field.map((f) => ({ text: textOfF(f), rationale: f.rationale, by: byName(f),
            p: f.p == null ? undefined : f.p, won: f === winner && (adopted || undecided) })) } : {};
      items.push({ id: 'rec:' + (o.raceId || o.candidateId), kind: 'quick', keys, state: 'sealed',
        qLabel: labelFor(keys[0]), urgency: 0, pct: 100,
        cap: adopted ? 'decided — adopted' : undecided ? 'undecided at the close — the text stood' : 'decided — the current text stood',
        decided: { outcome: adopted ? 'adopted' : undecided ? 'undecided' : 'retired — the current text stood',
          when: whenOf(o.when), p: o.p == null && best ? best.p : o.p, bar: o.threshold, judges: o.judges },
        undecided,
        won: adopted || undecided ? 'b' : undefined,
        optionB: textOfF(winner), replaced,
        rationale: winner.rationale, by: byName(winner),
        verdict: o.judgedByMe ? 'you judged this' : undefined,
        unread: !undecided, ...slate });
    }
    // the draft being typed is the page's own, never the view's — it survives
    // every rebind
    const d = SESSION.SUGGS.find((x) => x.id === DRAFT_ID);
    if (d) items.push(d);
    return items;
  }

  const liveItem = (id) => SESSION.SUGGS.find((x) => x.id === id);
  function wireLive() {
    for (const id of loadSeen()) SESSION.readSeals.add(id);
    LIVE_HOOKS.items = () => itemsFromView(cs.v);
    LIVE_HOOKS.seen = () => saveSeen();
    LIVE_HOOKS.judge = (id, what) => {
      const s = liveItem(id);
      if (!s || !s.card) { console.warn('[live] no card served for', id); return; }
      const c = s.card;
      const challenger = c.inc === 'a' ? 'b' : 'a';
      const outcome = what === 'indifferent' ? 'tie'
        : what === 'keep' ? (c.inc || 'tie')
        : what === 'approve' ? challenger
        : what === 'a' ? 'a' : what === 'b' ? 'b' : 'tie';
      api.cmd('judge-race', { a: c.a, b: c.b, outcome });
    };
    LIVE_HOOKS.propose = (d) => {
      const hunks = d.sites.map((site) => {
        const ls = site.text.split('\n');
        return { start: lineIdx(site.keys[0]), end: lineIdx(site.keys[site.keys.length - 1]) + 1,
          lines: ls.map((ln, i) => headOf(site.origin[i]) + ln) };
      });
      const local = d.id;
      api.cmd('propose-text', { baseVersion: cs.v.textVersion, hunks, why: d.rationale || '' })
        .then((res) => {
          if (res && res.ok && res.result && res.result.id) {
            localIdOf.set(res.result.id, local); proposedAs.set(local, res.result.id);
            SESSION.setData({ SUGGS: itemsFromView(cs.v) });
            return;
          }
          // refused: the draft comes back unproposed, the pencil with it
          const stale = /targets version/.test((res && res.error) || '');
          const back = liveItem(local) || d;
          back.id = DRAFT_ID; back.unproposed = true;
          back.refusal = stale
            ? 'The text moved while you were writing — your draft is kept; read the new wording and propose again.'
            : 'That could not be proposed: ' + ((res && res.error) || 'the server did not answer') + '.';
          if (!SESSION.SUGGS.includes(back)) SESSION.SUGGS.push(back);
          syncWallet();
          SESSION.setData({ SUGGS: itemsFromView(cs.v) });
          // the card was open under the id it was proposed as; it opens again
          // as the draft, with the refusal on it
          if (SESSION.openId === local) SESSION.toggle(DRAFT_ID, false);
        });
    };
    LIVE_HOOKS.withdraw = (id) => {
      // called after session.js has already dropped the item, so the
      // candidate is read off the id: the view's own ('mine:<id>') or the one
      // this page proposed it as
      const s = liveItem(id) || { candidate: proposedAs.get(id) || (String(id).startsWith('mine:') ? id.slice(5) : null) };
      if (!s.candidate) return;
      api.cmd('withdraw-text', { candidate: s.candidate });
    };
  }
  // ---- the wallet family (Q444–448, 453, 458, 461; 2026-08-21) -----------
  // 🪶 top left: four feathers at the birth, one spent per founding act
  // (title, link, the mail), the fourth permanent and the logo. ✏️ ✒️ 🛡️ 🏛️
  // on the right, every socket shown to everybody from the start (Q532) and
  // struck until its grant is acknowledged — a power you were never asked
  // for arrives by a task, never by itself. A clerk holds nothing but 🪶
  // (Q458: a clerk's only power is to found something else), so their
  // other four sockets stay struck.
  let quillGhost = false, penGhost = false, shieldGhost = false, voiceGhost = false, stormHolding = false;
  let pendingGrant = null;
  const heldMotion = () => {
    if (!cs) return false;
    if (cs.isRemote) return !!(cs.v && cs.v.view && cs.v.view.myHeldMotion);
    const me2 = viewerId();
    return [...cs.motionRecords().values()].some((m) => m.by === me2 && m.status === 'running');
  };
  function renderPowerWallets() {
    const q = document.getElementById('quill');
    const spent = cs ? 3 : (S.seen.has('title') ? 1 : 0) + (S.seen.has('slug') ? 1 : 0) + (S.emailSent ? 1 : 0);
    const left = 4 - Math.min(3, spent);
    const qh = Array.from({ length: left }, (_, i) =>
      '<i' + (quillGhost && i === left - 1 ? ' class="gone"' : '') + '>🪶</i>').join('');
    if (q.innerHTML !== qh) q.innerHTML = qh;
    const notApp = S.viewer !== 'applicant' && !isStranger() &&
      // after the farewell the wallets are gone (a reader arriving after the
      // close, or one who has signed, never sees them)
      !(cs && cs.closed && (farewellDone || signedClose() || !viewerIsMember()));
    const pen = document.getElementById('penwallet');
    const showPen = notApp && mayPen();
    // **✒️∞ — the pen wallet says how many, and the answer is not one** (Ed,
    // 2026-08-22). A single ✒️ standing where a row of ✏️s stands reads as a
    // quantity of one, which is exactly the scarcity a pen does not have: it is
    // perpetual and never spent, and a founder who thinks they are about to use
    // theirs up will not use it. The ∞ goes in the **count slot** rather than
    // beside the pen as a second token, because that is what this row already
    // means by the position — `✏️✏️✏️+5` is the same sentence with a number in
    // it — and because a token is a thing that can fly and a count is not.
    // `.pmore` therefore, never an `<i>`: `holdWallet` and the flight both find
    // their pen with `#penwallet i`, and a second `<i>` would be picked up as
    // the last one drawn and flown to the button instead.
    //
    // **The text infinity, not the emoji ♾️** (Ed, 2026-08-22). `.pmore` is
    // `font-weight: 700; color: var(--fg)`, and a text character takes both —
    // so ∞ is the same object as `+5`, set in the same ink at the same weight,
    // which is the whole of what makes it read as a count. The emoji renders as
    // a coloured picture with its own design in every font and would have stood
    // beside the pen as a second *glyph*, which is the one thing this must not
    // say. It also cannot be anybody's face, being no kind of pictograph, so
    // the reserved-emoji lists do not move.
    // wrapped in `.pencils` like the ✏️ row, so the glyph and its count are one
    // object at the same 1px gap rather than two children of the wallet's own
    // 6px one — the pen and its ∞ are a single statement, not two things
    const penh = '<span class="pencils"><i' + (penGhost ? ' class="gone"' : '') + '>✒️</i>' +
      // in flight the whole wallet goes quiet: a lone ∞ counts nothing
      '<span class="pmore' + (penGhost ? ' gone' : '') + '">∞</span></span>';
    // **The socket is always there; the slash says whether the tool is yours**
    // (Q532, Ed 2026-08-22: *give all of the wallets to all users at the
    // beginning, and explicitly show that empty ones are empty; the topbar is a
    // toolbar, and tools are added and taken away depending on what's
    // happening*). A wallet you did not hold used to be an empty element that
    // `:empty` hid, so the ladder of powers was visible only to somebody who
    // already held all of it. Now every socket renders its own tool and a
    // reader can see what their role can do — *nothing* included.
    //
    // `notApp` survives for one case only: **the closed page**, where the
    // farewell has flown the tools out and the page is deliberately grey and
    // filed. Arguably Ed's rule reaches there too — the tools were taken away,
    // which is exactly what a row of empty sockets would say — but that is a
    // change to a finished ceremony rather than to a live toolbar, so it is
    // held as the residual on Q532 rather than made here.
    const gone = cs && cs.closed && (farewellDone || signedClose() || !viewerIsMember());
    const socket = (el, held, inner, glyph) => {
      const h = gone ? '' : (held ? inner : '<i>' + glyph + '</i>');
      // the idempotent write the quill has always had, extended to the rest
      // (Q531): these strings almost never change, and rewriting identical
      // markup every render destroys any animation running on the token —
      // which is why `.navbar .quill i`'s own 240ms transition could never run
      // here, and what the spend-preview would have stuttered against.
      if (el.innerHTML !== h) el.innerHTML = h;
      el.classList.toggle('notheld', !gone && !held);
      el.classList.toggle('gonewallet', !!gone);
    };
    socket(pen, showPen, penh, '✒️');
    // 🛡️ joins the toolbar (Q532(3)). It is the pen's other half and behaves
    // like it in every way that shows: one shield, many locks, never spent —
    // so it takes the ∞ too. What it does is the opposite of the pen: the pen
    // writes, the shield only refuses.
    const shield = document.getElementById('shieldwallet');
    const showShield = notApp && mayShield();
    socket(shield, showShield,
      '<span class="pencils"><i>🛡️</i><span class="pmore">∞</span></span>', '🛡️');
    const voice = document.getElementById('voicewallet');
    const out = heldMotion();
    const showVoice = notApp && mayVoice();
    socket(voice, showVoice, '<i' + (out || voiceGhost ? ' class="gone"' : '') + '>🏛️</i>', '🏛️');
    // one sentence per socket, from one table, in both channels: the tooltip a
    // pointer gets and the bubble a press gets say exactly the same thing
    [q, pen, shield, voice].forEach((el) => { if (el) el.title = SAY(el).t; });
    // the ✏️ socket is rendered by session.js, which rewrites its own title on
    // every drip tick — so its sentence goes in through the seam rather than
    // being set here and overwritten a second later
    const pwEl = document.getElementById('wallet');
    if (pwEl) SESSION.setWalletTitle(SAY(pwEl).t);
    // the spend-preview is render state like the ghosts above it, so every
    // wallet render has to hand it back to whichever token now stands in the
    // slot — see `applyLean` in session.js for why it cannot be a CSS rule
    SESSION.applyLean();
    if (sayFor && sayFor.isConnected) showSay(sayFor);
  }

  // ---- the socket's speech bubble (Q532, Ed 2026-08-22) --------------------
  // *If you click on the wallet, we can have a speech bubble that explains what
  // it means.* The wallets already carried that sentence in a `title`, which is
  // a tooltip: it wants a pointer that hovers, it cannot be read on a touch
  // screen, and it is the browser's furniture rather than this surface's. The
  // bubble reads the socket's own `title`, so there is **one** piece of copy per
  // tool feeding both channels — two would drift, and the not-held sentence is
  // the one that most needs to be readable, since it is the answer to *why is
  // this one crossed out*.
  // **What a socket says: the symbol, then the verb** (Ed, 2026-08-22: *don't
  // name the item — just have the symbol, larger than in the wallet, and then
  // explain what it is using the verb; keep the language as clear and
  // functional as possible, using verbs and nouns that relate to concrete
  // things on the page*). So no *"The shield."* opening — naming a thing is not
  // explaining it, and the glyph has already said which one this is. Each
  // sentence starts with **who can do what**, and every noun in it is something
  // the reader can point at: the document, the settings, a ✒️ tab, the
  // membership, an address.
  //
  // Held and not-held are different sentences, and the difference is the
  // subject. Holding it, the sentence is about **you** and says what it costs
  // and what comes back. Not holding it, the sentence names **who can** — which
  // answers the question a struck-through tool actually raises, and does it
  // without a word of apology.
  //
  // One table, both channels: the bubble draws it, and the tooltip is the same
  // sentence, so the two can never drift.
  const SAY = (el) => {
    const k = el.id;
    if (k === 'quill') {
      const spent = cs ? 3 : (S.seen.has('title') ? 1 : 0) + (S.seen.has('slug') ? 1 : 0) + (S.emailSent ? 1 : 0);
      const left = 4 - Math.min(3, spent) - 1;
      return { g: '🪶', t: left > 0
        ? 'You can name this document, choose its address and verify your email. Each one spends a feather. The last feather stays, and starts a new document.'
        : 'You can start a new document.' };
    }
    if (k === 'wallet') {
      return { g: '✏️', t: (charterOn() && mayPropose())
        ? 'You can propose changes to the text. A ✏️ comes back if the membership passes yours, and more arrive as the document runs.'
        : 'Members can propose changes to the text, once the document has begun.' };
    }
    if (k === 'penwallet') {
      return { g: '✒️', t: mayPen()
        ? 'You can change ' + penLocks() + (penLocks() === 1 ? ' setting' : ' settings') + ' yourself, without asking anybody. Each setting’s ✒️ tab says whether you can.'
        : 'The Founder can change some settings without asking anybody, where they have kept the pen.' };
    }
    if (k === 'shieldwallet') {
      return { g: '🛡️', t: mayShield()
        ? 'You can refuse a change the membership passes on ' + shieldLocks() + (shieldLocks() === 1 ? ' setting' : ' settings') + '. Nothing changes there until you accept it.'
        : 'The Founder can refuse a change the membership passes, where they have kept the shield.' };
    }
    if (k === 'voicewallet') {
      return { g: '🏛️', t: !mayVoice()
        ? 'Members can ask everybody to agree to a change.'
        : heldMotion()

  // become a removal or an omitted element. `holdWallet` tests for the token's
  // *existence*, and the guard that swallows the trailing click of a hold is
  // `isPenCommit(held) && ...`; if the token left the DOM during the return
  // flight, that guard would stop firing and an early release would commit the
  // act with no hold at all.
  const penRelease = () => {
    if (!penHold) return;
    const { b, w, flight } = penHold;
    clearTimeout(penHold.timer);
    penHold = null;
    b.classList.remove('penholding');
    penNudge = SESSION.nudgeHome(flight, { floorAt: w.floorAt || 250, onDone: () => {
      penNudge = null;
      penGhost = false; quillGhost = false;
      if (w.ghost === 'wallet') SESSION.setWalletGhost(false);
      renderPowerWallets();
      // the token is back in the wallet, so it may start straining again —
      // but only if the pointer never left the button that was asking
      SESSION.resumeLean(b);
    } });
  };
  document.addEventListener('pointerup', penRelease);
  document.addEventListener('pointercancel', penRelease);
  // a grant's OK survives a reload: one key per document and seat, like readSeals
  const grantsKey = () => 'draft:grants:' + LIVESLUG + ':' + ((cs && cs.v && cs.v.me) || '');
  const loadGrants = () => { try { return JSON.parse(localStorage.getItem(grantsKey()) || '[]'); } catch (e) { return []; } };
  const saveGrants = () => { if (!LIVEMODE) return;
    try { localStorage.setItem(grantsKey(), JSON.stringify([...S.okd].filter((k) => ACK_KEYS.includes(k)))); } catch (e) { /* private mode */ } };
  // what the wallet holds, from the view — the rules from the rate setting
  function syncWallet() {
    if (!LIVEMODE || !cs || !cs.v) return;
    const rs = csState('rate');
    const rv = (rs && rs.value) || {};
    // the engine's balance accrues by the minute, so it is fractional: the
    // whole part is what you can spend, the fraction how far the next has got
    const bal = cs.v.wallet == null ? 0 : cs.v.wallet;
    // the clock rides the view (Q503a): how long until the next ✏️ lands and
    // the interval it runs on, so the tray says *when* from the server's own
    // numbers and nothing when the document does not drip
    const wi = cs.v.walletInfo || {};
    const drips = wi.dripIntervalMs != null && wi.nextDripInMs != null;
    const frac = drips ? Math.max(0, Math.min(1, 1 - wi.nextDripInMs / wi.dripIntervalMs)) : (bal - Math.floor(bal));
    SESSION.setWallet({ held: Math.floor(bal), toNext: frac,
      dripSeconds: drips ? wi.dripIntervalMs / 1000 : null,
      rules: { grant: rv.grant ?? 4, cap: wi.cap ?? rv.cap ?? 8, stake: 1 } });
    SESSION.setRoom({ E: cs.E(), floor: cs.v.floor });
  }
  const extra = {
    entries: () => railEntries,
    isOpen: (id) => S.open === id,
    openId: () => S.open,
    closeOthers: () => { if (S.open) closeThen(() => { S.open = null; }); },
    tocLead,
    afterToc: () => { if (!charterOn()) applyProseFolds(); },
  };
  const sessionEnv = (fix) => ({
    DOC: [], SUGGS: [],
    // live: the wallet has no clock in the view (the drip tray says nothing),
    // and the pulse beats from the poll rather than a timer
    ...(LIVEMODE ? { SESSION_MINUTES: Infinity, editsHeld: 0, editsToNext: 0, fixturePulse: false } : {}),
    ...(fix ? { ROSTER: fix.ROSTER, FLOOR: fix.FLOOR, EDIT_RULES: fix.EDIT_RULES,
      SESSION_MINUTES: fix.SESSION_MINUTES, editsHeld: fix.editsHeld, editsToNext: fix.editsToNext } : {}),
    mounts: { doc: document.getElementById('charter'), queue: rail,
      toc: document.getElementById('toc'), wires: document.getElementById('wires'),
      wallet: document.getElementById('wallet'), pulse: document.getElementById('pulse') },
    // the two capabilities the charter half needs to know about: read at
    // call time, so pressing OK on a grant takes effect on the next render
    // with no remount (**a power is not held until it is acknowledged**)
    mayPropose: () => mayPropose(),
    mayJudge: () => mayJudge(),
    extra, hooks: hookProxy,
  });
  const FIXTURE = new URLSearchParams(location.search).get('fixture');
  const boot = () => {
    if (LIVEMODE) { liveBoot(); return; }
    // nothing opens itself, arrival included (Ed, 2026-08-20, reversing
    // the same morning's auto-open): the surface teaches by being clicked,
    // and the title task standing alone in the rail IS the first question
    if (BIRTH) birthBoot();
    relabel(); render();
  };
  if (FIXTURE === 'session' && !LIVEMODE && !BIRTH) {
    // ?fixture=session — the Hollow Oak session: the founding settled by ⏩,
    // the constitution folded, and the fixture's charter with its 42 items.
    // The fixture file is loaded only here, so the served page never carries it.
    const sc = document.createElement('script');
    sc.src = 'fixture-session.js';
    sc.onload = () => {
      FIX = window.FIXTURE_SESSION;
      SESSION.init(sessionEnv(FIX));
      setProse(fixtureText(FIX.DOC));
      // the fixture's clock: the Hollow Oak session has 2h 11m left (its old
      // hard-coded stat), which the ladder renders at the 20-minute step
      const left = new Date(Date.now() + 131 * 60_000);
      const p2 = (n) => String(n).padStart(2, '0');
      S.endsAt = left.getFullYear() + '-' + p2(left.getMonth() + 1) + '-' + p2(left.getDate()) + 'T' + p2(left.getHours()) + ':' + p2(left.getMinutes());
      devFastForward();
      S.folded.add('cs-constitution');
      if (!new URLSearchParams(location.search).get('band')) document.getElementById('doc').classList.add('fixsession');
      // ?fixture=session&closed=1 — the Hollow Oak session, closed (Q470):
      // two races left undecided, two signatures (one anonymous), the
      // founder's seat still to sign — for looking at, not probed
      if (new URLSearchParams(location.search).get('closed')) closeFixture();
      S.open = null; lastOpen = null; birthsMuted = true;
      render();
    };
    document.head.appendChild(sc);
  } else {
    SESSION.init(sessionEnv(null));
    boot();
  }
})();
</script>
