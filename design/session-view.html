/* ============================================================================
   document-creation — **the document, from its first minute.**

   Five notes built this, in order, and each one made the screen less of a form:

   1. *Something that looks like the document itself; the admin pastes the text
      into the space where it will later be edited, the ToC appears on cue, they
      click the placeholder title in the topbar, and the sidebar holds cards with
      each of the questions they need to decide.*
   2. *Can we import as much of the session-view as we can? I think ultimately
      this will literally be the session view.*
   3. *You can start inviting people immediately after creating the document …
      and as soon as you've confirmed the starting text they can start making
      proposals … and judgements unlock as soon as everyone is ready.*
   4. *Ceremony and admin cards are absolutely just queue-cards. Instead of
      modals they open cards in the document at the top, above the text, pushing
      it down like decision-cards do a clause. They have cables and tabs.*
   5. *I'd like all of these tabs to act like clause-tabs and pile like clause
      tabs. The founder's settings sit in one pile, and members' in the
      pile below. … Go through every decision each role needs to make and turn it
      into a queue-card. Break them down as much as you can.*

   The third changed the model — there is no moment when the document "opens".
   The fourth retired the modal. The fifth retired the last two inventions on the
   screen: the flat tab group, which is now two `chip-gutter` piles like
   everything else, and the compound card, which was a form in card's clothing.
   **One decision, one card**, and the test is whether somebody could answer it
   differently and on its own: a picture and a name are two questions, and so are
   a membership and whether the founder is in it. What is *not* split is a
   parameter and its own value — *rising, 55% → 78%* is one thought, and cutting
   it in half would be splitting a sentence rather than a decision. The same test
   cuts the other way twice, on 2026-08-18: *when it ends* swallowed *whether it
   ends*, because **never** is one of the answers to *when*; and the stake stopped
   being a card at all, because it is a flat 1 in the mechanism and a card for it
   was offering a decision nobody has. Then ✒️ split the other way on Ed’s Q341 rethink — the close bar is consent where the ramp is pacing, two kinds — so seventeen became eighteen — and 💤 *Do memberships lapse?* (Ed, closing Q345) made it nineteen.

   What is left in this file is its own fixture and the bodies of the cards a
   founder fills in. The piles, the strip, the cable, the rail entry, the card
   shell, the read-only and watching bodies and the identity cards are in
   `setup.js`, because the founding ceremony is this same screen seen by
   somebody else.
   ========================================================================== */

  /* **The title is not edited in the topbar** (Ed, 2026-08-18). It had been a
     contenteditable in the bar, which is the one place on this screen that is
     not a card — so the title was the single setting with no card behind it, no
     confirm, and no way back to it except clicking the words. The bar shows the
     title; the 🏷️ card is where you write it, in the same `.lanebox` the
     `editing-card` writes a clause in. */
  .navbar .brand .ph { color: var(--muted); font-weight: 400; }
  /* dev chrome, deliberately off the design system: dashed, monospace, and
     since Ed 2026-08-19 **bottom-left** — a stagehand stands in the wings,
     and the top-left corner is where the document's own first clause begins */
  /* the alpha flag (Ed, 2026-08-20): docs.vote is a real address people
     are being invited to, and a document drafted in an alpha is a
     document whose room deserves to know. Bottom-left, quiet, and out of
     the way of everything: it asks nothing of you, so by the palette's
     own rule it takes no hot colour and no glyph — a permanent banner
     that shouted would fight every card on the surface for the whole
     session. pointer-events: none, because it stands over the document's
     own margin and must never eat a click meant for the text. */
  /* once the document begins the founder's editor gives way to the charter
     column session.js renders (#charter); both are in the markup, one shows.
     It used to give way at 📄's OK; the OK is an acknowledgement that the
     column will become the text, not the act of setting it, so the column
     stays until 🍾 (Q819) — which is also the moment the text stops being
     anybody's to type and starts changing by proposal. */
  .doc.begun #prose, .doc.begun #prosefolds { display: none; }
  /* ?fixture=session runs the Hollow Oak charter with the constitution out of
     the way, so its geometry is the frozen session-view's to the pixel (the
     session-probe's gate); add &band=1 to see the whole composition */
  .doc.fixsession .titlerow, .doc.fixsession #band { display: none; }
  /* the stranger's door (Q455/456): the holding sentence is the one line that
     changes — who decided, what they decided, what you may do about it — and
     the charter stands as bars at real metrics: grey, because grey means
     nothing is being asked of you; ?bars=black is the experiment Ed asked to
     look at */
  /* both stand on the prose's own column (.doc .prose: 70ch, centred).
     Keyed on the **id**, never the class: `holding` is the propose hold's own
     class (session.js's flyStart), and this rule on a class matched the ✏️
     button too — `margin: auto` on a flex item in the commit row slid it to
     the middle of the row for the length of a hold (entry 59) */
  .doc #holding { font-size: var(--t-body); color: var(--muted); margin: var(--s4) auto var(--s5); max-width: 70ch; font-style: italic; }
  .redacted { padding-bottom: var(--s5); max-width: 70ch; margin: 0 auto; }
  .redacted .rblock { margin: 0 0 1em; }
  .redacted .rblock.h1 { margin: 1.6em 0 .6em; } .redacted .rblock.h2 { margin: 1.4em 0 .5em; } .redacted .rblock.h3 { margin: 1.2em 0 .4em; }
  .redacted .bar { display: block; height: .72em; border-radius: 3px; background: var(--border); margin: .42em 0; }
  .redacted .h1 .bar { height: 1.1em; } .redacted .h2 .bar { height: .95em; } .redacted .h3 .bar { height: .85em; }
  .redacted.black .bar { background: var(--fg); }
  .alphaflag { position: fixed; bottom: 10px; left: 10px; z-index: 55;
    font-size: var(--t-small); color: var(--muted); background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    padding: 3px 8px; pointer-events: none; }
  .alphaflag b { font-weight: 600; color: var(--fg); }
  /* the stagehand stands above the flag rather than on it */
  .devswitch { position: fixed; bottom: 47px; left: 10px; z-index: 60;
    font: 11px/1.4 ui-monospace, Consolas, monospace; color: var(--muted);
    background: var(--bg); border: 1px dashed var(--border); border-radius: 6px;
    padding: 4px 8px; opacity: 0.85; }
  .devswitch select { font: inherit; color: var(--fg); border: none; background: transparent; }
  .devswitch button { font: inherit; color: var(--muted); background: transparent;
    border: 1px dashed var(--border); border-radius: 4px; cursor: pointer; padding: 1px 6px; }

  /* **The column invites you before it asks you** (Q513(c), Ed 2026-08-21).
     The column the text will be written in exists from the save, and a
     founder who came here to write should not have to answer eighteen
     questions before they may. From the save the empty column says so, in
     grey, asking nothing, until 🍾 — keyed on the column being empty and the
     founder's (`writeready`), never on a task's turn: since backlog 204 the
     text is no task at all, 📄's OK is gone and 📝 is the door in. **Q518
     lands here** (Ed, 2026-08-29: pre-fill as a grey placeholder — not
     document text, gone at the first keystroke); whoever builds it replaces
     this sentence with the placeholder text and keeps the key. */
  .prose.empty.writeready::before {
    content: "Start writing whenever you like — press 📝, or just begin typing.\A\A Markdown headings become its sections, and the contents appear beside you as you go.";
    white-space: pre-wrap; color: var(--muted); font-size: var(--t-body); line-height: 1.6;
  }


  /* the controls the share box took with it, now on the 📍 and 🪪 cards */
  .setupcard textarea { width: 100%; font-size: var(--t-ui); padding: var(--s2);
    resize: vertical; min-height: 60px; }
  /* **The shape of a labelled card button here; its ground belongs to what
     the button IS.** This used to set the ground too, which tied with
     system.css's `.btn.btn-approve` and won on order — leaving white on
     white — so the approve look was restated at this scope to beat it. That
     restatement is what kept a *disabled* commit wearing the live accent:
     three files described one button and the last one loaded won, and the
     disabled rules all lived in the two that lost. Shape here, ground in the
     design system (system.css for an approve, setup.css for an emoji commit
     and for every disabled one), and no rule states a colour twice. */
  .setupcard .btn:not(.glyphbtn) { font: inherit; font-size: var(--t-cap); padding: var(--s1) var(--s3);
    cursor: pointer; border-width: 1px; border-style: solid; border-radius: var(--r-sm); }
  .setupcard .btn:not(.glyphbtn):not(.btn-approve) { background: var(--bg); border-color: var(--border); }
  .setupcard .btn:not(.btn-approve):hover { border-color: var(--primary); color: var(--primary-emphasis); }
  /* **One commit-label size** (census F-E, 2026-08-31): the --t-cap shrink
     above serves a card body's utility buttons; a commit-row word takes
     --t-ui like the charter's, so OK on a gate and OK on a sealed record
     are one size. The row's 40px height is §9.1's and set elsewhere. */
  .setupcard .commitrow .btn { font-size: var(--t-ui); }
  /* the door's head-people (CP6, Q1101): the pile's list as the card's
     standing text, quiet rows above the rule sentence */
  .headrule .headpeople { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4);
    margin-bottom: var(--s2); font-size: var(--t-ui); }
  .headpeople .hp { display: inline-flex; align-items: center; gap: 6px; }
  .headpeople .hpnone { color: var(--muted); font-size: var(--t-small); }
  .headrule .doorrule { margin-top: var(--s1); }
  .pf.waiting { color: var(--muted); }

  /* ---- what is unlocked, and what is waiting ----------------------------- */
  .stage-REMOVED { display: none;
    font-size: var(--t-small); }
  .stage .nm { font-weight: 600; }
  .stage .st { color: var(--muted); font-size: var(--t-cap); margin-left: auto; text-align: right; }
  .stage.live .nm, .stage.live .st { color: var(--ok); }
  .stage .mkg { flex: none; }
  .stage.wait .mkg { visibility: hidden; }
</style>

<script>
(function () {
  const { esc, TICK, avHtml, bandHtml, fitBand, railEntry, cardHtml, watchBody,
    nameBody, pictureBody, opt, num, someIn, ANSWER, stateOf,
    MAILS, renderMailModal, gateBody, wirePicDrop, pileHtml, stripHtml, readBody,
    motionBody, motionReopen, routeFor, motionCommitHtml, BLINDNOTE, ceilingNote, methodNote, listOf, syncSlider } = window.SETUP;
  // **A setup card opens and closes like a decision card** (Ed, 2026-08-18:
  // *the whole point of building off session-view is that we would have all
  // this stuff*): cards.js own expandCard/collapseCard, which have been
  // sitting in the shared module since the lift — the card grows out of its
  // own head, and every way of leaving it rolls it back into its paragraph.
  const CC = window.CARDS.make({ onExpand: () => SESSION.drawWires() });
  // one rendering of stored text as document lines — the settled 📄 card
  // and the live document column must escape and wrap identically
  const textDivs = (text) => String(text).split(/\n/).filter((l) => l.trim())
    .map((l) => { const m = l.match(/^(#{1,3})\s+(.*)$/);
      return m ? '<div class="docline lvl' + m[1].length + '" data-h="' + esc(m[2]) + '">' + esc(m[2]) + '</div>'
        : '<div>' + esc(l) + '</div>'; }).join('');
  // **The address the surface states is the route the server serves** (Ed,
  // backlog 70: *the Link clause says the document lives at docs.vote/[slug]
  // whereas in fact it lives at docs.vote/d/[slug]*). The server has one
  // document route, `/d/<slug>`, and no bare `/<slug>` — so every stated
  // address goes through here rather than being composed by hand, which is
  // how eleven copies of it came to be wrong at once. Pass an already-escaped
  // slug where the result is markup.
  const docAddr = (slug) => 'docs.vote/d/' + slug;
  let lastOpen = null;
  // **An opened card puts the caret in its composer** (Ed, 2026-08-21): if a
  // card is asking for words, you should be able to type them without first
  // going to find the box. Three rules keep it from becoming a nuisance.
  // **Only on the opening** — the surface re-renders wholesale on every
  // change and on the 4s poll, so focusing anywhere but here would pull the
  // caret out from under whatever you were typing. **Only onto something you
  // type into**: the first text-entry control in the card's own DOM order,
  // never a radio, a date, a button or a bare number. And **preventScroll**,
  // because the card is mid-expansion and a focus that scrolls fights the
  // animation it is landing in. The caret goes after any text already there,
  // so typing extends a draft that survived a close rather than sitting in
  // front of it (`setSelectionRange` throws on email inputs, hence the try).
  // **An opening card focuses its main decision** (Ed, 2026-08-22), which
  // reverses the narrower rule built the day before — *only onto something
  // you type into, never a radio* — and reverses it for a good reason: on a
  // card whose decision **is** a radio, refusing to focus radios did not
  // leave focus alone, it sent the caret **past** the decision into the
  // rationale lane below. The card asked *which of these* and put your cursor
  // in the box for explaining yourself.
  //
  // The main decision is **the first interactive control in the card's own
  // DOM order**, which needs no per-card list because the card grammar
  // already puts the decision first: the values, then the rationale, then the
  // commit row. It falls out right everywhere — 🌍 focuses its first rung,
  // ⏱️ its first number (the delegate rung is *set apart after the values*,
  // so it can never be first), 🪶 its title lane, 📧 its address, a motion
  // card the value it is proposing rather than the reason for it.
  //
  // Two refinements. The commit row is excluded: it is where the card ends,
  // never what it asks. And within a chosen radio group the focus goes to the
  // **chosen** option rather than the first, because where a decision stands
  // is the decision.
  const DECIDE_SEL = ['[data-titlelane]', 'textarea:not([disabled])',
    'input[type="text"]:not([disabled])', 'input[type="email"]:not([disabled])',
    'input[type="number"]:not([disabled])', 'input[type="datetime-local"]:not([disabled])',
    'input:not([type]):not([disabled])',
    '[contenteditable=""]', '[contenteditable="true"]',
    '[data-set]:not([disabled])', '[data-ans]:not([disabled])',
    '[data-mval]:not([disabled])', '[data-v]:not([disabled])'].join(',');
  // Q771: the values and the delegate rung write one state key from two boxes,
  // so *the question* is both of them and what stands may be in either. The
  // pair is bridged here rather than in the markup because the rung is
  // concatenated after the body and cannot reach inside it; the scan in either
  // direction stops at the **first `.choice`** it meets, so quorum's two
  // genuinely separate groups stay separate while a body that ends in a note —
  // 👤 always, ⏱️ whenever its cap warning shows — still joins its own rung.
  const isChoice = (n) => !!n && !!n.classList && n.classList.contains('choice');
  const nextChoice = (n, dir) => {
    let x = n[dir];
    while (x && !isChoice(x)) x = x[dir];
    return x;
  };
  const groupPair = (group) => {
    if (!isChoice(group)) return [group];
    const del = group.classList.contains('delegrung') ? group
      : (() => { const n = nextChoice(group, 'nextElementSibling');
        return n && n.classList.contains('delegrung') ? n : null; })();
    if (!del) return [group];
    const val = nextChoice(del, 'previousElementSibling');
    return val ? [val, del] : [del];
  };
  const chosenOf = (el) => {
    const group = el.closest('.choice, .lanepick, .field') || el.parentElement;
    if (!group) return el;
    const on = groupPair(group)
      .flatMap((g) => [...g.querySelectorAll('[aria-checked="true"], [aria-pressed="true"], .on')])
      .find((x) => x.matches(DECIDE_SEL) && x.offsetParent !== null);
    return on || el;
  };
  const focusComposer = (card) => {
    if (!card) return;
    const el = [...card.querySelectorAll(DECIDE_SEL)]
      .find((x) => x.offsetParent !== null && !x.closest('.commitrow'));
    if (!el) return;
    const isPick = el.matches('[data-set],[data-ans],[data-mval],[data-v]');
    const target = isPick ? chosenOf(el) : el;
    // focus is not a press: a radio is only put under the keyboard, never
    // chosen — choosing stays the click it always was
    try { target.focus({ preventScroll: true }); } catch (e) { target.focus(); }
    if (isPick) return;
    // the caret goes *after* what is already there, so typing extends a draft
    // that survived a close rather than sitting in front of it
    if (typeof el.value === 'string' && el.setSelectionRange) {
      try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* email/number */ }
    } else if (el.isContentEditable) {
      const r = document.createRange();
      r.selectNodeContents(el); r.collapse(false);
      const sel = window.getSelection();
      if (sel) { sel.removeAllRanges(); sel.addRange(r); }
    }
  };
  // **Entering edit mode puts the caret at the end of the column** (C1: a
  // card opens and focuses its main decision — the text's is the prose). Only
  // where it is actually editable: `#prose` is `contentEditable` for the
  // founder's own seat alone, in edit mode, until 🍾.
  const focusProse = () => {
    if (!prose.isContentEditable) return;
    // read *before* focusing: `focus()` itself parks a caret at the start
    const sel = window.getSelection();
    const inside = sel && sel.rangeCount && prose.contains(sel.getRangeAt(0).startContainer);
    try { prose.focus({ preventScroll: true }); } catch (e) { prose.focus(); }
    if (inside) return;                  // the reader put the caret somewhere; keep it
    const r = document.createRange();
    // inside the last block, not after it: a caret between blocks types a
    // bare text node the block model does not read
    r.selectNodeContents(prose.lastElementChild || prose); r.collapse(false);
    if (sel) { sel.removeAllRanges(); sel.addRange(r); }
  };
  // what an opening focuses — fired on the transition into open and never on
  // a re-render, since the live page polls every four seconds and stealing
  // the caret each time would fight the founder's typing
  const focusOpened = (el, k) => focusComposer(el);

  // ---- edit mode (backlog 204, Ed 2026-08-28; SURFACE K31) ----------------
  // **The text is always a card, with two modes**, and the 📝 tab is the door
  // between them. Read mode: no caret, no row; a click in the prose beats the
  // tab and says nothing; a keystroke enters edit mode with that character
  // applied. Edit mode: the column lifts onto a card, the proposal-row sticks
  // to the foot of the window, and the caret is live. Leaving — 📝 again, or
  // opening any other card — keeps the draft (leaving is not discarding).
  //
  // The state is page-only and provisional (`S.editMode`; nothing in the
  // log). Before 🍾 the column is `#prose` and the row's ✒️ is the founder's
  // confirm; after it the column is session.js's charter and the row's commit
  // follows entry 160 (✒️ under `MAY_PEN`, ✏️ otherwise) — two columns, one
  // row helper, one tab (Q1088: the pre-🍾 half of session.js's host
  // predicate was unreachable, so the page draws the tab and the row around
  // `#prose` instead of mounting the charter early).
  const canEditText = () => !!cs && !isStranger() && S.viewer !== 'applicant' &&
    !(cs.closed) && (constituted() ? mayPropose() : amFounder());
  function setEditMode(on) {
    on = !!on && canEditText();
    if (S.editMode === on) return;
    S.editMode = on;
    document.getElementById('doc').classList.toggle('editing', on);
    if (constituted()) {
      // the charter re-renders read-at-call-time (`PROSE()` reads `editing`),
      // the band does not change; the tab and the row follow
      SESSION.renderAll();
      if (on) {
        const host = document.querySelector('#charter .prose');
        if (host) { try { host.focus({ preventScroll: true }); } catch (e) { host.focus(); } }
      }
    } else {
      render();
      if (on) focusProse();
    }
    renderRideTab();
  }
  // 📝 pressed: the door. With a card open the card closes into its paragraph
  // first (one card at a time, and the closing is animated); a reader who may
  // not write gets the beat and nothing else (SURFACE K31).
  function toggleEditMode() {

  // Q506 (Ed, 2026-08-21): the register's crown pair is the 🤝 setting's

  // nothing rides the applications value but the join policy
  const regPair = () => pwPair('invite');
  // **The door is drawn on the gate that acts** (Q812). The 🪪 card asked

  // direct invitation on anything but the pen — so a founder who laid the

  const directInvite = () => (!constituted() ? amFounder()
    : (amFounder() && (cs && cs.membershipReserved ? !!cs.membershipReserved() : regPair().u)) ||

  const directRemove = () => (!constituted() ? amFounder()

  const removableRows = () => S.roster.filter((p) =>

    const rows = removableRows();

  // **A door that will not open says why** (Q811). Every act on this card

  // nothing happening. A refusal is kept against the card it belongs to and
  // printed under the control that tried, the way a refused text proposal

  const doorErrOn = (k) => (S.doorErr && S.doorErr.k === k ? S.doorErr.m : '');

    ? '<p class="why refusal"><b>' + esc(doorErrOn(k)) + '</b></p>' : '');
  // the module's sentences carry their own § pointer, which is this
  // repository's vocabulary and not a member's (STYLE.md §8): the pointer
  // goes and the sentence stays
  const plainRefusal = (m) => String(m == null ? '' : m)
    .replace(/\s*\(§[^)]*\)\s*$/, '').replace(/\.$/, '').trim();
  // an answer that arrives after the act has to repaint by itself: a
  // refusal from the wire lands one round trip and one refresh later
  const setDoorErr = (k, m) => { S.doorErr = m ? { k: k, m: m } : null; render(); };
  // **And a refused *set* says why too** (entry 62). Q811 gave this to the two
  // doors and stopped there, so every settings card's ✒️ was still
  // fire-and-forget: the server refuses, `api.cmd` warns to a console nobody
  // reads, the page renders as though the set had landed, and the next 4s poll
  // puts the old value silently back. Two channels, because there are two: the
  // module throws where the page holds it, and the wire resolves `{ error }`.
  //
  // **It re-opens the card**, which the doors do not have to: their act leaves
  // the card standing, and a settings commit closes it — so a line rendered
  // into a card nobody is looking at is the console warning again by another
  // name. After the locks above this nothing on the founder's own card can
  // reach here; it is defence, so that the *next* gap of this class shows up
  // on the page instead of in a console.
  const refuseSet = (k, m) =>
    { S.open = k; setDoorErr(k, 'That could not be set: ' + plainRefusal(m) + '.'); };
  const watchSet = (k, r) => {
    if (r && typeof r.then === 'function') {
      r.then((res) => { if (res && res.error) refuseSet(k, res.error); });
    }
    return r;
  };
  // which card a control sits on, from the card itself rather than from
  // whatever happens to be open
  const cardKeyAt = (el) => (el && el.dataset && el.dataset.setupcard) || S.open || 'admission';
  const msToLocal = (ms) => {
    const d2 = new Date(ms);
    const p2 = (x) => String(x).padStart(2, '0');
    return d2.getFullYear() + '-' + p2(d2.getMonth() + 1) + '-' + p2(d2.getDate()) +
      'T' + p2(d2.getHours()) + ':' + p2(d2.getMinutes());
  };
  // **Three acts nobody was told about** (Q901, SURFACE E31–E32). A departure
  // is a fact about the membership, so the register says it in one grey
  // sentence per departure — the office, never the name (C10); nothing is
  // asked (C7) — and the door says the same to the person it happened to.
  // A day-only date: the act is news for a day, not a timestamp to audit.
  const dayOf = (ms) => new Date(ms).toLocaleDateString(undefined, { day: 'numeric', month: 'long' });
  const DEPARTED = {
    convenor: (d) => 'The Founder removed you from this document on ' + dayOf(d.t) + '.',
    self: (d) => 'You left this document on ' + dayOf(d.t) + '.',
    members: (d) => 'The membership removed you from this document on ' + dayOf(d.t) + '.',
  };
  const departedSentence = () => {
    const p = isStranger() ? strPayload() : null;
    const d = p && p.departed;
    return d && DEPARTED[d.by] ? DEPARTED[d.by](d) : '';
  };
  // the room's list: live from the view, the fixture from the module, the
  // stranger from the door where 🌍 lets them read the register
  const departuresOf = () => {
    if (isStranger()) { const p = strPayload(); return (p && p.members && p.members.departures) || []; }
    if (!cs) return [];
    if (cs.isRemote) return (cs.v && cs.v.view && cs.v.view.departures) || [];
    return cs.departures ? cs.departures().map((d) => {
      const r = cs.memberRecords().get(d.member);
      return { id: d.member, name: r ? r.name : null, picture: r ? r.picture : null, t: d.t, by: d.by };
    }) : [];
  };
  const departureLine = (d) => {
    const who = esc(d.name || 'a member');
    return d.by === 'self' ? who + ' left on ' + dayOf(d.t) + '.'
      : d.by === 'members' ? 'The membership removed ' + who + ' on ' + dayOf(d.t) + '.'
      : 'The Founder removed ' + who + ' on ' + dayOf(d.t) + '.';
  };
  // newest first, whole — v1 rosters are 5–10, so no cap
  const departureLines = () => departuresOf().slice().reverse()
    .map((d) => '<p class="setnote departure">' + departureLine(d) + '</p>').join('');
  // **the standard proposal rate**, one literal (Q740, Ed 2026-08-23). The
  // founding pre-answers nothing (F6), and this is not a pre-answer: the card
  // still opens with three empty boxes, and these numbers are what the machine
  // writes into them when the founder picks *I set it* — an answer to a rung
  // they have just chosen. Referenced twice: by that fill, and by the
  // delegated fallbacks below, which used to carry 8 and 240 of their own.
  const RATE_START = { grant: 4, cap: 6, dripMin: 10 };
  const unset = (v) => v === '' || v === null || v === undefined;
  // picking a rung may fill that rung's own fields. Two guards the design
  // rests on: **only empty fields**, so a founder who typed 12 and re-picked
  // the rung keeps their 12; and **only on the transition** into the rung, so
  // a field they deliberately cleared is not refilled behind them. Called
  // before the assignment, which is what makes the transition visible.
  // …and since entry 165 the traffic runs both ways on a percent ladder,
  // because there the rung **is** the value. A preset carries its own holder
  // with it — picking *Broad agreement* is picking the number and taking the
  // question back in one press — and picking *A number of my own* off a preset
  // has to empty the field, or the fourth rung would light with 80 in it and
  // read as the preset it is not. A number typed back to 80 lands on *Broad
  // agreement* again, which is the same rule seen from the other side: the
  // rung is the value, matched by value and never by label (Q620).
  const fillRung = (key, val) => {
    if (key === 'rateBy' && val === 'founder' && S.rateBy !== 'founder') {
      for (const k of Object.keys(RATE_START)) if (unset(S[k])) S[k] = RATE_START[k];
    }
    if (key === 'tClose') S.barBy = 'founder';
    if (key === 'tStart') S.shape = 'ramp';
    // a ⏰ chip is the *At a set time* rung's own field (entry 166, F6)
    if (key === 'endsAt') S.ending = 'ends';
    const rungPct = (v) => M.BAR_RUNGS.some((r) => r.pct === +v);
    if (key === 'barBy' && val === 'founder' && rungPct(S.tClose)) S.tClose = '';
  };
  // the founder's provisional radio state → the typed value the module takes
  const TYPED = {
    title: () => ({ text: S.title }),
    slug: () => ({ slug: S.slug }),
    ending: () => (S.ending === 'perpetual' ? { endsAtMs: null } : { endsAtMs: Date.parse(S.endsAt) }),
    bar: () => ({ pct: +S.tClose }),
    pace: () => (S.shape === 'ramp' && S.ending !== 'perpetual'
      ? { shape: 'ramp', startPct: +S.tStart } : { shape: 'fixed' }),
    quorum: () => (S.quorumForm === 'count'
      ? { form: 'count', n: +S.quorumN } : { form: 'share', n: +S.quorumPct }),
    authorship: () => ({ rung: S.authorship }),
    judgments: () => ({ rung: S.judgments }),
    chamber: () => ({ rung: S.chamber }),
    rate: () => ({ grant: +S.grant, cap: Math.max(+S.cap, +S.grant), dripMinutes: +S.dripMin }),
    lapse: () => (S.lapse === 'never' ? { afterMs: null } : { afterMs: +S.lapseDays * 86400000 }),
    removal: () => ({ price: S.removal }),
    admission: () => ({ price: S.admission }),
    applications: () => ({ apply: S.joinBy === 'apply' }),
  };
  // 🤝 read through its legacy (entry 94): a value written before the switch
  // carried a four-rung joinPolicy, of which only `invite` was the door shut
  const mayApply = (v) => !!v && (v.apply !== undefined ? !!v.apply
    : (v.joinPolicy !== undefined && v.joinPolicy !== 'invite'));
  // a member's page-vocabulary answer → typed, and back — one place each way
  const ANSTYPED = {
    quorum: (v) => ({ form: S.quorumForm, n: +v }),
    bar: (v) => ({ pct: +v }),
    ending: (v) => (v === 'never' ? { endsAtMs: null } : { endsAtMs: Date.parse(v) }),
    authorship: (v) => ({ rung: v }),
    judgments: (v) => ({ rung: v }),
    chamber: (v) => ({ rung: v }),
    applications: (v) => ({ apply: v === 'apply' }),
    removal: (v) => ({ price: v }),
    admission: (v) => ({ price: v }),
    lapse: (v) => (v === 'never' ? { afterMs: null } : { afterMs: +v * 86400000 }),
    rate: (v) => ({ grant: +v, cap: Math.max(+v, +S.cap || RATE_START.cap),
      dripMinutes: +S.dripMin || RATE_START.dripMin }),
  };
  // a typed value → the page's own vocabulary (what STANDS/DECIDED speak)
  const PAGEVAL = {
    quorum: (v) => v.n, bar: (v) => v.pct, rate: (v) => v.grant,
    ending: (v) => (v.endsAtMs === null ? 'never' : msToLocal(v.endsAtMs)),
    lapse: (v) => (v.afterMs === null ? 'never' : Math.round(v.afterMs / 86400000)),
    authorship: (v) => v.rung,
    judgments: (v) => v.rung, chamber: (v) => v.rung,
    removal: (v) => v.price,
    admission: (v) => v.price,
    applications: (v) => (mayApply(v) ? 'apply' : 'invite'),
  };
  // what the document is called now, and what the lane is proposing
  const cs_titleNow = () => (cs ? cs.titleOf : S.title);
  const titlePending = () => (S.titleDraft !== null ? S.titleDraft : cs_titleNow());
  const viewerId = () => (S.viewer === 'applicant' || S.viewer === 'stranger'
    ? null : (viewerRow().mid || FOUNDER));
  // **A heading on the screen is a heading in the text**: the editor keeps
  // the '# ' as a class while you type (relabel), so it is put back when the
  // text is read out — the stored text is the document, and the charter
  // column reads its headings from it (stage 8)
  const proseText = () => [...prose.children].map((b) => {
    const m = b.className.match(/lvl(\d)/);
    return (m ? '#'.repeat(+m[1]) + ' ' : '') + b.textContent;
  }).join('\n').trim();
  // **The column, counted once** — 📄's own value, the 📄 clause and the rail
  // entry all state the same fact about the same blocks, and each used to
  // count them itself. A heading is a block whose class carries `lvl<n>`, the
  // same test `proseText` uses to put the Markdown hashes back. It returns
  // the counts; every caller phrases them.
  const proseCounts = () => {
    let paras = 0; let heads = 0;
    for (const b of prose.children) {
      if (!b.textContent.trim()) continue;
      if (/lvl\d/.test(b.className)) heads++; else paras++;
    }
    return { paras, heads, blocks: paras + heads };
  };
  // 📄's value slot: what stands in the column, said in the fewest words that
  // are still a count. An empty column is a real answer (§9.0b), so it gets a
  // statement of its own rather than a zero.
  const proseLine = () => {
    const c = proseCounts();
    if (!c.blocks) return 'Nothing written yet.';
    const n = (x, w) => x + ' ' + w + (x === 1 ? '' : 's');
    return listOf([c.paras ? n(c.paras, 'paragraph') : '', c.heads ? n(c.heads, 'heading') : ''])
      + ', below.';
  };

  const DKEY = { ending: 'ending', bar: 'barBy', quorum: 'quorumBy',
    authorship: 'authorship', judgments: 'judgments',
    chamber: 'chamber', rate: 'rateBy', lapse: 'lapse', removal: 'removal',
    // v0.52: these three only ever read 'roster' once their options render

    title: 'titleBy', slug: 'slugBy', applications: 'policyBy', admission: 'admission' };

  const setVal = (v) => (v === 'true' ? true : v === 'false' ? false : v);
  // ✒️ on a setting card: the confirm is a module command (delegate, or
  // reclaim-and-set). Post-start this is the crown's direct change on a
  // reserved setting; the module refuses anything else and the page keeps
  // rendering (mock discipline: commands may fail, rendering may not).
  function commitSetting(k) {
    const mid = midOf(k);
    if (k === 'quorum' && cs.quorumForm !== S.quorumForm) {
      try { cs.setQuorumForm(now(), S.quorumForm); } catch (e) {}
    }
    // 🪜 rides 🌡️'s commit (Q512): it is not a task of its own, so setting the
    // threshold sets the pacing with it — at whatever its tab holds, which is
    // rising from 55% until somebody changes it.
    // **And it rides the hand-over too** (Q775, Ed 2026-08-25: *maybe the 🌡️
    // and 🪜 didn't generate a task*). The ramp is the founder's whichever way
    // 🌡️ goes — the bar at the close is consent, the ramp that reaches it is
    // pacing (Q341/Q415) — so it is owed either way. It rode only the *set*
    // branch, below the delegate return, and 🪜 is in neither ORDER nor any
    // section's keys, so nothing on the surface could ever ask for it: a
    // delegated 🌡️ left `mustAct('pace')` true for ever, `otherTasksLeft()`
    // counted it, `ansDue()` was false, and **not one delegated question ever
    // reached the founder**. It stands above the return now, so the commit
    // answers it whichever branch the commit takes.
    if (k === 'bar') {

    if (csDelegated(k)) cs.reclaim(now(), mid);

    // tab choices so the ✒️/🛡️ tabs show what now stands
    S['pw:u:' + k] = undefined; S['pw:a:' + k] = undefined;
  }

  // **Discard and commit, on every card you can commit** (Ed, 2026-08-19,
  // closing 412): the left slot is 🗑️ — *put this card back the way it
  // stands* — and "Close" survives only where the card holds nothing to put
  // back. **OK** is a third control and not a variant of either: it is what
  // a card wears when it asks nothing of you but to have seen it (Ed's own
  // words) — a gate opening, a decision you are owed.
  //
  // A radio on a setting card writes straight into S, so *what it stands as*
  // has to be remembered rather than derived: one snapshot per opening,
  // taken in render after the module has had its say, and compared to decide
  // whether the bin has anything to throw away.
  const REVERTKEYS = () => ['title', 'slug', 'docShape', 'ending', 'endsAt', 'endChip', 'tClose', 'shape', 'tStart',

    'lapse', 'lapseDays', 'removal', 'removeWho', 'admission', 'authorship', 'judgments',
    'grant', 'dripMin', 'cap', 'chamber',

    // the title's provisional lane rides the snapshot like every other
    // provisional value, so 🪶 needs no bin of its own (2026-08-21)
    'titleDraft']
    .concat(PW_KEYS.flatMap((k) => ['pw:u:' + k, 'pw:a:' + k]));
  // **The snapshot is per card, and it lives until that card commits** (Ed's
  // QA, 2026-08-21). It used to be taken once per *opening*, which was true
  // until *what you have typed survives a close* landed the same day: type an
  // address, close the card, open it again, and the snapshot was retaken from
  // the value you had typed — so the bin had nothing to put back and went
  // dead, stranding the very change it exists to undo. What a card stands as
  // only moves when the card is committed, so that is when the snapshot is
  // dropped and the next opening takes a fresh one.
  const snaps = Object.create(null);
  // the blind answers ride the snapshot too, as their own `ans:` keys — an
  // answer is one more provisional value, and the bin that puts a card back
  // should not need to know which kind of card it is standing on
  const takeSnap = (k) => { const s = { __ans: Object.assign({}, S.myAns) };

  // covers every revertable key, but a card may only undo the ones it can
  // write — otherwise a snapshot taken at one opening could roll back a draft
  // made on a *different* card in between. Every control names the field it
  // writes (opt()'s data-set, the text and number fields' own data-txt and
  // data-num), so the card's keys are read off the open card rather than kept
  // in a hand-maintained list that would rot silently. A card naming none
  // falls back to the whole set, which is what every bin did before.
  const cardKeys = () => {
    const el = document.querySelector('.setupcard');
    if (!el) return null;
    const ks = new Set();
    el.querySelectorAll('[data-set]').forEach((b) => ks.add(b.dataset.set));
    el.querySelectorAll('[data-txt]').forEach((b) => ks.add(b.dataset.txt));
    el.querySelectorAll('[data-num]').forEach((b) => ks.add(b.dataset.num));
    el.querySelectorAll('[data-ans]').forEach((b) => ks.add('ans:' + b.dataset.ans));
    if (el.querySelector('[data-setwhy]')) ks.add('setWhy');
    if (el.querySelector('[data-titlelane]')) ks.add('titleDraft');

    if (el.querySelector('[data-removewho]')) ks.add('removeWho');

    // `[data-pic]` used to be the always-present row of grounds; since Q732
    // the only `[data-pic]` elements are the picker's own buttons and the
    // Remove button, and neither is guaranteed — the grid says *the emoji
    // list is still loading* when `EMOJI_DATA` has not arrived, and with no
    // picture set there is nothing to remove, so the card can carry no
    // `[data-pic]` at all and 🗑️ would decline to put a picture back. The file
    // drop zone is rendered by `pictureBody` unconditionally and names whose
    // picture it is, so it is the honest marker of "this is *your* picture
    // card" — the applicant's body is the same one and must not reach across
    // to `mypic`.
    if (el.querySelector('[data-pic], [data-picinto="me"]')) ks.add('mypic');
    if (el.querySelector('[data-slide]')) {
      el.querySelectorAll('[data-slide]').forEach((b) => ks.add('ans:' + b.dataset.slide));
    }

  };
  // A card that names no field puts nothing back — it simply closes. The old
  // fallback was "restore everything", which was safe only while a snapshot
  // could not outlive one opening; now that it can, a card with no fields of
  // its own must never reach across the surface and undo another card's work.
  const revertSnap = (only) => { const s = snaps[S.open];
    if (!s) return;
    (only || []).forEach((k) => {
      if (k.startsWith('ans:')) { const a = k.slice(4);
        if (s.__ans) S.myAns[a] = a in s.__ans ? s.__ans[a] : null; return; }

    }); };
  // **🗑️ is always live** (Ed, 2026-08-21: *the bin should still close the
  // card even if the fields are empty*). It used to grey out when there was
  // nothing to put back, which made the one control that leaves a card
  // unpressable exactly when a reader most wanted out of it — and left them
  // pressing a dead button. So the act is *put it back as it stands, and
  // close*, and with nothing to put back it is simply the close. That also
  // retires the dirty predicates the row was keeping in three places.
  const binBtn = () => '<button class="btn glyphbtn" data-revert="1"' +
    ' title="Put it back as it stands">🗑️</button>';

  const S = {
    // **Nothing in the document changes until ✒️** (Ed's QA, 2026-08-19: the
    // title card was rewriting the heading, the topbar and its own head as
    // you typed, *which is inconsistent with all other decision behaviour*).
    // Every other card holds what stands at the top and what you are
    // proposing below it; the title was the one that let the two be the same
    // string. titleDraft is the provisional value — the lane's, and nothing
    // else's — dropped whenever the open card changes.
    title: '', titleDraft: null, slug: '',

  function relabel() {

      const t = b.textContent;
      const m = t.match(/^(#{1,3})\s+/);
      if (m) {
        const liveHere = at && b.contains(at);
        b.textContent = t.slice(m[0].length);
        b.className = 'docline lvl' + m[1].length;
        b.dataset.h = b.textContent;
        if (liveHere && b.firstChild) {
          const r = document.createRange();
          r.setStart(b.firstChild, 0); r.collapse(true);
          sel.removeAllRanges(); sel.addRange(r);
        }
      } else if (b.className) { b.dataset.h = t; } else { delete b.dataset.h; }
    }
    prose.classList.toggle('empty', prose.textContent.trim() === '');

  }

  // contenteditable region would become text the harvest reads.
  const secToggleHtml = (key) => window.CARDS.secToggleHtml(key, !S.folded.has(key));
  function applyProseFolds() {
    let hideLvl = null;
    for (const b of [...prose.children]) {
      const isH = b.dataset.h !== undefined;
      const lvl = isH ? +((b.className.match(/lvl(\d)/) || [0, 9])[1]) : 9;
      if (isH && hideLvl !== null && lvl <= hideLvl) hideLvl = null;
      const hidden = hideLvl !== null;
      b.classList.toggle('pfolded', hidden);
      if (isH && !hidden && S.folded.has('ph:' + b.dataset.h)) hideLvl = lvl;

  }
  function positionProseToggles() {
    let rail = document.getElementById('prosefolds');

    const hs = [...prose.children].filter((b) => b.dataset.h !== undefined && !b.classList.contains('pfolded'));
    // measured, not offsetTop: the rail and the blocks answer to different

    return (!settled(card('myemail')) ? '' :

  const card = (k) => CARDS.find((c) => c.k === k) || ANS.find((c) => c.k === k) ||
    GATES.find((c) => c.k === k) || powerCard(k) || admitCard(k) || recordCard(k) ||
    releaseCard(k) || mailGiveUpCard(k);
  // **The governance tab group** (403/405, Ed 2026-08-19): every held-able
  // setting is three questions — the value, ✒️ who-has-the-pen, 🛡️ do-carried-changes-need-the-Founder’s-OK — drawn as a
  // pile: the value’s tab in front, the two power tabs beneath. The tabs
  // ARE the governance model: delegation is the state of holding neither
  // power (Q403 unified them), so “The members decide” is no longer a
  // value — it is what the tabs say when both are given up. ✒️ and 🛡️ are
  // Ed’s pair (Q454): a sword and a shield — one writes, one only refuses.
  const Q = "’", LD = "“", RD = "”";
  // **Every held-able setting wears the ✒️/🛡️ tabs** — the register's
  // pair through 🤝 (Q506: it left the applications value for the
  // setting's own powers) and the Text's through 📄 (Q440: a founder who
  // keeps the pen or the shield on the text is a 👑 like anywhere else).
  // Delegability is the catalogue's own flag, not a page-kept list.
  const PW_KEYS = MANAGED_KEYS.concat(['text']).concat(DOOR_KEYS);
  // the power state of a held-able setting: the Text's rides its own
  // module row (value null, never a question), everything else csState's
  const pwState = (k) => (cs ? (k === 'text' ? cs.settingState('startingText') : csState(k)) : null);
  // delegability is the catalogue's own flag, never a page-kept list — the
  // power tabs need it to say *when* giving the second power lands (R-048)
  const isDelegable = (k) => MANAGED_KEYS.includes(k) && M.entryOf(midOf(k)).delegable;
  // a door's power tabs wear the act, not the generic amendment (T9)
  const DOOR_PW_TITLES = {
    invite: { u: 'Can the Founder Invite at Will?', a: 'Does the Founder Have a Veto over Invitations?' },
    remove: { u: 'Can the Founder Remove at Will?', a: 'Does the Founder Have a Veto over Removals?' },
  };
  const PWCACHE = {};
  // Q454 (Ed, 2026-08-20): 🔧 becomes ✒️ and the assent half of 👑 becomes
  // 🛡️ — a sword and a shield, one writes and one only refuses, where 🔧
  // and 👑 were not opposites at all. 👑 stays the mark beside a *person*
  // who holds either power anywhere; 📯 the mark of one who holds none.
  const powerCard = (k) => {
    const mm = /^pw:(u|a):(.+)$/.exec(k);
    if (!mm || !PW_KEYS.includes(mm[2])) return undefined;
    if (!PWCACHE[k]) {
      PWCACHE[k] = {
        k, power: mm[1], base: mm[2],
        g: mm[1] === 'u' ? '✒️' : '🛡️', kind: 'constitutional',
        t: DOOR_PW_TITLES[mm[2]] ? DOOR_PW_TITLES[mm[2]][mm[1]]
          : mm[1] === 'u' ? 'Can the Founder Make Amendments at Will?'
          : 'Does the Founder Have a Veto?',
      };
    }
    return PWCACHE[k];
  };
  // **The admit judgment stands under *Applicants*** (entry 96, Ed 2026-08-26:
  // *a door stands by its result*). One card per person still asking, wearing
  // 🪪 because an admission is what it decides, and taking the form 🪪's price
  // gives it: a race at `proposal`, a 🏛️ question at `assembly`, and none at
  // all at `pen`, where an application is admitted the moment it is submitted
  // and there is nothing left to ask anybody. It lived on the 🪪 card's clause
  // until entry 94 re-typed 🪪 into a price and left it behind with no caller
  // at all (Q900) — so this is the way back in as much as it is the move.
  const ADMCACHE = {};
  const admitCard = (k) => {
    const mm = /^adm:(.+)$/.exec(k);
    if (!mm) return undefined;
    const id = mm[1];
    if (!ADMCACHE[k]) ADMCACHE[k] = { k, admit: id, g: '🪪', kind: 'constitutional',
      early: () => true, hide: () => !applicantById(id) };
    // the name arrives with the submission rather than with the seat, and at
    // ✒️ there is nothing to ask — the card reports rather than asks
    const ap = applicantById(id);
    const nm = ap ? applicantName(ap) : 'an applicant';
    ADMCACHE[k].t = admissionPrice() === 'pen' ? nm + ' Has Joined' : 'Admit ' + nm + '?';
    return ADMCACHE[k];
  };
  // **Everything one act laid down is one card** (entry 162, Q1013). Built on
  // `admitCard`'s pattern, which exists for exactly this shape: a synthetic
  // card with a dynamic key that the module, not the page, is the truth about.
  // It asks only to have been read, so its title is a plain statement of what
  // happened (STYLE T1–T2) and does not name the batch — a title that listed
  // its contents would put a fresh string in the copy golden per act.
  const RELCACHE = {};
  const releaseCard = (k) => {
    const mm = /^rel:(.+)$/.exec(k);
    if (!mm) return undefined;
    const id = mm[1];
    if (!RELCACHE[k]) RELCACHE[k] = { k, release: id, g: '👑', kind: 'constitutional',
      early: () => true, hide: () => !releaseBatch(id) };
    RELCACHE[k].t = 'What the Founder Has Laid Down';
    return RELCACHE[k];
  };
  // the batches still owed, minus the one press in flight (`S.okd` is the
  // page's optimism until the command's own refresh lands)
  const releaseKeys = () => releaseBatches()
    .filter((b) => !S.okd.has('rel:' + b.id)).map((b) => 'rel:' + b.id);
  // **A mail that gave up is news to the membership** (SURFACE E34, Q947 (c)).
  // `releaseCard`'s shape exactly, and for its reasons: a synthetic card with a
  // dynamic key the module rather than the page is the truth about. The title
  // states what happened and names neither the batch nor an address — a title
  // carrying the address would put a fresh string in the copy golden for every
  // give-up, which is `releaseCard`'s own rule.
  const MAILCACHE = {};
  const mailGiveUpCard = (k) => {
    const mm = /^mail:(.+)$/.exec(k);
    if (!mm) return undefined;
    const id = mm[1];
    if (!MAILCACHE[k]) MAILCACHE[k] = { k, mailgiveup: id, g: '📭', kind: 'constitutional',
      early: () => true, hide: () => !mailGiveUpBatch(id) };
    MAILCACHE[k].t = 'An Invitation Did Not Send';
    return MAILCACHE[k];
  };
  const mailGiveUpKeys = () => mailGiveUpBatches()
    .filter((b) => !S.okd.has('mail:' + b.id)).map((b) => 'mail:' + b.id);
  // **A settled motion files behind the rule it was about** (Q942, entry 72,
  // Ed 2026-08-25: *when a proposal for a change in a setting passes or is
  // rejected, it should leave a tab, the same as with a text amendment*). The
  // band's 2026-08-18 rule was that a settled setting stays in the closed pile
  // *because it is the rule, not history* — and that half stands. What is new
  // is the other half: a settled motion **is** history at that clause, so it
  // files there exactly as a filed decision does in the gutter, behind the
  // rule's own tab. A synthetic card like `powerCard`, so nothing but
  // `chipsFor` has to know these exist.
  //
  // **Keyed by its place in its pile, not by the motion id.** A raised motion
  // is `mo-3`, but a ✒️ amendment is folded rather than emitted and its id
  // carries the wall clock (`pen:pace:1787813159193`) — which would put a
  // fresh key in the copy golden on every run, and a card key is a golden
  // key. The pile's own order is stable: records are immutable and append in
  // settle order, so index `n` names the same record for as long as it exists.
  const RECCACHE = {};
  const recordCard = (k) => {
    const mm = /^rec:(.+):(\d+)$/.exec(k);
    if (!mm || !cs) return undefined;
    // a record that is no longer filed — or a page that has moved on from the
    // document it was read against — resolves to nothing, so a stale `S.open`
    // simply closes rather than throwing inside `cardFor`
    const rec = settledMotionsFor(mm[1])[+mm[2]];
    if (!rec) return undefined;
    if (!RECCACHE[k]) RECCACHE[k] = { k, kind: 'constitutional', base: mm[1] };
    // recomputed rather than frozen, for `admitCard`'s reason: the words a
    // motion is described in are the page's, and the page's copy moves
    RECCACHE[k].record = rec.id;
    RECCACHE[k].g = rec.status === 'carried' ? TICK : window.CARDS.CROSS;
    RECCACHE[k].t = (rec.status === 'carried' ? 'Passed: ' : 'Rejected: ') + motionDisplay(rec);
    return RECCACHE[k];
  };
  const applicantById = (id) => allApplicants().find((ap) => ap.id === id);
  const applicantName = (ap) => ap.name || ap.email || 'Anonymous';
  // **An open door makes news, not a task** (Ed, 2026-08-26). At ✒️ an
  // application is admitted the moment it is submitted, so nobody is being
  // asked anything — what is left is that somebody joined, which every member
  // is told once and acknowledges. At either other price the application
  // *raises* the judgment, and that is a task (Ed: *applications should
  // generate a task when they are made — or news if admissions is open*).
  const admitKeys = () => (admissionPrice() === 'pen'
    ? allApplicants().filter((ap) => ap.status === 'admitted' && !S.okd.has('adm:' + ap.id))
      .map((ap) => 'adm:' + ap.id)
    : applicantsAsking().map((ap) => 'adm:' + ap.id));
  // the held pair as truth: {u, a} — false/false IS delegated (Q403)
  const pwPair = (k) => {
    const st = pwState(k);
    if (!st) return { u: true, a: true };
    if (st.holder === 'members') return { u: false, a: false };
    return { u: st.powers.unilateral, a: st.powers.assent };
  };
  // **A pre-start release is recorded now and takes effect at 🍾** (Ed,
  // 2026-08-25; R-048). So there are two truths about a power before the
  // start and the surface says both: `pwPair` is the hand actually on the
  // setting — which is what the wallets, the crown mark and every gate ask
  // about — and `pwPend` is what the founder has already promised away.
  // The card reads a pending release as *chosen*, and the clause says
  // *from the start*.
  const pwPend = (k) => {
    const st = pwState(k);
    const p = st && st.pendingRelease;
    return { u: !!(p && p.unilateral), a: !!(p && p.assent) };
  };
  // **A power can only be laid down once the setting has a value** — there
  // is nothing to hand over before that (R-048). The Text carries no managed
  // value, so its own answer is whether the text has been confirmed.
  const pwHasValue = (k) => {
    if (!cs) return false;
    if (k === 'text') return !!cs.textConfirmed;
    if (DOOR_KEYS.includes(k)) return true; // a door has no value to have been set (entry 94)
    const st = pwState(k);
    return !!st && st.value !== null;
  };
  // 396c's precise sentences for each power, held and given, stated once
  // per setting — the clause (holderLine) and the card head that opens
  // from it must agree by construction, not by copy discipline. The
  // membership and the Text say what the power actually does there.
  // **One sentence, and Ed's own vocabulary** (Q516i, 2026-08-21: *ideally
  // we should also join them as "The Founder may amend this at will, and
  // refuse a proposal the membership passes"* — and *a member proposes; the
  // membership passes and rejects proposals; the founder assents, refuses,
  // and amends*). So the two powers are **verb phrases** rather than two
  // sentences: the clause joins whichever the Founder holds into one
  // sentence, and a power card states its own alone. The negative is the
  // same phrase under *may not*, which is what makes the pair read as one
  // grammar rather than two rules that happen to sit together.
  const PW_PHRASE = {
    '*': { u: 'amend this at will', a: 'refuse proposals that the membership pass' },
    // the doors' phrases are over the act (entry 94): what the Founder may
    // *do*, where every setting's is what they may amend
    invite: { u: 'invite people at will', a: 'refuse invitations and applications that the membership pass' },
    remove: { u: 'remove members at will', a: 'refuse removals that the membership pass' },
    text: { u: 'amend the text at will', a: 'refuse changes to the text that the membership pass' },
  };
  const pwPhrase = (k, power) => (PW_PHRASE[k] || PW_PHRASE['*'])[power];
  // the aside is the birth's title clause and nothing else (Ed, 2026-08-27,
  // backlog 140): it is *the sentence that first names one*, so it is where
  // the Founder learns the word means them — and *repeated, it would read as
  // a tic*, so no other clause and no card head ever passes the flag. Second
  // person inside a constitutional sentence is STYLE.md §3's second recorded
  // exception, not something for the next copy pass to tidy away.
  const founderMay = (parts, aside) => (parts.length
    ? 'The Founder' + (aside ? ' (that' + Q + 's you!)' : '') +
      ' may ' + parts.join(', and ') + '.' : '');
  // the same grammar for a power laid down *from the start* (R-048): the
  // negative under a date, so a reader can tell a power already given from
  // one given up the moment the document begins
  const founderMayNotYet = (parts) => (parts.length
    ? 'From the start, the Founder may not ' + parts.join(', or ') + '.' : '');
  const pwLine = (k, power, held, pending) => (pending
    ? founderMayNotYet([pwPhrase(k, power)])
    : held ? founderMay([pwPhrase(k, power)])
      : 'The Founder may not ' + pwPhrase(k, power) + '.');
  const powerHeadLine = (c) => {
    const p = pwPair(c.base);
    const pend = pwPend(c.base);
    return pwLine(c.base, c.power, c.power === 'u' ? p.u : p.a,
      c.power === 'u' ? pend.u : pend.a);
  };
  const PWWHY = {
    '*': {

  // wearing a different hat — so the setting card stays in the founder's
  // pile with the delegation radio and the watching half, and handing a
  // question to the room makes a question card **appear** in the membership

  // teleport.
  const ansKey = (c) => c.ansFor || c.k;
  // **Choosing and committing are two acts** (Ed, 363a, 2026-08-18): a blind
  // question's answers feed a count everyone sees and resolve to maxima, so
  // a stray click while exploring the ladder must not be an answer. Touching
  // the control fills a provisional value (which is what wakes the ✓); the ✓
  // commits it, and only committed answers count anywhere — the tally, the
  // gates, the resolution. Every other card already works this way.

  // 🌡️'s ladder it is the rung that says *I will name a number*, so it records
  // where the answer is going to be given and not what it is. The ✓ stays dark
  // until the box beside it has one, exactly as it does before any rung is
  // touched at all.
  const filled = (c) => { const v = S.myAns[ansKey(c)];

  // not an answer — and to nothing where there is not (💤, ⏱️).
  const setAnsNum = (t) => {
    const k = t.dataset.ansnum;
    const pick = t.closest('.pick');
    const own = pick && pick.querySelector('[data-ansval="own"]');
    S.myAns[k] = t.value === '' ? (own ? 'own' : null) : +t.value;

    // the box is not always inside a rung — 💤's and ⏱️'s answers are a bare
    // field — so the slot is looked for in the rung first and then on the
    // card, which is the whole difference between the two shapes.
    const slot = (pick && pick.querySelector('[data-meaning="' + k + '"]')) ||

    lapse: () => S.lapse === 'never' || (!!S.lapse && isNum(S.lapseDays)),

    // for ever. Harmless until the gates joined ORDER, at which point
    // everything below 🎩 — 💡, ⚖️, 🪪 — waited on a question that could not

  //
  // **The pen is the exception** (Ed, 2026-08-22: *immediately after the

  // constitutional setting with a ✒️ action, and if I haven't accepted the
  // pen yet I shouldn't see it, because I shouldn't be given tasks that I
  // can't action*). The skip-as-blocker rule was written for ⚖️, which
  // cannot open until the whole constitution is decided — blocking on it
  // would stop the constitution being finished at all. ✒️ is in no such

  // never on a founding commit, so it hands over nothing the queue below it

  // (Ed, 2026-08-28, Q980: *✋ and 🖼️ should both appear together after the
