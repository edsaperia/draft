  // stand on the Founded line, and that sentence is their clause.
  const onFoundedLine = (c) => !!c && (c.k === 'grant-pen' || c.k === 'grant-shield');
  // One question card per delegable setting, born when its setting is handed
  // over and gone if it is taken back. Same glyph, same title — it is the
  // same question — told apart by whose pile it stands in.
  const ANS = CARDS.filter((c) => c.key && ANSWER[c.k]).map((c) => ({
    k: 'ans-' + c.k, g: c.g, t: c.t, kind: c.kind, own: 'you', ansFor: c.k }));
  const LIVE = () => CARDS.concat(ANS, GATES).filter(visible);
  // **The watcher waits for your own answer** (Ed, 2026-08-19: *we shouldn't
  // see the watcher for a group task until I have given my answer for that
  // task*). A delegated setting stands in the rail twice — the ⏳ entry
  // saying how far the room has got, and your own question — which is the
  // same title twice, and the wrong one first: how many have answered is not
  // something you need before you have answered, and arguably not something
  // you should be reading while you decide.
  // not 'once you could have answered' but 'once you have' — the watcher is
  // hidden while the answer is still outstanding, whether or not the question
  // has reached you yet
  const owesOwnAnswer = (c) => { const a = ANS.find((x) => x.ansFor === c.k);
    return !!a && settled(c) && viewerIsMember() && isRoom(c) && !answered(a); };
  // **The sections of the constitution** (Ed, 2026-08-18): subtitles his
  // ask, the grouping and the prose mine to draft — each line says what
  // the section governs, in the surface's own words.
  const SEC = [
    // no intro line (Ed, 2026-08-18) — the sentences are the section
    { key: 'members', title: 'Membership',
      text: '',
      keys: ['roster', 'invite', 'remove', 'hat', 'policy', 'lapse', 'removal', 'myemail', 'myname', 'mypic'],
      // **Members and Applications are subsections** (Ed, 2026-08-18):
      // Members IS the list — 🪪, the tab for invitations, stands beside
      // it, and the bottom row is your own membership wearing the ✋ and
      // 🖼️ tabs. Applications is the 🤝 decision (its Applicants list
      // arrives with the first applicant, after the start).
      body: (h) => {
        // the You stack: name, picture, email (Ed, 2026-08-19 — everyone
        // logged in has an address they may want to change or re-send)
        const my = ['myname', 'mypic', 'myemail'].map(card).filter((c) => c && visible(c));
        const others = S.roster.filter((p) => !p.founder);
        // an empty list gets a placeholder row (407a, Ed 2026-08-19): a
        // membership of one showing nobody read as broken, and the you-row
        // stood so high its ✋ pile collided with the 🪪 pile above (two
        // stacks twelve pixels apart in one clause — the Q308 floor). The
        // row says the true thing and gives the you-row a row's clearance.
        // No avatar: a face here would claim a person who does not exist.
        // a stranger reads how many, never who (Q508 — shipped private)
        const list = isStranger() ? (strMemberList() || '<div class="memlist"><div class="memrow nobody">' + strMembersLine() + '</div></div>')
          // **You are at the top** (Ed, 2026-08-21). A membership starts as
          // one person, and that person is reading this: the list opens with
          // your own row — the only one wearing your ✋🖼️ tabs — and says
          // plainly that there is nobody else yet. (It used to end with you,
          // under a room that had not been invited.)
          : '<div class="memlist">' +
          '<div class="memrow meRow">' + (my.length ? h.pile(my) : '') + avHtml(me()) +
          '<span class="mn">' + esc(S.myname || 'Anonymous') + ' <span class="chip founder">founder</span> <span class="chip">you</span>' +
          (iDraft() ? '' : ' <span class="chip">clerk</span>') + '</span></div>' +
          (others.length === 0 ? '<div class="memrow nobody">(nobody else here yet)</div>' : '') +
          others.map((p) => '<div class="memrow">' + avHtml(p) +
            '<span class="mn">' + esc(p.n || (!p.in && p.e) || 'Anonymous') +
            (p.in ? '' : ' <span class="chip pending">invited</span>') + '</span></div>').join('') +
          '</div>';
        const openId = my.find((c) => S.open === c.k);
        // **🤝 Applications first, then the people, then the rules about them**
        // (Q617 (a), Ed 2026-08-22: *I need to decide Applications before I can
        // do Membership* — how people become members is decided before the
        // list of who is one, since inviting is an act under that rule). The
        // list then stands above 💤 and 🥾: a register is the fact, and those
        // are rules about it. The founding follows the document, so this also
        // puts 🎩 *are you a member* and your own name and picture before you
        // invite anybody, which is the order somebody actually does it in.
        return (visible(card('policy')) ? h.para(card('policy')) + h.tasks(card('policy')) : '') +
          '<h2 class="docline lvl3">Members</h2>' +
          (() => { const pileCards = ['roster', 'invite', 'remove', 'hat']
            .map(card).filter((c) => c && visible(c));
          // the list stands as soon as any of its tabs does — 🎩 arrives
          // before 🪪 now, and a tab with no paragraph has nowhere to live
          return (pileCards.some((c) => S.open === c.k)
            ? h.paraWith(card(S.open), pileCards)
            : pileCards.length
            ? '<div class="cpara">' + h.pile(pileCards) + list + '</div>'
            : ''); })() +
          (openId ? h.paraWith(openId, my) : '') +
          (visible(card('lapse')) ? h.para(card('lapse')) + h.tasks(card('lapse')) : '') +
          (visible(card('removal')) ? h.para(card('removal')) + h.tasks(card('removal')) : '');
      } },
    { key: 'deciding', title: 'Decisions',
      text: '',
      // ⏰ when it ends, 🌡️ how sure the room must be at that point, 🪜 how
      // that number gets there, 👥 how many must have judged. The threshold
      // and its pacing are one thought on two cards, so they are adjacent;
      // quorum is a different kind of number and reads last (Ed, 2026-08-21).
      keys: ['ending', 'closing', 'bar', 'quorum'],
      // 🪜 is in neither `keys` nor ORDER (Q512, finding 598): it has no
      // clause and no rail entry — it arrives answered, is stated inside the
      // threshold clause, and is changed on a tab in 🌡️'s own stack.
      body: (h) => ['ending', 'closing', 'bar', 'quorum'].map(card)
        .filter((c) => c && visible(c)).map((c) => h.para(c) + h.tasks(c)).join('') },
    // "Anonymity" (Ed, 2026-08-19), not "Privacy"
    { key: 'privacy', title: 'Anonymity',
      text: '',
      keys: ['signing', 'authorship', 'judgments'] },
    // **Proposals reads fourth** (Ed, 2026-08-21), restoring the order both
    // CLAUDE.md and design/DECISIONS.md have always carried: Membership ·
    // Decisions · Anonymity · Proposals · The Document. It had drifted to
    // second, which put the whole section's arrival directly beneath the
    // Membership clauses the founder was still working through.
    // The gates lead it (Ed, 2026-08-18); the preamble opens it
    // (Ed, 2026-08-19 — moved from the head of the constitution, redrafted
    // in his words); no intro lines — the sections are not big enough to
    // need explanations, and the clauses ought to be self-explanatory
    // (Ed, 2026-08-19)
    { key: 'rate', title: 'Proposals',
      text: '',
      // The preamble is 🍾's own paragraph once 🍾 is due (Ed, 2026-08-22).
      // It stands from the save, tab-less, so the sentence saying what
      // beginning will do is readable all through the founding; when 🍾
      // reaches its turn in ORDER the paragraph *gains its tab* rather than
      // a new paragraph arriving under it, and the press drops the
      // qualifier from the sentence it was standing on. `body` skips
      // 'begin' for that reason; `keys` keeps it, because the rail and the
      // group's own count enumerate from the section's cards.
      lead: (H) => (cs ? (visible(card('begin')) ? H.para(card('begin')) : preamblePara()) : ''),
      body: (H) => ['canpropose', 'canjudge', 'rate', 'machines'].map(card)
        .filter((c) => c && visible(c)).map((c) => H.para(c) + H.tasks(c)).join(''),
      keys: ['begin', 'canpropose', 'canjudge', 'rate', 'machines'] },
    // rail-only: the title is the heading, the link leads the constitution,
    // and the starting text anchors the prose (Ed, 2026-08-18)
    { key: 'doc', title: 'The Document', railOnly: true,
      text: '', keys: ['title', 'slug', 'chamber', 'text'] },
  ];
  const secLive = () => SEC.map((s2) => ({ ...s2,
    cards: s2.keys.map(card).filter((c) => c && visible(c)) }))
    .filter((s2) => s2.cards.length);
  // a delegated setting's paragraph is followed by the founder's own
  // answer-task, the same card a member gets, standing where the rule is
  // a resolved question keeps no answer-task paragraph: the rule above it
  // now states the outcome, and a standing “has answered” line under a
  // decided rule is a task that finished still asking to be read
  const tasksFor = (c) => (c.key && ANSWER[c.k] && (c.in || 0) < E()
    ? [card('ans-' + c.k)].filter((x) => x && visible(x)) : [])
    // the grants stand as tasks beside the gates they belong with (Q461):
    // the pen and the shield with the 📍 link — issued when the address went
    // live (Q451) — the voice with the first blind question you are asked,
    // or with ⚖️ Judging where nothing was delegated to you (Q605 (a)).
    // ✒️ and 🛡️ are enumerated here and drawn on the Founded line (Q639).
    .concat(c.k === 'slug' ? [card('grant-pen'), card('grant-shield')].filter(visible)
      : c.k === voiceHost() ? [card('grant-voice')].filter(visible) : []);
  // A member who has not opened the document yet is drawn faintly rather than
  // left out: they are on the membership, which is the fact the heading is
  // stating, and whether they have looked at it yet is a different one.
  const groups = () => [
    // **No Constitution heading during the birth** (Ed, 2026-08-21). Nothing
    // is being headed yet — the run is three clauses on an unsaved document —
    // and the table of contents already withholds its Constitution entry
    // until the save, so a heading here disagreed with the outline beside it.
    { key: 'constitution', label: cs ? 'Constitution' : '',
      // **The birth has no sections** (Ed, 2026-08-21: *during the birth we
      // don't need to see the Membership section*). Before the save there is
      // no constitution to divide up — the run is the title, the link and
      // 📧, all three in this group's own `lead`. The band used to take its
      // sections from whatever had a visible card, and 📧 is a Membership
      // key, so a *Membership* heading, a *Members* subheading and an empty
      // list stood on a document that did not exist yet. The rail still
      // enumerates from `secLive()`, which is what keeps the birth's own
      // tasks in it.
      sections: cs ? secLive() : [],
      // Founded by [avatar] [name] — from the save (Q640), gaining its time
      // at the 🍾 press; a founder who set no name is Anonymous like anybody
      // else (§9.0c). **It is where ✒️ and 🛡️ hang their tabs** (Q639 (a)).
      lead: (h) => titleGovPara(h) +
        // the link's own answer-task still draws here; the two grants it
        // carries do not — they are drawn on the Founded line below (Q639)
        (visible(card('slug')) ? h.para(card('slug')) +
          tasksFor(card('slug')).filter((t) => !onFoundedLine(t)).map((t) => h.para(t)).join('') : '') +
        // **The birth's third clause** (Ed, 2026-08-21): the document says
        // what is happening and wears the 📧 tab, so the card does not have
        // to say *Sent to…* and the founder can get back to their own
        // address from the document itself. It stands here for the whole of
        // the birth — open, unsent, and awaiting the link — because the tab
        // must not move: it used to be rendered by the Membership section's
        // own body while the card was open and by this line once the mail
        // was out, so the paragraph jumped up the page at the send.
        (!cs && visible(card('myemail')) ? h.para(card('myemail')) : '') +
        // 🌍 is about the document, not member privacy — the penultimate
        // clause of the opening section (Ed, 2026-08-19)
        (visible(card('chamber')) ? h.para(card('chamber')) + h.tasks(card('chamber')) : '') +
        // **The grants stand here** (Q639 (a), Ed 2026-08-22). Their own two
        // clauses — *The Founder holds the pen on 16 settings.* and its
        // shield twin — are retired: the count is already stated on every
        // setting the power turns (`holderLine`) and in the second person on
        // the wallet's own tooltip, so the clause was the third telling and
        // the one that went stale whenever a power was laid down. Every
        // *settings* clause wears ✒️ and 🛡️ for its **own** powers, so a
        // grant could not hang on one without putting two ✒️ tabs meaning
        // different things in one stack; the Founded line carries none, sits
        // in the opening run where the grants arrive, and already wears 👑 —
        // the mark that means *holds either power*. The tabs make the crown
        // clickable, which is the dividend rather than the cost.
        (cs ? (() => {
          const gc = [card('grant-pen'), card('grant-shield')].filter((c) => c && visible(c));
          // a member, a stranger, a founder who holds nothing: no pile, and
          // the line renders exactly as it always did
          return gc.some((c) => S.open === c.k) ? h.paraWith(card(S.open), gc)
            : '<div class="cpara' + (gc.length ? '' : ' notab') + '" data-para="founded">' +
              (gc.length ? h.pile(gc) : '') +
              '<div class="cptext">' + foundedClause() + '</div></div>'; })() : ''),
      textAnchor: (h) => (!visible(card('text')) ? ''
        : '<div class="cpara notab docsep"></div>' +
          (/^(text|pw:[ua]:text)$/.test(S.open || '') ? h.para(card('text'))
          : '<div class="cpara textanchor">' + h.pile(ctx.chipsFor(card('text'))) +
            '<h2 class="doctitle dochead" id="dochead">' + esc(S.title || 'Untitled') + '</h2></div>')),
      // **The birth counts its own three** (Ed, 2026-08-21). The note is
      // derived from the group's sections, and the birth has none — so it
      // announced *all confirmed* over a document whose address and whose
      // founder's own email were still to come. The birth is a fixed
      // three-act run, so before the save it counts the feathers: 🪶 🪶 🪶.
      note: (n) => { const left = cs ? n
        : ['title', 'slug', 'myemail'].map(card).filter((c) => c && !settled(c)).length;
        return left ? left + ' still to confirm or answer' : 'all confirmed'; } },
  ];

  const VALUE = {
    text: () => { const n = [...prose.children].filter((b) => b.textContent.trim()).length;
      return n ? n + ' blocks' : (S.seen.has('text') ? 'Starts empty — the room writes it' : 'Nothing yet'); },
    title: () => S.title || 'Not named yet',
    slug: () => 'docs.vote/' + (S.slug || '…'),
    invite: () => 'Everyone has to agree',
    remove: () => ({ everyone: 'Everyone has to agree, including them',
      others: 'Everyone else has to agree',
      ordinary: 'A proposal ✏️ like any other' }[removalRung()]),
    myemail: () => (S.emailVerified ? S.myemail + ' · verified'
      : S.emailSent ? 'Check your inbox' : 'Not given yet'),
    myname: () => S.myname || 'Not given yet',
    mypic: () => (S.mypic ? 'Chosen' : 'Your initials'),
    // an invitee is not a member yet (§9.6a): the line counts the arrived,
    // and says who is still only invited
    roster: () => arrived() + (arrived() === 1 ? ' member' : ' members') +
      (members().length > arrived() ? ' · ' + (members().length - arrived()) + ' invited' : '') +
      (iDraft() ? '' : ' · you are the clerk'),
    policy: () => { const v = takenValOf('policy');
      return ({ invite: 'Invitation only', proposed: 'Applications must be proposed by members',
        apply: 'Anyone may apply', open: 'Open' }[v ? v.joinPolicy : S.joinBy]) +
        ((cs && (regPair().u || regPair().a)) ? ' · 👑 reserved' : ''); },
    chamber: () => ({ link: 'Anyone with the link', closed: 'Members only',
      public: 'Public' }[takenOf('chamber') || S.chamber]),
    ending: () => (perpetual() ? 'Never — it runs until too few members are active'
      : new Date(endingVal() || S.endsAt).toLocaleString(undefined,
        { weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false })),
    bar: () => (takenOf('bar') || S.tClose) + '% sure at the end',
    pace: () => { const v = takenValOf('pace');
      const shape2 = v ? v.shape : S.shape;
      const start2 = v && v.shape === 'ramp' ? v.startPct : S.tStart;
      return (perpetual() ? 'Fixed — no end date to rise towards'
        : shape2 === 'ramp' ? 'Rising from ' + start2 + '%' : 'The same number throughout'); },
    quorum: () => (S.quorumForm === 'count'
      ? Math.min(takenOf('quorum') || S.quorumN, E()) + ' of ' + E()
      : (takenOf('quorum') || S.quorumPct) + '% — ' + quorumCount() + ' of ' + E()),
    authorship: () => ({ anonymous: 'Nobody’s name, ever', sealed: 'Names at the close',
      public: 'Names from the start' }[takenOf('authorship') || (S.authorship === 'roster' ? 'anonymous' : S.authorship)]),
    signing: () => ({ nobody: 'Nobody signs', each: 'Each author chooses', everybody: 'Everybody signs' }[
      takenOf('signing') || (S.signing === 'roster' ? 'nobody' : S.signing)]),
    judgments: () => ({ never: 'Never revealed', after: 'Revealed after the decision' }[
      takenOf('judgments') || (S.judgments === 'roster' ? 'never' : S.judgments)]),
    rate: () => { const v = takenValOf('rate');
      return (v ? v.grant : S.grant) + ' each · +1 every ' + (v ? v.dripMinutes : S.dripMin) +
        ' min · cap ' + (v ? v.cap : S.cap); },
    // (🌍 and 🤝 are stated once, above, module-first like every neighbour:
    // a second entry here used to override them and read S alone)
    machines: () => { const tv = takenValOf('machines');
      const on = tv ? tv.enabled : S.auditor === true;
      return (on ? 'AI proposals are permitted · ' + (tv && tv.enabled ? tv.budget : S.auditorBudget) + ' ✏️s' : 'No AI proposals'); },
    lapse: () => (S.lapse === 'never' ? 'Never — however long you are away'
      : 'After ' + S.lapseDays + ' days without logging in'),
    removal: () => ({ everyone: 'Everyone has to agree, including them',
      others: 'Everyone else has to agree', ordinary: 'A proposal ✏️ like any other' }[removalRung()]),
    canpropose: () => (canPropose() ? 'Open' : 'Waiting on the start'),
    'grant-voice': () => 'You hold a voice in every constitutional question',
    begin: () => (constituted() ? 'Begun' + foundedAt() : 'Not yet begun'),
    closing: () => (cs && cs.closed ? 'Closed' + closedAtWords() : ''),
    'grant-pen': () => 'You hold the pen',
    'grant-shield': () => 'You hold the shield',
    canjudge: () => (canJudge() ? 'Open' : 'Waiting on the constitution'),
  };
  const ANSVALUE = {
    quorum: (v) => 'You said ' + v + ' of ' + E(),
    bar: (v) => 'You said ' + v + '%',
    ending: (v) => (v === 'never' ? 'You said never'
      : 'You said ' + (isNaN(Date.parse(v)) ? v
        : new Date(v).toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false }))),
    authorship: (v) => 'You said ' + ({ anonymous: 'no names, ever', sealed: 'names at the close', public: 'names from the start' }[v] || v),
    signing: (v) => 'You said ' + ({ nobody: 'nobody signs', each: 'each author chooses', everybody: 'everybody signs' }[v] || v),
    judgments: (v) => 'You said ' + ({ never: 'never revealed', after: 'revealed after the decision' }[v] || v),
    chamber: (v) => 'You said ' + ({ closed: 'members only', link: 'anyone with the link', public: 'public' }[v] || v),
    policy: (v) => 'You said ' + ({ invite: 'invitation only', proposed: 'applications must be proposed by members', apply: 'anyone may apply', open: 'open' }[v] || v),
    machines: (v) => 'You said ' + (v ? 'AI proposals are permitted' : 'no AI proposals'),
    lapse: (v) => (v === 'never' ? 'You said never' : 'You said after ' + v + ' days without logging in'),
    removal: (v) => 'You said ' + ({ everyone: 'everyone has to agree, including them',
      others: 'everyone but them', ordinary: 'a proposal ✏️ like any other' }[v] || v),
    rate: (v) => 'You said ' + v,
  };
  const ANSASK = { quorum: 'The lowest you will accept', bar: 'The lowest you will accept',
    ending: 'The latest you will accept', authorship: 'The most you will accept',
    signing: 'The most you will accept', judgments: 'The most you will accept',
    chamber: 'The most you will accept', machines: 'The most you will accept',
    policy: 'The most open you will accept',
    lapse: 'The shortest you will accept',
    removal: 'The easiest you will accept',
    rate: 'The most generous you will accept' };
  const value = (c) => (c.ansFor
    ? esc(filled(c) ? ANSVALUE[c.ansFor](S.myAns[c.ansFor]) : ANSASK[c.ansFor])
    : esc(VALUE[c.k]()));
  // **A task you have to do needs no subtitle** (Ed, 2026-08-19: *subtitles
  // are there to help me make choices — if I have to do them, they don't need
  // extra information*; and on 📧, *the queue-card does not need "Not given
  // yet", that's why it's yellow*). The wash already says the state and the
  // title already says the question, so a line restating either was the rail
  // telling you twice. What survives is the two entries that are **not** asks
  // — a motion, whose subtitle is the thing being proposed and is exactly the
  // information you need to decide whether to open it, and a decision arriving
  // as news, where what happened is the whole point.
  const summary = (c) => {
    const m = motionOn(c);
    if (m) return 'Under motion — ' + esc(m.to);
    if (stateOf(c, ctx) === 'news') return value(c);
    return '';
  };

  // **What is unlocked, and by what.** Reading needs nothing. Proposing and
  // judging both open at the start (§9.0b, Q606, 2026-08-22): there is no
  // state between 📄 and 🍾 where proposals are open, because the text a
  // proposal is made against is decided as part of the start, and a judgment
  // is *recorded under a disclosure setting* and *counted towards a quorum*,
  // neither of which can be decided after it without changing what it was.
  // `canPropose` used to be true from the text alone, so the topbar read
  // *proposals open* on a document that had not begun.
  const canPropose = () => !!cs && cs.textConfirmed && constituted();
  const ceremony = () => CARDS.filter((c) => c.gate === 'judge');
  const canJudge = () => !!cs && cs.canJudge();

  // **A power is not held until it has been acknowledged** (Ed, 2026-08-21:
  // *I should not be able to do actions until I have acknowledged that I have
  // been given the right to do them. I shouldn't be shown actions that I
  // can't do.*)
  //
  // The grant *is* the conferring act, so the OK on it is not a receipt for
  // something already true — it is the moment the thing becomes true. Until
  // then the act is refused **and never offered**. Acknowledgment had gated
  // exactly three `style.display` lines (the ✏️ ✒️ 🏛️ wallets) and nothing
  // else, which is the rule inside out: the receipt was hidden while the
  // power ran. `may*` is therefore the only thing any control may ask;
  // `can*` stays what the *document* permits, which is what the grant card
  // itself reads to know whether it has opened.
  //
  // Where the distinction lands on the surface: an **offer** disappears (the
  // caret in the charter, ✏️ propose edit, a motion composer, the ✒️
  // commit) — you are not shown an act you cannot take. A **question put to
  // you** stays visible and goes `locked` (a race card), because it still
  // has to be readable; that is the state cards.js already draws for a card
  // whose reader may not judge it.
  const acked = (k) => S.okd.has(k);
  const mayPropose = () => canPropose() && viewerIsMember() && acked('canpropose');
  const mayJudge = () => canJudge() && viewerIsMember() && acked('canjudge');
  const mayVoice = () => !!cs && viewerIsMember() && !!viewerRow().in && acked('grant-voice');
  const mayPen = () => !!cs && amFounder() && holdsPenAnywhere() && acked('grant-pen');
  // **The shield has a grant of its own** (`grant-shield`, since d20f67a — the
  // purer reading of *no power arrives without acknowledgment* that Q532 asked
  // for): it used to ride the pen's OK, since both powers arrive in the
  // founder's hands by one act, but they are opposite powers and a founder
  // who has pressed OK on one card saying "your powers" has learned one thing
  // where there were two.
  const mayShield = () => !!cs && amFounder() && holdsShieldAnywhere() && acked('grant-shield');
  // A commit that spends out of a wallet needs that wallet to have arrived.
  // The pen is the one this bites for: `holdWallet` reads ✒️ as a **hold**
  // only while the glyph is in the topbar, so before the grant was
  // acknowledged a pen commit quietly degraded into a plain click — the hold
  // discipline disappearing exactly where the founder is being taught it.
  // Gates hold a position in the founding order without blocking it, so a
  // settings card really can arrive before ✒️ has been accepted.
  const penOkFor = (glyph) => glyph !== '✒️' || mayPen();
  const penWaitTitle = 'Your pen is waiting in your tasks — accept it and this turns.';

  // ---- motions (stage D of the merge, Ed 361) ---------------------------
  // A motion is the act of changing a **settled** document's rules (§9.6a):
  // before judging opens there are no past decisions for a change to re-rate,
  // so nothing is amended, only set — the founder re-sets freely, and these
  // exist only once the constitution is settled and judging is open.
  const motionsLive = () => canJudge();
  // ---- motions live in the module (9c): the page renders records --------
  const motionTargets = (rec) =>
    rec.payload.kind === 'invite' ? 'invite'
    : rec.payload.kind === 'remove' ? 'remove'
    : pkeyOf(rec.payload.kind === 'set' || rec.payload.kind === 'reserve'
      ? rec.payload.setting : 'membership');
  const nameOfMember = (mid2) => {
    const row = S.roster.find((r) => (r.mid || 'founder') === mid2);
    return row ? (row.n || row.e || mid2) : mid2;
  };
  // what a typed motion proposes, said in the page's own vocabulary
  const motionDisplay = (rec) => {
    const p = rec.payload;
    if (p.kind === 'reserve') {
      const rc = card(pkeyOf(p.setting));
      return 'Returns ' + (rc ? '“' + rc.t + '”' : p.setting) + ' to the founder’s reserve';
    }
    if (p.kind === 'invite') return p.email.split('@')[0] + ' joins the membership';
    if (p.kind === 'remove') return nameOfMember(p.member) + ' leaves the membership';
    if (p.kind === 'admit') return 'an applicant joins the membership';
    const k = pkeyOf(p.setting);
    if (k === 'title') return p.value.text;
    if (k === 'slug') return 'docs.vote/' + p.value.slug;
    if (k === 'pace') return (p.value.shape === 'fixed' ? 'The same number throughout'
      : 'Rising from ' + p.value.startPct + '%');
    if (k === 'policy') return ({ invite: 'Invitation only', proposed: 'Applications must be proposed by members',
      apply: 'Anyone may apply', open: 'Open' })[p.value.joinPolicy];
    if (k === 'rate') return p.value.grant + ' each, up to ' + p.value.cap +
      ', one every ' + p.value.dripMinutes + ' minutes';
    return STANDS[k] ? STANDS[k](PAGEVAL[k](p.value)) : JSON.stringify(p.value);
  };
  const pageMotion = (rec) => ({ id: rec.id, kind: rec.route, by: rec.by,
    why: rec.why || '', to: motionDisplay(rec), status: rec.status,
    invite: rec.payload.kind === 'invite' ? rec.payload.email.split('@')[0] : undefined,
    removee: rec.payload.kind === 'remove' ? rec.payload.member : undefined });
  const liveMotionRec = (c) => {
    if (!cs || !c || c.isGate || c.ansFor || !motionsLive()) return null;
    for (const rec of cs.motionRecords().values()) {
      if (rec.status !== 'running' && rec.status !== 'awaiting-crown') continue;
      if (motionTargets(rec) === c.k) return rec;
    }
    return null;
  };
  const motionOn = (c) => { const rec = liveMotionRec(c); return rec ? pageMotion(rec) : null; };
  const routeOfM = (m) => m.kind;
  // the same two-act gesture (363a): the radio is provisional, the ✓ commits.
  // Constitutional commits are answerMotion; ordinary judging is a page-side
  // marker feeding the dev adjudication seam (the engine's job post-368).
  const myMAnsOk = () => (viewerRow().mAnsOk || (viewerRow().mAnsOk = new Set()));
  const motionPicked = (c) => S.mAns[c.k] !== undefined;
  const answeredMotion = (c) => {
    const rec = liveMotionRec(c);
    if (!rec) return false;
    if (rec.route === 'constitutional') return rec.answers.has(viewerId());
    return motionPicked(c) && myMAnsOk().has(c.k);
  };
  const motionJudged = (k) => {
    const rec = liveMotionRec(card(k));
    if (!rec) return 0;
    if (rec.route === 'constitutional') return rec.answers.size;
    return S.roster.filter((r) => r.mAnsOk && r.mAnsOk.has(k)).length;
  };
  // one 🏛️ out per member at a time (Ed, Q327): withdrawn, it comes back whole
  const myHeldOut = () => {
    if (!cs) return null;
    for (const rec of cs.motionRecords().values()) {
      if ((rec.status === 'running' || rec.status === 'awaiting-crown') &&
        rec.route === 'constitutional' && rec.by === viewerId()) {
        return motionTargets(rec);
      }
    }
    return null;
  };
  // DEV SEAM: the mock has no race engine, so an ordinary motion is
  // adjudicated the moment every member has judged it — carried if the
  // proposal out-polls what stands ('either' counts to neither side).
  // Post-368 the caller of adjudicateOrdinaryMotion is a real race (§9.6).
  function maybeAdjudicate(rec, k) {
    if (cs && cs.isRemote) return; // the engine adjudicates (Q391a)
    const rows = S.roster.filter((r) => r.role !== 'clerk' && r.in);
    if (!rows.every((r) => r.mAnsOk && r.mAnsOk.has(k))) return;
    const votes = rows.map((r) => (r.mAns || {})[k]);
    const up = votes.filter((v) => v === 'proposed').length;
    const down = votes.filter((v) => v === 'stands').length;
    try { cs.adjudicateOrdinaryMotion(now(), rec.id, up > down ? 'carried' : 'held');
      syncFromCs(); }
    catch (e) { console.warn('[cs]', e && e.message); }
    rows.forEach((r) => { if (r.mAns) delete r.mAns[k]; if (r.mAnsOk) r.mAnsOk.delete(k); });
  }
  // the typed value rides along as the draft is composed (d.val); the two
  // membership sentences parse at commit, where the row is at hand
  function draftPayload(d) {
    const dc = card(d.k);
    if (dc && dc.reg) {
      if (/ leaves the membership$/.test(d.to)) {
        const nm = d.to.replace(/ leaves the membership$/, '');
        const row = S.roster.find((r) => (r.n || r.e) === nm);
        return { kind: 'remove', member: row && row.mid ? row.mid : FOUNDER };
      }
      const who = d.to.replace(/ joins the membership$/, '');
      return { kind: 'invite', email: who.includes('@') ? who
        : who.toLowerCase().replace(/\s+/g, '.') + '@invited.example' };
    }
    if (!d.val) throw new Error('no typed value on the draft');
    return { kind: 'set', setting: midOf(d.k), value: d.val };
  }
  // a lane's display string → its typed value, one table (never parsed back)
  const MVAL = {
    pace: { 'The same number throughout': { shape: 'fixed' } },
    ending: { 'Never — it runs until too few members are active': { endsAtMs: null } },
    lapse: { 'Never — however long you are away': { afterMs: null } },
    removal: { 'Everyone has to agree, including them': { rung: 'everyone' },
      'Everyone else has to agree': { rung: 'others' },
      'A proposal ✏️ like any other': { rung: 'ordinary' } },
    machines: { 'No AI proposals': { enabled: false, budget: 0 } },
    // **Public has left the ladder** (Ed, 2026-08-22). It is offered nowhere
    // — not here, not on the founder's card, not in a member's answer — but
    // every map that *reads* a rung back still knows it: the module's
    // catalogue still holds it, so a document that took it before today
    // still states its own rule truthfully rather than printing a raw value.
    chamber: { 'Members only': { rung: 'closed' }, 'Anyone with the link': { rung: 'link' } },
    authorship: { 'Nobody’s name, ever': { rung: 'anonymous' }, 'Names at the close': { rung: 'sealed' }, 'Names from the start': { rung: 'public' } },
    signing: { 'Nobody signs': { rung: 'nobody' }, 'Each author chooses': { rung: 'each' }, 'Everybody signs': { rung: 'everybody' } },
    judgments: { 'Never revealed': { rung: 'never' }, 'Revealed after the decision': { rung: 'after' } },
  };
  // **A change carries a reason, and says who made it** (Q530, Ed
  // 2026-08-22). The pen is the only route that changes a rule without
  // asking anybody, and it was the only one that left no reason behind —
  // which is backwards: a change nobody got to argue about is the one most
  // worth explaining. Two halves of one object, and which you meet depends
  // on which side of the act you stand: the founder is offered a lane to
  // write in, and everybody else is told what changed and reads what they
  // wrote.
  //
  // **Neither appears on a first decision.** A founder answering a question
  // for the first time has changed nothing — there is no *from* — and a room
  // told that the founder has decided fifteen things nobody asked them about
  // is noise rather than news. §9.6a says the same thing in the spec's own
  // words: before the start nothing is amended, only set. The test is the
  // module's `previousValue`, which folds from events the log already
  // carried, so no event shape moved to get it.
  //
  // A value in words, for the *from* half of the sentence. It has to be its
  // own map: the surface's existing short forms (`RESULT`) read the current
  // value out of `S`, and MVAL only knows the values a motion may offer —
  // neither can be handed an arbitrary past value and asked what it says.
  const WORDS = {
    title: (v) => '“' + v.text + '”',
    slug: (v) => 'docs.vote/' + v.slug,
    chamber: (v) => ({ closed: 'members only', link: 'anyone with the link',
      public: 'public' }[v.rung] || v.rung),
    policy: (v) => ({ invite: 'invitation only', proposed: 'applications must be proposed by members',
      apply: 'anyone may apply', open: 'open' }[v.joinPolicy] || v.joinPolicy),
    lapse: (v) => (v.afterMs === null ? 'never'
      : Math.round(v.afterMs / 86400000) + ' days'),
    removal: (v) => ({ everyone: 'everyone agreeing, them included',
      others: 'everyone else agreeing', ordinary: 'a proposal like any other' }[v.rung] || v.rung),
    ending: (v) => (v.endsAtMs === null ? 'never'
      : new Date(v.endsAtMs).toLocaleString(undefined,
        { weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false })),
    bar: (v) => v.pct + '%',
    pace: (v) => (v.shape === 'ramp' ? 'rising from ' + v.startPct + '%'
      : 'the same number throughout'),
    quorum: (v) => (v.form === 'share' ? v.n + '% of the members' : v.n + ' members'),
    authorship: (v) => ({ anonymous: 'nobody ever named', sealed: 'names at the close',
      public: 'names from the start' }[v.rung] || v.rung),
    signing: (v) => ({ nobody: 'nobody signs', each: 'each author chooses',
      everybody: 'everybody signs' }[v.rung] || v.rung),
    judgments: (v) => ({ never: 'never revealed',
      after: 'revealed after the decision' }[v.rung] || v.rung),
    rate: (v) => v.grant + ' ✏️ to start, up to ' + v.cap +
      ', one more every ' + v.dripMinutes + ' minutes',
    machines: (v) => (v.enabled ? 'on, with a budget of ' + v.budget + ' ✏️'
      : 'no AI proposals'),
  };
  const wordsFor = (k, v) => { if (v === null || v === undefined) return null;
    try { return WORDS[k] ? String(WORDS[k](v)) : null; } catch (e) { return null; } };
  // what this setting held before the founder last set it — null on a first
  // decision, which is the whole test
  const changedFrom = (k) => { const st = csState(k); return st ? (st.previousValue || null) : null; };
  const setWhyOf = (k) => { const st = csState(k); return st ? (st.setWhy || null) : null; };
  // a setting that already holds a value: committing the pen here is a change
  const isChange = (k) => { const st = csState(k); return !!(st && st.value !== null); };
  // **The founder's rationale is not sealed** (Ed, 2026-08-22: *the rationale
  // should have the founder's name and avatar on it, and 👑 so people know it
  // was a founder action, even if they have no name or avatar*). Every other
  // rationale on this surface wears the featureless disc because authorship
  // is sealed until the record (§3.4). A ✒️ act is attributed **by
  // construction** — only the founder can perform it — so the disc would be a
  // lie the first time it was drawn. The 👑 carries the whole sentence on its
  // own: an anonymous founder has no name and no picture, and the mark still
  // says *this was the founder's own hand*.
  const founderSpeaker = (why) => {
    const f = founderInfo();
    return '<div class="speaker founderspoke">' + avHtml(f) +
      '<div class="spksaid"><span class="who">' + esc((f.n || '').trim() || 'The Founder') +
      ' <span title="The founder’s own hand — a ✒️ act, not a proposal">👑</span></span>' +
      (why ? '<div class="said">' + esc(why) + '</div>'
        : '<div class="said none">No reason given.</div>') + '</div></div>';
  };
  // the same speaker, with the reason still being written. It is the
  // editing-card's own arrangement — you write the sentence in the place and
  // at the weight everybody else will read it in — with the founder's face
  // where a member's would be sealed.
  const founderSpeakerLane = (v) => {
    const f = founderInfo();
    return '<div class="speaker founderspoke">' + avHtml(f) +
      '<div class="spksaid"><span class="who">' + esc((f.n || '').trim() || 'The Founder') +
      ' <span title="The founder’s own hand — a ✒️ act, not a proposal">👑</span></span>' +
      '<div class="said edit-why' + (v ? '' : ' blank') + '" contenteditable="plaintext-only"' +
      ' spellcheck="false" data-setwhy="1"' +
      ' data-placeholder="I am changing this because…">' + esc(v) + '</div></div></div>';
  };
  const mvalTyped = (k, disp) => {
    if (k === 'policy') {
      const jp = { 'Invitation only': 'invite', 'Applications must be proposed by members': 'proposed',
        'Anyone may apply': 'apply', 'Open': 'open' }[disp];
      return jp ? { joinPolicy: jp } : null;
    }
    if (card(k) && card(k).reg) return null; // membership sentences parse at commit
    return (MVAL[k] || {})[disp] || null;
  };
  // **The settled card is the composer** (Ed, 2026-08-18) — for any member,
  // on any settled setting, once the document is live. The founder is the
  // one exception on the settings they reserved: their control there is
  // unilateral (the 👑 rule, consented on the way in), so they keep the
  // setting body itself rather than a composer.
  // §9.7 v0.54: the founder's direct hand IS the unilateral power — where
  // it is given up (assent-only state) the founder composes like a member
  const founderDirect = (c) => {
    // direct removal is not built (the removal-policy setting will decide
    // its routes) — the founder composes a removal like any member
    if (c.k === 'remove') return false;
    if (c.reg) return regPair().u;
    const st = csState(c.k);
    return !st || st.powers.unilateral; };
  // the 👑 question exists exactly where the assent power is held
  const crownWaits = (c) => {
    if (c.reg) return regPair().a;
    const st = csState(c.k);
    return st ? st.holder === 'convenor' && st.powers.assent : !membersHold(c); };
  // The register counts as settled here (Ed's QA, 2026-08-19: *I can't seem
  // to suggest removing a member*): it has no value to settle, and what it
  // is, it always is — without this the membership card never composed, and
  // invitations and removals had no door.
  const composerOn = (c) => motionsLive() && viewerIsMember() && !c.isGate && !c.ansFor &&
    c.kind !== 'personal' && c.k !== 'text' && c.k !== 'roster' && settled(c) && !motionOn(c) &&
    !(amFounder() && !membersHold(c) && founderDirect(c));
  const commitFor = (c) => motionCommitHtml(c,
    (S.draft && S.draft.k === c.k) ? S.draft.to : '',
    !!myHeldOut() && myHeldOut() !== c.k);

  /* **A motion is composed with the setting's own control** (motion-controls),
     and the grammar is session-view's, via cards.js (Ed, 2026-08-18: *the
     composers on the session-view are the better ones*): the lane radios are
     laneBarHtml speaking data-mval, the rationale is the editing-card's own
     sealed-disc speaker — never an avatar, since authorship is sealed. */
  const PC = window.CARDS.make({ valAttr: 'data-mval', pickOf: (d) => (d ? d.to : null) });
  const laneBlock = (d, val, text) =>
    '<div class="propblock"><div class="rtext">' + text + '</div>' +
    PC.laneBarHtml(d, val, { edit: false }) + '</div>';
  const inputBlock = (html, note) =>
    '<div class="propblock"><div class="rtext">' + html + '</div>' + (note || '') + '</div>';
  // **What stands on a delegated setting is what the room's answers took**,
  // never the founder's field — that still says 'roster'. The consent rule,
  // computed live: highest for quorum and the bar, latest for the ending
  // (never latest of all), longest for lapse, most private for the privacy
  // family, most restrictive for machines, most generous for the rate.
  // what the room settled — the ceremony's resolution, a carried motion, a
  // crown-accepted change — translated back into the page's vocabulary.
  // Anything settled away from the convenor's own hand outranks the page's
  // provisional fields (v0.48: motions now apply).
  const takenOf = (k) => {
    const st = csState(k);
    if (!st || st.settledBy === null || st.settledBy === 'convenor' || st.value === null) return null;
    return PAGEVAL[k] ? PAGEVAL[k](st.value) : null;
  };
  // the whole typed value where one number is not enough (the rate)
  const takenValOf = (k) => {
    const st = csState(k);
    return st && st.settledBy !== null && st.settledBy !== 'convenor' ? st.value : null;
  };
  // a carried title or link changed under the page's mirrors — resync; and
  // the rows follow the register (carried invitations, removals, admissions)
  const syncFromCs = () => {
    if (!cs) return;
    const tv = csState('title'), lv = csState('slug');
    if (tv && tv.settledBy === 'motion' && tv.value.text !== S.title) S.title = tv.value.text;
    if (lv && lv.settledBy === 'motion' && lv.value.slug !== S.slug) S.slug = lv.value.slug;
    for (const [mid2, rec] of cs.memberRecords()) {
      if (mid2 === FOUNDER) continue;
      const row = S.roster.find((r) => r.mid === mid2);
      if (!row && !rec.removed) {
        S.roster.push({ n: rec.name || rec.email.split('@')[0], e: rec.email,
          role: 'member', in: rec.arrivedAtT !== null, mid: mid2, ans: {}, okd: new Set() });
      } else if (row && rec.removed) {
        const at = S.roster.indexOf(row);
        S.roster.splice(at, 1);
        if (S.viewer === at) S.viewer = 0;
      } else if (row && rec.arrivedAtT !== null && !row.in) {
        row.in = true;
      }
    }
  };
  // ...stated in the composers' own vocabulary, so a lane equal to what
  // stands filters itself out
  const STANDS = {
    chamber: (v) => ({ closed: 'Members only', link: 'Anyone with the link', public: 'Public' })[v],
    policy: (v) => ({ invite: 'Invitation only', proposed: 'Applications must be proposed by members', apply: 'Anyone may apply', open: 'Open' })[v],
    authorship: (v) => ({ anonymous: 'Nobody’s name, ever', sealed: 'Names at the close', public: 'Names from the start' })[v],
    signing: (v) => ({ nobody: 'Nobody signs', each: 'Each author chooses', everybody: 'Everybody signs' })[v],
    judgments: (v) => ({ never: 'Never revealed', after: 'Revealed after the decision' })[v],
    lapse: (v) => (v === 'never' ? 'Never — however long you are away' : 'After ' + v + ' days without logging in'),
    removal: (v) => ({ everyone: 'Everyone has to agree, including them',
      others: 'Everyone else has to agree',
      ordinary: 'A proposal ✏️ like any other' })[v],
    machines: (v) => (v ? 'AI proposals are permitted' : 'No AI proposals'),
    quorum: (v) => (S.quorumForm === 'count' ? v + ' of the membership' : v + '% of the membership'),
    bar: (v) => v + '% sure at the end',
    ending: (v) => (v === 'never' ? 'Never — it runs until too few members are active'
      : new Date(v).toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false })),
    rate: (v) => { const tv = takenValOf('rate');
      return v + ' each · +1 every ' + (tv ? tv.dripMinutes : S.dripMin) +
        ' min · cap ' + (tv ? tv.cap : S.cap); },
  };
  const standsOf = (k) => {
    const c = card(k);
    if (c && isRoom(c)) {
      const v = takenOf(k);
      if (v !== null && STANDS[k]) return STANDS[k](v) || '';
    }
    return VALUE[k] ? String(VALUE[k]() || '') : '';
  };
  // what stands is never offered back: picking the current rule is not a change
  const currentOf = (k) => standsOf(k);
  // **Filtered by value, never by label** (Q620 (a), 2026-08-22). The old
  // test was `currentOf(k).startsWith(label)`, a string comparison between a
  // lane's label and the standing rule's sentence — so it held only while
  // STANDS and the composer happened to spell a rung the same way, and one
  // label per rung everywhere is now the rule rather than the accident. A
  // lane is what stands when its typed value equals the module's (or, before
  // the module holds one, the founder's own fields typed the same way).
  const standsTyped = (k) => { const st = csState(k);
    return st && st.value !== null ? st.value : (TYPED[k] ? TYPED[k]() : null); };
  const offersStanding = (k, label) => { const v = mvalTyped(k, label), s = standsTyped(k);
    return v && s ? JSON.stringify(v) === JSON.stringify(s) : currentOf(k).startsWith(label); };
  const lanesFor = (d, pairs, k) => pairs.filter(([val]) => !offersStanding(k, val))
    .map(([val, text]) => laneBlock(d, val, text)).join('');
  const whyLane = (d) =>
    '<div class="lanebox whylane"><div class="speaker">' +
    '<span class="disc" aria-hidden="true" title="This is how your reason will reach everybody else: with your name off it."></span>' +
    '<div class="said edit-why" contenteditable="plaintext-only" spellcheck="false" data-motionlane="why"' +
    ' data-placeholder="We should change this because…">' + esc((d && d.why) || '') + '</div></div></div>';

  const POLICY_TEXTS = [
    ['Invitation only', 'Membership is by invitation only.'],
    ['Applications must be proposed by members', 'Anyone may apply, but an application must be proposed ✏️ by a member.'],
    ['Anyone may apply', 'Anyone may apply to join.'],
    ['Open', 'Anyone with the link joins on arrival.'],
  ];
  // every composable setting has its control (Ed's QA, 2026-08-18) — a text
  // box asks somebody to guess a format the surface already knows
  const PROPOSE = {
    title: (d) => inputBlock('The document is titled ' +
      '<input data-mtext="1" value="' + esc(d.to || S.title) + '" style="width:22rem">.'),
    slug: (d) => inputBlock('The document lives at docs.vote/' +
      '<input data-mslug="1" value="' + esc((d.to || S.slug).replace(/^docs\.vote\//, '')) + '" style="width:12rem">.',
      '<p class="setnote">Every link the document has ever had keeps working — a change leaves a redirect behind.</p>'),
    pace: (d) => lanesFor(d, [['The same number throughout',
        'The approval threshold stays the same all the way through.']], 'pace') +
      inputBlock('The approval threshold starts at ' +
        '<input class="num" type="number" min="50" max="99" data-mpace="1" value="' +
        esc((/^Rising/.test(d.to) && (d.to.match(/\d+/) || [])[0]) || S.tStart) + '">% and rises to the number at the end.'),
    rate: (d) => {
      const n = d.to.match(/\d+/g) || [];
      return inputBlock('Members start with ' +
        '<input class="num" type="number" min="0" max="40" data-mrate="x" value="' + esc(n[0] || S.grant) + '"> ✏️ each, up to a maximum of ' +
        '<input class="num" type="number" min="1" max="99" data-mrate="y" value="' + esc(n[1] || S.cap) + '">. They get an additional ✏️ every ' +
        '<input class="num" type="number" min="5" max="2880" data-mrate="z" value="' + esc(n[2] || S.dripMin) + '"> minutes.');
    },
    ending: (d) => {
      const never = /never/i.test(d.to);
      return inputBlock('The drafting process will end on ' +
          '<input type="datetime-local" data-mdate="1" value="' + esc(S.endsAt || '') + '">.') +
        lanesFor(d, [['Never — it runs until too few members are active',
          'The drafting process has no set end — it runs until too few members are active.']], 'ending') +
        (never ? '<p class="setnote">Taking the end date away needs everyone to agree — with no end date the approval threshold cannot rise.</p>' : '');
    },
    bar: (d) => inputBlock('A proposal passes when the members are ' +
      '<input class="num" type="number" min="50" max="99" data-mnum="% sure at the end" value="' +
      esc((d.to.match(/\d+/) || [])[0] || takenOf('bar') || S.tClose) + '">% sure at the end.'),
    quorum: (d) => (S.quorumForm === 'count'
      ? inputBlock('Quorum is <input class="num" type="number" min="1" max="99" data-mnum=" of the membership" value="' +
        esc((d.to.match(/\d+/) || [])[0] || takenOf('quorum') || quorumCount()) + '"> of the membership.')
      : inputBlock('Quorum is <input class="num" type="number" min="1" max="100" data-mnum="% of the membership" value="' +
        esc((d.to.match(/\d+/) || [])[0] || takenOf('quorum') || S.quorumPct) + '">% of the membership.')),
    removal: (d) => lanesFor(d, [
      ['Everyone has to agree, including them', 'Removing a member needs everyone to agree, including them.'],
      ['Everyone else has to agree', 'Removing a member needs every other member to agree.'],
      ['A proposal ✏️ like any other', 'A member is removed by a proposal, judged like any other.']], 'removal'),
    lapse: (d) => lanesFor(d, [['Never — however long you are away',
        'A membership never lapses, however long somebody is away.']], 'lapse') +
      inputBlock('A membership lapses after ' +
        '<input class="num" type="number" min="7" max="720" data-mnum=" days without logging in" value="' +
        esc((d.to.match(/\d+/) || [])[0] || S.lapseDays) + '"> days without logging in.'),
    authorship: (d) => lanesFor(d, [
      ['Nobody’s name, ever', 'A proposer is never named — not even in the closing record.'],
      ['Names at the close', 'Proposers are named in the closing record, never before.'],
      ['Names from the start', 'Every proposal carries its proposer’s name from the moment it is made.']], 'authorship'),
    signing: (d) => lanesFor(d, [
      ['Nobody signs', 'No proposal carries a signature.'],
      ['Each author chooses', 'A proposer may sign or stay unsigned, proposal by proposal.'],
      ['Everybody signs', 'Every proposal is signed.']], 'signing'),
    judgments: (d) => lanesFor(d, [
      ['Never revealed', 'Judgments are never revealed — not even in the closing record.'],
      ['Revealed after the decision', 'Judgments are published with the record of each decision, never before.']], 'judgments'),
    chamber: (d) => lanesFor(d, [
      ['Members only', 'Only members can read the document.'],
      ['Anyone with the link', 'Anyone with the link can read it; it is not listed.']], 'chamber'),
    machines: (d) => lanesFor(d, [['No AI proposals', 'There are no AI proposals — people write everything in this document.']], 'machines') +
      inputBlock('AI proposals are permitted, with a budget of ' +
        '<input class="num" type="number" min="1" max="40" data-mnum=" ✏️s for the coherence auditor" value="' +
        esc(S.auditorBudget) + '"> ✏️s.'),
    policy: (d) => lanesFor(d, POLICY_TEXTS, 'policy') +
      '<p class="setnote">One motion proposes one rule; what you do not touch stands.</p>',
    // ✉️: whom to bring in — the invite half of what was one roster
    // composer (Ed, 2026-08-19, 400a)
    invite: (d) =>
      '<div class="roster"><div class="addrow"><input placeholder="Somebody to invite" data-mjoin="1">' +
      '<button class="btn" data-mjoinbtn="1">Invite</button></div></div>' +
      '<p class="setnote">An invitation is constitutional, because who is in the room is what quorum is a fraction of: everyone consents, and one member who says no keeps them out.</p>',
    // ❌: the membership, in front of you, with an ✕ beside each — which
    // is what “propose a removal” means
    remove: (d) =>
      '<div class="roster">' + S.roster.map((p, i) =>
        '<div class="rperson' + (d.to === (p.n || p.e) + ' leaves the membership' ? ' picked' : '') + '">' +
        avHtml(p) + '<span><span class="nm">' + esc(p.n || p.e || '—') +
        (i === S.viewer ? ' <span class="chip">you</span>' : '') + '</span></span>' +
        (i === S.viewer ? '<span class="xdrop"> </span>'
          : '<button class="xdrop" data-mval="' + esc((p.n || p.e) + ' leaves the membership') + '"' +
            ' title="Propose that they leave">✕</button>') +
        '</div>').join('') + '</div>' +
      // no route note: the 🥾 clause states how a removal is decided, and
      // hardcoding one rung here lied under the other two (copy pass,
      // 2026-08-19)
      '<p class="setnote">Whoever it is will see the proposal — nobody is removed in secret.</p>',
  };

  // A constitutional motion re-opens consent: what is proposed, what stands,
  // two answers, one refusal keeps what stands. The pick markup is one
  // helper — invite, removal and the generic body differ only in copy.
  const consentPicks = (key, opts) => '<div class="choice" role="radiogroup">' +
    opts.map(([v, label, exp]) =>
      '<div class="pick' + (S.mAns[key] === v ? ' on' : '') + '"><button class="lanepick"' +
      ' aria-pressed="' + (S.mAns[key] === v) + '" data-motion="' + v + '"><span class="dot"></span>' +
      '<span>' + label + '</span></button>' +
      '<span class="exp">' + exp + '</span></div>').join('') + '</div>';
  const inviteBody = (m) =>
    '<p class="why">Whether <b>' + esc(m.invite) + '</b> joins the membership. Adding a member changes what quorum is a fraction of, so it is constitutional: the most restrictive answer wins, and one member who says no keeps them out.</p>' +
    consentPicks('invite', [
      ['no', 'I would rather they did not', 'They stay out. Nobody is told who said so.'],
      ['yes', 'I accept them joining', 'They start with the ✏️s everyone got, plus what the drip has added since, and quorum recomputes.'],
      ['abstain', 'Abstain', 'An answer, not a block: they can join without your consent counting either way.'],
    ]) + BLINDNOTE;
  const removeBody = (m) => {
    const nm = nameOfMember(m.removee);
    // 🏛️ without [avatar] (Q401a): under 'others' the subject sees the
    // motion running against them — ruled, Ed 2026-08-19 — and is asked
    // nothing; it settles without them.
    if (removalRung() === 'others' && m.removee && m.removee === viewerId()) {
      return '<p class="why">Whether <b>you</b> leave the membership. Under this document’s rule that is decided by <b>everyone but you</b> — you see it running, and your answer is not asked.</p>' +
        '<p class="setnote">' + (m.judged || 0) + ' of ' + Math.max(E() - 1, 0) + ' have answered. One refusal keeps you in.</p>';
    }
    return '<p class="why">Whether <b>' + esc(nm) + '</b> leaves the membership. Removing a member changes what quorum is a fraction of, so it is constitutional — ' +
    (removalRung() === 'others'
      ? 'decided by everyone but them; they see it running.'
      : 'and their own answer counts among everyone’s.') + '</p>' +
    consentPicks('remove', [
      ['no', 'They stay', 'Nobody is told who said so.'],
      ['yes', 'I accept their leaving', 'Their judgments already cast keep counting; quorum recomputes.'],
      ['abstain', 'Abstain', 'An answer, not a block.'],
    ]) + BLINDNOTE;
  };
  const consentBody = (c, m) => (m.invite ? inviteBody(m)
    : m.removee !== undefined ? removeBody(m) :
    '<p class="why">Whether <b>' + esc(m.to) + '</b> replaces <i>' + esc(standsOf(c.k)) + '</i>. Nothing is being judged: you state what you will accept, and one refusal keeps what stands.</p>' +
    consentPicks(c.k, [
      ['no', 'Keep what stands', 'Nobody is told who said so.'],
      ['yes', 'I accept the change', 'It passes once all ' + E() + ' stand at accept — or abstain.'],
      ['abstain', 'Abstain', 'An answer, not a block: the motion can pass without your consent counting either way.'],
    ]) + BLINDNOTE);

  // dev only (with the dropdown, Ed 362): complete the founding in one press,
  // because motions live on the far side of it and the mock has no persistence
  // ⏩ settle the founding — now a scripted drive of REAL module commands
  // (plan 367a: the strongest single assertion — the module-driven page must
  // render what the state-poked page rendered)
  function devFastForward() {
    if (!S.title) { S.title = 'The Hollow Oak Club — House Charter'; }
    if (!S.slug) { fillSuggestedSlug(); }
    const f = S.roster[0];
    if (!f.e) f.e = 'ash@hollowoak.org';
    if (!f.n) f.n = 'Ash Bellamy';
    S.emailSent = true; S.emailVerified = true;
    try {
      if (!cs) {
        cs = window.cs = M.ConstitutionSession.open({ title: S.title, slug: S.slug,
          convenor: { id: FOUNDER, email: f.e, isMember: f.role !== 'clerk' } }, now());
      }
      // **⏩ answers ✋ and 🖼️ too** (Q645). Both are real tasks now rather
      // than cards `hydrateS` declared settled, so a stagehand that only names
      // the founder leaves 🖼️ standing and the founding is not settled. The
      // picture is answered **null** — that is what choosing your initials
      // commits, and Ash wears initials everywhere in the fixture.
      if (f.role !== 'clerk') {
        try { cs.setIdentity(now(), FOUNDER, { name: f.n, picture: f.pic || null }); } catch (e) {}
        f.nSet = true; f.picSet = true;
      }
      if (S.roster.length === 1) { invite('ivy@hollowoak.org'); invite('moss@hollowoak.org'); }
      const named = { 'ivy@hollowoak.org': 'Ivy Fen', 'moss@hollowoak.org': 'Moss Whitlow' };
      S.roster.forEach((r) => { if (named[r.e]) r.n = named[r.e]; });
      S.roster.forEach((r) => { if (!r.founder && !r.in) { r.in = true;
        if (r.mid) { try { cs.arrive(now(), r.mid);
          cs.setIdentity(now(), r.mid, { name: r.n, picture: r.pic || null });
          r.nSet = true; r.picSet = true; } catch (e) {} } } });
      if (!cs.textConfirmed) { try { cs.confirmStartingText(now(), proseText()); } catch (e) {} }
      CARDS.forEach((c) => S.seen.add(c.k));
      // **The stagehand fills the founder's hand.** Since the surface itself
      // starts with nothing chosen (Ed, 2026-08-21), ⏩ has to make the
      // choices a founder would — and it makes the ones the defaults used to
      // make, so the fixture still settles into the document every sentence
      // in the mockup describes. This literal is the old default set, and
      // the only place it survives.
      const SEED = { ending: 'roster', endsAt: '2026-08-20T18:00',
        barBy: 'roster', tClose: 78, shape: 'ramp', tStart: 55,
        quorumBy: 'roster', quorumForm: 'share', quorumPct: 33, quorumN: 5,
        joinBy: 'invite', policyBy: 'roster', lapse: 'roster', lapseDays: 90,
        removal: 'roster', authorship: 'roster', signing: 'roster', judgments: 'roster',
        rateBy: 'founder', grant: 4, dripMin: 180, cap: 8,
        // **🌍 stays with the founder, and that is the tooling fix** (Ed,
        // 2026-08-22, asking whether ⏩ could be more useful for working on
        // the power cards). ⏩ already leaves four power cards live — the
        // title, the link, the rate and the machines, being the settings it
        // keeps — so the gap was never *no power card*. It was that every
        // **constitutional** setting was delegated, and delegation is the
        // state of holding neither power: so the 🛡️ card on a constitutional
        // setting, the 👑 mark, and the whole crown-question route were
        // unreachable by hand in a settled document.
        //
        // Keeping 🌍 costs the fixture nothing it was saying: the value is
        // the same 'closed' the room was answering its way to, so every
        // sentence about visibility reads as it did. What changes is the
        // governance half — the clause gains its deviation, and Ash is a 👑
        // rather than a 📯. That is a live state the fixture could not reach
        // at all before, and the 📯 case is one radio away in either
        // direction.
        chamber: 'closed', auditor: false, auditorBudget: 6 };
      for (const k of Object.keys(SEED)) {
        if (S[k] === '' || S[k] === null || S[k] === undefined) S[k] = SEED[k];
      }
      // the founder's confirms: delegate what the radios delegate, set the rest
      for (const k of MANAGED_KEYS) {
        if (k === 'title' || k === 'slug') continue;
        try { commitSetting(k); } catch (e) {}
      }
      // the room answers what was delegated — real commands, every seat,
      // dependency order (ending first: the bar question waits on it)
      const FILL = { ending: S.endsAt || '2026-08-20T18:00',
        quorum: (S.quorumForm === 'count' ? S.quorumN : S.quorumPct),
        bar: S.tClose, authorship: 'anonymous', signing: 'nobody',
        judgments: 'never', chamber: 'closed', machines: false, policy: 'invite',
        lapse: 'never', removal: 'everyone', rate: S.grant };
      for (const k of Object.keys(FILL)) {
        const st = csState(k);
        if (!st || !st.collecting) continue;
        S.roster.forEach((r) => {
          if (r.role === 'clerk' || !r.in) return;
          r.ans = r.ans || {};
          if (r.ans[k] === undefined || r.ans[k] === null) r.ans[k] = FILL[k];
          try { cs.answer(now(), r.mid || FOUNDER, midOf(k), ANSTYPED[k](r.ans[k])); } catch (e) {}
        });
      }
      // 🍾 — the module no longer starts itself (Q443): the founder presses
      if (cs.constitutedAtT === null) { try { cs.begin(now()); } catch (e) { console.warn('[cs devff begin]', e && e.message); } }
      // acknowledgments, page and module agreeing
      S.roster.forEach((r) => {
        if (r.role === 'clerk') return;
        r.okd = r.okd || new Set();
        r.okd.add('begin');
        CARDS.forEach((c) => { r.okd.add('res-' + c.k); r.okd.add('set-' + c.k); });
        r.okd.add('canpropose'); r.okd.add('canjudge');
        r.okd.add('grant-voice'); if (r.founder) { r.okd.add('grant-pen'); r.okd.add('grant-shield'); }
        const rec = cs.memberRecords().get(r.mid || FOUNDER);
        if (rec) for (const sid of [...rec.okOwed]) {
          try { cs.giveOk(now(), r.mid || FOUNDER, sid); } catch (e) {}
        }
      });
    } catch (e) { console.warn('[cs devff]', e && e.message); }
  }

  // the membership list, as the 🪪 card's clause — the current text of the
  // rule, with the ✕ that edits it, replacing the copy that lived in the body
  // **The hat is a row in this list** (Ed, 2026-08-18: *does the founder
  // invite themselves? … make it a default, pre-checked*). Your own row is
  // first and ticked; unticking it makes you the clerk — administering
  // without writing — and you did not have to be the first member you
  // invited. Only yours to flip until judging starts; after that you join
  // the way anybody joins.
  const rosterClause = () => (isStranger()
    ? '<div class="roster clauselist"><p class="cpv">' + strMembersLine() + '</p></div>' : '') ||
    '<div class="roster clauselist">' + S.roster.map((p, i) =>
      '<div class="rperson">' + avHtml(p) +
      '<span><span class="nm">' + esc(p.n || 'Anonymous') + (p.founder ? ' <span class="chip founder">founder</span>' : '') +
      '</span><br><span class="em">' + esc(p.e || '—') + '</span></span>' +
      (p.founder
        ? '<span class="chip">' + (iDraft() ? 'member' : 'clerk') + '</span>'
        : '<span class="chip' + (p.in ? '' : ' pending') + '">' +
          (p.role === 'clerk' ? 'clerk' : 'member') + (p.in ? '' : ' · invited') + '</span>') +
      (p.founder ? '<span class="xdrop"> </span>' : '<button class="xdrop" data-drop="' + i + '">✕</button>') +
      '</div>').join('') + '</div>' + liveApplicantsHtml();

  // **The constitution, stated** (Ed, 2026-08-18): who convened it, when it
  // was constituted — the moment judging opens — and every constitutional
  // setting's current value, one line each, the glyph doing the naming.
  // ---- the grammar's other three states (Ed, 2026-08-18) ------------------
  // wait: the inbox holds the next move, a delegated question is being
  // answered, your own answer is in and the room's are not, a gate's
  // blockers are still above it. news: a delegated question resolved — the
  // number came back, and it pins until your OK, because a reveal you
  // answered blind into is a decision you are owed; a gate opening takes
  // the same rule, being exactly the shape of an unacknowledged decision.
  const waiting = (c) => (motionOn(c) ? answeredMotion(c)
    : c.isBegin ? (!amFounder() && !constituted())   // a member sees the start waiting on the founder
    : c.isClosing ? false
    : c.isGate ? !c.open()
    : c.k === 'myemail' ? (S.emailSent && !S.emailVerified)
    : c.ansFor ? (answered(c) && ((card(c.ansFor).in || 0) < E()))
    : isRoom(c) && settled(c) && (c.in || 0) < E());
  // **Nothing is owed an OK until the document begins** (Ed, 2026-08-19,
  // closing 414: *the bar is not actually set until judging starts, so they
  // shouldn't get the OK until then — same for anything else like this*).
  // §9.6a is the reason it was always half-true: before the start the founder
  // re-sets freely and a resolved question can still ground-shift, so an OK
  // collected then acknowledges a rule that may not be the rule. A gate is
  // the exception and the proof — a gate opening is not a rule being set, it
  // is a thing that has happened to you.
  const constituted = () => !!(cs && cs.constitutedAtT !== null);
  // the close, and whether this seat has signed it (the module is the truth:
  // live, view.closed.mySignature; fixture, the session's own signatures)
  const mySignature = () => {
    if (!cs || !cs.closed) return null;
    if (cs.isRemote) return cs.v.view.closed ? cs.v.view.closed.mySignature : null;
    const id = viewerId(); if (!id) return null;
    return cs.closingSignatures().find((sg) => sg.member === id) || null;
  };
  const signedClose = () => !!(cs && cs.closed && (!viewerIsMember() || mySignature() !== null));
  const closeSignatures = () => (!cs || !cs.closed ? []
    : cs.isRemote ? ((cs.v.view.closed && cs.v.view.closed.signatures) || []) : cs.closingSignatures());
  const news = (c) => (motionOn(c) ? false
    : c.isBegin ? false
    // the close is news to every member until they have signed (§4.6: the
    // acknowledgment IS the signature) — a clerk reads it settled
    : c.isClosing ? (c.open() && viewerIsMember() && !signedClose())
    : c.isGate ? (c.open() && staged(c) && !S.okd.has(c.k))
    : !constituted() ? false
    : !c.ansFor && isRoom(c) && settled(c) && E() > 0 && (c.in || 0) >= E() &&
      !S.okd.has('res-' + c.k))
    // **a constitutional rule you had no say in is a decision you are
    // owed** (the live rail's rule, arriving here): a founder-set
    // constitutional setting is news to every other member until their OK
    // a door is not a decision — nobody set it, nothing binds through it —
    // so it is never news to acknowledge (pacing pass, 2026-08-19: the ✉️❌
    // doors were landing in every member's rail as OK cards at the start)
    || (!amFounder() && !c.ansFor && !c.isGate && !c.door && !isRoom(c) && c.own !== 'you' &&
      // **and an ordinary setting the founder *changed*** (Q530, Ed
      // 2026-08-22). An ordinary rule the founder simply made is not news —
      // nothing was asked and anybody may motion it whenever they like — but
      // one they changed has undone something the room was living under.
      (c.kind === 'constitutional' || changedFrom(c.k) !== null) &&
      settled(c) && !S.okd.has('set-' + c.k));

  // **The constitution states itself in sentences** (Ed, 2026-08-18): each
  // decision has a what-phrase for its open states and a declarative
  // sentence once decided, all in the founder's own frame.
  const WHAT = {
    ending: 'when the drafting process will end',
    quorum: 'how many members must weigh in before a question can pass',
    bar: 'how sure the room must be at the close',
    pace: 'how the approval threshold climbs to the close',
    authorship: 'whether anonymous proposers are revealed',
    signing: 'whether members can make anonymous proposals',
    judgments: 'whether judgments are revealed with the record',
    chamber: 'who may read the document',
    lapse: 'whether an inactive membership lapses',
    removal: 'how a member is removed',
    machines: 'whether an AI makes proposals',
    rate: 'how often members may propose',
    policy: 'how people become members',
    slug: 'the document’s address',
    text: 'the text the document starts from',
  };
  // the 🥾 rung as it stands (Q401) — unset reads as today's rule
  const removalRung = () => takenOf('removal') ||
    (S.removal === 'roster' ? 'everyone' : S.removal);
  const endFmt = () => new Date((endingVal() !== 'never' && endingVal()) || S.endsAt)
    .toLocaleString(undefined,
      { weekday: 'long', hour: '2-digit', minute: '2-digit', hour12: false }).replace(' ', ' at ');
  const DECIDED = {
    ending: () => (perpetual() ? 'The drafting process has no set end — it runs until too few members are active.'
      : 'The drafting process will end on ' + endFmt() + '.'),
    quorum: () => (S.quorumForm === 'count'
      ? Math.min(takenOf('quorum') || S.quorumN, E()) + ' of the ' + E() + ' members'
      : (takenOf('quorum') || S.quorumPct) + '% of the members') + ' must have judged a question before it can change the document.',
    // **The ramp is part of what the threshold says** (Q512, Ed 2026-08-21:
    // *if there is no ramp, the clause can just be blank — maybe the ramp can
    // be in the threshold setting stack, rather than a whole separate
    // clause*). So 🪜 has no clause of its own: a fixed threshold is one
    // sentence, a rising one is the same sentence saying where it starts.
    bar: () => { const v = takenValOf('pace');
      const shape2 = v ? v.shape : S.shape;
      const start2 = v && v.shape === 'ramp' ? v.startPct : S.tStart;
      const pct = takenOf('bar') || S.tClose;
      // a ramp that starts where it ends is not a ramp (Ed: *if there is no
      // ramp, the clause can just be blank*)
      return (!perpetual() && shape2 === 'ramp' && isNum(start2) && +start2 < +pct
        ? 'The members must be ' + pct + '% sure a proposal is better for it to pass by the end, starting at ' + start2 + '% when judging opens.'
        : 'The members must be ' + pct + '% sure a proposal is better for it to pass.'); },
    pace: () => { const v = takenValOf('pace');
      const shape2 = v ? v.shape : S.shape;
      const start2 = v && v.shape === 'ramp' ? v.startPct : S.tStart;
      return (perpetual() || shape2 !== 'ramp'
        ? 'The approval threshold stays the same all the way through.'
        : 'The approval threshold starts at ' + start2 + '% and rises to ' + (takenOf('bar') || S.tClose) + '% by the end.'); },
    authorship: () => ({ anonymous: 'Nobody who proposes a change is ever named, even after the document is finished.',
      sealed: 'Whoever proposes a change is named when the document is finished, and not before.',
      public: 'Whoever proposes a change is named from the moment they propose it.' })[
      takenOf('authorship') || (S.authorship === 'roster' ? 'anonymous' : S.authorship)],
    signing: () => ({ nobody: 'Nobody may sign a proposal.', each: 'Each author chooses whether to sign.',
      everybody: 'Every proposal is signed.' })[
      takenOf('signing') || (S.signing === 'roster' ? 'nobody' : S.signing)],
    judgments: () => ({ never: 'What somebody preferred is never made public.',
      after: 'What somebody preferred is made public when the document is finished, and not before.' })[
      takenOf('judgments') || (S.judgments === 'roster' ? 'never' : S.judgments)],
    // **Foundership carries a read, whatever 🌍 says** (Ed, 2026-08-22).
    // 🌍 settles who may read *besides* the people the document is already
    // about, and a clerk founder is not a member — so under *members only*
    // the clause stated a rule that shut the founder out of the document
    // they convened, which the product has never actually done. It is said
    // only where it is a deviation: a founder who is a member is covered by
    // the sentence already, and under link or public everybody reads anyway.
    chamber: () => ({ closed: 'Only members can see the document.' +
        (iDraft() ? '' : ' The Founder can always read it.'),
      link: 'Anyone with the link can read the document.',
      public: 'The document is public — listed and readable by anyone.' })[
      takenOf('chamber') || (S.chamber === 'roster' ? 'closed' : S.chamber)],
    lapse: () => { const tv = takenOf('lapse');
      const v = tv !== null ? tv : (S.lapse === 'roster' ? null : S.lapse);
      return (v === 'never' ? 'Nobody stops being a member, however long they are away.'

    machines: () => { const tv = takenValOf('machines');
      const on = tv ? tv.enabled : (S.auditor === 'roster' ? false : S.auditor === true);
      const budget = tv && tv.enabled ? tv.budget : S.auditorBudget;
      return (on
      ? 'An AI makes proposals here, with ' + budget + ' ✏️s of its own. It never judges and counts towards nothing.'
      : 'There are no AI proposals.'); },
    rate: () => { const v = takenValOf('rate');
      return 'Members start with ' + (v ? v.grant : S.grant) + ' ✏️ each, up to a maximum of ' +
        (v ? v.cap : S.cap) + '. They get an additional ✏️ every ' + (v ? v.dripMinutes : S.dripMin) +
