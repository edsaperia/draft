        // rows under each are document text like any other.
        //
        // **A removal running names them, whatever else is true of them**: a
        // motion about somebody is the more urgent fact than a quiet spell, so
        // *Proposed for removal* takes precedence over *Lapsed* where a member
        // is both, and neither leaves *Members* by leaving the room.
        const pendingOut = removalPendingIds();
        const proposedOut = others.filter((p) => p.in && pendingOut.has(p.mid));
        // **A lapsed member is still here** (Y10; entry 94 ruling 5): they move
        // out of *Members* into *Lapsed* and count all the same — lapse is a
        // stall, not a departure, and they abstain rather than leave.
        const lapsedOut = others.filter((p) => p.in && p.lapsed && !pendingOut.has(p.mid));
        const here = others.filter((p) => p.in && !p.lapsed && !pendingOut.has(p.mid));
        // …and the invitations still being decided, marked *proposed* (Q1370)
        const invited = others.filter((p) => !p.in).concat(invitePendingRows());
        // **Leaving is free** (entry 94): a member's own row carries the one
        // act nobody may refuse — and the founder's membership is ordinary
        // membership (§9.6a, entry 248), so their row carries it too. Before
        // the start it is the 🎩 untick instead. Since Q1400 (Ed, 2026-09-16)
        // the act is the 🌂 card in the row's own stack, not a button in the
        // text: a body holds choices, an action is the row's (§9.1).
        const leaveBtn = '';
        // *(nobody else here yet)* counts the arrived rows alone (Q870), and
        // now that every other status has a heading of its own it is a
        // statement about *Members* and nothing else.
        const nobody = here.length ? ''
          : '<div class="memrow nobody">(nobody' + (showMe ? ' else' : '') + ' here yet)</div>';
        // **Your row last, the list above** (Q1316, Ed 2026-09-11, reversing
        // *You are at the top* of 2026-08-21 — founding a document with thirty
        // members: *why does the members list appear under my name in the
        // Members section, instead of above?*). The membership is listed
        // first and your own row — the only one wearing your ✋🖼️📧 tabs, the
        // *you* chip and, once begun, *Leave* — closes the list, after the
        // arrived rows and before the departure sentences (Q901), which stay
        // *after the rows*. The open identity card stands in the same place,
        // since it is your row's card (entry 188).
        const meBlock = !showMe ? ''
          : openId ? h.paraWith(openId, my)
          : '<div class="memrow meRow">' + (my.length ? h.pile(my) : '') + avHtml(me()) +
            '<span class="mn">' + esc(S.myname || 'Anonymous') +
            (S.roster[meIdx].founder ? ' ' + founderMark() : '') +
            ' <span class="chip">you</span>' + leaveBtn + '</span></div>';
        // a stranger reads the register as the door serves it, under *Members*
        // alone — the per-subsection counts entry 95 asks for are unbuilt, and
        // tangled with Q508's own question about what a door may show at all
        const strangerRows = strMemberList() ||
          '<div class="memlist"><div class="memrow nobody">' + strMembersLine() + '</div></div>';
        // **A heading for a status the document cannot produce would be a rule
        // stated as furniture** (entry 95): *Applicants* stands only where 🤝
        // allows applications, *Lapsed* only where 💤 lapses.
        const lapsesOn = () => { const v = takenValOf('lapse');
          return v ? v.afterMs !== null : !!S.lapse && S.lapse !== 'never'; };
        // **The ones that carry a control stand when empty** (entry 95) — a
        // control needs a fixed home, and inviting matters most when nobody
        // has been invited yet. *Lapsed* has none, so it stands on its rows.
        // **Every heading in the document folds** (Ed, 2026-08-26, closing the
        // lvl3 half of Q406). The constitution's sections and the charter's
        // prose headings already did; its subsections did not, which made them
        // the one kind of heading that behaved differently from the rest. They
        // carry the same `cs-`-prefixed id the section headings do, so the
        // heading-click handler and `secToggleHtml` reach them unchanged — and
        // like every other fold, **a section never folds over the open card**.
        // `inRows` is the caller's half of that promise: *Members* carries the
        // identity card inside its own rows rather than on its pile, so the
        // pile check above cannot see it and a folded *Members* would fold the
        // open card away (entry 188).
        const memSub = (title, rows, pileKeys, raw, inRows) => {
          const cards = (pileKeys || []).map(card)
            .filter((c) => c && visible(c) && (!c.base || cs));
          const open = cards.find((c) => S.open === c.k);
          const id = 'cs-mem-' + title.toLowerCase().replace(/[^a-z]+/g, '-');
          const head = '<h2 class="docline lvl3" id="' + id + '">' +
            secToggleHtml(id) + esc(title) + '</h2>';
          // **A subsection is its own birth** (entry 185, Ed's QA of batch Q:
          // *when I make the first choice on the Applications decision card,
          // the card flashes*). `.csub` carries no style — it is a plain block,
          // and the card-audit proves it moves nothing — but it gives
          // `birthPass` something to fade that is the subsection itself. A bare
          // heading here was a `.csec > h2[id]` like a section heading, so its
          // parent was the whole Membership `.csec`: picking *Anyone may apply*
          // born *Applicants* for the first time and faded the section in, with
          // the open 🤝 card standing inside it. What is born arrives (F14); the
          // defect was what its arrival was charged to.
          const sub = (inner) => '<div class="csub">' + head + inner + '</div>';
          if (open) return sub(h.paraWith(open, cards));
          if (S.folded.has(id) && !inRows) return sub('');
          return sub('<div class="cpara' + (cards.length ? '' : ' notab') + '">' +
            (cards.length ? h.pile(cards) : '') +
            (raw ? rows
              : '<div class="memlist' + (cards.length ? '' : ' nopile') + '">' + rows + '</div>') +
            '</div>');
        };
        // **🤝 how they join, 💤 and 🥾 how they leave, and only then who they
        // are** (Q865, Q867, Ed 2026-08-26: *💤 and 🥾 sections should be above
        // the Members heading* — reversing the second half of Q617 (a)). The
        // first half stands and is untouched: 🤝 Applications leads the
        // section, because inviting is an act under that rule (Ed, 2026-08-22:
        // *I need to decide Applications before I can do Membership*). What is
        // reversed is where the list falls. It used to stand above 💤 and 🥾 on
        // the argument that *a register is the fact and those are rules about
        // it* — true of the document, but it is the founding that reads this
        // order, and there the register is not a fact yet: it is the founder's
        // own name and nobody else's, and every rule below it will be in force
        // before the first invitation goes out. So the three rules governing a
        // membership now stand together above the heading, the way in and the
        // two ways out, and *Members* opens on the people it applies to. The
        // founding follows the document, so 🎩 *are you a member* and your own
        // name and picture still come before you invite anybody, which is the
        // order somebody actually does it in.
        // **🪪 leads** (Ed, 2026-08-26, entry 94): what admission costs comes
        // before whether strangers may apply, since an application pays it
        return (visible(card('admission')) ? h.para(card('admission')) + h.tasks(card('admission')) : '') +
          (visible(card('applications')) ? h.para(card('applications')) + h.tasks(card('applications')) : '') +
          (visible(card('lapse')) ? h.para(card('lapse')) + h.tasks(card('lapse')) : '') +
          (visible(card('removal')) ? h.para(card('removal')) + h.tasks(card('removal')) : '') +
          // **A door stands by its result** (entry 96, Ed 2026-08-26): ✉️ on
          // *Invitees*, ❌ on *Proposed for removal*, the admit judgment on
          // *Applicants* — each still wearing its own ✒️/🛡️ pair, and each a
          // pile rather than a button in a row. 🎩 stays on *Members*, being
          // about the founder's own place in it. The stranger reads the
          // register as the door serves it, under *Members* alone.
          // **The register tells the room who left** (Q901, E31–E32): one grey
          // sentence per departure after the rows — document text, so it
          // reads on the closed page and in the record, and the stranger
          // reads it where 🌍 lets them read *Members*
          // **And a subsection that stands empty says so** (entry 183, Ed's QA
          // of batch Q). The three that carry a control stand whether or not
          // they have rows (F21), so empty each was a heading over a pile and
          // nothing else — a heading that had lost its paragraph. Each takes
          // *(nobody else here yet)*'s own treatment: one grey parenthetical
          // row, no glyph, no full stop. Supplied **here** rather than inside
          // `memSub`, because the helper also builds *Lapsed*, which stands
          // only on its rows and must stay bare, and the stranger's raw
          // branch — a per-title default inside a layout function would be a
          // table of words hidden where nobody reads copy.
          (isStranger()
            ? memSub('Members', strangerRows + departureLines(), [], true)
            // 🥾's departure news stands on the *Members* heading beside 🎩
            // (Q901): the sentence it opens is the register line under these
            // very rows, and the card replaces the paragraph they stand in
            : memSub('Members', nobody + here.map(memRow).join('') + meBlock + departureLines(),
                ['hat'].concat(departureKeys()), false, !!openId) +
              memSub('Invitees', invited.length ? invited.map(memRow).join('')
                : '<div class="memrow nobody">(no outstanding invitations)</div>',
                // 📭 stands on the *Invitees* heading (E34): the give-up is
                // about somebody listed here, and this is where a reader looks
                // …and a running invitation motion is its own tab in this pile
                // (Q1367: one motion, one card — `motionCardsFor`, as `chipsFor`
                // does for a setting; this pile is listed by hand, so it lists them too)
                ['invite', 'pw:u:invite', 'pw:a:invite'].concat(mailGiveUpKeys())
                  .concat(motionCardsFor(card('invite')).map((c) => c.k))) +
              (policyNow() === 'apply'
                ? memSub('Applicants', memApplicantRows() ||
                  '<div class="memrow nobody">(no applicants at the moment)</div>', admitKeys()) : '') +
              (lapsesOn() && lapsedOut.length
                ? memSub('Lapsed', lapsedOut.map(memRow).join(''), []) : '') +
              memSub('Proposed for removal', proposedOut.length ? proposedOut.map(memRow).join('')
                : '<div class="memrow nobody">(nobody proposed for removal)</div>',
                ['remove', 'pw:u:remove', 'pw:a:remove'].concat(motionCardsFor(card('remove')).map((c) => c.k))));
      } },
    // **Proposals reads second** (Q871, Q872, Ed 2026-08-26: *Proposals above
    // Decisions* — reversing *Proposals reads fourth*, Ed 2026-08-21). That
    // ruling was itself a restoration: the section had drifted to second and
    // was put back to fourth because its whole arrival landed directly beneath
    // the Membership clauses the founder was still working through. What has
    // changed since is that the section no longer arrives at once — Q748 made
    // its opening one clause wearing four tabs, and ORDER (not a wave graph)
    // paces the two settings under it one at a time — so the objection the
    // fourth-place ruling was answering no longer holds. What is left is the
    // reading order, and it reads better this way: who may propose, and how
    // often, before how the room decides what is proposed. Membership ·
    // Proposals · Decisions · Anonymity · The Document.
    // The gates lead it (Ed, 2026-08-18); the preamble opens it
    // (Ed, 2026-08-19 — moved from the head of the constitution, redrafted
    // in his words); no intro lines — the sections are not big enough to
    // need explanations, and the clauses ought to be self-explanatory
    // (Ed, 2026-08-19)
    { key: 'rate', title: 'Proposals',
      text: '',
      // **The section opens with one clause wearing four tabs** (Q748). The
      // preamble stands tab-less while the group is empty, so the sentence
      // saying what beginning will do is readable from the moment the section
      // is live; each of 🍾 💡 ⚖️ 🏛️ *joins the stack* as it arrives rather
      // than a new paragraph appearing under it, and the whole group opens at
      // this one paragraph (`chipsFor` / `PROPOSAL_CHIPS`). `body` therefore
      // skips all four; `keys` keeps 🍾 💡 ⚖️, because the rail and the
      // group's own count enumerate from the section's cards. 🏛️ stays out of
      // `keys` deliberately — it is `visible` from its place in ORDER, and
      // admitting it would make the whole section live that early and offer
      // its news before 🍾 (F9). It is enumerated by `tasksFor`, as Q605
      // built it, and only its *clause* moves here.
      lead: (H) => (cs ? (proposalChips().length ? H.para(card('begin')) : preamblePara()) : ''),
      body: (H) => ['rate'].map(card)
        .filter((c) => c && visible(c)).map((c) => H.para(c) + H.tasks(c)).join(''),
      keys: ['begin', 'canpropose', 'canjudge', 'rate'],
      // one 👑 card per act that laid powers down (entry 162) — news, never a
      // task, and enumerated here because the rail reads a section's own keys:
      // a card the section does not enumerate is a card nothing can serve
      extraKeys: () => releaseKeys() },
    { key: 'deciding', title: 'Decisions',
      text: '',
      // ⏰ when it ends, 👥 how many must have voted. Two of the four left on
      // 2026-09-15 (Q1362): 🌡️ *how sure the room must be at that point* and
      // 🪜 *how that number gets there* were the confidence, and the rule that
      // asked for one is gone — the wording the room prefers stands once the
      // quorum is met, so 👥 is the whole of what this section decides.
      keys: ['ending', 'closing', 'quorum'],
      body: (h) => ['ending', 'closing', 'quorum'].map(card)
        .filter((c) => c && visible(c)).map((c) => h.para(c) + h.tasks(c)).join('') },
    // "Anonymity" (Ed, 2026-08-19), not "Privacy"
    { key: 'privacy', title: 'Anonymity',
      text: '',
      keys: ['authorship', 'judgments'] },
    // rail-only: the title is the heading, the link leads the constitution,
    // and the starting text anchors the prose (Ed, 2026-08-18)
    { key: 'doc', title: 'The Document', railOnly: true,
      text: '', keys: ['title', 'slug', 'chamber', 'text'] },
  ];
  // `extraKeys` is how a section enumerates cards it cannot name in a literal
  // — the admit cards, one per applicant (entry 96). It has to be here rather
  // than only in the band, because this is what the rail reads: a card the
  // section does not enumerate is a card nothing can ever serve (Q775).
  // **And a failed motion of yours is enumerated by the section its rule sits
  // in** (E41, Q1447), which is the same rule one level up: a `set` on 👥 is
  // the Decisions section's, a `reserve` on ⏱️ the Proposals section's, ✉️ and
  // ❌ the Membership section's. Written here rather than as five `extraKeys`
  // because the mapping is one line — the card's own `base` is the host's key
  // — and five copies of it would be five places to forget. A key no section
  // claims falls to the section holding 🍾, where the other homeless news
  // (a release batch) already stands, so nothing can be owed and unservable.
  const heldKeysIn = (s2, claimed) => heldKeys().filter((k) => {
    const c = card(k); if (!c) return false;
    return s2.keys.includes(c.base) || (!claimed.has(c.base) && s2.keys.includes('begin'));
  });
  const secLive = () => {
    const claimed = new Set(SEC.flatMap((s2) => s2.keys));
    return SEC.map((s2) => ({ ...s2,
      cards: s2.keys.concat(s2.extraKeys ? s2.extraKeys() : [], heldKeysIn(s2, claimed))
        .map(card).filter((c) => c && visible(c)) }))
      .filter((s2) => s2.cards.length);
  };
  // **The founder's own answer is a tab on the setting's clause** (Q786–Q788,
  // Ed 2026-08-25: *whether the founder specifically has answered their member
  // question doesn't matter enough to have a whole clause, it's just part of
  // the x of y members have answered this delegated question*). The card is
  // still a task and still stands in the rail; what it no longer has is a
  // paragraph and a sentence of its own — its tab rides the delegated
  // setting's own pile, on the one clause that already counts the answers,
  // the founder's among them. The ✒️/🛡️ precedent (Q639), not 📧's blank line.
  // A resolved question keeps no answer task at all: the rule above states the
  // outcome, and a finished task has nothing left to ask.
  const ansTaskFor = (c) => (c && c.key && ANSWER[c.k] && (c.in || 0) < E()
    ? [card('ans-' + c.k)].filter((x) => x && visible(x)) : []);
  const tasksFor = (c) => ansTaskFor(c)
    // the grants stand as tasks of the 📍 link — the pen and the shield issued
    // when the address went live (Q451), the voice when you became a member
    // (Q1365; it was the first blind question's, Q605 (a)) — all three
    // enumerated here and drawn on the Founded line (Q639).
    .concat(c.k === 'slug'
      ? [card('grant-pen'), card('grant-shield'), card('grant-voice')].filter(visible) : []);
  // **The keys the rail can ever list** (Q775). Every section's own keys, plus
  // the three grants and the answer tasks `tasksFor` adds beside them — the
  // whole of what `servedCards` below can produce, read off the same literals
  // it reads. It exists because a card can be *owed* without being **servable**:
  // 🪜 is in neither ORDER nor any section's keys (Q512), so nothing could ever
  // put it in front of the founder, and `otherTasksLeft` counting it held every
  // delegated question shut for ever. Whatever makes a task owed must make it
  // served; where it cannot, the task must not block.
  const railable = (c) => !!c && (!!c.ansFor || !!c.admit || !!c.release || !!c.mailgiveup ||
    !!c.motion ||
    !!c.departure ||
    !!c.held ||
    SEC.some((s2) => s2.keys.includes(c.k)) ||
    c.k === 'grant-pen' || c.k === 'grant-shield' || c.k === 'grant-voice');
  /* **Every running motion is its own card** (Q1367, Ed 2026-09-15: *other
     proposals should not be shown on the decision card but in tab stack and
     as more queue cards*). A motion on a setting, on a power tab (Q386's
     return) or on a door is a synthetic card keyed `mo:<id>`, a tab in the
     pile of the clause it is about — behind the rule's own tab, before the
     filed records — and a rail entry of its own; its card shows that motion
     alone. The pile's host card carries no motion any more: its tab opens
     the rule as it stands, and the composer. Written `admitCard`'s way, so
     nothing but this has to know these can be served; `motionIn` is the
     motion's answers, the same count Q1319 put on a setting's own entry. */
  const motionCardsFor = (c) => (!cs || !c || c.isGate || c.ansFor || c.admit || c.motion || !motionsLive() ? []
    : liveMotions().filter((rec) => pileKeyOf(rec) === c.k).map((rec) => card('mo:' + rec.id)).filter(Boolean));
  // **The rail's own set, in one place** (Q773). The rail is what tells a
  // founder there is anything left to do, so *what is being served* has to be
  // a question anything can ask — 🍾's own last-resort door asks it, and so
  // does the walks' readout. It used to live inline in `renderRail`, where the
  // only way to ask it was to read the DOM back: a second implementation of
  // the thing under test.
  const servedCards = () =>
    // What is settled leaves the rail — it is the pile's, and the block's
    // to name — and a gate shows only as news: the moment it opens, until
    // its OK. Before that 💡 and ⚖️ are nowhere at all (Q529: the gate
    // clauses hide until 🍾, where they are decided), because nothing is
    // being asked of you (Ed, 2026-08-18: *everyone should only see cards
    // they can act on*). ⏳ entries stay: they are where the fill says how
    // far the room has got.
    secLive().flatMap((s2) => s2.cards)
      .flatMap((c) => [c].concat(tasksFor(c)).concat(motionCardsFor(c)))
      .filter((c) => !owesOwnAnswer(c))
      .filter((c) => ((c.isGate && !c.isBegin && !c.isClosing) ? stateOf(c, ctx) === 'news' : stateOf(c, ctx) !== 'done'))
      // **A setting you handed over and do not answer is not a task** (Ed,
      // 2026-08-21): nothing is being asked of you, so the watcher keeps its
      // glyph on the grey tab in the band and leaves the rail. **A vote of
      // yours waiting on the room stays, as ⏳** (Ed, 2026-09-08, Q1286 (a):
      // it stays in the rail like a race's ⏳, Q1202) — ordinary or
      // constitutional alike; until this date the constitutional ones left
      // and the ordinary ones stayed, which was the kind and not the wait.
      .filter((c) => !(isRoom(c) && !ctx.voted(c) && stateOf(c, ctx) === 'wait'))
      // the closed page asks nothing but the signature (Q470): a grant or
      // a question outstanding at the close is moot, and leaves the rail
      .filter((c) => !(cs && cs.closed) || c.isClosing);
  // A member who has not opened the document yet is drawn faintly rather than
  // left out: they are on the membership, which is the fact the heading is
  // stating, and whether they have looked at it yet is a different one.
  const groups = () => [
    // **No Constitution heading during the birth** (Ed, 2026-08-21). Nothing
    // is being headed yet — the run is three clauses on an unsaved document —
    // and the table of contents already withholds its Constitution entry
    // until the save, so a heading here disagreed with the outline beside it.
    { key: 'constitution', label: cs ? PAGE_COPY.rulesHeading : '',
      // **The birth has no sections** (Ed, 2026-08-21: *during the birth we
      // don't need to see the Membership section*). Before the save there is
      // no constitution to divide up — the run is the title, the link and
      // 📧, all three in this group's own `lead`. The band used to take its
      // sections from whatever had a visible card, and 📧 is a Membership
      // key, so a *Membership* heading, a *Members* subheading and an empty
      // list stood on a document that did not exist yet. The rail still
      // enumerates from `secLive()`, which is what keeps the birth's own
      // tasks in it.
      sections: cs ? secLive() : [],
      // Founded by [avatar] [name] — from the save (Q640), gaining its time
      // at the 🍾 press; a founder who set no name is Anonymous like anybody
      // else (§9.0c). **It is where ✒️ and 🛡️ hang their tabs** (Q639 (a)).
      lead: (h) => titleGovPara(h) +
        // the link's own answer-task still draws here; the two grants it
        // carries do not — they are drawn on the Founded line below (Q639)
        (visible(card('slug')) ? h.para(card('slug')) +
          tasksFor(card('slug')).filter((t) => !onFoundedLine(t)).map((t) => h.para(t)).join('') : '') +
        // **The birth's third clause** (Ed, 2026-08-21): the document says
        // what is happening and wears the 📧 tab, so the card does not have
        // to say *Sent to…* and the founder can get back to their own
        // address from the document itself. It stands here for the whole of
        // the birth — open, unsent, and awaiting the link — because the tab
        // must not move: it used to be rendered by the Membership section's
        // own body while the card was open and by this line once the mail
        // was out, so the paragraph jumped up the page at the send.
        (!cs && visible(card('myemail')) ? h.para(card('myemail')) : '') +
        // 🌍 is about the document, not member privacy — the penultimate
        // clause of the opening section (Ed, 2026-08-19)
        (visible(card('chamber')) ? h.para(card('chamber')) + h.tasks(card('chamber')) : '') +
        // **The grants stand here** (Q639 (a), Ed 2026-08-22). Their own two
        // clauses — *The Founder holds the pen on 16 settings.* and its
        // shield twin — are retired: the count is already stated on every
        // setting the power turns (`holderLine`) and in the second person on
        // the wallet's own tooltip, so the clause was the third telling and
        // the one that went stale whenever a power was laid down. Every
        // *settings* clause wears ✒️ and 🛡️ for its **own** powers, so a
        // grant could not hang on one without putting two ✒️ tabs meaning
        // different things in one stack; the Founded line carries none, sits
        // in the opening run where the grants arrive, and already wears 👑 —
        // the mark that means *holds either power*. The tabs make the crown
        // clickable, which is the dividend rather than the cost.
        (cs ? (() => {
          // and a clerk's ✋🖼️📧 join them (Q759): the Founded line is where
          // a clerk appears in the document, so it is where their identity
          // tabs ride. Five tabs is the tallest this pile gets.
          // …and 🏛️ rides here for every member (Q1365): the grant of the
          // membership, on the line that says who founded the document
          const gc = [card('grant-pen'), card('grant-shield'), card('grant-voice')].filter((c) => c && visible(c))
            .concat(idOnFounded());
          // a member, a stranger, a founder who holds nothing: no pile, and
          // the line renders exactly as it always did
          return gc.some((c) => S.open === c.k) ? h.paraWith(card(S.open), gc)
            : '<div class="cpara' + (gc.length ? '' : ' notab') + '" data-para="founded">' +
              (gc.length ? h.pile(gc) : '') +
              '<div class="cptext">' + foundedClause() + '</div></div>'; })() : ''),
      // **The hairline and the title are facts about the document, not about
      // the 📄 task** (Ed, backlog 33: *immediately after the birth, when my
      // named document opens for the first time, the Text area should already
      // have the title and hairline above it*). They arrive at the **save**,
      // which is when both become true — the document has a name and it has a
      // column to be written in — and the outline has been pointing at
      // `#dochead` from the save for as long as it has existed (`tocLead`),
      // at an anchor that did not exist until 📄's turn at the very end of
      // the founding. **The pile is the riding tab now** (backlog 204):
      // `#ridetab`, a sticky child of `.doc` beside this heading, drawn by
      // `renderRideTab` — there from the save, since the text is a card with
      // two modes and no task. This row draws the hairline and the title, or
      // the power tab's card while one is open (`pw:u:text` / `pw:a:text`
      // still need a clause to sit under: the settled record, `BODY.text`).
      textAnchor: (h) => (!cs ? ''
        : '<div class="cpara notab docsep"></div>' +
          (/^pw:[ua]:text$/.test(S.open || '') ? h.para(card('text'))
          : '<div class="cpara textanchor notab">' +

  const VALUE = {
    text: () => { const n = proseCounts().blocks;

    title: () => S.title || PAGE_COPY.val.notNamed,
    slug: () => docAddr(S.slug || '…'),
    invite: () => ADM_RULE[admissionPrice()],
    remove: () => REMOVAL_RULE[removalPrice()],
    myemail: () => (S.emailVerified ? S.myemail + PAGE_COPY.val.verifiedTail
      : S.emailSent ? PAGE_COPY.val.checkInbox : PAGE_COPY.val.notGiven),
    myname: () => S.myname || PAGE_COPY.val.notGiven,
    mypic: () => (S.mypic ? PAGE_COPY.val.chosen : PAGE_COPY.val.initials),
    // an invitee is not a member yet (§9.6a): the line counts the arrived,
    // and says who is still only invited
    admission: () => ADM_RULE[admissionPrice()],
    applications: () => APPL_RULE(policyNow()),
    chamber: () => ({ link: 'Anyone with the link', closed: 'Members only',
      public: 'Public' }[takenOf('chamber') || S.chamber]),
    ending: () => (perpetual() ? 'Never — it runs until too few members are active'
      : window.CARDS.longWhen(new Date(endingVal() || S.endsAt).getTime())),
    quorum: () => (S.quorumForm === 'count'
      ? PAGE_COPY.val.quorumOf(Math.min(takenOf('quorum') || S.quorumN, E()), E())
      : PAGE_COPY.val.quorumPct(takenOf('quorum') || S.quorumPct,
        // the bracket is the floor a race is held to, never the bare share
        // (Ed, 2026-09-21, Q1490; setup.js's shareFloor is the writers' copy)
        M.adoptionFloor(quorumCount(), E()), E())),
    authorship: () => ({'anonymous':'Nobody’s name, ever','anonymousElective':'Nobody’s name unless they choose','sealed':'Names at the close','sealedElective':'Names at the close, or earlier by choice','public':'Names from the start'})[takenOf('authorship') || (S.authorship === 'roster' ? 'anonymous' : S.authorship)],
    judgments: () => ({ never: 'Never revealed', after: 'Revealed at the end' }[
      takenOf('judgments') || (S.judgments === 'roster' ? 'never' : S.judgments)]),
    rate: () => { const v = takenValOf('rate');
      return PAGE_COPY.val.oneEvery(dripPhrase(v ? v.dripMinutes : S.dripMin)); },
    // (🌍 and 🤝 are stated once, above, module-first like every neighbour:
    // a second entry here used to override them and read S alone)
    lapse: () => (S.lapse === 'never' ? 'Never — however long you are away'
      : PAGE_COPY.val.lapseAfter(spellOfMs(S.lapseMs))),
    removal: () => REMOVAL_RULE[removalPrice()],
    // the three grants carry no subtitle (Ed's card review, 2026-09-02:
    // *remove body text "You hold Founder Actions" from the queue card*;
    // STYLE §4 as amended — the title names the power, the card says the rest)
    // …and neither do the two gates since Q1374 (Ed, 2026-09-15): their
    // *Open* / *Waiting on …* lines were read by the rail's news branch alone
    begin: () => (constituted() ? PAGE_COPY.val.begun + foundedAt() : PAGE_COPY.val.notBegun),
    closing: () => (cs && cs.closed ? PAGE_COPY.val.closed + closedAtWords() : ''),
  };
  // **The readback quotes the document** (Q1112, Ed's survey item 8, answered
  // *yes*, 2026-09-01): *You said* is followed by the sentence the answer
  // would put into the constitution, in quotation marks, rather than a
  // lower-case paraphrase of it. Every entry reads the one clause table or
  // the named clause builder above `DECIDED`, so a member's answer and the
  // rule it would set are the same words. A rung the surface has retired but
  // a document still holds falls through to the raw token, as it always did.
  const said = PAGE_COPY.said;
  const ANSVALUE = {
    quorum: (v) => said(QUORUM_RULE(v, S.myAns.quorumForm)),
    ending: (v) => said(ENDING_RULE(v === 'never' || isNaN(Date.parse(v)) ? 'never' : v)),
    authorship: (v) => said(AUTH_RULE[v] || v),
    judgments: (v) => said(JUDG_RULE[v] || v),
    chamber: (v) => said(clauseOf('chamber', v) || v),
    applications: (v) => said(APPL_RULE(v) || v),
    // the member's own answer is a number in the unit they picked (Q1439), so
    // it is put back into a spell before it is read back as a sentence
    lapse: (v) => said(LAPSE_RULE(v === 'never' ? 'never'
      : +v * (LAPSE_UNITS[S.myAns.lapseUnit] || LAPSE_UNITS.days))),
    // **🪪's readback was missing entirely** — `admission` is delegable and
    // has an `ANSWER` body, so it makes an `ans-` card like every other; with
    // no entry here `value()` called `undefined` and took the render with it
    // the moment a member committed an answer to it. Found on this sweep.
    admission: (v) => said(ADM_RULE[v] || v),
    // keyed by the page's own removal vocabulary — `consent` · `assembly` ·
    // `proposal`, what `ANSTYPED`/`PAGEVAL` and setup.js's ladder speak. It
    // was keyed `everyone`/`others`/`ordinary`, a vocabulary nothing on this
    // page has ever written, so every lookup missed and the readback fell
    // through to the raw token.
    removal: (v) => said(REMOVAL_RULE[v] || v),
    // the answer is the interval since Q1160 — minutes, from the member's
    // own number and unit
    rate: (v) => said(RATE_RULE(+v * (DRIP_UNITS[S.myAns.rateUnit] || 1))),
  };
  const ANSASK = { quorum: PAGE_COPY.ask.lowest,
    ending: PAGE_COPY.ask.latest, authorship: PAGE_COPY.ask.most,
    judgments: PAGE_COPY.ask.most,
    chamber: PAGE_COPY.ask.most,
    applications: PAGE_COPY.ask.mostOpen,
    lapse: PAGE_COPY.ask.shortest,
    admission: PAGE_COPY.ask.cheapest,
    removal: PAGE_COPY.ask.easiest,
    rate: PAGE_COPY.ask.mostGenerous };
  // **A power tab has no VALUE of its own — its value *is* its rule.**
  // `chipsFor` hands every viewer the ✒️/🛡️ tabs of a settled setting, and on
  // any chair but the founder's the card body is `readBody`, which asks for
  // `ctx.value(c)` — so `VALUE['pw:u:title']` was read as a function and the
  // TypeError took the whole `render()` with it: a member or a stranger
  // clicking a power tab got a page frozen at its last good frame. Found by
  // the card-audit's power walk, 2026-08-23. The missing-key guard beside it
  // is the one `holderLine`'s own lookup already keeps.
  const value = (c) => (c.ansFor
    ? esc(filled(c) ? ANSVALUE[c.ansFor](S.myAns[c.ansFor]) : ANSASK[c.ansFor])
    // `readBody`'s *Set to* line is inside the open card (Q1429), so the rule
    // it prints names its setting
    : c.power ? esc(powerHeadLine(c, true))
    // a record has no VALUE of its own either — its title *is* what it says
    : c.record ? esc(c.t)
    : esc(VALUE[c.k] ? VALUE[c.k]() : ''));
  // **A task you have to do needs no subtitle** (Ed, 2026-08-19: *subtitles
  // are there to help me make choices — if I have to do them, they don't need
  // extra information*; and on 📧, *the queue-card does not need "Not given
  // yet", that's why it's yellow*). The wash already says the state and the
  // title already says the question, so a line restating either was the rail
  // telling you twice. What survives is the one entry that is **not** an ask
  // — a motion, whose subtitle is the mover's reason and is exactly the
  // information you need to decide whether to open it. **News carries none
  // either** (Q1374, Ed 2026-09-15: *queue cards had body text* — the gates'
  // *Open* and a settled rule's value beneath its name): the entry is its
  // name and its ✔, and the card says what happened.
  // **The summary is markup** (2026-09-12): `railEntry` prints it as it is.
  // **A motion's body is its rationale behind its speaker, or nothing**
  // (Ed, 2026-09-12: *[user avatar] Rationale text; if no rationale, no body
  // text*) — it was *Under motion — [the value]*, which the card says at
  // once on opening; the disc is the card's own sealed speaker, since a
  // motion names no mover (SURFACE C13). One motion, one entry (Q1367): no
  // count of others rides beneath, each having an entry of its own.
  // **A motion just put says so for a few seconds** (Q1485 (A), Ed
  // 2026-09-21: *Close, and say so*; the rule is one for text and rules
  // alike). The card closes at the press now, so the only thing left on the
  // surface saying the motion went out is its rail entry — which, like a text
  // proposal's, is a line naming the rule and nothing else. It wears the
  // sentence until `justPut` runs out, and the sentence is then taken off by
  // a patch rather than a render: five seconds after a press the member may
  // be typing somewhere, and a render there would take the caret.
  const PUT_MS = 5000;
  let justPut = null;                    // { k, until } — the rule a motion of mine went out on
  let justPutTimer = null;
  const justPutOn = (c) => {
    if (!justPut || !c || !c.motion || hostKeyOf(c) !== justPut.k) return false;
    if (Date.now() >= justPut.until) return false;
    const rec = liveMotionRec(c);
    return !!rec && rec.by != null && rec.by === viewerId();
  };
  function flashPut(k) {
    justPut = { k, until: Date.now() + PUT_MS };
    if (justPutTimer) clearTimeout(justPutTimer);
    justPutTimer = setTimeout(() => {
      justPutTimer = null; justPut = null;
      let moved = false;
      document.querySelectorAll('#rail .qjust').forEach((n) => { n.remove(); moved = true; });
      if (moved) SESSION.layoutQueue();
    }, PUT_MS);
  }
  // **⏳ Begin lists who is still to answer** (issue #76, Ed 2026-09-22: *a
  // ⏳ Begin task in the rail with a list of the usernames/avatars which have
  // answers still due*): each member owing an answer, face and name, off the
  // module's own readout — participation by name, never preference.
  const dueFaces = () => dueMembers().map((m) => {
    const row = S.roster.find((r) => (r.mid || 'founder') === m.id) || {};
    const n = (row.n || m.name || row.e || '').trim();
    return '<span class="qdue">' + avHtml({ n, pic: row.pic }) + ' ' + esc(n || PAGE_COPY.synth.redacted) + '</span>';
  }).join('');
  const summary = (c) => {
    if (c.isBegin && beginCollecting()) {
      const faces = dueFaces();

    const body = m ? window.CARDS.railSpeakerHtml(m.why, null) : '';
    if (!justPutOn(c)) return body;
    return '<span class="qwhy qjust">' + esc(window.COPY.session.rail.justProposed) + '</span>' + body;
  };

  // **What is unlocked, and by what.** Reading needs nothing. Proposing and
  // judging both open at the start (§9.0b, Q606, 2026-08-22): there is no
  // state between 📄 and 🍾 where proposals are open, because the text a
  // proposal is made against is decided as part of the start, and a judgment
  // is *recorded under a disclosure setting* and *counted towards a quorum*,
  // neither of which can be decided after it without changing what it was.
  // `canPropose` used to be true from the text alone, so the topbar read
  // *proposals open* on a document that had not begun.
  const canPropose = () => !!cs && cs.textConfirmed && constituted();
  const ceremony = () => CARDS.filter((c) => c.gate === 'judge');
  const canJudge = () => !!cs && cs.canJudge();

  // **A power is not held until it has been acknowledged** (Ed, 2026-08-21:
  // *I should not be able to do actions until I have acknowledged that I have
  // been given the right to do them. I shouldn't be shown actions that I
  // can't do.*)
  //
  // The grant *is* the conferring act, so the OK on it is not a receipt for
  // something already true — it is the moment the thing becomes true. Until
  // then the act is refused **and never offered**. Acknowledgment had gated
  // exactly three `style.display` lines (the ✏️ ✒️ 🏛️ wallets) and nothing
  // else, which is the rule inside out: the receipt was hidden while the
  // power ran. `may*` is therefore the only thing any control may ask;
  // `can*` stays what the *document* permits, which is what the grant card
  // itself reads to know whether it has opened.
  //
  // Where the distinction lands on the surface: an **offer** disappears (the
  // caret in the charter, ✏️ propose edit, a motion composer, the ✒️
  // commit) — you are not shown an act you cannot take. A **question put to
  // you** stays visible and goes `locked` (a race card), because it still
  // has to be readable; that is the state cards.js already draws for a card
  // whose reader may not judge it.
  // **A gate never withholds from the seat that set it** (Ed, 2026-09-01;
  // SURFACE C8, E8). C8's own test is *were you here when it was set?*, and
  // for the founder of a founder-held constitution the answer is *I set it* —
  // so 💡 and ⚖️ are acknowledged for them the moment they open, with no card
  // and no press. Without this the founder of a live document could be
  // withheld judging **for ever**: the two gates sit below ✒️ in `ORDER`, so
  // an unacknowledged pen hides them outright, and a gate is staged behind
  // owed news besides — and since the acknowledgement lives only in this
  // browser's `grantsKey()`, a fresh profile puts the founder back behind a
  // card that is not on the page. A member is untouched: they were not here
  // when it was set, and the gate is exactly the thing that tells them.
  //
  // **The seat that set them is the founder, on every document**, because a
  // gate is not a setting and cannot be delegated: neither key is in
  // `DELEGABLE` or in the catalogue, and both open on 🍾 — the founder's own
  // press, whose card states the pair as part of its batch. So there is no
  // *delegated gate* to make an exception for, and the exemption is the
  // founder's whole seat rather than a per-document test.
  //
  // Where the founder **did** answer blind they are owed the outcome exactly
  // like every member, and that is untouched here: a delegated question's
  // resolution is `res-<key>` news on its own card, which this says nothing
  // about. Reading the caveat the other way — no exemption where any founding
  // question the gate waits on was the room's — was tried first and is wrong
  // twice over: it fires on no real document (the ceremony delegates
  // something by definition — the ladder's own room holds three of ⚖️'s six),
  // so it would leave the reported defect standing; and it treats a founder
  // who handed the room one question as a stranger to a start they pressed.
  const GATE_KEYS = ['canpropose', 'canjudge'];
  const gateSelfSet = (k) => GATE_KEYS.includes(k) && amFounder();
  const acked = (k) => S.okd.has(k) || gateSelfSet(k);
  // a member who has not yet accepted 🏛️ is shown neither 💡 ✏️ nor ⚖️ (Q1540)
  const voiceUnaccepted = () => viewerIsMember() && !acked('grant-voice');
  const mayPropose = () => canPropose() && viewerIsMember() && acked('canpropose');
  const mayJudge = () => canJudge() && viewerIsMember() && acked('canjudge');
  const mayVoice = () => !!cs && viewerIsMember() && !!viewerRow().in && acked('grant-voice');
  const mayPen = () => !!cs && amFounder() && holdsPenAnywhere() && acked('grant-pen');
  // **The wallet says you hold a pen; the lock says you hold *this* one**
  // (entry 62, Ed's batch-B QA 2026-08-25: *after giving up the pen on Title,
  // I can still edit the title*). `mayPen()` is the wallet question and stays
  // it — `holdWallet`, the spend-preview and the topbar socket ask it, and on
  // a closed document a founder who never gave the pen up still holds it, so
  // a `closed` term here would draw a struck ✒️ and say they had (Ed, B25 (a)).
  // Every **commit** asks this instead: the grant accepted, the document still
  // open, and the pen on the setting being set. `pwPair` reads the hand
  // actually on the setting, and a release made before 🍾 still reads held —
  // which is R-048's rule and what makes the pre-start control correct here
  // without a special case.
  const docOpen = () => !(cs && cs.closed);
  const mayPenOn = (k) => mayPen() && docOpen() && pwPair(k).u;
  // **The take-back is the one commit the lock must let through** (Q1318, Ed
  // 2026-09-11). Before 🍾 a delegated setting is taken back by choosing a
  // value on its card and pressing ✒️ — `commitSetting` reclaims and sets in
  // one act, and 🍾's hold sentence sends the founder there — but delegation
  // is holding neither power (§9.0a), so `pwPair(k).u` is false for as long
  // as the membership holds it and the ✒️ was dark on every delegated card,
  // whichever key it carried. Reclaiming is what restores the pen, so the
  // commit that reclaims cannot wait on it: the pen is asked of the wallet
  // and the document, and of the card only that a value stands chosen where
  // the delegate rung stood. One-way after the start, like the rung.
  const takingBack = (k) => !!cs && cs.constitutedAtT === null && csDelegated(k) && !wantsDelegate(k);
  // **The shield has a grant of its own** (`grant-shield`, since d20f67a — the
  // purer reading of *no power arrives without acknowledgment* that Q532 asked
  // for): it used to ride the pen's OK, since both powers arrive in the
  // founder's hands by one act, but they are opposite powers and a founder
  // who has pressed OK on one card saying "your powers" has learned one thing
  // where there were two.
  const mayShield = () => !!cs && amFounder() && holdsShieldAnywhere() && acked('grant-shield');
  // A commit that spends out of a wallet needs that wallet to have arrived.
  // The pen is the one this bites for: `holdWallet` reads ✒️ as a **hold**
  // only while the glyph is in the topbar, so before the grant was
  // acknowledged a pen commit quietly degraded into a plain click — the hold
  // discipline disappearing exactly where the founder is being taught it.
  // Gates hold a position in the founding order without blocking it, so a
  // settings card really can arrive before ✒️ has been accepted.
  // **With a card it asks the lock; without one it asks the wallet.** The
  // disabled test passes the card, so a pen laid down on *this* setting greys
  // its commit; the tooltip does not, because `penWaitTitle` explains the
  // wallet and there is nothing to explain where the setting's own pen is
  // down — that card has already stopped being the founder's to edit (step 3).
  const penOkFor = (glyph, c) => glyph !== '✒️' || (c ? mayPenOn(c.k) : mayPen());
  const penWaitTitle = PAGE_COPY.penWait;

  // ---- motions (stage D of the merge, Ed 361) ---------------------------
  // A motion is the act of changing a **settled** document's rules (§9.6a):
  // before judging opens there are no past decisions for a change to re-rate,
  // so nothing is amended, only set — the founder re-sets freely, and these
  // exist only once the constitution is settled and judging is open.
  const motionsLive = () => canJudge();
  // ---- motions live in the module (9c): the page renders records --------
  // **An admit motion targets its own card** (entry 96): before this it fell
  // through to 🪪's own key (`membership` as the id was then spelled, Q903)
  // and landed on the price card — which was harmless
  // only because nothing drew it, and would now put every applicant's
  // judgment on the price card. Pointing it at `adm:<applicant>` is also what
  // hands the whole generic motion path to these cards: `liveMotionRec`,
  // `motionOn`, `answeredMotion` and `mustAct` all key on this, so an
  // application raises a task the way any other motion does (Ed, 2026-08-26:
  // *applications should generate a task when they are made*).
  // **A one-power `reserve` targets that power's tab** — a key the page no
  // longer draws once the power is laid down (Q1404): the surface composes no
  // reserve since the road back closed, but a log made before it, or the
  // ladder's stagehand, may still carry one running, and its motion card
  // stands in the setting's pile by `pileKeyOf` whether or not the tab does;
  // a `reserve` naming both powers keeps the setting's own key as it always has.
  const pwKeyOf = (mid2, power) =>
    'pw:' + (power === 'assent' ? 'a' : 'u') + ':' + pkeyOf(mid2);
  const motionTargets = (rec) =>
    rec.payload.kind === 'invite' ? 'invite'
    : rec.payload.kind === 'remove' ? 'remove'
    : rec.payload.kind === 'admit' ? 'adm:' + rec.payload.applicant
    : rec.payload.kind === 'reserve' && (rec.payload.power === 'unilateral' ||
        rec.payload.power === 'assent') ? pwKeyOf(rec.payload.setting, rec.payload.power)
    : pkeyOf(rec.payload.kind === 'set' || rec.payload.kind === 'reserve'
      ? rec.payload.setting : 'admission');
  // the members a removal is running against (entry 94): the ❌ door's
  // pending list, read off the motions like everything else on the page
  // **A member-pile card heads with its people** (CP6, Q1101, 2026-08-31):
  // the pile's avatar-and-name list is the card's standing text — the status
  // quo the act is about — so opening ❌ never hides the people it acts on.
  // ✉️ heads with the invitees, ❌ with the proposed-for-removal; the price
  // sentence stands beneath the list, in the same head.
  // a motion card on a door (`mo:…`, Q1367) heads with its host door's people
  const doorPeople = (c) => {
    const rows = hostKeyOf(c) === 'invite'
      ? S.roster.filter((p) => !p.in).concat(invitePendingRows())
      : (cs ? S.roster.filter((p) => removalPendingIds().has(p.mid || 'founder')) : []);
    const empty = hostKeyOf(c) === 'invite' ? PAGE_COPY.doorEmpty.invite : PAGE_COPY.doorEmpty.remove;
    return '<div class="headpeople">' + (rows.length
      ? rows.map((p) => '<span class="hp">' + avHtml(p) + ' ' +
          esc(p.n || p.e || 'Anonymous') + pendingChip(p) + '</span>').join('')
      : '<span class="hpnone">' + empty + '</span>') + '</div>';
  };
  // **An invitation proposed and not yet decided is a line under *Invitees***
  // (Q1370, Ed 2026-09-15: the mover's press *acknowledged nothing — no line
  // under Invitees, the card still reading Nobody has been invited yet*). A
  // door stands by its result, and a motion in flight is a result in the
  // making: one row per running invite motion, built off the record since
  // the person is on no roster until it carries, wearing *proposed* the way
  // a lapsed row wears *lapsed*. It stands in ✉️'s head and in the
  // subsection alike, so the *Nobody has been invited yet* sentence counts
  // it — that sentence is about the list being empty, and it is not.
  const invitePendingRows = () => {
    if (!cs || !motionsLive()) return [];
    const out = [];
    for (const rec of cs.motionRecords().values()) {
      if (rec.payload && rec.payload.kind === 'invite' &&
        (rec.status === 'running' || rec.status === 'awaiting-crown')) {
        out.push({ n: '', e: inviteeHandle(rec.payload), in: false, pending: true });
      }
    }
    return out;
  };
  const pendingChip = (p) => (p.pending
    ? ' <span class="chip pending">' + esc(PAGE_COPY.doorPending.invite) + '</span>' : '');
  const removalPendingIds = () => {
    const ids = new Set();
    if (!cs || !motionsLive()) return ids;
    for (const rec of cs.motionRecords().values()) {
      if (rec.payload && rec.payload.kind === 'remove' &&
        (rec.status === 'running' || rec.status === 'awaiting-crown')) ids.add(rec.payload.member);
    }
    return ids;
  };
  const nameOfMember = (mid2) => {
    const row = S.roster.find((r) => (r.mid || 'founder') === mid2);
    return row ? (row.n || row.e || mid2) : mid2;
  };
  // **The invitee an invite motion names** (decision 1253): the payload
  // carries a person row's id, and the address the page shows comes off the
  // row — the view resolves it onto the wire; the fixture reads the module's
  // own rows. Null where the row has been erased, and then the handle is
  // *[redacted]* rather than a name nobody holds any more. **The whole
  // address since Q1375** (Ed, 2026-09-15: *use [email] if no name chosen*):

    // STYLE T5 forbids. Each is `ruleMval` over the same table the lanes are
    // now drawn from, so a rung has one wording wherever it is met.
    //
    // **Each is a thunk, and that is load-bearing**: 🌍's and 🤝's sentences
    // name a fact about the room — whether the founder is a member, what 🪪
    // charges — so the key has to be read at the render that draws the lane
    // and not at the evaluation of this literal, when neither is known and
    // `S` is not yet furnished. `mvalTyped` calls whatever it finds here.
    removal: () => priceMval('removal'),
    admission: () => priceMval('admission'),
    // 🤝 is one switch, so its two rungs type the boolean rather than a name
    applications: () => ruleMval('applications', (v) => ({ apply: v === 'apply' })),
    // **Public has left the ladder** (Ed, 2026-08-22). It is offered nowhere
    // — not here, not on the founder's card, not in a member's answer — but
    // every map that *reads* a rung back still knows it: the module's
    // catalogue still holds it, so a document that took it before today
    // still states its own rule truthfully rather than printing a raw value.
    // `OFFERED_RUNGS` is where that exclusion is written down now, once for
    // the lane and the key together.
    chamber: () => ruleMval('chamber', (v) => ({ rung: v })),
    authorship: () => ruleMval('authorship', (v) => ({ rung: v })),
    judgments: () => ruleMval('judgments', (v) => ({ rung: v })),
  };
  // **A change carries a reason, and says who made it** (Q530, Ed
  // 2026-08-22). The pen is the only route that changes a rule without
  // asking anybody, and it was the only one that left no reason behind —
  // which is backwards: a change nobody got to argue about is the one most
  // worth explaining. Two halves of one object, and which you meet depends
  // on which side of the act you stand: the founder is offered a lane to
  // write in, and everybody else is told what changed and reads what they
  // wrote.
  //
  // **Neither appears on a first decision.** A founder answering a question
  // for the first time has changed nothing — there is no *from* — and a room
  // told that the founder has decided fifteen things nobody asked them about
  // is noise rather than news. §9.6a says the same thing in the spec's own
  // words: before the start nothing is amended, only set. The test is the
  // module's `previousValue`, which folds from events the log already
  // carried, so no event shape moved to get it.
  //
  // A value in words, for the *from* half of the sentence. It has to be its
  // own map: the surface's existing short forms (`RESULT`) read the current
  // value out of `S`, and MVAL only knows the values a motion may offer —
  // neither can be handed an arbitrary past value and asked what it says.
  const WORDS = {
    title: (v) => '“' + v.text + '”',
    slug: (v) => docAddr(v.slug),
    chamber: (v) => ({ closed: 'members only', link: 'anyone with the link',
      public: 'public' }[v.rung] || v.rung),
    applications: (v) => (mayApply(v) ? 'anyone may apply' : 'invitation only'),
    admission: (v) => ({ assembly: 'all members agreeing', proposal: 'the membership deciding',
      pen: 'any member’s word' }[v.price] || v.price),
    lapse: (v) => (v.afterMs === null ? 'never' : M.spellWords(v.afterMs)),
    removal: (v) => ({ consent: 'all members agreeing, them included',
      assembly: 'all other members agreeing', proposal: 'the membership deciding' }[v.price] || v.price),
    ending: (v) => (v.endsAtMs === null ? 'never'
      : window.CARDS.longWhen(v.endsAtMs)),
    quorum: (v) => (v.form === 'share' ? v.n + '% of the members' : v.n + ' members'),
    authorship: (v) => ({ anonymous: 'nobody ever named',
      anonymousElective: 'nobody named unless they choose to be',
      sealed: 'names at the close',
      sealedElective: 'names at the close, or earlier by choice',
      public: 'names from the start' }[v.rung] || v.rung),
    judgments: (v) => ({ never: 'never revealed',
      after: 'revealed at the end' }[v.rung] || v.rung),
    rate: (v) => 'a new proposal every ' + dripPhrase(v.dripMinutes),
  };
  const wordsFor = (k, v) => { if (v === null || v === undefined) return null;
    try { return WORDS[k] ? String(WORDS[k](v)) : null; } catch (e) { return null; } };
  // **A value is always its clause sentence** (Ed's card review round 3,
  // 2026-09-05, A3 — 31, 32, 50, 56): the record card's blocks and the parked
  // pair print the sentence the constitution would carry for a value, never
  // `WORDS`'s short phrase, which survives for the narrated *from x to y*
  // lines alone. One function over the same rule builders `DECIDED` reads,
  // taking a **module** value rather than the document's, so a record can
  // say what stood at a past moment. It read 🌡️ and 🪜 off each other until
  // both left the surface (Q1362); every case here is its own value now.
  const sentenceFor = (k, v) => {
    if (v === null || v === undefined) return null;
    try {
      switch (k) {
        case 'title': return 'The document is titled ' + LD + v.text + RD + '.';
        case 'slug': return 'The document lives at ' + docAddr(v.slug) + '.';
        case 'ending': return ENDING_RULE(v.endsAtMs === null ? 'never' : msToLocal(v.endsAtMs));
        case 'quorum': return QUORUM_RULE(v.n, v.form);
        case 'authorship': return AUTH_RULE[v.rung] || null;
        case 'judgments': return JUDG_RULE[v.rung] || null;
        case 'chamber': return CHAMBER_RULE[v.rung] ? CHAMBER_RULE[v.rung]() : null;
        case 'applications': return APPL_RULE(mayApply(v) ? 'apply' : 'invite');
        case 'admission': return ADM_RULE[v.price] || null;
        case 'removal': return REMOVAL_RULE[v.price] || null;
        case 'lapse': return LAPSE_RULE(v.afterMs === null ? 'never' : v.afterMs);
        case 'rate': return RATE_RULE(v.dripMinutes);
        default: return wordsFor(k, v);
      }
    } catch (e) { return wordsFor(k, v); }
  };
  // what this setting held before the founder last set it — null on a first
  // decision, which is the whole test
  const changedFrom = (k) => { const st = csState(k); return st ? (st.previousValue || null) : null; };
  const setWhyOf = (k) => { const st = csState(k); return st ? (st.setWhy || null) : null; };
  // a setting that already holds a value: committing the pen here is a change
  const isChange = (k) => { const st = csState(k); return !!(st && st.value !== null); };
  // **The founder's rationale is not sealed** (Ed, 2026-08-22: *the rationale
  // should have the founder's name and avatar on it, and 👑 so people know it
  // was a founder action, even if they have no name or avatar*). Every other
  // rationale on this surface wears the featureless disc because authorship
  // is sealed until the record (§3.4). A ✒️ act is attributed **by
  // construction** — only the founder can perform it — so the disc would be a
  // lie the first time it was drawn. The 👑 carries the whole sentence on its
  // own: an anonymous founder has no name and no picture, and the mark still
  // says *this was the founder's own hand*.
  const founderSpeaker = (why) => {
    const f = founderInfo();
    return '<div class="speaker founderspoke">' + avHtml(f) +
      '<div class="spksaid"><span class="who">' + esc((f.n || '').trim() || PAGE_COPY.theFounder) +
      ' <span title="' + PAGE_COPY.crownHand + '">' + glyphHtml('👑') + '</span></span>' +
      (why ? '<div class="said">' + window.CARDS.reasonHtml(why) + '</div>'
        : '<div class="said none">' + window.COPY.grammar.speaker.noReason + '</div>') + '</div></div>';
  };
  // the same speaker, with the reason still being written. It is the
  // editing-card's own arrangement — you write the sentence in the place and
  // at the weight everybody else will read it in — with the founder's face
  // where a member's would be sealed.
  const founderSpeakerLane = (v) => {
    const f = founderInfo();
    // raised like every other rationale composer (Ed's QA, 2026-09-02 pm):
    // the lanebox is what whyLane wraps a member's reason in
    return '<div class="lanebox whylane"><div class="speaker founderspoke">' + avHtml(f) +
      '<div class="spksaid"><span class="who">' + esc((f.n || '').trim() || PAGE_COPY.theFounder) +
      ' <span title="' + PAGE_COPY.crownHand + '">' + glyphHtml('👑') + '</span></span>' +
      '<div class="said edit-why' + (v ? '' : ' blank') + '" contenteditable="plaintext-only"' +
      ' spellcheck="false" data-setwhy="1"' +
      ' data-placeholder="' + PAGE_COPY.whyChangingPlaceholder + '">' + esc(v) + '</div></div></div></div>';
  };
  const mvalTyped = (k, disp) => {
    if (card(k) && card(k).door) return null; // membership sentences parse at commit
    // a setting whose sentences come off the clause table hands its own table
    // back as a thunk, read at the render that draws the lane (MVAL, above)
    const t = MVAL[k];
    return ((typeof t === 'function' ? t() : t) || {})[disp] || null;
  };
  // **The settled card is the composer** (Ed, 2026-08-18) — for any member,
  // on any settled setting, once the document is live. The founder is the
  // one exception on the settings they reserved: their control there is
  // unilateral (the 👑 rule, consented on the way in), so they keep the
  // setting body itself rather than a composer.
  // §9.7 v0.54: the founder's direct hand IS the unilateral power — where
  // it is given up (assent-only state) the founder composes like a member
  // **And a closed document takes no direct hand at all** (entry 62, Q470:
  // *the closed page asks nothing but the signature*). `requireOpen` refuses
  // every command after the close, so the founder's hand is off every setting
  // whether or not they kept its pen. Its one existing caller is `composerOn`
  // just below, where a false `founderDirect` means *compose instead* — so
  // that one carries its own `docOpen()` and this cannot turn a closed card
  // into a live composer. Nothing else reads it: `crownWaits` and `changeHalf`
  // ask their own questions, and `changeHalf`'s history half is gated on
  // `!amFounder()`, so no record is hidden by this.
  const founderDirect = (c) => {
    if (!docOpen()) return false;
    // a door's direct hand is its own ✒️ (entry 94): ✉️ invites, ❌ exiles
    if (c.door) return pwPair(c.k).u;
    const st = csState(c.k);
    return !st || st.powers.unilateral; };
  // the 👑 question exists exactly where the assent power is held
  const crownWaits = (c) => {
    if (c.door) return pwPair(c.k).a;
    const st = csState(c.k);
    return st ? st.holder === 'convenor' && st.powers.assent : !membersHold(c); };
  // The register counts as settled here (Ed's QA, 2026-08-19: *I can't seem
  // to suggest removing a member*): it has no value to settle, and what it
  // is, it always is — without this the membership card never composed, and
  // invitations and removals had no door.
  // a door whose act the viewer's own word performs is a box, not a composer
  const doorDirect = (c) => !!c.door && (hostKeyOf(c) === 'invite' ? directInvite() : directRemove());
  // **On a closed document nobody composes** (entry 62, SURFACE K2). This is
  // its own term rather than something `motionsLive()` provides: `canJudge()`
  // is `constitutedAtT !== null` and has never asked about the
  // close, so every settled card on a closed page was drawing a live motion
  // composer whose commit the server would refuse.
  const composerOn = (c) => motionsLive() && docOpen() && viewerIsMember() && !c.isGate && !c.ansFor &&
    c.kind !== 'personal' && c.k !== 'text' && settled(c) && !motionOn(c) &&
    !doorDirect(c) && !(amFounder() && !membersHold(c) && founderDirect(c));
  /* **The Founder's pair is the composer they are excluded from** (Ed,
     2026-08-27, backlog entry 161: *the founder should be able to decide
     whether something they have ✒️ on happens unilaterally or goes to the
     membership as a proposal*). `composerOn` ends by subtracting exactly one
     seat — the Founder, on a setting whose pen they still hold — and this is
     that subtraction put back, as a second commit rather than as a composer:
     they already have the setting's own controls, so what is missing is only
     the other way to spend what they have chosen.

     The two predicates are halves of one question — *may this seat put this
     change to the room* — so they live on one screen and a later change to
     either is met by the other. Four terms earn a sentence:

     - **`mayPropose()` is the clerk's exclusion**, and it is not only the
       wallet: `viewerIsMember()` is inside it and `openMotion` refuses a
       mover who is not an arrived member outright, so a clerk's second
       commit could never work. `founderPairNote` says so on the card.
     - **`c.k !== 'text'`** — the Text's pair is drawn by session.js, on the
       proposal-row and the `editing-card` (`commitBtnHtml`, entry 161 at
       Ed's QA of 2026-08-30; SURFACE K29, K31). No second commit here.
     - **`motionsLive()`** — before 🍾 there is no membership to propose to
       (`openMotion`: *before the start nothing is amended — only set*), so
       the Founder's card keeps ✒️ alone, unchanged.
     - **`!membersHold(c)`** — a delegated setting is not theirs to decree or
       to propose from this card; they fall through to the composer as today.

     The scope is `founderHandOff`'s, and for its reason: the gates, the
     personal cards, the power tabs, 🎩, 🍾 and 📄 are none of them a
     `powers.unilateral` question, and `founderDirect` reads `true` for every
     key the module holds no state for. A **door** is in scope but only in its
     direct form, because that is where a door's own act lives (§9.1) — and
     never ✉️ at 🪪 `pen`, where the module refuses a motion outright
     (*admission is at ✒️ — invite directly, nothing to propose*) and nobody
     else's card draws a proposal control either. */
  const founderPairOn = (c) => amFounder() && motionsLive() && docOpen() &&
    (MANAGED_KEYS.includes(c.k) || !!c.door) &&
    !c.isGate && !c.ansFor && !c.power && !c.record &&
    c.kind !== 'personal' && c.k !== 'text' &&
    (!c.door || (doorDirect(c) && (c.k !== 'invite' || admissionPrice() !== 'pen'))) &&
    !membersHold(c) && founderDirect(c) && settled(c) && !motionOn(c);
  const founderPair = (c) => founderPairOn(c) && mayPropose();
  /* **What the second commit would put**, in the shape a member's composer
     puts in `S.draft` — `{ k, to, val, why }` — so nothing downstream has to
     learn about the Founder: `draftPayload`, `routeFor` and `openMotion` all
     read it as they read anybody's. It is built from the card's own controls
     rather than from a lane, because on a Founder-held card there is no lane.

     **Null is the enable test.** `motionCommitHtml` disables on a falsy `to`,

     value not yet chosen, the delegate rung picked (which is not a value),
     an empty address, nobody selected — and a value equal to what already

     `standsTyped`'s, by value and never by label (Q620). */
  const founderProposal = (c) => {
    if (!c) return null;
    const why = (S.setWhy || {})[c.k] || '';
    if (c.door) {
      if (c.k === 'invite') {
        // one box since Q1166: the route's commit proposes the first address
        // in it — one motion proposes one member
        const at = (S.inviteMany || '').split('\n').map((s) => s.trim()).filter(Boolean)[0] || '';
        return at ? { k: c.k, to: at + ' joins the membership', why } : null;
      }
      const row = removableRows().find((p) => p.mid === S.removeWho);
      return row ? { k: c.k, to: (row.n || row.e || 'Anonymous') + ' leaves the membership', why } : null;
    }
    if (wantsDelegate(c.k)) return null;      // handing it over is not a value
    if (CHOSEN[c.k] && !CHOSEN[c.k]()) return null;
    let val = null;
    try { val = TYPED[c.k] ? TYPED[c.k]() : null; } catch (e) { return null; }
    if (!val) return null;
    const stands = standsTyped(c.k);
    if (stands && JSON.stringify(stands) === JSON.stringify(val)) return null;
    const to = wordsFor(c.k, val);
    return to ? { k: c.k, to, val, why } : null;
  };
  // the row's second control: whatever the route asks for at this value —
  // ✏️ Propose on an ordinary one, 🏛️ on a constitutional one (K6, K7) — and
  // the one-🏛️-out disable and the ✏️ flight come with it
  const founderCommit = (c) => (founderPair(c)
    ? motionCommitHtml(c, (founderProposal(c) || {}).to || '', !!myHeldOut()) : '');
  // **A clerk is told why, rather than left to notice** (T13, T37): they are
  // not a member, so there is no ✏️ to spend and `openMotion` would refuse
  // them anyway. Drawn exactly where the pair would otherwise stand.
  const founderPairNote = (c) => (founderPairOn(c) && !viewerIsMember()
    ? '<p class="setnote">' + PAGE_COPY.clerkNoPencil + '</p>' : '');
  // what a press finds when the value it was drawn for has gone (F17: a click
  // that lands on nothing is answered). One sentence, both gestures.
  const NOTHING_TO_PUT = PAGE_COPY.nothingToPut;
  // **The founder's editing body follows the setting's own pen** (entry 62).
  // True exactly where the founder is being shown the card and no longer has
  // the hand it is drawn for: the value radios, the title lane, the delegate
  // rung and the *why are you changing this* lane all hang off this. A
  // founder-member falls through to `composerOn` and composes like anybody
  // else; a **clerk** founder has no composer to fall to (`viewerIsMember()`),
  // and lands on the settled card — the sentence, the watch half, a bin.
  // Scoped to the catalogue settings the founder's card sets: gates, the
  // personal cards, 🎩 and 📄 are none of them a `powers.unilateral` question,
  // and the two doors have carried their own gate since Q811.
  // **A delegated setting is not a pen laid down.** `setting-delegated` clears
  // both powers, so `founderDirect` is false there too — and read-only on a
  // members-held card takes the delegate rung and the value radios away with
  // it, which pre-start are the *only* way back: `commitSetting` reclaims when
  // the founder picks a value, and 🍾's own hold sentence tells them to do
  // exactly that (*take it back on its own card and set it yourself*). So

  // a setting they still hold, never about one they handed to the room.
  const founderHandOff = (c) => amFounder() && !c.ansFor && !c.isGate && !c.door &&
    !c.power && !c.record && c.kind !== 'personal' &&
    MANAGED_KEYS.includes(c.k) && !membersHold(c) && !founderDirect(c);

  // (Q816). The exemption for `c.k` was a guess about which card could still

  // refuses a second constitutional motion whatever it targets. ✉️ is where
  // that bites, since two invitations in a row are one act repeated — so the

  const commitFor = (c) => motionCommitHtml(c,
    (S.draft && S.draft.k === c.k) ? S.draft.to : '',
    !!myHeldOut());

  /* **A motion is composed with the setting's own control** (motion-controls),

  // `.propblock` and `.pick`): a lane is a `.pick` like the standing rule
  // above it and the founder's own blocks, so one rule spaces them all.
  // **The radio says what the press will do** (Ed, 2026-09-06, CP2's third

  // read *Propose this / Proposed* — or *Choose this / Chosen* where the
  // chooser alone decides, the pen's own hand. *Prefer this* is a judgment's.

  const composeWords = (k, val) => {
    if (!(k && mayPenOn(k))) {
      return { off: window.COPY.grammar.lane.propose, on: window.COPY.grammar.lane.proposed,

    const c = card(k);
    if (c && founderPair(c)) {
      const g = routeFor(c, val || (S.draft && S.draft.k === k ? S.draft.to : '')) === 'constitutional' ? '🏛️' : '✏️';
      return { off: PAGE_COPY.pw.chooseOrPropose(g), on: PAGE_COPY.pw.chosenOrProposed(g),

  const pairWords = (key, val) => {
    const k = S.open;
    const c = k ? card(k) : null;

    // it is told apart by its value — `opt(S, dk, 'roster', …)` — not its key
    if (!c || val === 'roster' || !mayPenOn(c.k) || !founderPair(c)) return null;

  window.SETUP.setPickWords(pairWords);
  const laneBlock = (d, val, text, k, rung) =>
    '<div class="pick' + (d && d.to === val ? ' on' : '') + '"><span class="opttext">' + text + '</span>' +
    PC.laneBarHtml(d, val, { edit: false, words: composeWords(k, val), set: k, rung }) + '</div>';
  // **…and a block carrying a field has a radio too** (Ed's card review
  // round 3, A2 — 37 💤, 42 📧, 51 ⏰, 54 🌡️, 57 👥: *should have a radio
  // button "Prefer this", since it is an option*). Typing still chooses the
  // block (F6); the radio says so, and pressing it chooses by focusing the
  // field. Its words follow CP2's register: *Choose this* where the chooser
  // alone decides (the pen's own hand), *Prefer this* on a proposal put to
  // more than one person.
  const inputBlock = (html, note, d, k, onIf) => {
    const on = typeof onIf === 'boolean' ? onIf : !!(d && d.to) && !/^never/i.test(String(d.to));
    const w = composeWords(k, d && d.to);
    // **the range sentence, where there is one** (Q1486 (G)): drawn only when
    // the field has refused a number, and written into — or made, or taken
    // away — in place as the field is typed (`patchMotionField`), so an empty
    // one is never on the card for the copy audit to read
    const bad = (d && d.rangeErr) || '';
    return '<div class="pick' + (on ? ' on' : '') + '"><span class="opttext">' + html + '</span>' + (note || '') +
      (bad ? '<p class="setnote mrange">' + esc(bad) + '</p>' : '') +
      '<button class="lanepick" type="button" aria-pressed="' + on + '" data-pickinput="1"' +
      ' title="' + esc(w.title) + '">' +
      '<span class="dot"></span><span class="off">' + esc(w.off) + '</span>' +
      '<span class="on">' + esc(w.on) + '</span></button></div>';
  };
  // **What stands on a delegated setting is what the room's answers took**,
  // never the founder's field — that still says 'roster'. The consent rule,
  // computed live: highest for quorum and the bar, latest for the ending
  // (never latest of all), longest for lapse, most private for the privacy
  // family, most generous for the rate.
  // what the room settled — the ceremony's resolution, a carried motion, a
  // crown-accepted change — translated back into the page's vocabulary.

  // …and since Q1439 (rulings a, m, t) the sentence is Ed's own, the quorum
