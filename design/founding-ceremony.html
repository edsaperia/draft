<meta charset="utf-8">
<title>Opening ceremony</title>
<link rel="stylesheet" href="system.css">
<style>
/* ============================================================================
   founding-ceremony — **what a member sees when they arrive** (Ed, 2026-08-17:
   *the roster members as they arrive get their opening ceremony questions in
   the right-sidebar as cards, and once they're done they can start*).

   So it is the same surface again: session-view's chrome, wearing session-view's
   stylesheet, with the ceremony's questions in the rail where judgments will be.
   That is the third screen in a row to converge on it, and by now the pattern is
   the finding rather than the coincidence — **whatever the document wants from
   you goes in the right-hand rail, and everything that wants something is a
   card**. A setup question, a founding question, a judgment: same rail, same
   shape, same gesture.

   The document is behind it and readable from the first second, and proposing is
   already open if the convenor confirmed the starting text (SPEC §9.0a, the
   staged unlock). Only judging waits on this.

   Three states, switchable in the topbar so all are inspectable: answering ·
   waiting · settled.
   ========================================================================== */
  .states { display: flex; gap: var(--s1); }
  .states button { font: inherit; font-size: var(--t-cap); padding: 3px var(--s3); cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); color: var(--muted); border-radius: 999px; }
  .states button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }

  .queue .qhead { font-size: var(--t-cap); color: var(--muted); margin: 0 0 var(--s2); padding: 0 10px; }
  .queue .setmark { margin-left: auto; display: inline-flex; align-items: center; }
  .mkg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.9;
    stroke-linecap: round; stroke-linejoin: round; }
  .queue .sendrow { margin-top: var(--s4); }
  .btn-send { width: 100%; font: inherit; font-size: var(--t-ui); font-weight: 600; cursor: pointer;
    background: var(--ok); border: 1px solid var(--ok); color: #fff; border-radius: var(--r-md);
    padding: var(--s3); box-shadow: var(--shadow-md); }
  .btn-send:hover { background: var(--ok-hover); border-color: var(--ok-hover); }
  .btn-send[disabled] { opacity: 0.45; cursor: default; box-shadow: none; }
  .railnote { font-size: var(--t-cap); color: var(--muted); margin-top: var(--s2); text-align: center; }

  /* the modal is a decision card on a scrim, as it is on document-creation */
  .scrim { position: fixed; inset: 0; background: rgba(33,37,41,0.28); z-index: 60;
    display: grid; place-items: center; padding: var(--s5); }
  .scrim .sugg { width: min(660px, 100%); max-height: 88vh; overflow-y: auto;
    box-shadow: var(--shadow-xl); margin: 0; }
  .scrim .sugg h2 { font-size: var(--t-lead); font-weight: 600; margin: var(--s1) 0; }
  .scrim .sugg .why { color: var(--muted); font-size: var(--t-small); margin: 0 0 var(--s4); max-width: 60ch; }
  .blindnote { font-size: var(--t-cap); color: var(--muted); margin-top: var(--s3); }

  /* the roster, standing beside the question (Ed, 2026-08-17) */
  .whobox { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--light);
    padding: var(--s3); margin-bottom: var(--s4); }
  .whobox .lab { font-size: var(--t-small); color: var(--muted); margin-bottom: var(--s2); }
  .faces { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .pf { display: flex; align-items: center; gap: var(--s1); font-size: var(--t-cap); }
  .pf .av { width: 22px; height: 22px; border-radius: 50%; background: var(--bg);
    border: 1px solid var(--border); color: var(--muted); font-size: 8px; font-weight: 700;
    display: grid; place-items: center; }
  .pf.me .av { background: var(--primary); border-color: var(--primary); color: #fff; }
  .pf.me { font-weight: 600; }

  /* consent-slider — nothing preselected, and it must not look answered */
  .cs { margin-bottom: var(--s2); }
  .cs input[type=range] { width: 100%; accent-color: var(--primary); }
  .cs.unset input[type=range] { accent-color: var(--border); opacity: 0.55; }
  .csval { font-size: var(--t-lead); font-weight: 600; min-height: 1.6em; }
  .csval.unset { color: var(--muted); font-weight: 400; font-size: var(--t-ui); }
  .csends { display: flex; justify-content: space-between; font-size: var(--t-cap); color: var(--muted); }
  .csmean { font-size: var(--t-small); color: var(--muted); margin-top: var(--s2); min-height: 3em; }

  /* privacy-ladder — most private first, rungs above your answer dimmed */
  .ladder { display: flex; flex-direction: column; gap: var(--s2); }
  .rung { display: grid; grid-template-columns: 20px 1fr; gap: var(--s3); align-items: start;
    padding: var(--s3) var(--s4); border: 1px solid var(--border); border-radius: var(--r-lg);
    cursor: pointer; background: var(--bg); }
  .rung:hover { background: var(--light); }
  .rung.on { border-color: var(--primary); background: var(--primary-subtle); box-shadow: var(--shadow-sm); }
  .rung.on .dot { border-color: var(--primary); }
  .rung.on .dot::after { transform: scale(1); }
  .rung.above { opacity: 0.5; }
  .dot { width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid var(--muted);
    margin-top: 3px; display: grid; place-items: center; }
  .dot::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--primary);
    transform: scale(0); transition: transform 120ms ease; }
  .rung .ttl { display: block; font-weight: 600; font-size: var(--t-ui); }
  .rung .exp { display: block; color: var(--muted); font-size: var(--t-small); margin-top: 2px; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* the settled record, and the distribution-strip */
  .rec { border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--s5); margin-bottom: var(--s5); }
  .rec h2 { margin: 0 0 var(--s4); font-size: var(--t-lead); font-weight: 600; }
  .line { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s4);
    padding: var(--s3) 0; border-top: 1px solid var(--border); }
  .line:first-of-type { border-top: 0; }
  .line .k { font-size: var(--t-small); color: var(--muted); }
  .line .v { font-size: var(--t-body); font-weight: 600; }
  .dist { display: flex; align-items: flex-end; gap: 3px; height: 54px; margin: var(--s3) 0 var(--s1); }
  .dist span { flex: 1; background: rgba(var(--lc-yours), 0.30); border-radius: 2px 2px 0 0; min-height: 2px; }
  .dist span.top { background: var(--primary); }
  .distx { display: flex; justify-content: space-between; font-size: var(--t-cap); color: var(--muted); }
  .anon { font-size: var(--t-cap); color: var(--muted); margin-top: var(--s2); }
  .pips { display: flex; gap: var(--s2); flex-wrap: wrap; margin: var(--s3) 0; }
  .pip { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border); background: var(--light); }
  .pip.in { background: var(--ok-subtle); border-color: var(--ok); }

  /* **A setup rail lays itself out, and pins** (Ed, 2026-08-17: *the ceremony
     and admin cards should be pinned*).

     Two halves. `system.css` positions `.qitem` **absolutely**, because in a
     live session `layoutQueue` places every entry against its own clause in
     the document; there is nothing to track here, so they go back into normal
     flow. And then the whole column is sticky — which is what pinning means
     for this set. It is the same rule the live rail follows and reaches the
     same answer from the other end: there, four kinds of entry pin because
     they are the things that are about *you* rather than about a clause. Here
     **every** card is one of those. A setup question belongs to no clause, so
     there is nowhere for it to scroll away to, and nothing on this screen may
     be missed by reading past it.

     Marked with a class rather than by loosening `.qitem`, so the live layout
     is untouched and the difference is visible in the markup. */
  .queue.stack { position: sticky; top: calc(var(--nav-h) + var(--s5)); align-self: start;
    max-height: calc(100vh - var(--nav-h) - var(--s5)); overflow-y: auto;
    scrollbar-width: none; -ms-overflow-style: none; }
  .queue.stack::-webkit-scrollbar { width: 0; }
  .queue.stack ul, .queue.stack > div { display: flex; flex-direction: column; gap: var(--s2); }
  .queue.stack .qitem { position: static; }
  .ql .subj { margin-right: var(--s1); font-size: 1.05em; line-height: 1; }
  /* the subject glyph, the name and the tick are three slots on one line */
  .queue.stack .ql { display: flex; align-items: baseline; gap: var(--s1); }
  .queue.stack .ql > span:nth-child(2) { flex: 1; min-width: 0; }
</style>

<header class="navbar">
  <div class="wrap">
    <p class="brand">The Hollow Oak Club — House Charter <span class="sess">· opening ceremony</span></p>
    <div class="stats">
      <span id="stat">proposals open · judging waits on the ceremony</span>
      <span class="states" id="states"></span>
      <button class="me" title="Ida Fenwick — you."><span class="face" aria-hidden="true">IF</span></button>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="layout">
    <nav class="toc"><ul id="toc"></ul></nav>
    <main><div class="doc" id="doc"></div></main>
    <aside class="queue stack"><div id="rail"></div></aside>
  </div>
</div>
<div id="modalroot"></div>

<script>
(function () {
  const TICK = '<svg class="mkg" viewBox="0 0 12 12"><path d="M2 6.4 L4.7 9.2 L10 2.9"/></svg>';
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const ROSTER = ['Wren Ashby', 'Hollis Mear', 'Ida Fenwick', 'Tobias Crane', 'Sylva Renn',
    'Marlow Pike', 'Perrin Oakes', 'Nella Quist', 'Ansel Whitlow', 'Bee Harkness',
    'Corin Vale', 'Dov Attaway', 'Esme Rooke', 'Fay Lindmoor'];
  const ME = 'Ida Fenwick', E = ROSTER.length;
  const initials = (n) => n.split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();

  const DOC = [
    ['h1', 'Part I — The Club'], ['h2', 'Purpose'],
    ['p', 'The Club is a society of friends keeping a house together. It is not a business, not a charity, and not a landlord; it exists for the common enjoyment of its members and for nothing else.'],
    ['h2', 'Name and Seat'],
    ['p', 'The Club is called The Hollow Oak Club, after the tree that stood in the garden until the storm of the second winter.'],
    ['h1', 'Part II — The House'], ['h2', 'The Kitchen'],
    ['p', 'Whoever cooks does not clear. Whoever clears does not have to have eaten.'],
  ];

  const S = { state: 'ask', quorum: null, bar: null,
    authorship: null, signing: null, judgments: null, machines: null,
    seen: new Set(), open: null };

  // ---- the document, behind everything ----------------------------------
  function renderDoc() {
    document.getElementById('doc').innerHTML = '<div class="prose">' + DOC.map(([t, x], i) =>
      t === 'p' ? '<p>' + esc(x) + '</p>'
        : '<h2 class="docline lvl' + (t === 'h1' ? 1 : 2) + '" id="h' + i + '">' + esc(x) + '</h2>').join('') + '</div>';
    document.getElementById('toc').innerHTML = DOC.map(([t, x], i) =>
      t === 'p' ? '' : '<li class="lvl' + (t === 'h1' ? 1 : 2) + '"><a href="#h' + i + '">' + esc(x) + '</a></li>').join('');
  }

  // ---- the questions -----------------------------------------------------
  // **A second alphabet, and it is a different job from the first** (Ed,
  // 2026-08-17, proposing 👥 ✒️ 👤 🤖). The `lifecycle mark` says *what the
  // document wants from you* — and it works in the live rail because every card
  // there is a different state of the same kind of thing, a judgment. A setup
  // rail is the other way round: every card is the same state of a **different
  // kind of thing**, so a state glyph would say nothing that distinguished one
  // from another. So the live rail marks **state** and this one marks
  // **subject**, and the two sets never appear in the same column.
  //
  // ✒️ is not a new sign at all — the topbar has written the threshold as
  // `74%✒️` since the units landed, so the glyph already means exactly this.
  // 👤 is likewise the `sealed-speaker`'s own disc: an unnamed person is
  // already what it means on this surface. Its risk, worth watching at 13px:
  // it is one silhouette against 👥's two, and the two cards sit near each
  // other — the meaning is inherited but the shape is not far off.
  //
  // Lifecycle is carried by the card instead: **left says what it is about,
  // right says whether it is done**, and the wash fills as the room answers.
  const CARDS = [
    { k: 'quorum', g: '👥', t: 'Quorum', in: 11,
      val: () => (S.quorum === null ? 'The lowest you will accept' : 'You said ' + S.quorum + ' of ' + E) },
    { k: 'bar', g: '✒️', t: 'The bar', in: 9,
      val: () => (S.bar === null ? 'The lowest you will accept' : 'You said ' + S.bar + '%') },
    { k: 'disclosure', g: '👤', t: 'Who may be seen', in: 7,
      val: () => (!S.authorship ? 'The most you will accept'
        : 'You said ' + { anonymous: 'no names, ever', sealed: 'names at the close', public: 'names from the start' }[S.authorship]) },
    { k: 'machines', g: '🤖', t: 'Machine participants', in: 12,
      val: () => (S.machines === null ? 'The most you will accept'
        : 'You said ' + (S.machines ? 'a machine member is fine' : 'people only')) },
  ];
  const answered = (c) => ({
    quorum: () => S.quorum !== null, bar: () => S.bar !== null,
    disclosure: () => !!S.authorship && !!S.signing && !!S.judgments,
    machines: () => S.machines !== null,
  })[c.k]();
  // **Your own ceremony gates your own proposing** (Ed, 2026-08-17: *they can't
  // propose until their ceremony is done*). Which is the right rule and a
  // better one than the convenor-side gate it replaces: you should not be able
  // to act on a document whose rules you have not yet said what you will accept
  // of. Reading is the only thing available before you answer. Judging waits on
  // the *room*, because a judgment is counted against a quorum that does not
  // exist until everybody has spoken.
  const mine = () => CARDS.every((c) => answered(c) && S.seen.has(c.k));

  // ---- the rail ----------------------------------------------------------
  function renderRail() {
    const rail = document.getElementById('rail');
    if (S.state === 'waiting') {
      rail.innerHTML = '<div class="qhead">Sent</div>' +
        '<div style="padding:0 10px"><p style="font-size:var(--t-small);margin:0 0 var(--s3)">' +
        '<b>Nine of fourteen</b> have answered. Judging opens when everyone has.</p>' +
        '<div class="pips">' + ROSTER.map((_, i) => '<span class="pip' + (i < 9 ? ' in' : '') + '"></span>').join('') + '</div>' +
        '<p style="font-size:var(--t-cap);color:var(--muted);margin:0">You will not see anybody’s answer and nobody will see yours. ' +
        'Your own is in, so you can propose changes to the charter while the rest finish.</p>' +
        '<p style="margin-top:var(--s3)"><button class="btn-send" data-act="change" style="background:var(--bg);color:var(--fg);border-color:var(--border)">Change my answers</button></p></div>';
      return;
    }
    if (S.state === 'settled') {
      rail.innerHTML = '<div class="qhead">Settled</div>' +
        CARDS.map((c) => '<li class="qitem" style="list-style:none"><button class="deciding"' +
          ' style="--washcol: rgba(var(--lc-closed),0.16); --washbg: rgba(var(--lc-closed),0.06); --fill:100%">' +
          '<span class="ql"><span>' + c.t + '</span><span class="setmark">' + TICK + '</span></span>' +
          '<span class="qwhy">' + esc({ quorum: '10 of 14', bar: '80%', disclosure: 'No names, ever', machines: 'People only' }[c.k]) + '</span>' +
          '</button></li>').join('') +
        '<div class="sendrow"><button class="btn-send" data-act="record">See what the room asked for</button>' +
        '<div class="railnote">Judging is open.</div></div>';
      return;
    }
    // **No "send my answers"** (Ed, 2026-08-17). There was a button because I
    // had modelled the ceremony as a form with a submit; it is a queue, and a
    // queue is finished when it is empty. The last card you confirm is the act.
    //
    // And the cards **fill as the room answers**, exactly as a race card does:
    // the wash's bar is how far through this question the roster is, so after
    // you have answered the rail stops being a to-do list and becomes what it
    // is everywhere else — a place to watch something you are already part of.
    rail.innerHTML = '<div class="qhead">' +
      (mine() ? 'Waiting on the room' : 'Before you can take part') + '</div>' +
      CARDS.map((c) => {
        const done = answered(c) && S.seen.has(c.k);
        const col = done ? 'rgba(var(--lc-deciding), 0.22)' : 'rgba(var(--lc-open), 0.22)';
        const bg = done ? 'rgba(var(--lc-deciding), 0.06)' : 'rgba(var(--lc-open), 0.06)';
        const fill = done ? Math.round(c.in / E * 100) + '%' : '100%';
        return '<li class="qitem" style="list-style:none" data-q="' + c.k + '">' +
          '<button class="' + (done ? 'deciding' : 'needs') + '" data-card="' + c.k + '"' +
          ' title="' + (done ? c.in + ' of ' + E + ' have answered this one' : 'Not answered yet') + '"' +
          ' style="--washcol: ' + col + '; --washbg: ' + bg + '; --fill: ' + fill + '">' +
          '<span class="ql"><span class="subj" aria-hidden="true">' + c.g + '</span>' +
          '<span>' + c.t + '</span><span class="setmark">' + (done ? TICK : '') + '</span></span>' +
          '<span class="qwhy">' + esc(c.val()) +
          (done ? ' · ' + c.in + ' of ' + E + ' in' : '') + '</span></button></li>';
      }).join('') +
      '<div class="railnote">' + (mine()
        ? 'Your answers are sealed. Judging opens when everyone has finished theirs.'
        : 'You can read the charter now. Proposing and judging both wait on these.') + '</div>';
  }

  // ---- the modal ---------------------------------------------------------
  const whoBox = () =>
    '<div class="whobox"><div class="lab">Fourteen people will hold this charter between them. ' +
    'What you are about to say is how much of <b>this room</b> you need behind a change before it moves.</div>' +
    '<div class="faces">' + ROSTER.map((n) =>
      '<span class="pf' + (n === ME ? ' me' : '') + '"><span class="av">' + initials(n) + '</span>' +
      n + (n === ME ? ' (you)' : '') + '</span>').join('') + '</div></div>';

  const slider = (key, min, max, fmt, mean) => {
    const v = S[key];
    return '<div class="cs' + (v === null ? ' unset' : '') + '">' +
      '<div class="csval' + (v === null ? ' unset' : '') + '">' + (v === null ? 'Drag to answer' : fmt(v)) + '</div>' +
      '<input type="range" min="' + min + '" max="' + max + '" value="' + (v === null ? Math.round((min + max) / 2) : v) + '"' +
      ' data-slide="' + key + '">' +
      '<div class="csends"><span>' + fmt(min) + '</span><span>' + fmt(max) + '</span></div>' +
      '<div class="csmean">' + (v === null ? mean(min) + '<br>' + mean(max) : mean(v)) + '</div></div>';
  };

  const ladder = (key, rungs) => '<div class="ladder" role="radiogroup">' + rungs.map((r, i) => {
    const at = rungs.findIndex((x) => x.v === S[key]);
    return '<div class="rung' + (S[key] === r.v ? ' on' : '') + (at >= 0 && i > at ? ' above' : '') +
      '" role="radio" tabindex="0" aria-checked="' + (S[key] === r.v) + '" data-pick="' + key + '" data-val="' + r.v + '">' +
      '<span class="dot"></span><span><span class="ttl">' + r.t + '</span><span class="exp">' + r.e + '</span></span></div>';
  }).join('') + '</div>';

  const BODY = {
    quorum: () => '<h2>The lowest quorum I will accept</h2>' + whoBox() +
      '<p class="why">How many of the fourteen must weigh in on a question before it can change the charter. A question short of quorum simply waits — nobody’s silence is ever counted as a vote.</p>' +
      slider('quorum', 1, E, (v) => v + ' of ' + E, (v) =>
        v >= E ? 'Nothing moves unless every member has weighed in. A charter that cannot change without all fourteen is a perfectly reasonable thing to want.'
        : v <= Math.ceil(E / 4) ? 'A small part of the room can carry a change while the rest are elsewhere.'
        : 'Rather more than half the room has to have looked at a question before it can move.') +
      '<p class="blindnote">Nobody sees your answer. The charter takes the <b>highest</b> of the fourteen, so it will never be lower than what you say here.</p>',
    bar: () => '<h2>The lowest bar I will accept</h2>' + whoBox() +
      '<p class="why">How sure the room has to be that a new wording beats the one it would replace. A confidence, not a vote share — at 60% a change goes through on a real but slender preference; at 90% only something close to agreement moves anything.</p>' +
      slider('bar', 50, 95, (v) => v + '%', (v) =>
        v >= 85 ? 'Only near-agreement changes anything. Expect the charter to move slowly and keep most of what it started with.'
        : v <= 60 ? 'A modest preference is enough. The charter will move quickly, and reverse itself more often.'
        : 'A clear preference is needed, but not agreement.') +
      '<p class="blindnote">Nobody sees your answer. The charter takes the <b>highest</b> of the fourteen.</p>',
    disclosure: () => '<h2>The most I am willing to be seen</h2>' +
      '<p class="why">Three questions about who may be seen and when. Here the rule runs the other way: the charter takes the <b>most private</b> answer, so one person who wants to stay unnamed keeps the whole charter unnamed. Nothing is preselected — anonymity holds unless every one of the fourteen is content with more.</p>' +
      '<div class="eyebrow" style="margin-bottom:var(--s2)">Whose proposal it is</div>' +
      ladder('authorship', [
        { v: 'anonymous', t: 'Nobody’s name, ever', e: 'Not during the session and not in the closing record.' },
        { v: 'sealed', t: 'Names at the close', e: 'Hidden while the charter is being written; published with the record.' },
        { v: 'public', t: 'Names from the start', e: 'Everyone can see who proposed what, as it happens.' }]) +
      '<div class="eyebrow" style="margin:var(--s5) 0 var(--s2)">Signing</div>' +
      ladder('signing', [
        { v: 'nobody', t: 'Nobody signs', e: 'The only setting under which an unsigned proposal says nothing about whoever wrote it.' },
        { v: 'each', t: 'Each author chooses', e: 'In a room of fourteen, an unsigned one among signed ones says something.' },
        { v: 'everybody', t: 'Everybody signs', e: 'Uniform in the other direction.' }]) +
      '<div class="eyebrow" style="margin:var(--s5) 0 var(--s2)">Your judgments</div>' +
      ladder('judgments', [
        { v: 'never', t: 'Never revealed', e: 'What you preferred stays yours, permanently.' },
        { v: 'after', t: 'Revealed once the decision is made', e: 'Never while a question is still being judged — that would make the room read each other instead of the text.' }]),
    machines: () => '<h2>The most I will accept</h2>' +
      '<p class="why">The convenor has offered a machine member — a coherence auditor that patrols for drift and proposes fixes. It holds a budget like anybody else. The <b>most restrictive</b> answer wins, so if you would rather not draft alongside one, it stays out.</p>' +
      ladder('machines', [
        { v: 'false', t: 'People only', e: 'No machine member in this charter.' },
        { v: 'true', t: 'A machine member is fine', e: 'It competes on the same terms as anybody else and can be out-judged like anybody else.' }]),
  };

  function renderModal() {
    const root = document.getElementById('modalroot');
    if (!S.open) { root.innerHTML = ''; return; }
    const c = CARDS.find((x) => x.k === S.open);
    root.innerHTML = '<div class="scrim" data-close="1"><div class="sugg quick-open" role="dialog" aria-modal="true">' +
      BODY[S.open]() +
      '<div class="race-mid commitrow"><button class="btn" data-close="1">Cancel</button>' +
      '<button class="btn btn-approve glyphbtn"' + (answered(c) ? '' : ' disabled') +
      ' data-confirm="1" title="' + (answered(c) ? 'Confirm' : 'Not answered yet') + '">' + TICK + '</button>' +
      '</div></div></div>';
  }

  function renderStates() {
    document.getElementById('states').innerHTML =
      [['ask', 'Answering'], ['waiting', 'Waiting'], ['settled', 'Settled']].map(([k, t]) =>
        '<button data-state="' + k + '" aria-pressed="' + (S.state === k) + '">' + t + '</button>').join('');
    document.getElementById('stat').textContent = S.state === 'settled'
      ? 'open — reading, proposing and judging'
      : mine() ? 'you can propose · judging waits on the room'
      : 'reading only · proposing waits on your answers';
  }

  const render = () => { renderStates(); renderRail(); renderModal(); };

  document.addEventListener('click', (ev) => {
    const st = ev.target.closest('[data-state]');
    if (st) { S.state = st.dataset.state; S.open = null; return render(); }
    const c = ev.target.closest('[data-card]');
    if (c) { S.open = c.dataset.card; return render(); }
    if (ev.target.closest('[data-confirm]')) { S.seen.add(S.open); S.open = null; return render(); }
    const p = ev.target.closest('[data-pick]');
    if (p) { const v = p.dataset.val;
      S[p.dataset.pick] = (v === 'true') ? true : (v === 'false') ? false : v; return render(); }
    // **Only the scrim itself closes, and only a button that says so.**
    // `data-close` sits on the scrim, and the scrim is an ancestor of every
    // control in the card — so `closest('[data-close]')` matched on *every*
    // click inside the modal and shut it before the option it had just set
    // could be seen. It looked like the radios were not working; they were
    // working and then being thrown away. Tested last, and against the target
    // rather than its ancestry.
    if (ev.target.closest('button[data-close]') || ev.target.classList.contains('scrim')) {
      S.open = null; return render(); }
    const a = ev.target.closest('[data-act]');
    if (a) {
      if (a.dataset.act === 'change') S.state = 'ask';
      if (a.dataset.act === 'record') S.open = null;
      return render();
    }
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && S.open) { S.open = null; return render(); }
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    const p = ev.target.closest('[data-pick]');
    if (p) { ev.preventDefault(); p.click(); }
  });
  document.addEventListener('input', (ev) => {
    const r = ev.target.closest('[data-slide]');
    if (!r) return;
    S[r.dataset.slide] = +r.value;
    render();
    const again = document.querySelector('[data-slide="' + r.dataset.slide + '"]');
    if (again) again.focus();
  });

  renderDoc(); render();
})();
</script>
