<meta charset="utf-8">
<title>Opening ceremony</title>
<link rel="stylesheet" href="system.css">
<link rel="stylesheet" href="setup.css">
<style>
/* ============================================================================
   founding-ceremony — **document-creation, seen by somebody else.**

   Ed, 2026-08-17: *the roster members as they arrive get their opening ceremony
   questions in the right-sidebar as cards, and once they're done they can
   start.* Then 2026-08-18: *the admin's cards are visible to the roster (but not
   editable by them); the roster's cards are visible to the admin (with
   completion bar).* And then: *the convenor's settings sit in one pile, and
   participants' in the pile below.*

   Those three make this screen and the convenor's screen the same screen, which
   is why so little lives in this file. Two piles at the head of the document
   hold the whole constitution — the convenor's above, the participants' below —
   and what differs between the two surfaces is only **which pile is yours**. A
   member answers the ones handed over, reads the rest, and watches the ones they
   have answered fill up as the room catches them.

   Three states, switchable in the topbar so all are inspectable: answering ·
   waiting · settled.
   ========================================================================== */
  .states { display: flex; gap: var(--s1); }
  .states button { font: inherit; font-size: var(--t-cap); padding: 3px var(--s3); cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); color: var(--muted); border-radius: 999px; }
  .states button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
</style>

<header class="navbar">
  <div class="wrap">
    <p class="brand">The Hollow Oak Club — House Charter <span class="sess">· opening ceremony</span></p>
    <div class="stats">
      <span id="stat">reading only · proposing waits on your answers</span>
      <span class="states" id="states"></span>
      <button class="me" id="mebtn" title="You."></button>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="layout">
    <nav class="toc"><ul id="toc"></ul></nav>
    <main>
      <div class="doc" id="doc">
        <div class="setupband" id="band"></div>
        <div class="prose" id="prose"></div>
      </div>
    </main>
    <aside class="queue stack"><div id="rail"></div></aside>
  </div>
</div>
<svg id="wires" aria-hidden="true"></svg>

<script src="setup.js"></script>
<script>
(function () {
  const { esc, TICK, avHtml, bandHtml, fitBand, railEntry, cardHtml, readBody,
    watchBody, nameBody, pictureBody, drawWire, opt, faces, someIn } = window.SETUP;
  const band = document.getElementById('band');
  const rail = document.getElementById('rail');
  const wires = document.getElementById('wires');

  const ROSTER = ['Wren Ashby', 'Hollis Mear', 'Ida Fenwick', 'Tobias Crane', 'Sylva Renn',
    'Marlow Pike', 'Perrin Oakes', 'Nella Quist', 'Ansel Whitlow', 'Bee Harkness',
    'Corin Vale', 'Dov Attaway', 'Esme Rooke', 'Fay Lindmoor']
    .map((n, i) => ({ n, pic: i % 3 === 0 ? 'c' + (i % 6) : (i % 5 === 0 ? 'm' + (i % 3) : '') }));
  const E = ROSTER.length;

  const DOC = [
    ['h1', 'Part I — The Club'], ['h2', 'Purpose'],
    ['p', 'The Club is a society of friends keeping a house together. It is not a business, not a charity, and not a landlord; it exists for the common enjoyment of its members and for nothing else.'],
    ['h2', 'Name and Seat'],
    ['p', 'The Club is called The Hollow Oak Club, after the tree that stood in the garden until the storm of the second winter.'],
    ['h1', 'Part II — The House'], ['h2', 'The Kitchen'],
    ['p', 'Whoever cooks does not clear. Whoever clears does not have to have eaten.'],
  ];

  const S = { state: 'ask', myname: 'Ida Fenwick', mypic: '',
    quorum: null, bar: null, authorship: null, signing: null, judgments: null,
    grant: null, drip: null, stake: null, machines: null,
    seen: new Set(), open: null };
  const me = () => ({ n: S.myname, pic: S.mypic });

  function renderDoc() {
    document.getElementById('prose').innerHTML = DOC.map(([t, x], i) =>
      t === 'p' ? '<p>' + esc(x) + '</p>'
        : '<h2 class="docline lvl' + (t === 'h1' ? 1 : 2) + '" id="h' + i + '">' + esc(x) + '</h2>').join('');
    document.getElementById('toc').innerHTML = DOC.map(([t, x], i) =>
      t === 'p' ? '' : '<li class="lvl' + (t === 'h1' ? 1 : 2) + '"><a href="#h' + i + '">' + esc(x) + '</a></li>').join('');
  }

  // ---- the cards ---------------------------------------------------------
  // **A second alphabet, doing a different job from the first.** The `lifecycle
  // mark` says *what the document wants from you*, and it works in the live rail
  // because every card there is a different state of one kind of thing — a
  // judgment. A setup rail is the other way round: every card is the same state
  // of a **different kind of thing**, so a state glyph would distinguish
  // nothing. The live rail marks **state**; this one marks **subject**.
  //
  // Since the decomposition of 2026-08-18 a member answers nine of these rather
  // than four, because *who may be seen* is three questions and the economy is
  // three more. Whether nine blind consent questions is too many to put in front
  // of somebody who came to read a charter is Q322.
  const ROOM = [
    { k: 'myname', g: '📛', t: 'Your name', own: 'you', ready: () => !!S.myname.trim() },
    { k: 'mypic', g: '🙂', t: 'Your picture', own: 'you' },
    { k: 'quorum', g: '👥', t: 'Quorum', in: 11,
      rule: 'Each member states the <b>lowest quorum</b> they will accept and the charter takes the highest.',
      takes: 'The charter takes the highest', result: '10 of 14',
      dist: [0, 0, 1, 1, 2, 3, 2, 2, 1, 1, 1, 0, 0, 0], distTop: 9, distEnds: ['1 of 14', 'all of them'] },
    { k: 'bar', g: '✒️', t: 'The bar', in: 9,
      rule: 'Each member states the <b>lowest bar</b> they will accept and the charter takes the highest.',
      takes: 'The charter takes the highest', result: '80%',
      dist: [0, 1, 2, 3, 2, 1, 2, 1, 1, 1], distTop: 8, distEnds: ['50%', '95%'] },
    { k: 'authorship', g: '👤', t: 'Whose proposal it is', in: 7,
      rule: 'A privacy question, so the <b>most private</b> answer wins: one member who wants to stay unnamed keeps the whole charter unnamed.',
      takes: 'The charter takes the most private', result: 'Nobody’s name, ever',
      dist: [8, 4, 2], distTop: 0, distEnds: ['No names, ever', 'Names from the start'] },
    { k: 'signing', g: '✍️', t: 'Signing', in: 7,
      rule: 'Also a privacy question, and the <b>most private</b> answer wins.',
      takes: 'The charter takes the most private', result: 'Nobody signs',
      dist: [9, 3, 2], distTop: 0, distEnds: ['Nobody signs', 'Everybody signs'] },
    { k: 'judgments', g: '👁️', t: 'Your judgments', in: 12,
      rule: 'Never revealed while a question is live, whichever is chosen. What this settles is only whether they are published with the record.',
      takes: 'The charter takes the most private', result: 'Never revealed',
      dist: [11, 3], distTop: 0, distEnds: ['Never', 'After the decision'] },
    { k: 'grant', g: '🪙', t: 'The starting grant', in: 5,
      rule: 'Each member states the <b>fewest edits</b> they would accept being given, and the charter takes the most generous.',
      takes: 'The charter takes the most generous', result: '5 edits',
      dist: [1, 2, 4, 3, 2, 1, 1], distTop: 4, distEnds: ['0', '12'] },
    { k: 'drip', g: '💧', t: 'The drip', in: 5,
      rule: 'Each member states the <b>slowest drip</b> they would accept, and the charter takes the fastest.',
      takes: 'The charter takes the fastest', result: '1 per 10%',
      dist: [2, 3, 5, 2, 1, 1], distTop: 2, distEnds: ['slowest', 'fastest'] },
    { k: 'stake', g: '🎲', t: 'The stake', in: 4,
      rule: 'A stake is a risk imposed on the proposer, so consent runs the way privacy does: each states the <b>highest</b> they would accept and the charter takes the lowest.',
      takes: 'The charter takes the lowest', result: '1 edit',
      dist: [3, 7, 3, 1], distTop: 1, distEnds: ['none', '3 edits'] },
    { k: 'machines', g: '🤖', t: 'Machine participants', in: 12,
      rule: 'The <b>most restrictive</b> answer wins, so a single member who would rather not draft alongside a machine keeps it out.',
      takes: 'The charter takes the most restrictive', result: 'People only',
      dist: [9, 5], distTop: 0, distEnds: ['People only', 'A machine is fine'] },
  ];
  // The convenor's own, as a member meets them: readable, never editable.
  // Read-only is not the same as hidden — the whole point of a pile at the head
  // of the document is that the constitution is legible to everyone it binds.
  const CONVENOR = [
    { k: 'text', g: '📄', t: 'The starting text', own: 'convenor', v: '42 blocks, 9 sections' },
    { k: 'title', g: '🏷️', t: 'The title', own: 'convenor', v: 'The Hollow Oak Club — House Charter' },
    { k: 'slug', g: '🔗', t: 'The link', own: 'convenor', v: 'draft.to/hollow-oak-4f2a' },
    { k: 'roster', g: '✉️', t: 'The roster', own: 'convenor', v: '14 drafting, 1 watching' },
    { k: 'myrole', g: '🎩', t: 'The convenor’s part', own: 'convenor', v: 'Wren Ashby is drafting too',
      setBy: 'Chosen by Wren Ashby when they set the charter up',
      readNote: 'A convenor may instead be the <b>clerk</b> — administering without writing, with no wallet, no judgments and no place in quorum.' },
    { k: 'ending', g: '📅', t: 'Whether it ends', own: 'convenor', v: 'It ends at a set time' },
    { k: 'endsAt', g: '⏰', t: 'When it ends', own: 'convenor', v: 'Thursday 18:00',
      readNote: 'The bar rises towards that moment, and the drip is paced against it.' },
    { k: 'chamber', g: '🔭', t: 'Who else can see it', own: 'convenor', v: 'Anyone with the link' },
  ];
  const CARDS = ROOM.concat(CONVENOR);
  const card = (k) => CARDS.find((c) => c.k === k);

  const ANSWERED = {
    quorum: () => S.quorum !== null, bar: () => S.bar !== null,
    authorship: () => !!S.authorship, signing: () => !!S.signing, judgments: () => !!S.judgments,
    grant: () => S.grant !== null, drip: () => S.drip !== null, stake: () => S.stake !== null,
    machines: () => S.machines !== null, myname: () => !!S.myname.trim(),
  };
  const ready = (c) => (ANSWERED[c.k] ? ANSWERED[c.k]() : true);
  const settled = (c) => (c.own === 'convenor' ? true : (S.seen.has(c.k) && ready(c)));
  const mustAct = (c) => c.own !== 'convenor' && !settled(c);
  const isRoom = (c) => c.own !== 'convenor' && c.own !== 'you';

  const groups = () => [
    { key: 'convenor', label: 'The convenor', cards: CONVENOR,
      note: () => 'settled before you arrived' },
    { key: 'room', label: 'The participants', cards: ROOM,
      note: (n) => (n ? n + ' still want you' : 'all answered') },
  ];

  // **Your own ceremony gates your own proposing** (Ed, 2026-08-17). You should
  // not be able to act on a document whose rules you have not yet said what you
  // will accept of. Judging waits on the *room*, because a judgment is counted
  // against a quorum that does not exist until everybody has spoken.
  const mine = () => ROOM.every(settled);
  const roomDone = () => ROOM.every((c) => c.own === 'you' || (c.in || 0) >= E);

  const VALUE = {
    myname: () => S.myname || 'Unnamed',
    mypic: () => (S.mypic ? 'Chosen' : 'Your initials'),
    quorum: () => (S.quorum === null ? 'The lowest you will accept' : 'You said ' + S.quorum + ' of ' + E),
    bar: () => (S.bar === null ? 'The lowest you will accept' : 'You said ' + S.bar + '%'),
    authorship: () => (!S.authorship ? 'The most you will accept' : 'You said ' +
      { anonymous: 'no names, ever', sealed: 'names at the close', public: 'names from the start' }[S.authorship]),
    signing: () => (!S.signing ? 'The most you will accept' : 'You said ' +
      { nobody: 'nobody signs', each: 'each author chooses', everybody: 'everybody signs' }[S.signing]),
    judgments: () => (!S.judgments ? 'The most you will accept' : 'You said ' +
      { never: 'never revealed', after: 'revealed after the decision' }[S.judgments]),
    grant: () => (S.grant === null ? 'The fewest you will accept' : 'You said ' + S.grant + ' to start'),
    drip: () => (S.drip === null ? 'The slowest you will accept' : 'You said 1 per ' + S.drip + '%'),
    stake: () => (S.stake === null ? 'The most you will accept'
      : 'You said ' + (S.stake ? S.stake + ' staked' : 'nothing staked')),
    machines: () => (S.machines === null ? 'The most you will accept'
      : 'You said ' + (S.machines ? 'a machine member is fine' : 'people only')),
  };
  const value = (c) => esc(VALUE[c.k] ? VALUE[c.k]() : c.v);
  const summary = (c) => (isRoom(c) && settled(c)
    ? value(c) + ' · ' + someIn(c.in || 0, E) : value(c));

  const ctx = {
    get open() { return S.open; }, get E() { return E; },
    mustAct, settled, summary, value, isRoom,
    bandLabel: (c) => (c.own === 'convenor' ? 'Set by the convenor'
      : c.own === 'you' ? 'Yours alone' : 'The participants decide'),
  };

  // ---- the rail ----------------------------------------------------------
  // Your own pile first — which on this surface is the participants' — then the
  // convenor's. The same two groups as the band, in the order that puts what
  // wants you at the top.
  function renderRail() {
    const gs = groups().slice().reverse();
    rail.innerHTML = '<ul>' + gs.map((g) =>
      '<li class="qhead">' + esc(g.label) + '</li>' +
      g.cards.map((c) => railEntry(c, ctx)).join('')).join('') + '</ul>' +
      '<div class="railnote">' + (roomDone()
        ? 'The constitution is settled. Judging is open.'
        : mine() ? 'Your answers are sealed. Judging opens when everyone has finished theirs.'
        : 'You can read the charter now. Proposing and judging both wait on these.') + '</div>';
    document.getElementById('mebtn').innerHTML = avHtml(me(), 'face');
  }

  // ---- the bodies a member fills in --------------------------------------
  const whoBox = (k) => (S.seen.has(k) ? '' :
    '<div class="whobox"><div class="lab">Fourteen people will hold this charter between them. ' +
    'What you are about to say is how much of <b>this room</b> you need behind a change before it moves.</div>' +
    faces(ROSTER, S.myname) + '</div>');

  const slider = (key, min, max, fmt, mean) => {
    const v = S[key];
    return '<div class="cs' + (v === null ? ' unset' : '') + '">' +
      '<div class="csval' + (v === null ? ' unset' : '') + '">' + (v === null ? 'Drag to answer' : fmt(v)) + '</div>' +
      '<input type="range" min="' + min + '" max="' + max + '" value="' + (v === null ? Math.round((min + max) / 2) : v) + '"' +
      ' data-slide="' + key + '">' +
      '<div class="csends"><span>' + fmt(min) + '</span><span>' + fmt(max) + '</span></div>' +
      '<div class="csmean">' + (v === null ? mean(min) + '<br>' + mean(max) : mean(v)) + '</div></div>';
  };

  // `privacy-ladder` — the rungs *above* your answer are dimmed rather than
  // hidden, since *the most I will accept* only reads as a ladder if you can see
  // what you are refusing. The control is the session-view's own radio.
  const ladder = (key, rungs) => '<div class="choice" role="radiogroup">' + rungs.map((r, i) => {
    const at = rungs.findIndex((x) => x.v === S[key]);
    return opt(S, key, r.v, r.t, r.e, '', false, (at >= 0 && i > at) ? ' above' : '');
  }).join('') + '</div>';

  const BLIND = '<p class="blindnote">Nobody sees your answer, and you will see nobody else’s until every one of them is in.</p>';

  const BODY = {
    myname: () => nameBody(me()),
    mypic: () => pictureBody(me()),
    quorum: () => whoBox('quorum') +
      '<p class="why">How many of the fourteen must weigh in on a question before it can change the charter. A question short of quorum simply waits — nobody’s silence is ever counted as a vote.</p>' +
      slider('quorum', 1, E, (v) => v + ' of ' + E, (v) =>
        v >= E ? 'Nothing moves unless every member has weighed in. A charter that cannot change without all fourteen is a perfectly reasonable thing to want.'
        : v <= Math.ceil(E / 4) ? 'A small part of the room can carry a change while the rest are elsewhere.'
        : 'Rather more than half the room has to have looked at a question before it can move.') +
      '<p class="blindnote">Nobody sees your answer. The charter takes the <b>highest</b> of the fourteen, so it will never be lower than what you say here.</p>',
    bar: () => whoBox('bar') +
      '<p class="why">How sure the room has to be that a new wording beats the one it would replace. A confidence, not a vote share — at 60% a change goes through on a real but slender preference; at 90% only something close to agreement moves anything.</p>' +
      slider('bar', 50, 95, (v) => v + '%', (v) =>
        v >= 85 ? 'Only near-agreement changes anything. Expect the charter to move slowly and keep most of what it started with.'
        : v <= 60 ? 'A modest preference is enough. The charter will move quickly, and reverse itself more often.'
        : 'A clear preference is needed, but not agreement.') +
      '<p class="blindnote">Nobody sees your answer. The charter takes the <b>highest</b> of the fourteen.</p>',
    authorship: () =>
      '<p class="why">Rationales are visible whatever the room settles on. What varies is only whether a name is attached to one. Here the rule runs the other way: the charter takes the <b>most private</b> answer, so one person who wants to stay unnamed keeps the whole charter unnamed.</p>' +
      ladder('authorship', [
        { v: 'anonymous', t: 'Nobody’s name, ever', e: 'Not during the session and not in the closing record.' },
        { v: 'sealed', t: 'Names at the close', e: 'Hidden while the charter is being written; published with the record.' },
        { v: 'public', t: 'Names from the start', e: 'Everyone can see who proposed what, as it happens.' }]) +
      '<p class="blindnote">Nothing is preselected — anonymity holds unless every one of the fourteen is content with more.</p>',
    signing: () =>
      '<p class="why">Whether an author may put their name to a proposal that is otherwise unattributed.</p>' +
      ladder('signing', [
        { v: 'nobody', t: 'Nobody signs', e: 'The only setting under which an unsigned proposal says nothing about whoever wrote it.' },
        { v: 'each', t: 'Each author chooses', e: 'In a room of fourteen, an unsigned one among signed ones says something.' },
        { v: 'everybody', t: 'Everybody signs', e: 'Uniform in the other direction.' }]) + BLIND,
    judgments: () =>
      '<p class="why">Never revealed while a question is still being judged, whichever the room settles on — that would make the room read each other instead of the text. What this settles is only whether they are published with the closing record.</p>' +
      ladder('judgments', [
        { v: 'never', t: 'Never revealed', e: 'What you preferred stays yours, permanently.' },
        { v: 'after', t: 'Revealed once the decision is made', e: 'Published with the record, never before it.' }]) + BLIND,
    grant: () =>
      '<p class="why">How many edits everybody holds on the first day. Proposing costs one; withdrawing gives it back. Say the <b>fewest</b> you would accept being given — the charter takes the most generous answer, so nobody ends up with less than they were willing to work with.</p>' +
      slider('grant', 0, 12, (v) => (v === 1 ? '1 edit' : v + ' edits'), (v) =>
        v === 0 ? 'Nobody may propose anything until the drip has run. A real answer, and a very slow start.'
        : v <= 3 ? 'Few enough that a member thinks before spending one.'
        : v >= 9 ? 'Nobody will feel the wallet at all in a session this long.'
        : 'Enough to open two or three fronts at once.') + BLIND,
    drip: () =>
      '<p class="why">How fast a spent edit comes back. Say the <b>slowest</b> you would accept; the charter takes the fastest of the fourteen.</p>' +
      slider('drip', 5, 40, (v) => '1 back per ' + v + '% of the window', (v) =>
        v <= 10 ? 'Ten or more edits over the window. The wallet is a rhythm rather than a budget.'
        : v >= 30 ? 'Three or four all week. Every proposal is a real decision to spend.'
        : 'Five or six over the window.') + BLIND,
    stake: () =>
      '<p class="why">What a proposal risks. A stake comes back in full if you withdraw it, and in proportion to how well it did if it does not carry (§7) — so it prices carelessness rather than disagreement. Say the <b>most</b> you would accept; the charter takes the lowest.</p>' +
      slider('stake', 0, 3, (v) => (v === 0 ? 'Nothing staked' : v === 1 ? '1 edit staked' : v + ' edits staked'), (v) =>
        v === 0 ? 'A proposal costs its edit and risks nothing further.'
        : v >= 3 ? 'A proposal that goes nowhere is expensive. Expect fewer, and more considered.'
        : 'A proposal that goes nowhere costs a little more than one that does.') + BLIND,
    machines: () =>
      '<p class="why">The convenor has offered a machine member — a coherence auditor that patrols for drift and proposes fixes. It holds a budget like anybody else. The <b>most restrictive</b> answer wins, so if you would rather not draft alongside one, it stays out.</p>' +
      ladder('machines', [
        { v: 'false', t: 'People only', e: 'No machine member in this charter.' },
        { v: 'true', t: 'A machine member is fine', e: 'It competes on the same terms as anybody else and can be out-judged like anybody else.' }]) + BLIND,
  };

  // ---- the band ----------------------------------------------------------
  function renderBand() {
    band.innerHTML = bandHtml(groups(), ctx, (g) => {
      const c = card(S.open);
      let body, foot;
      if (c.own === 'convenor') {
        body = readBody(c, ctx);
        foot = '<span></span><button class="btn" data-close="1">OK</button>';
      } else {
        // Once you have answered, the card keeps your answer and grows the
        // watching half underneath — the same half the convenor sees, because it
        // is the same question and neither of you may see more of it than how
        // many have answered until every one of them has.
        body = BODY[c.k]() + (isRoom(c) && settled(c) ? '<div class="body">' + watchBody(c, ctx) + '</div>' : '');
        foot = '<button class="btn" data-close="1">Close</button>' +
          '<button class="btn btn-approve glyphbtn"' + (ready(c) ? '' : ' disabled') +
          ' data-confirm="1" title="' + (ready(c) ? 'Confirm' : 'Not answered yet') + '">' + TICK + '</button>';
      }
      return cardHtml(c, ctx, body, foot, g.cards);
    });
    fitBand(band);
  }

  function renderStates() {
    document.getElementById('states').innerHTML =
      [['ask', 'Answering'], ['waiting', 'Waiting'], ['settled', 'Settled']].map(([k, t]) =>
        '<button data-state="' + k + '" aria-pressed="' + (S.state === k) + '">' + t + '</button>').join('');
    document.getElementById('stat').textContent = roomDone()
      ? 'open — reading, proposing and judging'
      : mine() ? 'you can propose · judging waits on the room'
      : 'reading only · proposing waits on your answers';
  }

  const render = () => { renderStates(); renderRail(); renderBand(); drawWire(wires, S.open); };

  // the three states are a fixture switch, so all of them are inspectable
  const COUNTS = { quorum: 11, bar: 9, authorship: 7, signing: 7, judgments: 12,
    grant: 5, drip: 5, stake: 4, machines: 12 };
  function setState(k) {
    S.state = k; S.open = null;
    if (k === 'ask') {
      S.quorum = S.bar = S.grant = S.drip = S.stake = null;
      S.machines = null; S.authorship = S.signing = S.judgments = null;
      S.mypic = ''; S.seen = new Set();
    } else {
      S.quorum = 10; S.bar = 80; S.authorship = 'anonymous'; S.signing = 'nobody';
      S.judgments = 'never'; S.grant = 5; S.drip = 10; S.stake = 1; S.machines = false;
      S.mypic = 'c2'; S.seen = new Set(ROOM.map((c) => c.k));
    }
    ROOM.forEach((c) => { if (COUNTS[c.k] != null) c.in = k === 'settled' ? E : COUNTS[c.k]; });
  }

  document.addEventListener('click', (ev) => {
    const st = ev.target.closest('[data-state]');
    if (st) { setState(st.dataset.state); return render(); }
    const t = ev.target.closest('[data-tab], [data-card]');
    if (t) { const k = t.dataset.tab || t.dataset.card;
      S.open = (S.open === k) ? null : k; return render(); }
    if (ev.target.closest('[data-confirm]')) { S.seen.add(S.open); S.open = null; return render(); }
    if (ev.target.closest('button[data-close]')) { S.open = null; return render(); }
    const p = ev.target.closest('[data-set]');
    if (p) { const v = p.dataset.val;
      S[p.dataset.set] = (v === 'true') ? true : (v === 'false') ? false : v; return render(); }
    const pic = ev.target.closest('[data-pic]');
    if (pic) { S.mypic = pic.dataset.pic; return render(); }
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && S.open) { S.open = null; return render(); }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.closest('[data-tab]')) {
      ev.preventDefault(); ev.target.closest('[data-tab]').click();
    }
  });
  document.addEventListener('input', (ev) => {
    if (ev.target.dataset.txt === 'myname') {
      S.myname = ev.target.value; renderRail();
      const btn = document.querySelector('[data-confirm]');
      if (btn && S.open) btn.disabled = !ready(card(S.open));
      return;
    }
    const r = ev.target.closest('[data-slide]');
    if (!r) return;
    S[r.dataset.slide] = +r.value;
    render();
    const again = document.querySelector('[data-slide="' + r.dataset.slide + '"]');
    if (again) again.focus();
  });
  addEventListener('resize', () => { fitBand(band); drawWire(wires, S.open); });
  addEventListener('scroll', () => drawWire(wires, S.open), true);

  renderDoc(); render();
})();
</script>
