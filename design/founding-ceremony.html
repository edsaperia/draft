<meta charset="utf-8">
<title>Before we begin</title>
<link rel="stylesheet" href="system.css">
<link rel="stylesheet" href="setup.css">
<style>
/* ============================================================================
   founding-ceremony — **document-creation, seen by somebody else.**

   The word *ceremony* is gone from everything a member reads (Ed, 2026-08-18:
   *something more neutral like "everyone is ready to begin"*). It named a real
   stage and dressed it in robes, which is the wrong signal for a screen whose
   whole argument is that this is ordinary — some questions everybody answers,
   and then you start. What is left is what happens: everyone answers, and when
   everyone is ready the document begins.

   Ed, 2026-08-17: *the roster members as they arrive get their opening ceremony
   questions in the right-sidebar as cards, and once they're done they can
   start.* Then 2026-08-18: *the admin's cards are visible to the roster (but not
   editable by them); the roster's cards are visible to the admin (with
   completion bar).* And then: *the founder's settings sit in one pile, and
   members' in the pile below.*

   Those three make this screen and the founder's screen the same screen, which
   is why so little lives in this file. Two piles at the head of the document
   hold the whole constitution — the founder's above, the members' below —
   and what differs between the two surfaces is only **which pile is yours**. A
   member answers the ones handed over, reads the rest, and watches the ones they
   have answered fill up as the room catches them.

   Three states, switchable in the topbar so all are inspectable: answering ·
   waiting · settled.
   ========================================================================== */
  .states { display: flex; gap: var(--s1); }
  .states button { font: inherit; font-size: var(--t-cap); padding: 3px var(--s3); cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); color: var(--muted); border-radius: 999px; }
  .states button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
</style>

<header class="navbar">
  <div class="wrap">
    <p class="brand">The Hollow Oak Club — House Charter <span class="sess">· before we begin</span></p>
    <div class="stats">
      <span id="stat">reading only · proposing waits on your answers</span>
      <span class="states" id="states"></span>
      <button class="me" id="mebtn" title="You."></button>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="layout">
    <nav class="toc"><ul id="toc"></ul></nav>
    <main>
      <div class="doc" id="doc">
        <h1 class="doctitle" data-card="title" role="button" tabindex="0" title="The title — click to read the rule, or propose changing it">The Hollow Oak Club — House Charter</h1>
        <div class="setupband" id="band"></div>
        <div class="prose" id="prose"></div>
      </div>
    </main>
    <aside class="queue stack"><div id="rail"></div></aside>
  </div>
</div>
<svg id="wires" aria-hidden="true"></svg>

<script src="setup.js"></script>
<script>
(function () {
  const { esc, TICK, avHtml, avatarOptions, bandHtml, fitBand, railEntry, cardHtml, readBody,
    watchBody, nameBody, pictureBody, drawWire, opt, faces, someIn,
    KIND, kindNote, motionBody, motionReopen, motionCompose, routeFor, ANSWER,
    MAILS, renderMailModal, stateOf } = window.SETUP;
  const band = document.getElementById('band');
  const rail = document.getElementById('rail');
  const wires = document.getElementById('wires');

  const ROSTER = ['Wren Ashby', 'Hollis Mear', 'Ida Fenwick', 'Tobias Crane', 'Sylva Renn',
    'Marlow Pike', 'Perrin Oakes', 'Nella Quist', 'Ansel Whitlow', 'Bee Harkness',
    'Corin Vale', 'Dov Attaway', 'Esme Rooke', 'Fay Lindmoor']
    .map((n, i) => ({ n, pic: i % 3 === 0 ? 'c' + (i % 6) : (i % 5 === 0 ? 'm' + (i % 3) : '') }));
  const E = ROSTER.length;

  const DOC = [
    ['h1', 'Part I — The Club'], ['h2', 'Purpose'],
    ['p', 'The Club is a society of friends keeping a house together. It is not a business, not a charity, and not a landlord; it exists for the common enjoyment of its members and for nothing else.'],
    ['h2', 'Name and Seat'],
    ['p', 'The Club is called The Hollow Oak Club, after the tree that stood in the garden until the storm of the second winter.'],
    ['h1', 'Part II — The House'], ['h2', 'The Kitchen'],
    ['p', 'Whoever cooks does not clear. Whoever clears does not have to have eaten.'],
  ];

  const S = { state: 'ask', myname: 'Ida Fenwick', mypic: '',
    quorum: null, bar: null, authorship: null, signing: null, judgments: null,
    chamber: null, ending: null, machines: null,
    // a motion you are writing, and your answers to the ones in flight
    draft: null, mAns: {},
    lapse: null,
    app: { started: false, email: '', emailSent: false, emailVerified: false,
      mailOpen: false, name: '', pic: '', text: '', submitted: false },
    seen: new Set(), okd: new Set(), open: null };
  // the applicant the members see in the settled fixture
  const APPLICANT = { n: 'Marlow Voss', pic: 'm1', judged: 5 };
  const MEMBER_EMAILS = new Set(['ida@hollowoak.club', 'wren@hollowoak.club']);
  const me = () => ({ n: S.myname, pic: S.mypic });

  function renderDoc() {
    document.getElementById('prose').innerHTML = DOC.map(([t, x], i) =>
      t === 'p' ? '<p>' + esc(x) + '</p>'
        : '<h2 class="docline lvl' + (t === 'h1' ? 1 : 2) + '" id="h' + i + '">' + esc(x) + '</h2>').join('');
    // the constitution's sections lead the table of contents (Ed,
    // 2026-08-18) — they are document sections like any other
    document.getElementById('toc').innerHTML =
      '<li class="lvl1"><a href="#cs-constitution">Constitution</a></li>' +
      SEC.filter((s2) => !s2.railOnly).map((s2) =>
        '<li class="lvl2"><a href="#cs-' + s2.key + '">' + esc(s2.title) + '</a></li>').join('') +
      DOC.map(([t, x], i) =>
      t === 'p' ? '' : '<li class="lvl' + (t === 'h1' ? 1 : 2) + '"><a href="#h' + i + '">' + esc(x) + '</a></li>').join('');
  }

  // ---- the cards ---------------------------------------------------------
  // **The subject glyph is the mark only while the question is asking** (Ed,
  // 2026-08-18, retiring half of the second-alphabet defence that stood here).
  // The half that survives: a setup rail is many questions in one state, so
  // while they ask, the informative mark is *which*. The half that went: the
  // moment a card is not asking, it speaks the session-view's own alphabet —
  // ⏳ waiting, drawn ✔ decided (green and pinned while it is news, grey once
  // filed), ✏️ yours. The grammar lives in setup.js.
  //
  // Since the decomposition of 2026-08-18 a member answers nine of these rather
  // than four — *who may be seen* alone is three questions, and a name and a
  // picture are two more. The proposal rate is not among them here: the founder
  // holds it by default (§9.7), because the room can take an ordinary setting
  // back cheaply and cannot take a constitutional one back at all.
  const ROOM = [
    { k: 'myname', g: '✋', t: 'Your Name', kind: 'personal', own: 'you', ready: () => !!S.myname.trim() },
    { k: 'mypic', g: '🖼️', t: 'Your Picture', kind: 'personal', own: 'you' },
    { k: 'quorum', g: '👥', t: 'Quorum', kind: 'constitutional', in: 11,
      rule: 'Each member states the <b>lowest quorum</b> they will accept and the charter takes the highest.',
      takes: 'The charter takes the highest', result: '10 of 14',
      dist: [0, 0, 1, 1, 2, 3, 2, 2, 1, 1, 1, 0, 0, 0], distTop: 9, distEnds: ['1 of 14', 'all of them'] },
    { k: 'bar', g: '✒️', t: 'How Sure Must the Room Be?', kind: 'constitutional', in: 9,
      rule: 'Each member states the <b>lowest bar</b> they will accept and the charter takes the highest.',
      takes: 'The charter takes the highest', result: '80%',
      dist: [0, 1, 2, 3, 2, 1, 2, 1, 1, 1], distTop: 8, distEnds: ['50%', '95%'] },
    { k: 'authorship', g: '👤', t: 'When Is a Proposer Named?', kind: 'constitutional', in: 7,
      rule: 'A privacy question, so the <b>most private</b> answer wins: one member who wants to stay unnamed keeps the whole charter unnamed.',
      takes: 'The charter takes the most private', result: 'Nobody’s name, ever',
      dist: [8, 4, 2], distTop: 0, distEnds: ['No names, ever', 'Names from the start'] },
    { k: 'signing', g: '✍️', t: 'Who May Sign a Proposal?', kind: 'constitutional', in: 7,
      rule: 'Also a privacy question, and the <b>most private</b> answer wins.',
      takes: 'The charter takes the most private', result: 'Nobody signs',
      dist: [9, 3, 2], distTop: 0, distEnds: ['Nobody signs', 'Everybody signs'] },
    { k: 'judgments', g: '👁️', t: 'When Are Judgments Revealed?', kind: 'constitutional', in: 12,
      rule: 'Never revealed while a question is live, whichever is chosen. What this settles is only whether they are published with the record.',
      takes: 'The charter takes the most private', result: 'Never revealed',
      dist: [11, 3], distTop: 0, distEnds: ['Never', 'After the decision'] },
    { k: 'chamber', g: '🌍', t: 'Visibility', kind: 'constitutional', in: 6,
      rule: 'A privacy question, so the <b>most private</b> answer wins: one member who wants the room closed closes it.',
      takes: 'The charter takes the most private', result: 'Members only',
      dist: [5, 8, 1], distTop: 1, distEnds: ['Members only', 'Public'] },
    { k: 'lapse', g: '💤', t: 'Do Memberships Lapse?', kind: 'constitutional', in: 8,
      rule: 'Each member states the <b>shortest period of inactivity</b> they would accept being lapsed after, and the document takes the longest — <b>never</b> being the longest of all.',
      takes: 'The document takes the longest', result: 'Never',
      dist: [1, 3, 4, 2, 4], distTop: 4, distEnds: ['30 days', 'Never'] },
    { k: 'machines', g: '🤖', t: 'AI Proposals', kind: 'constitutional', in: 12,
      rule: 'The <b>most restrictive</b> answer wins, so a single member who would rather not have AI proposals keeps them out.',
      takes: 'The charter takes the most restrictive', result: 'No AI proposals',
      dist: [9, 5], distTop: 0, distEnds: ['People only', 'A machine is fine'] },
  ];
  // The founder's own, as a member meets them: readable, never editable.
  // Read-only is not the same as hidden — the whole point of a pile at the head
  // of the document is that the constitution is legible to everyone it binds.
  const CONVENOR = [
    { k: 'text', g: '📄', t: 'Starting Text', own: 'founder', kind: 'ordinary', v: '42 blocks, 9 sections' },
    // inDoc: the heading at the top of the document IS the title (Ed)
    { k: 'title', g: '🏷️', t: 'Title', own: 'founder', kind: 'ordinary', inDoc: true, v: 'The Hollow Oak Club — House Charter' },
    { k: 'slug', g: '🔗', t: 'Link', own: 'founder', kind: 'ordinary', v: 'docs.vote/hollow-oak-4f2a' },
    { k: 'roster', g: '🪪', t: 'Membership', own: 'founder', kind: 'constitutional', v: 'Fourteen members',
      // 🎩 folded in (Ed, 2026-08-18): whether the founder is a member is
      // their own row in this list, pre-checked when the document was made
      setBy: 'Invited by Wren Ashby — themselves included, their own row pre-checked',
      readNote: 'Anybody else who can read this is not a member — nothing is known about them, they have a link and nothing else. That is the 🌍 setting, not this one.' },
    // **The register and the door are two decisions** (Ed, 2026-08-18). This
    // card also un-swallows a note the old single card had lost: two readNote
    // keys on one object, and the reserved one silently overridden.
    { k: 'policy', g: '🤝', t: 'Applications', own: 'founder', kind: 'constitutional', v: 'Anyone may apply',
      readNote: 'The membership here is the members’ — joining and leaving are theirs to decide, and applications go before them as proposals (✏️). Had Wren <b>reserved</b> it, Wren would be a 👑 — the founder of a document that reserves its membership, invite-and-remove staying in their hand; a crown lapses like a member, and a lapsed crown passes to the members.' },
    // One card, two routes to change it — see the ⏰ entry in document-creation.
    { k: 'ending', g: '⏰', t: 'When Does It End?', own: 'founder', kind: 'constitutional',
      motionKind: 'ordinary', v: 'Thursday 18:00',
      // 329(a): *never* is the constitutional answer; any date is ordinary.
      routeOf: (v) => (/never|perpetual|no end/i.test(v) ? 'constitutional' : 'ordinary'),
      routeNote: 'Which route this takes depends on what you write. A different date is a proposal (✏️), judged like any other. Never — no ending at all — re-opens the founding question instead, because a document with no ending has no rising threshold, and every decision already taken was taken under one.',

      readNote: 'The approval threshold rises towards that moment, and ✏️s come back paced against it. <b>Never</b> is one of the answers to this question, which is why it is constitutional — a document with no ending has no ramp. The date itself anybody may propose moving (✏️) — and postponing never lowers the bar: it stays where it is and rises more slowly to the same ceiling.' },
    // Pacing, not consent (§9.0, Q341): the close bar is the room's, above in
    // their own pile; how it climbs there is the founder's, like the drip.
    { k: 'pace', g: '📈', t: 'How Does the Bar Get There?', own: 'founder', kind: 'ordinary', v: 'Rising from 55%',
      readNote: 'Every adoption is recorded against the bar as it stood, so re-shaping the ramp re-rates nothing already decided — which is why this is open to proposals (✏️) while the close bar is constitutional (🏛️).' },
    // **One decision, not two** (Ed, 2026-08-18): the rate is one sentence
    { k: 'rate', g: '⏱️', t: 'Proposal Rate', own: 'founder', kind: 'ordinary', v: '4 each, one back every 180 minutes',
      readNote: 'With the one above, this is the <b>proposal rate</b> — how often anybody may put something to the room. Each proposal also stakes one ✏️, which is a flat one and not a setting: it comes back in full if you withdraw, and in proportion to how well it did if it does not carry.' },
  ];
  // **The gates are cards** (Ed, 330b). Kept out of ROOM, which defines what
  // *your own answers* means — a gate that waited on itself would never open.
  const GATES = [
    { k: 'canpropose', g: '✏️', t: 'Proposing', own: 'you', isGate: true,
      open: () => mine(),
      why: 'You cannot propose a change to a document whose rules you have not yet said what you will accept of — a proposal is judged under them, and you would be writing against a bar you had declined to set.',
      waiting: 'Waiting on your own answers.',
      done: 'Open — you can write in the charter.',
      blockers: () => ROOM.filter((c) => !settled(c)) },
    { k: 'canjudge', g: '⚖️', t: 'Judging', own: 'you', isGate: true,
      open: () => roomDone(),
      why: 'A judgment is counted towards a quorum and recorded under a disclosure rule, and neither exists until everybody has answered. So judging waits on the room rather than on you.',
      waiting: 'Waiting on everyone’s answers.',
      done: 'Open — the room is ready.',
      blockers: () => ROOM.filter((c) => c.own !== 'you' && (c.in || 0) < E) },
  ];

  const CARDS = ROOM.concat(CONVENOR, GATES);
  const card = (k) => CARDS.find((c) => c.k === k);

  // ---- motions -----------------------------------------------------------
  // **A motion is a proposal to change a setting**, and which route it takes
  // is a fact about the setting rather than about the motion (Ed, 2026-08-18).
  // An **ordinary** one is judged pairwise and carries at the bar, which is the
  // race this engine already is. A **constitutional** one is not judged at all:
  // it re-opens the question everyone was asked at the start, and the card
  // that answers it is the one that was already there — which is why there is no new object
  // on this surface for the largest thing a room can do to itself.
  //
  // Two in the fixture so both routes are inspectable, and they are the two Ed
  // named: moving the ending (ordinary — no past judgment means anything
  // different because the deadline moved), and inviting somebody (constitutional
  // — quorum is a fraction of the membership, so a new member silently re-rates
  // every judgment already cast).
  const MOTIONS = {
    ending: { to: 'Saturday 18:00', judged: 6, kind: 'ordinary',
      why: 'Three of us are away from Thursday lunchtime and the Guests part has barely been looked at. Two more days costs nothing and we would finish it.' },
    roster: { to: 'Fifteen drafting — Rowan Pike joins', judged: 11, invite: 'Rowan Pike',
      why: 'Rowan has kept the garden for six years and every clause about it was written without them in the room.' },
  };
  const motionOn = (c) => (S.state === 'settled' ? MOTIONS[c.k] : null);
  // The commit follows the route the typed value asks for (329a): a
  // proposal goes in with a click, a constitutional change with the
  // assembly-press. One builder, because the input handler must swap the
  // button in place as typing flips the route — a full re-render would
  // throw the caret out of the lane.
  // what each radio-composed setting currently stands at: picking it back
  // is not a change, so it clears the draft and the commit greys
  const CURRENT = { policy: 'Anyone may apply', pace: 'Rising from 55%' };
  const POLICY_TEXTS = [
    ['Invitation only', 'Membership is by invitation only.'],
    ['Applications must be proposed', 'Anyone may apply, but an application must be proposed by a member, who stakes the ✏️.'],
    ['Anyone may apply', 'Anyone may apply to join.'],
    ['Open', 'Anyone with the link joins on arrival.'],
    ['Reserved — the founder holds it', 'The membership is reserved: the Founder keeps invite-and-remove, and this document has a 👑.'],
  ];
  const motionCommitHtml = (c) => {
    const dto = (S.draft && S.draft.k === c.k) ? S.draft.to : '';
    const constitutional = routeFor(c, dto) === 'constitutional';
    const heldOut = S.myMotion && S.myMotion !== c.k;
    return constitutional
      ? '<button class="btn btn-approve holdmotion"' +
        (!dto || heldOut ? ' disabled' : '') +
        ' title="' + (heldOut ? 'One 🏛️ each — withdraw yours first' : 'A full ten-second hold') + '"' +
        ' data-holdmotion="' + c.k + '">🏛️ Hold to ask everyone</button>'
      : '<button class="btn btn-approve"' + (dto ? '' : ' disabled') +
        ' data-putmotion="1">Propose</button>';
  };
  const answeredMotion = (c) => S.mAns[c.k] !== undefined;

  const ANSWERED = {
    quorum: () => S.quorum !== null, bar: () => S.bar !== null,
    authorship: () => !!S.authorship, signing: () => !!S.signing, judgments: () => !!S.judgments,
    chamber: () => !!S.chamber, machines: () => S.machines !== null,
    lapse: () => S.lapse !== null,
    myname: () => !!S.myname.trim(),
  };
  const ready = (c) => (ANSWERED[c.k] ? ANSWERED[c.k]() : true);

  // **A constitutional setting you had no say in is a decision you are owed**
  // (Ed, 2026-08-18: *for members, constitutional settings they don't have input
  // to are like decided unretired things — you need to look at them and say OK
  // … and then they disappear from the sidebar*).
  //
  // Which is the live rail's own rule arriving here from the other end. There,
  // an unacknowledged decision pins itself until you press OK, because a
  // decision you were part of and did not get to see is the one thing a margin
  // must not let scroll past. Here the same is true of a rule you never chose
  // and are nonetheless bound by — the membership you joined, the founder's
  // part in it, whether the charter ends at all. Reading is not enough, because
  // reading is what you do to everything.
  //
  // And then it goes, which is the half that makes the rail honest: the sidebar
  // holds what wants something from you, so an acknowledged rule wants nothing
  // and belongs in the pile with the rest of the constitution. The **ordinary**
  // settings the founder made never enter the rail at all — nothing is being
  // asked, and anybody may motion one at the bar whenever they like.
  const needsOk = (c) => c.own === 'founder' && c.kind === 'constitutional' && !S.okd.has(c.k);
  const settled = (c) => (c.isGate ? S.okd.has(c.k)
    : c.own === 'founder' ? !needsOk(c) : (S.seen.has(c.k) && ready(c)));
  // **A motion makes its card want you again**, whoever normally holds it — a
  // founder's setting under motion is a question for the room like any other,
  // which is the whole of what a motion does to the piles. The hue says it and
  // the subject glyph does not change, because hue has always been the state
  // here and the glyph has always been the subject.
  const mustAct = (c) => (c.isGate ? (c.open() && !S.okd.has(c.k))
    : motionOn(c) ? !answeredMotion(c) : !settled(c));
  const isRoom = (c) => c.own !== 'founder' && c.own !== 'you';

  // **The sections of the constitution** (Ed, 2026-08-18: the members'
  // choices are *about the constitution*, so each stands as a task in the
  // section it decides — the rule and the question about it are one
  // paragraph wearing one tab). Same five sections as the founder's
  // surface, because it is the same document.
  const SEC = [
    // no intro line (Ed, 2026-08-18) — the sentences are the section
    { key: 'members', title: 'Membership',
      text: '',
      keys: ['roster', 'policy', 'lapse', 'myname', 'mypic'],
      // **Members and Applications are subsections** (Ed, 2026-08-18):
      // Members IS the list, 🪪 beside it, your own row at the bottom
      // wearing ✋ and 🖼️; Applications is the 🤝 decision with the
      // Applicants list under it.
      body: (h) => {
        const my = ['myname', 'mypic'].map(card).filter(Boolean);
        const others = ROSTER.filter((p) => p.n !== S.myname);
        const list = '<div class="memlist">' +
          others.map((p) => '<div class="memrow">' + avHtml(p) +
            '<span class="mn">' + esc(p.n) +
            (p.n === 'Wren Ashby' ? ' <span class="chip founder">founder</span>' : '') +
            '</span></div>').join('') +
          '<div class="memrow meRow">' + h.pile(my) + avHtml(me()) +
          '<span class="mn">' + esc(S.myname || 'Not named yet') + ' <span class="chip">you</span></span></div></div>';
        const openId = my.find((c) => S.open === c.k);
        const rest = [].map(card).filter(Boolean);
        // policy first, lapse under it, then the Members list; the
        // Applications subheading dissolved into the Applicants list
        // (Ed, 2026-08-18)
        return h.para(card('policy')) + h.para(card('lapse')) +
          '<h2 class="docline lvl3">Members</h2>' +
          (S.open === 'roster' ? h.para(card('roster'))
            : '<div class="cpara"><span class="chipcol">' + h.chip(card('roster')) + '</span>' + list + '</div>') +
          (openId ? h.paraWith(openId, my) : '') +
          applicantsHtml() +
          rest.map((c) => h.para(c)).join('');
      },
      },
    // the gates lead the Proposals section (Ed, 2026-08-18): what proposing
    // and judging wait on is the first thing this section says
    { key: 'rate', title: 'Proposals',
      text: 'How often anybody may put something to the room, and whether an AI drafts proposals alongside them.',
      keys: ['canpropose', 'canjudge', 'rate', 'machines'] },
    { key: 'deciding', title: 'Decisions',
      text: 'How a change carries: how many must weigh in, how sure the room must be, and when the document ends.',
      keys: ['ending', 'quorum', 'bar', 'pace'] },
    { key: 'privacy', title: 'Privacy',
      text: 'Who is seen doing what — proposing, signing, judging — and who may read the document at all.',
      keys: ['authorship', 'signing', 'judgments', 'chamber'] },
    { key: 'doc', title: 'The Document', railOnly: true,
      text: '', keys: ['text', 'title', 'slug'] },
  ];
  const secAll = () => SEC.map((s2) => ({ ...s2, cards: s2.keys.map(card).filter(Boolean) }));
  // **Applicants** (Ed, 2026-08-18): the list of people asking to be in
  // the room, a subsection under Applications — each one a proposal (✏️)
  // the members are judging
  const applicantsHtml = () => {
    const show = S.state === 'settled' || (S.state === 'applicant' && S.app.submitted);
    if (!show) return '';
    const who = S.state === 'applicant' ? { n: S.app.name, pic: S.app.pic } : APPLICANT;
    return '<h2 class="docline lvl3">Applicants</h2><div class="memlist">' +
      '<div class="memrow">' + avHtml(who) + '<span class="mn">' + esc(who.n) +
      ' <span class="appnote">· a proposal (✏️) · ' + APPLICANT.judged + ' of ' + E + ' judged</span></span></div></div>';
  };

  const groups = () => [
    { key: 'constitution', label: 'Constitution',
      sections: secAll(),
      // Founded by [avatar] [name], at [time] once constituted (Ed)
      lead: (h) => h.para(card('slug')) +
        '<div class="cpara notab"><p class="cpv founded">Founded by ' +
        avHtml({ n: 'Wren Ashby', pic: 'c0' }) + ' Wren Ashby' +
        (S.state === 'settled' ? ' at Tuesday 14:02' : '') + '.</p></div>',
      textAnchor: (h) => (S.open === 'text' ? h.para(card('text'))
        : '<div class="cpara textanchor"><span class="chipcol">' + h.chip(card('text')) + '</span></div>'),
      note: (n) => (n ? n + ' still want you' : 'all answered — settled before you arrived') },
  ];

  // **Your own answers gate your own proposing** (Ed, 2026-08-17). You should
  // not be able to act on a document whose rules you have not yet said what you
  // will accept of. Judging waits on the *room*, because a judgment is counted
  // against a quorum that does not exist until everybody has spoken.
  const mine = () => ROOM.every(settled);
  const roomDone = () => ROOM.every((c) => c.own === 'you' || (c.in || 0) >= E);

  const gateOpen = (c) => !!(c.isGate && c.open());

  const VALUE = {
    canpropose: () => (mine() ? 'Open' : 'Waiting on your answers'),
    canjudge: () => (roomDone() ? 'Open' : 'Waiting on the room'),
    myname: () => S.myname || 'Unnamed',
    mypic: () => (S.mypic ? 'Chosen' : 'Your initials'),
    quorum: () => (S.quorum === null ? 'The lowest you will accept' : 'You said ' + S.quorum + ' of ' + E),
    bar: () => (S.bar === null ? 'The lowest you will accept' : 'You said ' + S.bar + '%'),
    authorship: () => (!S.authorship ? 'The most you will accept' : 'You said ' +
      { anonymous: 'no names, ever', sealed: 'names at the close', public: 'names from the start' }[S.authorship]),
    signing: () => (!S.signing ? 'The most you will accept' : 'You said ' +
      { nobody: 'nobody signs', each: 'each author chooses', everybody: 'everybody signs' }[S.signing]),
    judgments: () => (!S.judgments ? 'The most you will accept' : 'You said ' +
      { never: 'never revealed', after: 'revealed after the decision' }[S.judgments]),
    chamber: () => (!S.chamber ? 'The most you will accept' : 'You said ' +
      { closed: 'members only', link: 'anyone with the link', public: 'public' }[S.chamber]),
    lapse: () => (S.lapse === null ? 'The shortest you will accept'
      : S.lapse === 'never' ? 'You said never' : 'You said after ' + S.lapse + ' days of inactivity'),
    machines: () => (S.machines === null ? 'The most you will accept'
      : 'You said ' + (S.machines ? 'AI proposals are fine' : 'no AI proposals')),
  };
  const value = (c) => esc(VALUE[c.k] ? VALUE[c.k]() : c.v);
  const summary = (c) => (isRoom(c) && settled(c)
    ? value(c) + ' · ' + someIn(c.in || 0, E) : value(c));

  // ---- the grammar's other states (Ed, 2026-08-18) ------------------------
  // wait: you answered and the room has not, a motion you have judged still
  // runs, a gate's blockers stand above it. news: a rule you never chose
  // binds you, a blind question you answered came back with its number, a
  // gate opened — each pinned until your OK.
  const waiting = (c) => (c.isGate ? !c.open()
    : motionOn(c) ? answeredMotion(c)
    : isRoom(c) && settled(c) && (c.in || 0) < E);
  const news = (c) => (c.isGate ? (c.open() && !S.okd.has(c.k))
    : motionOn(c) ? false
    : c.own === 'founder' ? (c.kind === 'constitutional' && !S.okd.has(c.k))
    : isRoom(c) && settled(c) && (c.in || 0) >= E && !S.okd.has('res-' + c.k));

  // **The constitution states itself in sentences** (Ed, 2026-08-18), in a
  // member's frame. The fixture is static, so the decided sentences are
  // written out rather than templated.
  const WHAT = {
    quorum: 'how many members must weigh in before a question can carry',
    bar: 'how sure the room must be at the close',
    authorship: 'when a proposer is named',
    signing: 'who may sign a proposal',
    judgments: 'whether judgments are revealed with the record',
    chamber: 'who may read the document',
    lapse: 'whether an inactive membership lapses',
    machines: 'whether an AI makes proposals',
  };
  const DECIDED = {
    title: 'The document is titled “The Hollow Oak Club — House Charter”.',
    text: 'The document started from 42 blocks of text in 9 sections.',
    slug: 'The document lives at docs.vote/hollow-oak-4f2a.',
    ending: 'The drafting process will end on Thursday at 18:00.',
    pace: 'The approval threshold rises from 55% to the close.',
    rate: 'Members start with 4 ✏️ each, up to a maximum of 8. They get an additional ✏️ every 180 minutes. Successful ✏️s are refunded.',
    policy: 'Anyone may apply to join.',
    quorum: '10 of the 14 members must weigh in before a question can change the document.',
    bar: 'At the close, the room must be 80% sure for a change to carry.',
    authorship: 'Proposers are never named — not during the session and not in the record.',
    signing: 'Nobody may sign a proposal.',
    judgments: 'Judgments are never revealed.',
    chamber: 'Only members can see the document.',
    lapse: 'Memberships do not lapse, however long inactive.',
    machines: 'There are no AI proposals.',
  };
  const decisionLine = (c) => {
    // which answers, and how far the room has got (Ed, 2026-08-18): the
    // fixture's members-done count is the floor of the per-question counts
    const allDone = () => Math.min(...ROOM.filter((x) => x.own !== 'you').map((x) => Math.min(x.in || 0, E)));
    if (c.k === 'canpropose') return mine() ? 'Proposing is open.'
      : 'Members may begin proposing when they have answered the questions the Founder delegated — ' +
        allDone() + ' of ' + E + ' have answered everything.';
    if (c.k === 'canjudge') return roomDone() ? 'Judging on proposals began on Tuesday at 14:02.'
      : 'Members may begin judging proposals when every member has answered everything — ' +
        allDone() + ' of ' + E + ' have.';
    if (c.own === 'you') return value(c);
    if (isRoom(c)) {
      return (c.in || 0) >= E
        ? (DECIDED[c.k] || esc(c.result || ''))
        : 'The Founder has delegated to members to decide ' + (WHAT[c.k] || 'this') + ' — ' +
          Math.min(c.in || 0, E) + ' of ' + E + ' have answered.';
    }
    return DECIDED[c.k] || value(c);
  };

  const ctx = {
    get open() { return S.open; }, get E() { return E; },
    clauseFor: (c) => (c.k === 'roster' ? faces(ROSTER, S.myname) : ''),
    mustAct, summary, value, isRoom, waiting, news, decisionLine,
    // the composer cards open with the rule itself where the clause goes —
    // no title, the sentence exactly where it stood on the page
    headFor: (c) => {
      if (!(c && c.own === 'founder' && !c.isGate && c.k !== 'text' &&
        !needsOk(c) && !motionOn(c))) return null;
      // the head is **reference only**, as on the decision cards (Ed,
      // 2026-08-18): the blocks below are the alternatives, and keeping
      // what stands is preferring none of them — a pressed Preferred
      // toggles off, which is what greys the 🏛️ again
      return DECIDED[c.k] || value(c);
    },
    // reserved = held by the founder: the room may pass a change, and it
    // then goes to the founder as a 👑 question (accept or reject)
    reserved: (c) => c.own === 'founder',
  };

  // ---- the rail ----------------------------------------------------------
  // Your own pile first — which on this surface is the members' — then the
  // founder's. The same two groups as the band, in the order that puts what
  // wants you at the top.
  function renderRail() {
    // The rail holds what wants something from you and nothing else: your own
    // questions, the constitutional rules you have not yet acknowledged, and
    // anything under motion. Everything the founder settled that asks nothing
    // lives in the pile at the head of the document, which is where you go to
    // look a rule up rather than to be told about it.
    if (S.state === 'applicant') {
      rail.innerHTML = '<ul><li class="qhead">Membership</li>' +
        APPCARDS().map((c) => railEntry(c, appCtx)).join('') + '</ul>';
      document.getElementById('mebtn').innerHTML = avHtml({ n: S.app.name || '?', pic: S.app.pic }, 'face');
      return;
    }
    const secs = secAll().map((s2) => ({ ...s2, cards: s2.cards.filter((c) =>
        c.isGate ? stateOf(c, ctx) === 'news' : stateOf(c, ctx) !== 'done') }))
      .filter((s2) => s2.cards.length);
    rail.innerHTML = '<ul>' + secs.map((s2) =>
      '<li class="qhead">' + esc(s2.title) + '</li>' +
      s2.cards.map((c) => railEntry(c, ctx)).join('')).join('') + '</ul>';
    document.getElementById('mebtn').innerHTML = avHtml(me(), 'face');
  }

  // ---- the bodies a member fills in --------------------------------------
  const whoBox = (k) => (S.seen.has(k) ? '' :
    '<div class="whobox"><div class="lab">Fourteen people will hold this charter between them. ' +
    'What you are about to say is how much of <b>this room</b> you need behind a change before it moves.</div>' +
    faces(ROSTER, S.myname) + '</div>');

  // The consent controls and the answer bodies live in setup.js since Q344
  // closed: the founder answers the questions they delegated on their own
  // surface, so the member's controls are shared vocabulary now.

  // A constitutional motion on the roster has no ceremony card of its own,
  // because nobody was asked at the start whether a person who was not there
  // should join. So it takes the consent rule's plainest form: a yes and a no,
  // resolved the way every other privacy-shaped question is — the most
  // restrictive answer wins, so a single member keeps somebody out.
  const inviteBody = (m) =>
    '<p class="why">Whether <b>' + esc(m.invite) + '</b> joins the membership. Adding a member changes what quorum is a fraction of, so it is constitutional: the most restrictive answer wins, and one member who says no keeps them out.</p>' +
    '<div class="choice" role="radiogroup">' +
    '<div class="pick' + (S.mAns.roster === 'no' ? ' on' : '') + '"><button class="lanepick"' +
    ' aria-pressed="' + (S.mAns.roster === 'no') + '" data-motion="no"><span class="dot"></span>' +
    '<span>I would rather they did not</span></button>' +
    '<span class="exp">They stay out. Nobody is told which of the fourteen said so.</span></div>' +
    '<div class="pick' + (S.mAns.roster === 'yes' ? ' on' : '') + '"><button class="lanepick"' +
    ' aria-pressed="' + (S.mAns.roster === 'yes') + '" data-motion="yes"><span class="dot"></span>' +
    '<span>I accept them joining</span></button>' +
    '<span class="exp">They start with the ✏️s everyone got, plus what the drip has added since, and quorum recomputes.</span></div></div>' + BLIND;

  const BLIND = '<p class="blindnote">Nobody sees your answer, and you will see nobody else’s until every one of them is in.</p>';

  // A constitutional motion on a setting that was never a ceremony question
  // (the policy; the membership when no invitee is named) still re-opens as
  // consent: what is proposed, what stands, two answers, one refusal keeps
  // what stands. inviteBody is this body with a person where the value is.
  const consentBody = (c, m) => (m.invite ? inviteBody(m) :
    '<p class="why">Whether <b>' + esc(m.to) + '</b> replaces <i>' + value(c) + '</i>. Nothing is being judged: you state what you will accept, and one refusal keeps what stands.</p>' +
    '<div class="choice" role="radiogroup">' +
    '<div class="pick' + (S.mAns[c.k] === 'no' ? ' on' : '') + '"><button class="lanepick"' +
    ' aria-pressed="' + (S.mAns[c.k] === 'no') + '" data-motion="no"><span class="dot"></span>' +
    '<span>Keep what stands</span></button>' +
    '<span class="exp">Nobody is told which of the fourteen said so.</span></div>' +
    '<div class="pick' + (S.mAns[c.k] === 'yes' ? ' on' : '') + '"><button class="lanepick"' +
    ' aria-pressed="' + (S.mAns[c.k] === 'yes') + '" data-motion="yes"><span class="dot"></span>' +
    '<span>I accept the change</span></button>' +
    '<span class="exp">It takes every one of the ' + E + ' accepting.</span></div></div>' + BLIND);

  /* **What a motion is composed with** (Ed, 2026-08-18). The control that set
     a value is the control that proposes a new one — a date picker for a date,
     the membership for the membership. `data-mval` writes straight into the
     draft, so what the button says is what the motion will say. */
  const mrow = (on, val, ttl, exp, inner) =>
    '<div class="pick' + (on ? ' on' : '') + '">' +
    '<button class="lanepick" aria-pressed="' + !!on + '" data-mval="' + esc(val) + '">' +
    '<span class="dot"></span><span>' + ttl + '</span></button>' +
    (exp ? '<span class="exp">' + exp + '</span>' : '') +
    (inner ? '<span class="inner">' + inner + '</span>' : '') + '</div>';

  // **Every composer speaks the decision-card grammar** (Ed, 2026-08-18,
  // generalising the Applications example): the head is the current rule,
  // reference only; each alternative below is the rule it would make,
  // stated as it would stand — with a Prefer this lane where there is a
  // set to choose among, and the value riding inside the sentence as an
  // input where the alternative is a continuum (there the input is the
  // preference, and the commit wakes when it diverges from what stands).
  const laneBlock = (d, val, text) =>
    '<div class="propblock"><div class="rtext">' + text + '</div>' +
    '<div class="lanebar"><button class="lanepick" aria-pressed="' + (d.to === val) + '"' +
    ' data-mval="' + esc(val) + '"><span class="dot"></span>' +
    '<span class="off">Prefer this</span><span class="on">Preferred</span></button></div></div>';
  const inputBlock = (html, note) =>
    '<div class="propblock"><div class="rtext">' + html + '</div>' + (note || '') + '</div>';
  const PROPOSE = {
    title: (d) => inputBlock('The document is titled ' +
      '<input data-mtext="1" value="' + esc(d.to || 'The Hollow Oak Club — House Charter') + '" style="width:22rem">.'),
    slug: (d) => inputBlock('The document lives at docs.vote/' +
      '<input data-mslug="1" value="' + esc(d.to.replace(/^docs\.vote\//, '') || 'hollow-oak-4f2a') + '" style="width:12rem">.',
      '<p class="setnote">Every link the document has ever had keeps working — a change leaves a redirect behind.</p>'),
    pace: (d) => laneBlock(d, 'Fixed — the close bar throughout',
        'The approval threshold holds at its close value throughout.') +
      inputBlock('The approval threshold rises from ' +
        '<input class="num" type="number" min="50" max="99" data-mpace="1" value="' +
        esc((/^Rising/.test(d.to) && (d.to.match(/\d+/) || [])[0]) || '65') + '">% to the close.'),
    rate: (d) => {
      const n = d.to.match(/\d+/g) || [];
      return inputBlock('Members start with ' +
        '<input class="num" type="number" min="0" max="40" data-mrate="x" value="' + esc(n[0] || '4') + '"> ✏️ each, up to a maximum of ' +
        '<input class="num" type="number" min="1" max="99" data-mrate="y" value="' + esc(n[1] || '8') + '">. They get an additional ✏️ every ' +
        '<input class="num" type="number" min="5" max="2880" data-mrate="z" value="' + esc(n[2] || '180') + '"> minutes.');
    },
    ending: (d) => {
      const never = /never/i.test(d.to);
      return inputBlock('The drafting process will end on ' +
          '<input type="datetime-local" data-mdate="1"' + (never || !d.to ? '' : ' value="' + esc(d.to) + '"') + '>.') +
        laneBlock(d, 'Never — it runs until it is frozen',
          'The drafting process has no set end — it runs until it is frozen.') +
        (never ? '<p class="setnote">Removing the ending is constitutional — a document with no ending has no rising threshold.</p>' : '');
    },
    // **A motion is composed with the setting's own control** (the
    // motion-controls rule) — the policy is the join rungs and the holder,
    // so proposing a change offers exactly those radios again. What stands
    // is marked and inert, because proposing the current rule is not a
    // change; one motion proposes one rule, and what you do not touch
    // stands. (QA 2026-08-18: this card was falling through to the
    // free-text lane.)
    // **A set of different texts, and the radios say Prefer this** (Ed,
    // 2026-08-18): each option is the rule it would make, stated as it
    // would stand, in a proposal-block with the lane-bar's own radio —
    // the decision-card grammar with rules for wordings. The current rule
    // is the head, wearing Preferred, so it never prints itself again.
    policy: (d) => POLICY_TEXTS.filter(([val]) => val !== CURRENT.policy)
      .map(([val, text]) =>
        '<div class="propblock"><div class="rtext">' + text + '</div>' +
        '<div class="lanebar"><button class="lanepick" aria-pressed="' + (d.to === val) + '"' +
        ' data-mval="' + esc(val) + '"><span class="dot"></span>' +
        '<span class="off">Prefer this</span><span class="on">Preferred</span></button></div></div>').join('') +
      '<p class="setnote">One motion proposes one rule; what you do not touch stands.</p>',
    // the membership, in front of you, with an ✕ beside each and a field at
    // the bottom — which is what “propose a change to the membership” means
    roster: (d) =>
      '<div class="roster">' + ROSTER.map((p) =>
        '<div class="rperson' + (d.to === 'Thirteen drafting — ' + p.n + ' leaves' ? ' picked' : '') + '">' +
        avHtml(p) + '<span><span class="nm">' + esc(p.n) +
        (p.n === S.myname ? ' <span class="chip">you</span>' : '') + '</span></span>' +
        (p.n === S.myname ? '<span class="xdrop"> </span>'
          : '<button class="xdrop" data-mval="Thirteen drafting — ' + esc(p.n) + ' leaves"' +
            ' title="Propose that they leave">✕</button>') +
        '</div>').join('') +
      '<div class="addrow"><input placeholder="Somebody to invite" data-mjoin="1">' +
      '<button class="btn" data-mjoinbtn="1">Invite</button></div></div>' +
      '<p class="setnote">Either way it is one motion and it is constitutional, because who is in the room is what quorum is a fraction of. One member who says no settles it.</p>',

  };

  const BODY = {
    myname: () => nameBody(me()),
    mypic: () => pictureBody(me()),
    quorum: () => whoBox('quorum') + ANSWER.quorum(S, E, 'count'),
    bar: () => whoBox('bar') + ANSWER.bar(S),
    authorship: () => ANSWER.authorship(S),
    signing: () => ANSWER.signing(S),
    judgments: () => ANSWER.judgments(S),
    chamber: () => ANSWER.chamber(S),
    machines: () => ANSWER.machines(S),
    lapse: () => ANSWER.lapse(S),
  };

  // A gate card says one thing: what it is waiting for, and whether that has
  // happened. What it is waiting *on* is drawn as the cards themselves, so a
  // member reads it as “these, and then you can write” rather than as a rule.
  const gateBody = (c) =>
    '<p class="why">' + c.why + '</p>' +
    '<div class="lockline">' + (c.open() ? TICK : '') + '<span>' +
    (c.open() ? c.done : c.waiting) + '</span></div>' +
    (c.open() ? '' : '<div class="gatelist">' + c.blockers().map((b) =>
      '<span class="gaterow"><span class="gg">' + b.g + '</span>' + esc(b.t) + '</span>').join('') + '</div>') +
    '<p class="setnote">' + (c.open()
      ? 'Nothing is being asked here — <b>OK</b> files it and it leaves your queue.'
      : 'It comes back to you the moment it opens.') + '</p>';

  /* ---- the applicant's tasks ---------------------------------------------
     Plain tasks (Ed's word): the same rail entries and the same card shell,
     asking for the only three things an application is. */
  const APPCARDS = () => {
    const a = S.app;
    const base = [{ k: 'apply', g: '🪪', t: 'Apply for Membership', own: 'you',
      kind: 'personal', done: () => a.submitted }];
    if (!a.started) return base;
    return base.concat([
      // **the email is the identity** (Ed, 2026-08-18): verified by magic
      // link before anything can be submitted, and unique among members
      { k: 'appmail', g: '📧', t: 'Your Email', own: 'you', kind: 'personal', done: () => a.emailVerified },
      { k: 'appname', g: '✋', t: 'Your Name', own: 'you', kind: 'personal', done: () => !!a.name.trim() },
      { k: 'apppic', g: '🖼️', t: 'Your Picture', own: 'you', kind: 'personal', done: () => !!a.pic },
      { k: 'apptext', g: '📝', t: 'Your Application', own: 'you', kind: 'personal', optional: true, done: () => !!a.text.trim() },
    ]);
  };
  const appCtx = {
    get open() { return S.open; }, get E() { return E; },
    mustAct: (c) => !c.done() && !(c.optional && S.app.submitted),
    // the submitted application is a proposal of your own in flight — ✏️
    // blue, its fill how far the judging has got (session-view's `yours`,
    // kept because it carries the one act nobody else can perform)
    yours: (c) => c.k === 'apply' && S.app.submitted,
    waiting: (c) => c.k === 'appmail' && S.app.emailSent && !S.app.emailVerified,
    fillOf: (c) => (c.k === 'apply' && S.app.submitted
      ? Math.round(APPLICANT.judged / E * 100) + '%' : '100%'),
    summary: (c) => (c.k === 'apply'
      ? (S.app.submitted ? 'Before the members — a proposal like any other' : S.app.started ? (['appname','apppic'].every((k2) => APPCARDS().find((x) => x.k === k2).done()) ? 'Ready to submit' : 'Three small tasks') : 'Membership is by application')
      : c.k === 'appmail' ? (S.app.emailVerified ? S.app.email + ' · verified'
        : S.app.emailSent ? 'Check your inbox' : 'Your identity here')
      : c.k === 'appname' ? (S.app.name || 'What members will call you')
      : c.k === 'apppic' ? (S.app.pic ? 'Chosen' : 'A ground for your initials')
      : (S.app.text ? 'Written' : 'A few words — optional')),
    value: (c) => appCtx.summary(c), isRoom: () => false,
  };
  const APPBODY = {
    apply: () => {
      const a = S.app;
      const ready2 = a.started && a.emailVerified && a.name.trim() && a.pic;
      return '<p class="why">Your application goes before the members as a proposal (✏️) — it carries if the room is sure enough.</p>' +
        (a.submitted
          ? '<div class="lockline">' + TICK + '<span>Submitted. ' + APPLICANT.judged + ' of ' + E + ' have judged it — you will get an email either way.</span></div>'
          : a.started
          ? '<p class="setnote">' + (ready2 ? 'Everything needed is in — the words are optional.' : 'The email, the name and the picture are needed; the words are optional.') + '</p>'
          : '<p class="setnote">Nothing is collected before you begin, and nothing is sent until you submit.</p>');
    },
    appmail: () => {
      const a = S.app;
      const taken = MEMBER_EMAILS.has(a.email.trim().toLowerCase());
      const okAddr = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a.email) && !taken;
      return a.emailVerified
        ? '<div class="lockline">' + TICK + '<span>Verified — <b>' + esc(a.email) + '</b> is your identity here.</span></div>'
        : a.emailSent
        ? '<p class="why">Sent to <b>' + esc(a.email) + '</b>. Nothing is submitted until the address has proved it works — it is your identity here, and the only way the answer can reach you.</p>' +
          '<div style="margin-top:var(--s3)"><button class="btn" data-appmailopen="1">Open your inbox</button> ' +
          '<button class="btn" data-appmailedit="1">Wrong address?</button></div>'
        : '<p class="why">Your email is your <b>identity</b> here — the magic link is the login, the answer to your application arrives on it, and no two members may share one. It has to prove it works before you can submit.</p>' +
          '<span class="fld"><label>Your email</label><input type="email" data-appmail="1" value="' + esc(a.email) + '" placeholder="you@example.com" style="width:20rem"></span>' +
          (taken ? '<p class="setnote"><b>Already a member’s address.</b> A member email is one identity — if it is yours, log in with it instead of applying.</p>' : '') +
          '<div style="margin-top:var(--s3)"><button class="btn"' + (okAddr ? '' : ' disabled') + ' data-appmailsend="1">Send the link</button></div>';
    },
    appname: () => '<p class="why">What the members will call you — in the application, and in the membership if it carries.</p>' +
      '<span class="fld"><label>Your name</label><input data-appname="1" value="' + esc(S.app.name) + '" placeholder="Your name" style="width:20rem"></span>',
    apppic: () => '<p class="why">The shape they will recognise you by.</p>' +
      '<div class="avpick">' + avatarOptions().map((o) =>
        '<button class="avopt" data-apppic="' + o.id + '" aria-pressed="' + (S.app.pic === o.id) + '">' +
        avHtml({ n: S.app.name || '?', pic: o.id }, 'big') + '</button>').join('') + '</div>',
    apptext: () => '<p class="why">A few words to the members, if you want them — who you are, why this document. Optional: an empty application is a real application.</p>' +
      '<div class="lanebox"><div class="lp editlane' + (S.app.text ? '' : ' blank') + '" contenteditable="plaintext-only"' +
      ' spellcheck="false" data-apptext="1" data-ph="To the members…">' + esc(S.app.text) + '</div></div>',
  };
  function applicantCardHtml() {
    const c = APPCARDS().find((x) => x.k === S.open);
    if (!c) return '';
    const a = S.app;
    let foot;
    if (c.k === 'apply') {
      foot = a.submitted ? '<button class="btn" data-close="1">Close</button>'
        : !a.started ? '<button class="btn btn-approve" data-appstart="1">Begin</button>'
        : '<button class="btn" data-close="1">Close</button>' +
          '<button class="btn btn-approve glyphbtn"' + (a.name.trim() && a.pic ? '' : ' disabled') +
          ' data-appsubmit="1" title="Submit — your application goes before the members">🏛️</button>';
    } else {
      foot = '<button class="btn" data-close="1">Close</button>' +
        '<button class="btn btn-approve glyphbtn"' + (c.done() || c.optional ? '' : ' disabled') + ' data-close="1">' + TICK + '</button>';
    }
    return cardHtml(c, appCtx, APPBODY[c.k](), foot, [c]);
  }

  // ---- the band ----------------------------------------------------------
  function renderBand() {
    if (S.state === 'applicant') {
      // the applicant's open card sits above the piles, which render read-only
      band.innerHTML = applicantCardHtml() +
        bandHtml(groups().map((g) => ({ ...g, cards: g.cards })), ctx, () => '');
      fitBand(band);
      return;
    }
    band.innerHTML = bandHtml(groups(), ctx, (g) => {
      const c = card(S.open);
      let body, foot;
      const m = motionOn(c);
      // a live motion takes the route its own value asks for (329a), which on
      // the window is the difference between moving a date and abolishing one
      if (m && (m.kind || routeFor(c, m.to)) === 'ordinary') {
        body = motionBody(c, ctx, { ...m, pick: S.mAns[c.k] });
        foot = '<button class="lanepick" aria-pressed="' + (S.mAns[c.k] === 'either') + '"' +
          ' data-motion="either"><span class="dot"></span><span>Indifferent</span></button>' +
          '<button class="btn btn-approve glyphbtn"' + (answeredMotion(c) ? '' : ' disabled') +
          ' data-confirm="1">' + TICK + '</button>';
      } else if (m) {
        // constitutional: the founding question, live again. Yours carries
        // the withdraw at the very left, where 🗑️ always is — it hands the
        // 🏛️ back whole, which is what makes the one-each limit livable.
        body = motionReopen(c, ctx, m) + (BODY[c.k] ? BODY[c.k]() : consentBody(c, m));
        foot = (m.mine
            ? '<button class="btn" data-withdrawmotion="' + c.k + '" title="Withdrawing hands your 🏛️ back">🗑️ Withdraw</button>'
            : '<button class="btn" data-close="1">Close</button>') +
          '<button class="btn btn-approve glyphbtn"' + (answeredMotion(c) ? '' : ' disabled') +
          ' data-confirm="1">' + TICK + '</button>';
      } else if (c.isGate) {
        body = gateBody(c);
        foot = '<button class="btn" data-close="1">Close</button>' +
          '<button class="btn btn-approve"' + (c.open() ? '' : ' disabled') +
          ' data-ok="' + c.k + '">OK</button>';
      } else if (c.own === 'founder' && (needsOk(c) || c.k === 'text')) {
        // unacknowledged: the acknowledgment card; 📄: no motion door at all
        body = readBody(c, ctx) +
          (c.k === 'text' ? '<p class="setnote">The text is not changed by motion — you change it by proposing in the document itself; every clause carries a caret.</p>' : '') +
          (needsOk(c) ? '<p class="setnote">You had no say in this and it binds you, ' +
            'so it waits for your <b>OK</b> — which files it with the rest of the constitution.</p>' : '');
        foot = (needsOk(c)
            ? '<button class="btn btn-approve" data-ok="' + c.k + '">OK</button>'
            : '<button class="btn" data-close="1">Close</button>');
      } else if (c.own === 'founder') {
        // **The settled card is the composer** (Ed, 2026-08-18, using
        // Applications as the example): the current rule at the top as the
        // clause, the other options below as the setting's own radios, a
        // rationale lane, and 🗑️ with the route's commit at the bottom.
        // No separate "propose a change" step — picking an option IS
        // starting the motion.
        const d = (S.draft && S.draft.k === c.k) ? S.draft : { k: c.k, to: '', why: '' };
        const route = routeFor(c, d.to);
        body = (PROPOSE[c.k] ? PROPOSE[c.k](d)
            : '<div class="lanebox"><div class="lp editlane" contenteditable="plaintext-only" spellcheck="false"' +
              ' data-motionlane="to" data-ph="The value you are proposing">' + esc(d.to) + '</div></div>') +
          '<div class="speaker composeWhy">' + avHtml(me()) +
          '<div class="lanebox"><div class="lp edit-why' + (d.why ? '' : ' blank') + '" contenteditable="plaintext-only"' +
          ' spellcheck="false" data-motionlane="why" data-ph="We should change this because…">' + esc(d.why) + '</div></div></div>' +
          (route === 'constitutional'
            ? '<p class="setnote"><b>Free — and one at a time.</b> Each member may have one 🏛️ out at once; withdraw it and it comes back whole. Putting it is a full ten-second hold.</p>'
            : '<p class="setnote"><b>Costs one ✏️</b>, returned in full if withdrawn.' +
              (ctx.reserved(c) ? ' Carrying sends it to the founder as a <b>👑 question</b> — theirs to accept or reject.' : '') + '</p>');
        foot = '<button class="btn" data-dropmotion="1"' +
          (S.draft && S.draft.k === c.k ? '' : ' disabled') + ' title="Discard this motion">🗑️</button>' +
          motionCommitHtml(c);
      } else {
        // Once you have answered, the card keeps your answer and grows the
        // watching half underneath — the same half the founder sees, because it
        // is the same question and neither of you may see more of it than how
        // many have answered until every one of them has.
        body = BODY[c.k]() + (isRoom(c) && settled(c) ? '<div class="body">' + watchBody(c, ctx) + '</div>' : '');
        foot = stateOf(c, ctx) === 'news'
          ? '<button class="btn" data-close="1">Close</button>' +
            '<button class="btn btn-approve" data-ok="res-' + c.k + '">OK</button>'
          : '<button class="btn" data-close="1">Close</button>' +
          '<button class="btn btn-approve glyphbtn"' + (ready(c) ? '' : ' disabled') +
          ' data-confirm="1" title="' + (ready(c) ? 'Confirm' : 'Not answered yet') + '">' + TICK + '</button>';
      }
      return cardHtml(c, ctx, body, foot, g.cards);
    });
    fitBand(band);
  }

  function renderStates() {
    document.getElementById('states').innerHTML =
      [['ask', 'Answering'], ['waiting', 'Waiting'], ['settled', 'Settled'], ['applicant', 'An applicant']].map(([k, t]) =>
        '<button data-state="' + k + '" aria-pressed="' + (S.state === k) + '">' + t + '</button>').join('');
    document.getElementById('stat').textContent = S.state === 'applicant'
      ? 'reading only · not a member — applications open'
      : roomDone()
      ? 'open — reading, proposing and judging'
      : mine() ? 'you can propose · judging waits on the room'
      : 'reading only · proposing waits on your answers';
  }

  const render = () => { renderStates(); renderRail(); renderBand(); drawWire(wires, S.open);
    renderMailModal(S.state === 'applicant' && S.app.mailOpen,
      MAILS.applyVerify('The Hollow Oak Club — House Charter', S.app.email)); };

  // the three states are a fixture switch, so all of them are inspectable
  const COUNTS = { quorum: 11, bar: 9, authorship: 7, signing: 7, judgments: 12,
    chamber: 6, machines: 12, lapse: 8 };
  function setState(k) {
    S.state = k; S.open = null;
    S.app = { started: false, email: '', emailSent: false, emailVerified: false,
      mailOpen: false, name: '', pic: '', text: '', submitted: false };
    if (k === 'applicant') {
      // everything settled, and readable from outside: the fixture's chamber
      // opens to the link, or there would be no document for an applicant to
      // be reading
      S.quorum = 10; S.bar = 80; S.authorship = 'anonymous'; S.signing = 'nobody';
      S.judgments = 'never'; S.chamber = 'link'; S.machines = false; S.lapse = 'never';
      S.seen = new Set(ROOM.map((c) => c.k));
      S.okd = new Set([...CONVENOR.map((c) => c.k), ...ROOM.map((c) => 'res-' + c.k), 'canpropose', 'canjudge']);
      S.mAns = {}; S.draft = null; S.myMotion = null; S.open = 'apply';
      ROOM.forEach((c) => { if (COUNTS[c.k] != null) c.in = E; });
      return;
    }
    if (k === 'ask') {
      S.quorum = S.bar = S.machines = null; S.lapse = null;
      S.authorship = S.signing = S.judgments = S.chamber = null;
      S.mypic = ''; S.seen = new Set(); S.okd = new Set(); S.mAns = {}; S.draft = null; S.myMotion = null;
    } else {
      S.quorum = 10; S.bar = 80; S.authorship = 'anonymous'; S.signing = 'nobody';
      S.judgments = 'never'; S.chamber = 'closed'; S.machines = false; S.lapse = 'never';
      S.mypic = 'c2'; S.seen = new Set(ROOM.map((c) => c.k));
      S.okd = k === 'settled'
        ? new Set([...CONVENOR.map((c) => c.k), ...ROOM.map((c) => 'res-' + c.k), 'canpropose', 'canjudge'])
        : new Set();
      S.mAns = {}; S.draft = null; S.myMotion = null;
    }
    ROOM.forEach((c) => { if (COUNTS[c.k] != null) c.in = k === 'settled' ? E : COUNTS[c.k]; });
  }

  // **The picture card is an uploader** (Ed, 2026-08-18). Delegated, because
  // the card is rebuilt on every render; the file is read locally and never
  // sent anywhere.
  const takePic = (file) => {
    if (!file || !/^image\//.test(file.type)) return;
    const fr = new FileReader();
    fr.onload = () => { S.mypic = 'u' + fr.result; render(); };
    fr.readAsDataURL(file);
  };
  document.addEventListener('change', (ev) => {
    if (ev.target.matches('[data-picfile]')) return takePic(ev.target.files[0]);
    // a motion's own control writes the value it proposes. On `change` rather
    // than on every keystroke, because a date picker rebuilt under the pointer
    // is a date picker you cannot use.
    if (ev.target.matches('[data-mtext],[data-mslug],[data-mpace],[data-mdate],[data-mnum],[data-mrate]') &&
      (!S.draft || S.draft.k !== S.open)) S.draft = { k: S.open, to: '', why: '' };
    if (!S.draft) return;
    if (ev.target.matches('[data-mtext]')) { S.draft.to = ev.target.value.trim(); return render(); }
    if (ev.target.matches('[data-mslug]')) {
      const v = ev.target.value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '');
      S.draft.to = v ? 'docs.vote/' + v : '';
      return render(); }
    if (ev.target.matches('[data-mpace]')) { S.draft.to = 'Rising from ' + ev.target.value + '%'; return render(); }
    if (ev.target.matches('[data-mrate]')) {
      const g2 = (k2) => document.querySelector('[data-mrate="' + k2 + '"]');
      S.draft.to = (g2('x')?.value || '4') + ' each, up to ' + (g2('y')?.value || '8') +
        ', one every ' + (g2('z')?.value || '180') + ' minutes';
      return render(); }
    if (ev.target.matches('[data-mdate]')) {
      S.draft.to = ev.target.value
        ? new Date(ev.target.value).toLocaleString(undefined,
          { weekday: 'long', hour: '2-digit', minute: '2-digit' }) : '';
      return render();
    }
    if (ev.target.matches('[data-mnum]')) {
      S.draft.to = ev.target.value + ' ' + ev.target.dataset.mnum;
      return render();
    }
  });
  document.addEventListener('dragover', (ev) => {
    const z = ev.target.closest && ev.target.closest('.picdrop');
    if (z) { ev.preventDefault(); z.classList.add('over'); }
  });
  document.addEventListener('dragleave', (ev) => {
    const z = ev.target.closest && ev.target.closest('.picdrop');
    if (z) z.classList.remove('over');
  });
  document.addEventListener('drop', (ev) => {
    const z = ev.target.closest && ev.target.closest('.picdrop');
    if (!z) return;
    ev.preventDefault(); z.classList.remove('over');
    takePic(ev.dataTransfer.files && ev.dataTransfer.files[0]);
  });

  document.addEventListener('click', (ev) => {
    const st = ev.target.closest('[data-state]');
    if (st) { setState(st.dataset.state); return render(); }
    const t = ev.target.closest('[data-tab], [data-card]');
    if (t) { const k = t.dataset.tab || t.dataset.card;
      S.open = (S.open === k) ? null : k; return render(); }
    const ams = ev.target.closest('[data-appmailsend]');
    if (ams) { S.app.emailSent = true; S.app.mailOpen = true; return render(); }
    const amo = ev.target.closest('[data-appmailopen]');
    if (amo) { S.app.mailOpen = true; return render(); }
    const ame = ev.target.closest('[data-appmailedit]');
    if (ame) { S.app.emailSent = false; return render(); }
    if (ev.target.closest('[data-act="clickmail"]')) {
      S.app.emailVerified = true; S.app.mailOpen = false; return render(); }
    if (ev.target.closest('[data-mailclose]') || ev.target.id === 'mailmodal') {
      S.app.mailOpen = false; return render(); }
    const ast = ev.target.closest('[data-appstart]');
    if (ast) { S.app.started = true; return render(); }
    const asu = ev.target.closest('[data-appsubmit]');
    if (asu) { S.app.submitted = true; S.open = 'apply'; return render(); }
    const ap2 = ev.target.closest('[data-apppic]');
    if (ap2) { S.app.pic = ap2.dataset.apppic; return render(); }
    const ok = ev.target.closest('[data-ok]');
    if (ok) { S.okd.add(ok.dataset.ok); S.open = null; return render(); }
    if (ev.target.closest('[data-confirm]')) { S.seen.add(S.open); S.open = null; return render(); }
    if (ev.target.closest('button[data-close]')) { S.open = null; return render(); }
    const an = ev.target.closest('[data-ans]');
    if (an) { const v = an.dataset.ansval;
      S[an.dataset.ans] = (v === 'true') ? true : (v === 'false') ? false : v;
      return render(); }
    const p = ev.target.closest('[data-set]');
    if (p) { const v = p.dataset.val;
      S[p.dataset.set] = (v === 'true') ? true : (v === 'false') ? false : v; return render(); }
    const pic = ev.target.closest('[data-pic]');
    if (pic) { S.mypic = pic.dataset.pic; return render(); }
    const mo = ev.target.closest('[data-motion]');
    if (mo) { S.mAns[S.open] = mo.dataset.motion; return render(); }
    const mv = ev.target.closest('[data-mval]');
    if (mv) { if (S.draft && S.draft.k === S.open && S.draft.to === mv.dataset.mval) {
        S.draft = null; return render(); }
      if (CURRENT[S.open] === mv.dataset.mval) { S.draft = null; return render(); }
      if (!S.draft || S.draft.k !== S.open) S.draft = { k: S.open, to: '', why: '' };
      S.draft.to = mv.dataset.mval; return render(); }
    const mj = ev.target.closest('[data-mjoinbtn]');
    if (mj && S.draft) {
      const f = document.querySelector('[data-mjoin]');
      const n = (f && f.value || '').trim();
      if (n) { S.draft.to = 'Fifteen drafting — ' + n + ' joins'; render(); }
      return;
    }
    const nm = ev.target.closest('[data-newmotion]');
    if (nm) { S.draft = { k: nm.dataset.newmotion, to: '', why: '' }; S.open = S.draft.k; return render(); }
    if (ev.target.closest('[data-dropmotion]')) { S.draft = null; return render(); }
    const wm = ev.target.closest('[data-withdrawmotion]');
    if (wm) { delete MOTIONS[wm.dataset.withdrawmotion];
      delete S.mAns[wm.dataset.withdrawmotion]; S.myMotion = null; return render(); }
    if (ev.target.closest('[data-putmotion]')) { S.draft = null; return render(); }
  });
  // ---- assembly-press (Ed, 2026-08-18) -----------------------------------
  // A constitutional change goes in by a **full ten-second hold**, and the
  // progress meter is the room itself: one member convenes onto a circle
  // around the button roughly every 700ms, and the motion is put at the
  // moment the assembly is complete. Release early and it disperses —
  // nothing sent, nothing spent. Under reduced motion the seats appear
  // without the spring; the stagger stays, because the ring IS the meter.
  const HOLD_MS = 10000;
  let assembly = null;
  function conveneAssembly(btn, k) {
    disperseAssembly();
    const r = btn.getBoundingClientRect();
    const el = document.createElement('div');
    el.id = 'assembly';
    el.style.left = (r.left + r.width / 2) + 'px';
    el.style.top = (r.top + r.height / 2) + 'px';
    const RADIUS = 88;
    ROSTER.forEach((p, i) => {
      const seat = document.createElement('span');
      seat.className = 'seat';
      const th = -Math.PI / 2 + (i / ROSTER.length) * 2 * Math.PI;
      seat.style.left = Math.round(Math.cos(th) * RADIUS) + 'px';
      seat.style.top = Math.round(Math.sin(th) * RADIUS) + 'px';
      seat.innerHTML = avHtml(p);
      el.appendChild(seat);
    });
    document.body.appendChild(el);
    const seats = [...el.children];
    const timers = seats.map((s2, i) =>
      setTimeout(() => s2.classList.add('in'), 80 + i * (HOLD_MS - 800) / seats.length));
    assembly = { el, timers, done: setTimeout(() => {
      el.classList.add('done');
      MOTIONS[k] = { to: S.draft.to, why: S.draft.why, judged: 0, mine: true, kind: 'constitutional' };
      S.myMotion = k; S.draft = null; assembly = null;
      setTimeout(() => { el.remove(); render(); }, 420);
    }, HOLD_MS) };
  }
  function disperseAssembly() {
    if (!assembly) return;
    assembly.timers.forEach(clearTimeout); clearTimeout(assembly.done);
    const el = assembly.el; assembly = null;
    el.classList.add('gone');
    setTimeout(() => el.remove(), 260);
  }
  document.addEventListener('pointerdown', (ev) => {
    const b = ev.target.closest('[data-holdmotion]');
    if (b && !b.disabled) { ev.preventDefault(); conveneAssembly(b, b.dataset.holdmotion); }
  });
  ['pointerup', 'pointercancel'].forEach((t) => document.addEventListener(t, disperseAssembly));

  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && S.open) { S.open = null; return render(); }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.closest('[data-tab]')) {
      ev.preventDefault(); ev.target.closest('[data-tab]').click();
    }
  });
  document.addEventListener('input', (ev) => {
    if (ev.target.closest && ev.target.closest('[data-appmail]')) {
      S.app.email = ev.target.value;
      S.app.emailSent = false; S.app.emailVerified = false;
      const sv = document.querySelector('[data-appmailsend]');
      if (sv) sv.disabled = !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.app.email) ||
        MEMBER_EMAILS.has(S.app.email.trim().toLowerCase());
      renderRail(); return; }
    if (ev.target.closest && ev.target.closest('[data-appname]')) {
      S.app.name = ev.target.value; renderRail(); return; }
    if (ev.target.closest && ev.target.closest('[data-apptext]')) {
      S.app.text = ev.target.textContent.trim(); renderRail(); return; }
    const ml = ev.target.closest && ev.target.closest('[data-motionlane]');
    if (ml) { if (!S.draft || S.draft.k !== S.open) S.draft = { k: S.open, to: '', why: '' };
      S.draft[ml.dataset.motionlane] = ml.textContent.trim();
      ml.classList.toggle('blank', !ml.textContent.trim());
      // the commit slot follows the route of what is now typed (329a):
      // "never" in the ending lane turns Propose into the assembly-press
      const slot = document.querySelector('[data-putmotion], [data-holdmotion]');
      if (slot && S.draft) slot.outerHTML = motionCommitHtml(card(S.draft.k));
      return; }
    if (ev.target.dataset.txt === 'myname') {
      S.myname = ev.target.value; renderRail();
      const btn = document.querySelector('[data-confirm]');
      if (btn && S.open) btn.disabled = !ready(card(S.open));
      return;
    }
    const r = ev.target.closest('[data-slide]');
    if (!r) return;
    S[r.dataset.slide] = +r.value;
    render();
    const again = document.querySelector('[data-slide="' + r.dataset.slide + '"]');
    if (again) again.focus();
  });
  addEventListener('resize', () => { fitBand(band); drawWire(wires, S.open); });
  addEventListener('scroll', () => drawWire(wires, S.open), true);

  renderDoc(); render();
})();
</script>
